window.nakliosGitAuthSetup = nakliosGitAuthSetup;

function capabilitySnapshot(appId){
  // fs is available if EITHER backend is connected AND the app isn't denied.
  // We don't pre-bind here — fsEnsurePermission runs on the first op call.
  const v = state.appPermissions[appId];
  const explicitlyDenied = v === 'denied' ||
    (v && typeof v === 'object' && v.granted === false);
  const app = APPS.find(item => item.id === appId);
  const manifestAllowsStorage = !app?.thirdParty || (app.permissions || []).includes('storage');
  const available = manifestAllowsStorage ? backendsAvailable() : [];
  const fsCap = available.length > 0 && !explicitlyDenied;
  const fsBackends = available.map(backendDescriptor).filter(Boolean);
  const fsBackend = appBoundBackend(appId);
  const isSystem = aiAppIsSystem(appId);
  // The host's agent-tier consumers (coding) report their configured model;
  // every other app runs the GP tier and reports the resolved GP model (Nano
  // when it's the zero-config default). Other apps with their own agent stacks
  // are migrated onto this split one by one.
  const aiModel = AI_HOST_AGENT_APPS.has(appId) ? aiSelectedModel() : aiResolveModel(false);
  const aiImageModel = aiSelectedImageModel();
  return {
    fs: fsCap,
    fsBackends,
    fsBackend,
    // System apps (non-third-party) may browse the whole store, not just their
    // own apps/<id>/ namespace — this is what powers the OS-level file manager.
    system: isSystem,
    sysFs: isSystem && fsCap,
    ai: aiCapabilityForApp(appId),
    aiModel: aiModel.id,
    aiModelLabel: aiModel.label,
    aiProvider: aiModel.runtime,
    aiLocal: aiModel.scope !== 'external',
    aiState: aiHost.state,
    aiImages: aiImageCapabilityForApp(appId),
    aiImageModel:aiImageModel.id,
    aiImageModelLabel:aiImageModel.label,
    aiImageProvider:aiImageModel.runtime,
    aiImageLocal:aiImageModel.scope !== 'external',
    aiImageState:aiImageHost.state,
    aiSearch: ragCapabilityForApp(appId),
    aiSearchState:ragHost.state,
    // Egress: a system app may reach blocked cross-origin hosts when the user has
    // configured a backend. Third-party apps never get it (isSystem gate).
    net: isSystem && egressConfigured(),
    netBackend: (isSystem && egressConfigured()) ? egressBackendLabel() : null,
  };
}

// Tell an iframe its current capabilities. Called on load and on changes.
function postCapabilities(iframe, appId){
  const snapshot = capabilitySnapshot(appId);
  const win = iframe.closest('.nw-window');
  if (win){
    win._capabilities = snapshot;
    refreshOpenAppInfo(win);
  }
  try {
    iframe.contentWindow.postMessage({
      type:'naklios:capabilities',
      ...snapshot,
    }, '*');
  } catch(_){}
}
function broadcastCapabilities(){
  pruneStaleFsSubscriptions();
  document.querySelectorAll('.nw-window iframe').forEach(iframe => {
    const appId = iframe.closest('.nw-window')?.dataset.id;
    if (appId) postCapabilities(iframe, appId);
  });
  Object.values(openWindows).forEach(win => {
    if (!win._app?.hostStorage) return;
    win._capabilities = capabilitySnapshot(win._app.id);
    refreshOpenAppInfo(win);
    try { win._onCapabilitiesChange?.(win._capabilities); } catch(_){}
  });
  // Re-paint the topbar chips on every backend state change. Defensive
  // try — chips might not be in DOM yet during early boot.
  try { renderTopbarChips(); } catch(_){}
}

// Filesystem subscriptions are app-scoped and backend-affine, just like
// reads and writes. Crate forwards its own onChange stream. Folder uses a
// two-second metadata poll because browser FSA has no widely available
// change observer yet.
const fsSubscriptions = new Map();
let fsSubscriptionCounter = 0;
let fsPollTimer = null;
let fsCrateWatchTarget = null;
let fsCrateWatchUnsubscribe = null;

function normaliseSubscriptionPath(appId, path){
  const raw = String(path || '');
  const segments = raw.split('/').filter(Boolean);
  if (segments.some(segment => segment === '.' || segment === '..')) {
    throw new Error('Unsafe subscription path');
  }
  const relative = segments.join('/');
  return {
    relative,
    full: relative ? `apps/${appId}/${relative}` : `apps/${appId}`,
  };
}

function subscriptionPathMatches(path, prefix){
  const normal = String(path || '').replace(/^\/+/, '').replace(/\/+$/, '');
  return normal === prefix || normal.startsWith(prefix + '/');
}

function appRelativeEventPath(appId, path){
  const normal = String(path || '').replace(/^\/+/, '');
  const prefix = `apps/${appId}/`;
  if (normal === `apps/${appId}`) return '';
  return normal.startsWith(prefix) ? normal.slice(prefix.length) : normal;
}

function postFsSubscriptionEvent(sub, event){
  const candidates = [event.path, event.from, event.to].filter(Boolean);
  if (!candidates.some(path => subscriptionPathMatches(path, sub.fullPrefix))) return;
  const clean = { op:event.op || 'update', backend:sub.backendId };
  if (event.path != null) clean.path = appRelativeEventPath(sub.appId, event.path);
  if (event.from != null) clean.from = appRelativeEventPath(sub.appId, event.from);
  if (event.to != null) clean.to = appRelativeEventPath(sub.appId, event.to);
  if (event.size != null) clean.size = event.size;
  if (event.source != null) clean.source = event.source;
  try {
    sub.source.postMessage({
      type:'naklios:fs:event',
      subscriptionId:sub.id,
      event:clean,
    }, '*');
  } catch(_){}
}

function ensureCrateSubscriptionWatcher(){
  if (fsCrateWatchTarget === state.crate) return;
  try { fsCrateWatchUnsubscribe?.(); } catch(_){}
  fsCrateWatchUnsubscribe = null;
  fsCrateWatchTarget = state.crate || null;
  if (!fsCrateWatchTarget) return;
  fsCrateWatchUnsubscribe = fsCrateWatchTarget.onChange(event => {
    for (const sub of fsSubscriptions.values()){
      if (sub.backendId === 'crate') postFsSubscriptionEvent(sub, event);
    }
  });
}

async function fsaSubscriptionSnapshot(fullPrefix){
  const snapshot = new Map();
  if (!state.fsHandle) return snapshot;
  const segments = fullPrefix.split('/').filter(Boolean);
  let dir = state.fsHandle;
  try {
    for (const segment of segments) dir = await dir.getDirectoryHandle(segment);
  } catch(_){
    // The watched path may be a file rather than a directory.
    try {
      dir = state.fsHandle;
      for (const segment of segments.slice(0, -1)) {
        dir = await dir.getDirectoryHandle(segment);
      }
      const handle = await dir.getFileHandle(segments.at(-1));
      const file = await handle.getFile();
      snapshot.set(fullPrefix, `${file.lastModified}:${file.size}`);
    } catch(_){}
    return snapshot;
  }
  async function walk(handle, prefix){
    for await (const [name, child] of handle.entries()){
      const path = prefix ? `${prefix}/${name}` : name;
      if (child.kind === 'directory'){
        snapshot.set(path + '/', 'directory');
        await walk(child, path);
      } else {
        try {
          const file = await child.getFile();
          snapshot.set(path, `${file.lastModified}:${file.size}`);
        } catch(_){}
      }
    }
  }
  await walk(dir, fullPrefix);
  return snapshot;
}

function diffFsaSubscriptionSnapshots(previous, current){
  const events = [];
  for (const [path, fingerprint] of current){
    if (!previous.has(path)) events.push({ op:'create', path, source:'external' });
    else if (previous.get(path) !== fingerprint) events.push({ op:'update', path, source:'external' });
  }
  for (const [path] of previous){
    if (!current.has(path)) events.push({ op:'delete', path, source:'external' });
  }
  return events;
}

async function pollFsaSubscriptions(){
  for (const sub of fsSubscriptions.values()){
    if (sub.backendId !== 'fsa' || sub.polling) continue;
    if (!BACKENDS.fsa.isConnected()){
      endFsSubscription(sub.id, 'Folder disconnected');
      continue;
    }
    sub.polling = true;
    try {
      const current = await fsaSubscriptionSnapshot(sub.fullPrefix);
      const events = diffFsaSubscriptionSnapshots(sub.snapshot || new Map(), current);
      sub.snapshot = current;
      events.forEach(event => postFsSubscriptionEvent(sub, event));
    } finally {
      sub.polling = false;
    }
  }
}

function ensureFsaSubscriptionPoll(){
  if (fsPollTimer || !Array.from(fsSubscriptions.values()).some(sub => sub.backendId === 'fsa')) return;
  fsPollTimer = setInterval(() => { void pollFsaSubscriptions(); }, 2000);
}

function stopUnusedFsaSubscriptionPoll(){
  if (!fsPollTimer || Array.from(fsSubscriptions.values()).some(sub => sub.backendId === 'fsa')) return;
  clearInterval(fsPollTimer);
  fsPollTimer = null;
}

function endFsSubscription(id, reason){
  const sub = fsSubscriptions.get(id);
  if (!sub) return;
  fsSubscriptions.delete(id);
  try {
    sub.source.postMessage({
      type:'naklios:fs:subscription-ended',
      subscriptionId:id,
      reason,
    }, '*');
  } catch(_){}
  stopUnusedFsaSubscriptionPoll();
}

function fsHostUnsubscribe(source, id){
  const sub = fsSubscriptions.get(id);
  if (!sub || sub.source !== source) return false;
  fsSubscriptions.delete(id);
  stopUnusedFsaSubscriptionPoll();
  return true;
}

function fsHostUnsubscribeSource(source){
  for (const [id, sub] of fsSubscriptions){
    if (sub.source === source) fsSubscriptions.delete(id);
  }
  stopUnusedFsaSubscriptionPoll();
}

function pruneStaleFsSubscriptions(){
  ensureCrateSubscriptionWatcher();
  for (const [id, sub] of fsSubscriptions){
    if (appBoundBackend(sub.appId) !== sub.backendId) {
      endFsSubscription(id, 'Storage backend changed or disconnected');
    }
  }
}

async function fsHostSubscribe(source, msg, appId){
  const backendId = await fsEnsurePermission(appId);
  if (!backendId) throw new Error('Permission denied');
  if (msg.backend && msg.backend !== backendId) {
    throw new Error('Storage backend changed before the subscription was created');
  }
  const path = normaliseSubscriptionPath(appId, msg.path);
  const id = `s${++fsSubscriptionCounter}_${Date.now()}`;
  const sub = {
    id,
    source,
    appId,
    backendId,
    relativePath:path.relative,
    fullPrefix:path.full,
    snapshot:null,
    polling:false,
  };
  if (backendId === 'fsa') sub.snapshot = await fsaSubscriptionSnapshot(path.full);
  fsSubscriptions.set(id, sub);
  if (backendId === 'crate') ensureCrateSubscriptionWatcher();
  else ensureFsaSubscriptionPoll();
  return id;
}

// ── TOPBAR BACKEND CHIPS ──────────────────────────────────────────────
// Two pill-buttons in the header showing the current state of each
// backend (Folder / Crate). Clicking opens a contextMenu-style popover
// with state-appropriate actions: Connect / Lock / Unlock / Disconnect.
// State changes propagate via broadcastCapabilities() → renderTopbarChips().

// Compute the visual state of each chip from current backend state.
// Returns one of: 'disconnected' | 'pending' | 'locked' | 'active'.
function fsaChipState(){
  if (state.fsHandle) return 'active';
  if (window._fsPendingHandle) return 'pending';
  return 'disconnected';
}
function crateChipState(){
  if (state.crate) return 'active';
  if (state.crateLocked) return 'locked';
  return 'disconnected';
}

function renderTopbarChips(){
  const fsaChip   = document.getElementById('fsa-chip');
  const crateChip = document.getElementById('crate-chip');
  if (!fsaChip || !crateChip) return;

  // FSA chip
  const fsaState = fsaChipState();
  fsaChip.className = 'topbar-chip' + (fsaState !== 'disconnected' ? ' ' + fsaState : '');
  const fsaLabel = fsaState === 'active' ? (state.fsFolderName || 'Folder')
                : fsaState === 'pending' ? (state.fsFolderName ? state.fsFolderName + ' (re-grant)' : 'Re-grant')
                : 'Folder';
  fsaChip.querySelector('.topbar-chip-label').textContent = fsaLabel;
  fsaChip.title = fsaState === 'active'   ? `Local folder: ${state.fsFolderName || ''}`
                : fsaState === 'pending'  ? 'Folder permission needs re-grant'
                                          : 'No local folder connected';
  fsaChip.setAttribute('aria-label', fsaState === 'active'
    ? `Folder connected: ${state.fsFolderName || 'Folder'}`
    : fsaState === 'pending'
      ? `Folder needs permission: ${state.fsFolderName || 'Folder'}`
      : 'Folder — not connected');

  // Crate chip
  const crState = crateChipState();
  crateChip.className = 'topbar-chip' + (crState !== 'disconnected' ? ' ' + crState : '');
  const crLabel = crState === 'active' ? (state.crateBucketName || 'Crate')
                : crState === 'locked' ? (state.crateBucketName ? state.crateBucketName + ' 🔒' : 'Locked')
                : 'Crate';
  crateChip.querySelector('.topbar-chip-label').textContent = crLabel;
  crateChip.title = crState === 'active' ? `Crate (unlocked): ${state.crateBucketName || ''}`
                  : crState === 'locked' ? `Crate locked: ${state.crateBucketName || ''}`
                                         : 'No Crate connected';
  crateChip.setAttribute('aria-label', crState === 'active'
    ? `Crate connected: ${state.crateBucketName || 'Crate'}`
    : crState === 'locked'
      ? `Crate locked: ${state.crateBucketName || 'Crate'}`
      : 'Crate — not connected');
}

// FSA chip click → state-appropriate menu via the existing
// showContextMenu() helper. Positioned below the chip.
function openFsaChipMenu(){
  closeContextMenu(); // in case it's already open from a different anchor
  const chip = document.getElementById('fsa-chip');
  if (!chip) return;
  const r = chip.getBoundingClientRect();
  const items = [];
  const s = fsaChipState();
  if (s === 'active'){
    items.push({ label: '📁 Open Settings…', onClick: () => openSettings() });
    items.push({ separator: true });
    items.push({ label: 'Disconnect folder…', onClick: () => fsInteractiveDisconnect(), danger: true });
  } else if (s === 'pending'){
    items.push({ label: 'Re-grant access…', onClick: async () => { await fsRegrantPending(); } });
    items.push({ separator: true });
    items.push({ label: 'Disconnect folder…', onClick: () => fsInteractiveDisconnect(), danger: true });
  } else {
    items.push({ label: 'Connect folder…', onClick: () => fsConnect() });
  }
  // Position below the chip, left-aligned.
  showContextMenu(r.left, r.bottom + 6, items);
}

function openCrateChipMenu(){
  closeContextMenu();
  const chip = document.getElementById('crate-chip');
  if (!chip) return;
  const r = chip.getBoundingClientRect();
  const items = [];
  const s = crateChipState();
  if (s === 'active'){
    items.push({ label: '🔒 Lock now', onClick: () => crateLock() });
    items.push({ label: '☁️ Open Settings…', onClick: () => openSettings() });
    items.push({ separator: true });
    items.push({ label: 'Disconnect Crate…', onClick: () => crateInteractiveDisconnect(), danger: true });
  } else if (s === 'locked'){
    items.push({ label: '🔓 Unlock…', onClick: () => crateInteractiveUnlock() });
    items.push({ separator: true });
    items.push({ label: 'Disconnect Crate…', onClick: () => crateInteractiveDisconnect(), danger: true });
  } else {
    items.push({ label: 'Use .crate-creds file…', onClick: () => crateInteractiveConnectFile() });
    items.push({ label: 'Enter bucket details manually…', onClick: () => crateInteractiveManual() });
    items.push({ separator: true });
    items.push({ label: '☁️ Open Settings…', onClick: () => openSettings() });
  }
  showContextMenu(r.left, r.bottom + 6, items);
}

// Wire the chip click handlers. Done once on first DOM-ready; chips
// themselves are persistent so we don't need to re-bind on re-render.
function bindTopbarChips(){
  document.getElementById('fsa-chip')?.addEventListener('click', openFsaChipMenu);
  document.getElementById('crate-chip')?.addEventListener('click', openCrateChipMenu);
}

window.addEventListener('message', async e => {
  if (!knownIframes.has(e.source)) return;
  const msg = e.data;
  if (!msg || typeof msg !== 'object') return;
  const findIframe = () => Array.from(document.querySelectorAll('.nw-window iframe'))
    .find(f => f.contentWindow === e.source);
  const findWin = () => { const f = findIframe(); return f ? f.closest('.nw-window') : null; };
  const getAppId = () => findWin()?.dataset.id || null;
  if (msg.type === 'naklios:ready'){
    const win = findWin();
    if (win && msg.features && typeof msg.features === 'object') {
      win._sdkFeatures = {
        beforeCloseAck:msg.features.beforeCloseAck === true,
        fsSubscribe:msg.features.fsSubscribe === true,
        aiStream:msg.features.aiStream === true,
        aiImages:msg.features.aiImages === true,
      };
    }
    if (win){
      win._sdkReady = true;
      deliverPendingFileGrants(win);
    }
    markIframeLaunchPhase(win, 'ready');
  } else if (msg.type === 'naklios:beforeclose-ready'){
    const win = findWin();
    if (win?._closing && msg.requestId === win._closeRequestId) finalizeCloseWindow(win);
  } else if (msg.type === 'naklios:close'){
    const win = findWin();
    if (win) closeWindow(win);
  } else if (msg.type === 'naklios:title' && typeof msg.title === 'string'){
    const win = findWin();
    if (win) win.querySelector('.nw-title').textContent = msg.title;
  } else if (msg.type === 'naklios:theme-request'){
    // App is asking for the current theme (e.g., late-loading app missed the load event)
    const t = THEMES.find(x => x.id === state.theme) || THEMES[0];
    try { e.source.postMessage({ type:'naklios:theme', theme:t.id, colors:t.colors, mood:t.mood }, '*'); } catch(_){}
  } else if (msg.type === 'naklios:capabilities-request'){
    const iframe = findIframe(); const appId = getAppId();
    if (iframe && appId) postCapabilities(iframe, appId);
  } else if (msg.type === 'naklios:open-settings'){
    openSettings(typeof msg.section === 'string' ? msg.section : 'storage');
  } else if (typeof msg.type === 'string' && msg.type.startsWith('naklios:file:')){
    const reply = { type:'naklios:file:reply', requestId:msg.requestId };
    try {
      const appId = getAppId();
      if (!appId) throw new Error('Unknown app');
      const op = msg.type.slice('naklios:file:'.length);
      if (op === 'openWith') reply.result = await fileHostOpenWith(e.source, msg, appId);
      else if (op === 'read' || op === 'write') reply.result = await fileHostHandle(e.source, msg, appId, op);
      else if (op === 'release') {
        const grant = fileGrants.get(String(msg.token || ''));
        if (grant?.targetSource === e.source) fileGrants.delete(grant.token);
        reply.result = true;
      } else throw new Error('Unknown file handoff operation');
    } catch (err){
      reply.error = String(err?.message || err);
    }
    if (msg.requestId) {
      try { e.source.postMessage(reply, '*'); } catch(_){}
    }
  } else if (msg.type === 'naklios:ai:chat'){
    const appId = getAppId();
    if (appId) void aiHostSubmit(e.source, msg, appId);
  } else if (msg.type === 'naklios:ai:image'){
    const appId = getAppId();
    if (appId) void aiHostSubmitImage(e.source, msg, appId);
  } else if (msg.type === 'naklios:ai:cancel'){
    aiHostCancel(e.source, msg.requestId);
  } else if (msg.type === 'naklios:net:info'){
    const reply = { type:'naklios:net:reply', requestId: msg.requestId };
    try { reply.result = egressConfigured() ? { backend: egressBackendLabel(), roams: egressBackendLabel()==='worker' } : null; }
    catch(err){ reply.error = String(err?.message || err); }
    if (msg.requestId) { try { e.source.postMessage(reply, '*'); } catch(_){} }
  } else if (msg.type === 'naklios:net:fetch'){
    const reply = { type:'naklios:net:reply', requestId: msg.requestId };
    try {
      const appId = getAppId();
      if (!appId) throw new Error('Unknown app');
      if (!aiAppIsSystem(appId)) throw new Error('Egress is a system-app capability');
      if (!egressConfigured()) { const er = new Error('No egress backend configured'); er.code = 'ENOEGRESS'; throw er; }
      reply.result = await egressFetch({ url: msg.url, method: msg.method, headers: msg.headers, body: msg.body });
    } catch(err){ reply.error = String(err?.message || err); }
    if (msg.requestId) { try { e.source.postMessage(reply, '*'); } catch(_){} }
  } else if (typeof msg.type === 'string' && msg.type.startsWith('naklios:fs:')){
    const reply = { type: 'naklios:fs:reply', requestId: msg.requestId };
    try {
      const appId = getAppId();
      if (!appId) throw new Error('Unknown app');
      const op = msg.type.slice('naklios:fs:'.length);
      if (op === 'selectBackend') reply.result = await fsHostSelectBackend(appId, msg.backend);
      else if (op === 'subscribe') reply.result = await fsHostSubscribe(e.source, msg, appId);
      else if (op === 'unsubscribe') reply.result = fsHostUnsubscribe(e.source, msg.subscriptionId);
      else if (op === 'list') reply.result = await fsHostList(msg, appId);
      else reply.result = await fsHostHandle(msg, op, appId);
    } catch (err){
      reply.error = String(err?.message || err);
    }
    if (msg.requestId) {
      try { e.source.postMessage(reply, '*'); } catch(_){}
    }
  } else if (typeof msg.type === 'string' && msg.type.startsWith('naklios:sysfs:')){
    // System-scoped fs — whole-store access for same-origin system apps only.
    const reply = { type: 'naklios:fs:reply', requestId: msg.requestId };
    try {
      const appId = getAppId();
      if (!appId) throw new Error('Unknown app');
      const op = msg.type.slice('naklios:sysfs:'.length);
      if (op === 'list') reply.result = await fsHostSysList(msg, appId);
      else reply.result = await fsHostSysHandle(msg, op, appId);
    } catch (err){
      reply.error = String(err?.message || err);
    }
    if (msg.requestId) {
      try { e.source.postMessage(reply, '*'); } catch(_){}
    }
  } else if (typeof msg.type === 'string' && msg.type.startsWith('naklios:rag:')){
    const reply = { type:'naklios:rag:reply', requestId:msg.requestId };
    try {
      const appId = getAppId();
      if (!appId) throw new Error('Unknown app');
      const op = msg.type.slice('naklios:rag:'.length);
      if (op === 'search') reply.result = await ragHostSearch(e.source, msg, appId);
      else if (op === 'status') reply.result = ragIndexStats();
      else throw new Error('Unknown semantic search operation');
    } catch (err){
      reply.error = String(err?.message || err);
    }
    if (msg.requestId) {
      try { e.source.postMessage(reply, '*'); } catch(_){}
    }
  }
});

function recordRecent(appId){
  state.layout.recent = (state.layout.recent || []).filter(x => x !== appId);
  state.layout.recent.unshift(appId);
  if (state.layout.recent.length > 12) state.layout.recent.length = 12;
  saveLayout();
}

function openApp(app, options = {}){
  recordRecent(app.id);
  if (openWindows[app.id]) { focusWindow(openWindows[app.id]); return; }
  // System apps depend on the host bridge and must remain inside NakliOS
  // even when the desktop is in Basic mode.
  if (app.kind === 'system') return spawnIframeWindow(app, options);
  const m = effectiveMode(app);
  if (m === 'immersive') {
    if (app.kind === 'classic') return spawnInlineWindow(app);
    if (app.iframeable === false) return window.open(app.url, '_blank', 'noopener');
    return spawnIframeWindow(app, options);
  }
  // Basic
  if (app.kind === 'classic') return spawnInlineWindow(app);
  return window.open(app.url, '_blank', 'noopener');
}

// A guided spotlight tour replaces the old welcome modal: new users land
// straight on the desktop and a coach-mark walks them through the pieces
// they'd otherwise have to discover. Ported from Slate's tour. Replayable
// from Settings → About. Skipping still marks it done (no re-nag).
const TOUR_KEY = 'nakliOS.tour.v1';
const TOUR_STEPS = [
  { target:'#spotlight-btn', title:'Welcome to NakliOS',
    body:'Your private browser desktop — every tool runs in this tab and nothing leaves your device. Press ⌘K (or click here) to find any app by name, tag, or plain description.' },
  { target:'#icon-area', title:'Grouped by task',
    body:'Your tools are organised into folders like Create & Convert, Work & Build, and Play. Click a folder to open it, or an app to launch it in a window.' },
  { target:'#fsa-chip', title:'Storage stays optional',
    body:'Connect a Folder, or set up an encrypted Crate for end-to-end multi-device sync — only when an app needs to save. Until then nothing is written anywhere. Settings → Storage walks you through Crate.' },
  { target:'#nw-dock', title:'Essentials on the dock',
    body:'Your most-used tools sit on the dock for one-click access. Drag them to reorder whenever you like.' },
  { target:'#settings-btn', title:'Make it yours',
    body:'Themes, storage, AI, and adding your own apps all live in Settings. You can replay this tour from there anytime.' },
];

let tourLayer = null, tourIndex = 0, tourSteps = [], tourPrevFocus = null;

function tourTargetEl(step){
  return document.querySelector(step.target) || document.getElementById('icon-grid') || document.body;
}
function tourTargetVisible(step){
  const el = document.querySelector(step.target);
  // Keep any present, non-hidden target. Size is read live at render time, so
  // chrome that fills in after boot (e.g. the dock) still gets its own step.
  return !!el && getComputedStyle(el).display !== 'none';
}
function positionTour(){
  if (!tourLayer) return;
  const el = tourTargetEl(tourSteps[tourIndex]);
  const spot = tourLayer.querySelector('.nw-tour-spotlight');
  const card = tourLayer.querySelector('.nw-tour-card');
  const r = el.getBoundingClientRect();
  const pad = 6, vw = window.innerWidth, vh = window.innerHeight;
  spot.style.top = Math.max(4, r.top - pad) + 'px';
  spot.style.left = Math.max(4, r.left - pad) + 'px';
  spot.style.width = Math.min(vw - 8, r.width + pad * 2) + 'px';
  spot.style.height = Math.min(vh - 8, r.height + pad * 2) + 'px';
  const gap = 16, margin = 12, cw = card.offsetWidth, ch = card.offsetHeight;
  let cTop, cLeft = r.left;
  if (r.bottom + gap + ch <= vh - margin) cTop = r.bottom + gap;
  else if (r.top - gap - ch >= margin) cTop = r.top - gap - ch;
  else cTop = vh - ch - margin;
  cLeft = Math.min(Math.max(margin, cLeft), vw - cw - margin);
  cTop = Math.min(Math.max(margin, cTop), vh - ch - margin);
  card.style.top = cTop + 'px';
  card.style.left = cLeft + 'px';
}
function renderTourStep(){
  const step = tourSteps[tourIndex];
  tourTargetEl(step).scrollIntoView({ block:'nearest', inline:'nearest' });
  const card = tourLayer.querySelector('.nw-tour-card');
  card.querySelector('.nw-tour-progress').textContent = `Quick tour · ${tourIndex + 1} of ${tourSteps.length}`;
  card.querySelector('h2').textContent = step.title;
  card.querySelector('.nw-tour-body').textContent = step.body;
  card.querySelector('.nw-tour-back').disabled = tourIndex === 0;
  const next = card.querySelector('.nw-tour-next');
  next.textContent = tourIndex === tourSteps.length - 1 ? 'Finish' : 'Next';
  card.style.visibility = 'hidden';
  requestAnimationFrame(() => { positionTour(); card.style.visibility = 'visible'; next.focus(); });
}
function tourNext(){
  if (tourIndex < tourSteps.length - 1){ tourIndex++; renderTourStep(); }
  else finishTour();
}
function tourKeydown(event){
  if (!tourLayer) return;
  event.stopPropagation();
  if (event.key === 'Escape'){ event.preventDefault(); finishTour(); }
  else if (event.key === 'ArrowRight'){ event.preventDefault(); tourNext(); }
  else if (event.key === 'ArrowLeft'){ event.preventDefault(); if (tourIndex > 0){ tourIndex--; renderTourStep(); } }
  else if (event.key === 'Tab'){
    event.preventDefault();
    const btns = [...tourLayer.querySelectorAll('button:not([disabled])')];
    if (!btns.length) return;
    let i = btns.indexOf(document.activeElement);
    i = event.shiftKey ? (i <= 0 ? btns.length - 1 : i - 1) : (i >= btns.length - 1 ? 0 : i + 1);
    btns[i].focus();
  }
}
function closeTour(){
  if (!tourLayer) return;
  const layer = tourLayer; tourLayer = null;
  window.removeEventListener('resize', positionTour);
  document.removeEventListener('keydown', tourKeydown, true);
  layer.remove();
  if (tourPrevFocus && tourPrevFocus.isConnected) tourPrevFocus.focus();
  tourPrevFocus = null;
}
function finishTour(){ localStorage.setItem(TOUR_KEY, '1'); closeTour(); }
function startTour({ force = false } = {}){
  if (tourLayer) return false;
  if (!force && localStorage.getItem(TOUR_KEY)) return false;
  tourSteps = TOUR_STEPS.filter(tourTargetVisible);
  if (!tourSteps.length) return false;
  tourPrevFocus = document.activeElement;
  tourIndex = 0;
  tourLayer = document.createElement('div');
  tourLayer.className = 'nw-tour-layer';
  tourLayer.innerHTML = `
    <div class="nw-tour-spotlight" aria-hidden="true"></div>
    <section class="nw-tour-card" role="dialog" aria-modal="true" aria-labelledby="nw-tour-title" aria-describedby="nw-tour-body">
      <div class="nw-tour-progress"></div>
      <h2 id="nw-tour-title"></h2>
      <p class="nw-tour-body" id="nw-tour-body" aria-live="polite"></p>
      <div class="nw-tour-actions">
        <button class="nw-tour-btn nw-tour-skip" type="button">Skip</button>
        <button class="nw-tour-btn nw-tour-back" type="button">Back</button>
        <button class="nw-tour-btn primary nw-tour-next" type="button">Next</button>
      </div>
    </section>`;
  (document.getElementById('overlay-root') || document.body).appendChild(tourLayer);
  tourLayer.querySelector('.nw-tour-skip').addEventListener('click', finishTour);
  tourLayer.querySelector('.nw-tour-back').addEventListener('click', () => { if (tourIndex > 0){ tourIndex--; renderTourStep(); } });
  tourLayer.querySelector('.nw-tour-next').addEventListener('click', tourNext);
  window.addEventListener('resize', positionTour);
  document.addEventListener('keydown', tourKeydown, true);
  renderTourStep();
  return true;
}
// New profiles only — a returning user isn't re-onboarded. The dock renders
// async and is `display:none` until it has items, so wait for it to settle
// (populated on desktop, or staying hidden on mobile) before the filter runs.
function maybeStartFirstRunTour(){
  if (HAD_EXISTING_PROFILE || localStorage.getItem(TOUR_KEY)) return;
  let waited = 0;
  const tick = () => {
    // Don't trust the mobile/dock signal until the viewport has a real
    // measurement — a transient 0-width during boot would falsely read as
    // mobile and drop the dock step.
    const measured = window.innerWidth > 0;
    const dock = document.getElementById('nw-dock');
    const dockReady = !!dock && dock.children.length > 0;
    const mobile = measured && document.body.classList.contains('is-mobile');
    if ((measured && (dockReady || mobile)) || waited >= 3000){ startTour(); return; }
    waited += 120;
    setTimeout(tick, 120);
  };
  setTimeout(tick, 400);
}

// SPOTLIGHT
// ════════════════════════════════════════════════════════════════════
let spotlightOpen = false;

// ════════════════════════════════════════════════════════════════════
// FOLDERS — open as a centered popover with backdrop
// ════════════════════════════════════════════════════════════════════
let folderOpenId = null;

function openFolder(folder){
  closeFolder();
  folderOpenId = folder.id;
  const root = document.getElementById('overlay-root');
  const wrap = document.createElement('div');
  wrap.className = 'nw-backdrop';
  wrap.id = 'folder-backdrop';

  // Apps that have been moved out are excluded
  const movedOut = new Set(state.layout.unfoldered || []);
  const apps = folder.apps
    .map(aid => APPS.find(a => a.id === aid))
    .filter(Boolean)
    .filter(a => !movedOut.has(a.id));

  const appsHTML = apps.map(app => {
    const bgVar = app.bg || 'brand';
    const bgColor = `color-mix(in srgb, var(--${bgVar}) 22%, var(--panel))`;
    return `
      <button class="nw-folder-app" data-app-id="${app.id}" title="${_dlgEscape(app.description || '')} — drag out to put on desktop">
        <div class="nw-folder-app-tile" style="background:${bgColor}; border-color:color-mix(in srgb, var(--${bgVar}) 30%, var(--line));">
          ${app.svg ? `<svg class="nw-icon-svg" viewBox="0 0 24 24" aria-hidden="true">${app.svg}</svg>` : _dlgEscape(app.glyph || app.name.charAt(0))}
        </div>
        <div class="nw-folder-app-label">${_dlgEscape(app.name)}</div>
      </button>`;
  }).join('');

  wrap.innerHTML = `
    <div class="nw-folder-popover" role="dialog" aria-label="${_dlgEscape(folder.name)} folder">
      <div class="nw-folder-head">
        <div class="nw-folder-head-glyph">${_dlgEscape(folder.glyph)}</div>
        <div class="nw-folder-head-title">${_dlgEscape(folder.name)}
          <span class="nw-folder-head-count">  ·  ${apps.length} apps  ·  right-click or drag out to move to desktop</span>
        </div>
        <button class="nw-folder-close" aria-label="Close folder">✕</button>
      </div>
      <div class="nw-folder-grid">${appsHTML}</div>
    </div>
  `;
  root.appendChild(wrap);

  wrap.querySelectorAll('.nw-folder-app').forEach(btn => {
    const app = APPS.find(a => a.id === btn.dataset.appId);
    if (!app) return;

    // Drag-out gesture: down → if pointer leaves popover → close popover + ghost drag → drop sets desktop position
    let wasDragged = false;
    btn.addEventListener('pointerdown', e => {
      if (e.button !== 0) return;
      e.preventDefault();
      const startX = e.clientX, startY = e.clientY;
      let dragging = false;
      let ghost = null;
      let popClosed = false;

      function overDock(ev){
        const dock = document.getElementById('nw-dock');
        if (!dock) return false;
        const r = dock.getBoundingClientRect();
        // Generous hit-area: 12px halo around the dock so it's easy to drop on
        return ev.clientX >= r.left - 12 && ev.clientX <= r.right + 12
            && ev.clientY >= r.top - 12 && ev.clientY <= r.bottom + 12;
      }
      const onMove = ev => {
        const dx = ev.clientX - startX, dy = ev.clientY - startY;
        if (!dragging && Math.hypot(dx, dy) > 6){
          dragging = true;
          ghost = document.createElement('div');
          ghost.className = 'nw-drag-ghost';
          if (app.svg) ghost.innerHTML = `<svg class="nw-icon-svg" viewBox="0 0 24 24" aria-hidden="true">${app.svg}</svg>`;
          else ghost.textContent = app.glyph || app.name.charAt(0);
          document.body.appendChild(ghost);
        }
        if (dragging){
          ghost.style.left = ev.clientX + 'px';
          ghost.style.top = ev.clientY + 'px';
          if (!popClosed){
            const pop = document.querySelector('.nw-folder-popover');
            if (pop){
              const r = pop.getBoundingClientRect();
              const outside = ev.clientX < r.left || ev.clientX > r.right || ev.clientY < r.top || ev.clientY > r.bottom;
              if (outside){
                popClosed = true;
                closeFolder();
              }
            }
          }
          // Visual hint: highlight the dock when the cursor is over it
          const dock = document.getElementById('nw-dock');
          if (dock) dock.classList.toggle('is-drop-target', overDock(ev));
        }
      };
      const onUp = ev => {
        document.removeEventListener('pointermove', onMove);
        document.removeEventListener('pointerup', onUp);
        document.removeEventListener('pointercancel', onUp);
        document.getElementById('nw-dock')?.classList.remove('is-drop-target');
        if (!dragging) return;
        wasDragged = true;
        ghost?.remove();
        if (overDock(ev)){
          // Drop on dock → pin this app
          pinItem(app.id);
        } else {
          // Drop in icon-area? Calculate grid position
          const area = document.getElementById('icon-area').getBoundingClientRect();
          const inArea = ev.clientX >= area.left && ev.clientX <= area.right
                      && ev.clientY >= area.top && ev.clientY <= area.bottom;
          if (inArea){
            const { cols, rows } = getGridDims();
            const x = Math.max(0, Math.min(cols - 1, Math.round((ev.clientX - area.left - GRID_PAD) / ICON_W)));
            const y = Math.max(0, Math.min(rows - 1, Math.round((ev.clientY - area.top - GRID_PAD) / ICON_H)));
            state.layout.unfoldered = state.layout.unfoldered || [];
            if (!state.layout.unfoldered.includes(app.id)) state.layout.unfoldered.push(app.id);
            state.layout.positions[app.id] = {x, y};
            saveLayout();
            renderIcons();
          } else if (!popClosed){
            // Cancelled drag inside popover — no-op
          }
        }
        // Suppress the click event that follows
        setTimeout(() => { wasDragged = false; }, 50);
      };
      document.addEventListener('pointermove', onMove);
      document.addEventListener('pointerup', onUp);
      document.addEventListener('pointercancel', onUp);
    });

    btn.addEventListener('click', () => {
      if (wasDragged) return;
      closeFolder();
      openApp(app);
    });

    btn.addEventListener('contextmenu', e => {
      e.preventDefault();
      showContextMenu(e.clientX, e.clientY, [
        { label: 'Move to desktop', onClick: () => { closeFolder(); moveAppToDesktop(app.id); } },
        { separator:true },
        { label: isPinned(app.id) ? 'Unpin from dock' : 'Pin to dock',
          onClick: () => isPinned(app.id) ? unpinItem(app.id) : pinItem(app.id) },
      ]);
    });
  });
  wrap.querySelector('.nw-folder-close').addEventListener('click', closeFolder);
  wrap.addEventListener('click', e => { if (e.target === wrap) closeFolder(); });
}

function closeFolder(){
  const w = document.getElementById('folder-backdrop');
  if (w) w.remove();
  folderOpenId = null;
}

function openSpotlight(){
  if (spotlightOpen) return;
  spotlightOpen = true;
  const root = document.getElementById('overlay-root');
  const wrap = document.createElement('div');
  wrap.className = 'nw-backdrop';
  wrap.innerHTML = `
    <div class="nw-spotlight" role="dialog" aria-label="Search apps">
      <input type="text" id="spot-input" role="combobox" aria-autocomplete="list"
        aria-controls="spot-list" aria-expanded="true"
        placeholder="Search apps by name, tag, or description — or describe what you're looking for…" autocomplete="off" autocapitalize="off" spellcheck="false">
      <div class="nw-spot-list" id="spot-list" role="listbox" aria-label="Matching apps"></div>
    </div>
  `;
  root.appendChild(wrap);
  const input = wrap.querySelector('#spot-input');
  const list = wrap.querySelector('#spot-list');
  let active = 0;
  // Semantic hits over the connected backend's index. Apps match by keyword;
  // this section adds meaning-based file matches below them.
  const semantic = { state:'idle', hits:[], token:0, timer:null };
  // The rendered rows (apps + semantic section) and the subset that arrow keys
  // and Enter can land on — so keyboard reaches file hits, not just apps.
  let rows = [];
  let navIndices = [];

  function rank(q){
    if (!q) {
      const recentIds = state.layout.recent || [];
      const recents = recentIds.map(id => APPS.find(a => a.id === id)).filter(Boolean);
      if (recents.length) return recents.slice(0, 8);
      return APPS.slice(0, 8);
    }
    const ql = q.toLowerCase();
    const scored = [];
    for (const app of APPS){
      const name = app.name.toLowerCase();
      const desc = (app.description || '').toLowerCase();
      const tags = (app.tags || []).join(' ').toLowerCase();
      let s = 0;
      if (name.startsWith(ql)) s = 100;
      else if (name.includes(ql)) s = 60;
      else if (tags.includes(ql)) s = 40;
      else if (desc.includes(ql)) s = 20;
      if (s > 0) scored.push({app, s});
    }
    scored.sort((a, b) => b.s - a.s);
    return scored.slice(0, 12).map(x => x.app);
  }

  // One ordered row list: apps first, then the semantic section (enable offer /
  // live status / meaning hits / connect-storage hint). Everything except the
  // status line is a navigable row.
  function buildRows(){
    const q = input.value.trim();
    const list = rank(q).map(app => ({ type:'app', app }));
    if (!q) return list;
    if (backendsAvailable().length){
      const decision = ragReadDecision();
      if (decision?.granted === false){
        // user declined — no semantic section
      } else if (decision?.granted !== true){
        list.push({ type:'enable' });
      } else if (semantic.state === 'searching' || semantic.state === 'indexing'){
        list.push({ type:'status', text:'Searching meaning…' });
      } else if (semantic.state === 'ready'){
        for (const hit of semantic.hits) list.push({ type:'semantic', hit });
      }
    } else {
      // UX-4: a meaning query with no backend used to dead-end at "No matches".
      list.push({ type:'connect' });
    }
    return list;
  }

  function rowHTML(row, i, isActive){
    const attrs = `id="spot-row-${i}" data-row-idx="${i}" role="option" aria-selected="${isActive}"`;
    const sel = isActive ? 'is-active' : '';
    if (row.type === 'app'){
      const app = row.app;
      return `<div class="nw-spot-item ${sel}" ${attrs}>
        <div class="nw-spot-glyph" style="background:color-mix(in srgb, var(--${app.bg || 'brand'}) 22%, var(--row));">${app.svg ? `<svg class="nw-icon-svg" viewBox="0 0 24 24" aria-hidden="true">${app.svg}</svg>` : _dlgEscape(app.glyph || app.name.charAt(0))}</div>
        <div style="flex:1; min-width:0;">
          <div class="nw-spot-name">${_dlgEscape(app.name)}</div>
          <div class="nw-spot-desc">${_dlgEscape((app.description || '').replace(/&mdash;/g,'—').replace(/&rarr;/g,'→').replace(/&times;/g,'×'))}</div>
        </div>
        <div class="nw-spot-meta">${_dlgEscape(app.kind === 'classic' ? 'built-in' : (app.tags || [])[0] || '')}</div>
      </div>`;
    }
    if (row.type === 'enable'){
      return `<div class="nw-spot-item ${sel}" ${attrs}>
        <div class="nw-spot-glyph">🔎</div>
        <div style="flex:1; min-width:0;">
          <div class="nw-spot-name">Enable semantic search</div>
          <div class="nw-spot-desc">Find files by meaning across your connected Folder or Crate — embedded entirely on this device.</div>
        </div>
      </div>`;
    }
    if (row.type === 'connect'){
      return `<div class="nw-spot-item ${sel}" ${attrs}>
        <div class="nw-spot-glyph">🔎</div>
        <div style="flex:1; min-width:0;">
          <div class="nw-spot-name">Connect storage to search by meaning</div>
          <div class="nw-spot-desc">Semantic search reads a connected Folder or encrypted Crate — connect one in Settings to turn it on.</div>
        </div>
      </div>`;
    }
    if (row.type === 'semantic'){
      const hit = row.hit;
      return `<div class="nw-spot-item is-semantic ${sel}" ${attrs}>
        <div class="nw-spot-glyph">📄</div>
        <div style="flex:1; min-width:0;">
          <div class="nw-spot-name">${_dlgEscape(hit.path.split('/').pop() || 'file')}</div>
          <div class="nw-spot-desc">${_dlgEscape(hit.text.slice(0, 140))}</div>
        </div>
        <div class="nw-spot-meta">${_dlgEscape(hit.path)} · ${Math.round(hit.score * 100)}%</div>
      </div>`;
    }
    return `<div class="nw-spot-item" role="status"><span class="nw-spot-desc">${_dlgEscape(row.text || '')}</span></div>`;
  }

  async function activateRow(row){
    if (!row) return;
    if (row.type === 'app'){ close(); openApp(row.app); }
    else if (row.type === 'semantic'){
      close();
      ragOpenResultInEditor(row.hit.path).catch(err => console.warn('Semantic result open failed:', err));
    }
    else if (row.type === 'connect'){ close(); openSettings('storage'); }
    else if (row.type === 'enable'){
      if (await ragEnsurePermission()) void runSemantic(input.value.trim());
      else render();
    }
  }

  async function runSemantic(q){
    if (!q){ semantic.state = 'idle'; semantic.hits = []; render(); return; }
    const myToken = ++semantic.token;
    semantic.state = 'searching';
    render();
    try {
      const res = await ragSearchNative(q, {
        limit:6,
        onProgress(){
          if (myToken === semantic.token && semantic.state !== 'indexing'){
            semantic.state = 'indexing';
            render();
          }
        },
      });
      if (myToken !== semantic.token) return;
      semantic.hits = res?.hits || [];
    } catch(_){
      semantic.hits = [];
    }
    if (myToken !== semantic.token) return;
    semantic.state = 'ready';
    render();
  }

  function scheduleSemantic(){
    const q = input.value.trim();
    clearTimeout(semantic.timer);
    if (!q){
      semantic.token++;
      semantic.state = 'idle';
      semantic.hits = [];
      return;
    }
    if (ragReadDecision()?.granted !== true) return;   // rendered as the enable offer
    semantic.timer = setTimeout(() => void runSemantic(q), 350);
  }

  function render(){
    rows = buildRows();
    navIndices = rows.map((row, i) => (row.type === 'status' ? -1 : i)).filter(i => i >= 0);
    if (active >= navIndices.length) active = 0;
    if (active < 0) active = 0;
    const activeRowIdx = navIndices.length ? navIndices[active] : -1;
    list.innerHTML = rows.length
      ? rows.map((row, i) => rowHTML(row, i, i === activeRowIdx)).join('')
      : `<div class="nw-spot-item" role="status"><span class="nw-spot-desc">No matches.</span></div>`;
    if (activeRowIdx >= 0) input.setAttribute('aria-activedescendant', `spot-row-${activeRowIdx}`);
    else input.removeAttribute('aria-activedescendant');
    list.querySelectorAll('.nw-spot-item[data-row-idx]').forEach(el => {
      el.addEventListener('click', () => void activateRow(rows[+el.dataset.rowIdx]));
    });
  }

  function close(){
    spotlightOpen = false;
    wrap.remove();
  }

  input.addEventListener('input', () => { active = 0; render(); scheduleSemantic(); });
  input.addEventListener('keydown', e => {
    if (e.key === 'Escape') { close(); }
    else if (e.key === 'ArrowDown') { e.preventDefault(); active++; render(); }
    else if (e.key === 'ArrowUp') { e.preventDefault(); active = Math.max(0, active - 1); render(); }
    else if (e.key === 'Enter') {
      e.preventDefault();
      if (navIndices.length) void activateRow(rows[navIndices[active]]);
    }
  });
  wrap.addEventListener('click', e => { if (e.target === wrap) close(); });
  render();
  setTimeout(() => input.focus(), 0);
}

// ADD APP — strict manifest review, explicit consent, local registry.
// ════════════════════════════════════════════════════════════════════
function thirdPartyManifestJSON(manifest){
  return JSON.stringify({
    schema: manifest.schema,
    id: manifest.id,
    name: manifest.name,
    version: manifest.version,
    url: manifest.url,
    description: manifest.description,
    icon: manifest.icon,
    tags: [...manifest.tags],
    permissions: [...manifest.permissions],
    display: manifest.display,
  }, null, 2);
}

async function fetchThirdPartyManifest(sourceUrl){
  const source = safeThirdPartyUrl(sourceUrl, 'manifest source');
  const response = await fetch(source.href, {
    credentials:'omit',
    cache:'no-store',
    redirect:'error',
    referrerPolicy:'no-referrer',
    headers:{ Accept:'application/json' },
  });
  if (!response.ok) throw new Error(`Manifest request failed with HTTP ${response.status}`);
  const declaredBytes = Number(response.headers.get('content-length') || 0);
  if (declaredBytes > THIRD_PARTY_MANIFEST_MAX_BYTES) throw new Error('Manifest exceeds the 32 KiB limit');
  const reader = response.body?.getReader();
  if (!reader) throw new Error('This browser cannot safely stream the manifest response');
  const decoder = new TextDecoder();
  let receivedBytes = 0;
  let text = '';
  while (true){
    const { done, value } = await reader.read();
    if (done) break;
    receivedBytes += value.byteLength;
    if (receivedBytes > THIRD_PARTY_MANIFEST_MAX_BYTES){
      await reader.cancel();
      throw new Error('Manifest exceeds the 32 KiB limit');
    }
    text += decoder.decode(value, { stream:true });
  }
  text += decoder.decode();
  let raw;
  try { raw = JSON.parse(text); } catch(_){ throw new Error('Manifest response is not valid JSON'); }
  return { manifest:normalizeThirdPartyManifest(raw), manifestSource:source.href };
}

function promptThirdPartyManifest(){
  return new Promise(resolve => {
    const dialog = document.createElement('dialog');
    dialog.className = 'nw-dlg';
    dialog.setAttribute('aria-labelledby', 'nw-add-app-title');
    dialog.innerHTML = `
      <form class="nw-dlg-form nw-app-manifest-form">
        <h2 class="nw-dlg-title" id="nw-add-app-title">Add an app</h2>
        <p class="nw-app-manifest-help">
          Paste a NakliOS v1 manifest, or load one from an HTTPS URL. Loading
          omits credentials and referrer data. Nothing is installed until the
          separate review screen is accepted.
        </p>
        <label for="nw-app-manifest-url">Manifest URL (optional)</label>
        <div class="nw-app-manifest-url-row">
          <input id="nw-app-manifest-url" type="url" inputmode="url"
            autocomplete="off" autocapitalize="off" spellcheck="false"
            placeholder="https://example.com/naklios-app.json">
          <button class="nw-dlg-btn" id="nw-app-manifest-load" type="button">Load</button>
        </div>
        <label for="nw-app-manifest-json">Manifest JSON</label>
        <textarea id="nw-app-manifest-json" autocomplete="off" autocapitalize="off"
          spellcheck="false" aria-describedby="nw-app-manifest-error"></textarea>
        <p class="nw-app-manifest-error" id="nw-app-manifest-error" role="alert"></p>
        <menu class="nw-dlg-actions">
          <button class="nw-dlg-btn" type="button" id="nw-app-manifest-cancel">Cancel</button>
          <button class="nw-dlg-btn primary" type="submit">Review app</button>
        </menu>
      </form>`;
    document.body.appendChild(dialog);
    const form = dialog.querySelector('form');
    const urlInput = dialog.querySelector('#nw-app-manifest-url');
    const textarea = dialog.querySelector('#nw-app-manifest-json');
    const loadButton = dialog.querySelector('#nw-app-manifest-load');
    const error = dialog.querySelector('#nw-app-manifest-error');
    textarea.value = JSON.stringify({
      schema: THIRD_PARTY_SCHEMA,
      id: 'com.example.my-app',
      name: 'My App',
      version: '1.0.0',
      url: 'https://example.com/app/',
      description: 'What this app does.',
      icon: '◇',
      tags: ['tool'],
      permissions: [],
      display: 'window',
    }, null, 2);
    let loadedSource = null;
    const finish = value => {
      if (dialog.open) dialog.close();
      dialog.remove();
      resolve(value);
    };
    dialog.querySelector('#nw-app-manifest-cancel').addEventListener('click', () => finish(null));
    dialog.addEventListener('cancel', event => {
      event.preventDefault();
      finish(null);
    });
    loadButton.addEventListener('click', async () => {
      error.textContent = '';
      loadButton.disabled = true;
      try {
        const loaded = await fetchThirdPartyManifest(urlInput.value.trim());
        textarea.value = thirdPartyManifestJSON(loaded.manifest);
        loadedSource = loaded.manifestSource;
        error.textContent = 'Manifest loaded. Review the JSON, then continue.';
      } catch (caught){
        loadedSource = null;
        error.textContent = caught?.message || String(caught);
      } finally {
        loadButton.disabled = false;
      }
    });
    form.addEventListener('submit', event => {
      event.preventDefault();
      error.textContent = '';
      try {
        const text = textarea.value;
        if (new Blob([text]).size > THIRD_PARTY_MANIFEST_MAX_BYTES) throw new Error('Manifest exceeds the 32 KiB limit');
        const manifest = normalizeThirdPartyManifest(JSON.parse(text));
        const typedSource = urlInput.value.trim();
        const manifestSource = typedSource
          ? safeThirdPartyUrl(typedSource, 'manifest source').href
          : null;
        // Remember a remote update source only if this exact URL was loaded.
        // Editing a URL after loading cannot silently claim update authority.
        finish({
          manifest,
          manifestSource: loadedSource === manifestSource ? manifestSource : null,
        });
      } catch (caught){
        error.textContent = caught instanceof SyntaxError
          ? 'Manifest JSON is not valid.'
          : caught?.message || String(caught);
      }
    });
    dialog.showModal();
    textarea.focus();
  });
}

function sameStringList(left, right){
  return JSON.stringify([...(left || [])].sort()) === JSON.stringify([...(right || [])].sort());
}

async function consentThirdPartyInstall(manifest, manifestSource){
  const existing = THIRD_PARTY_APP_RECORDS.find(record => record.manifest.id === manifest.id) || null;
  const originChanged = !!existing && existing.manifest.origin !== manifest.origin;
  const permissionsChanged = !!existing &&
    !sameStringList(existing.manifest.permissions, manifest.permissions);
  const sourceChanged = !!existing && existing.manifestSource !== manifestSource;
  const changes = [];
  if (originChanged) changes.push(
    `<strong>Origin changed:</strong> <code>${_dlgEscape(existing.manifest.origin)}</code> → <code>${_dlgEscape(manifest.origin)}</code>. The replacement receives a new storage namespace.`
  );
  if (permissionsChanged) changes.push(
    `<strong>Permissions changed:</strong> ${(existing.manifest.permissions || []).join(', ') || 'none'} → ${manifest.permissions.join(', ') || 'none'}. Earlier host grants are revoked.`
  );
  if (sourceChanged) changes.push('<strong>Manifest source changed.</strong> Future update checks will use the new source shown here.');
  const storageLine = manifest.permissions.includes('storage')
    ? getMode() === 'basic'
      ? 'Requested for its hosted window. Basic mode currently opens it in a top-level tab, so NakliOS storage stays unavailable until the app is opened in Immersive; NakliOS then asks again on first use.'
      : 'May ask for app-scoped Folder or Crate storage. NakliOS asks again on first use.'
    : 'No NakliOS storage access requested.';
  const inferenceLine = manifest.permissions.includes('inference')
    ? 'May ask to use the shared on-device LocalMind model. NakliOS asks again on first use and never shares prompts between apps.'
    : 'No NakliOS AI access requested.';
  const answer = await _nakliosDialog({
    title: existing ? `Review update for ${manifest.name}` : `Install ${manifest.name}?`,
    body:
      `<strong>Identity</strong> · <code>${_dlgEscape(manifest.id)}</code><br>` +
      `<strong>Version</strong> · ${_dlgEscape(manifest.version)}<br>` +
      `<strong>App origin</strong> · <code>${_dlgEscape(manifest.origin)}</code><br>` +
      `<strong>Manifest source</strong> · ${manifestSource ? `<code>${_dlgEscape(manifestSource)}</code>` : 'Pasted locally; no automatic update source'}<br>` +
      `<strong>Display</strong> · ${manifest.display === 'tab' ? 'Canonical browser tab' : 'NakliOS window'}<br><br>` +
      `${changes.length ? `${changes.join('<br>')}<br><br>` : ''}` +
      `<strong>Isolation</strong> · Windowed apps always run in an opaque-origin sandbox. ` +
      `They never become a same-origin system app or mirror.<br>` +
      `<strong>Storage</strong> · ${_dlgEscape(storageLine)}<br>` +
      `<strong>AI</strong> · ${_dlgEscape(inferenceLine)}<br><br>` +
      `Installation is local to this browser profile. Uninstalling later removes the registration, not app data.`,
    buttons: [
      { value:'cancel', label:'Cancel' },
      { value:'install', label:existing ? (originChanged || permissionsChanged ? 'Re-consent & update' : 'Update') : 'Install', primary:true },
    ],
    allowHtmlBody:true,
  });
  return answer === 'install' ? { existing, originChanged, permissionsChanged } : null;
}

function purgeLayoutAppId(appId){
  for (const key of ['hidden', 'pinned', 'unfoldered', 'recent']){
    state.layout[key] = (state.layout[key] || []).filter(id => id !== appId);
  }
  delete state.layout.positions?.[appId];
  delete state.layout.windowPositions?.[appId];
}

async function installThirdPartyManifest(manifest, manifestSource = null){
  const review = await consentThirdPartyInstall(manifest, manifestSource);
  if (!review) return null;
  const appId = review.existing && !review.originChanged
    ? review.existing.appId
    : newThirdPartyAppId();
  const collision = THIRD_PARTY_APP_RECORDS.find(record =>
    record.appId === appId && record !== review.existing
  );
  if (collision) throw new Error('App identity collision; installation refused');
  if (review.existing && openWindows[review.existing.appId]){
    await nakliosAlert('Close the running app before updating its registration.', {
      title:'App is still open',
      kind:'error',
    });
    return null;
  }

  if (review.existing){
    THIRD_PARTY_APP_RECORDS = THIRD_PARTY_APP_RECORDS.filter(record => record !== review.existing);
    if (review.originChanged){
      purgeLayoutAppId(review.existing.appId);
      delete state.appPermissions[review.existing.appId];
      delete state.aiPermissions[review.existing.appId];
    } else if (review.permissionsChanged){
      delete state.appPermissions[review.existing.appId];
      delete state.aiPermissions[review.existing.appId];
    }
  }
  // Registrations are profile-local while appPermissions can be present in a
  // restored NakliOS state snapshot. A genuinely new random install identity
  // must never inherit even a coincidentally stale runtime decision.
  if (!review.existing || review.originChanged){
    delete state.appPermissions[appId];
    delete state.aiPermissions[appId];
  }
  THIRD_PARTY_APP_RECORDS.push({
    appId,
    manifest,
    manifestSource,
    installedAt: Date.now(),
  });
  persistThirdPartyAppRecords();
  refreshThirdPartyCatalog();
  saveAppPermissions();
  saveAiPermissions();
  saveLayout();
  renderIcons();
  updateDock();
  return APPS.find(app => app.id === appId) || null;
}

async function openAddAppDialog(){
  const candidate = await promptThirdPartyManifest();
  if (!candidate) return null;
  try {
    return await installThirdPartyManifest(candidate.manifest, candidate.manifestSource);
  } catch (caught){
    await nakliosAlert(caught?.message || String(caught), { title:'App not installed', kind:'error' });
    return null;
  }
}

async function updateThirdPartyApp(appId){
  const record = THIRD_PARTY_APP_RECORDS.find(item => item.appId === appId);
  if (!record?.manifestSource) return null;
  try {
    const loaded = await fetchThirdPartyManifest(record.manifestSource);
    if (loaded.manifest.id !== record.manifest.id) {
      throw new Error('Update manifest identity does not match the installed app');
    }
    return await installThirdPartyManifest(loaded.manifest, loaded.manifestSource);
  } catch (caught){
    await nakliosAlert(caught?.message || String(caught), { title:'Update check failed', kind:'error' });
    return null;
  }
}

async function uninstallThirdPartyApp(appId){
  const record = THIRD_PARTY_APP_RECORDS.find(item => item.appId === appId);
  if (!record) return false;
  if (openWindows[appId]){
    await nakliosAlert('Close the running app before uninstalling its registration.', {
      title:'App is still open',
      kind:'error',
    });
    return false;
  }
  const ok = await nakliosConfirm(
    `Remove ${record.manifest.name} from this browser profile? Its Folder, Crate, and origin data will not be deleted.`,
    { title:`Uninstall ${record.manifest.name}?`, okLabel:'Uninstall', danger:true }
  );
  if (!ok) return false;
  THIRD_PARTY_APP_RECORDS = THIRD_PARTY_APP_RECORDS.filter(item => item !== record);
  delete state.appPermissions[appId];
  delete state.aiPermissions[appId];
  purgeLayoutAppId(appId);
  persistThirdPartyAppRecords();
  refreshThirdPartyCatalog();
  saveAppPermissions();
  saveAiPermissions();
  saveLayout();
  renderIcons();
  updateDock();
  return true;
}

let settingsOpen = false;
let settingsReturnFocus = null;

function focusSettingsSection(section){
  const pop = document.getElementById('settings-pop');
  if (!pop || (section !== 'storage' && section !== 'apps' && section !== 'ai')) return;
  const heading = pop.querySelector(
    section === 'apps' ? '#settings-apps-heading'
      : section === 'ai' ? '#settings-ai-heading'
        : '#settings-storage-heading'
  );
  heading?.scrollIntoView({ block:'start' });
  const selector = section === 'apps'
    ? '#third-party-add, .third-party-open, .third-party-update, .third-party-uninstall'
    : section === 'ai'
      ? '#ai-forget-permissions'
      : '#fs-connect, #fs-regrant, #crate-unlock, #crate-connect-file, #crate-connect-manual, #fs-disconnect, #crate-lock';
  pop.querySelector(selector)?.focus();
}

    const model = globalThis.LocalMindHostCatalog.get(key);
    aiModelDetail.textContent = `${model.description} First use: ${model.size}.`;
  };
  aiModelSelect?.addEventListener('change', paintAiDraft);
  paintAiDraft();

  const paintAiImageDraft = () => {
    const key = aiImageModelSelect?.value || AI_DEFAULT_SETTINGS.imageModelKey;
    const endpoint = key === 'endpoint';
    if (aiImageEndpointFields) aiImageEndpointFields.hidden = !endpoint;
    if (!aiImageModelDetail) return;
    if (endpoint){
      aiImageModelDetail.textContent =
        'Connect OpenAI or an OpenAI-compatible /images/generations endpoint. Credentials remain host-only.';
      return;
    }
    const model = globalThis.LocalMindHostCatalog.getImage(key);
    aiImageModelDetail.textContent =
      `${model.description} First use: ${model.size}.`;
  };
  aiImageModelSelect?.addEventListener('change', paintAiImageDraft);
  paintAiImageDraft();

  const paintEndpointKeyState = () => {
    const preset = AI_ENDPOINT_PRESETS[aiEndpointPreset.value] || AI_ENDPOINT_PRESETS.custom;
    const hasKey = !!aiEndpointApiKey(aiEndpointUrl.value);
    aiEndpointKey.placeholder = preset.keyRequired
      ? (hasKey ? 'Key already available — leave blank to keep it' : 'Required')
      : (hasKey ? 'Key already available — leave blank to keep it' : 'Optional for local endpoints');

  const paintImageEndpointKeyState = () => {
    const preset = AI_IMAGE_ENDPOINT_PRESETS[aiImageEndpointPreset.value] ||
      AI_IMAGE_ENDPOINT_PRESETS.custom;
    const hasKey = !!aiEndpointApiKey(aiImageEndpointUrl.value);
    aiImageEndpointKey.placeholder = preset.keyRequired
      ? (hasKey ? 'Key already available — leave blank to keep it' : 'Required')
      : (hasKey ? 'Key already available — leave blank to keep it' : 'Optional');
    wrap.querySelector('#ai-image-forget-key').disabled = !hasKey;
  };

  // ── saved credentials: list, use, delete, save ─────────────────────────────
  const aiVaultList = wrap.querySelector('#ai-vault-list');
  const aiVaultName = wrap.querySelector('#ai-vault-name');

  function paintVault(){
    if (!aiVaultList) return;
    const entries = aiVaultRead();
    if (!entries.length){
      aiVaultList.innerHTML =
        '<div class="nw-fs-blurb" style="margin:0; opacity:.7;">No saved keys yet. ' +
        'Enter a key above, name it, and save.</div>';
      return;
    }
    aiVaultList.innerHTML = entries.map(e => {
      const provider = AI_ENDPOINT_PRESETS[e.preset]?.label || e.preset || 'custom';
      const bits = [provider, e.model, aiVaultWhen(e.savedAt)].filter(Boolean);
      return `
        <div class="nw-ai-vault-row" data-id="${_dlgEscape(e.id)}"
          style="display:flex; gap:8px; align-items:center; padding:5px 0;
                 border-top:1px solid var(--nw-line,#2a2a33);">
          <div style="flex:1; min-width:0;">

      if (event.target.classList.contains('nw-vault-use')){
        const entry = aiVaultUse(id);

        if (aiEndpointPreset && AI_ENDPOINT_PRESETS[entry.preset]) aiEndpointPreset.value = entry.preset;
        if (entry.baseUrl) aiEndpointUrl.value = entry.baseUrl;

          ...aiSettings,
          modelKey:'endpoint',
          endpoint:{
            preset: entry.preset,

  wrap.querySelector('#ai-vault-save')?.addEventListener('click', () => {

  aiEndpointPreset?.addEventListener('change', () => {
    const next = AI_ENDPOINT_PRESETS[aiEndpointPreset.value] || AI_ENDPOINT_PRESETS.custom;

    // replace the URL only when it was empty or still exactly the previous

    // silently changed nothing — you picked Groq and stayed pointed at DeepSeek.
    // 'OpenAI-compatible' is the exception: it has no address of its own, so it
    // leaves whatever you typed alone. That is what it means.

  aiImageEndpointPreset?.addEventListener('change', () => {

  wrap.querySelector('#ai-discover-models')?.addEventListener('click', async (event) => {

  wrap.querySelector('#ai-forget-key')?.addEventListener('click', (event) => {

  wrap.querySelector('#ai-image-discover-models')?.addEventListener('click', async (event) => {
    const button = event.currentTarget;

  wrap.querySelector('#ai-apply-model')?.addEventListener('click', async () => {

    try {

          const proceed = await nakliosConfirm(
            `${model.label} downloads ${model.size} and needs substantial GPU memory. ` +
            `The browser cache keeps its weights for later use.`,
            {

              cancelLabel:'Not now',

          if (!proceed) return;

      aiPersistSettings(next, suppliedKey ? suppliedKey : null);
      broadcastCapabilities();

  wrap.querySelector('#ai-image-apply-model')?.addEventListener('click', async () => {

      ...aiSettings,

        baseUrl:aiImageEndpointUrl.value.trim(),

      return;

    button.disabled = true;
    aiSettingsResult.textContent = 'Preparing image model…';
    try {
      const image = await aiHostImageNative(prompt, {
        size,
        quality:'medium',
        steps:4,
        onStatus(status, progress){
          if (status === 'loading' && progress?.total){
            const pct = Math.round(100 * Number(progress.loaded || 0) /
              Number(progress.total));
            aiSettingsResult.textContent = `Loading image model… ${pct}%`;
          } else if (status === 'generating' && progress?.total){

        ? `data:${image.mime_type || 'image/png'};base64,${image.b64_json}`

  wrap.querySelector('#ai-forget-permissions')?.addEventListener('click', (event) => {

  wrap.querySelector('#third-party-add')?.addEventListener('click', async () => {

    });
  });

  // close on outside click
  setTimeout(() => {
    document.addEventListener('pointerdown', outsideHandler);
  }, 0);
}

// Tiny helper to pick a single file via a hidden <input type=file>.
function pickFile(accept){
  return new Promise(resolve => {
    const inp = document.createElement('input');
    inp.type = 'file';
    if (accept) inp.accept = accept;
    inp.addEventListener('change', () => resolve(inp.files?.[0] || null));
    // Some browsers need the input in the DOM
    inp.style.display = 'none';
    document.body.appendChild(inp);
    inp.click();
    // Resolve(null) on cancel — browsers don't reliably fire a cancel event,
    // so we don't add a fallback timeout here (would race a slow picker).
    // The function resolves once the user picks OR garbage-collects naturally.
  });
}

function outsideHandler(e){
  const pop = document.getElementById('settings-pop');
  const btn = document.getElementById('settings-btn');
  const mode = document.getElementById('mode-pill');
  if (!pop) return;
  if (pop.contains(e.target) || btn.contains(e.target) || mode.contains(e.target) ||
      e.target.closest?.('.nw-dlg')) return;
  closeSettings();
}

function closeSettings(){
  const pop = document.getElementById('settings-pop');
  if (pop) pop.remove();
  settingsOpen = false;
  document.removeEventListener('pointerdown', outsideHandler);
  const returnFocus = settingsReturnFocus;
  settingsReturnFocus = null;
  if (returnFocus?.isConnected) returnFocus.focus();
}

// STICKY NOTES
// ════════════════════════════════════════════════════════════════════
const STICKY_COLORS = ['yellow', 'pink', 'blue', 'green', 'purple'];

function addSticky(x, y){
  const s = {
    id: 's_' + Math.random().toString(36).slice(2, 10),
    x: Math.max(0, x - 60),
    y: Math.max(0, y - 14),
    w: 200, h: 160,
    text: '',
    color: STICKY_COLORS[state.layout.stickies.length % STICKY_COLORS.length],
  };
  state.layout.stickies.push(s);
  saveLayout();
  renderStickies();
  const el = document.querySelector(`.nw-sticky[data-id="${s.id}"]`);
  el?.querySelector('.nw-sticky-body').focus();
}

function updateSticky(id, patch){
  const s = state.layout.stickies.find(x => x.id === id);
  if (!s) return;
  Object.assign(s, patch);
  saveLayout();
}

function deleteSticky(id){
  state.layout.stickies = state.layout.stickies.filter(s => s.id !== id);
  saveLayout();
  renderStickies();
}

function renderStickies(){
  const area = document.getElementById('icon-area');
  if (!area) return;
  area.querySelectorAll('.nw-sticky').forEach(el => el.remove());
  for (const s of state.layout.stickies){
    const el = document.createElement('div');
    el.className = 'nw-sticky';
    el.dataset.id = s.id;
    el.dataset.color = s.color;
    el.style.left = s.x + 'px';
    el.style.top = s.y + 'px';
    el.style.width = s.w + 'px';
    el.style.height = s.h + 'px';
    el.innerHTML = `
      <div class="nw-sticky-bar">
        <span class="nw-sticky-swatch" title="Cycle color"></span>
        <span class="nw-sticky-spacer"></span>
        <button class="nw-sticky-close" aria-label="Delete sticky" title="Delete">✕</button>
      </div>
      <div class="nw-sticky-body" contenteditable="true" spellcheck="false"></div>
      <div class="nw-sticky-resize" aria-hidden="true"></div>
    `;
    el.querySelector('.nw-sticky-body').textContent = s.text;
    area.appendChild(el);
    wireSticky(el, s);
  }
}

function wireSticky(el, s){
  const body = el.querySelector('.nw-sticky-body');
  body.addEventListener('input', () => updateSticky(s.id, { text: body.textContent }));

  el.querySelector('.nw-sticky-close').addEventListener('click', e => {
    e.stopPropagation();
    deleteSticky(s.id);
  });

  el.querySelector('.nw-sticky-swatch').addEventListener('click', e => {
    e.stopPropagation();
    const idx = STICKY_COLORS.indexOf(s.color);
    const next = STICKY_COLORS[(idx + 1) % STICKY_COLORS.length];
    s.color = next;
    el.dataset.color = next;
    saveLayout();
  });

  const bar = el.querySelector('.nw-sticky-bar');
  bar.addEventListener('pointerdown', e => {
    if (e.button !== 0) return;
    if (e.target.closest('.nw-sticky-close, .nw-sticky-swatch')) return;
    e.preventDefault();
    const startX = e.clientX, startY = e.clientY;
    const origX = s.x, origY = s.y;
    let dragging = false;
    const onMove = ev => {
      const dx = ev.clientX - startX;
      const dy = ev.clientY - startY;
      if (!dragging && Math.hypot(dx, dy) > 3){
        dragging = true;
        el.classList.add('dragging');
      }
      if (dragging){
        s.x = Math.max(0, origX + dx);
        s.y = Math.max(0, origY + dy);
        el.style.left = s.x + 'px';
        el.style.top = s.y + 'px';
      }
    };
    const onUp = () => {
      document.removeEventListener('pointermove', onMove);
      document.removeEventListener('pointerup', onUp);
      if (dragging){
        el.classList.remove('dragging');
        saveLayout();
      }
    };
    document.addEventListener('pointermove', onMove);
    document.addEventListener('pointerup', onUp);
  });

  el.querySelector('.nw-sticky-resize').addEventListener('pointerdown', e => {
    if (e.button !== 0) return;
    e.preventDefault();
    e.stopPropagation();
    const startX = e.clientX, startY = e.clientY;
    const origW = s.w, origH = s.h;
    const onMove = ev => {
      s.w = Math.max(140, origW + ev.clientX - startX);
      s.h = Math.max(100, origH + ev.clientY - startY);
      el.style.width = s.w + 'px';
      el.style.height = s.h + 'px';
    };
    const onUp = () => {
      document.removeEventListener('pointermove', onMove);
      document.removeEventListener('pointerup', onUp);
      saveLayout();
    };
    document.addEventListener('pointermove', onMove);
    document.addEventListener('pointerup', onUp);
  });

  el.addEventListener('contextmenu', e => {
    if (e.target.closest('.nw-sticky-body')) return; // native menu for paste/copy
    e.preventDefault();
    e.stopPropagation();
    showContextMenu(e.clientX, e.clientY, [
      { label: 'Cycle color', onClick: () => el.querySelector('.nw-sticky-swatch').click() },
      { separator: true },
      { label: 'Delete sticky', danger: true, onClick: () => deleteSticky(s.id) },
    ]);
  });
}
