let topZ = 100;
const openWindows = Object.create(null);
const knownIframes = new Set();
const fileGrants = new Map();
const FILE_GRANT_MAX_CHARS = 2 * 1024 * 1024;
const EDITABLE_FILE_RE = /\.(?:txt|md|markdown|json|jsonl|js|mjs|cjs|ts|tsx|jsx|css|scss|less|html?|xml|svg|yaml|yml|toml|ini|conf|env|csv|tsv|sql|sh|zsh|bash|py|rb|php|java|kt|kts|go|rs|c|h|cc|cpp|hpp|cs|swift|dart|vue|svelte|astro|graphql|gql|properties|gitignore|editorconfig)$/i;
let appInfoWindow = null;
let appInfoRenderToken = 0;
let mirrorManifestPromise = null;

function loadMirrorManifest(){
  if (!mirrorManifestPromise){
    const manifestUrl = new URL('apps/manifest.lock.json', location.href);
    mirrorManifestPromise = fetch(manifestUrl)
      .then(response => {
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        return response.json();
      })
      .then(manifest => ({ manifest, error:null }))
      .catch(error => ({ manifest:null, error:String(error?.message || error) }));
  }
  return mirrorManifestPromise;
}

function formatLaunchTiming(value, emptyLabel){
  return typeof value === 'number' ? `${Math.round(value)} ms` : emptyLabel;
}

const LAUNCH_DIAGNOSTIC_THRESHOLDS = Object.freeze({
  loadWarningMs: 4000,
  readyWarningMs: 8000,
  fallbackMs: 15000,
});

function launchDiagnosticsSnapshot(){
  const snapshots = Object.values(openWindows)
    .filter(win => win?.dataset?.id)
    .map(win => {
      const app = win._app || APPS.find(item => item.id === win.dataset.id) || {};
      const iframe = win.querySelector('iframe');
      const timing = win._launchTiming || {};
      const loadedUrl = iframe?.src || app.embedUrl || app.url || location.href;
      let origin = location.origin;
      let locationPath = '/';
      try {
        const parsed = new URL(loadedUrl, location.href);
        origin = parsed.origin;
        locationPath = parsed.pathname;
      } catch(_){}
      const sandboxed = iframe ? iframe.hasAttribute('sandbox') : false;
      const loadMs = typeof timing.loaded === 'number' ? Math.round(timing.loaded) : null;
      const readyMs = typeof timing.ready === 'number' ? Math.round(timing.ready) : null;
      const fallbackMs = typeof timing.timeout === 'number' ? Math.round(timing.timeout) : null;
      const status = fallbackMs != null
        ? 'fallback'
        : readyMs != null && readyMs > LAUNCH_DIAGNOSTIC_THRESHOLDS.readyWarningMs
          ? 'slow-ready'
          : readyMs == null && loadMs != null && loadMs > LAUNCH_DIAGNOSTIC_THRESHOLDS.loadWarningMs
            ? 'slow-load'
            : readyMs != null || loadMs != null
              ? 'ready'
              : 'pending';
      return Object.freeze({
        appId: app.id || win.dataset.id,
        name: app.name || win.dataset.id,
        location: `${origin}${locationPath}`,
        origin,
        sandboxed,
        loadMs,
        readyMs,
        fallbackMs,
        status,
      });
    });
  return Object.freeze(snapshots);
}

function appProvenanceRows(win, mirrorManifest, mirrorError){
  const app = win._app || APPS.find(item => item.id === win.dataset.id);
  if (!app) return [{ label:'Provenance', value:'Unknown app registry entry' }];
  if (app.thirdParty){
    return [
      { label:'Provenance', value:'User-installed third-party app' },
      { label:'Manifest identity', value:app.manifestId || 'Unknown', mono:true },
      { label:'Manifest version', value:app.manifestVersion || 'Unknown', mono:true },
      { label:'Canonical origin', value:new URL(app.url).origin, mono:true },
      { label:'Requested permissions', value:(app.permissions || []).join(', ') || 'None' },
    ];
  }
  if (app.kind === 'classic'){
    return [
      { label:'Provenance', value:'Built into this NakliOS release' },
      { label:'Source', value:'NakliOS index.html', mono:true },
    ];
  }

  const iframe = win.querySelector('iframe');
  const loadedUrl = iframe?.src || app.embedUrl || app.url || '';
  let loaded = null;
  try { loaded = new URL(loadedUrl, location.href); } catch(_){}
  const mirror = mirrorManifest?.apps?.find(entry => entry.id === app.id);
  if (mirror && app.embedUrl){
    const artifact = mirror.files?.[0] || null;
    const rows = [
      { label:'Provenance', value:'Vendored standalone-app mirror' },
      { label:'Source repository', value:mirror.repo || 'Unknown', mono:true },
      { label:'Mirror commit', value:mirror.resolvedCommit || 'Unknown', mono:true },
    ];
    if (artifact?.destination){
      rows.push({ label:'Mirror artifact', value:`apps/${app.id}/${artifact.destination}`, mono:true });
    }
    if (artifact?.sha256){
      rows.push({ label:'Artifact SHA-256', value:artifact.sha256, mono:true });
    }
    return rows;
  }

  const hostedSystemPath = loaded &&
    loaded.origin === location.origin &&
    loaded.pathname.includes(`/apps/${app.id}/`);
  if (hostedSystemPath){
    return [
      { label:'Provenance', value:'Bundled NakliOS system app' },
      { label:'Source', value:`apps/${app.id}/`, mono:true },
    ];
  }
  const rows = [
    { label:'Provenance', value:'Canonical standalone app (not a vendored mirror)' },
    { label:'Canonical URL', value:app.url || loadedUrl || 'Unknown', mono:true },
  ];
  if (mirrorError && app.embedUrl){
    rows.push({ label:'Mirror manifest', value:`Unavailable: ${mirrorError}` });
  }
  return rows;
}

function appDiagnosticRows(win, mirrorManifest, mirrorError){
  const app = win._app || APPS.find(item => item.id === win.dataset.id) || {};
  const iframe = win.querySelector('iframe');
  const actualUrl = iframe?.src || app.url || location.href;
  let actualOrigin = location.origin;
  try { actualOrigin = new URL(actualUrl, location.href).origin; } catch(_){}
  const timing = win._launchTiming || {};
  const caps = win._capabilities || (app.id ? capabilitySnapshot(app.id) : null);
  const sandboxAttr = iframe?.getAttribute('sandbox');
  const sandboxState = !iframe
    ? 'Host-native window; no iframe sandbox'
    : sandboxAttr !== null
      ? 'Enabled on an isolated iframe'
      : actualOrigin === location.origin
        ? 'None; same-origin integration'
        : 'None; cross-origin boundary only';
  const sdkState = !iframe
    ? 'Host-native API'
    : timing.ready != null
      ? 'Cooperative ready signal received'
      : 'No ready signal received yet';
  const backendLabels = (caps?.fsBackends || [])
    .map(item => typeof item === 'string' ? item : item?.label || item?.id)
    .filter(Boolean);
  const bound = caps?.fsBackend === 'crate'
    ? 'Crate'
    : caps?.fsBackend === 'fsa'
      ? 'Folder'
      : 'Unbound (chosen on first file operation)';
  const rows = [
    { label:'App', value:`${app.name || win.dataset.id} (${win.dataset.id})` },
    { label:'Loaded URL', value:actualUrl, mono:true },
    { label:'Origin', value:actualOrigin, mono:true },
    { label:'Sandbox', value:sandboxState },
  ];
  if (iframe){
    rows.push({
      label:'Sandbox tokens',
      value:sandboxAttr !== null && sandboxAttr ? sandboxAttr : 'None',
      mono:true,
    });
    rows.push(
      { label:'Load event', value:formatLaunchTiming(timing.loaded, 'Pending') },
      { label:'Ready signal', value:formatLaunchTiming(timing.ready, 'Not signaled') },
      { label:'Fallback reveal', value:formatLaunchTiming(timing.timeout, 'Not used') },
    );
  } else {
    rows.push(
      { label:'Load event', value:'Immediate (built in)' },
      { label:'Ready signal', value:'Not applicable' },
    );
  }
  rows.push(
    { label:'SDK bridge', value:sdkState },
    { label:'Storage capability', value:caps?.fs ? 'Available to this app' : 'Unavailable or denied' },
    { label:'Connected locations', value:backendLabels.length ? backendLabels.join(', ') : 'None' },
    { label:'App storage binding', value:bound },
    { label:'AI capability', value:caps?.ai
      ? `${AI_MODEL_LABEL} (${caps.aiState || 'idle'})`
      : 'Unavailable, undeclared, or denied' },
    { label:'Image generation', value:caps?.aiImages
      ? `${AI_IMAGE_MODEL_LABEL} (${caps.aiImageState || 'idle'})`
      : 'Unavailable, undeclared, or denied' },
    ...appProvenanceRows(win, mirrorManifest, mirrorError),
  );
  return rows;
}

function renderAppInfoRows(dlg, rows){
  const grid = dlg.querySelector('.nw-app-info-grid');
  grid.replaceChildren();
  for (const row of rows){
    const dt = document.createElement('dt');
    const dd = document.createElement('dd');
    dt.textContent = row.label;
    if (row.mono){
      const code = document.createElement('code');
      code.textContent = row.value;
      dd.appendChild(code);
    } else {
      dd.textContent = row.value;
    }
    grid.append(dt, dd);
  }
  dlg._diagnosticText = rows.map(row => `${row.label}: ${row.value}`).join('\n');
}

async function renderAppInfo(win){
  const dlg = document.getElementById('nw-app-info-dialog');
  if (!dlg || appInfoWindow !== win) return;
  const token = ++appInfoRenderToken;
  dlg.querySelector('.nw-dlg-title').textContent =
    `App Info — ${win._app?.name || win.dataset.id}`;
  dlg.querySelector('.nw-app-info-status').textContent = 'Loading mirror provenance…';
  renderAppInfoRows(dlg, appDiagnosticRows(win, null, null));
  const { manifest, error } = await loadMirrorManifest();
  if (token !== appInfoRenderToken || appInfoWindow !== win) return;
  renderAppInfoRows(dlg, appDiagnosticRows(win, manifest, error));
  dlg.querySelector('.nw-app-info-status').textContent =
    error ? `Mirror manifest could not be read: ${error}` : 'Live host diagnostics';
}

function refreshOpenAppInfo(win){
  const dlg = document.getElementById('nw-app-info-dialog');
  if (dlg?.open && appInfoWindow === win) void renderAppInfo(win);
}

function showAppInfo(win){
  let dlg = document.getElementById('nw-app-info-dialog');
  if (!dlg){
    dlg = document.createElement('dialog');
    dlg.id = 'nw-app-info-dialog';
    dlg.className = 'nw-dlg nw-app-info';
    dlg.setAttribute('aria-labelledby', 'nw-app-info-title');
    dlg.setAttribute('aria-describedby', 'nw-app-info-intro');
    dlg.innerHTML = `
      <form method="dialog" class="nw-dlg-form">
        <h2 class="nw-dlg-title" id="nw-app-info-title">App Info</h2>
        <p class="nw-app-info-intro" id="nw-app-info-intro">
          Runtime details for this window. Storage names and file contents are not included.
        </p>
        <dl class="nw-app-info-grid" aria-live="polite"></dl>
        <p class="nw-app-info-status" role="status"></p>
        <menu class="nw-dlg-actions">
          <button class="nw-dlg-btn" id="nw-app-info-copy" type="button">Copy diagnostics</button>
          <button class="nw-dlg-btn primary" value="close" autofocus>Close</button>
        </menu>
      </form>`;
    document.body.appendChild(dlg);
    dlg.querySelector('#nw-app-info-copy').addEventListener('click', async () => {
      const status = dlg.querySelector('.nw-app-info-status');
      try {
        await navigator.clipboard.writeText(dlg._diagnosticText || '');
        status.textContent = 'Diagnostics copied';
      } catch(_){
        status.textContent = 'Copy unavailable in this browser';
      }
    });
    dlg.addEventListener('close', () => {
      appInfoWindow = null;
      appInfoRenderToken++;
    });
  }
  appInfoWindow = win;
  if (!dlg.open) dlg.showModal();
  void renderAppInfo(win);
}

function makeWindow(opts){
  const { id, title, width=520, height=420, badge, sandboxed, app } = opts;
  if (openWindows[id]) { focusWindow(openWindows[id]); return openWindows[id]; }
  const root = document.getElementById('overlay-root');
  const win = document.createElement('div');
  win.className = 'nw-window';
  win.dataset.id = id;
  win._app = app || APPS.find(item => item.id === id) || null;
  win.style.width = width + 'px';
  win.style.height = height + 'px';
  // Restore saved position if it exists and is at least partially in-viewport;
  // otherwise fall back to centered placement with cascading offset.
  const saved = state.layout.windowPositions[id];
  if (saved && saved.w > 200) win.style.width = saved.w + 'px';
  if (saved && saved.h > 150) win.style.height = saved.h + 'px';
  const area = document.getElementById('icon-grid').getBoundingClientRect();
  let px, py;
  if (saved && typeof saved.x === 'number' && typeof saved.y === 'number'
      && saved.x > -width + 80 && saved.x < innerWidth - 80
      && saved.y > 40 && saved.y < innerHeight - 40){
    px = saved.x;
    py = saved.y;
  } else {
    const offset = (Object.keys(openWindows).length % 8) * 24;
    px = Math.max(20, (area.width - width) / 2 + offset);
    py = Math.max(area.top + 20, (area.height - height) / 2 - 40 + offset + area.top);
  }
  win.style.left = px + 'px';
  win.style.top = py + 'px';
  win.innerHTML = `
    <div class="nw-titlebar">
      ${sandboxed ? `<span class="nw-title-sandbox" title="Runs in an isolated origin. NakliOS can't read its data, and it can't reach back into NakliOS.">🔒 sandboxed</span>` : ''}
      ${badge ? `<span class="nw-title-badge">${badge}</span>` : ''}
      <span class="nw-title">${_dlgEscape(title)}</span>
      <button class="nw-info-btn" title="App Info" aria-label="App Info">ⓘ</button>
      <button class="nw-min-btn" title="Minimize (click dock to restore)" aria-label="Minimize">—</button>
      <button class="nw-fs-btn" title="Maximize / restore (Esc to exit)" aria-label="Maximize">⛶</button>
      <button class="nw-close" aria-label="Close">✕</button>
    </div>
    <div class="nw-body"></div>
    <div class="nw-rz e" data-dir="e"></div>
    <div class="nw-rz w" data-dir="w"></div>
    <div class="nw-rz s" data-dir="s"></div>
    <div class="nw-rz se" data-dir="se"></div>
    <div class="nw-rz sw" data-dir="sw"></div>
  `;
  root.appendChild(win);
  fitWindowToViewport(win);
  openWindows[id] = win;
  win.addEventListener('pointerdown', () => focusWindow(win));
  win.querySelector('.nw-close').addEventListener('click', e => {
    e.stopPropagation(); closeWindow(win);
  });
  win.querySelector('.nw-info-btn').addEventListener('click', e => {
    e.stopPropagation(); showAppInfo(win);
  });
  win.querySelector('.nw-fs-btn').addEventListener('click', e => {
    e.stopPropagation(); toggleFullscreen(win);
  });
  win.querySelector('.nw-min-btn').addEventListener('click', e => {
    e.stopPropagation(); minimizeWindow(win);
  });
  makeDraggable(win);
  makeResizable(win);
  focusWindow(win);
  return win;
}

// Drag-to-resize from the side/bottom handles. Mirrors makeDraggable: the iframe
// is made pointer-transparent during the drag, and the new size persists to
// windowPositions so reopen/reload restores it.
function makeResizable(win){
  win.querySelectorAll('.nw-rz').forEach(handle => {
    handle.addEventListener('pointerdown', e => {
      if (isMobile()) return;
      if (e.button !== 0) return;
      if (win.classList.contains('is-fullscreen')) return;
      e.preventDefault(); e.stopPropagation();
      const dir = handle.dataset.dir || '';
      const startX = e.clientX, startY = e.clientY;
      const r = win.getBoundingClientRect();
      const origW = r.width, origH = r.height, origLeft = parseFloat(win.style.left) || r.left;
      const minW = 280, minH = 200;
      win.classList.add('is-dragging');
      focusWindow(win);
      const onMove = ev => {
        const dx = ev.clientX - startX, dy = ev.clientY - startY;
        if (dir.includes('e')) win.style.width = Math.max(minW, origW + dx) + 'px';
        if (dir.includes('s')) win.style.height = Math.max(minH, origH + dy) + 'px';
        if (dir.includes('w')) {
          const w = Math.max(minW, origW - dx);
          win.style.width = w + 'px';
          win.style.left = (origLeft + (origW - w)) + 'px';
        }
      };
      const onUp = () => {
        win.classList.remove('is-dragging');
        document.removeEventListener('pointermove', onMove);
        document.removeEventListener('pointerup', onUp);
        document.removeEventListener('pointercancel', onUp);
        if (win.dataset.id && !win.classList.contains('is-fullscreen')){
          const cur = state.layout.windowPositions[win.dataset.id] || {};
          state.layout.windowPositions[win.dataset.id] = {
            ...cur,
            x: parseFloat(win.style.left) || cur.x || 0,
            y: parseFloat(win.style.top) || cur.y || 0,
            w: parseFloat(win.style.width) || cur.w,
            h: parseFloat(win.style.height) || cur.h,
          };
          saveLayout();
        }
      };
      document.addEventListener('pointermove', onMove);
      document.addEventListener('pointerup', onUp);
      document.addEventListener('pointercancel', onUp);
    });
  });
}

let fullscreenWin = null;
let fullscreenSaved = null;

function fitWindowToViewport(win){
  if (!win?.isConnected) return;
  const grid = document.getElementById('icon-grid')?.getBoundingClientRect();
  if (!grid) return;
  if (isMobile()){
    if (!win.classList.contains('is-mobile-window')){
      win._desktopGeometry = {
        left:win.style.left,
        top:win.style.top,
        width:win.style.width,
        height:win.style.height,
      };
    }
    win.classList.add('is-mobile-window');
    win.style.left = grid.left + 'px';
    win.style.top = grid.top + 'px';
    win.style.width = grid.width + 'px';
    win.style.height = grid.height + 'px';
    return;
  }
  if (win.classList.contains('is-mobile-window')){
    win.classList.remove('is-mobile-window');
    const saved = win._desktopGeometry;
    if (saved){
      win.style.left = saved.left;
      win.style.top = saved.top;
      win.style.width = saved.width;
      win.style.height = saved.height;
    }
    win._desktopGeometry = null;
  }
}

function toggleFullscreen(win){
  if (fullscreenWin === win){
    // restore
    if (fullscreenSaved){
      win.style.left = fullscreenSaved.left;
      win.style.top = fullscreenSaved.top;
      win.style.width = fullscreenSaved.width;
      win.style.height = fullscreenSaved.height;
    }
    win.classList.remove('is-fullscreen');
    win.querySelector('.nw-fs-btn').textContent = '⛶';
    fullscreenWin = null;
    fullscreenSaved = null;
  } else {
    if (fullscreenWin) toggleFullscreen(fullscreenWin);
    fullscreenSaved = {
      left: win.style.left,
      top: win.style.top,
      width: win.style.width,
      height: win.style.height,
    };
    const grid = document.getElementById('icon-grid').getBoundingClientRect();
    win.style.left = grid.left + 'px';
    win.style.top = grid.top + 'px';
    win.style.width = grid.width + 'px';
    win.style.height = grid.height + 'px';
    win.classList.add('is-fullscreen');
    win.querySelector('.nw-fs-btn').textContent = '⊟';
    fullscreenWin = win;
    focusWindow(win);
  }
}

function updateDock(){
  const dock = document.getElementById('nw-dock');
  if (!dock) return;
  // identify which window is on top by z-index (skip minimized)
  let topId = null, topZval = -1;
  for (const [id, w] of Object.entries(openWindows)){
    if (w.classList.contains('is-minimized')) continue;
    const z = parseInt(w.style.zIndex, 10) || 0;
    if (z > topZval){ topZval = z; topId = id; }
  }
  dock.innerHTML = '';

  const pinned = state.layout.pinned || [];
  // Helper: find the icon source (app or folder) by id
  const findIcon = (id) => APPS.find(a => a.id === id) || FOLDERS.find(f => f.id === id);

  // Build sequence: pinned items first, then any running windows that aren't pinned
  const sequence = [];
  for (const id of pinned){
    const icon = findIcon(id);
    if (!icon) continue;
    sequence.push({ id, icon, pinned:true, open: !!openWindows[id] });
  }
  let addedSep = false;
  for (const id of Object.keys(openWindows)){
    if (pinned.includes(id)) continue;
    const icon = findIcon(id);
    if (!icon) continue;
    if (!addedSep && sequence.length){
      sequence.push({ separator:true });
      addedSep = true;
    }
    sequence.push({ id, icon, pinned:false, open:true });
  }

  for (const it of sequence){
    if (it.separator){
      const sep = document.createElement('div');
      sep.className = 'nw-dock-sep';
      dock.appendChild(sep);
      continue;
    }
    const w = openWindows[it.id];
    const isFolder = it.icon.kind === 'folder';
    const btn = document.createElement('button');
    btn.className = 'nw-dock-item'
      + (it.id === topId ? ' is-active' : '')
      + (it.open ? ' is-open' : '');
    btn.title = it.icon.name + (it.pinned ? '  ·  pinned' : '');
    btn.dataset.appId = it.id;
    btn.innerHTML = it.icon.svg
      ? `<svg class="nw-icon-svg nw-dock-item-svg" viewBox="0 0 24 24" aria-hidden="true">${it.icon.svg}</svg>`
      : `<span class="nw-dock-item-glyph">${_dlgEscape(it.icon.glyph || it.icon.name.charAt(0))}</span>`;
    btn.addEventListener('click', () => {
      if (btn._wasDragged) { btn._wasDragged = false; return; }
      if (w){
        if (fullscreenWin && fullscreenWin !== w) toggleFullscreen(fullscreenWin);
        focusWindow(w);
      } else if (isFolder){
        openFolder(it.icon);
      } else {
        openApp(it.icon);
      }
    });
    btn.addEventListener('contextmenu', e => {
      e.preventDefault();
      showContextMenu(e.clientX, e.clientY, [
        { label: it.pinned ? 'Unpin from dock' : 'Pin to dock',
          onClick: () => it.pinned ? unpinItem(it.id) : pinItem(it.id) },
      ]);
    });
    if (it.pinned){
      btn.addEventListener('pointerdown', e => {
        if (e.button !== 0) return;
        const startX = e.clientX;
        let dragging = false;
        const onMove = ev => {
          if (!dragging && Math.abs(ev.clientX - startX) > 5){
            dragging = true;
            btn.style.opacity = '0.5';
            btn.style.transition = 'none';
          }
          if (dragging) btn.style.transform = `translateX(${ev.clientX - startX}px)`;
        };
        const onUp = ev => {
          document.removeEventListener('pointermove', onMove);
          document.removeEventListener('pointerup', onUp);
          btn.style.transform = '';
          btn.style.opacity = '';
          btn.style.transition = '';
          if (!dragging) return;
          btn._wasDragged = true;
          const target = document.elementFromPoint(ev.clientX, ev.clientY)?.closest('.nw-dock-item');
          if (target && target !== btn && target.dataset.appId && (state.layout.pinned || []).includes(target.dataset.appId)){
            const fromId = it.id;
            const toId = target.dataset.appId;
            const pinned = (state.layout.pinned || []).filter(x => x !== fromId);
            const targetIdx = pinned.indexOf(toId);
            if (targetIdx >= 0){
              pinned.splice(targetIdx, 0, fromId);
              state.layout.pinned = pinned;
              saveLayout();
              updateDock();
            }
          }
          setTimeout(() => { btn._wasDragged = false; }, 50);
        };
        document.addEventListener('pointermove', onMove);
        document.addEventListener('pointerup', onUp);
      });
    }
    dock.appendChild(btn);
  }
}

function focusWindow(win){
  if (win.classList.contains('is-minimized')) win.classList.remove('is-minimized');
  if (topZ > 9000){
    Object.values(openWindows)
      .sort((a, b) => (+a.style.zIndex || 0) - (+b.style.zIndex || 0))
      .forEach((w, i) => w.style.zIndex = 100 + i);
    topZ = 100 + Object.keys(openWindows).length;
  }
  win.style.zIndex = ++topZ;
  updateDock();
}

function minimizeWindow(win){
  if (fullscreenWin === win) toggleFullscreen(win);
  win.classList.add('is-minimized');
  updateDock();
}

function closeWindow(win){
  if (win._closing) return;
  const iframe = win.querySelector('iframe');
  if (iframe && win._sdkFeatures?.beforeCloseAck){
    win._closing = true;
    const requestId = `close_${Date.now()}_${Math.random().toString(36).slice(2)}`;
    win._closeRequestId = requestId;
    win._closeAckTimer = setTimeout(() => finalizeCloseWindow(win), 5000);
    try {
      iframe.contentWindow.postMessage({ type:'naklios:beforeclose', requestId }, '*');
      return;
    } catch(_){}
  }
  finalizeCloseWindow(win);
}

function finalizeCloseWindow(win){
  if (!win?.isConnected) return;
  const id = win.dataset.id;
  if (fullscreenWin === win){ fullscreenWin = null; fullscreenSaved = null; }
  if (appInfoWindow === win){
    document.getElementById('nw-app-info-dialog')?.close();
  }
  clearTimeout(win._skeletonTimeout);
  clearTimeout(win._closeAckTimer);
  try { win._beforeClose?.(); } catch(_){}
  delete openWindows[id];
  const iframe = win.querySelector('iframe');
  if (iframe){
    if (!win._sdkFeatures?.beforeCloseAck) {
      try { iframe.contentWindow.postMessage({ type:'naklios:beforeclose' }, '*'); } catch(_){}
    }
    fsHostUnsubscribeSource(iframe.contentWindow);
    releaseFileGrantsForSource(iframe.contentWindow);
    aiHostCancelSource(iframe.contentWindow);
    knownIframes.delete(iframe.contentWindow);
  }
  win.remove();
  updateDock();
}

function makeDraggable(win){
  const bar = win.querySelector('.nw-titlebar');
  bar.addEventListener('pointerdown', e => {
    if (isMobile()) return;
    // Don't start a drag from the title buttons or interactive children
    if (e.target.closest('.nw-close, .nw-fs-btn, button')) return;
    if (e.button !== 0) return;
    e.preventDefault(); // suppress text selection inside the titlebar
    const startX = e.clientX, startY = e.clientY;
    const origX = parseFloat(win.style.left) || 0;
    const origY = parseFloat(win.style.top) || 0;
    bar.classList.add('dragging');
    win.classList.add('is-dragging');
    focusWindow(win);

    const onMove = ev => {
      const x = origX + (ev.clientX - startX);
      const y = Math.max(50, origY + (ev.clientY - startY));
      win.style.left = x + 'px';
      win.style.top = y + 'px';
    };
    const onUp = () => {
      bar.classList.remove('dragging');
      win.classList.remove('is-dragging');
      document.removeEventListener('pointermove', onMove);
      document.removeEventListener('pointerup', onUp);
      document.removeEventListener('pointercancel', onUp);
      // Persist position so reopen / reload restores it
      if (win.dataset.id && !win.classList.contains('is-fullscreen')){
        state.layout.windowPositions[win.dataset.id] = {
          x: parseFloat(win.style.left) || 0,
          y: parseFloat(win.style.top) || 0,
        };
        saveLayout();
      }
    };
    document.addEventListener('pointermove', onMove);
    document.addEventListener('pointerup', onUp);
    document.addEventListener('pointercancel', onUp);
  });
}

function spawnInlineWindow(app){
  const builder = Classics[app.id];
  if (!builder) return window.open(app.url || '#', '_blank', 'noopener');
  const sizes = {
    minesweeper: {w:260, h:380},
    solitaire: {w:520, h:480},
    spider: {w:740, h:540},
    calculator: {w:260, h:360},
    notepad: {w:820, h:580},
  };
  const sz = sizes[app.id] || {w:480, h:380};
  const win = makeWindow({ id:app.id, title:app.name, width:sz.w, height:sz.h, app });
  win._launchTiming = { started:performance.now(), loaded:0, ready:0, timeout:null };
  win._capabilities = app.hostStorage
    ? capabilitySnapshot(app.id)
    : { fs:false, fsBackends:[], fsBackend:null };
  const body = win.querySelector('.nw-body');
  builder(body, win);
}

function themedAppUrl(app, options = {}){
  // Pass current theme so cooperating apps can inherit OS color scheme.
  // Apps that don't read these params see them as ignored extras.
  // For iframe embedding prefer app.embedUrl (same-origin mirror under naklios.dev/apps/<id>/);
  // fall back to app.url (canonical, cross-origin). Same-origin enables FSA picker etc.
  const base = app.embedUrl || app.url;
  const sep = base.includes('?') ? '&' : '?';
  const action = options.action
    ? `&naklios-action=${encodeURIComponent(options.action)}`
    : '';
  return `${base}${sep}naklios-theme=${encodeURIComponent(state.theme)}${action}`;
}

function markIframeLaunchPhase(win, phase){
  if (!win) return;
  const timing = win._launchTiming;
  if (timing && timing[phase] == null){
    timing[phase] = performance.now() - timing.started;
    console.debug(`NakliOS: ${win.dataset.id} ${phase} in ${Math.round(timing[phase])}ms`);
  }
  // Either a cooperative ready signal or the browser's definitive document
  // load is enough to reveal the app. The timeout remains only as a safety net
  // for browsers that fail to deliver either event.
  clearTimeout(win._skeletonTimeout);
  win.querySelector('.nw-skeleton')?.remove();
  refreshOpenAppInfo(win);
}

function spawnIframeWindow(app, options = {}){
  const embedSrc = themedAppUrl(app, options);
  // Same-origin mirrors (naklios.dev/apps/<id>/) drop the sandbox so FSA/OPFS
  // picker etc. work. Cross-origin apps keep the sandbox — that's the privacy
  // wall the "🔒 sandboxed" badge promises.
  let isSameOrigin = false;
  try { isSameOrigin = new URL(embedSrc, location.href).origin === location.origin; } catch(_){}
  const forceOpaqueSandbox = app.thirdParty === true;
  const sandboxed = forceOpaqueSandbox || !isSameOrigin;

  const win = makeWindow({
    id:app.id, title:app.name, width:980, height:640,
    sandboxed,
    app,
  });
  const body = win.querySelector('.nw-body');
  body.classList.add('has-iframe');

  // Loading skeleton — removed on naklios:ready, iframe load, or a last-resort
  // timeout. Cooperative apps can reveal themselves before the load event.
  const skel = document.createElement('div');
  skel.className = 'nw-skeleton';
  const iconHTML = app.svg
    ? `<svg class="nw-skeleton-svg" viewBox="0 0 24 24" aria-hidden="true">${app.svg}</svg>`
      : `<div class="nw-skeleton-glyph">${_dlgEscape(app.glyph || app.name.charAt(0))}</div>`;
  skel.innerHTML = `${iconHTML}<div class="nw-skeleton-name">${_dlgEscape(app.name)}</div><div class="nw-skeleton-bar"></div>`;
  body.appendChild(skel);
  win._launchTiming = { started: performance.now(), loaded: null, ready: null, timeout: null };
  win._skeletonTimeout = setTimeout(() => markIframeLaunchPhase(win, 'timeout'), 15000);

  const iframe = document.createElement('iframe');
  if (forceOpaqueSandbox) {
    // User-installed apps get scripts and ordinary interaction, but never
    // allow-same-origin. Their document therefore receives an opaque origin
    // and cannot become a privileged NakliOS peer.
    iframe.setAttribute('sandbox', 'allow-scripts allow-popups allow-forms allow-downloads');
  } else if (!isSameOrigin) {
    iframe.setAttribute('sandbox', 'allow-same-origin allow-scripts allow-popups allow-forms allow-downloads');
  }
  iframe.setAttribute('referrerpolicy', 'no-referrer');
  iframe.title = app.name;
  iframe.src = embedSrc;
  win._embedSrc = embedSrc;
  win._isSameOrigin = isSameOrigin && !forceOpaqueSandbox;
  body.appendChild(iframe);
  // Register synchronously so messages posted by the iframe's first scripts
  // (typically naklios.title / naklios.ready) aren't dropped by the host's
  // knownIframes guard — the load event fires AFTER the iframe's sync scripts
  // have already postMessaged.
  try { knownIframes.add(iframe.contentWindow); } catch(_){}
  iframe.addEventListener('load', () => {
    markIframeLaunchPhase(win, 'loaded');
    try {
      // Belt-and-suspenders: re-add in case the contentWindow identity changed.
      knownIframes.add(iframe.contentWindow);
      // Send the theme so any listening app can apply it
      const t = THEMES.find(x => x.id === state.theme) || THEMES[0];
      iframe.contentWindow.postMessage({ type:'naklios:theme', theme:t.id, colors:t.colors, mood:t.mood }, '*');
      // Push capabilities (fs availability) so the SDK can flip naklios.capabilities.fs
      postCapabilities(iframe, app.id);
    } catch(_){}
  });
}

// ────────────────────────────────────────────────────────────────────
// Backend abstraction — FSA + Crate share the same naklios.fs.* surface.
// Each backend implements: read / readBinary / write / append / delete /
// exists (op against an `apps/<id>/<path>` string) + list (against an
// `apps/<id>` or `apps/<id>/<subdir>` prefix, returns strings).
// Permission state binds an app to one backend at a time; user can rebind
// via the per-app menu in Settings.
// ────────────────────────────────────────────────────────────────────

const BACKENDS = {
  fsa: {
    id: 'fsa',
    label: 'Folder',
    isConnected(){ return !!state.fsHandle; },
    displayName(){ return state.fsFolderName || ''; },
    async read(safePath){ return await fsRead(safePath); },
    async readBinary(safePath){ return await fsReadBinary(safePath); },
    async write(safePath, data){ await fsWrite(safePath, data); },
    async append(safePath, line){ await fsAppend(safePath, line); },
    async delete(safePath){ await fsDelete(safePath); },
    async exists(safePath){ return await fsExists(safePath); },
    async list(prefix){ return await fsList(prefix); },
    async stat(safePath){ return await fsStat(safePath); },
    async mkdir(safePath){ await fsMkdir(safePath); },
  },
  crate: {
    id: 'crate',
    label: 'Crate',
    isConnected(){ return !!state.crate; },
    displayName(){ return state.crateBucketName || ''; },
    async read(safePath){
      const bytes = await state.crate.read('/' + safePath);
      return new TextDecoder().decode(bytes);
    },
    async readBinary(safePath){
      return await state.crate.read('/' + safePath);
    },
    async write(safePath, data){
      const bytes = (data instanceof Uint8Array) ? data
                   : (typeof data === 'string') ? new TextEncoder().encode(data)
                   : new Uint8Array(data);
      await state.crate.write('/' + safePath, bytes, { mime: guessMime(safePath) });
    },
    async append(safePath, line){
      // Crate has no native append; emulate via read + concat + write.
      // Same semantics as fsAppend in the FSA backend.
      let existing = '';
      try {
        const bytes = await state.crate.read('/' + safePath);
        existing = new TextDecoder().decode(bytes);
      } catch (_){}
      const trail = (line.endsWith('\n') ? line : line + '\n');
      const out = new TextEncoder().encode(existing + trail);
      await state.crate.write('/' + safePath, out, { mime: 'text/plain' });
    },
    async delete(safePath){ await state.crate.remove('/' + safePath); },
    async exists(safePath){ return (await state.crate.stat('/' + safePath)) != null; },
    async list(prefix){
      const entries = await state.crate.list('/' + (prefix || ''));
      // Crate returns objects; FSA returns strings. Normalise to FSA shape.
      return entries.map(e => {
        const p = (e.path || '').replace(/^\//, '');
        return e.isDir && !p.endsWith('/') ? p + '/' : p;
      }).sort();
    },
    // Rig fileops (C0) additions. Crate holds no manifest entry for an implicit
    // directory, so stat() falls back to a prefix listing to report a dir; mkdir
    // is a no-op because directories are implicit on the object store.
    async stat(safePath){
      const s = await state.crate.stat('/' + safePath);
      if (s) return { type: s.isDir ? 'dir' : 'file', size: s.size ?? 0, mtimeMs: s.ts ?? 0 };
      const kids = await state.crate.list('/' + safePath);
      if (Array.isArray(kids) && kids.length) return { type: 'dir', size: 0, mtimeMs: 0 };
      return null;
    },
    async mkdir(_safePath){ /* implicit dirs on the object store — no-op */ },
  },
};

function guessMime(path){
  const ext = (path.split('.').pop() || '').toLowerCase();
  const m = {
    json: 'application/json', jsonl: 'application/x-ndjson',
    txt: 'text/plain', md: 'text/markdown',
    html: 'text/html', css: 'text/css', js: 'application/javascript',
    png: 'image/png', jpg: 'image/jpeg', jpeg: 'image/jpeg',
    gif: 'image/gif', svg: 'image/svg+xml', webp: 'image/webp',
    pdf: 'application/pdf',
  }[ext];
  return m || 'application/octet-stream';
}

function backendsAvailable(){
  const out = [];
  if (BACKENDS.fsa.isConnected()) out.push('fsa');
  if (BACKENDS.crate.isConnected()) out.push('crate');
  return out;
}

// Rig fileops (C0) factory. System code (the C2 git adapter, Forge) builds a
// live fileops instance over a bound storage backend. Deliberately NOT exposed
// on window — window.rig is C4's developer-gated surface, off by default.
let _rigFileopsMod = null;
async function rigFileops({ root = '', backendId } = {}){
  const bid = backendId || backendsAvailable()[0];
  if (!bid) throw new Error('No storage backend connected');
  if (!_rigFileopsMod) _rigFileopsMod = await import('./sys/rig/fileops/index.mjs');
  return _rigFileopsMod.createFileops({ backend: BACKENDS[bid], root });
}

function backendDescriptor(backendId){
  const backend = BACKENDS[backendId];
  if (!backend || !backend.isConnected()) return null;
  return {
    id: backend.id,
    label: backend.label,
    name: backend.displayName(),
  };
}

function appBoundBackend(appId){
  const v = state.appPermissions[appId];
  // Report the legacy grant as its original FSA binding without mutating
  // persisted state merely because an iframe requested capabilities.
  if (v === 'granted' && BACKENDS.fsa.isConnected()) return 'fsa';
  if (v && typeof v === 'object' && v.granted && v.backend &&
      BACKENDS[v.backend]?.isConnected()) return v.backend;
  return null;
}

// Migrate legacy 'granted'|'denied' strings to {backend, granted} shape.
// Lazy — runs on first read of an appId after the v2.19 upgrade.
function migrateAppPermission(appId){
  const v = state.appPermissions[appId];
  if (v == null || typeof v !== 'string') return;
  if (v === 'denied'){
    state.appPermissions[appId] = { granted: false };
  } else if (v === 'granted'){
    // The legacy value was always FSA-only. Preserve that binding so an
    // upgrade doesn't silently grant the app access to a Crate that's
    // connected for the first time.
    state.appPermissions[appId] = { backend: 'fsa', granted: true };
  }
  saveAppPermissions();
}

// fsEnsurePermission resolves the backend an app should use, prompting
// the user if no decision exists yet. Returns the backend id ('fsa'|'crate')
// on grant, or null on deny / no available backend / cancelled prompt.
async function fsEnsurePermission(appId){
  const app = APPS.find(a => a.id === appId);
  if (app?.thirdParty && !(app.permissions || []).includes('storage')) return null;
  migrateAppPermission(appId);
  const v = state.appPermissions[appId];
  if (v && v.granted === false) return null;
  if (v && v.granted && v.backend){
    // Verify the backend the app was bound to is still connected.
    if (BACKENDS[v.backend]?.isConnected()) return v.backend;
    // Backend was disconnected — fall through to re-prompt.
  }
  const avail = backendsAvailable();
  if (avail.length === 0) return null;
  const name = app?.name || appId;

  let chosen = null;
  if (avail.length === 1){
    const only = BACKENDS[avail[0]];
    const where = only.id === 'fsa'
      ? `in your NakliOS folder (<code>${_dlgEscape(only.displayName())}</code>)`
      : `in your Crate (encrypted, multi-device — <code>${_dlgEscape(only.displayName())}</code>)`;
    const ok = await nakliosConfirm(
      `Let <strong>${_dlgEscape(name)}</strong> read and write its data ${where}?\n\n` +
      `It will be limited to <code>apps/${_dlgEscape(appId)}/</code> — no other apps' data.\n\n` +
      `You can revoke or switch backends later in Settings.`,
      {
        title: `Allow ${name}?`,
        okLabel: 'Allow',
        cancelLabel: 'Deny',
        allowHtmlBody: true,
      }
    );
    if (ok) chosen = only.id;
  } else {
    // Both backends connected — present them as a three-button choice.
    const ans = await _nakliosDialog({
      title: `Where should ${name} store its data?`,
      body:
        `Pick a backend for <strong>${_dlgEscape(name)}</strong>. ` +
        `It will be limited to <code>apps/${_dlgEscape(appId)}/</code>.\n\n` +
        `<strong>Folder</strong> — local: <code>${_dlgEscape(BACKENDS.fsa.displayName())}</code>\n` +
        `<strong>Crate</strong> — encrypted, multi-device: <code>${_dlgEscape(BACKENDS.crate.displayName())}</code>`,
      buttons: [
        { value: 'deny',   label: 'Deny' },
        { value: 'fsa',    label: 'Folder' },
        { value: 'crate',  label: 'Crate', primary: true },
      ],
      allowHtmlBody: true,
    });
    if (ans === 'fsa' || ans === 'crate') chosen = ans;
  }

  if (!chosen){
    state.appPermissions[appId] = { granted: false };
    saveAppPermissions();
    broadcastCapabilities();
    return null;
  }
  state.appPermissions[appId] = { backend: chosen, granted: true };
  saveAppPermissions();
  broadcastCapabilities();
  return chosen;
}

// An app may surface an explicit backend choice in its own storage picker.
// NakliOS still mediates the change: the host names the target, explains that
// switching does not copy data, and requires a user confirmation.
async function fsHostSelectBackend(appId, requestedBackendId){
  const app = APPS.find(a => a.id === appId);
  if (app?.thirdParty && !(app.permissions || []).includes('storage')) {
    throw new Error('This app did not request the storage permission in its installed manifest');
  }
  const target = BACKENDS[requestedBackendId];
  if (!target || !target.isConnected()) throw new Error('Requested backend is not connected');

  migrateAppPermission(appId);
  const currentId = appBoundBackend(appId);
  if (currentId === requestedBackendId) return true;

  // No confirmation on switch: the app is scoped to apps/<id>/ on the user's own
  // connected backend and switching copies or deletes nothing, so the dialog was
  // pure friction. Third-party apps are still gated on the manifest 'storage'
  // permission checked above.
  state.appPermissions[appId] = { backend: target.id, granted: true };
  saveAppPermissions();
  broadcastCapabilities();
  return true;
}

// Resolve { dir, name } for fs reply ops. Throws if path unsafe or no handle.
async function fsHostHandle(msg, type, appId){
  const backendId = await fsEnsurePermission(appId);
  if (!backendId) throw new Error('Permission denied');
  if (msg.backend && msg.backend !== backendId) {
    throw new Error('Storage backend changed before the operation completed; retry on the active backend');
  }
  const backend = BACKENDS[backendId];
  if (!backend.isConnected()) throw new Error('Backend disconnected');
  const safe = fsSafePath(appId, msg.path || '');
  switch (type){
    case 'read':       return await backend.read(safe);
    case 'readBinary': return await backend.readBinary(safe);
    case 'write':      await backend.write(safe, msg.data); return null;
    case 'append':     await backend.append(safe, String(msg.line ?? '')); return null;
    case 'delete':     await backend.delete(safe); return null;
    case 'exists':     return await backend.exists(safe);
  }
  throw new Error('Unknown fs op: ' + type);
}
// list() is the only op that scopes to apps/<id>/ even when path is empty
async function fsHostList(msg, appId){
  const backendId = await fsEnsurePermission(appId);
  if (!backendId) throw new Error('Permission denied');
  if (msg.backend && msg.backend !== backendId) {
    throw new Error('Storage backend changed before the operation completed; retry on the active backend');
  }
  const backend = BACKENDS[backendId];
  if (!backend.isConnected()) throw new Error('Backend disconnected');
  const subPath = (msg.prefix || '').split('/').filter(s => s && s !== '.' && s !== '..').join('/');
  const fullPrefix = subPath ? `apps/${appId}/${subPath}` : `apps/${appId}`;
  const all = await backend.list(fullPrefix);
  const stripPrefix = `apps/${appId}/`;
  return all.map(p => p.startsWith(stripPrefix) ? p.slice(stripPrefix.length) : p);
}

// ── System-scoped filesystem (the whole store, no app clamp) ─────────
// This is the OS-level file surface: it sees every app's apps/<id>/ tree plus
// any top-level files, on whichever backend the ladder resolves to (OPFS/FSA/
// Crate). Only same-origin system apps (non-third-party — the Files manager,
// Anvil) may reach it; third-party apps stay clamped to apps/<id>/ via the
// namespaced route above and never get here. Paths are full-from-store-root;
// list() returns full paths (native backend shape), unlike the namespaced
// list() which strips the app prefix.
function fsSysCleanPath(path, { allowEmpty = false } = {}){
  const raw = typeof path === 'string' ? path : '';
  const segs = raw.split('/').filter(s => s && s !== '.');
  if (segs.some(s => s === '..' || s.startsWith('/'))) throw new Error('Invalid path: ' + raw);
  if (!segs.length && !allowEmpty) throw new Error('Path required');
  return segs.join('/');
}
async function fsSysBackend(msg, appId){
  if (!aiAppIsSystem(appId)) throw new Error('System filesystem is available to system apps only');
  const backendId = await fsEnsurePermission(appId);
  if (!backendId) throw new Error('Permission denied');
  if (msg.backend && msg.backend !== backendId) {
    throw new Error('Storage backend changed before the operation completed; retry on the active backend');
  }
  const backend = BACKENDS[backendId];
  if (!backend.isConnected()) throw new Error('Backend disconnected');
  return backend;
}
async function fsHostSysHandle(msg, op, appId){
  const backend = await fsSysBackend(msg, appId);
  const safe = fsSysCleanPath(msg.path || '');
  switch (op){
    case 'read':       return await backend.read(safe);
    case 'readBinary': return await backend.readBinary(safe);
    case 'write':      await backend.write(safe, msg.data); return null;
    case 'append':     await backend.append(safe, String(msg.line ?? '')); return null;
    case 'delete':     await backend.delete(safe); return null;
    case 'exists':     return await backend.exists(safe);
  }
  throw new Error('Unknown system fs op: ' + op);
}
async function fsHostSysList(msg, appId){
  const backend = await fsSysBackend(msg, appId);
  const prefix = fsSysCleanPath(msg.prefix || '', { allowEmpty: true });
  return await backend.list(prefix);
}

// ── Exact-file handoff ───────────────────────────────────────────────
// Open With never broadens an app's filesystem namespace. The source asks the
// host to mint a window-lifetime grant for one already-scoped text file. The
// target can read/write only that exact path on the backend identity that was
// active when the user approved the handoff.
function fileGrantBackendIdentity(backendId){
  return backendId === 'fsa' ? state.fsHandle
    : backendId === 'crate' ? state.crate
      : null;
}

function newFileGrantToken(){
  if (crypto.randomUUID) return crypto.randomUUID();
  const bytes = crypto.getRandomValues(new Uint8Array(24));
  return Array.from(bytes, byte => byte.toString(16).padStart(2, '0')).join('');
}

function deliverFileGrant(win, token){
  const grant = fileGrants.get(token);
  const iframe = win?.querySelector('iframe');
  if (!grant || !iframe?.contentWindow || win.dataset.id !== grant.targetAppId) return false;
  grant.targetSource = iframe.contentWindow;
  try {
    iframe.contentWindow.postMessage({
      type:'naklios:file:grant',
      grant:{
        token:grant.token,
        name:grant.name,
        path:grant.sourcePath,
        sourceAppId:grant.sourceAppId,
        backend:grant.backendId,
      },
    }, '*');
    return true;
  } catch(_){ return false; }
}

function deliverPendingFileGrants(win){
  if (!win?._sdkReady) return;
  for (const token of win._pendingFileGrantTokens || []) deliverFileGrant(win, token);
  win._pendingFileGrantTokens = [];
}

function releaseFileGrantsForSource(source){
  for (const [token, grant] of fileGrants){
    if (grant.targetSource === source) fileGrants.delete(token);
  }
}

async function fileHostOpenWith(source, msg, sourceAppId){
  const targetAppId = String(msg.appId || '');
  if (targetAppId !== 'editor') throw new Error('That app is not an approved file editor');
  const target = APPS.find(app => app.id === targetAppId && app.kind === 'system');
  if (!target) throw new Error('Editor is unavailable');
  const sourcePath = String(msg.path || '').replace(/^\/+/, '');
  if (!sourcePath || !EDITABLE_FILE_RE.test(sourcePath)) {
    throw new Error('Editor opens text and source-code files up to 2 MB');
  }
  const backendId = await fsEnsurePermission(sourceAppId);
  if (!backendId) throw new Error('Storage permission denied');
  if (msg.backend && msg.backend !== backendId) {
    throw new Error('Storage backend changed before Open With completed');
  }
  const backend = BACKENDS[backendId];
  const safePath = fsSafePath(sourceAppId, sourcePath);
  const data = await backend.read(safePath);
  if (String(data).length > FILE_GRANT_MAX_CHARS) {
    throw new Error('Editor opens text files up to 2 MB');
  }
  const sourceName = APPS.find(app => app.id === sourceAppId)?.name || sourceAppId;
  const name = sourcePath.split('/').filter(Boolean).at(-1) || 'Untitled';
  const allowed = await nakliosConfirm(
    `Open <code>${_dlgEscape(name)}</code> from <strong>${_dlgEscape(sourceName)}</strong> in Editor?\n\n` +
    `Editor receives access to this file only. Saving writes back to the same ${_dlgEscape(backend.label)} file while the Editor window remains open.`,
    {
      title:'Open with Editor?',
      okLabel:'Open in Editor',
      cancelLabel:'Cancel',
      allowHtmlBody:true,
    },
  );
  if (!allowed) return false;

  const token = newFileGrantToken();
  fileGrants.set(token, {
    token,
    targetAppId,
    sourceAppId,
    sourcePath,
    safePath,
    name,
    backendId,
    backendIdentity:fileGrantBackendIdentity(backendId),
    targetSource:null,
  });
  openApp(target, { action:'open-file' });
  const win = openWindows[targetAppId];
  if (!win) {
    fileGrants.delete(token);
    throw new Error('Editor could not be opened');
  }
  win._pendingFileGrantTokens = [...(win._pendingFileGrantTokens || []), token];
  deliverPendingFileGrants(win);
  return true;
}

async function fileHostHandle(source, msg, targetAppId, op){
  const token = String(msg.token || '');
  const grant = fileGrants.get(token);
  if (!grant || grant.targetSource !== source || grant.targetAppId !== targetAppId) {
    throw new Error('File grant is missing or expired');
  }
  const backend = BACKENDS[grant.backendId];
  if (!backend?.isConnected() || fileGrantBackendIdentity(grant.backendId) !== grant.backendIdentity) {
    fileGrants.delete(token);
    throw new Error('The original storage location disconnected; reopen the file from Files');
  }
  if (op === 'read') {
    const data = String(await backend.read(grant.safePath));
    if (data.length > FILE_GRANT_MAX_CHARS) throw new Error('File grew beyond the 2 MB Editor limit');
    return {
      data,
      name:grant.name,
      path:grant.sourcePath,
      sourceAppId:grant.sourceAppId,
      backend:grant.backendId,
    };
  }
  if (op === 'write') {
    const data = String(msg.data ?? '');
    if (data.length > FILE_GRANT_MAX_CHARS) throw new Error('Editor writes text files up to 2 MB');
    await backend.write(grant.safePath, data);
    return null;
  }
  throw new Error('Unknown file-grant operation');
}

// ════════════════════════════════════════════════════════════════════
// INFERENCE BROKER
// ════════════════════════════════════════════════════════════════════
// NakliOS presents narrow chat and image-generation capabilities to apps. The
// selected runtime can be a vendored LocalMind worker, a local compatible
// server, or a cloud BYOK endpoint. Apps never receive a worker, model object,
// another app's queue entry, filesystem capability, endpoint URL, or API key.
const AI_PROTOCOL = 'localmind.inference.v1';
const AI_IMAGE_PROTOCOL = 'localmind.image.v1';
const AI_SETTINGS_KEY = 'nakliOS.aiSettings.v1';
const AI_SESSION_KEY = 'nakliOS.aiEndpointKey.session.v1';
const AI_REMEMBERED_KEY = 'nakliOS.aiEndpointKey.remembered.v1';
// Saved credentials — a NAMED inventory, deliberately separate from the
// origin-keyed active credential above, which holds exactly one key per origin
// and cannot tell two OpenRouter keys apart or say when either was added.
// Nothing here is ever selected automatically: a key that runs out is a decision
// for the person, not a silent failover to a provider they did not choose.
const AI_KEY_VAULT = 'nakliOS.aiKeyVault.v1';
const AI_MAX_QUEUE = 12;

function aiReadSettings(){
  let saved = {};
  try { saved = JSON.parse(localStorage.getItem(AI_SETTINGS_KEY) || '{}') || {}; } catch(_){}
  const validModel = saved.modelKey === 'endpoint' ||
    globalThis.LocalMindHostCatalog.models.some(model => model.key === saved.modelKey);
  const preset = AI_ENDPOINT_PRESETS[saved.endpoint?.preset]
    ? saved.endpoint.preset
    : AI_DEFAULT_SETTINGS.endpoint.preset;
  const validImageModel = saved.imageModelKey === 'endpoint' ||
    globalThis.LocalMindHostCatalog.imageModels.some(
      model => model.key === saved.imageModelKey
    );
  const imagePreset = AI_IMAGE_ENDPOINT_PRESETS[saved.imageEndpoint?.preset]
    ? saved.imageEndpoint.preset
    : AI_DEFAULT_SETTINGS.imageEndpoint.preset;
  return {
    modelKey:validModel ? saved.modelKey : AI_DEFAULT_SETTINGS.modelKey,
    endpoint:{
      preset,
      baseUrl:String(saved.endpoint?.baseUrl || AI_ENDPOINT_PRESETS[preset].baseUrl || ''),
      model:String(saved.endpoint?.model || ''),
      rememberKey:saved.endpoint?.rememberKey === true,
    },
    imageModelKey:validImageModel
      ? saved.imageModelKey
      : AI_DEFAULT_SETTINGS.imageModelKey,
    imageEndpoint:{
      preset:imagePreset,
      baseUrl:String(
        saved.imageEndpoint?.baseUrl ||
        AI_IMAGE_ENDPOINT_PRESETS[imagePreset].baseUrl ||
        ''
      ),
      model:String(
        saved.imageEndpoint?.model ||
        AI_IMAGE_ENDPOINT_PRESETS[imagePreset].model ||
        ''
      ),
      rememberKey:saved.imageEndpoint?.rememberKey === true,
    },
  };
}

function aiNormaliseEndpointBase(value){
  const raw = String(value || '').trim().replace(/\/+$/, '');
  if (!raw) return '';
  const url = new URL(raw);
  if (url.protocol !== 'https:' && url.protocol !== 'http:') {
    throw new Error('AI endpoint must use https:// or http://');
  }
  if (url.protocol === 'http:' && !aiEndpointIsLocal(url.href)) {
    throw new Error('External AI endpoints must use HTTPS; HTTP is allowed only for local services');
  }
  return url.href.replace(/\/+$/, '');
}

function aiEndpointIsLocal(baseUrl){
  try {
    const host = new URL(baseUrl).hostname.toLowerCase();
    return host === 'localhost' || host === '127.0.0.1' ||
      host === '::1' || host === '[::1]' ||
      host.endsWith('.local') || host.startsWith('10.') ||
      host.startsWith('192.168.') ||
      /^172\.(1[6-9]|2\d|3[01])\./.test(host);
  } catch(_) {
    return false;
  }
}

function aiSelectedModel(){
  if (aiSettings.modelKey === 'endpoint'){
    let baseUrl = '';
    try { baseUrl = aiNormaliseEndpointBase(aiSettings.endpoint.baseUrl); } catch(_){}
    const preset = AI_ENDPOINT_PRESETS[aiSettings.endpoint.preset] || AI_ENDPOINT_PRESETS.custom;
    const model = String(aiSettings.endpoint.model || '').trim();
    const local = aiEndpointIsLocal(baseUrl);
    return {
      key:'endpoint',
      id:model || 'endpoint',
      label:model ? `${preset.label} · ${model}` : `${preset.label} endpoint`,
      description:local
        ? 'Runs through a service on this device or local network.'
        : 'Runs through an external provider using your API key.',
      runtime:'endpoint',
      scope:local ? 'local-endpoint' : 'external',
      baseUrl,
      model,
      preset:aiSettings.endpoint.preset,
      generationConfig:{},
    };
  }
  return {
    ...globalThis.LocalMindHostCatalog.get(aiSettings.modelKey),
    scope:'device',
  };
}

// ── On-device model — Chrome's built-in Gemini Nano (Prompt API) ────────
// GENERAL-PURPOSE ONLY. Nano is the zero-config default for non-agent (GP)
// completions whenever the browser exposes it. The agent tier (tool-calling,
// Anvil/Forge) NEVER uses Nano — it resolves to the user's configured endpoint,
// and the existing "tool-calling requires an endpoint" gate applies from there.
// Availability is async, so it's probed once at boot and cached.
const aiNano = { checked:false, available:false, downloadable:false };
// Apps that consume the HOST agent tier (tool-calling coding). They report their
// configured model and their agent requests never touch Nano. Apps with their
// own agent stacks are migrated onto this split one at a time.
const AI_HOST_AGENT_APPS = new Set(['anvil', 'forge']);
function aiOnDeviceApi(){
  return (typeof self !== 'undefined' && 'LanguageModel' in self) ? self.LanguageModel : null;
}
async function aiProbeNano(){
  aiNano.checked = true;
  const api = aiOnDeviceApi();
  if (!api){ aiNano.available = false; aiNano.downloadable = false; return; }
  try {
    const status = await api.availability();
    aiNano.available = status === 'available';
    aiNano.downloadable = status === 'downloadable' || status === 'downloading';
  } catch(_){ aiNano.available = false; aiNano.downloadable = false; }
}
function aiNanoModel(){
  return {
    key:'nano', id:'gemini-nano', label:'Gemini Nano (on-device)',
    description:"Chrome's built-in on-device model — private, offline, zero setup. General-purpose only; coding uses your configured endpoint.",
    runtime:'ondevice', scope:'device', generationConfig:{},
  };
}
// Tier-aware model resolution. The single model selection is the AGENT-tier
// transport (coding). GP defaults to on-device Nano whenever it's available —
// wired in by default — and only falls back to the selected model when Nano
// isn't there. (A separate GP-tier model selector, to let a user point GP at an
// endpoint too, is a clean follow-up.) Agent → the selection, never Nano.
function aiResolveModel(wantsAgent){
  const selected = aiSelectedModel();
  if (wantsAgent) return selected;
  if (aiNano.available) return aiNanoModel();
  return selected;
}
// GP availability: Nano covers the general tier even without WebGPU or an endpoint.
function aiGeneralRuntimeAvailable(){
  return aiNano.available || aiRuntimeAvailable(aiSelectedModel());
}

function aiRefreshSelectedModel(){

  AI_MODEL_ID = selected.id;

  AI_IMAGE_MODEL_LABEL = imageSelected.runtime === 'endpoint-image'
    ? imageSelected.label
    : `LocalMind · ${imageSelected.label}`;
}

// Probe on-device (Gemini Nano) availability once at boot; re-broadcast so
// general-purpose apps pick it up as their zero-config default without a reload.
void aiProbeNano().then(() => { try { broadcastCapabilities(); } catch(_){} });

function aiCredentialId(baseUrl){
  try { return new URL(aiNormaliseEndpointBase(baseUrl)).origin; } catch(_) { return ''; }
}

function aiReadCredentialStore(storage, key){
  try {
    const parsed = JSON.parse(storage.getItem(key) || '{}');
    return parsed && typeof parsed === 'object' && !Array.isArray(parsed) ? parsed : {};
  } catch(_) {
    return {};
  }
}

function aiWriteCredentialStore(storage, key, value){
  if (Object.keys(value).length) storage.setItem(key, JSON.stringify(value));
  else storage.removeItem(key);
}

// ── saved credentials ────────────────────────────────────────────────────────
// An entry carries the endpoint it belongs to, not just the secret: a Groq key
// pointed at DeepSeek's URL is a 401, so restoring one has to restore the whole
// working combination in a single click. That is the entire point when the key
// you were using has just hit its daily cap.
function aiVaultRead(){
  try {
    const raw = JSON.parse(localStorage.getItem(AI_KEY_VAULT) || '[]');
    return Array.isArray(raw) ? raw.filter(e => e && typeof e === 'object' && e.id) : [];
  } catch(_) { return []; }
}

function aiVaultWrite(entries){
  if (entries.length) localStorage.setItem(AI_KEY_VAULT, JSON.stringify(entries));
  else localStorage.removeItem(AI_KEY_VAULT);
}

function aiVaultSave({ name, preset, baseUrl, model, key }){
  const clean = String(key || '').trim();
  if (!clean) throw new Error('Enter the API key before saving it.');
  const label = String(name || '').trim() || (AI_ENDPOINT_PRESETS[preset]?.label || 'Saved key');
  const entries = aiVaultRead();
  entries.unshift({
    id: 'k' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6),
    name: label,
    savedAt: new Date().toISOString(),
    preset: String(preset || 'custom'),
    baseUrl: String(baseUrl || ''),
    model: String(model || ''),
    key: clean,
  });
  aiVaultWrite(entries);
  return entries[0];
}

function aiVaultDelete(id){
  aiVaultWrite(aiVaultRead().filter(e => e.id !== id));
}

// Only ever called from an explicit click. Installs the entry as the active
// credential for its own origin and hands the endpoint fields back to the caller.
function aiVaultUse(id){
  const entry = aiVaultRead().find(e => e.id === id);
  if (!entry) throw new Error('That saved key is no longer here.');
  aiPersistCredential(entry.baseUrl, true, entry.key);
  return entry;
}

function aiVaultWhen(iso){
  try {
    const d = new Date(iso);
    return d.toLocaleDateString(undefined, { day:'numeric', month:'short' }) + ' ' +
      d.toLocaleTimeString(undefined, { hour:'2-digit', minute:'2-digit' });
  } catch(_) { return ''; }
}

function aiEndpointApiKey(baseUrl = aiSettings.endpoint.baseUrl){
  const credentialId = aiCredentialId(baseUrl);
  if (!credentialId) return '';
  const sessionKeys = aiReadCredentialStore(sessionStorage, AI_SESSION_KEY);
  if (sessionKeys[credentialId]) return sessionKeys[credentialId];
  const rememberedKeys = aiReadCredentialStore(localStorage, AI_REMEMBERED_KEY);
  return rememberedKeys[credentialId] || '';
}

function aiForgetEndpointKey(baseUrl){
  const credentialId = aiCredentialId(baseUrl);
  if (!credentialId) return;
  const sessionKeys = aiReadCredentialStore(sessionStorage, AI_SESSION_KEY);
  const rememberedKeys = aiReadCredentialStore(localStorage, AI_REMEMBERED_KEY);
  delete sessionKeys[credentialId];
  delete rememberedKeys[credentialId];
  aiWriteCredentialStore(sessionStorage, AI_SESSION_KEY, sessionKeys);
  aiWriteCredentialStore(localStorage, AI_REMEMBERED_KEY, rememberedKeys);
}

function aiPersistCredential(baseUrl, rememberKey, apiKey = null){
  const credentialId = aiCredentialId(baseUrl);
  const sessionKeys = aiReadCredentialStore(sessionStorage, AI_SESSION_KEY);
  const rememberedKeys = aiReadCredentialStore(localStorage, AI_REMEMBERED_KEY);
  const clean = apiKey === null ? '' : String(apiKey || '').trim();
  if (credentialId && clean) sessionKeys[credentialId] = clean;
  if (credentialId && rememberKey){
    const keyToRemember = clean || sessionKeys[credentialId] || rememberedKeys[credentialId];
    if (keyToRemember) rememberedKeys[credentialId] = keyToRemember;
  } else if (credentialId) {
    delete rememberedKeys[credentialId];
  }
  aiWriteCredentialStore(sessionStorage, AI_SESSION_KEY, sessionKeys);
  aiWriteCredentialStore(localStorage, AI_REMEMBERED_KEY, rememberedKeys);
}

function aiPersistSettings(next, apiKey = null){
  const sharedImageCredential = next.imageEndpoint?.rememberKey === true &&
    aiCredentialId(next.imageEndpoint.baseUrl) ===
      aiCredentialId(next.endpoint.baseUrl);
  aiPersistCredential(
    next.endpoint.baseUrl,
    next.endpoint.rememberKey || sharedImageCredential,
    apiKey,
  );
  aiSettings = next;
  localStorage.setItem(AI_SETTINGS_KEY, JSON.stringify(aiSettings));
  aiRefreshSelectedModel();
}

function aiPersistImageSettings(next, apiKey = null){
  const sharedChatCredential = next.endpoint?.rememberKey === true &&
    aiCredentialId(next.endpoint.baseUrl) ===
      aiCredentialId(next.imageEndpoint.baseUrl);
  aiPersistCredential(
    next.imageEndpoint.baseUrl,
    next.imageEndpoint.rememberKey || sharedChatCredential,
    apiKey,
  );
  aiSettings = next;
  localStorage.setItem(AI_SETTINGS_KEY, JSON.stringify(aiSettings));
  aiRefreshSelectedModel();
}

function aiPermissionScope(model = aiSelectedModel()){
  if (model.scope === 'device') return 'device';
  let origin = model.baseUrl;
  try { origin = new URL(model.baseUrl).origin; } catch(_){}
  return `${model.scope}:${origin}`;
}

function aiImagePermissionScope(model = aiSelectedImageModel()){
  return `image:${aiPermissionScope(model)}`;
}

function aiPermissionDecision(appId, scope = aiPermissionScope()){
  const saved = state.aiPermissions[appId];
  if (!saved) return null;
  if (scope === 'device' && typeof saved.granted === 'boolean') return saved;
  return saved.scopes?.[scope] || null;
}

  loadListeners:new Set(),

  active:null,

  loadReject:null,
  loadListeners:new Set(),
