// FILESYSTEM (File System Access)
// ════════════════════════════════════════════════════════════════════
// NakliOS owns one folder handle (picked once via showDirectoryPicker, stored
// in IndexedDB). NakliOS shadow-writes its state.json there; cooperative apps
// in Immersive mode read/write under apps/<id>/ via the naklios.fs.* SDK.

const IDB_NAME = 'nakliOS';
const IDB_STORE = 'handles';

function idbOpen(){
  return new Promise((resolve, reject) => {
    const r = indexedDB.open(IDB_NAME, 1);
    r.onupgradeneeded = () => { r.result.createObjectStore(IDB_STORE); };
    r.onsuccess = () => resolve(r.result);
    r.onerror = () => reject(r.error);
  });
}
async function idbGet(key){
  const db = await idbOpen();
  return new Promise((res, rej) => {
    const tx = db.transaction(IDB_STORE, 'readonly');
    const req = tx.objectStore(IDB_STORE).get(key);
    req.onsuccess = () => res(req.result);
    req.onerror = () => rej(req.error);
  });
}
async function idbSet(key, val){
  const db = await idbOpen();
  return new Promise((res, rej) => {
    const tx = db.transaction(IDB_STORE, 'readwrite');
    tx.objectStore(IDB_STORE).put(val, key);
    tx.oncomplete = () => res();
    tx.onerror = () => rej(tx.error);
  });
}
async function idbDel(key){
  const db = await idbOpen();
  return new Promise((res, rej) => {
    const tx = db.transaction(IDB_STORE, 'readwrite');
    tx.objectStore(IDB_STORE).delete(key);
    tx.oncomplete = () => res();
    tx.onerror = () => rej(tx.error);
  });
}

// Path safety: clamp app paths to apps/<appId>/. Reject traversal.
function fsSafePath(appId, path){
  if (typeof path !== 'string' || !path) throw new Error('Path required');
  const segs = path.split('/').filter(s => s && s !== '.');
  if (segs.some(s => s === '..' || s.startsWith('/'))) throw new Error('Invalid path: ' + path);
  if (!segs.length) throw new Error('Empty path');
  if (!appId || typeof appId !== 'string') throw new Error('Internal: missing appId');
  return ['apps', appId, ...segs].join('/');
}

// Walk a path to its parent directory handle. Optionally create dirs.
async function fsGetDir(path, create=false){
  if (!state.fsHandle) throw new Error('No folder connected');
  const segs = path.split('/').filter(Boolean);
  let dir = state.fsHandle;
  for (let i = 0; i < segs.length - 1; i++){
    dir = await dir.getDirectoryHandle(segs[i], { create });
  }
  return { dir, name: segs[segs.length - 1] };
}

async function fsRead(path){
  const { dir, name } = await fsGetDir(path);
  const fh = await dir.getFileHandle(name);
  const file = await fh.getFile();
  return await file.text();
}
async function fsReadBinary(path){
  const { dir, name } = await fsGetDir(path);
  const fh = await dir.getFileHandle(name);
  const file = await fh.getFile();
  return new Uint8Array(await file.arrayBuffer());
}
async function fsWrite(path, data){
  const { dir, name } = await fsGetDir(path, true);
  const fh = await dir.getFileHandle(name, { create: true });
  const ws = await fh.createWritable();
  await ws.write(data);
  await ws.close();
}
async function fsAppend(path, line){
  let existing = '';
  try { existing = await fsRead(path); } catch(_){}
  const trail = (line.endsWith('\n') ? line : line + '\n');
  await fsWrite(path, existing + trail);
}
async function fsList(prefix=''){
  if (!state.fsHandle) throw new Error('No folder connected');
  // Walk into the prefix dir and enumerate
  const segs = prefix.split('/').filter(Boolean);
  let dir = state.fsHandle;
  try {
    for (const seg of segs) dir = await dir.getDirectoryHandle(seg);
  } catch(_){ return []; }
  const out = [];
  for await (const [name, handle] of dir.entries()){
    out.push(prefix ? `${prefix}/${name}` + (handle.kind === 'directory' ? '/' : '')
                    : name + (handle.kind === 'directory' ? '/' : ''));
  }
  return out.sort();
}
async function fsDelete(path){
  const { dir, name } = await fsGetDir(path);
  await dir.removeEntry(name, { recursive: true });
}
async function fsExists(path){
  try {
    const { dir, name } = await fsGetDir(path);
    await dir.getFileHandle(name);
    return true;
  } catch(_){
    try {
      const { dir, name } = await fsGetDir(path);
      await dir.getDirectoryHandle(name);
      return true;
    } catch(_){ return false; }
  }
}
// Rig fileops (C0) additions. Return null for a missing path (fileops expects a
// typed absence, not a throw); type/size/mtime for a file or directory.
async function fsStat(path){
  if (!state.fsHandle) throw new Error('No folder connected');
  if (!path) return { type: 'dir', size: 0, mtimeMs: 0 };
  try {
    const { dir, name } = await fsGetDir(path);
    try {
      const fh = await dir.getFileHandle(name);
      const file = await fh.getFile();
      return { type: 'file', size: file.size, mtimeMs: file.lastModified };
    } catch(_){
      await dir.getDirectoryHandle(name);
      return { type: 'dir', size: 0, mtimeMs: 0 };
    }
  } catch(_){ return null; }
}
async function fsMkdir(path){
  if (!state.fsHandle) throw new Error('No folder connected');
  const { dir, name } = await fsGetDir(path, true);
  if (name) await dir.getDirectoryHandle(name, { create: true });
}

// Connection / lifecycle.
async function fsConnect(){
  if (!('showDirectoryPicker' in window)) {
    await nakliosAlert(
      'Your browser doesn\'t support the File System Access API. Try Chrome, Edge, or Brave on desktop — or use Crate instead for end-to-end-encrypted multi-device sync.',
      { title: 'Folder connect unavailable', kind: 'error' }
    );
    return false;
  }
  try {
    const handle = await window.showDirectoryPicker({ mode: 'readwrite', id: 'nakliOS' });
    state.fsHandle = handle;
    state.fsFolderName = handle.name;
    await idbSet('fsHandle', handle);
    // Write current state to file immediately so the folder is initialized
    await fsWriteState();
    if (typeof broadcastCapabilities === 'function') broadcastCapabilities();
    return true;
  } catch (e){
    if (e.name !== 'AbortError') console.error('fsConnect failed:', e);
    return false;
  }
}
async function fsReconnect(){
  const stored = await idbGet('fsHandle').catch(() => null);
  if (!stored) return false;
  try {
    const perm = await stored.queryPermission({ mode: 'readwrite' });
    if (perm === 'granted'){
      state.fsHandle = stored;
      state.fsFolderName = stored.name;
      return true;
    }
    if (perm === 'prompt'){
      // Park the handle for user-initiated re-grant via Settings.
      state.fsHandle = null;
      state.fsFolderName = stored.name;
      window._fsPendingHandle = stored;
      return false;
    }
  } catch(_){}
  return false;
}
async function fsRegrantPending(){
  const stored = window._fsPendingHandle;
  if (!stored) return false;
  try {
    const perm = await stored.requestPermission({ mode: 'readwrite' });
    if (perm === 'granted'){
      state.fsHandle = stored;
      state.fsFolderName = stored.name;
      window._fsPendingHandle = null;
      if (typeof broadcastCapabilities === 'function') broadcastCapabilities();
      return true;
    }
  } catch(_){}
  return false;
}
async function fsDisconnect(){
  state.fsHandle = null;
  state.fsFolderName = null;
  await idbDel('fsHandle').catch(() => {});
  if (typeof broadcastCapabilities === 'function') broadcastCapabilities();
}

// State.json shadow: serialize the user-visible state into a single JSON
// file in the connected folder. Debounced so a flurry of saveLayout()s
// becomes one write.
let _stateWriteTimer = null;
function fsScheduleStateWrite(){
  if (!state.fsHandle) return;
  clearTimeout(_stateWriteTimer);
  _stateWriteTimer = setTimeout(() => fsWriteState().catch(e => console.warn('state write failed:', e)), 500);
}
function serializeState(){
  return {
    version: 1,
    savedAt: Date.now(),
    mode: state.mode,
    theme: state.theme,
    layout: state.layout,
    appPermissions: state.appPermissions,
  };
}
async function fsWriteState(){
  if (!state.fsHandle) return;
  const snapshot = serializeState();
  const json = JSON.stringify(snapshot, null, 2);
  const fh = await state.fsHandle.getFileHandle('state.json', { create: true });
  const ws = await fh.createWritable();
  await ws.write(json);
  await ws.close();
  localStorage.setItem('nakliOS.lastSync', String(snapshot.savedAt));
}
async function fsReadState(){
  if (!state.fsHandle) return null;
  try {
    const fh = await state.fsHandle.getFileHandle('state.json');
    const text = await (await fh.getFile()).text();
    return JSON.parse(text);
  } catch(_){ return null; }
}
// On boot, if the file's savedAt is newer than localStorage's lastSync,
// hydrate from file. Otherwise keep current (and write file once).
async function fsHydrateIfNewer(){
  const remote = await fsReadState();
  if (!remote) return false;
  const localSync = parseInt(localStorage.getItem('nakliOS.lastSync') || '0', 10);
  if (!remote.savedAt || remote.savedAt <= localSync) return false;
  // Newer-than-local → hydrate everything
  if (remote.mode != null) { state.mode = remote.mode; localStorage.setItem(LS_KEY.mode, remote.mode); }
  if (remote.theme != null) { state.theme = remote.theme; localStorage.setItem(LS_KEY.theme, remote.theme); }
  if (remote.layout) {
    state.layout = sanitizeLayout(remote.layout);
    const migratedDesktopDefaults = applyDesktopDefaults(state.layout);
    localStorage.setItem(LS_KEY.layout, JSON.stringify(state.layout));
    if (migratedDesktopDefaults) fsScheduleStateWrite();
  }
  if (remote.appPermissions) { state.appPermissions = remote.appPermissions; localStorage.setItem('nakliOS.appPermissions', JSON.stringify(remote.appPermissions)); }
  localStorage.setItem('nakliOS.lastSync', String(remote.savedAt));
  return true;
}

// ════════════════════════════════════════════════════════════════════
// CRATE BACKEND  (v2.19 — encrypted multi-device cloud folder)
// ════════════════════════════════════════════════════════════════════
// Crate is the BYOK encrypted cloud-folder counterpart to FSA. The user
// supplies a .crate-creds file or enters the R2 details + passphrase; we
// unlock the bucket and expose its 9-method ESM API
// (list/read/write/remove/move/mkdir/stat/
// history/onChange) through the same `naklios.fs.*` SDK surface that
// apps already use. From an app's perspective, FSA and Crate are
// indistinguishable — the only difference is which backend each app's
// data lives in (per-app permission stores the binding).
//
// Threat model:
//   - Encrypted creds blob persists in IndexedDB (DB 'nakliOS' / store
//     'handles' / key 'crateCreds'). Useless without the passphrase
//     (PBKDF2-SHA256/600k + AES-256-GCM, same as the Crate browser app).
//   - Unlocked Crate instance + master key live in memory only. Cleared
//     on lock or tab close. "Stay unlocked in this tab" stashes the
//     encrypted blob in sessionStorage instead — still passphrase-
//     gated on reload, just doesn't re-pick the file.
//   - Crate itself enforces a manifest rollback anchor (per-bucket
//     count+sig in IndexedDB) so a malicious R2 bucket can't roll the
//     folder back to a stale state. See lib/anchor.js in the vendored
//     v1.0.1.

const CRATE_VENDOR_BASE = './vendor/crate/v1.0.2';
const SESSION_CREDS_KEY = 'nakliOS.crateSessionCreds';

let _CrateModulePromise = null;
async function loadCrateModule(){
  if (!_CrateModulePromise){
    _CrateModulePromise = (async () => {
      const [crateMod, credsMod, bucketMod] = await Promise.all([
        import(CRATE_VENDOR_BASE + '/crate.js'),
        import(CRATE_VENDOR_BASE + '/credsfile.js'),
        import(CRATE_VENDOR_BASE + '/bucket.js'),
      ]);
      return {
        Crate: crateMod.Crate,
        CrateError: crateMod.CrateError,
        credsfile: credsMod,
        bucket: bucketMod,
      };
    })();
  }
  return _CrateModulePromise;
}

// Probe whether a `CORS_OR_NETWORK` failure is actually a CORS misconfig or
// a different network problem (cache, outage, extension). Runs an explicit
// OPTIONS preflight against the bucket — the OPTIONS itself isn't cached by
// the browser the way the preflight-DECISION is, so we get a fresh answer
// from R2 even when the regular GET is blocked client-side by the cache.
//
// Returns:
//   { kind: 'cors',    detail, allowedOrigin }  → bucket genuinely lacks our origin
//   { kind: 'network', detail }                 → preflight OK; fetch fails for other reasons
//   { kind: 'unknown', detail }                 → couldn't run the probe
async function crateDiagnoseCorsOrNetwork(bucketConfig){
  try {
    const { bucket } = await loadCrateModule();
    const provider = bucketConfig?.provider || 'r2';
    const epFn = bucket.endpoints?.[provider];
    if (!epFn){
      return { kind: 'unknown', detail: `No endpoint builder for provider ${provider}` };
    }
    const baseUrl = epFn(bucketConfig.accountId, bucketConfig.name, bucketConfig.region);
    const probeUrl = baseUrl.replace(/\/?$/, '/') + '.crate/crate.json';
    const origin = location.origin;
    const result = await bucket.corsPreflight({ url: probeUrl, origin });
    if (result.ok){
      return {
        kind: 'network',
        detail: 'Preflight succeeded — bucket allows ' + origin + '. The actual fetch is failing for another reason.',
        allowedOrigin: result.allowedOrigin,
      };
    }
    return {
      kind: 'cors',
      detail: result.message || 'Preflight rejected',
      allowedOrigin: result.allowedOrigin,
    };
  } catch (err){
    console.warn('[crate] CORS diagnosis failed:', err);
    return { kind: 'unknown', detail: err?.message || String(err) };
  }
}

// crateLoadCredsBlob — read the encrypted .crate-creds bytes from
// IndexedDB. Returns null if none stored.
async function crateLoadCredsBlob(){
  const v = await idbGet('crateCreds').catch(() => null);
  if (!v) return null;
  if (v instanceof Uint8Array) return v;
  if (v instanceof ArrayBuffer) return new Uint8Array(v);
  if (typeof v === 'string') return new TextEncoder().encode(v);
  return null;
}

async function crateSaveCredsBlob(bytes){
  await idbSet('crateCreds', bytes);
}

async function crateSaveCredsBlobCreateOnly(bytes){
  const db = await idbOpen();
  return new Promise((resolve, reject) => {
    const tx = db.transaction(IDB_STORE, 'readwrite');
    tx.objectStore(IDB_STORE).add(bytes, 'crateCreds');
    tx.oncomplete = () => resolve();
    tx.onabort = () => reject(
      tx.error?.name === 'ConstraintError'
        ? new DOMException('Crate credentials already exist', 'ConstraintError')
        : (tx.error || new Error('Could not store Crate credentials'))
    );
    tx.onerror = () => {
      // onabort is the single rejection path for transaction failures.
    };
  });
}

async function crateClearCredsBlob(){
  await idbDel('crateCreds').catch(() => {});
}

// Crate → NakliOS encrypted setup handoff (receiver v1).
//
// NakliOS creates an unguessable, memory-only nonce and loads only the
// canonical Crate origin in a sandboxed cross-origin iframe. The sender may
// return the already-encrypted `.crate-creds` JSON, never raw bucket fields or
// a passphrase. Origin + source-window + nonce are all required, and a valid
// envelope still needs explicit user consent before IndexedDB is changed.
const CRATE_SETUP_ORIGIN = 'https://crate.naklios.dev';
const CRATE_SETUP_TTL_MS = 2 * 60 * 1000;
let crateSetupSession = null;

function crateSetupNonce(){
  const bytes = crypto.getRandomValues(new Uint8Array(24));
  return Array.from(bytes, byte => byte.toString(16).padStart(2, '0')).join('');
}

function crateSetupBase64Length(value, label){
  if (
    typeof value !== 'string' || !value.length || value.length > 200000
    || value.length % 4 !== 0 || !/^[A-Za-z0-9+/]+={0,2}$/.test(value)
  ) throw new Error('Invalid encrypted credentials ' + label);
  try { return atob(value).length; }
  catch (_) { throw new Error('Invalid encrypted credentials ' + label); }
}

function validateCrateSetupEnvelope(text){
  if (typeof text !== 'string' || !text.length || text.length > 256000) {
    throw new Error('Encrypted credentials payload is missing or too large.');
  }
  let envelope;
  try { envelope = JSON.parse(text); }
  catch (_) { throw new Error('Encrypted credentials payload is not valid JSON.'); }
  if (!envelope || typeof envelope !== 'object' || Array.isArray(envelope)) {
    throw new Error('Encrypted credentials payload must be an object.');
  }
  const allowed = new Set(['v','type','hint','kdf','salt','iv','ct']);
  if (Object.keys(envelope).some(key => !allowed.has(key))) {
    throw new Error('Encrypted credentials payload contains unexpected fields.');
  }
  if (envelope.v !== 1 || envelope.type !== 'crate-creds') {
    throw new Error('Only Crate credentials envelope v1 is supported.');
  }
  if (
    !envelope.kdf || typeof envelope.kdf !== 'object'
    || envelope.kdf.algo !== 'PBKDF2-SHA256'
    || envelope.kdf.iter !== 600000
    || Object.keys(envelope.kdf).some(key => key !== 'algo' && key !== 'iter')
  ) throw new Error('Encrypted credentials use an unsupported key derivation scheme.');
  if (typeof envelope.hint !== 'string' || !envelope.hint.trim() || envelope.hint.length > 128) {
    throw new Error('Encrypted credentials have an invalid bucket hint.');
  }
  if (crateSetupBase64Length(envelope.salt, 'salt') !== 16) {
    throw new Error('Encrypted credentials salt has the wrong length.');
  }
  if (crateSetupBase64Length(envelope.iv, 'IV') !== 12) {
    throw new Error('Encrypted credentials IV has the wrong length.');
  }
  if (crateSetupBase64Length(envelope.ct, 'ciphertext') < 17) {
    throw new Error('Encrypted credentials ciphertext is too short.');
  }
  return {
    bytes:new TextEncoder().encode(JSON.stringify(envelope, null, 2) + '\n'),
    hint:envelope.hint.trim(),
  };
}

function closeCrateSetupHandoff(){
  const session = crateSetupSession;
  crateSetupSession = null;
  if (!session) return;
  clearTimeout(session.timer);
  if (session.dialog?.open) session.dialog.close();
  session.dialog?.remove();
}

function postCrateSetupAck(session, status){
  try {
    session.iframe.contentWindow.postMessage({
      type:'naklios:crate-setup:ack:v1',
      nonce:session.nonce,
      status,
    }, CRATE_SETUP_ORIGIN);
  } catch (_) {}
}

async function handleCrateSetupMessage(event){
  const session = crateSetupSession;
  if (
    !session || session.consumed || Date.now() > session.expiresAt
    || event.origin !== CRATE_SETUP_ORIGIN
    || event.source !== session.iframe.contentWindow
  ) return;
  const data = event.data;
  if (
    !data || typeof data !== 'object'
    || data.type !== 'crate:naklios-setup:v1'
    || data.nonce !== session.nonce
    || Object.keys(data).some(key =>
      !['type','nonce','encryptedCreds','senderVersion'].includes(key))
  ) return;
  session.consumed = true;
  let validated;
  try {
    validated = validateCrateSetupEnvelope(data.encryptedCreds);
  } catch (error) {
    postCrateSetupAck(session, 'rejected');
    await nakliosAlert(error?.message || String(error), {
      title:'Handoff rejected',
      kind:'error',
    });
    closeCrateSetupHandoff();
    return;
  }
  if (state.crate || await crateLoadCredsBlob()) {
    postCrateSetupAck(session, 'already-connected');
    await nakliosAlert(
      'NakliOS already has Crate credentials on this device. Disconnect them before importing a different encrypted setup.',
      { title:'Crate already configured' },
    );
    closeCrateSetupHandoff();
    return;
  }
  const accepted = await nakliosConfirm(
    `Crate sent the encrypted setup for “${validated.hint}”. Store it on this device?\n\n` +
    'The passphrase and raw bucket keys were not sent. You will enter the passphrase in NakliOS to unlock.',
    { title:'Import encrypted Crate setup?', okLabel:'Store encrypted setup' },
  );
  if (crateSetupSession !== session || Date.now() > session.expiresAt) {
    if (crateSetupSession === session) {
      postCrateSetupAck(session, 'expired');
      closeCrateSetupHandoff();
    }
    return;
  }
  if (!accepted) {
    postCrateSetupAck(session, 'declined');
    closeCrateSetupHandoff();
    return;
  }
  try {
    await crateSaveCredsBlobCreateOnly(validated.bytes);
    state.crateBucketName = validated.hint;
    state.crateLocked = true;
    if (typeof broadcastCapabilities === 'function') broadcastCapabilities();
    postCrateSetupAck(session, 'stored');
    closeCrateSetupHandoff();
    if (settingsOpen) { closeSettings(); openSettings('storage'); }
    await crateInteractiveUnlock();
    if (settingsOpen) { closeSettings(); openSettings('storage'); }
  } catch (error) {
    const alreadyConnected = error?.name === 'ConstraintError';
    postCrateSetupAck(session, alreadyConnected ? 'already-connected' : 'failed');
    closeCrateSetupHandoff();
    await nakliosAlert(
      alreadyConnected
        ? 'Another NakliOS tab or setup flow connected Crate first. The encrypted setup was not overwritten.'
        : 'The encrypted setup could not be stored: ' + (error?.message || error),
      { title:alreadyConnected ? 'Crate already configured' : 'Crate setup failed', kind:'error' },
    );
  }
}
window.addEventListener('message', event => { void handleCrateSetupMessage(event); });

async function crateInteractiveSetupHandoff(){
  if (crateSetupSession?.dialog?.open) {
    crateSetupSession.dialog.focus();
    return;
  }
  if (state.crate || await crateLoadCredsBlob()) {
    await nakliosAlert(
      'NakliOS already has Crate credentials on this device. Disconnect them before importing a different encrypted setup.',
      { title:'Crate already configured' },
    );
    return;
  }
  const nonce = crateSetupNonce();
  const parentOrigin = location.origin;
  const dialog = document.createElement('dialog');
  dialog.className = 'nw-crate-handoff';
  dialog.setAttribute('aria-labelledby', 'nw-crate-handoff-title');
  dialog.innerHTML = `
    <div class="nw-crate-handoff-shell">
      <header class="nw-crate-handoff-head">
        <strong id="nw-crate-handoff-title">Set up Crate for NakliOS</strong>
        <span>Only an encrypted credentials envelope can return to NakliOS.</span>
        <button type="button" class="nw-dlg-btn" data-close>Close</button>
      </header>
      <iframe class="nw-crate-handoff-frame" title="Crate setup"
        sandbox="allow-scripts allow-forms allow-downloads allow-same-origin"
        referrerpolicy="no-referrer"></iframe>
      <footer class="nw-crate-handoff-foot">
        Finish setup in Crate, then click “Send to NakliOS” — only the
        encrypted envelope returns here; you enter the passphrase in NakliOS.
        Prefer a file? Download the <code>.crate-creds</code> and use
        “I have a <code>.crate-creds</code> file” in Settings.
      </footer>
    </div>`;
  const iframe = dialog.querySelector('iframe');
  iframe.src = CRATE_SETUP_ORIGIN + '/?naklios-handoff=v1&parentOrigin=' +
    encodeURIComponent(parentOrigin) + '&nonce=' + encodeURIComponent(nonce);
  document.body.appendChild(dialog);
  const timer = setTimeout(() => {
    if (crateSetupSession?.nonce !== nonce) return;
    postCrateSetupAck(crateSetupSession, 'expired');
    closeCrateSetupHandoff();
    void nakliosAlert('The Crate setup handoff expired. Start it again when you are ready.', {
      title:'Handoff expired',
    });
  }, CRATE_SETUP_TTL_MS);
  crateSetupSession = {
    nonce,
    dialog,
    iframe,
    timer,
    expiresAt:Date.now() + CRATE_SETUP_TTL_MS,
    consumed:false,
  };
  dialog.querySelector('[data-close]').addEventListener('click', closeCrateSetupHandoff);
  dialog.addEventListener('cancel', event => {
    event.preventDefault();
    closeCrateSetupHandoff();
  });
  dialog.showModal();
}

// crateUnlock — given a creds-file byte buffer + passphrase, instantiate
// the live Crate. Updates state.crate / state.crateBucketName.
// CORS JSON the user should paste into their R2 bucket's CORS Policy. Matches
// the schema crate's onboarding wizard generates (see crate/lib/onboarding.js
// corsJson()), with both crate.naklios.dev and naklios.dev as allowed origins
// so the same bucket works from either surface.
const CRATE_CORS_JSON = JSON.stringify(
  [
    {
      AllowedOrigins: ['https://crate.naklios.dev', 'https://naklios.dev'],
      AllowedMethods: ['GET', 'PUT', 'POST', 'DELETE', 'HEAD'],
      AllowedHeaders: ['*'],
      ExposeHeaders: ['ETag'],
      MaxAgeSeconds: 3600,
    },
  ],
  null,
  2,
);

// Detect Crate.open / bucket-fetch errors that look like the bucket's CORS
// doesn't include this origin. The crate bucket layer surfaces these as
// messages containing 'CORS_OR_NETWORK' (see crate/lib/bucket.js).
function crateIsCorsError(error){
  return /CORS_OR_NETWORK/.test(error?.message || '');
}

// crateShowCorsRemediation — themed dialog that walks the user through
// fixing their bucket's CORS policy. Two buttons: a Copy-to-clipboard for
// the JSON, and an Open-Cloudflare-R2 deep link. Resolves when dismissed.
//
// Optionally takes a `diag` from crateDiagnoseCorsOrNetwork — when present,
// the dialog includes the actual preflight response so the user can compare
// the bucket's reported allowed origins against what they configured.
//
// Safe to call while another modal is open (e.g. the passphrase dialog) —
// native <dialog>.showModal() stacks, browser handles the focus/Escape
// stack natively.
function crateShowCorsRemediation(diag){
  return new Promise(resolve => {
    const dlg = document.createElement('dialog');
    dlg.className = 'nw-dlg';
    const jsonHtml = _dlgEscape(CRATE_CORS_JSON);
    const diagBlock = diag ? `
      <p class="nw-dlg-hint">
        Bucket preflight reported:
        <code>Access-Control-Allow-Origin: ${_dlgEscape(diag.allowedOrigin || '(none)')}</code>.
        Your origin is <code>${_dlgEscape(location.origin)}</code>.
        ${diag.detail ? ' — ' + _dlgEscape(diag.detail) : ''}
      </p>
    ` : '';
    dlg.innerHTML = `
      <form method="dialog" class="nw-dlg-form" style="max-width:520px;">
        <h3 class="nw-dlg-title">Allow naklios.dev to access your bucket</h3>
        <p class="nw-dlg-body">
          Your bucket's CORS policy doesn't include
          <code>naklios.dev</code> yet — that's why unlock can't reach
          <code>.crate/crate.json</code>.
        </p>
        <p class="nw-dlg-body">
          Open <strong>Cloudflare → R2 → your bucket → Settings → CORS Policy</strong>
          and paste this JSON (replace any existing rule if it only mentions
          <code>crate.naklios.dev</code>):
        </p>
        <pre class="nw-dlg-pre"><button type="button" class="nw-dlg-copy-btn" id="cors-copy">Copy</button>${jsonHtml}</pre>
        ${diagBlock}
        <p class="nw-dlg-hint">
          The change usually applies within seconds.
        </p>
        <menu class="nw-dlg-actions">
          <button type="submit" value="open" class="nw-dlg-btn">Open Cloudflare R2 →</button>
          <button type="submit" value="ok" class="nw-dlg-btn primary" autofocus>Got it</button>
        </menu>
      </form>
    `;
    document.body.appendChild(dlg);

    // Copy button — does NOT close the dialog (type="button" not "submit").
    const copyBtn = dlg.querySelector('#cors-copy');
    copyBtn.addEventListener('click', async (e) => {
      e.preventDefault();
      try {
        await navigator.clipboard.writeText(CRATE_CORS_JSON);
        copyBtn.textContent = 'Copied';
        copyBtn.classList.add('copied');
        setTimeout(() => {
          copyBtn.textContent = 'Copy';
          copyBtn.classList.remove('copied');
        }, 1400);
      } catch (_){
        copyBtn.textContent = 'Copy failed';
        setTimeout(() => { copyBtn.textContent = 'Copy'; }, 1400);
      }
    });

    dlg.addEventListener('close', () => {
      const v = dlg.returnValue;
      dlg.remove();
      if (v === 'open'){
        // Generic Cloudflare R2 entry point — the user navigates from there
        // to their specific bucket. We don't know the account ID here.
        window.open('https://dash.cloudflare.com/?to=/:account/r2/overview', '_blank', 'noopener');
      }
      resolve();
    }, { once: true });

    dlg.showModal();
  });
}

// crateShowNetworkError — themed dialog for the case where the CORS
// preflight succeeds but the actual signed GET still fails. Most common
// cause: the browser cached a previous failed preflight decision and is
// blocking the request client-side without re-asking the bucket.
function crateShowNetworkError(diag){
  return new Promise(resolve => {
    const dlg = document.createElement('dialog');
    dlg.className = 'nw-dlg';
    const detailHtml = diag?.detail ? `
      <pre class="nw-dlg-pre">${_dlgEscape(diag.detail)}</pre>
    ` : '';
    dlg.innerHTML = `
      <form method="dialog" class="nw-dlg-form" style="max-width:520px;">
        <h3 class="nw-dlg-title">Bucket reachable, but the fetch failed</h3>
        <p class="nw-dlg-body">
          Your bucket's CORS policy is configured correctly —
          <code>${_dlgEscape(location.origin)}</code> is in the allowed
          origins. But the actual fetch to
          <code>.crate/crate.json</code> isn't going through. That's almost
          always one of:
        </p>
        <p class="nw-dlg-body">
          <strong>1. Browser cached a failed preflight from earlier.</strong>
          The browser remembers "no" decisions for up to
          <code>MaxAgeSeconds</code> (an hour by default). Close the entire
          browser window — not just the tab — and reopen it. Incognito
          windows have their own cache; close the window completely.
        </p>
        <p class="nw-dlg-body">
          <strong>2. Network outage, VPN, or extension blocking R2.</strong>
          Check that <code>*.r2.cloudflarestorage.com</code> reaches the
          internet from this tab. Try toggling off any privacy extensions.
        </p>
        ${detailHtml}
        <p class="nw-dlg-hint">
          DevTools → Network tab shows the actual request that failed if
          you want to dig further.
        </p>
        <menu class="nw-dlg-actions">
          <button type="submit" value="ok" class="nw-dlg-btn primary" autofocus>Got it</button>
        </menu>
      </form>
    `;
    document.body.appendChild(dlg);
    dlg.addEventListener('close', () => { dlg.remove(); resolve(); }, { once: true });
    dlg.showModal();
  });
}

async function crateUnlock(bytes, passphrase){
  const { Crate, credsfile } = await loadCrateModule();
  // credsfile.unpack returns the creds object directly:
  //   { provider, bucket: {name, accountId, region}, credentials: {accessKey, secretKey} }
  // Previous code destructured `const { creds } = ...` which left creds undefined
  // and crashed on the next line with "Cannot read properties of undefined
  // (reading 'bucket')". Pre-v2.22 bug — landed silently in v2.20.
  let creds;
  try {
    creds = await credsfile.unpack(bytes, passphrase);
  } catch (e){
    // CredsFileError → already user-readable; bubble as-is.
    // Other (rare) failures → wrap with context but don't leak internals.
    if (e?.name === 'CredsFileError') throw e;
    throw new Error('Could not read the credentials file. ' + (e?.message || ''));
  }
  let crate;
  try {
    crate = await Crate.open({
      bucketConfig: creds.bucket,
      credentials: creds.credentials,
      passphrase,
    });
  } catch (e){
    // Crate.open failures: wrong passphrase (caught by unpack already, but
    // also possible if the bucket itself is in a bad state), bucket
    // unreachable, CORS, missing .crate/crate.json, etc. CrateError messages
    // are user-readable; bubble. Generic errors get a friendlier wrapper.
    if (e?.name === 'CrateError') throw e;
    console.warn('[crate] Crate.open failed:', e);
    throw new Error(
      'Could not open the bucket. ' +
      'Check your network, that the bucket still exists, and that its CORS ' +
      'config allows naklios.dev. ' +
      (e?.message ? '(' + e.message + ')' : '')
    );
  }
  state.crate = crate;
  state.crateBucketName = creds.bucket?.name || credsfile.peekHint(bytes) || '(crate)';
  state.crateLocked = false;
  // Stay-unlocked-in-this-tab: stash the encrypted blob in sessionStorage
  // so a reload picks up where we left off. The passphrase still gates
  // the unlock — sessionStorage is just a stand-in for the file picker.
  if (state.crateStayUnlocked){
    try {
      // Re-pack so we always store the canonical bytes (handles the
      // case where the user picked a different file or rotated creds).
      sessionStorage.setItem(SESSION_CREDS_KEY,
        btoa(String.fromCharCode(...bytes)));
    } catch (_){}
  } else {
    try { sessionStorage.removeItem(SESSION_CREDS_KEY); } catch (_){}
  }
  if (typeof broadcastCapabilities === 'function') broadcastCapabilities();
  return crate;
}

// crateConnect — first-time connect from a user-picked .crate-creds file.
// Unlock to verify the passphrase, then persist the encrypted blob.
async function crateConnect(file, passphrase){
  const buf = new Uint8Array(await file.arrayBuffer());
  await crateUnlock(buf, passphrase); // throws on wrong passphrase
  await crateSaveCredsBlob(buf);
}

// crateConnectManual — direct-credentials path. The user enters the bucket
// name, account ID, access key, secret key, and passphrase. We build the
// credsfile blob from those inputs in-memory, then funnel through the exact same
// crateUnlock + crateSaveCredsBlob path as the file flow. End state is
// identical: stored blob in IDB, unlocked Crate in memory, app-permission
// prompts work the same way.
//
// Critical: pack() requires a valid passphrase ≥ 1 char but doesn't
// validate the creds against the bucket. The real "did this work" check
// happens inside crateUnlock via Crate.open's GET .crate/crate.json call.
// CORS / wrong-creds / wrong-passphrase all surface from there.
async function crateConnectManual(bucketConfig, credentials, passphrase){
  const { credsfile } = await loadCrateModule();
  const blob = await credsfile.pack({
    provider: 'r2',
    bucket: bucketConfig,
    credentials,
  }, passphrase);
  await crateUnlock(blob, passphrase);
  await crateSaveCredsBlob(blob);
}

// crateReconnect — boot path. Checks for a persisted creds blob; if
// "stay unlocked in this tab" is on AND sessionStorage has the same
// blob, re-prompt for passphrase via banner. Otherwise the user has to
// click "Unlock" in Settings.
async function crateReconnect(){
  const blob = await crateLoadCredsBlob();
  if (!blob) return false;
  // Locked state — caller surfaces an unlock UI.
  state.crateLocked = true;
  try {
    const { credsfile } = await loadCrateModule();
    state.crateBucketName = credsfile.peekHint(blob) || '(crate)';
  } catch (_){
    state.crateBucketName = '(crate)';
  }
  return true;
}

// crateLock — zero the master key, drop the live instance. Encrypted
// blob stays in IDB so the user can re-unlock without re-picking the file.
function crateLock(){
  if (state.crate){
    try { state.crate.close(); } catch (_){}
  }
  state.crate = null;
  state.crateLocked = true;
  try { sessionStorage.removeItem(SESSION_CREDS_KEY); } catch (_){}
  if (typeof broadcastCapabilities === 'function') broadcastCapabilities();
}

// crateDisconnect — full teardown: lock + clear blob from IDB. The user
// will have to re-pick the file to use this Crate again.
async function crateDisconnect(){
  crateLock();
  await crateClearCredsBlob();
  state.crateBucketName = null;
  state.crateLocked = false;
  // Revoke any per-app permissions that bound to crate.
  let touched = false;
  for (const [appId, perm] of Object.entries(state.appPermissions)){
    if (perm && typeof perm === 'object' && perm.backend === 'crate'){
      delete state.appPermissions[appId];
      touched = true;
    }
  }
  if (touched) saveAppPermissions();
  if (typeof broadcastCapabilities === 'function') broadcastCapabilities();
}

function setCrateStayUnlocked(on){
  state.crateStayUnlocked = !!on;
  localStorage.setItem('nakliOS.crateStayUnlocked', on ? '1' : '0');
  if (!on){
    try { sessionStorage.removeItem(SESSION_CREDS_KEY); } catch (_){}
  }
}

// ── Interactive wrappers ─────────────────────────────────────────────
// Bundle the user-facing dialogs around each state-change so the same
// flow can be invoked from Settings or from the topbar status chips.

// First-time Crate connect — file picker → passphrase dialog →
// crateConnect (which throws on wrong passphrase). CORS errors get
// the remediation dialog. Returns true if the unlock succeeded.
// Common error handling for both connect + unlock validators: detect the
// CORS_OR_NETWORK heuristic, run a precise preflight probe to disambiguate
// CORS-misconfig vs cached-preflight-or-network-issue, show the right dialog,
// then throw a brief message for the passphrase dialog's inline error.
async function _crateHandleConnectError(e, bucketGetter){
  // Always log the raw error so DevTools shows the underlying cause.
  console.warn('[crate] unlock failed:', e);
  if (!crateIsCorsError(e)) throw e;
  // Disambiguate CORS-vs-network with an explicit OPTIONS probe.
  let bucketConfig = null;
  try { bucketConfig = await bucketGetter(); } catch(_){}
  const diag = bucketConfig
    ? await crateDiagnoseCorsOrNetwork(bucketConfig)
    : { kind: 'unknown', detail: 'No bucket config available for diagnosis' };
  console.warn('[crate] CORS diagnosis:', diag);
  if (diag.kind === 'network'){
    await crateShowNetworkError(diag);
    throw new Error('Bucket reachable, but the fetch failed. See the dialog — usually a cached preflight; close the window completely and reopen.');
  }
  // 'cors' or 'unknown' → CORS remediation is the best help we can give.
  await crateShowCorsRemediation(diag.kind === 'cors' ? diag : null);
  throw new Error('CORS not configured for naklios.dev — see the dialog for the JSON to paste.');
}

async function crateInteractiveConnectFile(){
  const file = await pickFile('.crate-creds,application/json');
  if (!file) return false;
  // Stash the file's unpacked bucket config so the error handler can run
  // a CORS probe without re-asking the user for the passphrase.
  let lastBucket = null;
  await nakliosPassphrase({
    title: 'Connect Crate',
    body: 'Enter the passphrase for ' + file.name + '.',
    validate: async (pass) => {
      try {
        // Capture the bucket config from a successful unpack so the
        // diagnosis (if needed) has it. We re-do this work inside
        // crateConnect anyway — fine to do an extra unpack.
        try {
          const { credsfile } = await loadCrateModule();
          const buf = new Uint8Array(await file.arrayBuffer());
          const creds = await credsfile.unpack(buf, pass);
          lastBucket = { ...creds.bucket, provider: creds.provider };
        } catch(_){ /* unpack failed → fall through to crateConnect which throws cleanly */ }
        await crateConnect(file, pass);
      } catch (e){
        await _crateHandleConnectError(e, () => lastBucket);
      }
    },
  });
  return !!state.crate;
}

// crateInteractiveManual — the direct-credentials alternative to a
// .crate-creds file. Shows a themed 5-field dialog (bucket name, account ID,
// access key, secret key, and folder passphrase), then
// runs the same unlock + persist path as the file flow. On success the
// stored blob is in IDB and a fresh .crate-creds is one click away
// from Settings.
//
// The four R2 strings can come from a password manager or the Cloudflare
// dashboard. The credentials file is a convenience wrapper around those
// values plus the folder passphrase.
async function crateInteractiveManual(){
  let lastBucket = null;
  await nakliosManualCreds({
    title: 'Connect with bucket details',
    body: 'Enter the Cloudflare R2 bucket name, account ID, API keys, and the folder passphrase you used when creating this Crate.',
    validate: async (vals) => {
      const bucketConfig = {
        accountId: vals.accountId.trim().toLowerCase(),
        name: vals.bucketName.trim(),
        region: 'auto',
      };
      const credentials = {
        accessKey: vals.accessKey.trim(),
        secretKey: vals.secretKey.trim(),
      };
      lastBucket = { ...bucketConfig, provider: 'r2' };
      try {
        await crateConnectManual(bucketConfig, credentials, vals.passphrase);
      } catch (e){
        await _crateHandleConnectError(e, () => lastBucket);
      }
    },
  });
  return !!state.crate;
}

// Re-unlock — blob already in IDB, just need the passphrase.
async function crateInteractiveUnlock(){
  const blob = await crateLoadCredsBlob();
  if (!blob){
    await nakliosAlert(
      'No stored credentials. Use Disconnect → Connect to add a new .crate-creds file.',
      { title: 'Cannot unlock', kind: 'error' }
    );
    return false;
  }
  let lastBucket = null;
  await nakliosPassphrase({
    bucketHint: state.crateBucketName || 'Crate',
    validate: async (pass) => {
      try {
        // Unpack once to capture the bucket config for potential diagnosis.
        // The throw on wrong passphrase happens here; if we get past it,
        // crateUnlock will re-unpack (cheap) and open the bucket.
        try {
          const { credsfile } = await loadCrateModule();
          const creds = await credsfile.unpack(blob, pass);
          lastBucket = { ...creds.bucket, provider: creds.provider };
        } catch(_){ /* let crateUnlock surface the real failure */ }
        await crateUnlock(blob, pass);
      } catch (e){
        await _crateHandleConnectError(e, () => lastBucket);
      }
    },
  });
  return !!state.crate;
}

// crateDownloadCredsFile — pull the stored encrypted blob out of IDB
// and trigger a browser download. Same filename convention the standalone
// Crate app uses (`<bucket-name>.crate-creds`). The bytes are exactly
// what was either picked from a file by the user OR re-packed from the
// manual-mode dialog — round-trip-compatible with both paths.
//
// Use case: user unlocked manually because they'd lost their file, now
// they want a fresh file saved somewhere findable. Closes the
// "manual recovery" loop without a detour through crate.naklios.dev.
async function crateDownloadCredsFile(){
  if (!state.crate){
    await nakliosAlert(
      'Unlock the Crate first — there\'s no stored credentials blob to save.',
      { title: 'Nothing to save', kind: 'error' }
    );
    return;
  }
  const blob = await crateLoadCredsBlob();
  if (!blob){
    await nakliosAlert(
      'No stored credentials blob found in this device\'s IndexedDB. This shouldn\'t happen while you\'re unlocked — please file a bug.',
      { title: 'Cannot save', kind: 'error' }
    );
    return;
  }
  const { credsfile } = await loadCrateModule();
  const filename = credsfile.suggestedFilename(state.crateBucketName || 'crate');
  const file = new Blob([blob], { type: 'application/octet-stream' });
  const url = URL.createObjectURL(file);
  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  a.style.display = 'none';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  // Revoke after a short delay so the browser has time to start the
  // download. Bug-fixed pattern; not all browsers handle immediate revoke.
  setTimeout(() => URL.revokeObjectURL(url), 1500);
}

function isPinned(id){ return (state.layout.pinned || []).includes(id); }
function pinItem(id){
  const list = state.layout.pinned || [];
  if (!list.includes(id)) list.push(id);
  state.layout.pinned = list;
  saveLayout();
  updateDock();
}
function unpinItem(id){
  state.layout.pinned = (state.layout.pinned || []).filter(x => x !== id);
  saveLayout();
  updateDock();
}

function isInFolder(appId){
  if ((state.layout.unfoldered || []).includes(appId)) return false;
  return FOLDERS.some(f => f.apps.includes(appId));
}

function moveAppToDesktop(appId){
  state.layout.unfoldered = state.layout.unfoldered || [];
  if (!state.layout.unfoldered.includes(appId)) state.layout.unfoldered.push(appId);
  saveLayout();
  renderIcons();
}

// CONTEXT MENU (right-click) — used by icons, dock items, folder apps
// ════════════════════════════════════════════════════════════════════
function showContextMenu(x, y, items){
  closeContextMenu();
  const menu = document.createElement('div');
  menu.id = 'nw-context-menu';
  menu.className = 'nw-context-menu';
  menu.innerHTML = items.map((it, i) => {
    if (it.separator) return '<div class="nw-cm-sep"></div>';
    return `<button class="nw-cm-item${it.danger ? ' danger' : ''}" data-i="${i}">${_dlgEscape(it.label)}</button>`;
  }).join('');
  menu.style.left = x + 'px';
  menu.style.top = y + 'px';
  document.getElementById('overlay-root').appendChild(menu);
  // Adjust if off-screen
  const r = menu.getBoundingClientRect();
  if (r.right > innerWidth - 8) menu.style.left = Math.max(8, innerWidth - r.width - 8) + 'px';
  if (r.bottom > innerHeight - 8) menu.style.top = Math.max(8, y - r.height) + 'px';
  menu.querySelectorAll('.nw-cm-item').forEach(b => {
    b.addEventListener('click', () => {
      const idx = +b.dataset.i;
      closeContextMenu();
      items[idx]?.onClick?.();
    });
  });
  setTimeout(() => document.addEventListener('pointerdown', dismissContextMenu, true), 0);
}
function dismissContextMenu(e){
  const menu = document.getElementById('nw-context-menu');
  if (menu && !menu.contains(e.target)) closeContextMenu();
}
function closeContextMenu(){
  const menu = document.getElementById('nw-context-menu');
  if (menu) menu.remove();
  document.removeEventListener('pointerdown', dismissContextMenu, true);
}

// ════════════════════════════════════════════════════════════════════
// DIALOG PRIMITIVES — themed <dialog> replacements for prompt/confirm/alert
// ════════════════════════════════════════════════════════════════════
// Native dialogs (prompt/confirm/alert) are jarring — useful when you WANT
// the user jolted, but they break the OS-shaped illusion. These helpers
// use real <dialog> + showModal() so focus trap + Escape-to-close are
// browser-native; styling matches the rest of NakliOS chrome.
//
//   nakliosAlert(msg, opts?)     → Promise<void>
//   nakliosConfirm(msg, opts?)   → Promise<boolean>
//
// opts:
//   title       — header text (default: "NakliOS" / "Are you sure?")
//   okLabel     — label for the primary button
//   cancelLabel — label for the cancel button (confirm only)
//   danger      — bool, styles the primary action as destructive (red)
//   kind        — 'error' for red title accent (alert only)
//
// The passphrase dialog (nakliosPassphrase) is built separately because it
// has password-input hygiene rules — see the unlock dialog work in task #5.

function _dlgEscape(s){
  return String(s).replace(/[&<>"']/g, c =>
    ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c])
  );
}

// Core constructor — appends a <dialog>, shows it modally, resolves with
// the returnValue of whichever button closed it (or 'cancel' on Escape).
// The dialog removes itself from the DOM on close.
let _nakliosDialogCounter = 0;
function _nakliosDialog({ title, body, buttons, kind, allowHtmlBody }){
  return new Promise(resolve => {
    const dlg = document.createElement('dialog');
    dlg.className = 'nw-dlg' + (kind ? ' nw-dlg-' + kind : '');
    const titleId = `nw-dlg-title-${++_nakliosDialogCounter}`;
    if (title) dlg.setAttribute('aria-labelledby', titleId);
    else dlg.setAttribute('aria-label', 'NakliOS dialog');
    // Body can be plain text (default, safe) or pre-escaped HTML (for the
    // rare callers that need <code> / <strong>). Default safe.
    const bodyHtml = allowHtmlBody ? body : _dlgEscape(body);
    dlg.innerHTML = `
      <form method="dialog" class="nw-dlg-form">
        ${title ? `<h3 class="nw-dlg-title" id="${titleId}">${_dlgEscape(title)}</h3>` : ''}
        <div class="nw-dlg-body">${bodyHtml}</div>
        <menu class="nw-dlg-actions">
          ${buttons.map(b => `<button
              value="${_dlgEscape(b.value)}"
              class="nw-dlg-btn${b.primary ? ' primary' : ''}${b.danger ? ' danger' : ''}"
              ${b.primary || b.danger ? 'autofocus' : ''}
            >${_dlgEscape(b.label)}</button>`).join('')}
        </menu>
      </form>
    `;
    document.body.appendChild(dlg);
    // This promise MUST settle exactly once, on every path. A dialog that leaves
    // the DOM without firing `close` used to leave the promise pending forever —
    // and a caller that caches it (aiEnsurePermission's permissionPrompts map)
    // then handed the same dead promise to every later request, wedging the app
    // permanently with no error and no timeout. Observed 2026-09-03 against Anvil:
    // "running" that never ends and "Stopping…" that never completes.
    let settled = false;
    const finish = (val) => {
      if (settled) return;
      settled = true;
      try { removalWatch.disconnect(); } catch (_) {}
      try { dlg.remove(); } catch (_) {}
      resolve(val);
    };
    const removalWatch = new MutationObserver(() => { if (!dlg.isConnected) finish('cancel'); });
    removalWatch.observe(document.body, { childList: true, subtree: true });
    dlg.addEventListener('close', () => finish(dlg.returnValue || 'cancel'), { once: true });
    dlg.showModal();
  });
}

async function nakliosAlert(message, opts = {}){
  await _nakliosDialog({
    title: opts.title || 'NakliOS',
    body: message,
    buttons: [{ value: 'ok', label: opts.okLabel || 'OK', primary: true }],
    kind: opts.kind || null,
    allowHtmlBody: !!opts.allowHtmlBody,
  });
}

async function nakliosConfirm(message, opts = {}){
  const v = await _nakliosDialog({
    title: opts.title || 'Are you sure?',
    body: message,
    buttons: [
      { value: 'cancel', label: opts.cancelLabel || 'Cancel' },
      { value: 'ok',     label: opts.okLabel     || 'OK',
        primary: !opts.danger, danger: !!opts.danger },
    ],
    allowHtmlBody: !!opts.allowHtmlBody,
  });
  return v === 'ok';
}

// nakliosPassphrase — dedicated dialog for passphrase entry.
//
// Built separately from nakliosAlert/nakliosConfirm because the password
// input needs hygiene rules native HTML form elements don't apply by default:
//   - autocomplete="current-password"  → tells the browser this is a sensitive
//     password field (excluded from form-restore on back/forward, not snapshot
//     by autofill heuristics, eligible for password-manager autofill)
//   - autocapitalize/autocorrect/spellcheck off → mobile keyboards otherwise
//     mangle the first character and can leak the value to spell-check services
//   - input.value is zeroed BEFORE the dialog closes, so the browser's
//     form-state cache doesn't snapshot a populated field
//   - the validator runs INSIDE the dialog: on failure we stay open with an
//     inline error, on success we close. No open-close-open jitter.
//   - we never log the passphrase value, anywhere. Inline comments mark
//     the temptation points.
//
// opts:
//   bucketHint  — shown in the title ("Welcome back to <bucketHint>"). Required
//                 in practice; falls back to a generic title if absent.
//   title       — override the default title entirely.
//   body        — optional explanatory text under the title.
//   okLabel     — submit button label (default "Unlock").
//   validate    — async (passphrase) => any. If it resolves, the dialog closes
//                 and the Promise resolves with whatever validate returned
//                 (often the unlocked instance). If it rejects with an Error,
//                 the message is shown inline and the dialog stays open for
//                 another attempt. If omitted, the dialog closes on first
//                 submit and resolves with the typed value.
//
// Returns Promise<T | null>, where null = user dismissed via Escape.
function nakliosPassphrase(opts = {}){
  return new Promise((resolve) => {
    const dlg = document.createElement('dialog');
    dlg.className = 'nw-dlg nw-dlg-passphrase';
    const titleText = opts.title || (
      opts.bucketHint
        ? 'Welcome back to ' + opts.bucketHint
        : 'Enter passphrase'
    );
    dlg.innerHTML = `
      <form method="dialog" class="nw-dlg-form">
        <h3 class="nw-dlg-title">${_dlgEscape(titleText)}</h3>
        ${opts.body ? `<p class="nw-dlg-hint">${_dlgEscape(opts.body)}</p>` : ''}
        <div class="nw-dlg-pass-row">
          <input type="password"
                 class="nw-dlg-pass-input"
                 autocomplete="current-password"
                 autocapitalize="off"
                 autocorrect="off"
                 spellcheck="false"
                 required>
          <button type="button" class="nw-dlg-pass-toggle"
                  aria-label="Show passphrase" tabindex="-1">👁</button>
        </div>
        <p class="nw-dlg-inline-error" hidden></p>
        <menu class="nw-dlg-actions">
          <button value="unlock" type="submit" class="nw-dlg-btn primary">${_dlgEscape(opts.okLabel || 'Unlock')}</button>
        </menu>
      </form>
    `;
    document.body.appendChild(dlg);

    const input  = dlg.querySelector('.nw-dlg-pass-input');
    const toggle = dlg.querySelector('.nw-dlg-pass-toggle');
    const err    = dlg.querySelector('.nw-dlg-inline-error');
    const form   = dlg.querySelector('form');
    const submit = form.querySelector('button[type="submit"]');

    toggle.addEventListener('click', () => {
      const isPwd = input.type === 'password';
      input.type = isPwd ? 'text' : 'password';
      toggle.setAttribute('aria-label', isPwd ? 'Hide passphrase' : 'Show passphrase');
      input.focus();
    });

    let resolved = false;

    // closeWith — the single path that resolves the outer Promise + closes the
    // dialog. Always zeroes the input first.
    const closeWith = (value) => {
      if (resolved) return;
      resolved = true;
      // SECURITY: clear the input value before close() so the browser's
      // form-restore cache doesn't snapshot a populated password field.
      input.value = '';
      resolve(value);
      try { dlg.close(); } catch(_){}
      // DOM removal happens in the 'close' listener below.
    };

    form.addEventListener('submit', async (e) => {
      // method="dialog" would close on submit automatically; we override so
      // we can keep the dialog open when the validator rejects.
      e.preventDefault();
      // SECURITY: do NOT log `pass`. It's held only as long as the validator
      // needs it; nothing in this scope persists past the await.
      const pass = input.value;
      if (!opts.validate){
        // No validator → just hand back the typed value.
        closeWith(pass);
        return;
      }
      submit.disabled = true;
      err.hidden = true; err.textContent = '';
      try {
        const result = await opts.validate(pass);
        // SECURITY: when a validator is supplied, the outer Promise must NOT
        // surface the passphrase to the caller — the validator already had it.
        // Pass back the validator's return value (e.g. an unlocked instance),
        // or `true` as a generic "succeeded" signal. Never the passphrase.
        closeWith(result === undefined ? true : result);
      } catch (validateErr){
        err.textContent = validateErr?.message
          || 'Wrong passphrase, or the credentials file is corrupt.';
        err.hidden = false;
        // SECURITY: clear and re-focus so the next attempt starts clean and
        // the failed value doesn't linger in the input.
        input.value = '';
        input.focus();
        submit.disabled = false;
      }
    });

    dlg.addEventListener('close', () => {
      try { dlg.remove(); } catch(_){}
      if (!resolved){
        // Reached via Escape — caller chose to cancel.
        resolved = true;
        input.value = '';
        resolve(null);
      }
    }, { once: true });

    dlg.showModal();
    // Focus after the dialog is fully open. setTimeout(0) is the standard tick.
    setTimeout(() => input.focus(), 0);
  });
}

// nakliosManualCreds({ title, body, validate }) — 5-field dialog:
// bucketName, accountId, accessKey, secretKey, passphrase. validate(vals)
// is async; throw to keep the dialog open with an inline error, resolve
// to close. Returns the validator's result or null on Escape.
//
// Used by the Crate-connect "I lost the file" fallback. Same dialog
// shape + semantics as nakliosPassphrase but with multiple fields.
function nakliosManualCreds(opts = {}){

        <p class="nw-dlg-callout">New to this? The easier path is <strong>Open Crate setup…</strong> — it walks you through Cloudflare and hands the encrypted setup straight back. Use this form if you already have your R2 bucket and API keys.</p>
        <label class="nw-dlg-field">
          <span class="nw-dlg-label">Bucket name</span>
          <input name="bucketName" type="text" autocomplete="off"
                 autocapitalize="off" autocorrect="off" spellcheck="false"
                 required class="nw-dlg-input">
          <p class="nw-dlg-fieldhint">The name of your Cloudflare R2 bucket.</p>
        </label>
        <label class="nw-dlg-field">
          <span class="nw-dlg-label">Cloudflare Account ID</span>
          <input name="accountId" type="text" autocomplete="off"
                 autocapitalize="off" autocorrect="off" spellcheck="false"
                 required class="nw-dlg-input mono">
          <p class="nw-dlg-fieldhint">32-hex, in the right sidebar of your Cloudflare dashboard. <a href="https://dash.cloudflare.com/?to=/:account/r2/overview" target="_blank" rel="noopener">Open R2 ↗</a></p>
        </label>
        <label class="nw-dlg-field">
          <span class="nw-dlg-label">Access Key ID</span>
          <input name="accessKey" type="text" autocomplete="off"
                 autocapitalize="off" autocorrect="off" spellcheck="false"
                 required class="nw-dlg-input mono">
          <p class="nw-dlg-fieldhint">From an R2 API token with <strong>Object Read &amp; Write</strong>. <a href="https://dash.cloudflare.com/?to=/:account/r2/api-tokens" target="_blank" rel="noopener">Manage R2 API tokens ↗</a></p>
        </label>
        <label class="nw-dlg-field">
          <span class="nw-dlg-label">Secret Access Key</span>
          <input name="secretKey" type="password" autocomplete="off"
                 autocapitalize="off" autocorrect="off" spellcheck="false"
                 required class="nw-dlg-input mono">
          <p class="nw-dlg-fieldhint">Shown only once when you create the token — paste it now.</p>
        </label>
        <label class="nw-dlg-field">
          <span class="nw-dlg-label">Folder passphrase</span>
          <input name="passphrase" type="password" autocomplete="current-password"
                 autocapitalize="off" autocorrect="off" spellcheck="false"
                 required class="nw-dlg-input">
          <p class="nw-dlg-fieldhint">The passphrase you chose when you created this Crate.</p>
        </label>
        <p class="nw-dlg-callout">Your bucket also needs a CORS policy allowing <code>${_dlgEscape(location.origin)}</code>. If the connection fails on CORS, NakliOS shows the exact policy to paste and a link to the right Cloudflare page.</p>
        <p class="nw-dlg-inline-error" hidden></p>
        <menu class="nw-dlg-actions">
          <button value="cancel" type="button" class="nw-dlg-btn">Cancel</button>
          <button value="ok" type="submit" class="nw-dlg-btn primary">${_dlgEscape(opts.okLabel || 'Unlock')}</button>
        </menu>
      </form>
    `;
    dlg.setAttribute('aria-labelledby', 'nw-manual-creds-title');
    if (opts.body) dlg.setAttribute('aria-describedby', 'nw-manual-creds-hint');
    document.body.appendChild(dlg);

    const form   = dlg.querySelector('form');
    const submit = form.querySelector('button[type="submit"]');
    const cancel = form.querySelector('button[value="cancel"]');
    const err    = dlg.querySelector('.nw-dlg-inline-error');
    const inputs = Array.from(form.querySelectorAll('input'));
    const passInput = form.querySelector('input[name="passphrase"]');
    const secretInput = form.querySelector('input[name="secretKey"]');

    let resolved = false;
    const clearSecrets = () => {
      passInput.value = '';
      secretInput.value = '';
    };
    const closeWith = (value) => {
      if (resolved) return;
      resolved = true;
      clearSecrets();
      resolve(value);
      try { dlg.close(); } catch(_){}
    };

    cancel.addEventListener('click', (e) => {
      e.preventDefault();
      closeWith(null);
    });

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const vals = {};
      for (const i of inputs) vals[i.name] = i.value;
      if (!opts.validate){ closeWith(vals); return; }
      submit.disabled = true;
      err.hidden = true; err.textContent = '';
      try {
        const result = await opts.validate(vals);
        closeWith(result === undefined ? true : result);
      } catch (validateErr){
        err.textContent = validateErr?.message
          || 'Unlock failed — check your inputs.';
        err.hidden = false;
        // Keep typed fields; only the passphrase + secret get cleared so
        // the next attempt starts clean on the secret-bearing inputs.
        clearSecrets();
        passInput.focus();
        submit.disabled = false;
      }
    });

    dlg.addEventListener('close', () => {
      try { dlg.remove(); } catch(_){}
      if (!resolved){
        resolved = true;
        clearSecrets();
        resolve(null);
      }
    }, { once: true });

    dlg.showModal();
    setTimeout(() => inputs[0].focus(), 0);
  });
}

function applyTheme(id){
  const t = THEMES.find(x => x.id === id) || THEMES[0];
  const r = document.documentElement.style;
  for (const [k, v] of Object.entries(t.colors)){
    r.setProperty('--' + k.toLowerCase(), v);
  }
  r.setProperty('--wallpaper', t.wallpaper);
  r.setProperty('--tile-bg', `color-mix(in srgb, ${t.colors.PANEL} 70%, ${t.colors.BODY})`);
  const desk = document.getElementById('desktop');
  if (desk) desk.classList.toggle('wp-light', t.mood === 'light');
  state.theme = t.id;
  localStorage.setItem(LS_KEY.theme, t.id);
  fsScheduleStateWrite();
  // Update any open iframe windows so apps that listen can re-theme
  document.querySelectorAll('.nw-window iframe').forEach(f => {
    try { f.contentWindow.postMessage({ type:'naklios:theme', theme:t.id, colors:t.colors, mood:t.mood }, '*'); } catch(_){}
  });
}

// ICON GRID
// ════════════════════════════════════════════════════════════════════
const ICON_W = 104, ICON_H = 124; // grid cell (with label below)
const GRID_PAD = 24;

// Items shown on the main desktop: task folders, then any apps deliberately
// pulled out by the user (or defensively left ungrouped).
function getDesktopItems(){
  const items = [];
  for (const folder of FOLDERS) items.push(folder);
  for (const app of APPS){
    if (isInFolder(app.id)) continue; // dynamic — respects state.layout.unfoldered
    items.push(app);
  }
  return items;
}

function getGridDims(){
  const area = document.getElementById('icon-area').getBoundingClientRect();
  return {
    cols: Math.max(1, Math.floor((area.width  - GRID_PAD*2) / ICON_W)),
    rows: Math.max(1, Math.floor((area.height - GRID_PAD*2) / ICON_H)),
  };
}

function computeAutoPositions(){
  // Two-pass column-major placement: left-aligned items fill from x=0 rightward,
  // right-aligned items (desktopAlign:'right') fill from x=cols-1 leftward,
  // sorted by desktopOrder so we control top-to-bottom rank.
  const { cols, rows } = getGridDims();
  const used = new Set();
  for (const [id, pos] of Object.entries(state.layout.positions || {})){
    used.add(`${pos.x},${pos.y}`);
  }
  const result = {};
  const items = getDesktopItems().filter(it =>
    !(state.layout.hidden && state.layout.hidden.includes(it.id))
  );
  const rightItems = items
    .filter(it => it.desktopAlign === 'right')
    .sort((a, b) => (a.desktopOrder ?? 99) - (b.desktopOrder ?? 99));
  const leftItems = items.filter(it => it.desktopAlign !== 'right');

  // Reserve the rightmost column for right items when both kinds exist.
  const leftMaxCol = (rightItems.length > 0 && cols > 1) ? cols - 2 : cols - 1;

  for (const item of leftItems){
    if (state.layout.positions[item.id]) { result[item.id] = state.layout.positions[item.id]; continue; }
    outer: for (let x = 0; x <= leftMaxCol; x++){
      for (let y = 0; y < rows; y++){
        const k = `${x},${y}`;
        if (!used.has(k)) { used.add(k); result[item.id] = {x, y}; break outer; }
      }
    }
    if (!result[item.id]) result[item.id] = {x:0, y:0};
  }

  for (const item of rightItems){
    if (state.layout.positions[item.id]) { result[item.id] = state.layout.positions[item.id]; continue; }
    outer: for (let x = cols - 1; x >= 0; x--){
      for (let y = 0; y < rows; y++){
        const k = `${x},${y}`;
        if (!used.has(k)) { used.add(k); result[item.id] = {x, y}; break outer; }
      }
    }
    if (!result[item.id]) result[item.id] = {x:0, y:0};
  }
  return result;
}

function renderIcons(){
  const area = document.getElementById('icon-area');
  area.innerHTML = '';
  const mobile = isMobile();
  document.body.classList.toggle('is-mobile', mobile);
  const positions = mobile ? null : computeAutoPositions();

  let list = getDesktopItems();
  if (mobile){
    const pos = state.layout.positions || {};
    list = list.slice().sort((a, b) => {
      const pa = pos[a.id] || {x:99, y:99};
      const pb = pos[b.id] || {x:99, y:99};
      if (pa.y !== pb.y) return pa.y - pb.y;
      return pa.x - pb.x;
    });
  } else {
    // Absolute positioning must not make keyboard focus jump around the screen.
    // Follow the same column-major order used by the desktop auto-layout.
    list = list.slice().sort((a, b) => {
      const pa = positions[a.id] || {x:99, y:99};
      const pb = positions[b.id] || {x:99, y:99};
      if (pa.x !== pb.x) return pa.x - pb.x;
      return pa.y - pb.y;
    });
  }

  for (const item of list){
    if (state.layout.hidden && state.layout.hidden.includes(item.id)) continue;
    const isFolder = item.kind === 'folder';
    const el = document.createElement('button');
    el.className = 'nw-icon' + (isFolder ? ' is-folder' : '');
    if (item.private) el.classList.add('private');
    el.dataset.id = item.id;
    el.setAttribute('aria-label', isFolder ? `${item.name} folder` : item.name);
    el.title = isFolder
      ? `${item.name} folder · ${item.apps.length} apps`
      : (item.description ? `${item.name} — ${item.description}` : item.name);
    const bgVar = item.bg || 'brand';
    const bgColor = `color-mix(in srgb, var(--${bgVar}) 22%, var(--panel))`;
    const monoChar = (item.name || '?').charAt(0).toUpperCase();
    // For folders, build a 2×2 mini-preview from the first 4 contained apps' glyphs
    const previewHTML = isFolder
      ? `<div class="nw-folder-mini">${item.apps.slice(0,4).map(aid => {
            const a = APPS.find(x => x.id === aid);
            if (a?.svg) return `<span><svg class="nw-icon-svg" viewBox="0 0 24 24" aria-hidden="true">${a.svg}</svg></span>`;
            return `<span>${_dlgEscape(a?.glyph || '·')}</span>`;
          }).join('')}</div>`
      : item.svg
        ? `<svg class="nw-icon-svg" viewBox="0 0 24 24" aria-hidden="true">${item.svg}</svg>`
        : `<span class="nw-icon-glyph">${_dlgEscape(item.glyph || monoChar)}</span>`;
    el.innerHTML = `
      <div class="nw-icon-tile ${item.glyph ? 'has-glyph' : ''}" style="background:${bgColor}; border-color:color-mix(in srgb, var(--${bgVar}) 30%, var(--line));">
        ${previewHTML}
      </div>
      <div class="nw-icon-label">${_dlgEscape(item.name)}</div>
    `;
    if (!mobile && positions[item.id]){
      const p = positions[item.id];
      el.style.left = (GRID_PAD + p.x * ICON_W) + 'px';
      el.style.top = (GRID_PAD + p.y * ICON_H) + 'px';
    }
    el.addEventListener('click', () => {
      if (el._wasDragged) { el._wasDragged = false; return; }
      if (isFolder) openFolder(item);
      else openApp(item);
    });
    el.addEventListener('contextmenu', e => {
      e.preventDefault();
      const menuItems = [
        { label: isPinned(item.id) ? 'Unpin from dock' : 'Pin to dock',
          onClick: () => isPinned(item.id) ? unpinItem(item.id) : pinItem(item.id) },
      ];
      if (!isFolder && (state.layout.unfoldered || []).includes(item.id)){
        menuItems.push({ separator:true });
        menuItems.push({ label: 'Move back into its folder', onClick: () => {
          state.layout.unfoldered = (state.layout.unfoldered || []).filter(x => x !== item.id);
          delete state.layout.positions[item.id];
          saveLayout();
          renderIcons();
        }});
      }
      showContextMenu(e.clientX, e.clientY, menuItems);
    });
    if (!mobile) makeIconDraggable(el, item);
    area.appendChild(el);
  }
  renderStickies();
}

function makeIconDraggable(el, app){
  el.addEventListener('pointerdown', e => {
    if (e.button !== 0) return;
    e.preventDefault();
    const startX = e.clientX, startY = e.clientY;
    const origLeft = parseFloat(el.style.left) || 0;
    const origTop = parseFloat(el.style.top) || 0;
    let dragging = false;
    let hoverFolderEl = null;
    let hoverFolderTimer = null;
    let absorbed = false;

    function overDock(ev){
      const dock = document.getElementById('nw-dock');
      if (!dock) return false;
      const r = dock.getBoundingClientRect();
      return ev.clientX >= r.left - 12 && ev.clientX <= r.right + 12
          && ev.clientY >= r.top - 12 && ev.clientY <= r.bottom + 12;
    }
    function findFolderUnder(ev){
      if (app.kind === 'folder') return null; // can't drop a folder into a folder
      const els = document.elementsFromPoint(ev.clientX, ev.clientY);
      return els.find(e => e !== el && e.classList?.contains('nw-icon') && e.classList.contains('is-folder')) || null;
    }
    function clearHoverFolder(){
      if (hoverFolderTimer) { clearTimeout(hoverFolderTimer); hoverFolderTimer = null; }
      hoverFolderEl?.classList.remove('is-drop-target');
      hoverFolderEl = null;
    }
    function absorbIntoFolder(folderEl){
      const folderId = folderEl.dataset.id;
      const folder = FOLDERS.find(f => f.id === folderId);
      if (!folder || folder.apps.includes(app.id)) return;
      folder.apps.push(app.id);
      state.layout.unfoldered = (state.layout.unfoldered || []).filter(x => x !== app.id);
      delete state.layout.positions[app.id];
      saveLayout();
      absorbed = true;
      el.remove();
      renderIcons();
    }

    const onMove = ev => {
      const dx = ev.clientX - startX, dy = ev.clientY - startY;
      if (!dragging && Math.hypot(dx, dy) > 4) {
        dragging = true; el.classList.add('dragging');
      }
      if (dragging){
        el.style.left = (origLeft + dx) + 'px';
        el.style.top = (origTop + dy) + 'px';
        const dock = document.getElementById('nw-dock');
        if (dock) dock.classList.toggle('is-drop-target', overDock(ev));
        // Hover-over-folder: 500ms dwell => absorb the dragged app.
        const folderEl = findFolderUnder(ev);
        if (folderEl !== hoverFolderEl){
          clearHoverFolder();
          if (folderEl){
            hoverFolderEl = folderEl;
            folderEl.classList.add('is-drop-target');
            hoverFolderTimer = setTimeout(() => absorbIntoFolder(folderEl), 500);
          }
        }
      }
    };
    const onUp = ev => {
      document.removeEventListener('pointermove', onMove);
      document.removeEventListener('pointerup', onUp);
      document.removeEventListener('pointercancel', onUp);
      document.getElementById('nw-dock')?.classList.remove('is-drop-target');
      if (absorbed) return;
      // Release while hovering a folder also absorbs (no need to wait the 500ms).
      const folderUnder = dragging ? findFolderUnder(ev) : null;
      clearHoverFolder();
      if (folderUnder){
        el.classList.remove('dragging');
        el._wasDragged = true;
        absorbIntoFolder(folderUnder);
        setTimeout(() => { el._wasDragged = false; }, 50);
        return;
      }
      if (!dragging) return;
      el.classList.remove('dragging');
      el._wasDragged = true;
      if (overDock(ev) && app.kind !== 'folder'){
        // Pin to dock; restore icon to its original grid position
        el.style.left = (GRID_PAD + (state.layout.positions[app.id]?.x ?? 0) * ICON_W) + 'px';
        el.style.top = (GRID_PAD + (state.layout.positions[app.id]?.y ?? 0) * ICON_H) + 'px';
        pinItem(app.id);
      } else if (overDock(ev)){
        // Folder dropped on dock: folders can't be pinned, so snap back to origin.
        el.style.left = origLeft + 'px';
        el.style.top = origTop + 'px';
      } else {
        // Snap to grid; if a different icon already sits at the target cell, swap them.
        // Clamp to bounds so dragging off-screen doesn't lose the icon or trigger a scrollbar.
        const { cols, rows } = getGridDims();
        const x = Math.max(0, Math.min(cols - 1, Math.round((parseFloat(el.style.left) - GRID_PAD) / ICON_W)));
        const y = Math.max(0, Math.min(rows - 1, Math.round((parseFloat(el.style.top) - GRID_PAD) / ICON_H)));
        const origX = Math.round((origLeft - GRID_PAD) / ICON_W);
        const origY = Math.round((origTop - GRID_PAD) / ICON_H);
        let displaced = null;
        document.querySelectorAll('#icon-area .nw-icon').forEach(other => {
          if (other === el) return;
          const ox = Math.round((parseFloat(other.style.left) - GRID_PAD) / ICON_W);
          const oy = Math.round((parseFloat(other.style.top) - GRID_PAD) / ICON_H);
          if (ox === x && oy === y) displaced = other;
        });
        if (displaced){
          state.layout.positions[displaced.dataset.id] = { x: origX, y: origY };
          displaced.style.left = (GRID_PAD + origX * ICON_W) + 'px';
          displaced.style.top = (GRID_PAD + origY * ICON_H) + 'px';
        }
        el.style.left = (GRID_PAD + x * ICON_W) + 'px';
        el.style.top = (GRID_PAD + y * ICON_H) + 'px';
        state.layout.positions[app.id] = {x, y};
        saveLayout();
      }
      setTimeout(() => { el._wasDragged = false; }, 50);
    };
    document.addEventListener('pointermove', onMove);
    document.addEventListener('pointerup', onUp);
    document.addEventListener('pointercancel', onUp);
  });
}
