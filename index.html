function aiWebGpuAvailable(){
  return !!navigator.gpu && typeof Worker !== 'undefined';
}

function aiRuntimeAvailable(model = aiSelectedModel()){
  if (model.runtime === 'endpoint') {
    return !!model.baseUrl && !!model.model && typeof fetch === 'function';
  }
  if (model.runtime === 'ondevice') return aiNano.available;
  return aiWebGpuAvailable();
}

function aiImageRuntimeAvailable(model = aiSelectedImageModel()){
  if (model.runtime === 'endpoint-image') {
    return !!model.baseUrl && !!model.model && typeof fetch === 'function';
  }
  return aiWebGpuAvailable();
}

function aiManifestAllows(appId){
  const app = APPS.find(item => item.id === appId);
  return !app?.thirdParty || (app.permissions || []).includes('inference');
}

function aiCapabilityForApp(appId){
  const decision = aiPermissionDecision(appId);
  return aiGeneralRuntimeAvailable() &&
    aiManifestAllows(appId) &&
    decision?.granted !== false;
}

function aiImageCapabilityForApp(appId){
  const decision = aiPermissionDecision(appId, aiImagePermissionScope());
  return aiImageRuntimeAvailable() &&
    aiManifestAllows(appId) &&
    decision?.granted !== false;
}

function aiSetState(next, error = null){
  aiHost.state = next;
  aiHost.error = error ? String(error?.message || error) : null;
  try { broadcastCapabilities(); } catch(_){}
}

function aiSetImageState(next, error = null){
  aiImageHost.state = next;
  aiImageHost.error = error ? String(error?.message || error) : null;
  try { broadcastCapabilities(); } catch(_){}
}

async function aiEnsurePermission(appId, capability = 'chat'){
  const image = capability === 'image';
  const model = image ? aiSelectedImageModel() : aiSelectedModel();
  const available = image
    ? aiImageRuntimeAvailable(model)
    : aiRuntimeAvailable(model);
  if (!aiManifestAllows(appId) || !available) return false;
  const scope = image ? aiImagePermissionScope(model) : aiPermissionScope(model);
  const saved = aiPermissionDecision(appId, scope);
  if (saved?.granted === true) return true;
  if (saved?.granted === false) return false;
  const promptKey = `${appId}:${scope}`;
  if (aiHost.permissionPrompts.has(promptKey)) return aiHost.permissionPrompts.get(promptKey);

  const prompt = (async () => {
    const app = APPS.find(item => item.id === appId);
    const name = app?.name || appId;
    const action = image ? 'generate images with NakliOS AI' : 'use NakliOS AI';
    const contentName = image ? 'Image prompts and generated images' : 'Prompts and replies';
    let boundary;
    if (model.scope === 'device'){
      boundary =
        `The shared ${image ? AI_IMAGE_MODEL_LABEL : AI_MODEL_LABEL} model runs in this browser. ` +
        `Its first use downloads ${model.size} and caches it on this device. ` +
        `${contentName} stay in this tab and are not shared with other apps.`;
    } else if (model.scope === 'local-endpoint'){
      boundary =
        `${contentName} will be sent to the configured ` +
        `${image ? AI_IMAGE_MODEL_LABEL : AI_MODEL_LABEL} service at ${model.baseUrl}. ` +
        `NakliOS keeps the endpoint and any credential hidden from apps.`;
    } else {
      boundary =
        `${contentName} will leave this device and be sent to ` +
        `${image ? AI_IMAGE_MODEL_LABEL : AI_MODEL_LABEL} at ${model.baseUrl}. ` +
        `NakliOS keeps your API key hidden from apps.`;
    }
    const granted = await nakliosConfirm(
      `${name} wants to ${action}.\n\n${boundary}`,
      {
        title:image ? 'Allow image generation?' : 'Allow AI?',
        okLabel:'Allow',
        cancelLabel:'Not now',
      }
    );
    const current = state.aiPermissions[appId] || {};
    state.aiPermissions[appId] = {
      ...current,
      scopes:{
        ...(current.scopes || {}),
        [scope]:{ granted, decidedAt:Date.now() },
      },
    };
    saveAiPermissions();
    broadcastCapabilities();
    return granted;
  })().finally(() => aiHost.permissionPrompts.delete(promptKey));
  aiHost.permissionPrompts.set(promptKey, prompt);
  return prompt;
}

function aiEmit(request, event){
  try {
    request.source.postMessage({
      type:request.kind === 'image'
        ? 'naklios:ai:image:event'
        : 'naklios:ai:event',
      requestId:request.requestId,
      model:request.model?.id ||
        (request.kind === 'image' ? AI_IMAGE_MODEL_ID : AI_MODEL_ID),
      ...event,
    }, '*');
  } catch(_){}
}

function aiFailWorker(error){
  const failure = error instanceof Error ? error : new Error(String(error || 'Local AI worker failed'));
  if (aiHost.loadReject) aiHost.loadReject(failure);
  if (aiHost.activeReject) aiHost.activeReject(failure);
  aiHost.loadResolve = null;
  aiHost.loadReject = null;
  aiHost.activeResolve = null;
  aiHost.activeReject = null;
  aiHost.loadPromise = null;
  try { aiHost.worker?.terminate(); } catch(_){}
  aiHost.worker = null;
  aiHost.workerModelKey = null;
  aiSetState('error', failure);
}

function aiCreateWorker(model){
  if (aiHost.worker && aiHost.workerModelKey === model.key) return aiHost.worker;
  if (aiHost.worker){
    try { aiHost.worker.postMessage({ type:'unload' }); } catch(_){}
    try { aiHost.worker.terminate(); } catch(_){}
    aiHost.worker = null;
    aiHost.workerModelKey = null;
  }
  const url = new URL(`vendor/localmind/${model.worker}`, document.baseURI);
  const worker = new Worker(url, {
    type:'module',
    name:`naklios-localmind-${model.key}`,
  });
  worker.addEventListener('message', event => {
    const msg = event.data || {};
    if (msg.protocol && msg.protocol !== AI_PROTOCOL) return;
    if (msg.id === AI_LOAD_REQUEST_ID){
      if (msg.type === 'progress'){
        aiHost.loadListeners.forEach(listener => {
          try { listener(msg.data || {}); } catch(_){}
        });
      } else if (msg.type === 'ready'){
        const resolve = aiHost.loadResolve;
        aiHost.loadResolve = null;
        aiHost.loadReject = null;
        aiSetState('ready');
        resolve?.();
      } else if (msg.type === 'error'){
        aiFailWorker(new Error(msg.message || 'Local AI model failed to load'));
      }
      return;
    }
    const request = aiHost.active;
    if (!request || msg.id !== request.workerRequestId) return;
    if (msg.type === 'token'){
      aiEmit(request, { event:'token', token:String(msg.token || '') });
    } else if (msg.type === 'complete'){
      const resolve = aiHost.activeResolve;
      aiHost.activeResolve = null;
      aiHost.activeReject = null;
      resolve?.(msg.finishReason || 'stop');
    } else if (msg.type === 'error'){
      const reject = aiHost.activeReject;
      aiHost.activeResolve = null;
      aiHost.activeReject = null;
      reject?.(new Error(msg.message || 'Local AI generation failed'));
    }
  });
  worker.addEventListener('error', event => {
    aiFailWorker(new Error(event.message || 'Local AI worker crashed'));
  });
  aiHost.worker = worker;
  aiHost.workerModelKey = model.key;
  return worker;
}

function aiReleaseChatWorker(){
  try { aiHost.worker?.postMessage({ type:'unload' }); } catch(_){}
  try { aiHost.worker?.terminate(); } catch(_){}
  aiHost.worker = null;
  aiHost.workerModelKey = null;
  aiHost.loadPromise = null;
  aiHost.loadResolve = null;
  aiHost.loadReject = null;
  aiSetState('idle');
}

function aiFailImageWorker(error){
  const failure = error instanceof Error
    ? error
    : new Error(String(error || 'Local image worker failed'));
  if (aiImageHost.loadReject) aiImageHost.loadReject(failure);
  if (aiImageHost.activeReject) aiImageHost.activeReject(failure);
  aiImageHost.loadResolve = null;
  aiImageHost.loadReject = null;
  aiImageHost.activeResolve = null;
  aiImageHost.activeReject = null;
  aiImageHost.loadPromise = null;
  try { aiImageHost.worker?.terminate(); } catch(_){}
  aiImageHost.worker = null;
  aiImageHost.workerModelKey = null;
  aiSetImageState('error', failure);
}

function aiDestroyImageWorker(){
  try { aiImageHost.worker?.postMessage({ type:'destroy' }); } catch(_){}
  try { aiImageHost.worker?.terminate(); } catch(_){}
  aiImageHost.worker = null;
  aiImageHost.workerModelKey = null;
  aiImageHost.loadPromise = null;
  aiImageHost.loadResolve = null;
  aiImageHost.loadReject = null;
  aiImageHost.activeResolve = null;
  aiImageHost.activeReject = null;
  aiSetImageState('idle');
}

function aiCreateImageWorker(model){
  if (aiImageHost.worker && aiImageHost.workerModelKey === model.key) {
    return aiImageHost.worker;
  }
  if (aiImageHost.worker) aiDestroyImageWorker();
  const url = new URL(`vendor/localmind/${model.worker}`, document.baseURI);
  const worker = new Worker(url, {
    type:'module',
    name:`naklios-localmind-image-${model.key}`,
  });
  worker.addEventListener('message', event => {
    const msg = event.data || {};
    if (msg.protocol && msg.protocol !== AI_IMAGE_PROTOCOL) return;
    if (msg.id === AI_IMAGE_LOAD_REQUEST_ID){
      if (msg.type === 'progress'){
        aiImageHost.loadListeners.forEach(listener => {
          try { listener(msg); } catch(_){}
        });
      } else if (msg.type === 'loaded'){
        const resolve = aiImageHost.loadResolve;
        aiImageHost.loadResolve = null;
        aiImageHost.loadReject = null;
        aiSetImageState('ready');
        resolve?.();
      } else if (msg.type === 'error'){
        aiFailImageWorker(new Error(msg.message || 'Local image model failed to load'));
      }
      return;
    }
    const request = aiHost.active;
    if (!request || request.kind !== 'image' ||
        msg.id !== request.workerRequestId) return;
    if (msg.type === 'step'){
      aiEmit(request, {
        event:'status',
        status:'generating',
        progress:{ step:Number(msg.step) || 0, total:Number(msg.total) || 0 },
      });
    } else if (msg.type === 'log'){
      aiEmit(request, {
        event:'status',
        status:'generating',
        progress:{ message:String(msg.message || '') },
      });
    } else if (msg.type === 'image'){
      const resolve = aiImageHost.activeResolve;
      aiImageHost.activeResolve = null;
      aiImageHost.activeReject = null;
      resolve?.(msg);
    } else if (msg.type === 'error'){
      const reject = aiImageHost.activeReject;
      aiImageHost.activeResolve = null;
      aiImageHost.activeReject = null;
      reject?.(new Error(msg.message || 'Local image generation failed'));
    }
  });
  worker.addEventListener('error', event => {
    aiFailImageWorker(new Error(event.message || 'Local image worker crashed'));
  });
  aiImageHost.worker = worker;
  aiImageHost.workerModelKey = model.key;
  return worker;
}

async function aiEnsureLoaded(model, onProgress){
  if (aiImageHost.worker) aiDestroyImageWorker();
  if (model.runtime === 'endpoint' || model.runtime === 'ondevice'){
    aiSetState('ready');
    return;
  }
  if (aiHost.state === 'ready' && aiHost.worker &&
      aiHost.workerModelKey === model.key) return;
  if (typeof onProgress === 'function') aiHost.loadListeners.add(onProgress);
  try {
    if (!aiHost.loadPromise){
      aiSetState('loading');
      const worker = aiCreateWorker(model);
      aiHost.loadPromise = new Promise((resolve, reject) => {
        aiHost.loadResolve = resolve;
        aiHost.loadReject = reject;
      });
      worker.postMessage({
        type:'load',
        id:AI_LOAD_REQUEST_ID,
        modelId:model.id,
        dtype:model.dtype,
        modelType:model.modelType,
        modelClass:model.modelClass,
      });
    }
    await aiHost.loadPromise;
  } finally {
    if (typeof onProgress === 'function') aiHost.loadListeners.delete(onProgress);
  }
}

async function aiEnsureImageLoaded(model, onProgress){
  if (model.runtime === 'endpoint-image'){
    aiSetImageState('ready');
    return;
  }
  if (aiHost.worker) aiReleaseChatWorker();
  if (aiImageHost.state === 'ready' && aiImageHost.worker &&
      aiImageHost.workerModelKey === model.key) return;
  if (typeof onProgress === 'function') aiImageHost.loadListeners.add(onProgress);
  try {
    if (!aiImageHost.loadPromise){
      aiSetImageState('loading');
      const worker = aiCreateImageWorker(model);
      aiImageHost.loadPromise = new Promise((resolve, reject) => {
        aiImageHost.loadResolve = resolve;
        aiImageHost.loadReject = reject;
      });
      worker.postMessage({
        type:'load',
        id:AI_IMAGE_LOAD_REQUEST_ID,
        modelId:model.id,
      });
    }
    await aiImageHost.loadPromise;
  } finally {
    if (typeof onProgress === 'function') {
      aiImageHost.loadListeners.delete(onProgress);
    }
  }
}

// Agent-tier protocol core (raised caps + tool-calling). Lazy-loaded like the
// Rig fileops module; only touched when a system app asks for the agent tier —
// the narrow-chat path never imports it.
let _aiAgentProtoMod = null;
async function aiAgentProto(){
  if (!_aiAgentProtoMod) _aiAgentProtoMod = await import('./sys/ai/agent-protocol.mjs');
  return _aiAgentProtoMod;
}
function aiAppIsSystem(appId){
  const app = APPS.find(item => item.id === appId);
  return !!app && !app.thirdParty;
}

function aiNormaliseMessages(messages){
  if (!Array.isArray(messages) || messages.length === 0 || messages.length > AI_MAX_MESSAGES) {
    throw new Error(`Local AI requires 1–${AI_MAX_MESSAGES} messages`);
  }
  let total = 0;
  return messages.map(message => {
    const role = message?.role === 'system' || message?.role === 'assistant'
      ? message.role
      : 'user';
    if (typeof message?.content !== 'string') throw new Error('Local AI message content must be text');
    total += message.content.length;
    if (total > AI_MAX_INPUT_CHARS) throw new Error('Local AI input is too large');
    return { role, content:message.content };
  });
}

function aiNextRequest(){
  if (!aiHost.queue.length) return null;
  let index = aiHost.queue.findIndex(request => request.appId !== aiHost.lastAppId);
  if (index < 0) index = 0;
  const [request] = aiHost.queue.splice(index, 1);
  aiHost.lastAppId = request.appId;
  return request;
}

function aiGenerateWorker(request){
  return new Promise((resolve, reject) => {
    aiHost.activeResolve = resolve;
    aiHost.activeReject = reject;
    aiHost.worker.postMessage({
      type:'generate',
      id:request.workerRequestId,
      messages:request.messages,
      generationConfig:{
        ...(request.model.generationConfig || {}),
        max_tokens:request.maxTokens,
        max_new_tokens:request.maxTokens,
        reset:true,
      },
    });
  });
}

function aiEndpointHeaders(model){
  const headers = { 'Content-Type':'application/json' };
  const apiKey = aiEndpointApiKey(model.baseUrl);
  if (apiKey) headers.Authorization = `Bearer ${apiKey}`;
  if (model.preset === 'openrouter'){
    headers['HTTP-Referer'] = location.origin;
    headers['X-Title'] = 'NakliOS';
  }
  return headers;
}

function aiEndpointImageUrl(baseUrl){
  const base = aiNormaliseEndpointBase(baseUrl);
  if (/\/images\/generations$/i.test(base)) return base;
  return `${base}/images/generations`;
}

function aiBytesToBase64(bytes){
  const view = bytes instanceof Uint8Array ? bytes : new Uint8Array(bytes || []);
  let binary = '';
  const chunkSize = 0x8000;
  for (let offset = 0; offset < view.length; offset += chunkSize){
    binary += String.fromCharCode(...view.subarray(offset, offset + chunkSize));
  }
  return btoa(binary);
}

function aiGenerateImageWorker(request){
  return new Promise((resolve, reject) => {
    aiImageHost.activeResolve = resolve;
    aiImageHost.activeReject = reject;
    aiImageHost.worker.postMessage({
      type:'generate',
      id:request.workerRequestId,
      prompt:request.prompt,
      width:request.width,
      height:request.height,
      steps:request.steps,
      seed:request.seed,
    });
  });
}

async function aiGenerateEndpointImage(request){
  const controller = new AbortController();
  aiHost.endpointAbort = controller;
  try {
    const body = {
      model:request.model.model,
      prompt:request.prompt,
      n:1,
      size:request.size,
      output_format:'png',
    };
    if (request.quality !== 'auto') body.quality = request.quality;
    const response = await fetch(aiEndpointImageUrl(request.model.baseUrl), {
      method:'POST',
      headers:aiEndpointHeaders(request.model),
      signal:controller.signal,
      body:JSON.stringify(body),
    });
    if (!response.ok) throw new Error(await aiReadEndpointError(response));
    const data = await response.json();
    const image = data?.data?.[0];
    if (!image || (typeof image.b64_json !== 'string' &&
        typeof image.url !== 'string')) {
      throw new Error('Image endpoint returned no image');
    }
    let base64 = typeof image.b64_json === 'string' ? image.b64_json : null;
    let mimeType = 'image/png';
    if (!base64 && image.url){
      const imageResponse = await fetch(image.url, { signal:controller.signal });
      if (!imageResponse.ok) {
        throw new Error(`Could not retrieve the generated image (${imageResponse.status})`);
      }
      mimeType = imageResponse.headers.get('content-type') || mimeType;
      base64 = aiBytesToBase64(await imageResponse.arrayBuffer());
    }
    return {
      b64_json:base64,
      url:null,
      revised_prompt:typeof image.revised_prompt === 'string'
        ? image.revised_prompt
        : null,
      mime_type:mimeType,
      width:request.width,
      height:request.height,
      seed:null,
      created:Number(data?.created) || Math.floor(Date.now() / 1000),
    };
  } finally {
    aiHost.endpointAbort = null;
  }
}

async function aiGenerateImage(request){
  if (request.model.runtime === 'endpoint-image'){
    return aiGenerateEndpointImage(request);
  }
  const result = await aiGenerateImageWorker(request);
  return {
    b64_json:aiBytesToBase64(result.bytes),
    url:null,
    revised_prompt:null,
    mime_type:'image/png',
    width:Number(result.width) || request.width,
    height:Number(result.height) || request.height,
    seed:Number.isFinite(Number(result.seed)) ? Number(result.seed) : request.seed,
    created:Math.floor(Date.now() / 1000),
  };
}

async function aiReadEndpointError(response){
  let detail = '';
  try {
    const data = await response.json();
    detail = data?.error?.message || data?.message || '';
  } catch(_) {
    try { detail = (await response.text()).slice(0, 300); } catch(_){}
  }
  return detail
    ? `AI endpoint returned ${response.status}: ${detail}`
    : `AI endpoint returned ${response.status}`;
}

function aiEndpointChatUrl(baseUrl){
  const base = aiNormaliseEndpointBase(baseUrl);
  if (/\/chat\/completions$/i.test(base)) return base;
  return `${base}/chat/completions`;
}

async function aiDiscoverEndpointModels(config, apiKey = ''){
  const base = aiNormaliseEndpointBase(config.baseUrl);
  const headers = {};
  if (apiKey) headers.Authorization = `Bearer ${apiKey}`;
  const attempts = [`${base}/models`];
  const root = base.replace(/\/v1$/i, '');
  if (root !== base) attempts.push(`${root}/api/tags`);
  const controller = new AbortController();
  const timeout = setTimeout(() => controller.abort(), 8000);
  let lastError = null;
  try {
    for (const url of attempts){
      try {
        const response = await fetch(url, { headers, signal:controller.signal });
        if (!response.ok) {
          lastError = new Error(await aiReadEndpointError(response));
          continue;
        }
        const data = await response.json();
        const names = Array.isArray(data?.data)
          ? data.data.map(item => item?.id)
          : Array.isArray(data?.models)
            ? data.models.map(item => item?.name || item?.model)
            : [];
        const clean = [...new Set(names.filter(name => typeof name === 'string' && name.trim()))];
        if (clean.length) return clean.sort((a, b) => a.localeCompare(b));
        lastError = new Error('The endpoint returned no models');
      } catch (error){
        lastError = error;
      }
    }
  } finally {
    clearTimeout(timeout);
  }
  if (lastError?.name === 'AbortError') {
    throw new Error('Endpoint discovery timed out. Check that the service is running and allows browser CORS.');
  }
  throw new Error(
    `${lastError?.message || 'Could not discover endpoint models'}. ` +
    `Check the URL, API key, and the endpoint's browser CORS settings.`
  );
}

async function aiGenerateEndpoint(request){
  const controller = new AbortController();
  aiHost.endpointAbort = controller;
  // Agent tier: build the body with `tools` and reassemble streamed tool-calls.
  // Narrow chat (request.agent falsy) sends the exact same body it always did.
  const proto = request.agent ? await aiAgentProto() : null;
  const toolAcc = proto ? proto.createToolCallAccumulator() : null;
  const body = proto
    ? proto.buildEndpointChatBody({
        model:request.model.model,
        messages:request.messages,
        maxTokens:request.maxTokens,
        tools:request.tools,
        toolChoice:request.toolChoice,
        stream:true,
      })
    : {
        model:request.model.model,
        messages:request.messages,
        max_tokens:request.maxTokens,
        stream:true,
      };
  // Ask the provider to report what the request actually cost. Without this a streamed
  // response carries no usage at all, and the agent's own chars/4 estimate stands in for it —
  // measured live on 2026-09-07 at 1,319 estimated vs 3,903 real tokens against a 4,096
  // window, i.e. a run at 95% of its context believing it was a third full.
  // `stream_options` is OpenAI-standard, but not every local server accepts an unknown field,
  // so a rejected request is retried once WITHOUT it rather than turning a working endpoint
  // into a broken one.
  const wantsUsage = body.stream === true;
  if (wantsUsage) body.stream_options = { include_usage:true };
  const post = (b) => fetch(aiEndpointChatUrl(request.model.baseUrl), {
    method:'POST',
    headers:aiEndpointHeaders(request.model),
    signal:controller.signal,
    body:JSON.stringify(b),
  });
  let response = await post(body);
  if (!response.ok && wantsUsage && (response.status === 400 || response.status === 422)) {
    const { stream_options, ...withoutUsage } = body;
    response = await post(withoutUsage);
  }
  if (!response.ok) throw new Error(await aiReadEndpointError(response));

  const contentType = response.headers.get('content-type') || '';
  if (!response.body || !contentType.includes('text/event-stream')){
    const data = await response.json();
    const message = data?.choices?.[0]?.message;
    const text = message?.content;
    if (toolAcc) toolAcc.absorbMessage(message);
    if (typeof text !== 'string' && !(toolAcc && message?.tool_calls)) {
      throw new Error('AI endpoint returned no assistant message');
    }
    if (typeof text === 'string' && text) aiEmit(request, { event:'token', token:text });
    if (toolAcc) request.toolCalls = toolAcc.finalize();
    if (data?.usage) request.usage = data.usage;
    return data?.choices?.[0]?.finish_reason ||
      (request.toolCalls?.length ? 'tool_calls' : 'stop');
  }

  const reader = response.body.getReader();
  const decoder = new TextDecoder();
  let buffer = '';
  let finishReason = 'stop';
  while (true){
    const { value, done } = await reader.read();
    if (done) break;
    buffer += decoder.decode(value, { stream:true });
    const lines = buffer.split(/\r?\n/);
    buffer = lines.pop() || '';
    for (const line of lines){
      const trimmed = line.trim();
      if (!trimmed.startsWith('data:')) continue;
      const payload = trimmed.slice(5).trim();
      if (!payload || payload === '[DONE]') continue;
      let data;
      try { data = JSON.parse(payload); } catch(_) { continue; }
      const choice = data?.choices?.[0];
      const token = choice?.delta?.content;
      if (typeof token === 'string' && token) {
        aiEmit(request, { event:'token', token });
      }
      if (toolAcc) toolAcc.absorbDelta(choice?.delta);
      if (choice?.finish_reason) finishReason = choice.finish_reason;
      // the usage chunk carries no choice at all — read it off the frame, not off `choice`
      if (data?.usage) request.usage = data.usage;
    }
  }
  if (toolAcc) request.toolCalls = toolAcc.finalize();
  return request.cancelled ? 'cancelled' : finishReason;
}

async function aiGenerate(request){
  if (request.model.runtime === 'endpoint') {
    try {
      return await aiGenerateEndpoint(request);
    } catch (error){
      if (request.cancelled && error?.name === 'AbortError') return 'cancelled';
      throw error;
    } finally {
      aiHost.endpointAbort = null;
    }
  }
  if (request.model.runtime === 'ondevice') return aiGenerateOnDevice(request);
  return aiGenerateWorker(request);
}

// On-device (Gemini Nano) streamed completion. GP tier only — no tools. Maps the
// OpenAI-style messages to a system prompt + prompt text, streams the reply, and
// emits the incremental delta (Chrome versions differ on cumulative vs.
// incremental chunks, so we diff against what we've emitted).
async function aiGenerateOnDevice(request){
  const api = aiOnDeviceApi();
  if (!api) throw new Error('On-device model is unavailable in this browser');
  const controller = new AbortController();
  aiHost.onDeviceAbort = controller;
  let session = null;
  try {
    const msgs = request.messages || [];
    const system = msgs.filter(m => m.role === 'system')
      .map(m => String(m.content || '')).filter(Boolean).join('\n\n');
    const convo = msgs.filter(m => m.role !== 'system');
    const promptText = convo.length <= 1
      ? String((convo[0] && convo[0].content) || '')
      : convo.map(m => `${m.role === 'assistant' ? 'Assistant' : 'User'}: ${String(m.content || '')}`)
          .join('\n') + '\nAssistant:';
    let usedInitialPrompts = false;
    try {
      const opts = { signal: controller.signal };
      if (system) { opts.initialPrompts = [{ role: 'system', content: system }]; usedInitialPrompts = true; }
      session = await api.create(opts);
    } catch (_){
      usedInitialPrompts = false;
      session = await api.create({ signal: controller.signal });
    }
    const text = (system && !usedInitialPrompts) ? (system + '\n\n' + promptText) : promptText;
    const stream = session.promptStreaming(text, { signal: controller.signal });
    let emitted = '';
    for await (const chunk of stream){
      if (request.cancelled) break;
      const full = String(chunk == null ? '' : chunk);
      let delta;
      if (full.startsWith(emitted)) { delta = full.slice(emitted.length); emitted = full; }
      else { delta = full; emitted += full; }
      if (delta) aiEmit(request, { event:'token', token: delta });
    }
    return request.cancelled ? 'cancelled' : 'stop';
  } catch (error){
    if (request.cancelled || error?.name === 'AbortError') return 'cancelled';
    throw new Error('On-device model failed: ' + (error?.message || error));
  } finally {
    aiHost.onDeviceAbort = null;
    try { session?.destroy?.(); } catch(_){}
  }
}

async function aiProcessQueue(){
  if (aiHost.active) return;
  const request = aiNextRequest();
  if (!request) return;
  aiHost.active = request;
  try {
    aiEmit(request, { event:'status', status:'loading' });
    if (request.kind === 'image'){
      await aiEnsureImageLoaded(request.model, progress => {
        aiEmit(request, { event:'status', status:'loading', progress });
      });
    } else {
      await aiEnsureLoaded(request.model, progress => {
        aiEmit(request, { event:'status', status:'loading', progress });
      });
    }
    if (request.cancelled){
      aiEmit(request, { event:'done', finishReason:'cancelled' });
      return;
    }
    aiEmit(request, { event:'status', status:'generating' });
    if (request.kind === 'image'){
      const image = await aiGenerateImage(request);
      if (!request.cancelled) aiEmit(request, { event:'result', image });
      aiEmit(request, {
        event:'done',
        finishReason:request.cancelled ? 'cancelled' : 'stop',
      });
    } else {
      const finishReason = await aiGenerate(request);
      aiEmit(request, {
        event:'done',
        finishReason:request.cancelled ? 'cancelled' : finishReason,
        ...(request.toolCalls?.length ? { toolCalls:request.toolCalls } : {}),
        // The provider's own token count. The app's budget ends runs on this number; the
        // estimate it replaces is a character count that cannot see tool schemas at all.
        ...(request.usage ? { usage:request.usage } : {}),
      });
    }
  } catch (error){
    if (request.cancelled){
      aiEmit(request, { event:'done', finishReason:'cancelled' });
    } else {
      aiEmit(request, { event:'error', error:String(error?.message || error) });
    }
  } finally {
    aiHost.active = null;
    aiHost.activeResolve = null;
    aiHost.activeReject = null;
    queueMicrotask(() => { void aiProcessQueue(); });
  }
}

async function aiHostSubmit(source, msg, appId){
  const requestId = typeof msg.requestId === 'string' ? msg.requestId.slice(0, 160) : '';
  const provisional = {
    source,
    appId,
    requestId:requestId || 'invalid',
    kind:'chat',
  };
  try {
    // Tier-aware routing: agent requests use the user's configured model (never
    // Nano); general-purpose requests default to on-device Nano when available.
    const wantsAgent = msg.agent === true;
    const model = aiResolveModel(wantsAgent);
    if (!requestId) throw new Error('Local AI requestId is required');
    if (!aiRuntimeAvailable(model)){
      if (model.runtime === 'endpoint') {
        throw new Error('Configure an endpoint URL and model in Settings → AI');
      }
      if (model.runtime === 'ondevice') {
        throw new Error('The on-device model (Gemini Nano) is not available in this browser');
      }
      throw new Error('This on-device model requires WebGPU in a recent Chrome or Edge browser');
    }
    if (!aiManifestAllows(appId)) throw new Error('This app did not declare the inference permission');
    const duplicate = aiHost.active?.source === source && aiHost.active.requestId === requestId ||
      aiHost.queue.some(request => request.source === source && request.requestId === requestId);
    if (duplicate) throw new Error('Duplicate Local AI requestId');
    if (aiHost.queue.length >= AI_MAX_QUEUE) throw new Error('Local AI queue is full');
    const appQueued = aiHost.queue.filter(request => request.appId === appId).length +
      (aiHost.active?.appId === appId ? 1 : 0);
    if (appQueued >= AI_MAX_QUEUE_PER_APP) throw new Error('This app already has too many Local AI requests');
    // Agent tier — raised caps + tool-calling, restricted to system apps. A
    // third-party app can never reach it (its manifest cannot express it), so a
    // request with agent:true from one is refused rather than silently downgraded.
    if (wantsAgent && !aiAppIsSystem(appId)) {
      throw new Error('Agent-tier inference is restricted to system apps');
    }
    let messages, tools, toolChoice, maxTokens;
    if (wantsAgent){
      const proto = await aiAgentProto();
      messages = proto.normaliseAgentMessages(msg.messages);
      tools = proto.normaliseTools(msg.tools);
      toolChoice = proto.normaliseToolChoice(msg.toolChoice ?? msg.tool_choice);
      maxTokens = proto.clampAgentMaxTokens(msg.maxTokens);
      if (tools && tools.length && model.runtime !== 'endpoint'){
        throw new Error('Tool-calling requires an OpenAI-compatible endpoint model (Settings → AI)');
      }
    } else {
      messages = aiNormaliseMessages(msg.messages);
      maxTokens = Math.max(16, Math.min(AI_MAX_OUTPUT_TOKENS, Number(msg.maxTokens) || 384));
    }
    if (source._aiCancelled === true) throw new Error('Local AI request was cancelled');
    const granted = await aiEnsurePermission(appId);
    if (!granted) throw new Error('Local AI permission was not granted');
    if (source._aiCancelled === true) throw new Error('Local AI request was cancelled');
    const becameDuplicate = aiHost.active?.source === source && aiHost.active.requestId === requestId ||
      aiHost.queue.some(request => request.source === source && request.requestId === requestId);
    if (becameDuplicate) throw new Error('Duplicate Local AI requestId');
    if (aiHost.queue.length >= AI_MAX_QUEUE) throw new Error('Local AI queue is full');

    const request = {
      source,
      appId,
      requestId,
      kind:'chat',
      workerRequestId:`naklios-ai-${++aiHost.requestCounter}`,
      messages,
      maxTokens,
      model,
      agent:wantsAgent,
      tools,
      toolChoice,
      cancelled:false,
    };
    aiHost.queue.push(request);
    aiEmit(request, { event:'status', status:'queued', position:aiHost.queue.length });
    void aiProcessQueue();
  } catch (error){
    aiEmit(provisional, { event:'error', error:String(error?.message || error) });
  }
}

function aiNormaliseImageRequest(msg, model){
  const prompt = String(msg.prompt || '').trim();
  if (!prompt) throw new Error('Image generation requires a prompt');
  if (prompt.length > AI_MAX_IMAGE_PROMPT_CHARS) {
    throw new Error('Image prompt is too large');
  }
  if (Number(msg.n || 1) !== 1) {
    throw new Error('NakliOS image generation currently returns one image per request');
  }
  const size = String(msg.size || model.defaultSize || '512x512');
  const match = size.match(/^(\d{2,4})x(\d{2,4})$/);
  if (!match) throw new Error('Image size must use WIDTHxHEIGHT');
  const width = Number(match[1]);
  const height = Number(match[2]);
  if (width < 128 || height < 128 || width > 4096 || height > 4096) {
    throw new Error('Image dimensions must be between 128 and 4096 pixels');
  }
  if (model.scope === 'device' &&
      Array.isArray(model.supportedSizes) &&
      !model.supportedSizes.includes(size)) {
    throw new Error(
      `${model.label} supports ${model.supportedSizes.join(', ')}`
    );
  }
  const quality = ['auto', 'low', 'medium', 'high'].includes(msg.quality)
    ? msg.quality
    : 'auto';
  const steps = Math.max(
    1,
    Math.min(8, Number(msg.steps) || Number(model.defaultSteps) || 4),
  );
  const suppliedSeed = Number(msg.seed);
  const seed = Number.isFinite(suppliedSeed)
    ? Math.max(0, Math.floor(suppliedSeed))
    : Math.floor(Math.random() * 2_147_483_647);
  return { prompt, size, width, height, quality, steps, seed };
}

async function aiHostSubmitImage(source, msg, appId, hostOptions = {}){
  const requestId = typeof msg.requestId === 'string' ? msg.requestId.slice(0, 160) : '';
  const provisional = {
    source,
    appId,
    requestId:requestId || 'invalid',
    kind:'image',
  };
  try {
    const model = aiSelectedImageModel();
    if (!requestId) throw new Error('Image generation requestId is required');
    if (!aiImageRuntimeAvailable(model)){
      if (model.runtime === 'endpoint-image') {
        throw new Error('Configure an image endpoint URL and model in Settings → AI');
      }
      throw new Error('The on-device image model requires WebGPU in a recent Chrome or Edge browser');
    }
    if (!aiManifestAllows(appId)) {
      throw new Error('This app did not declare the inference permission');
    }
    const duplicate = aiHost.active?.source === source &&
      aiHost.active.requestId === requestId ||
      aiHost.queue.some(request =>
        request.source === source && request.requestId === requestId
      );
    if (duplicate) throw new Error('Duplicate image generation requestId');
    if (aiHost.queue.length >= AI_MAX_QUEUE) throw new Error('Local AI queue is full');
    const appQueued = aiHost.queue.filter(request => request.appId === appId).length +
      (aiHost.active?.appId === appId ? 1 : 0);
    if (appQueued >= AI_MAX_QUEUE_PER_APP) {
      throw new Error('This app already has too many Local AI requests');
    }
    const imageOptions = aiNormaliseImageRequest(msg, model);
    if (source._aiCancelled === true) throw new Error('Image generation was cancelled');
    const granted = hostOptions.trustedHost === true
      ? true
      : await aiEnsurePermission(appId, 'image');
    if (!granted) throw new Error('Image generation permission was not granted');
    if (source._aiCancelled === true) throw new Error('Image generation was cancelled');

    const request = {
      source,
      appId,
      requestId,
      kind:'image',
      workerRequestId:`naklios-image-${++aiHost.requestCounter}`,
      model,
      cancelled:false,
      ...imageOptions,
    };
    aiHost.queue.push(request);
    aiEmit(request, {
      event:'status',
      status:'queued',
      position:aiHost.queue.length,
    });
    void aiProcessQueue();
  } catch (error){
    aiEmit(provisional, { event:'error', error:String(error?.message || error) });
  }
}

function aiHostCancel(source, requestId){
  const queuedIndex = aiHost.queue.findIndex(request =>
    request.source === source && request.requestId === requestId
  );
  if (queuedIndex >= 0){
    const [request] = aiHost.queue.splice(queuedIndex, 1);
    request.cancelled = true;
    aiEmit(request, { event:'done', finishReason:'cancelled' });
    return true;
  }
  if (aiHost.active?.source === source && aiHost.active.requestId === requestId){
    aiHost.active.cancelled = true;
    if (aiHost.active.model?.runtime === 'endpoint' ||
        aiHost.active.model?.runtime === 'endpoint-image'){
      aiHost.endpointAbort?.abort();
    } else if (aiHost.active.model?.runtime === 'ondevice'){
      aiHost.onDeviceAbort?.abort();
    } else if (aiHost.active.kind === 'image'){
      const reject = aiImageHost.activeReject || aiImageHost.loadReject;
      aiDestroyImageWorker();
      reject?.(new Error('Image generation cancelled'));
    } else if (aiHost.state === 'ready') {
      aiHost.worker?.postMessage({ type:'stop', id:aiHost.active.workerRequestId });
    }
    return true;
  }
  return false;
}

function aiHostCancelSource(source){
  for (let index = aiHost.queue.length - 1; index >= 0; index--){
    if (aiHost.queue[index].source !== source) continue;
    const [request] = aiHost.queue.splice(index, 1);
    request.cancelled = true;
  }
  if (aiHost.active?.source === source){
    aiHost.active.cancelled = true;
    if (aiHost.active.model?.runtime === 'endpoint' ||
        aiHost.active.model?.runtime === 'endpoint-image'){
      aiHost.endpointAbort?.abort();
    } else if (aiHost.active.model?.runtime === 'ondevice'){
      aiHost.onDeviceAbort?.abort();
    } else if (aiHost.active.kind === 'image'){
      const reject = aiImageHost.activeReject || aiImageHost.loadReject;
      aiDestroyImageWorker();
      reject?.(new Error('Image generation cancelled'));
    } else if (aiHost.state === 'ready') {
      aiHost.worker?.postMessage({ type:'stop', id:aiHost.active.workerRequestId });
    }
  }
}

function aiResetRuntime(){
  if (aiHost.active || aiHost.queue.length) {
    throw new Error('Wait for the current AI request to finish before changing models');
  }
  if (aiHost.endpointAbort){
    try { aiHost.endpointAbort.abort(); } catch(_){}
  }
  try { aiHost.worker?.postMessage({ type:'unload' }); } catch(_){}
  try { aiHost.worker?.terminate(); } catch(_){}
  aiHost.worker = null;
  aiHost.workerModelKey = null;
  aiHost.loadPromise = null;
  aiHost.loadResolve = null;
  aiHost.loadReject = null;
  aiHost.endpointAbort = null;
  aiSetState('idle');
}

function aiResetImageRuntime(){
  if (aiHost.active?.kind === 'image' ||
      aiHost.queue.some(request => request.kind === 'image')) {
    throw new Error('Wait for the current image request to finish before changing image models');
  }
  aiDestroyImageWorker();
}

function aiHostChatNative(appId, messages, options = {}){
  const requestId = `native-${++aiHost.requestCounter}-${Date.now()}`;
  let text = '';
  let settled = false;
  let abortHandler = null;
  return new Promise((resolve, reject) => {
    const source = {
      _aiCancelled:false,
      postMessage(message){
        if (message.requestId !== requestId || settled) return;
        if (message.event === 'status'){
          try { options.onStatus?.(message.status, message.progress); } catch(_){}
        } else if (message.event === 'token'){
          text += message.token || '';
          try { options.onToken?.(message.token || '', text); } catch(_){}
        } else if (message.event === 'done'){
          settled = true;
          if (options.signal && abortHandler) options.signal.removeEventListener('abort', abortHandler);
          resolve({ content:text, finishReason:message.finishReason || 'stop' });
        } else if (message.event === 'error'){
          settled = true;
          if (options.signal && abortHandler) options.signal.removeEventListener('abort', abortHandler);
          reject(new Error(message.error || 'Local AI failed'));
        }
      },
    };
    abortHandler = () => {
      source._aiCancelled = true;
      aiHostCancel(source, requestId);
    };
    if (options.signal){
      if (options.signal.aborted) abortHandler();
      else options.signal.addEventListener('abort', abortHandler, { once:true });
    }
    void aiHostSubmit(source, {
      requestId,
      messages,
      maxTokens:options.maxTokens,
    }, appId);
  });
}

function aiHostImageNative(prompt, options = {}){
  const requestId = `native-image-${++aiHost.requestCounter}-${Date.now()}`;
  let settled = false;
  let abortHandler = null;
  return new Promise((resolve, reject) => {
    const source = {
      _aiCancelled:false,
      postMessage(message){
        if (message.requestId !== requestId || settled) return;
        if (message.event === 'status'){
          try { options.onStatus?.(message.status, message.progress); } catch(_){}
        } else if (message.event === 'result'){
          settled = true;
          if (options.signal && abortHandler) {
            options.signal.removeEventListener('abort', abortHandler);
          }
          resolve(message.image);
        } else if (message.event === 'done' &&
            message.finishReason === 'cancelled'){
          settled = true;
          const error = new Error('Image generation cancelled');
          error.name = 'AbortError';
          reject(error);
        } else if (message.event === 'error'){
          settled = true;
          if (options.signal && abortHandler) {
            options.signal.removeEventListener('abort', abortHandler);
          }
          reject(new Error(message.error || 'Image generation failed'));
        }
      },
    };
    abortHandler = () => {
      source._aiCancelled = true;
      aiHostCancel(source, requestId);
    };
    if (options.signal){
      if (options.signal.aborted) abortHandler();
      else options.signal.addEventListener('abort', abortHandler, { once:true });
    }
    void aiHostSubmitImage(source, {
      requestId,
      prompt,
      size:options.size,
      quality:options.quality,
      seed:options.seed,
      steps:options.steps,
      n:1,
    }, 'naklios-settings', { trustedHost:true });
  });
}

// ════════════════════════════════════════════════════════════════════
// SEMANTIC INDEX (RAG) — host-owned embedding + vector search service
// ════════════════════════════════════════════════════════════════════
// One MiniLM worker embeds text locally (VaultMind's proven pipeline).
// The index spans the whole connected backend root, persists at
// system/rag/index.json on that backend, and re-embeds only files whose
// size/mtime fingerprint changed. Apps reach it through naklios.ai.search,
// which clamps results to apps/<id>/; Spotlight uses the full index.

const RAG_MODEL_KEY = 'all-MiniLM-L6-v2';
const RAG_DIM = 384;
const RAG_INDEX_PATH = 'system/rag/index.json';
const RAG_MAX_FILES = 500;
const RAG_MAX_CHUNKS = 3000;
const RAG_MAX_FILE_CHARS = 512 * 1024;
const RAG_BATCH = 16;
const RAG_SCORE_FLOOR = 0.25;
const RAG_TEXT_EXT = new Set([
  'md','txt','json','jsonl','csv','tsv','js','mjs','css','html','htm',
  'xml','yml','yaml',
]);

const ragHost = {
  state:'idle',            // idle | loading | ready | error
  error:null,
  worker:null,
  device:null,
  loadPromise:null,
  embedChain:Promise.resolve(),
  embedCounter:0,
  syncChain:Promise.resolve(),
  indexing:false,
  backendId:null,
  files:new Map(),         // path → { fp, chunks:[{text, vec:Float32Array}] }
};

function ragReadDecision(){
  try { return JSON.parse(localStorage.getItem('nakliOS.rag.v1') || 'null'); }
  catch(_){ return null; }
}

// Host-level consent for building/using the index, plus the per-app manifest
// gate third-party apps already pass for chat inference.
async function ragEnsurePermission(appLabel){
  const saved = ragReadDecision();
  if (saved?.granted === true) return true;
  if (saved?.granted === false) return false;
  const bid = backendsAvailable()[0];
  const where = bid === 'crate'
    ? 'encrypted Crate'
    : 'NakliOS Folder';
  const ok = await nakliosConfirm(
    `Let NakliOS build a private semantic search index of your ${where}?\n\n` +
    `Text is split into chunks and embedded entirely on this device with a small local model (~25&nbsp;MB one-time download). Nothing leaves the browser. The index itself lives inside your ${where} at <code>${_dlgEscape(RAG_INDEX_PATH)}</code>.`,
    {
      title:'Enable semantic search?',
      okLabel:'Build index',
      cancelLabel:'Not now',
      allowHtmlBody:true,
    },
  );
  localStorage.setItem('nakliOS.rag.v1', JSON.stringify({ granted:!!ok }));
  broadcastCapabilities();
  return ok;
}

// Advertised to apps like fs: possible when a runtime exists and the app may
// use inference. First search call asks consent, exactly like fs prompts bind.
function ragCapabilityForApp(appId){
  return typeof Worker !== 'undefined' &&
    backendsAvailable().length > 0 &&
    aiManifestAllows(appId);
}

function ragSetState(next, error = null){
  ragHost.state = next;
  ragHost.error = error ? String(error?.message || error) : null;
  try { broadcastCapabilities(); } catch(_){}
}

function ragLoadWorker(){
  if (ragHost.loadPromise) return ragHost.loadPromise;
  ragSetState('loading');
  const attempt = device => new Promise((resolve, reject) => {
    const worker = new Worker(
      new URL('sys/rag/embed-worker.js', document.baseURI),
      { type:'module', name:'naklios-rag-embed' },
    );
    let settled = false;
    worker.addEventListener('message', event => {
      const msg = event.data || {};
      if (msg.type === 'ready' && !settled){
        settled = true;
        ragHost.worker = worker;
        ragHost.device = device;
        resolve(worker);
      } else if (msg.type === 'error' && !settled){
        settled = true;
        try { worker.terminate(); } catch(_){}
        reject(new Error(msg.message || 'Embedding model failed to load'));
      }
    });
    worker.addEventListener('error', event => {
      if (settled) return;
      settled = true;
      try { worker.terminate(); } catch(_){}
      reject(new Error(event.message || 'Embedding worker crashed'));
    });
    worker.postMessage({ type:'load', device });
  });
  ragHost.loadPromise = attempt(navigator.gpu ? 'webgpu' : 'wasm')
    .catch(err => navigator.gpu ? attempt('wasm') : Promise.reject(err))
    .then(worker => { ragSetState('ready'); return worker; })
    .catch(err => { ragHost.loadPromise = null; ragSetState('error', err); throw err; });
  return ragHost.loadPromise;
}

const RAG_EMBED_TIMEOUT_MS = 60000;

// A crash mid-embed used to leave the promise unsettled, wedging embedChain
// (and every later search) forever. Guard every embed with an error listener
// and a timeout, and drop the dead worker so the next call reloads a fresh one.
function ragEmbed(texts){
  const run = async () => {
    const worker = await ragLoadWorker();
    const id = ++ragHost.embedCounter;
    return new Promise((resolve, reject) => {
      let done = false;
      const cleanup = () => {
        done = true;
        worker.removeEventListener('message', handler);
        worker.removeEventListener('error', onError);
        clearTimeout(timer);
      };
      const fail = message => {
        if (done) return;
        cleanup();
        // Tear the worker down so embedChain can recover on the next call.
        try { worker.terminate(); } catch(_){}
        if (ragHost.worker === worker) ragHost.worker = null;
        ragHost.loadPromise = null;
        ragSetState('idle');
        reject(new Error(message));
      };
      const handler = event => {
        const msg = event.data || {};
        if (msg.id !== id) return;
        cleanup();
        if (msg.type === 'embeddings') resolve(msg.vectors || []);
        else reject(new Error(msg.message || 'Embedding failed'));
      };
      const onError = event => fail(event.message || 'Embedding worker crashed');
      const timer = setTimeout(() => fail('Embedding timed out'), RAG_EMBED_TIMEOUT_MS);
      worker.addEventListener('message', handler);
      worker.addEventListener('error', onError);
      worker.postMessage({ type:'embed', id, texts });
    });
  };
  ragHost.embedChain = ragHost.embedChain.then(run, run);
  return ragHost.embedChain;
}

function ragVecToB64(vec){
  const bytes = new Uint8Array(vec.buffer, vec.byteOffset, vec.byteLength);
  let bin = '';
  const CHUNK = 0x8000;
  for (let i = 0; i < bytes.length; i += CHUNK){
    bin += String.fromCharCode.apply(null, bytes.subarray(i, i + CHUNK));
  }
  return btoa(bin);
}

function ragB64ToVec(b64){
  const bin = atob(b64);
  const bytes = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
  return new Float32Array(bytes.buffer);
}

function ragBackendRef(backendId){
  const id = backendId || backendsAvailable()[0];
  const backend = id && BACKENDS[id];
  if (!backend || !backend.isConnected()) throw new Error('No storage backend connected');
  return { id, backend };
}

// Swap in the persisted index when the active backend changed this session.
async function ragLoadIndexForBackend(id){
  if (ragHost.backendId === id) return;
  ragHost.backendId = id;
  ragHost.files = new Map();
  const { backend } = ragBackendRef(id);
  try {
    const raw = await backend.read(RAG_INDEX_PATH);
    const text = raw instanceof Uint8Array
      ? new TextDecoder().decode(raw)
      : String(raw);
    const data = JSON.parse(text);
    if (data?.version === 1 && data.model === RAG_MODEL_KEY && data.backendId === id){
      for (const [path, rec] of Object.entries(data.files || {})){
        ragHost.files.set(path, {
          fp:rec.fp,
          chunks:(rec.chunks || []).map(([text, v]) => ({ text, vec:ragB64ToVec(v) })),
        });
      }
    }
  } catch(_){ /* first run or unreadable index — start empty */ }
}

async function ragPersistIndex(){
  if (!ragHost.backendId) return;
  const { id, backend } = ragBackendRef(ragHost.backendId);
  const files = {};
  let chunkCount = 0;
  for (const [path, rec] of ragHost.files){
    chunkCount += rec.chunks.length;
    files[path] = {
      fp:rec.fp,
      chunks:rec.chunks.map(c => [c.text, ragVecToB64(c.vec)]),
    };
  }
  const payload = JSON.stringify({
    version:1,
    model:RAG_MODEL_KEY,
    dim:RAG_DIM,
    backendId:id,
    savedAt:new Date().toISOString(),
    files,
  });
  await backend.write(RAG_INDEX_PATH, new TextEncoder().encode(payload));
  return { files:Object.keys(files).length, chunks:chunkCount };
}

// VaultMind's sentence-aware chunker, ported verbatim.
function ragChunkText(text, maxChars = 800, overlapChars = 150){
  const sentences = text.match(/[^.!?\n]+[.!?\n]+|[^.!?\n]+$/g) || [text];
  const chunks = [];
  let cur = '';
  for (const s of sentences){
    if (cur.length + s.length > maxChars && cur.length > 0){
      chunks.push(cur.trim());
      const words = cur.split(/\s+/);
      let olen = 0;
      const overlap = [];
      for (let i = words.length - 1; i >= 0 && olen < overlapChars; i--){
        olen += words[i].length + 1;
        overlap.unshift(words[i]);
      }
      cur = overlap.join(' ') + ' ' + s;
    } else {
      cur += (cur ? ' ' : '') + s;
    }
  }
  if (cur.trim()) chunks.push(cur.trim());
  return chunks;
}

function ragCosine(a, b){
  let dot = 0, na = 0, nb = 0;
  for (let i = 0; i < a.length; i++){
    dot += a[i] * b[i]; na += a[i] * a[i]; nb += b[i] * b[i];
  }
  return dot / (Math.sqrt(na) * Math.sqrt(nb) + 1e-8);
}

// Spotlight's debounced search and an app's ai.search can fire concurrently;
// both mutate ragHost.files. Serialize every sync through one in-flight chain
// so a walk never deletes entries another pass is mid-writing.
function ragSyncIndex(onProgress = () => {}){
  const run = () => ragSyncIndexInner(onProgress);
  ragHost.syncChain = ragHost.syncChain.then(run, run);
  return ragHost.syncChain;
}

// Bring the index up to date with the backend: walk text files, keep chunks
// whose fingerprint (size:mtimeMs) is unchanged, embed only new/changed ones.
async function ragSyncIndexInner(onProgress = () => {}){
  const { id } = ragBackendRef();
  await ragLoadIndexForBackend(id);
  const fileops = await rigFileops({ backendId:id });
  const walk = await fileops.list('', { recursive:true });
  if (!walk.ok) throw new Error(walk.message || 'Index walk failed');
  const candidates = walk.entries.filter(entry =>
    entry.type === 'file' &&
    !entry.path.startsWith('system/') &&
    RAG_TEXT_EXT.has((entry.name.split('.').pop() || '').toLowerCase())
  );
  if (candidates.length > RAG_MAX_FILES){
    candidates.length = RAG_MAX_FILES;
  }
  // Every walked candidate is retained; the chunk budget only limits how much
  // new/changed content we (re-)embed this pass. Marking `seen` up front (not
  // inside the budget loop) stops the delete pass from evicting valid cached
  // files that merely sort after the budget boundary.
  const seen = new Set(candidates.map(entry => entry.path));
  const stale = [];   // { path, fp, pieces }
  let totalChunks = [...ragHost.files.values()]
    .reduce((sum, rec) => sum + rec.chunks.length, 0);
  let budget = Math.max(0, RAG_MAX_CHUNKS - totalChunks);
  for (const entry of candidates){
    if (budget <= 0) break;   // stop embedding new work; files stay `seen`
    const st = await fileops.stat(entry.path);
    if (!st.ok) continue;
    const fp = `${st.stat.size}:${st.stat.mtimeMs}`;
    const cached = ragHost.files.get(entry.path);
    if (cached && cached.fp === fp) continue;
    const file = await fileops.read(entry.path, { encoding:'utf-8' });
    if (!file.ok) continue;
    const text = String(file.data).slice(0, RAG_MAX_FILE_CHARS);
    const pieces = ragChunkText(text);
    const room = Math.min(pieces.length, budget);
    if (room < pieces.length) pieces.length = room;
    if (!pieces.length){
      if (cached) ragHost.files.set(entry.path, { fp, chunks:[] });
      continue;
    }
    stale.push({ path:entry.path, fp, pieces });
    budget -= pieces.length;
  }
  // Drop only files that truly vanished from the walk.
  for (const path of [...ragHost.files.keys()]){
    if (!seen.has(path)) ragHost.files.delete(path);
  }
  const pendingChunks = stale.reduce((sum, item) => sum + item.pieces.length, 0);
  if (!pendingChunks) return { embedded:0 };
  ragHost.indexing = true;
  ragSetState(ragHost.state === 'ready' ? 'ready' : ragHost.state);
  let done = 0;
  try {
    for (const item of stale){
      const vectors = [];
      for (let i = 0; i < item.pieces.length; i += RAG_BATCH){
        const batch = item.pieces.slice(i, i + RAG_BATCH);
        vectors.push(...await ragEmbed(batch));
        done += batch.length;
        onProgress({ done, total:pendingChunks, path:item.path });
      }
      ragHost.files.set(item.path, {
        fp:item.fp,
        chunks:vectors.map((vec, k) => ({ text:item.pieces[k], vec })),
      });
    }
  } finally {
    ragHost.indexing = false;
  }
  return { embedded:done };
}

// Full-folder search used by Spotlight and by the app-clamped SDK surface.
async function ragSearchCore(query, { limit = 8, prefix = '' } = {}){
  const needle = String(query || '').trim();
  if (!needle) return [];
  const cleanPrefix = String(prefix || '').replace(/^\/+/, '').replace(/\/+$/, '');
  // Callers (ragHostSearch / ragSearchNative) already sync before searching —
  // no second full walk + stat here.
  const [queryVec] = await ragEmbed([needle.slice(0, 2000)]);
  const hits = [];
  for (const [path, rec] of ragHost.files){
    if (cleanPrefix && !(path === cleanPrefix || path.startsWith(cleanPrefix + '/'))) continue;
    for (const chunk of rec.chunks){
      const score = ragCosine(queryVec, chunk.vec);
      if (score >= RAG_SCORE_FLOOR){
        hits.push({ path, text:chunk.text, score });
      }
    }
  }
  hits.sort((a, b) => b.score - a.score);
  return hits.slice(0, Math.max(1, Math.min(32, Number(limit) || 8)));
}

function ragIndexStats(){
  let chunks = 0;
  for (const rec of ragHost.files.values()) chunks += rec.chunks.length;
  return {
    state:ragHost.state,
    backend:ragHost.backendId,
    files:ragHost.files.size,
    chunks,
    indexing:ragHost.indexing,
    device:ragHost.device,
  };
}

// postMessage entry: search clamped to the calling app's namespace.
async function ragHostSearch(source, msg, appId){
  if (!aiManifestAllows(appId)){
    throw new Error('This app did not declare the inference permission');
  }
  const query = String(msg.query || '').trim();
  if (!query) throw new Error('A search query is required');
  const granted = await ragEnsurePermission(appId);
  if (!granted) throw new Error('Semantic search permission was not granted');
  const clampRoot = `apps/${appId}`;
  const requested = String(msg.prefix || '')
    .split('/').filter(seg => seg && seg !== '.' && seg !== '..').join('/');
  const prefix = requested ? `${clampRoot}/${requested}` : clampRoot;
  const emit = progress => {
    if (typeof msg.requestId !== 'string') return;
    try {
      source.postMessage({
        type:'naklios:rag:event',
        requestId:msg.requestId,
        event:'indexing',
        ...progress,
      }, '*');
    } catch(_){}
  };
  const sync = await ragSyncIndex(emit);
  if (sync.embedded){
    void ragPersistIndex().catch(err => console.warn('rag persist failed:', err));
  }
  const hits = await ragSearchCore(query, { limit:msg.limit, prefix });
  return { hits, stats:ragIndexStats() };
}

// Host-native search for Spotlight (full folder, no namespace clamp).
async function ragSearchNative(query, options = {}){
  if (ragReadDecision()?.granted !== true) return null;   // not enabled yet
  const sync = await ragSyncIndex(options.onProgress || (() => {}));
  if (sync.embedded){
    void ragPersistIndex().catch(err => console.warn('rag persist failed:', err));
  }
  const hits = await ragSearchCore(query, options);
  return { hits, stats:ragIndexStats() };
}

// Open one indexed file in Editor by minting the same window-lifetime grant
// the Files → Open With flow uses. Spotlight is host UI, so no per-app
// storage permission applies — but the file must be text and under 2 MB.
async function ragOpenResultInEditor(path){
  const target = APPS.find(app => app.id === 'editor' && app.kind === 'system');
  if (!target) throw new Error('Editor is unavailable');
  const cleanPath = String(path || '').replace(/^\/+/, '');
  if (!cleanPath || !EDITABLE_FILE_RE.test(cleanPath)){
    throw new Error('Editor opens text and source-code files');
  }
  const { id, backend } = ragBackendRef();
  const data = await backend.read(cleanPath);
  if (String(data).length > FILE_GRANT_MAX_CHARS){
    throw new Error('Editor opens text files up to 2 MB');
  }
  const token = newFileGrantToken();
  fileGrants.set(token, {
    token,
    targetAppId:'editor',
    sourceAppId:'spotlight',
    sourcePath:cleanPath,
    safePath:cleanPath,
    name:cleanPath.split('/').filter(Boolean).at(-1) || 'Untitled',
    backendId:id,
    backendIdentity:fileGrantBackendIdentity(id),
    targetSource:null,
  });
  openApp(target, { action:'open-file' });
  const win = openWindows.editor;
  if (!win){
    fileGrants.delete(token);
    throw new Error('Editor could not be opened');
  }
  win._pendingFileGrantTokens = [...(win._pendingFileGrantTokens || []), token];
  deliverPendingFileGrants(win);
  return true;
}


// ── Egress (naklios.net): sign + relay a blocked cross-origin request through the
// user's OWN nakli-egress Worker. Canonicalization mirrors nakli-egress/src/lib.js
// EXACTLY (lowercased+sorted headers minus hop-by-hop; method\nurl\nheaders\n
// bodySha256\nnonce\nts) so the Worker's HMAC verify passes. Settings + secret are
// host-only (like the AI key); the app never sees them. ──
const EGRESS_HOP_BY_HOP = new Set(['host','connection','content-length','keep-alive','transfer-encoding','upgrade','proxy-authorization','proxy-connection','te','trailer']);
function egressSettings(){ try { return JSON.parse(localStorage.getItem('nakliOS.egressSettings.v1')||'null') || null; } catch(_) { return null; } }
function egressConfigured(){ const s = egressSettings(); return !!(s && s.workerUrl && s.secret); }
function egressBackendLabel(){ const s = egressSettings(); return (s && s.backend) ? s.backend : (egressConfigured() ? 'worker' : null); }
// Git auth (a PAT) lives HOST-SIDE only. When an egress request targets a configured
// git host and carries no Authorization of its own, the host injects Basic auth from
// nakliOS.gitAuth.v1 — so the PAT never enters an app or an onAuth callback.
function gitAuthSettings(){ try { return JSON.parse(localStorage.getItem('nakliOS.gitAuth.v1')||'null') || null; } catch(_) { return null; } }
function gitAuthConfigured(){ const g = gitAuthSettings(); return !!(g && g.token); }
function gitAuthFor(url){
  const g = gitAuthSettings(); if(!g || !g.token) return null;
  let host=''; try{ host = new URL(url).hostname.toLowerCase(); }catch(_){ return null; }
  const hosts = (g.hosts && g.hosts.length) ? g.hosts : ['github.com','*.github.com','gitlab.com','*.gitlab.com'];
  const match = hosts.some(h=>{ h=String(h).toLowerCase(); return h.startsWith('*.') ? (host===h.slice(2)||host.endsWith('.'+h.slice(2))) : host===h; });
  return match ? { username: g.username || 'x-access-token', token: g.token } : null;
}
function _egHex(u8){ let s=''; for(let i=0;i<u8.length;i++) s+=u8[i].toString(16).padStart(2,'0'); return s; }
function _egCanonHeaders(h){ return Object.entries(h||{}).map(([k,v])=>[String(k).toLowerCase(),String(v)]).filter(([k])=>!EGRESS_HOP_BY_HOP.has(k)).sort((a,b)=>a[0]<b[0]?-1:a[0]>b[0]?1:0).map(([k,v])=>k+':'+v).join('\n'); }
function _egCanon({method,url,headers,bodySha256,nonce,ts}){ return [String(method||'GET').toUpperCase(),String(url||''),_egCanonHeaders(headers),String(bodySha256||''),String(nonce||''),String(ts||'')].join('\n'); }
async function _egSha(bytes){ const b=await crypto.subtle.digest('SHA-256', bytes); return _egHex(new Uint8Array(b)); }
async function _egHmac(secret,message){ const enc=new TextEncoder(); const key=await crypto.subtle.importKey('raw',enc.encode(secret),{name:'HMAC',hash:'SHA-256'},false,['sign']); const sig=await crypto.subtle.sign('HMAC',key,enc.encode(message)); return _egHex(new Uint8Array(sig)); }
function _egB64(u8){ let bin=''; for(let i=0;i<u8.length;i++) bin+=String.fromCharCode(u8[i]); return btoa(bin); }
function _egUnb64(b64){ const bin=atob(b64); const u8=new Uint8Array(bin.length); for(let i=0;i<bin.length;i++) u8[i]=bin.charCodeAt(i); return u8; }
function _egBytes(body){ if(body==null) return new Uint8Array(0); if(body instanceof Uint8Array) return body; if(body instanceof ArrayBuffer) return new Uint8Array(body); return new TextEncoder().encode(String(body)); }
async function egressFetch({url, method='GET', headers={}, body=null}){
  const s = egressSettings();
  if(!s || !s.workerUrl || !s.secret){ const e=new Error('No egress backend configured'); e.code='ENOEGRESS'; throw e; }
  // Inject host-held git auth (the PAT never came from the app) for git hosts.
  headers = Object.assign({}, headers || {});
  const ga = gitAuthFor(url);
  const hasAuth = Object.keys(headers).some(k=>String(k).toLowerCase()==='authorization');
  if(ga && !hasAuth){ headers['Authorization'] = 'Basic ' + btoa(unescape(encodeURIComponent(ga.username + ':' + ga.token))); }
  const bytes = _egBytes(body);
  const bodyB64 = bytes.length ? _egB64(bytes) : null;
  const bodySha256 = bytes.length ? await _egSha(bytes) : '';
  const nonce = 'h'+Math.random().toString(36).slice(2)+Date.now().toString(36);
  const ts = Date.now();
  const sig = await _egHmac(s.secret, _egCanon({method,url,headers,bodySha256,nonce,ts}));
  const envelope = { url:String(url), method:String(method||'GET'), headers:headers||{}, body:bodyB64, nonce, ts, sig };
  const r = await fetch(s.workerUrl, { method:'POST', headers:{'content-type':'application/json'}, body: JSON.stringify(envelope) });
  const j = await r.json().catch(()=>({ ok:false, error:'bad worker response' }));
  if(!j.ok){ const e=new Error('egress: '+(j.error||('http '+r.status))); e.code='EEGRESS'; throw e; }
  return { status:j.status, statusText:j.statusText||'', headers:j.headers||{}, body: j.body ? _egUnb64(j.body) : new Uint8Array(0) };
}

// Minimal secure PAT entry (down payment on the full egress settings UX). Renders a
// password field the user types into directly — the token goes straight to host-only
// localStorage and is never read back by anything but egressFetch's Authorization

    + '<input id="nakli-gitauth-user" value="' + (g.username ? String(g.username).replace(/"/g,'&quot;') : '') + '" placeholder="git username (optional — default x-access-token)" style="width:100%;box-sizing:border-box;margin-bottom:8px;padding:8px 10px;border-radius:6px;border:1px solid #2a2f34;background:#0f1215;color:#e6e9eb;font-size:13px">'
