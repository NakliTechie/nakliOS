name: Test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  vendored-crate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Verify vendored Crate manifest security
        run: node scripts/test-crate-manifest.mjs

      - name: Verify Files uses the Crate-capable host bridge
        run: node scripts/test-files-crate-bridge.mjs

      - name: Verify Crate offers file and manual connection paths
        run: node scripts/test-crate-connect-flow.mjs

      - name: Verify Tijori uses the app-scoped storage bridge
        run: node scripts/test-tijori-storage-bridge.mjs

      - name: Verify Notepad v2 uses isolated Local, Folder, and Crate storage
        run: node scripts/test-notepad-storage.mjs

      - name: Verify Notes v1 persistence and storage lifecycle
        run: node scripts/test-notes-v1.mjs

      - name: Verify Calendar timezone, recurrence, ICS, and storage lifecycle
        run: node scripts/test-calendar.mjs

      - name: Verify Editor recovery and exact-file handoff boundaries
        run: node scripts/test-editor-v1.mjs

      - name: Verify Books stays hosted and uses explicit Folder or Crate storage
        run: node scripts/test-books-storage-bridge.mjs

      - name: Verify Slate and BOFH open in Immersive NakliOS windows
        run: node scripts/test-immersive-apps.mjs

      - name: Verify UX recovery paths and accessibility contracts
        run: node scripts/test-ux-recovery.mjs

      - name: Verify filesystem operations remain bound to their selected backend
        run: node scripts/test-fs-backend-affinity.mjs

      - name: Verify shared local AI broker and SDK contracts
        run: node scripts/test-local-ai.mjs

      - name: Verify SDK-vendoring canonical invariants and splicer round-trip
        run: node scripts/test-vendored-sdk.mjs

      - name: Verify naklios.net egress SDK seam (ENOEGRESS until a backend is advertised)
        run: node scripts/test-net-seam.mjs

      - name: Verify nakli-egress Worker security core (sign/allowlist/SSRF/replay)
        run: node nakli-egress/test/lib.test.mjs

      - name: Verify project memory store (facts, index, recall)
        run: node sys/ai/test/memory-store.test.mjs

      - name: Verify skills parsing, the description index, and the shell half of the skills fence
        run: node sys/ai/test/skills.test.mjs

      - name: Verify the prompt's cache prefix is stable and the tool list does not depend on the store
        run: node scripts/test-anvil-prompt-cache.mjs

      - name: Verify the provider's token count survives endpoint to host to SDK to app
        run: node scripts/test-host-usage.mjs

      - name: Verify the id that answered survives broker to host to SDK to app to chain
        run: node scripts/test-host-answered-model.mjs

      - name: Gate the system filesystem on same-origin system apps, and bind messages to the launch origin
        run: node scripts/test-host-origin-authority.mjs

      - name: Verify the transcript render plans noop/append/rebuild and leaves the reader's scroll alone
        run: node sys/ai/test/log-render-plan.test.mjs

      - name: Verify the follow-up queue survives a crash, holds on a bad ending, and migrates legacy strings
        run: node sys/ai/test/followup-queue.test.mjs

      - name: Verify the procedural prior renders byte-identically and every edge is removable
        run: node scripts/test-anvil-procedural.mjs

      - name: Verify ordering metrics — anchored, never zero-for-null, refusing unlike comparisons
        run: node sys/history/test/ordering.test.mjs

      - name: Verify the context-payload probe parses the REAL index format (a reword must go red)
        run: node scripts/test-context-payload-probe.mjs

      - name: Replay the recorded-run corpus keyless (real runs, zero model calls)
        run: node sys/history/test/replay-corpus.test.mjs

      - name: Verify a subagent's run lands on the parent's chain (multi-agent auditability)
        run: node sys/history/test/subagent-chain.test.mjs

      - name: Verify search-cost instrumentation changes no search result
        run: node sys/rig/fileops/test/search-cost.test.mjs

      - name: Verify the trigram index under fs.grep
        run: node sys/rig/fileops/test/trigram.test.mjs

      - name: Verify Rig fileops conformance (the 8-method backend contract)
        run: node sys/rig/fileops/test/conformance.test.mjs

      - name: Verify the OPFS backend
        run: node sys/rig/fileops/test/opfs.test.mjs

      - name: Verify the File System Access backend
        run: node sys/rig/fileops/test/fsa-backend.test.mjs

      - name: Verify the Crate backend
        run: node sys/rig/fileops/test/crate-backend.test.mjs

      - name: Verify the Rig command registry conformance
        run: node sys/rig/registry/test/conformance.test.mjs

      - name: Verify vendored git conformance
        run: node sys/rig/git/test/conformance.test.mjs

      - name: Verify the git transport
        run: node sys/rig/git/test/transport.test.mjs

      - name: Verify the goals module conformance
        run: node sys/rig/goals/test/conformance.test.mjs

      - name: Verify the shell completer
        run: node sys/rig/cli/test/completer.test.mjs

      - name: Verify the shell line editor
        run: node sys/rig/cli/test/lineeditor.test.mjs

      - name: Verify Kiln conformance (the Python kernel contract)
        run: node sys/kiln/test/conformance.test.mjs

      - name: Verify the Kiln filesystem bridge
        run: node sys/kiln/test/fs-bridge.test.mjs

      - name: Verify Kiln to Rig bindings
        run: node sys/kiln/test/rig-bindings.test.mjs

      - name: Verify the Kiln verifier
        run: node sys/kiln/test/verifier.test.mjs

      - name: Verify the Kiln worker runtime
        run: node sys/kiln/test/worker-runtime.test.mjs

      - name: Verify the agent toolset (tool schemas, handlers, guards)
        run: node sys/ai/test/agent-tools.test.mjs

      - name: Verify project hooks (pre/post-tool commands)
        run: node sys/ai/test/hooks.test.mjs

      - name: Verify project hooks end to end over fileops
        run: node sys/ai/test/hooks-integration.test.mjs

      - name: Verify hashline rendering and edits
        run: node sys/ai/test/hashline.test.mjs

      - name: Verify project context assembly
        run: node sys/ai/test/project-context.test.mjs

      - name: Verify skills end to end over fileops
        run: node sys/ai/test/skills-integration.test.mjs

      - name: Verify the on-device tier split (agent work never routes to Nano)
        run: node scripts/test-nano-routing.mjs

      - name: Verify the onboarding and UI regression levers
        run: node scripts/test-onboarding-and-ui-fixes.mjs

      - name: Verify the semantic-search regression levers
        run: node scripts/test-semantic-search-fixes.mjs

      - name: Verify every test file is actually run by this gate (no orphaned coverage)
        run: node scripts/check-gate-coverage.mjs

      - name: Verify .anvil/skills is readable and UNWRITABLE from every agent route (grant-enforced)
        run: node sys/ai/test/skills-fence.test.mjs

      - name: Verify .anvil/gate (the acceptance criterion) is readable and UNWRITABLE from every agent route
        run: node sys/ai/test/gate-fence.test.mjs

      - name: Verify arming a run's gate is one call that refuses the half-states
        run: node sys/ai/test/gate-arming.test.mjs

      - name: Verify the verifier gate's python runs on a RESET interpreter, and the agent's does not
        run: node sys/kiln/test/gate-isolation.test.mjs

      - name: Verify the Rig agent face C4 conformance (escape classes, grant edges, staging, op-log replay)
        run: node sys/rig/agent/test/conformance.test.mjs

      - name: Verify project memory integration (remember/recall over fs)
        run: node sys/ai/test/memory-store-integration.test.mjs

      - name: Verify belief-revising memory (hypothesis→verified/retracted)
        run: node sys/ai/test/memory-belief.test.mjs

      - name: Verify Anvil wires belief revision through (status reaches the index)
        run: node scripts/test-anvil-memory-status.mjs

      - name: Verify Anvil honesty guards (gate, hooks, single-writer state)
        run: node scripts/test-anvil-guards.mjs

      - name: Verify the lesson-layer contract at both call sites and rules injected whole
        run: node scripts/test-anvil-lesson-contract.mjs

      - name: Verify skill_manage (read-before-write, staged never active) and the Sentinel scan
        run: node sys/ai/test/skill-manage.test.mjs

      - name: Verify Anvil stages skill writes through P0 and never injects a staged or quarantined skill
        run: node scripts/test-anvil-skills.mjs

      - name: Verify skill usage as a fold and the curator lifecycle (30/90 days, pinned exempt, never deletes)
        run: node sys/ai/test/skill-lifecycle.test.mjs

      - name: Verify the NakliOS dialog promise always settles (no wedged consent)
        run: node scripts/test-host-dialog-settles.mjs

      - name: Verify Anvil carries tool results + gate verdict into the next run
        run: node scripts/test-anvil-convo-carry.mjs

      - name: Verify Forge survives the agent-loop contract (signal + turn-start)
        run: node scripts/test-forge-loop-contract.mjs

      - name: Verify Anvil records every run onto the chain and self-checks the folds
        run: node scripts/test-anvil-run-record.mjs

      - name: Verify Anvil's inline module actually parses (not just greps)
        run: node scripts/test-anvil-parses.mjs
      - name: anvil handlers run (not just parse)
        run: node scripts/test-anvil-handlers.mjs
      - name: rig shell (its own tests were never in the gate)
        run: node sys/rig/cli/test/shell.test.mjs
      - name: rig shell conformance
        run: node sys/rig/cli/test/conformance.test.mjs
      - name: shell false friends (never a wrong exit 0)
        run: node sys/rig/cli/test/false-friends.test.mjs

      - name: Verify the history tool — search and read past runs (the retrieval half)
        run: node scripts/test-anvil-history.mjs

      - name: Verify the honest context budget (Ollama num_ctx, usable floor, handoff cap, reminder)
        run: node sys/ai/test/context-budget.test.mjs

      - name: Verify predict-then-grade (expect on shell) — grammar, grade, miss recorded
        run: node sys/ai/test/expect.test.mjs

      - name: Verify the post-run review fork + auto-review scheduler (learn this run)
        run: node sys/ai/test/learn.test.mjs

      - name: Verify generational evolutionary loop (AVO crib)
        run: node sys/ai/test/evolve.test.mjs

      - name: Verify proposal fingerprints (P1–P5 stability) and the poison ledger
        run: node sys/ai/test/proposal-fingerprint.test.mjs

      - name: Verify the ablation harness — same agent ± capability, recorded, replayed with zero model calls
        run: node sys/ai/test/ablate.test.mjs

      - name: Verify main-thread Kiln snapshot never corrupts the shell's .git repo
        run: node sys/kiln/test/main-thread-runtime.test.mjs

      - name: Verify agent-tier inference protocol core
        run: node sys/ai/test/agent-protocol.test.mjs

      - name: Verify agent loop over the Rig shell
        run: node sys/ai/test/agent-loop.test.mjs

      - name: Verify transcript compaction (turn-boundary cut, and no impossible retrieval)
        run: node sys/ai/test/compaction.test.mjs

      - name: Verify copy-on-write overlay backend (subagent isolation)
        run: node sys/rig/fileops/test/overlay-backend.test.mjs

      - name: Verify supervisor / parallel-subagent orchestration
        run: node sys/ai/test/subagents.test.mjs

      - name: Verify parallel subagents run isolated and merge conflict-safe
        run: node sys/ai/test/subagents-integration.test.mjs

      - name: Verify Rote core (script contract, vault redaction, immutable runs)
        run: node sys/rote/test/rote-core.test.mjs

      - name: Verify Rote harden termination (rote check)
        run: node sys/rote/test/check.test.mjs

      - name: Verify Rote harden loop control flow
        run: node sys/rote/test/harden.test.mjs

      - name: Verify P0 Identity — machine principals
        run: node sys/identity/test/principal.test.mjs

      - name: Verify P0 Grant — capability tokens
        run: node sys/identity/test/grant.test.mjs

      - name: Verify P0 FIF — encrypted identity storage survives a reload
        run: node sys/identity/test/fif.test.mjs

      - name: Verify P0 History — tamper-evident ledger
        run: node sys/history/test/ledger.test.mjs

      - name: Verify the run record — record a real run, fold it, replay it with zero model calls
        run: node sys/history/test/run-record.test.mjs

      - name: Verify the incremental fold driver — every prefix of every recorded run
        run: node sys/history/test/projection.test.mjs

      - name: Verify P0 Staging — envelope + commit authority
        run: node sys/staging/test/envelope.test.mjs

      - name: Verify P0 Staging — one reviewer over many apps (real diff types)
        run: node sys/staging/test/reviewer.test.mjs

      - name: Verify P0 end-to-end — mint→grant→act across apps→review→commit
        run: node sys/staging/test/session.test.mjs

      - name: Verify the host review queue reducer (stage/commit/discard, authority, poison)
        run: node sys/staging/test/review-queue.test.mjs

      - name: Verify P0 enforcement — agent face capability check
        run: node sys/rig/agent/test/agent-face-capability.test.mjs

      - name: Verify Assay core — Grant wall, assay.* ledger on History, verifiers
        run: node sys/assay/test/assay-core.test.mjs

      - name: Verify Assay Run-Mode loop — campaign reducer over History, resume-by-replay
        run: node sys/assay/test/assay-loop.test.mjs

      - name: Verify Assay Run-Mode driver — runs a campaign start→ship, pauses, resumes
        run: node sys/assay/test/assay-runmode.test.mjs

      - name: Verify Assay live role executors — emit→validated blocks, wall-in-the-view
        run: node sys/assay/test/assay-executors.test.mjs

      - name: Verify vendored LocalMind runtime assets
        run: node scripts/test-localmind-vendor.mjs

      - name: Verify mirrored app artifacts match the immutable lock
        run: node scripts/validate-mirrors.mjs

      - name: Verify a skipped mirror cannot be read as a successful sync
        run: node scripts/test-mirror-skip-is-loud.mjs

      - name: Verify mirror manifest and lock validation behavior
        run: node scripts/test-mirror-lock.mjs

      - name: Verify catalog, mirror, lock, and on-disk inventory agree
        run: node scripts/audit-app-inventory.mjs

      - name: Verify Reel mirror and metadata-only Crate integration
        run: node scripts/test-reel-integration.mjs

      - name: Verify NakliAmp mirror, locality, and preview contract
        run: node scripts/test-nakliamp-integration.mjs

      - name: Verify paired Compos relay and downloadable artifact Worker
        run: node --test prototypes/compos/bridge.test.mjs prototypes/compos/relay-worker.test.mjs

      - name: Verify static-asset delivery exclusions
        run: node scripts/verify-delivery.mjs

      - name: Verify naklios.com redirect Worker
        run: node scripts/test-naklios-com-redirect.mjs

      - name: Verify task folders and first-party desktop defaults
        run: node scripts/test-app-catalog.mjs

      - name: Verify deterministic inventory drift detection
        run: node scripts/test-app-inventory.mjs

      - name: Verify read-only launch diagnostics
        run: node scripts/test-launch-diagnostics.mjs

      - name: Verify app information and provenance surfaces
        run: node scripts/test-app-info.mjs

      - name: Verify secure Crate setup handoff receiver
        run: node scripts/test-crate-setup-handoff.mjs

      - name: Verify the experience-mode compatibility policy
        run: node scripts/test-experience-mode-policy.mjs

      - name: Verify third-party app manifests, isolation, and lifecycle
        run: node scripts/test-third-party-apps.mjs
