name: Test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  vendored-crate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Verify immutable Unix portability closure without browser globals
        run: node --experimental-vm-modules scripts/test-unix-portability.mjs c3553134571d1d601bfdbf857f6b3df138a6bf4f

      - name: Verify vendored Crate manifest security
        run: node scripts/test-crate-manifest.mjs

      - name: Verify vendored Crate serialises concurrent write()s under the rollback anchor
        run: node scripts/test-crate-vendored-concurrent-writes.mjs

      - name: Verify Files uses the Crate-capable host bridge
        run: node scripts/test-files-crate-bridge.mjs

      - name: Verify Crate offers file and manual connection paths
        run: node scripts/test-crate-connect-flow.mjs

      - name: Verify Tijori uses the app-scoped storage bridge
        run: node scripts/test-tijori-storage-bridge.mjs

      - name: Verify Notepad v2 uses isolated Local, Folder, and Crate storage
        run: node scripts/test-notepad-storage.mjs

      - name: Verify Notes v1 persistence and storage lifecycle
        run: node scripts/test-notes-v1.mjs

      - name: Verify Calendar timezone, recurrence, ICS, and storage lifecycle
        run: node scripts/test-calendar.mjs

      - name: Verify Editor recovery and exact-file handoff boundaries
        run: node scripts/test-editor-v1.mjs

      - name: Verify Books stays hosted and uses explicit Folder or Crate storage
        run: node scripts/test-books-storage-bridge.mjs

      - name: Verify the local COI server maps the sibling Books source
        run: node scripts/test-serve-coi-books.mjs

      - name: Verify Slate and BOFH open in Immersive NakliOS windows
        run: node scripts/test-immersive-apps.mjs

      - name: Verify UX recovery paths and accessibility contracts
        run: node scripts/test-ux-recovery.mjs

      - name: Verify filesystem operations remain bound to their selected backend
        run: node scripts/test-fs-backend-affinity.mjs

      - name: Verify shared local AI broker and SDK contracts
        run: node scripts/test-local-ai.mjs

      - name: Verify SDK-vendoring canonical invariants and splicer round-trip
        run: node scripts/test-vendored-sdk.mjs

      - name: Verify every public SDK member has an audit-ledger line with a valid status (B4)
        run: node scripts/test-sdk-audit.mjs

      - name: Verify the SDK reference cannot drift from the ledger (U1 teeth)
        run: node scripts/test-sdk-reference.mjs

      - name: Verify naklios.net egress SDK seam (ENOEGRESS until a backend is advertised)
        run: node scripts/test-net-seam.mjs

      - name: "DUR: SDK autosave timing (throttle, save on hide/pagehide/beforeclose, close guard only while unsaved)"
        run: node scripts/test-sdk-autosave.mjs

      - name: "DUR: host durability (per-path op order, close guard from the dirty report)"
        run: node scripts/test-host-durability.mjs

      - name: "S1: net.fetch is Grant-gated and History-logged (the real host block, real grant/ledger)"
        run: node scripts/test-host-egress-authority.mjs

      - name: Verify nakli-egress Worker security core (sign/allowlist/SSRF/replay)
        run: node nakli-egress/test/lib.test.mjs

      - name: Verify project memory store (facts, index, recall)
        run: node sys/ai/test/memory-store.test.mjs

      - name: Verify skills parsing, the description index, and the shell half of the skills fence
        run: node sys/ai/test/skills.test.mjs

      - name: Verify the prompt's cache prefix is stable and the tool list does not depend on the store
        run: node scripts/test-anvil-prompt-cache.mjs

      - name: Verify the provider's token count survives endpoint to host to SDK to app
        run: node scripts/test-host-usage.mjs

      - name: Verify the id that answered survives broker to host to SDK to app to chain
        run: node scripts/test-host-answered-model.mjs

      - name: Gate the system filesystem on same-origin system apps, and bind messages to the launch origin
        run: node scripts/test-host-origin-authority.mjs

      - name: Verify permission rules segment a shell chain, and that bypass cannot cover a deny rule
        run: node sys/ai/test/permission-rules.test.mjs

      - name: Verify standing permissions lift only liftable refusals, and critical has no setting
        run: node sys/ai/test/action-policy.test.mjs

      - name: Verify the action gate's threshold table, its critical tier, and that only the owner authorizes
        run: node sys/ai/test/action-gate.test.mjs

      - name: Verify Revert refuses on drift, a dropped pre-image says why, and retention is bounded
        run: node sys/ai/test/change-preimages.test.mjs

      - name: Verify shared review diff anchors, versions, and file states
        run: node sys/ai/test/review-diff.test.mjs

      - name: Verify shared review highlighting preserves source text
        run: node sys/ai/test/review-highlight.test.mjs

      - name: Verify the transcript render plans noop/append/rebuild and leaves the reader's scroll alone
        run: node sys/ai/test/log-render-plan.test.mjs

      - name: Verify the follow-up queue survives a crash, holds on a bad ending, and migrates legacy strings
        run: node sys/ai/test/followup-queue.test.mjs

      - name: Verify the procedural prior renders byte-identically and every edge is removable
        run: node scripts/test-anvil-procedural.mjs

      - name: Verify the run assembly — prompt bytes, tool list, budgets and re-loops equal the app (N1)
        run: node scripts/test-run-assembly.mjs

      - name: Verify every Anvil surface has a recipe owner and none changed unreviewed (B1 — the map is a gate)
        run: node scripts/verify-inventory.mjs

      - name: Verify the inventory check's own teeth — an added, changed or vanished surface goes red (B1)
        run: node scripts/test-verify-inventory.mjs

      - name: Verify the procedural bed runs the app's assembly end to end (stub model, zero spend)
        run: node scripts/test-bench-procedural.mjs

      - name: Verify ordering metrics — anchored, never zero-for-null, refusing unlike comparisons
        run: node sys/history/test/ordering.test.mjs

      - name: Verify the context-payload probe parses the REAL index format (a reword must go red)
        run: node scripts/test-context-payload-probe.mjs

      - name: Verify --carry actually carries (an i.i.d. bed cannot answer AC-8's quota question)
        run: node scripts/test-carry-forward.mjs

      - name: Verify the lesson gate judges harm and confesses what it could not have seen
        run: node sys/ai/test/lesson-gate.test.mjs

      - name: Verify the closed failure-kind set classifies what tools actually emit (B1)
        run: node sys/ai/test/tool-result-kind.test.mjs

      - name: Verify the security rows judge from the store and the fence, never the prose (B5)
        run: node sys/ai/test/bench-security.test.mjs

      - name: Replay the recorded-run corpus keyless (real runs, zero model calls)
        run: node sys/history/test/replay-corpus.test.mjs

      - name: Verify the corpus recorder end to end against a stub, keyless, into a temp folder (U2)
        run: node scripts/test-record-corpus.mjs

      - name: "Verify the index-usage probe (PG-A2): parser, fired/never-fired per record, the per-class summary"
        run: node scripts/test-probe-index-usage.mjs

      - name: Verify a subagent's run lands on the parent's chain (multi-agent auditability)
        run: node sys/history/test/subagent-chain.test.mjs

      - name: Verify search-cost instrumentation changes no search result
        run: node sys/rig/fileops/test/search-cost.test.mjs

      - name: Verify the trigram index under fs.grep
        run: node sys/rig/fileops/test/trigram.test.mjs

      - name: Verify Rig fileops conformance (the 8-method backend contract)
        run: node sys/rig/fileops/test/conformance.test.mjs

      - name: Verify governed bounded reads before backend allocation
        run: node sys/rig/fileops/test/bounded-read.test.mjs

      - name: Verify non-following metadata and staged final-symlink deletion
        run: node sys/rig/fileops/test/final-symlink.test.mjs

      - name: Verify metadata-only traversal avoids content reads and preserves Overlay fences
        run: node sys/rig/fileops/test/metadata-only.test.mjs

      - name: Verify the OPFS backend
        run: node sys/rig/fileops/test/opfs.test.mjs

      - name: Verify the File System Access backend
        run: node sys/rig/fileops/test/fsa-backend.test.mjs

      - name: Verify the Crate backend
        run: node sys/rig/fileops/test/crate-backend.test.mjs

      - name: Verify the Rig command registry conformance
        run: node sys/rig/registry/test/conformance.test.mjs

      - name: Verify vendored git conformance
        run: node sys/rig/git/test/conformance.test.mjs

      - name: Verify the git transport
        run: node sys/rig/git/test/transport.test.mjs

      - name: Verify the goals module conformance
        run: node sys/rig/goals/test/conformance.test.mjs

      - name: Verify the shell completer
        run: node sys/rig/cli/test/completer.test.mjs

      - name: Verify the shell line editor
        run: node sys/rig/cli/test/lineeditor.test.mjs

      - name: Verify Kiln conformance (the Python kernel contract)
        run: node sys/kiln/test/conformance.test.mjs

      - name: Verify the Kiln filesystem bridge
        run: node sys/kiln/test/fs-bridge.test.mjs

      - name: Verify Kiln to Rig bindings
        run: node sys/kiln/test/rig-bindings.test.mjs

      - name: Verify the Kiln verifier
        run: node sys/kiln/test/verifier.test.mjs

      - name: "G9: a workspace ES module runs as a gate — node --test through a real worker (exit codes, node:test, no network, no npm)"
        run: node sys/kiln/test/js-runner.test.mjs

      - name: Verify the Kiln worker runtime
        run: node sys/kiln/test/worker-runtime.test.mjs

      - name: Verify the agent toolset (tool schemas, handlers, guards)
        run: node sys/ai/test/agent-tools.test.mjs

      - name: Verify project hooks (pre/post-tool commands)
        run: node sys/ai/test/hooks.test.mjs

      - name: Verify project hooks end to end over fileops
        run: node sys/ai/test/hooks-integration.test.mjs

      - name: Verify hashline rendering and edits
        run: node sys/ai/test/hashline.test.mjs

      - name: Verify project context assembly
        run: node sys/ai/test/project-context.test.mjs

      - name: Verify skills end to end over fileops
        run: node sys/ai/test/skills-integration.test.mjs

      - name: Verify the on-device tier split (agent work never routes to Nano)
        run: node scripts/test-nano-routing.mjs

      - name: Verify the onboarding and UI regression levers
        run: node scripts/test-onboarding-and-ui-fixes.mjs

      - name: Verify the semantic-search regression levers
        run: node scripts/test-semantic-search-fixes.mjs

      - name: Verify every test file is actually run by this gate (no orphaned coverage)
        run: node scripts/check-gate-coverage.mjs

      - name: Verify .anvil/skills is readable and UNWRITABLE from every agent route (grant-enforced)
