<style>/* Chartella — light by default and independent of the system dark mode; a NakliOS theme overrides these tokens
   (src/theme-early.js). The board canvas fills the window; the chrome floats over it. */
:root {
  --bg: #f7f6f3; --panel: #ffffff; --ink: #1f2328; --muted: #6b6f76; --line: #e3e1dc;
  --accent: #5b5bd6; --accent-soft: #ebebfc; --sel-bg: rgba(91, 91, 214, .18); --ok: #2f7d4f; --label: #5b5bd6; --err: #c92a2a;
  --shadow: 0 1px 2px rgba(20, 20, 40, .06), 0 4px 16px rgba(20, 20, 40, .08);
  --radius: 10px;
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg); color: var(--ink); font: 13px/1.4 "Chartella Sans", Inter, system-ui, -apple-system, "Segoe UI", sans-serif; -webkit-tap-highlight-color: transparent; }
button, input, select, textarea { font: inherit; color: inherit; }
kbd { font: 11px "Chartella Mono", ui-monospace, SFMono-Regular, Menlo, monospace; border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 4px; padding: 0 4px; background: var(--bg); white-space: nowrap; }
[hidden] { display: none !important; }
:focus { outline: none; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 6px; }

#app { position: fixed; inset: 0; overflow: hidden; }
.stage { position: absolute; inset: 0; touch-action: none; background: var(--bg); }
.stage canvas { position: absolute; inset: 0; display: block; }
#app.dropping .stage { outline: 3px dashed var(--accent); outline-offset: -8px; }

.panel { position: absolute; z-index: 10; background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); }
.sep { width: 1px; align-self: stretch; background: var(--line); margin: 4px 2px; }
.grow { flex: 1; }

/* buttons */
.ibtn { display: inline-flex; align-items: center; justify-content: center; width: 36px; height: 36px; padding: 0; border: 0; border-radius: 8px; background: transparent; cursor: pointer; color: var(--ink); flex: none; }
.ibtn:hover:not(:disabled) { background: var(--accent-soft); }
.ibtn[aria-pressed="true"] { background: var(--accent-soft); color: var(--accent); box-shadow: inset 0 0 0 1.5px var(--accent); }
.ibtn.locked { box-shadow: inset 0 0 0 1.5px var(--accent), inset 0 -3px 0 var(--accent); }
.ibtn:disabled { opacity: .35; cursor: default; }
.btn { border: 1px solid var(--line); background: var(--panel); border-radius: 8px; padding: 6px 12px; cursor: pointer; }
.btn:hover:not(:disabled) { border-color: var(--accent); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
.tbtn { border: 0; background: transparent; padding: 5px 9px; border-radius: 6px; cursor: pointer; min-height: 30px; }
.tbtn:hover { background: var(--accent-soft); }
.tbtn[aria-pressed="true"] { background: var(--accent-soft); color: var(--accent); box-shadow: inset 0 0 0 1.5px var(--accent); }

/* top bar */
.topbar { top: 12px; left: 12px; display: flex; align-items: center; gap: 2px; padding: 3px; max-width: calc(100vw - 24px); }
.brand { font-weight: 800; color: var(--label); padding: 0 6px 0 2px; letter-spacing: .01em; }
.board-name { border: 1px solid transparent; background: transparent; border-radius: 6px; padding: 5px 6px; width: 180px; min-width: 60px; font-weight: 600; }
.board-name:hover, .board-name:focus { border-color: var(--line); background: var(--bg); }
.menu-wrap { position: relative; }
.menu { position: absolute; top: calc(100% + 8px); left: 0; z-index: 30; min-width: 250px; padding: 6px; background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); }
.mitem { display: flex; align-items: center; gap: 8px; width: 100%; border: 0; background: transparent; padding: 7px 8px; border-radius: 6px; text-align: left; cursor: pointer; }
.mitem:hover, .mitem:focus-visible { background: var(--accent-soft); outline: none; }
.mitem .mlabel { flex: 1; }
.mitem .mcheck { width: 14px; text-align: center; color: var(--accent); }
.mitem[aria-checked="true"] .mcheck::before { content: "✓"; }
.msep { height: 1px; background: var(--line); margin: 4px 2px; }

/* toolbar */
.toolbar { top: 12px; left: 50%; transform: translateX(-50%); display: flex; align-items: center; gap: 2px; padding: 3px; max-width: calc(100vw - 24px); overflow-x: auto; scrollbar-width: none; }
.toolbar::-webkit-scrollbar { display: none; }
@media (max-width: 1180px) { .toolbar { top: 64px; } }

/* style panel */
.style { top: 64px; left: 12px; width: 236px; max-height: calc(100vh - 140px); overflow: auto; padding: 4px 10px 10px; }
@media (max-width: 1180px) { .style { top: 116px; max-height: calc(100vh - 190px); } }
.style-toggle { display: block; width: 100%; border: 0; background: transparent; text-align: left; font-weight: 700; padding: 6px 0; cursor: pointer; text-transform: none; }
.style-toggle::after { content: "▾"; float: right; color: var(--muted); }
.style-toggle[aria-expanded="false"]::after { content: "▸"; }
.sec { margin: 8px 0 0; }
.sec h3 { margin: 0 0 4px; font-size: 11px; font-weight: 600; color: var(--muted); }
.swatches { display: flex; flex-wrap: wrap; gap: 4px; align-items: center; }
.sw { width: 24px; height: 24px; border-radius: 6px; border: 1px solid var(--line); background: var(--sw); cursor: pointer; padding: 0; }
.sw.none { background: linear-gradient(135deg, transparent 45%, var(--err) 45% 55%, transparent 55%), var(--panel); }
.sw[aria-pressed="true"] { box-shadow: 0 0 0 2px var(--panel), 0 0 0 4px var(--accent); }
.sw-custom { width: 26px; height: 26px; padding: 0; border: 1px solid var(--line); border-radius: 6px; background: var(--panel); cursor: pointer; }
.seg { display: inline-flex; flex-wrap: wrap; gap: 2px; padding: 2px; background: var(--bg); border-radius: 8px; }
.seg .ibtn { width: 32px; height: 30px; }
.row { display: flex; align-items: center; gap: 8px; }
.row.end { justify-content: flex-end; margin-top: 14px; }
.sec select { flex: 1; border: 1px solid var(--line); border-radius: 6px; padding: 4px; background: var(--panel); min-width: 0; }
.sec input[type=range] { flex: 1; accent-color: var(--accent); }
.sec output { font: 11px "Chartella Mono", ui-monospace, monospace; color: var(--muted); min-width: 40px; text-align: right; }
.tools-row { display: flex; flex-wrap: wrap; gap: 2px; margin-bottom: 2px; }
.tools-row .ibtn { width: 32px; height: 32px; }
.hint { color: var(--muted); font-size: 12px; margin: 4px 0; }

/* zoom, help, status, banner */
.zoombar { bottom: 12px; left: 12px; display: flex; align-items: center; gap: 2px; padding: 3px; }
.zoom-pct { border: 0; background: transparent; min-width: 52px; height: 36px; border-radius: 8px; cursor: pointer; font-variant-numeric: tabular-nums; }
.zoom-pct:hover { background: var(--accent-soft); }
.help-btn { bottom: 12px; right: 12px; width: 40px; height: 40px; }
.status { position: absolute; z-index: 9; bottom: 18px; left: 50%; transform: translateX(-50%); max-width: min(640px, calc(100vw - 260px)); padding: 4px 12px; border-radius: 999px; background: color-mix(in srgb, var(--panel) 88%, transparent); color: var(--muted); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; pointer-events: none; }
.status:empty { display: none; }
.status[data-kind="err"] { color: var(--err); background: color-mix(in srgb, var(--err) 10%, var(--panel)); }
.banner { top: 64px; left: 50%; transform: translateX(-50%); display: flex; align-items: center; gap: 8px; padding: 8px 10px 8px 14px; max-width: calc(100vw - 24px); z-index: 20; }
@media (max-width: 1180px) { .banner { top: 116px; } }

/* dialogs */
.dlg { border: 1px solid var(--line); border-radius: 14px; padding: 20px 22px; background: var(--panel); color: var(--ink); box-shadow: var(--shadow); max-width: min(560px, calc(100vw - 24px)); width: 100%; }
.dlg::backdrop { background: rgba(20, 20, 30, .28); }
.dlg h2 { margin: 0 0 12px; font-size: 17px; }
.dlg .field { border: 0; padding: 0; margin: 0 0 12px; }
.dlg legend, .dlg .field > span { display: block; font-size: 12px; font-weight: 600; color: var(--muted); margin-bottom: 4px; }
.dlg .radio { display: inline-flex; align-items: center; gap: 4px; padding: 4px 8px; border-radius: 6px; cursor: pointer; }
.dlg .radio:has(input:checked) { background: var(--accent-soft); color: var(--accent); }
.dlg .radio:has(input:disabled) { opacity: .45; cursor: default; }
.dlg .check { display: flex; gap: 8px; align-items: center; margin: 6px 0; }
.dlg select { border: 1px solid var(--line); border-radius: 6px; padding: 5px; background: var(--panel); width: 100%; }
.dlg input[type=radio], .dlg input[type=checkbox] { accent-color: var(--accent); }
.chooser .list { display: flex; flex-direction: column; gap: 4px; max-height: 50vh; overflow: auto; }
.chooser .item { text-align: left; }
.help { max-width: min(860px, calc(100vw - 24px)); }
.help-grid { columns: 2 300px; column-gap: 28px; max-height: 70vh; overflow: auto; }
.help-grid section { break-inside: avoid; margin-bottom: 14px; }
.help-grid h3 { margin: 0 0 4px; font-size: 13px; color: var(--label); }
.help-grid table { width: 100%; border-collapse: collapse; }
.help-grid th { text-align: left; font-weight: 400; padding: 3px 8px 3px 0; }
.help-grid td { text-align: right; padding: 3px 0; color: var(--muted); }

/* phone width: tools along the bottom, the style panel a collapsible sheet above them */
@media (max-width: 640px) {
  .brand { display: none; }
  .board-name { width: 120px; }
  .toolbar { top: auto; bottom: 10px; left: 10px; right: 10px; transform: none; max-width: none; }
  .zoombar { bottom: 66px; left: 10px; }
  .help-btn { bottom: 66px; right: 10px; }
  .style { top: auto; bottom: 116px; left: 10px; right: 10px; width: auto; max-height: 40vh; }
  .status { bottom: 120px; max-width: calc(100vw - 32px); }
  .banner { top: 64px; flex-wrap: wrap; }
  .ibtn { width: 40px; height: 40px; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>

<script>
// Global error surface: nothing fails silently. Errors are kept for agents and shown in the status bar.
window.__chartellaErrors = [];
const report = (msg) => { window.__chartellaErrors.push(String(msg)); const s = document.getElementById('status'); if (s) { s.textContent = 'Error: ' + msg; s.dataset.kind = 'err'; } };
// ResizeObserver's "loop completed with undelivered notifications" is a benign browser notice, not a failure.
addEventListener('error', (e) => { if (/ResizeObserver loop/.test(e.message || '')) return; report(`${e.message} (${e.filename?.split('/').pop() ?? ''}:${e.lineno})`); });
addEventListener('unhandledrejection', (e) => report(e.reason?.message ?? e.reason));
</script>

.stencil-panel, .panel.stencil-panel { position: fixed; top: 64px; left: 12px; width: 300px; max-height: calc(100vh - 140px); display: flex; flex-direction: column; gap: 8px; padding: 10px; z-index: 30; }
.stencil-panel[hidden] { display: none; }
.stencil-panel .sp-head { display: flex; align-items: center; gap: 6px; }
.stencil-panel .sp-title { font-weight: 600; font-size: 13px; flex: 1; }
.stencil-panel .sp-close { border: 0; background: transparent; color: inherit; font-size: 18px; line-height: 1; padding: 2px 6px; border-radius: 6px; cursor: pointer; }
.stencil-panel .sp-close:hover { background: var(--accent-soft, #ebebfc); }
.stencil-panel .sp-search { width: 100%; box-sizing: border-box; padding: 6px 8px; border: 1px solid var(--line, #e3e1dc); border-radius: 8px; background: var(--panel, #fff); color: inherit; font: inherit; font-size: 13px; }
.stencil-panel .sp-tabs { display: flex; flex-wrap: wrap; gap: 4px; }

.stencil-panel .sp-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; overflow-y: auto; min-height: 60px; }
.stencil-panel .sp-tile { display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 6px 2px 4px; border: 1px solid transparent; border-radius: 8px; background: transparent; color: var(--ink, #1f2328); cursor: pointer; font-size: 10px; line-height: 1.2; }

.stencil-panel .sp-tile span { max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.stencil-panel .sp-tile svg { color: var(--ink, #1f2328); }
.stencil-panel .sp-note { font-size: 12px; color: var(--muted, #6b6f76); margin: 0; }
