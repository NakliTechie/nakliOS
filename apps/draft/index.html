<style>
/* ==== begin ui/page.css ==== */
/* ui/page.css — the Draft surface (Batch C). Hara density: a quiet page —
   the type is the interface, and nothing competes with the words.
   EVERY colour and spacing value is a token (handoff §8); mirrored into
   draft.html as a hash-pinned <style> region by test/product-check.mjs. */

:root {
  /* type */
  --dr-prose: "Draft Serif", "Noto Serif", Georgia, "Times New Roman", serif;
  --dr-ui: "Draft UI", "IBM Plex Sans", -apple-system, "Segoe UI", "Helvetica Neue", sans-serif;
  /* the ONE accent: links, selection, focus, diff insertions only */
  --dr-accent: #2d4fa1;
  --dr-accent-wash: rgba(45, 79, 161, 0.16); /* selection tint of the accent */
  --dr-accent-wash-strong: rgba(45, 79, 161, 0.32); /* the active find match */
  /* semantic error (status-line banner only; not a second accent) */
  --dr-error: #9e2b1f;
  /* neutral ramp, warm paper greys: n0 = page, n9 = ink */
  --dr-n0: #fdfcfa;
  --dr-n1: #f6f3ee;
  --dr-n2: #ece8e0;
  --dr-n3: #d9d4c9;
  --dr-n4: #b3ac9f;
  --dr-n5: #8b8478;
  --dr-n6: #6b655b;
  --dr-n7: #4d4841;
  --dr-n8: #33302b;
  --dr-n9: #1f1d19;
  /* spacing */
  --dr-s1: 4px;
  --dr-s2: 8px;
  --dr-s3: 12px;
  --dr-s4: 16px;
  --dr-s5: 24px;
  --dr-s6: 40px;
  /* the measure */
  --dr-measure: 68ch;
  /* chrome */
  --dr-rail-w: 44px;
  --dr-rail-w-open: 216px;
  --dr-outline-w: 44px;
  --dr-outline-w-open: 232px;
  --dr-rail-tint: rgba(31, 29, 25, 0.04); /* whisper of a column: the rail's
    at-rest affordance — desk substance, never the paper's */
  --dr-status-h: 68px;
  --dr-ease: 140ms ease;
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  background: var(--dr-n1);
  color: var(--dr-n9);
  font-family: var(--dr-prose);
}

::selection { background: var(--dr-accent-wash); }

:focus-visible {
  outline: 2px solid var(--dr-accent);
  outline-offset: 2px;
}

a { color: var(--dr-accent); }

/* ---- status line — the only thing above the page ------------------------
   Ink tiers: title (n8, medium) → saved-state (n8 medium when unsaved/dirty,
   n7 at rest) → counts (n7) → version (n6). Sits between bezel and paper,
   not clamped to the bezel. */
#status {
  position: fixed;
  top: 0;
  left: var(--dr-rail-w);
  right: 0;
  height: var(--dr-status-h);
  display: flex;
  align-items: center;
  justify-content: center;
  gap: var(--dr-s2);
  font: 12px/1 var(--dr-ui);
  color: var(--dr-n7);
  background: var(--dr-n1);
  z-index: 3;
}
#status .dr-sep { color: var(--dr-n5); }
#status .dr-title { color: var(--dr-n8); font-weight: 500; }
#status .dr-state.dr-dirty { color: var(--dr-n8); font-weight: 500; }
#status .dr-version { color: var(--dr-n6); }
#status.dr-error-banner {
  color: var(--dr-error);
  font-weight: 500;
}

/* ---- the page ----------------------------------------------------------- */
#desk {
  margin-left: var(--dr-rail-w);
  padding: calc(var(--dr-status-h) + var(--dr-s2)) var(--dr-s5) var(--dr-s6);
  display: flex;
  justify-content: center;
}

/* The page's 72px inner margin holds at every viewport; when the window
   narrows, the PAPER narrows (the measure gives way), never the margin. */
#page {
  width: 100%;
  max-width: calc(var(--dr-measure) + 2 * 72px);
  background: var(--dr-n0);
  border: 1px solid var(--dr-n2);
  border-radius: 2px;
  padding: 64px 72px 96px;
  min-height: calc(100vh - var(--dr-status-h) - 2 * var(--dr-s6));
}

@media (max-width: 900px) {
  #desk { padding-left: var(--dr-s4); padding-right: var(--dr-s4); }
}

/* ---- prose -------------------------------------------------------------- */
.ProseMirror {
  outline: none;
  white-space: pre-wrap;
  font: 17px/1.5 var(--dr-prose);
  color: var(--dr-n9);
  caret-color: var(--dr-n9);
}
.ProseMirror:focus-visible { outline: none; } /* the page IS the focus */

.ProseMirror p { margin: 0 0 var(--dr-s4); }
.ProseMirror h1, .ProseMirror h2, .ProseMirror h3, .ProseMirror h4 {
  font-family: var(--dr-prose);
  font-weight: 700;
  color: var(--dr-n9);
  line-height: 1.25;
  margin: var(--dr-s6) 0 var(--dr-s4);
}
.ProseMirror h1:first-child, .ProseMirror h2:first-child,
.ProseMirror h3:first-child, .ProseMirror h4:first-child { margin-top: 0; }
.ProseMirror h1 { font-size: 1.7em; }
.ProseMirror h2 { font-size: 1.4em; }
.ProseMirror h3 { font-size: 1.18em; }
.ProseMirror h4 { font-size: 1em; letter-spacing: 0.01em; }

.ProseMirror blockquote {
  margin: 0 0 var(--dr-s4);
  padding: 0 0 0 var(--dr-s4);
  border-left: 2px solid var(--dr-n3);
  color: var(--dr-n7);
}
.ProseMirror pre {
  font: 14px/1.5 ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  background: var(--dr-n1);
  border: 1px solid var(--dr-n2);
  border-radius: 2px;
  padding: var(--dr-s3) var(--dr-s4);
  margin: 0 0 var(--dr-s4);
  overflow-x: auto;
}
.ProseMirror code {
  font: 0.85em/1 ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  background: var(--dr-n1);
  padding: 1px var(--dr-s1);
  border-radius: 2px;
}
.ProseMirror pre code { background: none; padding: 0; }

.ProseMirror ul, .ProseMirror ol { margin: 0 0 var(--dr-s4); padding-left: var(--dr-s5); }
.ProseMirror li { margin: 0; }
.ProseMirror li p { margin: 0 0 var(--dr-s1); }
.ProseMirror ul ul, .ProseMirror ol ol, .ProseMirror ul ol, .ProseMirror ol ul { margin-bottom: 0; }

.ProseMirror hr {
  border: none;
  border-top: 1px solid var(--dr-n3);
  margin: var(--dr-s5) auto;
  width: 38%;
}

.ProseMirror table {
  border-collapse: collapse;
  margin: 0 0 var(--dr-s4);
  font-size: 0.95em;
}
.ProseMirror td, .ProseMirror th {
  border: 1px solid var(--dr-n3);
  padding: var(--dr-s1) var(--dr-s2);
  vertical-align: top;
  min-width: 2em;
}
.ProseMirror th { background: var(--dr-n1); font-weight: 700; text-align: left; }
.ProseMirror td p, .ProseMirror th p { margin: 0; }

.ProseMirror img { max-width: 100%; height: auto; }

.ProseMirror a { color: var(--dr-accent); text-decoration: underline; text-underline-offset: 2px; }

.ProseMirror .dr-footnote {
  color: var(--dr-accent);
  font-size: 0.75em;
  cursor: default;
}

.ProseMirror-selectednode { outline: 2px solid var(--dr-accent); }

/* ---- empty state ---------------------------------------------------------
   The placeholder speaks in the page's own serif at body size — the sheet's
   first impression is the prose face. The "?" is a bare glyph control, the
   same idiom as the rail (no strokes, no enclosures). */
#hint {
  margin-top: var(--dr-s6);
  font: 17px/1.5 var(--dr-prose);
  color: var(--dr-n6);
  display: flex;
  align-items: baseline;
  gap: var(--dr-s1);
}
#hint[hidden] { display: none; }
#hint button {
  /* The sentence's own size and face bind the "?" to it (proximity + scale
     do what an enclosure would). */
  font: 17px/1 var(--dr-prose);
  color: var(--dr-n6);
  background: none;
  border: none;
  cursor: pointer;
  padding: var(--dr-s1) 2px;
}
#hint button:hover { color: var(--dr-n9); }

/* ---- the rail ------------------------------------------------------------
   Desk substance at rest AND expanded (never the paper's fill or border) —
   expanding brings labels, not a second sheet. At rest the glyphs sit at
   n6 so the words on the page carry the most ink; full ink arrives on
   hover/focus/active. Hover raises ink only; the active (pressed) state
   alone carries a fill — the two signals stay distinct. */
#rail {
  position: fixed;
  top: 0;
  left: 0;
  bottom: 0;
  width: var(--dr-rail-w);
  overflow-x: hidden;
  overflow-y: auto;
  background: var(--dr-rail-tint);
  padding: var(--dr-s3) 0;
  display: flex;
  flex-direction: column;
  gap: 2px;
  transition: width var(--dr-ease);
  z-index: 4;
  scrollbar-width: none;
}
#rail:hover, #rail:focus-within {
  width: var(--dr-rail-w-open);
}
@media (prefers-reduced-motion: reduce) {
  #rail { transition: none; }
}

#rail .dr-gap { height: 34px; flex: none; }
/* Gated commands (the in-table group) hide by [hidden]; the explicit rule is
   required because `#rail button { display: flex }` outranks the UA
   [hidden]{display:none}, so the property alone would not hide them. */
#rail button[hidden], #rail .dr-gap[hidden] { display: none; }

#rail button {
  display: flex;
  align-items: center;
  gap: var(--dr-s3);
  width: 100%;
  height: 34px;
  flex: none;
  border: none;
  background: none;
  padding: 0 0 0 var(--dr-s3);
  font: 13px/1 var(--dr-ui);
  color: var(--dr-n6);
  cursor: pointer;
  white-space: nowrap;
  text-align: left;
}
#rail button:hover { color: var(--dr-n9); }
#rail button[aria-pressed="true"] {
  color: var(--dr-n9);
  background: var(--dr-n2);
}
#rail button:focus-visible { outline-offset: -2px; }
#rail .dr-label { color: var(--dr-n7); }
#rail button:hover .dr-label, #rail button[aria-pressed="true"] .dr-label { color: var(--dr-n9); }

#rail .dr-glyph {
  flex: none;
  width: 20px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  font-family: var(--dr-prose);
  font-size: 14px;
}
#rail .dr-glyph svg { width: 15px; height: 15px; }
#rail .dr-label {
  flex: 1;
  opacity: 0;
  transition: opacity var(--dr-ease);
}
#rail .dr-kbd {
  opacity: 0;
  transition: opacity var(--dr-ease);
  font: 11px/1 var(--dr-ui);
  color: var(--dr-n6);
  padding-right: var(--dr-s3);
}
#rail:hover .dr-label, #rail:focus-within .dr-label,
#rail:hover .dr-kbd, #rail:focus-within .dr-kbd { opacity: 1; }
@media (prefers-reduced-motion: reduce) {
  #rail .dr-label, #rail .dr-kbd { transition: none; }
}

/* ---- in-app prompt / help cards (never native, never modal-blocking) ----- */
.dr-card {
  position: fixed;
  top: calc(var(--dr-status-h) + var(--dr-s5));
  left: 50%;
  transform: translateX(-50%);
  background: var(--dr-n0);
  border: 1px solid var(--dr-n3);
  border-radius: 3px;
  box-shadow: 0 4px 16px rgba(31, 29, 25, 0.08);
  padding: var(--dr-s4) var(--dr-s5);
  font: 13px/1.6 var(--dr-ui);
  color: var(--dr-n8);
  z-index: 5;
  min-width: 320px;
}
.dr-card[hidden] { display: none; }
.dr-card h2 {
  font: 500 13px/1 var(--dr-ui);
  color: var(--dr-n9);
  margin: 0 0 var(--dr-s3);
}
.dr-card input {
  width: 100%;
  font: 13px/1 var(--dr-ui);
  color: var(--dr-n9);
  background: var(--dr-n0);
  border: 1px solid var(--dr-n3);
  border-radius: 2px;
  padding: var(--dr-s2) var(--dr-s3);
}
.dr-card .dr-note { color: var(--dr-n6); font-size: 12px; margin-top: var(--dr-s2); }
.dr-card table { border-collapse: collapse; }
.dr-card td { padding: 2px var(--dr-s4) 2px 0; }
.dr-card td.dr-kbd-col { color: var(--dr-n6); font-size: 12px; }

/* ---- find / replace ------------------------------------------------------
   The match highlights are the accent's own wash (the ONE accent, §8); the
   active match a stronger tint. The card sits top-right so the centred page
   of matches stays in view while the panel is open. */
.dr-find-match { background: var(--dr-accent-wash); border-radius: 1px; }
.dr-find-active { background: var(--dr-accent-wash-strong); }

.dr-card-find {
  left: auto;
  right: var(--dr-s5);
  transform: none;
  min-width: 300px;
}
.dr-find-row {
  display: flex;
  align-items: center;
  gap: var(--dr-s2);
  margin-bottom: var(--dr-s2);
}
.dr-find-row input { flex: 1; }
.dr-find-count {
  flex: none;
  min-width: 4.5em;
  text-align: right;
  color: var(--dr-n6);
  font-size: 12px;
}
.dr-find-controls {
  display: flex;
  align-items: center;
  gap: var(--dr-s1);
  margin-top: var(--dr-s2);
}
.dr-find-controls button {
  font: 12px/1 var(--dr-ui);
  color: var(--dr-n7);
  background: var(--dr-n1);
  border: 1px solid var(--dr-n3);
  border-radius: 2px;
  padding: var(--dr-s1) var(--dr-s2);
  cursor: pointer;
}
.dr-find-controls button:hover { color: var(--dr-n9); background: var(--dr-n2); }
.dr-find-toggle {
  display: inline-flex;
  align-items: center;
  gap: 3px;
  font: 12px/1 var(--dr-ui);
  color: var(--dr-n7);
  cursor: pointer;
  padding: var(--dr-s1) var(--dr-s1);
  user-select: none;
}
.dr-find-toggle input { width: auto; margin: 0; }

/* ---- import notes (the owed IO UX) --------------------------------------- */
.dr-card-notes { max-width: 420px; }
.dr-notes-list {
  margin: var(--dr-s3) 0 0;
  padding-left: var(--dr-s5);
  max-height: 40vh;
  overflow-y: auto;
}
.dr-notes-list li { margin: 0 0 var(--dr-s2); color: var(--dr-n7); }
.dr-notes-done {
  margin-top: var(--dr-s4);
  font: 12px/1 var(--dr-ui);
  color: var(--dr-n7);
  background: var(--dr-n1);
  border: 1px solid var(--dr-n3);
  border-radius: 2px;
  padding: var(--dr-s2) var(--dr-s4);
  cursor: pointer;
}
.dr-notes-done:hover { color: var(--dr-n9); background: var(--dr-n2); }

/* ---- documents (folder view) ---------------------------------------------
   The one panel that is a place, not a prompt: the documents on disk, newest
   first. Same card idiom — quiet type, the accent only on the active row and
   focus. Rows are the recents; the sole native dialog is the browser's own
   folder/file picker the buttons reach. */
.dr-card-docs { min-width: 360px; max-width: 460px; }
.dr-docs-loc {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: var(--dr-s3);
  margin-bottom: var(--dr-s3);
}
.dr-docs-loc .dr-note { margin-top: 0; }
.dr-docs-choose, .dr-docs-new, .dr-docs-openfile {
  flex: none;
  font: 12px/1 var(--dr-ui);
  color: var(--dr-n7);
  background: var(--dr-n1);
  border: 1px solid var(--dr-n3);
  border-radius: 2px;
  padding: var(--dr-s2) var(--dr-s3);
  cursor: pointer;
}
.dr-docs-choose:hover, .dr-docs-new:hover, .dr-docs-openfile:hover { color: var(--dr-n9); background: var(--dr-n2); }
.dr-docs-actions { display: flex; gap: var(--dr-s2); margin-bottom: var(--dr-s4); }
.dr-docs-heading {
  font: 500 11px/1 var(--dr-ui);
  letter-spacing: 0.04em;
  text-transform: uppercase;
  color: var(--dr-n5);
  margin-bottom: var(--dr-s2);
}
.dr-docs-list {
  list-style: none;
  margin: 0;
  padding: 0;
  max-height: 44vh;
  overflow-y: auto;
}
.dr-docs-row {
  display: flex;
  align-items: center;
  gap: var(--dr-s2);
  border-radius: 2px;
}
.dr-docs-row.dr-docs-active { background: var(--dr-accent-wash); }
.dr-docs-open {
  flex: 1;
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: var(--dr-s3);
  text-align: left;
  background: none;
  border: none;
  cursor: pointer;
  padding: var(--dr-s2) var(--dr-s3);
  font: 13px/1.4 var(--dr-ui);
  color: var(--dr-n8);
  min-width: 0;
}
.dr-docs-open:hover { color: var(--dr-n9); }
.dr-docs-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.dr-docs-when { flex: none; margin-top: 0; }
.dr-docs-rename {
  flex: none;
  font: 12px/1 var(--dr-ui);
  color: var(--dr-n6);
  background: none;
  border: none;
  cursor: pointer;
  padding: var(--dr-s1) var(--dr-s2);
}
.dr-docs-rename:hover { color: var(--dr-n9); }
.dr-docs-renaming { padding: var(--dr-s1) var(--dr-s2); }
.dr-docs-rename-input { width: 100%; }
.dr-docs-rename-err { color: var(--dr-error); margin-top: 0; }
.dr-docs-empty[hidden] { display: none; }
.dr-docs-export {
  display: flex;
  align-items: center;
  gap: var(--dr-s2);
  margin-top: var(--dr-s4);
  padding-top: var(--dr-s3);
  border-top: 1px solid var(--dr-n2);
}
.dr-docs-export .dr-note { margin-top: 0; }
.dr-docs-dl {
  font: 12px/1 var(--dr-ui);
  color: var(--dr-n7);
  background: var(--dr-n1);
  border: 1px solid var(--dr-n3);
  border-radius: 2px;
  padding: var(--dr-s1) var(--dr-s2);
  cursor: pointer;
}
.dr-docs-dl:hover { color: var(--dr-n9); background: var(--dr-n2); }
.dr-card-docs .dr-notes-done { margin-top: var(--dr-s4); }

/* Drag-and-drop: the whole desk accepts a dropped file; the affordance is a
   quiet accent inset while a file hovers (never a modal). */
#desk.dr-drop-active #page { box-shadow: 0 0 0 2px var(--dr-accent); }

/* ---- keyboard help (Batch J: carries the privacy statement, §14) --------- */
.dr-card-help { max-width: 460px; }
.dr-help-privacy { margin-top: var(--dr-s3); line-height: 1.5; }

/* ---- settings (Language + the Developer toggle) -------------------------- */
.dr-card-settings { max-width: 400px; }
.dr-set-row {
  display: flex;
  align-items: center;
  gap: var(--dr-s2);
  font: 13px/1.4 var(--dr-ui);
  color: var(--dr-n8);
  cursor: pointer;
}
.dr-set-row input { width: auto; margin: 0; }
/* The language row (Batch J i18n): label left, selector right. */
.dr-set-lang { justify-content: space-between; margin-bottom: var(--dr-s3); }
.dr-set-lang-sel {
  width: auto;
  font: 13px/1 var(--dr-ui);
  color: var(--dr-n9);
  background: var(--dr-n0);
  border: 1px solid var(--dr-n3);
  border-radius: 2px;
  padding: var(--dr-s1) var(--dr-s2);
  cursor: pointer;
}

/* ---- sidecar (Batch H) ---------------------------------------------------
   The writing help is optional and quiet. Affordances DIM (never hide) when no
   model is present — the page stands alone. The staged diff is the one place a
   second colour beyond the accent is warranted: a deletion is struck in a muted
   ink, an insertion wears the accent's own wash. Nothing shouts. */

/* Dimmed-but-present affordances (rail spark + inapplicable panel actions). */
.dr-dim { opacity: 0.4; }
#rail button.dr-dim:hover { color: var(--dr-n6); }

/* The staged diff over the live page. */
.dr-stage-del {
  color: var(--dr-n5);
  text-decoration: line-through;
  text-decoration-color: var(--dr-n4);
}
.dr-stage-keep { color: var(--dr-n8); } /* a rejected deletion: kept, shown plain */
.dr-stage-ins {
  color: var(--dr-accent);
  background: var(--dr-accent-wash);
  border-radius: 1px;
  padding: 0 1px;
  box-decoration-break: clone;
}
.dr-stage-ins-block {
  display: block;
  margin: var(--dr-s3) 0;
  padding: var(--dr-s2) var(--dr-s3);
  border-left: 2px solid var(--dr-accent);
  white-space: pre-wrap;
  line-height: 1.5;
}
.dr-stage-del.dr-stage-active { text-decoration-color: var(--dr-accent); background: var(--dr-accent-wash); }
.dr-stage-ins.dr-stage-active { background: var(--dr-accent-wash-strong); }

/* The review bar: hunk-by-hunk navigation, floating at the foot of the page. */
.dr-review-bar {
  position: fixed;
  bottom: var(--dr-s5);
  left: 50%;
  transform: translateX(-50%);
  display: flex;
  align-items: center;
  gap: var(--dr-s4);
  background: var(--dr-n1);
  border: 1px solid var(--dr-n3);
  border-radius: 3px;
  box-shadow: 0 4px 16px rgba(31, 29, 25, 0.1);
  padding: var(--dr-s2) var(--dr-s4);
  font: 12px/1 var(--dr-ui);
  color: var(--dr-n7);
  z-index: 6;
}
.dr-review-bar[hidden] { display: none; }
.dr-review-count { font-weight: 500; color: var(--dr-n9); }
.dr-review-btns { display: flex; gap: var(--dr-s1); }
.dr-review-btn {
  border: none;
  background: none;
  font: 12px/1 var(--dr-ui);
  color: var(--dr-n7);
  padding: var(--dr-s1) var(--dr-s2);
  border-radius: 2px;
  cursor: pointer;
}
.dr-review-btn:hover { color: var(--dr-n9); background: var(--dr-n2); }
.dr-review-accept:hover { color: var(--dr-accent); }
.dr-review-keys { color: var(--dr-n5); }

/* The panel. */
.dr-card-sidecar { min-width: 360px; max-width: 460px; }
.dr-sidecar-status { margin-top: 0; margin-bottom: var(--dr-s3); color: var(--dr-n7); }
.dr-sidecar-nomodel .dr-sidecar-status { color: var(--dr-n8); font-weight: 500; }
.dr-sidecar-actions { display: flex; flex-direction: column; gap: 2px; margin-bottom: var(--dr-s3); }
.dr-sidecar-action {
  border: none;
  background: none;
  text-align: left;
  font: 13px/1.4 var(--dr-ui);
  color: var(--dr-n8);
  padding: var(--dr-s2) var(--dr-s3);
  border-radius: 2px;
  cursor: pointer;
}
.dr-sidecar-action:hover { background: var(--dr-n1); color: var(--dr-n9); }
.dr-sidecar-action.dr-dim { cursor: default; }
.dr-sidecar-action.dr-dim:hover { background: none; color: var(--dr-n8); }
.dr-sidecar-whole { margin-bottom: var(--dr-s3); font-size: 12px; color: var(--dr-n7); }
.dr-sidecar-preview {
  border: 1px solid var(--dr-n2);
  border-radius: 2px;
  padding: var(--dr-s2) var(--dr-s3);
  background: var(--dr-n1);
  margin-bottom: var(--dr-s3);
}
.dr-sidecar-preview[hidden] { display: none; }
.dr-sidecar-preview-scope { font: 500 12px/1.4 var(--dr-ui); color: var(--dr-n9); }
.dr-sidecar-preview-dest { font-size: 12px; color: var(--dr-n6); margin-bottom: var(--dr-s2); }
.dr-sidecar-preview-dest.dr-sidecar-remote { color: var(--dr-error); }
.dr-sidecar-preview-text {
  margin: 0;
  font: 12px/1.5 var(--dr-ui);
  color: var(--dr-n7);
  white-space: pre-wrap;
  max-height: 140px;
  overflow-y: auto;
}
.dr-sidecar-byok { margin-bottom: var(--dr-s3); font-size: 12px; }
.dr-sidecar-byok summary { cursor: pointer; color: var(--dr-n8); font-weight: 500; }
.dr-sidecar-provider, .dr-sidecar-key {
  width: 100%;
  font: 13px/1 var(--dr-ui);
  color: var(--dr-n9);
  background: var(--dr-n0);
  border: 1px solid var(--dr-n3);
  border-radius: 2px;
  padding: var(--dr-s2) var(--dr-s3);
  margin-top: var(--dr-s2);
}
.dr-sidecar-key-save {
  margin-top: var(--dr-s2);
  border: 1px solid var(--dr-n3);
  background: var(--dr-n1);
  font: 12px/1 var(--dr-ui);
  color: var(--dr-n8);
  padding: var(--dr-s2) var(--dr-s3);
  border-radius: 2px;
  cursor: pointer;
}
.dr-sidecar-key-save:hover { background: var(--dr-n2); color: var(--dr-n9); }
.dr-sidecar-keys { margin-top: var(--dr-s2); }
.dr-sidecar-key-row { display: flex; align-items: center; justify-content: space-between; gap: var(--dr-s2); margin-top: var(--dr-s1); color: var(--dr-n7); }
.dr-sidecar-key-remove {
  border: none; background: none; font: 12px/1 var(--dr-ui);
  color: var(--dr-n6); cursor: pointer; text-decoration: underline;
}
.dr-sidecar-key-remove:hover { color: var(--dr-error); }

/* ---- outline sidebar -----------------------------------------------------
   The rail's mirror on the right edge: the document's headings as a quiet
   strip of desk substance that expands on hover/focus (same idiom, same
   tint). Collapsed, each heading is a rule whose indent carries its level;
   expanded, the heading text appears. Absent (not dimmed) when the document
   has no headings — the Batch C rail decision, applied here. `nav` role. */
#outline {
  position: fixed;
  top: var(--dr-status-h);
  right: 0;
  bottom: 0;
  width: var(--dr-outline-w);
  overflow-x: hidden;
  overflow-y: auto;
  background: var(--dr-rail-tint);
  padding: var(--dr-s3) 0;
  display: flex;
  flex-direction: column;
  gap: 2px;
  transition: width var(--dr-ease);
  z-index: 4;
  scrollbar-width: none;
}
#outline[hidden] { display: none; }
#outline:hover, #outline:focus-within { width: var(--dr-outline-w-open); }
@media (prefers-reduced-motion: reduce) { #outline { transition: none; } }

.dr-ol-item {
  display: flex;
  align-items: center;
  gap: var(--dr-s2);
  width: 100%;
  border: none;
  background: none;
  padding: 4px var(--dr-s3) 4px 0;
  cursor: pointer;
  text-align: left;
  color: var(--dr-n6);
  font: 13px/1.3 var(--dr-ui);
  white-space: nowrap;
}
.dr-ol-item:hover { color: var(--dr-n9); }
.dr-ol-item:focus-visible { outline-offset: -2px; }
/* The tick sits in the collapsed strip; its width reads the heading level. */
.dr-ol-tick {
  flex: none;
  height: 2px;
  background: var(--dr-n4);
  margin-left: auto;
  margin-right: var(--dr-s3);
}
.dr-ol-item:hover .dr-ol-tick { background: var(--dr-n6); }
.dr-ol-l1 .dr-ol-tick { width: 18px; }
.dr-ol-l2 .dr-ol-tick { width: 14px; }
.dr-ol-l3 .dr-ol-tick { width: 10px; }

  /* Page-break control — the browser-achievable half of CSS paged media. A
     heading never strands at a page foot; rows, list items, quotes, code and
     images never split; paragraphs keep a 2-line orphan/widow guard. Running
     headers/footers with page numbers and page-bottom footnotes are NOT
     browser-supported via CSS paged media (documented in the README); the
     footnote atoms print inline as superscripts. */
  .ProseMirror h1, .ProseMirror h2, .ProseMirror h3, .ProseMirror h4 { break-after: avoid; }
  .ProseMirror tr, .ProseMirror li, .ProseMirror blockquote, .ProseMirror pre, .ProseMirror img { break-inside: avoid; }
  .ProseMirror p { orphans: 2; widows: 2; }

      object: 'chat.completion',
      model: capabilities.aiModel || 'localmind',
      choices: [{

        message: message,
        finish_reason: finishReason,
      }],

    ready: function () {

// ==== begin engine/sanitize-core.mjs ====
// engine/sanitize-core.mjs — the JSON half of sanitizeToSchema (handoff §4).
// Pure module: imports only the schema SPEC (plain data), never the engine.
// Every ingress — DOCX, Markdown, HTML paste, window.draft — funnels its
// candidate doc JSON through sanitizeDocJSON() before it may become a
// transaction. Unknown nodes map to the nearest fallback and every loss is
// itemised as an Import-notes entry; nothing is dropped silently.


const UNSAFE_URL = /^\s*(javascript|data|vbscript):/i;

// but only image MIME types — never javascript:/vbscript:, and never a
// non-image data: payload (data:text/html etc. is not an image and has no
// business in an img src).
const UNSAFE_IMAGE_URL = /^\s*(javascript|vbscript):/i;
const DATA_URL = /^\s*data:/i;
const DATA_IMAGE_URL = /^\s*data:image\//i;

// Child context per node type, derived from the spec's content expression.
function childContext(type) {
  const spec = nodes[type];
  if (!spec || !spec.content) return null; // leaf
  if (spec.content.includes("inline")) return "inline";
  if (spec.content.includes("text")) return "text"; // code_block: text only, no marks

// Structured containers whose children must be a specific node type: a
// fallback paragraph cannot sit in them directly.
const WRAP_CHILD = {
  bullet_list: "list_item",
  ordered_list: "list_item",
  task_list: "task_item",

const DROP_INVALID_CHILD = new Set(["table", "table_row"]);

function flattenText(node, out = []) {
  if (!node || typeof node !== "object") return out;
  if (typeof node.text === "string") out.push(node.text);
  for (const child of node.content || []) flattenText(child, out);
  return out;

function sanitizeAttrs(type, attrs, notes) {
  const spec = nodes[type] || marks[type];
  const declared = (spec && spec.attrs) || {};
  const out = {};
  let dropped = false;
  for (const [k, v] of Object.entries(attrs || {})) {
    if (k in declared) out[k] = v;
    else {
      dropped = true;
      notes.push({ code: "invalid-attr", message: `${type}: dropped undeclared attribute "${k}"` });
    }

  return { attrs: out, dropped };

function sanitizeMarks(markList, inCode, notes) {
  const out = [];
  const seen = new Set();
  for (const m of markList || []) {
    if (!m || typeof m.type !== "string") continue;
    if (!(m.type in marks)) {
      notes.push({ code: "unknown-mark", message: `dropped unknown mark "${m.type}"` });
      continue;
    }
    if (inCode) {
      notes.push({ code: "marks-stripped", message: `code block admits no marks; dropped "${m.type}"` });
      continue;
    }
    if (seen.has(m.type)) continue;
    if (m.type === "link") {
      const href = m.attrs && m.attrs.href;
      if (typeof href !== "string" || UNSAFE_URL.test(href)) {
        notes.push({ code: "unsafe-link", message: `dropped link with unsafe or missing target ${JSON.stringify(href || "")}` });
        continue;

    const { attrs } = sanitizeAttrs(m.type, m.attrs, notes);
    const clean = { type: m.type };
    if (Object.keys(attrs).length) clean.attrs = attrs;

    seen.add(m.type);

// Sanitize one node in a given context. Returns an ARRAY of replacement
// nodes (usually one; zero when dropped; several when children are lifted).
function sanitizeNode(node, context, parentType, notes) {
  if (!node || typeof node !== "object") return [];

  // Text leaves.
  if (node.type === "text" || (node.type === undefined && typeof node.text === "string")) {
    if (typeof node.text !== "string" || node.text.length === 0) return [];
    if (context === "block") {
      // Inline content in a block context gets wrapped below by the caller.
      const t = { type: "text", text: node.text };
      const m = sanitizeMarks(node.marks, false, notes);
      if (m.length) t.marks = m;
      return [t];
    }
    const t = { type: "text", text: node.text };
    const m = sanitizeMarks(node.marks, context === "text", notes);
    if (m.length) t.marks = m;
    return [t];

  if (typeof node.type !== "string" || !(node.type in nodes)) {
    // Unknown node → nearest fallback, loss itemised.
    const text = flattenText(node).join("");
    const label = typeof node.type === "string" ? node.type : "(untyped)";
    if (context === "inline" || context === "text") {
      notes.push({ code: "unknown-node", message: `unknown inline node "${label}" flattened to text` });
      return text ? [{ type: "text", text }] : [];
    }
    notes.push({ code: "unknown-node", message: `unknown node "${label}" downgraded to paragraph` });

    if (!para.content.length) delete para.content;

  const isInlineType = !!(nodes[type].inline || type === "text");
  if ((context === "inline" || context === "text") && !isInlineType) {
    const text = flattenText(node).join("");
    notes.push({ code: "unknown-node", message: `block node "${type}" inside inline content flattened to text` });

      UNSAFE_IMAGE_URL.test(attrs.src) ||
      (DATA_URL.test(attrs.src) && !DATA_IMAGE_URL.test(attrs.src))

      notes.push({ code: "unsafe-image", message: "dropped image with unsafe or missing src" });
      return [];
    }

  if (type === "task_item") attrs.checked = attrs.checked === true;

  const ctx = childContext(type);
  const content = [];
  for (const child of node.content || []) content.push(...sanitizeNode(child, ctx, type, notes));

  // Structured containers: repair or drop invalid children.
  let fixedContent = content;
  if (WRAP_CHILD[type]) {
    const want = WRAP_CHILD[type];
    fixedContent = content.map((c) => {
      if (c.type === want) return c;
      notes.push({ code: "unknown-node", message: `${type}: wrapped stray "${c.type}" in a ${want}` });
      return { type: want, content: [c.type === "paragraph" ? c : { type: "paragraph", content: [c] }] };
    });
    if (!fixedContent.length) {
      notes.push({ code: "dropped-node", message: `dropped empty ${type}` });
      return [];
    }
  } else if (DROP_INVALID_CHILD.has(type)) {
    const want = type === "table" ? new Set(["table_row"]) : new Set(["table_cell", "table_header"]);
    fixedContent = content.filter((c) => {
      if (want.has(c.type)) return true;
      notes.push({ code: "dropped-node", message: `${type}: dropped invalid child "${c.type}"` });
      return false;
    });
    if (!fixedContent.length) {
      notes.push({ code: "dropped-node", message: `dropped empty ${type}` });
      return [];
    }
  } else if (ctx === "block") {
    // Block containers (blockquote, list_item, cells): inline strays get a
    // paragraph wrapper; ensure at least one block child.
    const blocks = [];
    let inlineRun = [];
    const flush = () => {
      if (inlineRun.length) {
        blocks.push({ type: "paragraph", content: inlineRun });
        inlineRun = [];
      }
    };
    for (const c of fixedContent) {
      const inline = c.type === "text" || (nodes[c.type] && nodes[c.type].inline);
      if (inline) inlineRun.push(c);
      else {
        flush();
        blocks.push(c);
      }
    }
    flush();
    fixedContent = blocks.length ? blocks : [{ type: "paragraph" }];
  }

  const out = { type };
  if (Object.keys(attrs).length) out.attrs = attrs;
  if (fixedContent.length) out.content = fixedContent;
  const marks = sanitizeMarks(node.marks, false, notes);
  if (marks.length && isInlineType) out.marks = marks;
  return [out];
}

      app,
      created: ts,

  while (taken.has(`untitled-${n}`)) n++;
  return `untitled-${n}`;
}

// A document name that no existing document claims, seeding from `desired`
// (falling back to "untitled"). Appends -2, -3… on collision. Used when
// opening a file as a new document so it never clobbers an existing one.
function uniqueDocName(list, desired) {
  const base = cleanDocName(desired) || "untitled";
  const taken = new Set(documentEntries(list).map((d) => d.name));
  if (!taken.has(base)) return base;
  let n = 2;
  while (taken.has(`${base}-${n}`)) n++;
  return `${base}-${n}`;
}

// The document set: root-level `<name>.draft.json`, newest-modified first.
// (The `.md` sibling and the `.assets/` folder are companions, not documents.)
function documentEntries(list) {
  return (list || [])
    .filter((e) => e.path.endsWith(DRAFT_EXT) && !e.path.includes("/"))
    .map((e) => ({ id: e.path.slice(0, -DRAFT_EXT.length), name: e.path.slice(0, -DRAFT_EXT.length), mtime: e.mtime || 0, size: e.size || 0, path: e.path }))
    .sort((a, b) => b.mtime - a.mtime);
}

function documentExists(list, name) {
  return documentEntries(list).some((d) => d.name === name);
}

// Rename a document: move `<old>.draft.json` (rewriting its asset refs),
// `<old>.md`, and every `<old>.assets/*` to the new name. One document, a new
// filename — the re-pin the rename UI performs. Throws on a name collision or
// a missing source (never silently overwrites another document).
async function renameDocument(store, oldName, newName) {
  const from = cleanDocName(oldName);
  const to = cleanDocName(newName);
  if (!to) throw new StorageError("cannot rename to an empty filename", "bad-name");
  if (from === to) return { moved: [] };

  const list = await store.list();
  if (!documentExists(list, from)) throw new StorageError(`no document named "${from}"`, "not-found");
  if (documentExists(list, to)) throw new StorageError(`a document named "${to}" already exists`, "name-taken");

  const enc = new TextEncoder();
  const dec = new TextDecoder();
  const moved = [];

  // The truth file: rewrite asset refs from `<old>.assets/` to `<new>.assets/`.
  const draftBytes = await store.read(`${from}${DRAFT_EXT}`);
  if (draftBytes) {
    const env = JSON.parse(dec.decode(draftBytes));
    for (const key of Object.keys(env.assets || {})) {
      const a = env.assets[key];
      if (a && typeof a.ref === "string" && a.ref.startsWith(`${from}.assets/`))
        a.ref = `${to}.assets/${a.ref.slice(`${from}.assets/`.length)}`;
    }
    await store.write(`${to}${DRAFT_EXT}`, enc.encode(JSON.stringify(env, null, 1)), { mime: "application/json" });
    await store.remove(`${from}${DRAFT_EXT}`);
    moved.push(`${from}${DRAFT_EXT}`);
  }

  // The readable sibling.
  const mdBytes = await store.read(`${from}.md`);
  if (mdBytes) {
    await store.write(`${to}.md`, mdBytes, { mime: "text/markdown" });
    await store.remove(`${from}.md`);
    moved.push(`${from}.md`);
  }

  // The asset folder, entry by entry.
  for (const e of list) {
    if (!e.path.startsWith(`${from}.assets/`)) continue;
    const bytes = await store.read(e.path);
    if (bytes) await store.write(`${to}.assets/${e.path.slice(`${from}.assets/`.length)}`, bytes);
    await store.remove(e.path);
    moved.push(e.path);
  }

  return { moved, name: to };
}

// ==== begin storage/autosave.mjs ====
// storage/autosave.mjs — autosave per handoff §5, over the storage façade.
//
// - 500ms debounce from the last change.
// - Write-lock: while a save is in flight no second save starts; changes
//   arriving mid-save mark the saver dirty and reschedule after the save.
// - One save writes BOTH `<name>.draft.json` (truth) and the `<name>.md`
//   sibling; the façade mirrors every write into IndexedDB.
// - The filename is pinned on the first save. The document title is
//   metadata inside the envelope and NEVER re-derives the filename.
// - Assets: written beside the file in `<name>.assets/` with refs + sha256
//   hashes in the envelope; on the IndexedDB backend blobs inline into the
//   envelope instead (handoff §4).
//
// Pure module: no DOM, no engine imports. Timers and now() injectable so the
// debounce and write-lock are node-testable.


const EXT_BY_MIME = { "image/png": "png", "image/jpeg": "jpg", "image/gif": "gif", "image/webp": "webp", "image/svg+xml": "svg" };

async function sha256Hex(bytes) {
  const digest = await globalThis.crypto.subtle.digest("SHA-256", bytes);
  return [...new Uint8Array(digest)].map((b) => b.toString(16).padStart(2, "0")).join("");
}

function bytesToBase64(bytes) {
  if (typeof Buffer !== "undefined") return Buffer.from(bytes).toString("base64");
  let bin = "";
  for (let i = 0; i < bytes.length; i += 0x8000) bin += String.fromCharCode(...bytes.subarray(i, i + 0x8000));
  return btoa(bin);
}

const encoder = new TextEncoder();

function createAutosaver({
  store,
  snapshot, // () => { file, markdown, assets? } — file: v1 envelope (JSON), markdown: string, assets: { ref: { bytes, mime } }
  debounceMs = 500,
  timers = { setTimeout: (...a) => globalThis.setTimeout(...a), clearTimeout: (...a) => globalThis.clearTimeout(...a) },
  now = () => new Date().toISOString(),
  onSaved = null,
  onError = null,
} = {}) {
  if (!store || !snapshot) throw new StorageError("autosaver needs a store and a snapshot function", "config");

  let name = null;
  let timer = null;
  let saving = false;
  let dirty = false;
  let saveCount = 0;
  let lastError = null;

  function pinName(candidate) {
    if (name !== null) throw new StorageError(`filename already pinned to "${name}"; the title never re-derives it`, "pinned");
    const clean = String(candidate || "").trim().replace(/[/\\]/g, "-");
    if (!clean) throw new StorageError("cannot pin an empty filename", "bad-name");
    name = clean;
    return name;
  }

  async function writeAssets(pinned, assets, envelope) {
    const table = {};
    for (const [key, a] of Object.entries(assets || {})) {
      const hash = await sha256Hex(a.bytes);
      const entry = { mime: a.mime || "application/octet-stream", sha256: hash };
      if (store.backend === "idb") {
        // No real folder beside the file — inline the blob (handoff §4).
        entry.data = bytesToBase64(a.bytes);
      } else {
        const ext = EXT_BY_MIME[a.mime] || "bin";
        const ref = `${pinned}.assets/${key}.${ext}`;
        await store.write(ref, a.bytes, { mime: a.mime });
        entry.ref = ref;
      }
      table[key] = entry;
    }
    envelope.assets = table;
  }

  async function saveNow() {
    const snap = snapshot();
    if (name === null) pinName((snap.file && snap.file.draft && snap.file.draft.title) || "untitled");
    const envelope = JSON.parse(JSON.stringify(snap.file));
    envelope.draft.modified = now();
    await writeAssets(name, snap.assets, envelope);
    // Both faces of the document in the SAME save: truth + readable sibling.
    await store.write(`${name}.draft.json`, encoder.encode(JSON.stringify(envelope, null, 1)), { mime: "application/json" });
    await store.write(`${name}.md`, encoder.encode(snap.markdown), { mime: "text/markdown" });
    saveCount++;
    return { name, saveCount, backend: store.backend };
  }

  async function runSave() {
    if (saving) {
      dirty = true;
      return null;
    }
    saving = true;
    dirty = false;
    let result = null;
    try {
      result = await saveNow();
      if (onSaved) onSaved(result);
    } catch (e) {
      lastError = e;
      if (onError) onError(e);
      else throw e;
    } finally {
      saving = false;
      if (dirty) schedule();
    }
    return result;
  }

  function schedule() {
    if (timer !== null) timers.clearTimeout(timer);
    timer = timers.setTimeout(() => {
      timer = null;
      void runSave();
    }, debounceMs);
  }

  return {
    // Debounced entry point: call on every change.
    touch() {
      if (saving) {
        dirty = true;
        return;
      }
      schedule();
    },
    // Force a save now (awaits the write-lock).
    async flush() {
      if (timer !== null) {
        timers.clearTimeout(timer);
        timer = null;
      }
      while (saving) await new Promise((r) => timers.setTimeout(r, 10));
      return runSave();
    },
    pinName,
    get name() {
      return name;
    },
    get saving() {
      return saving;
    },
    get pending() {
      return timer !== null || dirty;
    },
    get saveCount() {
      return saveCount;
    },
    get lastError() {
      return lastError;
    },
  };
}

// Open a document through the façade: read, migrate (never writing back),
// and hand the caller the envelope + notes. Import here would be circular in
// spirit (engine/draft-file is pure data); the caller passes migrate in.
async function openDocument({ store, path, migrate }) {
  const bytes = await store.read(path);
  if (!bytes) return null;
  const raw = JSON.parse(new TextDecoder().decode(bytes));
  return migrate(raw); // { file, fromV, migrated, notes } — in memory only
}

// ==== begin engine/find.mjs ====
// engine/find.mjs — find/replace matching logic (Batch D). Pure module:
// no engine imports, no DOM — node-testable. The adapter walks the document
// and hands each textblock here as { text, posMap } where posMap[i] is the
// ProseMirror position of character i (inline atoms — footnotes, images,
// hard breaks — occupy positions but contribute no characters, so the map
// is explicit, never an offset guess).

// Compile the query. Plain mode escapes regex metacharacters; regex mode
// compiles the user's pattern. Returns { re } or { error } — an invalid
// user regex is a reported state, never a throw into the caller.
function compileQuery(query, { regex = false, caseSensitive = false } = {}) {
  if (typeof query !== "string" || query.length === 0) return { re: null };
  const source = regex ? query : query.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
  const flags = caseSensitive ? "g" : "gi";
  try {
    return { re: new RegExp(source, flags) };
  } catch (e) {
    return { error: e.message };
  }
}

// Match ranges within one textblock. `re` must be a global regex from
// compileQuery. Zero-length matches are skipped (a regex like `a*` must
// never loop or select nothing).
function matchRanges(text, posMap, re) {
  const out = [];
  if (!re || !text) return out;
  re.lastIndex = 0;
  let m;
  while ((m = re.exec(text))) {
    if (m[0].length === 0) {
      re.lastIndex++;
      continue;
    }
    const start = m.index;
    const end = m.index + m[0].length - 1;
    out.push({ from: posMap[start], to: posMap[end] + 1, groups: m.slice(0), index: start });
  }
  return out;
}

// The replacement text for one match. In plain mode the replacement is
// literal. In regex mode $1..$9 insert capture groups, $& the whole match,
// $$ a literal dollar; an out-of-range group inserts the empty string.
function buildReplacement(replaceWith, match, { regex = false } = {}) {
  const s = String(replaceWith ?? "");
  if (!regex) return s;
  let out = "";
  for (let i = 0; i < s.length; i++) {
    const c = s[i];
    if (c !== "$" || i === s.length - 1) {
      out += c;
      continue;
    }
    const n = s[i + 1];
    if (n === "$") {
      out += "$";
      i++;
    } else if (n === "&") {
      out += match.groups[0];
      i++;
    } else if (n >= "1" && n <= "9") {
      out += match.groups[Number(n)] ?? "";
      i++;
    } else {
      out += c;
    }
  }
  return out;
}

// ==== begin engine/diff.mjs ====
// engine/diff.mjs — a pure, engine-free token diff for the sidecar's staged
// review (Batch H). It turns an old string and a proposed new string into an
// ordered list of HUNKS — maximal runs of change bounded by unchanged text —
// each carrying its char offset in the OLD text so the staging layer can paint
// deletions and insertions at real document positions. Nothing here touches
// ProseMirror or the DOM; it is unit-tested in isolation (no model required).

// Word-and-whitespace tokens: a run of non-space, or a run of space. Diffing
// on tokens (not characters) keeps hunks legible — a changed word is one hunk,
// not a scatter of single-letter edits.
function tokenize(s) {
  return s.match(/\s+|[^\s]+/g) || [];
}

// Longest-common-subsequence over two token arrays → a flat op list of
// {op:"equal"|"delete"|"insert", text}. O(n·m) DP; paragraph-sized inputs only
// (the sidecar slice is one selection / paragraph, never the whole doc).
function tokenOps(aTok, bTok) {
  const n = aTok.length;
  const m = bTok.length;
  const dp = Array.from({ length: n + 1 }, () => new Int32Array(m + 1));
  for (let i = n - 1; i >= 0; i--)
    for (let j = m - 1; j >= 0; j--)
      dp[i][j] = aTok[i] === bTok[j] ? dp[i + 1][j + 1] + 1 : Math.max(dp[i + 1][j], dp[i][j + 1]);
  const ops = [];
  let i = 0;
  let j = 0;
  while (i < n && j < m) {
    if (aTok[i] === bTok[j]) {
      ops.push({ op: "equal", text: aTok[i] });
      i++;
      j++;
    } else if (dp[i + 1][j] >= dp[i][j + 1]) {
      ops.push({ op: "delete", text: aTok[i] });
      i++;
    } else {
      ops.push({ op: "insert", text: bTok[j] });
      j++;
    }
  }
  while (i < n) ops.push({ op: "delete", text: aTok[i++] });
  while (j < m) ops.push({ op: "insert", text: bTok[j++] });
  return ops;
}

// Coalesce the op list into hunks. Each hunk is a maximal run of delete/insert
// ops bounded by equal text; `fromOffset` is the char index in `oldText` where
// the deleted span begins (== where a pure insertion anchors). Equal runs are
// not hunks. Result hunks are ordered and non-overlapping over the old text.
function diffHunks(oldText, newText) {
  const ops = tokenOps(tokenize(oldText), tokenize(newText));
  const hunks = [];
  let oldPos = 0;
  let cur = null;
  for (const o of ops) {
    if (o.op === "equal") {
      if (cur) {
        hunks.push(cur);
        cur = null;
      }
      oldPos += o.text.length;
      continue;
    }
    if (!cur) cur = { fromOffset: oldPos, delText: "", insText: "" };
    if (o.op === "delete") {
      cur.delText += o.text;
      oldPos += o.text.length;
    } else {
      cur.insText += o.text;
    }
  }
  if (cur) hunks.push(cur);
  return hunks.map((h, i) => ({
    index: i,
    fromOffset: h.fromOffset,
    delText: h.delText,
    insText: h.insText,
    // "insert" (nothing deleted), "delete" (nothing added), or "replace".
    kind: h.delText && h.insText ? "replace" : h.delText ? "delete" : "insert",
  }));
}

// Compose the final text from the old text and a decided hunk set. Accepted
// hunks apply their proposal (insText replaces delText); rejected hunks keep
// the original (delText). Pure — the single source of truth for what a commit
// writes, so accept/reject logic is unit-tested without touching the editor.
function composeFromDecisions(oldText, hunks) {
  const sorted = [...hunks].sort((a, b) => a.fromOffset - b.fromOffset);
  let out = "";
  let cursor = 0;
  for (const h of sorted) {
    out += oldText.slice(cursor, h.fromOffset);
    out += h.decision === "rejected" ? h.delText : h.insText;
    cursor = h.fromOffset + h.delText.length;
  }
  out += oldText.slice(cursor);
  return out;
}

//   sanitizeToSchema(docJSON, { kind: "json" })
// ---------------------------------------------------------------------------
function sanitizeToSchema(input, { kind = "html" } = {}) {

// HTML string → raw doc JSON (schema parse only; sanitizeToSchema finishes
// the job). Strips active payloads and comments, and rebuilds Word's

function htmlToDocJSON(html) {
  const parsed = new window.DOMParser().parseFromString(html, "text/html");
  for (const el of parsed.querySelectorAll("script, style, link, meta, title, iframe, object, embed, form, input, button")) {
    el.remove();

  const walker = parsed.createTreeWalker(parsed.body, NodeFilter.SHOW_COMMENT);

  while (walker.nextNode()) comments.push(walker.currentNode);
  for (const c of comments) c.remove();

  return PMDOMParser.fromSchema(schema).parse(parsed.body).toJSON();
}

  return PMNode.fromJSON(schema, sanitizeToSchema(html, { kind: "html" }).doc);

// ---------------------------------------------------------------------------
// Markdown (G5) — serializer + parser over v1 names.
// v1 markdown surface: headings, paragraphs, blockquote, code fence, bullet /

const mdSerializer = new MarkdownSerializer(
  {
    paragraph(state, node) {
      state.renderInline(node);
      state.closeBlock(node);

    heading(state, node) {
      state.write("#".repeat(node.attrs.level) + " ");
      state.renderInline(node);
      state.closeBlock(node);
    },
    blockquote(state, node) {
      state.wrapBlock("> ", null, node, () => state.renderContent(node));
    },
    code_block(state, node) {
      state.write("```\n");
      state.text(node.textContent, false);
      state.ensureNewLine();
      state.write("```");
      state.closeBlock(node);

    bullet_list(state, node) {
      state.renderList(node, "  ", () => "- ");

    ordered_list(state, node) {

        const n = String(start + i);

    list_item(state, node) {
      state.renderContent(node);
    },
    task_list(state, node) {
      state.renderList(node, "  ", () => "- ");

    task_item(state, node) {
      state.write(node.attrs.checked ? "[x] " : "[ ] ");

    },
    horizontal_rule(state, node) {

      state.closeBlock(node);

    image(state, node) {

    footnote(state, node) {

      state.write("[^");

      state.write("]");

    hard_break(state, node, parent, index) {

    table(state, node) {

    text(state, node) {

    italic: { open: "*", close: "*", mixable: true, expelEnclosingWhitespace: true },
    strike: { open: "~~", close: "~~", mixable: true, expelEnclosingWhitespace: true },

  for (let i = 0; i < len; i++) result += "`";
  if (len > 0 && side < 0) result += " ";
  return result;
}
