const mdParser = new MarkdownParser(schema, md, {
  blockquote: { block: "blockquote" },
  paragraph: { block: "paragraph" },
  list_item: { block: "list_item" },
  bullet_list: { block: "bullet_list" },
  ordered_list: {
    block: "ordered_list",
    getAttrs: (tok) => ({ order: Number(tok.attrGet("start")) || 1 }),
  },
  heading: {
    block: "heading",
    getAttrs: (tok) => ({ level: Math.min(4, Number(tok.tag.slice(1))) }),
  },
  code_block: { block: "code_block", noCloseToken: true },
  fence: { block: "code_block", noCloseToken: true },
  hr: { node: "horizontal_rule" },
  image: {
    node: "image",
    getAttrs: (tok) => ({
      src: tok.attrGet("src"),
      title: tok.attrGet("title") || null,
      alt: (tok.children[0] && tok.children[0].content) || "",
    }),
  },
  hardbreak: { node: "hard_break" },
  em: { mark: "italic" },
  strong: { mark: "bold" },
  s: { mark: "strike" },
  link: {
    mark: "link",
    getAttrs: (tok) => ({ href: tok.attrGet("href"), title: tok.attrGet("title") || null }),
  },
  code_inline: { mark: "code", noCloseToken: true },
});

// Convention: the .md sibling is a POSIX text file — exactly one trailing \n.
function withFinalNewline(s) {
  return s.endsWith("\n") ? s : s + "\n";
}

function serializeMarkdown(docJSON) {
  return withFinalNewline(mdSerializer.serialize(PMNode.fromJSON(schema, docJSON)));
}

function parseMarkdown(text) {
  // Markdown is an ingress: it passes the same sanitizer as HTML and the API
  // (fixes the M0 gap where javascript: hrefs survived the markdown path).
  return sanitizeToSchema(text, { kind: "markdown" }).doc;
}

// HTML export (Batch E): the schema's own DOM serialization wrapped in a
// minimal, self-contained document. The DOMSerializer is the engine's — this
// is the one place outside the view that renders schema nodes to DOM, so it
// stays here (L5), and io/export.mjs delegates to it rather than importing the
// engine itself.
const htmlSerializer = DOMSerializer.fromSchema(schema);
function serializeHTMLJSON(docJSON) {
  const doc = PMNode.fromJSON(schema, docJSON);
  const frag = htmlSerializer.serializeFragment(doc.content);
  const holder = document.createElement("div");
  holder.appendChild(frag);
  return `<!doctype html>\n<html>\n<head>\n<meta charset="utf-8">\n</head>\n<body>\n${holder.innerHTML}\n</body>\n</html>\n`;
}

// ---------------------------------------------------------------------------
// Word count — Intl.Segmenter, word-like segments (G8).
// ---------------------------------------------------------------------------
function wordCount(doc) {
  const seg = new Intl.Segmenter(undefined, { granularity: "word" });
  let count = 0;
  doc.descendants((node) => {
    if (node.isText) {
      for (const s of seg.segment(node.text)) if (s.isWordLike) count++;
    }
    return true;
  });
  return count;
}

// ---------------------------------------------------------------------------
// List commands (Batch C). prosemirror-schema-list is not in the pinned
// dependency table (§3), so the three commands Draft needs are implemented
// here against the pinned transform primitives — algorithms adapted from
// prosemirror-schema-list (MIT, same authors as the pinned family).
// ---------------------------------------------------------------------------
function doWrapInList(tr, range, wrappers, joinBefore, listType) {
  let content = Fragment.empty;
  for (let i = wrappers.length - 1; i >= 0; i--)
    content = Fragment.from(wrappers[i].type.create(wrappers[i].attrs, content));
  tr.step(
    new ReplaceAroundStep(
      range.start - (joinBefore ? 2 : 0),
      range.end,
      range.start,
      range.end,
      new Slice(content, 0, 0),
      wrappers.length,
      true
    )
  );
  let found = 0;
  for (let i = 0; i < wrappers.length; i++) if (wrappers[i].type === listType) found = i + 1;
  const splitDepth = wrappers.length - found;
  let splitPos = range.start + wrappers.length - (joinBefore ? 2 : 0);
  const parent = range.parent;
  for (let i = range.startIndex, e = range.endIndex, first = true; i < e; i++, first = false) {
    if (!first && canSplit(tr.doc, splitPos, splitDepth)) {
      tr.split(splitPos, splitDepth);
      splitPos += 2 * splitDepth;
    }
    splitPos += parent.child(i).nodeSize;
  }
  return tr;
}

function wrapInList(listType, attrs = null) {
  return function (state, dispatch) {
    const { $from, $to } = state.selection;
    let range = $from.blockRange($to);
    let doJoin = false;
    let outerRange = range;
    if (!range) return false;
    if (
      range.depth >= 2 &&
      $from.node(range.depth - 1).type.compatibleContent(listType) &&
      range.startIndex === 0
    ) {
      if ($from.index(range.depth - 1) === 0) return false;
      const $insert = state.doc.resolve(range.start - 2);
      outerRange = new NodeRange($insert, $insert, range.depth);
      if (range.endIndex < range.parent.childCount)
        range = new NodeRange($from, state.doc.resolve($to.end(range.depth)), range.depth);
      doJoin = true;
    }
    const wrap = findWrapping(outerRange, listType, attrs, range);
    if (!wrap) return false;
    if (dispatch) dispatch(doWrapInList(state.tr, range, wrap, doJoin, listType).scrollIntoView());
    return true;
  };
}

function liftToOuterList(state, dispatch, itemType, range) {
  const tr = state.tr;
  const end = range.end;
  const endOfList = range.$to.end(range.depth);
  if (end < endOfList) {
    tr.step(
      new ReplaceAroundStep(
        end - 1,
        endOfList,
        end,
        endOfList,
        new Slice(Fragment.from(itemType.create(null, range.parent.copy())), 1, 0),
        1,
        true
      )
    );
    range = new NodeRange(tr.doc.resolve(range.$from.pos), tr.doc.resolve(endOfList), range.depth);
  }
  const target = liftTarget(range);
  if (target == null) return false;
  tr.lift(range, target);
  const after = tr.mapping.map(end, -1) - 1;
  if (canJoin(tr.doc, after)) tr.join(after);
  dispatch(tr.scrollIntoView());
  return true;
}

function liftOutOfList(state, dispatch, range) {
  const tr = state.tr;
  const list = range.parent;
  for (let pos = range.end, i = range.endIndex - 1, e = range.startIndex; i > e; i--) {
    pos -= list.child(i).nodeSize;
    tr.delete(pos - 1, pos + 1);
  }
  const $start = tr.doc.resolve(range.start);
  const item = $start.nodeAfter;
  if (tr.mapping.map(range.end) !== range.start + $start.nodeAfter.nodeSize) return false;
  const atStart = range.startIndex === 0;
  const atEnd = range.endIndex === list.childCount;
  const parent = $start.node(-1);
  const indexBefore = $start.index(-1);
  if (
    !parent.canReplace(
      indexBefore + (atStart ? 0 : 1),
      indexBefore + 1,
      item.content.append(atEnd ? Fragment.empty : Fragment.from(list))
    )
  )
    return false;
  const start = $start.pos;
  const end = start + item.nodeSize;
  tr.step(
    new ReplaceAroundStep(
      start - (atStart ? 1 : 0),
      end + (atEnd ? 1 : 0),
      start + 1,
      end - 1,
      new Slice(
        (atStart ? Fragment.empty : Fragment.from(list.copy(Fragment.empty))).append(
          atEnd ? Fragment.empty : Fragment.from(list.copy(Fragment.empty))
        ),
        atStart ? 0 : 1,
        atEnd ? 0 : 1
      ),
      atStart ? 0 : 1
    )
  );
  dispatch(tr.scrollIntoView());
  return true;
}

function liftListItem(itemType) {
  return function (state, dispatch) {
    const { $from, $to } = state.selection;
    const range = $from.blockRange($to, (node) => node.childCount > 0 && node.firstChild.type === itemType);
    if (!range) return false;
    if (!dispatch) return true;
    if ($from.node(range.depth - 1).type === itemType) return liftToOuterList(state, dispatch, itemType, range);
    return liftOutOfList(state, dispatch, range);
  };
}

function sinkListItem(itemType) {
  return function (state, dispatch) {
    const { $from, $to } = state.selection;
    const range = $from.blockRange($to, (node) => node.childCount > 0 && node.firstChild.type === itemType);
    if (!range) return false;
    const startIndex = range.startIndex;
    if (startIndex === 0) return false;
    const parent = range.parent;
    const nodeBefore = parent.child(startIndex - 1);
    if (nodeBefore.type !== itemType) return false;
    if (dispatch) {
      const nestedBefore = nodeBefore.lastChild && nodeBefore.lastChild.type === parent.type;
      const inner = Fragment.from(nestedBefore ? itemType.create() : null);
      const slice = new Slice(
        Fragment.from(itemType.create(null, Fragment.from(parent.type.create(null, inner)))),
        nestedBefore ? 3 : 1,
        0
      );
      const before = range.start;
      const after = range.end;
      dispatch(
        state.tr
          .step(new ReplaceAroundStep(before - (nestedBefore ? 3 : 1), after, before, after, slice, 1, true))
          .scrollIntoView()
      );
    }
    return true;
  };
}

// Enter inside a list item splits the ITEM (not the paragraph) — algorithm
// adapted from prosemirror-schema-list's splitListItem (MIT), see above.
function splitListItem(itemType) {
  return function (state, dispatch) {
    const { $from, $to, node } = state.selection;
    if ((node && node.isBlock) || $from.depth < 2 || !$from.sameParent($to)) return false;
    const grandParent = $from.node(-1);
    if (grandParent.type !== itemType) return false;
    if ($from.parent.content.size === 0 && $from.node(-1).childCount === $from.indexAfter(-1)) {
      // In an empty block: split the wrapping item of a nested list, else
      // let the next command (lift) handle it.
      if ($from.depth === 2 || $from.node(-3).type !== itemType || $from.index(-2) !== $from.node(-2).childCount - 1)
        return false;
      if (dispatch) {
        let wrap = Fragment.empty;
        const depthBefore = $from.index(-1) ? 1 : $from.index(-2) ? 2 : 3;
        for (let d = $from.depth - depthBefore; d >= $from.depth - 3; d--) wrap = Fragment.from($from.node(d).copy(wrap));
        const depthAfter =
          $from.indexAfter(-1) < $from.node(-2).childCount ? 1 : $from.indexAfter(-2) < $from.node(-3).childCount ? 2 : 3;
        wrap = wrap.append(Fragment.from(itemType.createAndFill()));
        const start = $from.before($from.depth - (depthBefore - 1));
        const tr = state.tr.replace(start, $from.after(-depthAfter), new Slice(wrap, 4 - depthBefore, 0));
        let sel = -1;
        tr.doc.nodesBetween(start, tr.doc.content.size, (n, pos) => {
          if (sel > -1) return false;
          if (n.isTextblock && n.content.size === 0) sel = pos + 1;
        });
        if (sel > -1) tr.setSelection(Selection.near(tr.doc.resolve(sel)));
        dispatch(tr.scrollIntoView());
      }
      return true;
    }
    const nextType = $to.pos === $from.end() ? grandParent.contentMatchAt(0).defaultType : null;
    const tr = state.tr.delete($from.pos, $to.pos);
    // A split task item starts its life unchecked — checking off one item
    // must never pre-check the next (forward-pass fix, Batch D).
    const itemAfter = itemType.name === "task_item" ? { type: itemType, attrs: { checked: false } } : null;
    const types = nextType ? [itemAfter, { type: nextType }] : itemAfter ? [itemAfter] : undefined;
    if (!canSplit(tr.doc, $from.pos, 2, types)) return false;
    if (dispatch) dispatch(tr.split($from.pos, 2, types).scrollIntoView());
    return true;
  };
}

// The textblock a block command should read/toggle: the selection head's
// parent when it is one, else the first textblock under the selection (an
// all-selection resolves at the doc node, never a textblock).
function refTextblock(state) {
  const { $from, from, to } = state.selection;
  if ($from.parent.isTextblock) return $from.parent;
  let found = null;
  state.doc.nodesBetween(from, to, (node) => {
    if (found) return false;
    if (node.isTextblock) {
      found = node;
      return false;
    }
    return true;
  });
  return found;
}

// Nearest bullet/ordered list ancestor of the selection head, or null.
function listAncestor($from) {
  for (let d = $from.depth; d > 0; d--) {
    const node = $from.node(d);
    if (node.type === schema.nodes.bullet_list || node.type === schema.nodes.ordered_list)
      return { node, depth: d, pos: $from.before(d) };
  }
  return null;
}

// Toggle a list type: in the same list → lift out; in the other list type →
// retype in place (list_item serves both); otherwise wrap.
function toggleList(listType) {
  const attrs = listType === schema.nodes.ordered_list ? { order: 1 } : null;
  return (state, dispatch) => {
    const anc = listAncestor(state.selection.$from);
    if (anc) {
      if (anc.node.type === listType) return liftListItem(schema.nodes.list_item)(state, dispatch);
      if (dispatch) dispatch(state.tr.setNodeMarkup(anc.pos, listType, attrs).scrollIntoView());
      return true;
    }
    return wrapInList(listType, attrs)(state, dispatch);
  };
}

// Heading toggle: same level → back to paragraph; else set the level.
function toggleHeading(level) {
  return (state, dispatch) => {
    const block = refTextblock(state);
    if (block && block.type === schema.nodes.heading && block.attrs.level === level)
      return setBlockType(schema.nodes.paragraph)(state, dispatch);
    return setBlockType(schema.nodes.heading, { level })(state, dispatch);
  };
}

// The extent of the link mark around a position (for editing a link with an
// empty selection): the contiguous run of siblings carrying the same href.
function linkRangeAt($pos) {
  const link = schema.marks.link;
  const active = link.isInSet($pos.marks()) || ($pos.nodeAfter && link.isInSet($pos.nodeAfter.marks));
  if (!active) return null;
  const parent = $pos.parent;
  const base = $pos.pos - $pos.parentOffset;
  let offset = 0;
  let runStart = null;
  for (let i = 0; i < parent.childCount; i++) {
    const child = parent.child(i);
    const has = link.isInSet(child.marks);
    const same = has && has.attrs.href === active.attrs.href;
    if (same && runStart === null) runStart = offset;
    if (!same && runStart !== null) {
      if (runStart <= $pos.parentOffset && $pos.parentOffset <= offset)
        return { from: base + runStart, to: base + offset, attrs: active.attrs };
      runStart = null;
    }
    offset += child.nodeSize;
  }
  if (runStart !== null && runStart <= $pos.parentOffset && $pos.parentOffset <= offset)
    return { from: base + runStart, to: base + offset, attrs: active.attrs };
  return null;
}

// ---------------------------------------------------------------------------
// Markdown-as-you-type mark rules (Batch D). Typing the closing delimiter of
// **bold**, __bold__, *italic*, _italic_, `code` or ~~strike~~ applies the
// mark and removes the delimiters. Slash-free (V&R §5).
// ---------------------------------------------------------------------------
function markInputRule(regexp, markType) {
  return new InputRule(regexp, (state, match, start, end) => {
    const content = match[1];
    if (!content) return null;
    const openLen = match[0].indexOf(content);
    if (openLen < 0) return null;
    const textStart = start + openLen;
    const textEnd = textStart + content.length;
    let tr = state.tr;
    if (textEnd < end) tr = tr.delete(textEnd, end);
    if (textStart > start) tr = tr.delete(start, textStart);
    tr = tr.addMark(start, start + content.length, markType.create());
    tr = tr.removeStoredMark(markType);
    return tr;
  });
}

// ---------------------------------------------------------------------------
// Tables (Batch D): insert command over the schema; row/col/header/delete
// come from the pinned prosemirror-tables. No cell merge at v1.
// ---------------------------------------------------------------------------
function insertTable({ rows = 3, cols = 3, header = true } = {}) {
  return (state, dispatch) => {
    const { table, table_row, table_cell, table_header } = schema.nodes;
    const rowNodes = [];
    for (let r = 0; r < rows; r++) {
      const cellType = header && r === 0 ? table_header : table_cell;
      const cells = [];
      for (let c = 0; c < cols; c++) cells.push(cellType.createAndFill());
      rowNodes.push(table_row.create(null, cells));
    }
    const node = table.create(null, rowNodes);
    const from = state.selection.from;
    if (dispatch) {
      let tr = state.tr.replaceSelectionWith(node);
      // Land the caret in the table's first cell.
      const target = Math.min(from + 3, tr.doc.content.size);
      tr = tr.setSelection(TextSelection.near(tr.doc.resolve(target))).scrollIntoView();
      dispatch(tr);
    }
    return true;
  };
}

// ---------------------------------------------------------------------------
// Footnotes (Batch D). The footnote node is an inline atom; its text is
// edited through the in-app footnote card (never raw contenteditable, L8).
// ---------------------------------------------------------------------------
function footnoteSelection(state) {
  const sel = state.selection;
  if (sel instanceof NodeSelection && sel.node.type === schema.nodes.footnote)
    return { pos: sel.from, node: sel.node };
  return null;
}

// ---------------------------------------------------------------------------
// Find/replace (Batch D). Match logic is pure (engine/find.mjs); this plugin
// holds the query + matches and paints the highlights as decorations. All
// replacements dispatch through the sole write path.
// ---------------------------------------------------------------------------
const findKey = new PluginKey("dr-find");

const EMPTY_FIND = { query: "", regex: false, caseSensitive: false, matches: [], active: -1, error: null };

// Every textblock as { text, posMap }: posMap[i] is the document position of
// character i (inline atoms occupy positions but contribute no characters).
function textblockSegments(doc) {
  const segs = [];
  doc.descendants((node, pos) => {
    if (!node.isTextblock) return true;
    let text = "";
    const posMap = [];
    node.forEach((child, offset) => {
      if (!child.isText) return;
      const base = pos + 1 + offset;
      for (let i = 0; i < child.text.length; i++) {
        text += child.text[i];
        posMap.push(base + i);
      }
    });
    segs.push({ text, posMap });
    return false;
  });
  return segs;
}

function computeFind(doc, { query, regex, caseSensitive, active = 0 }) {
  const { re, error } = compileQuery(query, { regex, caseSensitive });
  if (error) return { query, regex, caseSensitive, matches: [], active: -1, error };
  const matches = [];
  if (re) for (const seg of textblockSegments(doc)) matches.push(...matchRanges(seg.text, seg.posMap, re));
  const clamped = matches.length ? Math.min(Math.max(active, 0), matches.length - 1) : -1;
  return { query, regex, caseSensitive, matches, active: clamped, error: null };
}

function findPlugin() {
  return new Plugin({
    key: findKey,
    state: {
      init: () => EMPTY_FIND,
      apply(tr, prev, _old, newState) {
        const meta = tr.getMeta(findKey);
        if (meta) return meta;
        if (!tr.docChanged || !prev.query) return prev;
        return computeFind(newState.doc, prev);
      },
    },
    props: {
      decorations(state) {
        const s = findKey.getState(state);
        if (!s || !s.matches.length) return null;
        return DecorationSet.create(
          state.doc,
          s.matches.map((m, i) =>
            Decoration.inline(m.from, m.to, { class: i === s.active ? "dr-find-match dr-find-active" : "dr-find-match" })
          )
        );
      },
    },
  });
}

// ---------------------------------------------------------------------------
// Sidecar staging (Batch H). A proposal is shown as a STAGED DIFF over the
// live document WITHOUT committing anything (handoff L6/§7): deletions inline
// and dim-struck, insertions as accent-tinted widgets, the current hunk
// highlighted. The document is untouched during review — the plugin state
// holds the hunks and their per-hunk decisions; only an explicit accept
// composes the result and writes it through the sole path (L4), attributed to
// the Owner. Esc discards with no doc change. Nothing here calls a model.
// ---------------------------------------------------------------------------
const stagingKey = new PluginKey("dr-stage");

function stagingDecorations(state) {
  const s = stagingKey.getState(state);
  if (!s || !s.active) return null;
  const decos = [];
  for (const h of s.hunks) {
    const activeCls = h.index === s.cursor ? " dr-stage-active" : "";
    if (h.docTo > h.docFrom) {
      // Deleted / replaced original text: dim-struck unless the hunk was
      // rejected (then it stays — shown plain).
      const cls = h.decision === "rejected" ? "dr-stage-keep" : "dr-stage-del";
      decos.push(Decoration.inline(h.docFrom, h.docTo, { class: cls + activeCls }));
    }
    if (h.insText && h.decision !== "rejected") {
      // Proposed insertion: an accent-tinted widget at the hunk end. It carries
      // no document positions of its own (it is not in the doc), so typing is
      // disabled while staging is active (editable:false).
      const insText = h.insText;
      const idx = h.index;
      const block = s.mode === "continue" || s.mode === "summarise";
      decos.push(
        Decoration.widget(
          h.docTo,
          () => {
            const el = document.createElement(block ? "div" : "span");
            el.className = "dr-stage-ins" + (block ? " dr-stage-ins-block" : "") + (idx === s.cursor ? " dr-stage-active" : "");
            el.textContent = insText;
            el.setAttribute("aria-label", "proposed insertion");
            return el;
          },
          { side: 1, key: "ins-" + idx + "-" + (idx === s.cursor ? "a" : "n") + (h.decision || "") }
        )
      );
    }
  }
  return DecorationSet.create(state.doc, decos);
}

function stagingPlugin() {
  return new Plugin({
    key: stagingKey,
    state: {
      init: () => ({ active: false, hunks: [], cursor: 0, from: 0, to: 0, oldText: "", mode: null }),
      apply(tr, prev) {
        const meta = tr.getMeta(stagingKey);
        if (meta) return meta;
        // A staged review never survives a document change (accept/discard end
        // it first); if one slips through, drop the overlay rather than paint
        // stale positions.
        if (tr.docChanged && prev.active) return { ...prev, active: false, hunks: [] };
        return prev;
      },
    },
    props: {
      decorations: stagingDecorations,
    },
  });
}

// In-session history-log growth cap (STATE.md open item): past this many
// recorded transactions the log folds into a checkpoint (doc snapshot) and
// keeps growing from there. Replay = checkpoint + entries.
const HISTORY_LOG_CAP = 1000;

// ---------------------------------------------------------------------------
// createAdapter — one live editor bound to a mount element.
// applyTransaction() is the single write path (L4).
// ---------------------------------------------------------------------------
function createAdapter(mount) {
  // Late-bound UI handlers (the shell owns the in-app cards; Mod-K routes to
  // the link prompt, Mod-F to the find/replace panel — the Batch C deferral
  // of ⌘/Ctrl+F ends HERE, bound in the same commit that ships the feature —
  // and footnote editing to the footnote card).
  const handlers = { requestLink: null, requestFind: null, requestFootnote: null, requestRewrite: null, requestContinue: null };

  // Sidecar staging review controls, late-bound after the view exists (like
  // `handlers`). The review keymap plugin and the public `staging` API both
  // route through this object; `active()` also gates `editable` so no typing
  // can shift positions under the staged overlay.
  const stagingCtl = { active: () => false, acceptHunk: null, rejectHunk: null, acceptAll: null, discard: null };

  function editingKeymap() {
    const m = {
      "Mod-b": toggleMark(schema.marks.bold),
      "Mod-i": toggleMark(schema.marks.italic),
      "Mod-u": toggleMark(schema.marks.underline),
      "Mod-k": () => {
        if (handlers.requestLink) {
          handlers.requestLink();
          return true;
        }
        return false;
      },
      "Mod-f": () => {
        if (handlers.requestFind) {
          handlers.requestFind();
          return true;
        }
        return false;
      },
      // Sidecar shortcuts (handoff §7): Rewrite selection, Continue at the
      // paragraph end. Each opens a staged diff — never an ambient call.
      "Mod-Shift-r": () => {
        if (handlers.requestRewrite) {
          handlers.requestRewrite();
          return true;
        }
        return false;
      },
      "Mod-Shift-g": () => {
        if (handlers.requestContinue) {
          handlers.requestContinue();
          return true;
        }
        return false;
      },
      "Mod-Shift-7": toggleList(schema.nodes.ordered_list),
      "Mod-Shift-8": toggleList(schema.nodes.bullet_list),
      // Enter: a selected footnote opens its card; inside lists it splits the
      // list ITEM; falls through to baseKeymap everywhere else.
      Enter: (state, dispatch) => {
        if (footnoteSelection(state) && handlers.requestFootnote) {
          handlers.requestFootnote();
          return true;
        }
        return (
          splitListItem(schema.nodes.list_item)(state, dispatch) ||
          splitListItem(schema.nodes.task_item)(state, dispatch)
        );
      },
      // Tab: in a table it walks cells; in a list it indents; elsewhere it
      // falls through to the browser (focus navigation stays intact — §8).
      Tab: (state, dispatch) =>
        (isInTable(state) && goToNextCell(1)(state, dispatch)) || sinkListItem(schema.nodes.list_item)(state, dispatch),
      "Shift-Tab": (state, dispatch) =>
        (isInTable(state) && goToNextCell(-1)(state, dispatch)) || liftListItem(schema.nodes.list_item)(state, dispatch),
    };
    for (let n = 1; n <= 4; n++) m[`Mod-Alt-${n}`] = toggleHeading(n);
    return keymap(m);
  }

  // While a proposal is staged, these keys drive the review and nothing else
  // reaches the editor (handoff §7): Enter accepts the current hunk, Backspace
  // rejects it, ⌘/Ctrl+Enter accepts all, Esc discards. Highest precedence so
  // they win over the base keymap; a no-op when nothing is staged.
  function stagingReviewPlugin() {
    const guard = (fn) => () => {
      if (!stagingCtl.active()) return false;
      fn();
      return true;
    };
    return keymap({
      Enter: guard(() => stagingCtl.acceptHunk && stagingCtl.acceptHunk()),
      Backspace: guard(() => stagingCtl.rejectHunk && stagingCtl.rejectHunk()),
      "Mod-Enter": guard(() => stagingCtl.acceptAll && stagingCtl.acceptAll()),
      Escape: guard(() => stagingCtl.discard && stagingCtl.discard()),
    });
  }

  function basePlugins() {
    return [
      stagingReviewPlugin(),
      stagingPlugin(),
      history({ depth: 600, newGroupDelay: 0 }),
      keymap({ "Mod-z": undo, "Mod-y": redo, "Mod-Shift-z": redo }),
      editingKeymap(),
      keymap(baseKeymap),
      dropCursor(),
      gapCursor(),
      tableEditing(),
      findPlugin(),
      inputRules({
        rules: [
          textblockTypeInputRule(/^(#{1,4})\s$/, schema.nodes.heading, (m) => ({ level: m[1].length })),
          textblockTypeInputRule(/^```$/, schema.nodes.code_block),
          wrappingInputRule(/^\s*([-+*])\s$/, schema.nodes.bullet_list),
          wrappingInputRule(/^(\d+)\.\s$/, schema.nodes.ordered_list, (m) => ({ order: Number(m[1]) }), (m, node) => node.childCount + node.attrs.order === Number(m[1])),
          wrappingInputRule(/^\s*>\s$/, schema.nodes.blockquote),
          new InputRule(/^(?:---|___|\*\*\*)\s$/, (state, _match, start, end) =>
            state.tr.replaceRangeWith(start, end, schema.nodes.horizontal_rule.create())
          ),
          markInputRule(/\*\*([^*\s](?:[^*]*[^*\s])?)\*\*$/, schema.marks.bold),
          markInputRule(/__([^_\s](?:[^_]*[^_\s])?)__$/, schema.marks.bold),
          markInputRule(/(?<![*\w])\*([^*\s](?:[^*]*[^*\s])?)\*$/, schema.marks.italic),
          markInputRule(/(?<![_\w])_([^_\s](?:[^_]*[^_\s])?)_$/, schema.marks.italic),
          markInputRule(/(?<!`)`([^`\s](?:[^`]*[^`\s])?)`$/, schema.marks.code),
          markInputRule(/~~([^~\s](?:[^~]*[^~\s])?)~~$/, schema.marks.strike),
        ],
      }),
    ];
  }

  function freshState(doc) {
    return EditorState.create({ schema, doc, plugins: basePlugins() });
  }

  // --- sole dispatch (L4) --------------------------------------------------
  // EVERY transaction — typing, commands, undo/redo, API steps — lands in
  // dispatchTagged: the steps and their inverses are serialised into the
  // history log with {actor, origin}, then the state advances, then change
  // listeners (autosave) fire. There is no second write path.
  let historyLog = createHistoryLog();
  const changeListeners = new Set();
  const updateListeners = new Set(); // fire on EVERY dispatch (selection too)
  let pendingMeta = null; // set around undo/redo/API dispatches
  let lastTxId = null; // txId of the most recent dispatch (null when step-less)

  function dispatchTagged(tr) {
    const actor = tr.getMeta("actor") || (pendingMeta && pendingMeta.actor) || "owner";
    const origin = tr.getMeta("origin") || (pendingMeta && pendingMeta.origin) || "ui";
    let txId = null;
    if (tr.steps.length) {
      // Growth cap: fold the log into a checkpoint of the CURRENT doc (the
      // doc all recorded entries produce) before this entry lands.
      if (historyLog.entries.length >= HISTORY_LOG_CAP)
        checkpointHistoryLog(historyLog, view.state.doc.toJSON());
      txId = recordEntry(historyLog, {
        steps: tr.steps.map((s) => s.toJSON()),
        inverses: tr.steps.map((s, i) => s.invert(tr.docs[i]).toJSON()),
        actor,
        origin,
      });
    }
    lastTxId = txId;
    view.updateState(view.state.apply(tr));
    if (txId !== null) for (const fn of changeListeners) fn({ txId, actor, origin });
    for (const fn of updateListeners) fn();
    return txId;
  }

  let view = new EditorView(mount, {
    state: freshState(undefined),
    dispatchTransaction(tr) {
      dispatchTagged(tr);
    },
    // Read-only while a sidecar proposal is staged: no keystroke may shift the
    // positions the staged overlay is painted at (Batch H).
    editable: () => !stagingCtl.active(),
    attributes: { role: "textbox", "aria-multiline": "true" },
  });

  // Run an editor command, keeping focus on the page.
  function runCommand(cmd) {
    const ok = cmd(view.state, view.dispatch);
    view.focus();
    return ok;
  }

  // ---- sidecar staging (Batch H) ------------------------------------------
  // Commit a staged accept through the sole write path (L4). Sidecar accepts
  // are attributed to the Owner; origin "sidecar" preserves the provenance in
  // History (handoff §7 / V&R §4).
  function commitTagged(build, { actor = "owner", origin = "sidecar" } = {}) {
    let tr = build(view.state.tr);
    if (!tr.steps.length) return null;
    tr.setMeta("actor", actor);
    tr.setMeta("origin", origin);
    tr = closeHistory(tr);
    pendingMeta = { actor, origin };
    try {
      view.dispatch(tr);
    } finally {
      pendingMeta = null;
    }
    return lastTxId;
  }

  const emptyStaging = { active: false, hunks: [], cursor: 0, from: 0, to: 0, oldText: "", mode: null };
  function setStaging(next) {
    // A meta-only transaction: it changes the staging plugin state (and thus
    // `editable`) without touching the document or the history log.
    view.dispatch(view.state.tr.setMeta(stagingKey, next).setMeta("addToHistory", false));
  }
  const rawStaging = () => stagingKey.getState(view.state);
  function firstPending(hunks, from) {
    for (let i = from; i < hunks.length; i++) if (!hunks[i].decision) return i;
    return -1;
  }
  // Absolute-position hunks for a base range [from,to] (text oldText) vs the
  // proposed newText. Inline atoms in the range (position count != char count)
  // collapse the diff to a single whole-range replace so a decoration never
  // lands on a wrong position.
  function buildStageHunks(from, to, oldText, newText) {
    const clean = to - from === oldText.length;
    let hunks;
    if (!clean || oldText === "") {
      hunks =
        oldText === newText
          ? []
          : [{ index: 0, fromOffset: 0, delText: oldText, insText: newText, kind: oldText && newText ? "replace" : oldText ? "delete" : "insert" }];
    } else {
      hunks = diffHunks(oldText, newText);
    }
    return hunks.map((h) => ({
      ...h,
      decision: null,
      docFrom: clean ? from + h.fromOffset : from,
      docTo: clean ? from + h.fromOffset + h.delText.length : to,
    }));
  }

  const staging = {
    active: () => {
      const s = rawStaging();
      return !!(s && s.active);
    },
    // Stage a proposal as a diff over [from,to]; `mode` drives the write on
    // accept (rewrite → replace range; continue → paragraphs after the block;
    // summarise → headings at the top). Never writes here.
    stage({ from, to, proposal, mode = "rewrite" }) {
      const oldText = view.state.doc.textBetween(from, to, "\n");
      const hunks = buildStageHunks(from, to, oldText, String(proposal || ""));
      if (!hunks.length) return { active: false, hunks: [] };
      const cursor = Math.max(0, firstPending(hunks, 0));
      setStaging({ active: true, hunks, cursor, from, to, oldText, mode });
      // Collapse the selection so its accent wash does not compete with the
      // staged diff — the type stays the interface, nothing else.
      const $at = view.state.doc.resolve(Math.min(from, view.state.doc.content.size));
      view.dispatch(view.state.tr.setSelection(TextSelection.near($at)).setMeta("addToHistory", false));
      view.focus();
      return { active: true, count: hunks.length };
    },
    // The review snapshot the sidecar panel + tests read.
    state() {
      const s = rawStaging();
      if (!s || !s.active) return { active: false, hunks: [], cursor: -1, pending: 0 };
      return {
        active: true,
        cursor: s.cursor,
        mode: s.mode,
        pending: s.hunks.filter((h) => !h.decision).length,
        hunks: s.hunks.map((h) => ({ index: h.index, kind: h.kind, delText: h.delText, insText: h.insText, decision: h.decision })),
      };
    },
    decide(index, decision) {
      const s = rawStaging();
      if (!s || !s.active) return null;
      const hunks = s.hunks.map((h) => (h.index === index ? { ...h, decision } : h));
      const nextCursor = firstPending(hunks, index + 1);
      if (nextCursor < 0) return staging._commit(hunks, s);
      setStaging({ ...s, hunks, cursor: nextCursor });
      view.focus();
      return null;
    },
    acceptHunk() {
      const s = rawStaging();
      return s && s.active ? staging.decide(s.cursor, "accepted") : null;
    },
    rejectHunk() {
      const s = rawStaging();
      return s && s.active ? staging.decide(s.cursor, "rejected") : null;
    },
    acceptAll() {
      const s = rawStaging();
      if (!s || !s.active) return null;
      return staging._commit(s.hunks.map((h) => (h.decision ? h : { ...h, decision: "accepted" })), s);
    },
    discard() {
      const s = rawStaging();
      if (!s || !s.active) return;
      setStaging({ ...emptyStaging });
      view.focus();
    },
    _commit(hunks, s) {
      const anyAccepted = hunks.some((h) => h.decision === "accepted");
      // End the review first so `editable` is restored before the write lands.
      setStaging({ ...emptyStaging });
      let txId = null;
      if (anyAccepted) {
        if (s.mode === "continue" || s.mode === "summarise") {
          const accepted = hunks.find((h) => h.decision === "accepted");
          txId = staging._insertBlocks(s, accepted ? accepted.insText : "");
        } else {
          const composed = composeFromDecisions(s.oldText, hunks);
          if (composed !== s.oldText)
            txId = commitTagged((tr) =>
              composed.length
                ? tr.replaceWith(s.from, s.to, schema.text(composed, view.state.doc.resolve(s.from).marks()))
                : tr.delete(s.from, s.to)
            );
        }
      }
      view.focus();
      return txId;
    },
    _insertBlocks(s, text) {
      const nodesJSON = s.mode === "summarise" ? textToHeadings(text) : textToParagraphs(text);
      if (!nodesJSON.length) return null;
      const frag = Fragment.fromArray(nodesJSON.map((n) => PMNode.fromJSON(schema, n)));
      const $from = view.state.doc.resolve(Math.min(s.from, view.state.doc.content.size));
      const at = s.mode === "summarise" ? 0 : $from.after(1);
      return commitTagged((tr) => tr.insert(at, frag));
    },
  };

  stagingCtl.active = staging.active;
  stagingCtl.acceptHunk = staging.acceptHunk;
  stagingCtl.rejectHunk = staging.rejectHunk;
  stagingCtl.acceptAll = staging.acceptAll;
  stagingCtl.discard = staging.discard;

  // The sidecar context snapshot (handoff §7): selection (or the current
  // paragraph, for Continue), one top-level block on each side, the heading
  // outline, the locale, and the whole-document text (used ONLY when the user
  // explicitly picks "whole document"). Pure data — sidecar/context.mjs turns
  // it into the slice and the "what will be sent" preview.
  function sidecarSnapshot({ locale = "" } = {}) {
    const { doc, selection } = view.state;
    const { from, to, empty } = selection;
    const $from = doc.resolve(from);
    const idx = $from.index(0);
    const currentBlock = doc.childCount ? doc.child(idx).textContent : "";
    const before = idx > 0 ? doc.child(idx - 1).textContent : "";
    const after = idx < doc.childCount - 1 ? doc.child(idx + 1).textContent : "";
    const selectionText = empty ? currentBlock : doc.textBetween(from, to, "\n");
    return {
      from,
      to,
      empty,
      selectionText,
      before,
      after,
      outline: api.outline().map((h) => ({ level: h.level, text: h.text })),
      locale,
      wholeDocText: doc.textBetween(0, doc.content.size, "\n"),
    };
  }

  // Insertion target for Continue: the end of the top-level block holding the
  // cursor (so the proposal lands as fresh paragraphs after it).
  function continueTargetFrom() {
    const { doc, selection } = view.state;
    const $from = doc.resolve(selection.from);
    return { from: $from.after(1), to: $from.after(1) };
  }

  const api = {
    schema,

    get view() {
      return view;
    },

    loadEmpty() {
      historyLog = createHistoryLog();
      view.updateState(freshState(undefined));
    },

    // Replace the whole document; fresh state, fresh history, fresh log.
    loadDoc(docJSON, assetMap) {
      const json = assetMap ? resolveAssets(docJSON, assetMap) : docJSON;
      const doc = PMNode.fromJSON(schema, json);
      doc.check();
      historyLog = createHistoryLog();
      view.updateState(freshState(doc));
      return doc.nodeSize;
    },

    getDocJSON() {
      return view.state.doc.toJSON();
    },

    getDoc() {
      return view.state.doc;
    },

    docStats() {
      const doc = view.state.doc;
      let words = 0,
        chars = 0,
        blocks = 0,
        tables = 0,
        images = 0,
        headings = 0;
      const seg = new Intl.Segmenter(undefined, { granularity: "word" });
      doc.descendants((node) => {
        if (node.isBlock) blocks++;
        if (node.type.name === "table") tables++;
        if (node.type.name === "image") images++;
        if (node.type.name === "heading") headings++;
        if (node.isText) {
          chars += node.text.length;
          for (const s of seg.segment(node.text)) if (s.isWordLike) words++;
        }
        return true;
      });
      return { words, chars, blocks, tables, images, headings, nodeSize: doc.nodeSize };
    },

    wordCount() {
      return wordCount(view.state.doc);
    },

    // The single write path for serialised steps (API, replay, sidecar
    // accept). Tags every step's transaction; returns the txId.
    applyTransaction(stepsJSON, { actor = "api", origin = null, closeGroup = true } = {}) {
      let tr = view.state.tr;
      for (const s of stepsJSON) {
        const step = Step.fromJSON(schema, s);
        tr = tr.step(step);
      }
      tr.setMeta("actor", actor);
      if (origin) tr.setMeta("origin", origin);
      if (closeGroup) tr = closeHistory(tr);
      pendingMeta = { actor, origin: origin || actor };
      try {
        view.dispatch(tr);
      } finally {
        pendingMeta = null;
      }
      // The txId actually recorded by this dispatch — null for a step-less
      // transaction (forward-pass fix: this used to return the previous head,
      // implying a recorded transaction that does not exist).
      return lastTxId;
    },

    // Change subscription (autosave). fn({txId, actor, origin}); returns
    // an unsubscribe function.
    onChange(fn) {
      changeListeners.add(fn);
      return () => changeListeners.delete(fn);
    },

    // Fires on EVERY dispatch, selection-only included (rail state refresh).
    onUpdate(fn) {
      updateListeners.add(fn);
      return () => updateListeners.delete(fn);
    },

    // UI seams: the shell installs the in-app link prompt here (Mod-K).
    handlers,

    focus() {
      view.focus();
    },

    // ---- editing commands (Batch C rail + keyboard set §8) ----------------
    // Every command dispatches through the view → dispatchTagged (L4).
    commands: {
      bold: () => runCommand(toggleMark(schema.marks.bold)),
      italic: () => runCommand(toggleMark(schema.marks.italic)),
      underline: () => runCommand(toggleMark(schema.marks.underline)),
      heading: (level) => runCommand(toggleHeading(level)),
      bulletList: () => runCommand(toggleList(schema.nodes.bullet_list)),
      orderedList: () => runCommand(toggleList(schema.nodes.ordered_list)),
      // href: string applies (over the selection, or the link run around an
      // empty cursor); null/"" removes. An empty cursor on no link INSERTS
      // the address as linked text — never a silent no-op (forward-pass fix,
      // Batch D). Returns false only when there is truly nothing to do.
      setLink(href) {
        // Enforce the same protocol allowlist the ingress guards apply
        // (schema getAttrs L1845, sanitizeMarks UNSAFE_URL L1936): a
        // javascript:/data:/vbscript: target must never become a live link.
        // An unsafe href is treated as removal — it strips an existing link
        // and never applies a new one, matching how ingress drops it.
        if (typeof href === "string" && UNSAFE_URL.test(href)) href = null;
        const { empty, from, to, $from } = view.state.selection;
        const range = empty ? linkRangeAt($from) : { from, to };
        if (!range || range.from === range.to) {
          if (!href || !empty) return false;
          const node = schema.text(href, [schema.marks.link.create({ href })]);
          view.dispatch(view.state.tr.replaceSelectionWith(node, false));
          view.focus();
          return true;
        }
        let tr = view.state.tr.removeMark(range.from, range.to, schema.marks.link);
        if (href) tr = tr.addMark(range.from, range.to, schema.marks.link.create({ href }));
        view.dispatch(tr);
        view.focus();
        return true;
      },
      // ---- tables (Batch D) ----
      insertTable: (opts) => runCommand(insertTable(opts)),
      addRowAfter: () => runCommand(addRowAfter),
      addColumnAfter: () => runCommand(addColumnAfter),
      deleteRow: () => runCommand(deleteRow),
      deleteColumn: () => runCommand(deleteColumn),
      deleteTable: () => runCommand(deleteTable),
      toggleHeaderRow: () => runCommand(toggleHeaderRow),
      // ---- images (Batch E) ----
      // Insert an image at the cursor. src is a data URI (re-encoded upstream
      // to strip metadata); ref is the stable asset key (L2/§4). Through the
      // sole write path like every other command.
      insertImage({ src, alt = "", ref = null }) {
        if (!src) return false;
        return runCommand((state, dispatch) => {
          const node = schema.nodes.image.create({ src, alt, ref });
          if (dispatch) dispatch(state.tr.replaceSelectionWith(node, false).scrollIntoView());
          return true;
        });
      },
      // ---- footnotes (Batch D) ----
      // The text of the selected footnote (prefill for the card), or null.
      footnoteAtSelection() {
        const sel = footnoteSelection(view.state);
        return sel ? sel.node.textContent : null;
      },
      // text: string inserts (at the cursor) or rewrites (selected footnote);
      // null/"" on a selected footnote deletes it. Plain text at v1 — the
      // card is the editor, never nested contenteditable (L8).
      setFootnote(text) {
        const sel = footnoteSelection(view.state);
        const clean = String(text || "").trim();
        if (sel) {
          let tr;
          if (!clean) tr = view.state.tr.delete(sel.pos, sel.pos + sel.node.nodeSize);
          else tr = view.state.tr.replaceWith(sel.pos, sel.pos + sel.node.nodeSize, schema.nodes.footnote.create(null, schema.text(clean)));
          view.dispatch(tr);
          view.focus();
          return true;
        }
        if (!clean) return false;
        const node = schema.nodes.footnote.create(null, schema.text(clean));
        view.dispatch(view.state.tr.replaceSelectionWith(node, false).scrollIntoView());
        view.focus();
        return true;
      },
      // The href under the selection (prefill for the prompt), or null.
      linkAtSelection() {
        const { empty, from, to, $from } = view.state.selection;
        if (empty) {
          const r = linkRangeAt($from);
          return r ? r.attrs.href : null;
        }
        const link = schema.marks.link;
        let found = null;
        view.state.doc.nodesBetween(from, to, (node) => {
          if (found) return false;
          const m = link.isInSet(node.marks);
          if (m) found = m.attrs.href;
          return true;
        });
        return found;
      },
    },

    // Formatting state under the selection, for the rail's pressed states.
    activeStates() {
      const state = view.state;
      const { empty, from, to, $from } = state.selection;
      const stored = state.storedMarks || $from.marks();
      const has = (type) => (empty ? !!type.isInSet(stored) : state.doc.rangeHasMark(from, to, type));
      const block = refTextblock(state) || $from.parent;
      const anc = listAncestor($from);
      return {
        bold: has(schema.marks.bold),
        italic: has(schema.marks.italic),
        underline: has(schema.marks.underline),
        link: empty ? !!linkRangeAt($from) : state.doc.rangeHasMark(from, to, schema.marks.link),
        heading: block.type === schema.nodes.heading ? block.attrs.level : null,
        bulletList: !!anc && anc.node.type === schema.nodes.bullet_list,
        orderedList: !!anc && anc.node.type === schema.nodes.ordered_list,
        inTable: isInTable(state),
        footnote: !!footnoteSelection(state),
      };
    },

    // Heading outline: [{level, text, pos}] (Batch D outline sidebar; the
    // same shape §6's window.draft.outline() will expose at Batch G).
    outline() {
      const out = [];
      view.state.doc.descendants((node, pos) => {
        if (node.type === schema.nodes.heading) {
          out.push({ level: node.attrs.level, text: node.textContent, pos });
          return false;
        }
        return true;
      });
      return out;
    },

    // Jump the caret to a document position (outline click-to-jump).
    jumpTo(pos) {
      const $pos = view.state.doc.resolve(Math.min(Math.max(pos + 1, 0), view.state.doc.content.size));
      view.dispatch(view.state.tr.setSelection(Selection.near($pos)).scrollIntoView());
      view.focus();
    },

    // ---- find/replace (Batch D) -------------------------------------------
    // The panel drives this surface; every replacement dispatches through
    // the sole write path (L4). State lives in the find plugin.
    search: {
      state() {
        const s = findKey.getState(view.state) || EMPTY_FIND;
        return { count: s.matches.length, active: s.active, error: s.error, query: s.query };
      },
      // Set (or clear) the query; recomputes matches and highlights.
      set({ query = "", regex = false, caseSensitive = false } = {}) {
        const next = computeFind(view.state.doc, { query, regex, caseSensitive, active: 0 });
        view.dispatch(view.state.tr.setMeta(findKey, next));
        return this.state();
      },
      clear() {
        view.dispatch(view.state.tr.setMeta(findKey, EMPTY_FIND));
      },
      // Step the active match (dir ±1), select it and scroll it into view.
      step(dir) {
        const s = findKey.getState(view.state);
        if (!s || !s.matches.length) return this.state();
        const active = (s.active + dir + s.matches.length) % s.matches.length;
        const m = s.matches[active];
        let tr = view.state.tr.setMeta(findKey, { ...s, active });
        tr = tr.setSelection(TextSelection.create(view.state.doc, m.from, m.to)).scrollIntoView();
        view.dispatch(tr);
        return this.state();
      },
      // Replace the active match, then advance to the following one.
      replaceActive(replaceWith) {
        const s = findKey.getState(view.state);
        if (!s || s.active < 0 || !s.matches.length) return this.state();
        const m = s.matches[s.active];
        const text = buildReplacement(replaceWith, m, { regex: s.regex });
        let tr = view.state.tr;
        if (text) tr = tr.replaceWith(m.from, m.to, schema.text(text, view.state.doc.resolve(m.from).marks()));
        else tr = tr.delete(m.from, m.to);
        view.dispatch(tr); // plugin recomputes matches on docChanged
        const after = findKey.getState(view.state);
        if (after && after.matches.length) {
          const end = m.from + text.length;
          let next = after.matches.findIndex((x) => x.from >= end);
          if (next < 0) next = 0;
          view.dispatch(view.state.tr.setMeta(findKey, { ...after, active: next }));
        }
        return this.state();
      },
      // Replace every match in one transaction. Returns the replaced count.
      replaceAll(replaceWith) {
        const s = findKey.getState(view.state);
        if (!s || !s.matches.length) return 0;
        let tr = view.state.tr;
        for (let i = s.matches.length - 1; i >= 0; i--) {
          const m = s.matches[i];
          const text = buildReplacement(replaceWith, m, { regex: s.regex });
          if (text) tr = tr.replaceWith(m.from, m.to, schema.text(text, view.state.doc.resolve(m.from).marks()));
          else tr = tr.delete(m.from, m.to);
        }
        const n = s.matches.length;
        view.dispatch(tr);
        return n;
      },
    },

    // History primitive: serialised steps + inverses per transaction.
    historyHead() {

    serializeHistory() {

    sanitize(input, opts) {

      view.state.doc.descendants((node, pos) => {
        if (found !== null) return false;

        return true;
      });
      return found;
    },

    textBetween(from, to) {
      return view.state.doc.textBetween(from, to, "\n");
    },

    // The whole document's text (agent face getText() with no range).
    docText() {
      return view.state.doc.textBetween(0, view.state.doc.content.size, "\n");
    },

    // it never touches the find plugin's UI state.

      const res = computeFind(view.state.doc, { query, regex, caseSensitive, active: 0 });
      if (res.error) return [];
      return res.matches.map((m) => ({ from: m.from, to: m.to }));

    // (L4), tagging the transaction (agent face replaceRange, actor:"api").
    // JSON is wrapped as a doc and re-sanitised so only v1 nodes ever land.
    replaceRange(from, to, textOrJSON, { actor = "api", origin = null } = {}) {
      let tr = view.state.tr;
      if (typeof textOrJSON === "string") {
        tr = textOrJSON.length
          ? tr.replaceWith(from, to, schema.text(textOrJSON, view.state.doc.resolve(from).marks()))
          : tr.delete(from, to);
      } else {
        const content = Array.isArray(textOrJSON) ? textOrJSON : [textOrJSON];
        const clean = sanitizeToSchema({ type: "doc", content }, { kind: "json" });
        const node = PMNode.fromJSON(schema, clean.doc);
        tr = tr.replaceWith(from, to, node.content);

      tr.setMeta("actor", actor);
      if (origin) tr.setMeta("origin", origin);
      tr = closeHistory(tr);

    },

    redoDepth() {
      return redoDepth(view.state);

    serializeMarkdown() {
      return withFinalNewline(mdSerializer.serialize(view.state.doc));

    markdownOfJSON(docJSON) {

    parseMarkdown(text) {
      return parseMarkdown(text);

    // Round-trip helper for G2: JSON -> Node -> JSON.
    roundTripJSON(docJSON) {

    // The staged-diff review surface. Proposals are staged, reviewed hunk by
    // hunk, and committed through the sole write path on accept (actor Owner,
    // origin "sidecar"). Nothing here contacts a model — that seam lives in
    // sidecar/proposers.mjs, called only on an explicit user action.
    staging,
    sidecarSnapshot,
    continueTargetFrom,

    destroy() {
      view.destroy();

// Plain text → v1 paragraph nodes (Continue): blank lines split paragraphs;
// single newlines collapse to spaces. Used to write an accepted continuation.
function textToParagraphs(text) {
  return String(text || "")
    .split(/\n{2,}/)
    .map((s) => s.replace(/\n/g, " ").trim())
    .filter(Boolean)
    .map((s) => ({ type: "paragraph", content: [{ type: "text", text: s }] }));
}

// Plain text → v1 heading nodes (Summarise to outline): each non-empty line is
// a heading (level 2), any leading markdown list/heading marker stripped.
function textToHeadings(text) {
  return String(text || "")
    .split(/\n+/)
    .map((s) => s.replace(/^\s*#{1,6}\s*/, "").replace(/^\s*[-*+]\s*/, "").trim())
    .filter(Boolean)
    .map((s) => ({ type: "heading", attrs: { level: 2 }, content: [{ type: "text", text: s }] }));
}

// Rewrite image node src attrs from an asset map { ref: dataURI }.
function resolveAssets(docJSON, assetMap) {
  const clone = JSON.parse(JSON.stringify(docJSON));
  const visit = (node) => {
    if (node.type === "image" && node.attrs && node.attrs.ref && assetMap[node.attrs.ref]) {
      node.attrs.src = assetMap[node.attrs.ref];
    }
    if (node.content) node.content.forEach(visit);
  };
  visit(clone);
  return clone;
}

// ==== begin sidecar/ladder.mjs ====
// sidecar/ladder.mjs — Edge-First ladder detection (handoff L7). The sidecar
// reaches for capability in a fixed order, closest-to-you first:
//   1. bridge — nakli-local-bridge / Ollama on 127.0.0.1 (your machine)
//   2. webgpu — Transformers.js in-tab on WebGPU (your browser)
//   3. byok   — your key, your provider (leaves to THEM, never to us)
// No relay at v1.0. This module is PURE: it takes injectable probes and reports
// which rungs are available, so detection is unit-tested with no network and no
// GPU. The probes themselves (a localhost fetch, navigator.gpu, the key vault)
// live at the call site and run ONLY on an explicit user action — never on boot.

const RUNGS = { BRIDGE: "bridge", WEBGPU: "webgpu", BYOK: "byok" };

// Priority order is the ladder itself: earlier is closer to the user.
const ORDER = [RUNGS.BRIDGE, RUNGS.WEBGPU, RUNGS.BYOK];

// Detect which rungs are available. Every probe is optional and injectable:
//   probeBridge:      async () -> bool   (a model server answered on 127.0.0.1)
//   hasWebGPU:              () -> bool   (navigator.gpu exists in this browser)
//   probeWebGPUModel: async () -> bool   (a model is already cached — ready now)
//   hasKey:           async () -> bool   (a BYOK key is stored in the vault)
// A throwing or missing probe reads as "unavailable" — the ground floor is
// zero-AI, so absence is never an error.
async function detectLadder({ probeBridge, hasWebGPU, probeWebGPUModel, hasKey } = {}) {
  const safe = async (fn) => {
    try {
      return fn ? !!(await fn()) : false;
    } catch {
      return false;
    }
  };
  const bridge = await safe(probeBridge);
  const webgpu = await safe(hasWebGPU);
  const webgpuModel = webgpu ? await safe(probeWebGPUModel) : false;
  const byok = await safe(hasKey);

  const available = {
    [RUNGS.BRIDGE]: bridge,
    [RUNGS.WEBGPU]: webgpu,
    [RUNGS.BYOK]: byok,
  };
  const rungs = ORDER.filter((r) => available[r]);
  // "ready" rungs can run WITHOUT a fresh model download; webgpu is available
  // but only ready once a model is cached (opt-in, size shown — never a
  // surprise download).
  const ready = rungs.filter((r) => r !== RUNGS.WEBGPU || webgpuModel);
  return {
    rungs,
    best: ready[0] || rungs[0] || null,
    ready: ready[0] || null,
    bridge,
    webgpu,
    webgpuModel,
    byok,
  };
}

// The dim-state copy when no rung is available (ground floor, handoff §7).
function unavailableHint() {
  return "install bridge or add key";
}

// One-line human label for a rung — used in the "what will be sent" preview and
// the review panel so the user always knows where their words are going.
function rungLabel(rung, { provider } = {}) {
  if (rung === RUNGS.BRIDGE) return "local bridge (127.0.0.1) — on your machine";
  if (rung === RUNGS.WEBGPU) return "in-browser (WebGPU) — on your machine";
  if (rung === RUNGS.BYOK) return `your provider${provider ? ` (${provider})` : ""} — leaves this device`;
  return "no model";
}

// True when the rung keeps every byte on the user's own machine (bridge/webgpu);
// false for BYOK, where the slice leaves to the user's chosen provider.
function rungIsLocal(rung) {
  return rung === RUNGS.BRIDGE || rung === RUNGS.WEBGPU;
}

// ==== begin sidecar/byok.mjs ====
// sidecar/byok.mjs — bring-your-own-key vault (handoff L7, VaultMind pattern).
// The key lives in IndexedDB on THIS machine and is shown only as a fingerprint;
// it is sent to the user's OWN provider by the proposer (an Authorization header
// on a direct fetch to the provider host) and NEVER to our origin — Draft has no
// server, and no code path posts the key anywhere but the chosen provider. The
// pure half (fingerprint, the provider registry) is unit-tested; the IndexedDB
// half is guarded and exercised in the browser e2e.

// OpenAI-compatible providers (one request shape, per AICHAT.md). Each host is
// pinned in the product CSP connect-src; a base that is not allow-listed simply
// cannot be reached, which keeps the always-on connect surface bounded.
const PROVIDERS = {
  openai: { label: "OpenAI", base: "https://api.openai.com/v1", model: "gpt-4o-mini" },
  groq: { label: "Groq", base: "https://api.groq.com/openai/v1", model: "llama-3.1-8b-instant" },
  mistral: { label: "Mistral", base: "https://api.mistral.ai/v1", model: "mistral-small-latest" },
  deepseek: { label: "DeepSeek", base: "https://api.deepseek.com/v1", model: "deepseek-chat" },
  openrouter: { label: "OpenRouter", base: "https://openrouter.ai/api/v1", model: "openai/gpt-4o-mini" },
};

// A short, non-reversible fingerprint of the key — enough to recognise which
// key is stored, never enough to reconstruct it. SHA-256 → first 8 hex chars.
async function fingerprint(key) {
  const subtle = globalThis.crypto && globalThis.crypto.subtle;
  const data = new TextEncoder().encode(String(key || ""));
  if (!subtle) {
    // Deterministic non-crypto fallback (test/older-runtime): FNV-1a.
    let h = 0x811c9dc5;
    for (const b of data) {
      h ^= b;
      h = Math.imul(h, 0x01000193) >>> 0;
    }
    return "key·" + h.toString(16).padStart(8, "0");
  }
  const digest = await subtle.digest("SHA-256", data);
  const hex = [...new Uint8Array(digest)].map((b) => b.toString(16).padStart(2, "0")).join("");
  return "key·" + hex.slice(0, 8);
}

const DB_NAME = "draft-byok";
const STORE = "keys";

function openDB() {
  return new Promise((resolve, reject) => {
    if (typeof indexedDB === "undefined") {
      reject(new Error("IndexedDB unavailable"));
      return;
    }
    const req = indexedDB.open(DB_NAME, 1);
    req.onupgradeneeded = () => {
      const db = req.result;
      if (!db.objectStoreNames.contains(STORE)) db.createObjectStore(STORE, { keyPath: "provider" });
    };
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}

function tx(db, mode, fn) {
  return new Promise((resolve, reject) => {
    const t = db.transaction(STORE, mode);
    const store = t.objectStore(STORE);
    const out = fn(store);
    t.oncomplete = () => resolve(out.result !== undefined ? out.result : out);
    t.onerror = () => reject(t.error);
    t.onabort = () => reject(t.error);
  });
}

// Store {provider, key} — overwrites any existing key for that provider. The
// value never leaves IndexedDB except as an Authorization header to the
// provider's own host.
async function saveKey(provider, key) {
  const db = await openDB();
  try {
    await tx(db, "readwrite", (s) => s.put({ provider, key: String(key || "") }));
  } finally {
    db.close();
  }
}

async function loadKey(provider) {
  const db = await openDB();
  try {
    const rec = await tx(db, "readonly", (s) => s.get(provider));
    return rec ? rec.key : null;
  } finally {
    db.close();
  }
}

async function clearKey(provider) {
  const db = await openDB();
  try {
    await tx(db, "readwrite", (s) => s.delete(provider));
  } finally {
    db.close();
  }
}

// Providers with a stored key, each as {provider, fingerprint} — the vault
// surface the settings UI renders (fingerprints only, never the keys).
async function storedKeys() {
  let db;
  try {
    db = await openDB();
  } catch {
    return [];
  }
  try {
    const all = await tx(db, "readonly", (s) => s.getAll());
    const list = Array.isArray(all) ? all : [];
    const out = [];
    for (const rec of list) out.push({ provider: rec.provider, fingerprint: await fingerprint(rec.key) });
    return out;
  } finally {
    db.close();
  }
}

async function hasAnyKey() {
  const list = await storedKeys();
  return list.length > 0;
}

// ==== begin sidecar/context.mjs ====
// sidecar/context.mjs — the context slice (handoff §7). The sidecar sees a
// SLICE, never the whole document, unless the user explicitly picks "whole
// document" — and then the byte count is shown. The slice is: the selection (or
// the current paragraph), one paragraph on each side, the heading outline, and
// the locale. This module is PURE over a plain snapshot the adapter gathers, so
// slice construction and the "what will be sent" preview are unit-tested with
// no editor and no model. It is the single source of truth for what leaves the
// page — the preview the user hovers and the payload a proposer sends are the
// SAME text built here.

const byteLen = (s) => new TextEncoder().encode(s || "").length;

// Assemble the context slice from a snapshot:
//   { selectionText, before, after, outline:[{level,text}], locale, wholeDocText }
// wholeDoc:true swaps the sliced context for the entire document text.
function buildSlice(snapshot, { wholeDoc = false } = {}) {
  const s = snapshot || {};
  const outline = Array.isArray(s.outline) ? s.outline : [];
  const outlineText = outline.length
    ? outline.map((h) => "  ".repeat(Math.max(0, (h.level || 1) - 1)) + h.text).join("\n")
    : "";
  const fields = {
    outline: outlineText,
    before: (s.before || "").trim(),
    selection: (s.selectionText || "").trim(),
    after: (s.after || "").trim(),
    locale: s.locale || "",
    wholeDoc,
  };
  const sliceText = wholeDoc
    ? (s.wholeDocText || "").trim()
    : [
        outlineText && `Outline:\n${outlineText}`,
        fields.before && `Text before: …${fields.before}`,
        fields.selection && `Selected passage: ${fields.selection}`,
        fields.after && `Text after: ${fields.after}…`,
      ]
        .filter(Boolean)
        .join("\n\n");
  return { fields, sliceText, bytes: byteLen(sliceText), wholeDoc, locale: fields.locale };
}

const SYSTEM = {
  rewrite:
    "You are a careful copy editor. Rewrite ONLY the selected passage, preserving its meaning and the author's voice. Use the surrounding text as context but do not repeat it. Reply with the rewritten passage and nothing else.",
  continue:
    "You are a writing companion. Continue the text naturally from where it stops, in the same voice and register. Reply with one or two new paragraphs and nothing else.",
  summarise:
    "You are an editor. Read the document and produce a concise outline of its structure as a short list of headings, one per line. Reply with the outline and nothing else.",
};

// Build the {system, user} prompt for a mode from the slice. The `user` message
// is exactly the text that leaves the page — the same string the preview shows.
function promptFor(mode, slice, { locale } = {}) {
  const loc = locale || (slice && slice.locale) || "";
  const localeLine = loc ? `\n\n(The document's language/locale is ${loc}.)` : "";
  const system = SYSTEM[mode] || SYSTEM.rewrite;
  const user = (slice && slice.sliceText ? slice.sliceText : "") + localeLine;
  return { system, user, bytes: byteLen(user) };
}

// The "what will be sent" preview (hover of the send control). It states the
// exact payload AND its destination — local rungs keep it on the machine; BYOK
// says plainly that the slice goes to the user's own provider. `wholeDoc` and
// its byte count are surfaced so a whole-document send is never silent.
function whatWillBeSent(slice, { rung, provider, local } = {}) {
  const bytes = (slice && slice.bytes) || 0;
  const destination =
    local === false || rung === "byok"
      ? `This slice leaves this device to your provider${provider ? ` (${provider})` : ""}.`
      : "This slice stays on your machine — nothing leaves this device.";
  const scope = slice && slice.wholeDoc ? `Whole document — ${bytes.toLocaleString()} bytes` : `Context slice — ${bytes.toLocaleString()} bytes`;
  return {
    text: (slice && slice.sliceText) || "",
    destination,
    scope,
    bytes,
    wholeDoc: !!(slice && slice.wholeDoc),
    summary: `${scope}. ${destination}`,
  };
}

// ==== begin sidecar/proposers.mjs ====
// sidecar/proposers.mjs — the model transport SEAM (handoff L7). One function,
// `propose({system, user})`, behind three interchangeable backends: the local
// bridge (Ollama on 127.0.0.1), in-browser WebGPU (Transformers.js), and BYOK
// (the user's provider). This is the ONLY place a network request or a worker
// is created, and every entry point runs solely from an explicit user action —
// never on boot. Tests bypass this module entirely by injecting a fake
// `propose` at the controller seam, so the staging/diff/accept logic is proved
// without a live model or any network.


// Default local bridge base (Ollama's OpenAI-compatible surface). nakli-local-
// bridge / LM Studio expose the same shape on 127.0.0.1.
const BRIDGE_BASE = "http://127.0.0.1:11434/v1";

// WebGPU model choices — small instruction models that run in-tab. Sizes are
// shown BEFORE any download; nothing fetches without the user opting in.
const WEBGPU_MODELS = {
  "qwen-0.5b": { id: "onnx-community/Qwen2.5-0.5B-Instruct", dtype: "q4f16", label: "Qwen2.5 0.5B", sizeMB: 540 },
  "smollm-1.7b": { id: "HuggingFaceTB/SmolLM2-1.7B-Instruct", dtype: "q4f16", label: "SmolLM2 1.7B", sizeMB: 1750 },
};
const DEFAULT_WEBGPU_MODEL = "qwen-0.5b";

// ---- OpenAI-compatible chat (bridge + BYOK share one request shape) --------
async function openaiChat({ base, key, model, system, user, signal, onToken, maxTokens = 512 }) {
  const messages = [];
  if (system) messages.push({ role: "system", content: system });
  messages.push({ role: "user", content: user });
  const resp = await fetch(`${base}/chat/completions`, {
    method: "POST",
    headers: { "Content-Type": "application/json", ...(key ? { Authorization: `Bearer ${key}` } : {}) },
    body: JSON.stringify({ model, messages, stream: true, max_tokens: maxTokens, temperature: 0.3 }),
    signal,
  });
  if (!resp.ok) {
    const detail = await resp.text().catch(() => "");
    throw new Error(`Model request failed (${resp.status})${detail ? `: ${detail.slice(0, 200)}` : ""}`);
  }
  const reader = resp.body.getReader();
  const dec = new TextDecoder();
  let buf = "";
  let out = "";
  for (;;) {
    const { done, value } = await reader.read();
    if (done) break;
    buf += dec.decode(value, { stream: true });
    const lines = buf.split("\n");
    buf = lines.pop();
    for (const line of lines) {
      const t = line.trim();
      if (!t.startsWith("data:")) continue;
      const payload = t.slice(5).trim();
      if (payload === "[DONE]") continue;
      try {
        const tok = JSON.parse(payload).choices?.[0]?.delta?.content || "";
        if (tok) {
          out += tok;
          if (onToken) onToken(tok);
        }
      } catch {
        /* keep partial line for next chunk */
      }
    }
  }
  return out.trim();
}

// Probe a bridge base without generating: a reachable model server answers
// /models. Short timeout; any failure reads as "no bridge" (ground floor).
async function probeBridge(base = BRIDGE_BASE, { timeoutMs = 1200 } = {}) {
  const ctrl = new AbortController();
  const timer = setTimeout(() => ctrl.abort(), timeoutMs);
  try {
    const resp = await fetch(`${base}/models`, { signal: ctrl.signal });
    return resp.ok;
  } catch {
    return false;
  } finally {
    clearTimeout(timer);
  }
}

// Discover the first model a bridge offers (else a sensible default).
async function bridgeModel(base = BRIDGE_BASE) {
  try {
    const resp = await fetch(`${base}/models`);
    const data = await resp.json();
    const id = data?.data?.[0]?.id;
    return id || "llama3.2";
  } catch {
    return "llama3.2";
  }
}

// ---- WebGPU worker (in-tab Transformers.js) --------------------------------
// The worker is a blob-URL ES module (naklios CLAUDE.md pattern): pinned @4
// +esm, warmup generate, InterruptableStoppingCriteria, and — non-negotiable —
// an onerror handler, without which a blob module worker fails silently.
const WORKER_SRC = `
import { AutoTokenizer, AutoModelForCausalLM, TextStreamer, InterruptableStoppingCriteria, env }
  from "https://cdn.jsdelivr.net/npm/@huggingface/transformers@4/+esm";
env.allowLocalModels = false;
let tok = null, model = null, stopping = null;
self.onmessage = async (e) => {
  const m = e.data;
  try {
    if (m.type === "load") {
      tok = await AutoTokenizer.from_pretrained(m.model, { progress_callback: p => self.postMessage({ type: "progress", data: p }) });
      model = await AutoModelForCausalLM.from_pretrained(m.model, { dtype: m.dtype || "q4f16", device: "webgpu", progress_callback: p => self.postMessage({ type: "progress", data: p }) });
      stopping = new InterruptableStoppingCriteria();
      await model.generate({ ...tok("a"), max_new_tokens: 1 });
      self.postMessage({ type: "ready" });
    } else if (m.type === "generate") {
      stopping.reset();
      const inputs = tok.apply_chat_template(m.messages, { add_generation_prompt: true, return_dict: true });
      let text = "";
      const streamer = new TextStreamer(tok, { skip_prompt: true, skip_special_tokens: true, callback_function: t => { text += t; self.postMessage({ type: "token", token: t, id: m.id }); } });
      await model.generate({ ...inputs, max_new_tokens: m.maxTokens || 512, do_sample: false, streamer, stopping_criteria: stopping });
      self.postMessage({ type: "complete", id: m.id, text });
    } else if (m.type === "stop") {
      if (stopping) stopping.interrupt();
    }
  } catch (err) {
    self.postMessage({ type: "error", error: String((err && err.message) || err), id: m.id });
  }
};
`;

function createWebGPUEngine() {
  let worker = null;
  let ready = false;
  let genId = 0;
  const pending = new Map();

  function ensureWorker() {
    if (worker) return;
    const url = URL.createObjectURL(new Blob([WORKER_SRC], { type: "application/javascript" }));
    worker = new Worker(url, { type: "module" });
    // Without this, a blob module-worker failure is completely silent.
    worker.addEventListener("error", (ev) => {
      const p = pending.get("load") || [...pending.values()][0];
      if (p) p.reject(new Error(`WebGPU worker error: ${ev.message || "failed to start"}`));
    });
    worker.addEventListener("message", (e) => {
      const d = e.data;
      if (d.type === "progress") {
        const p = pending.get("load");
        if (p && p.onProgress) p.onProgress(d.data);
      } else if (d.type === "ready") {
        ready = true;
        const p = pending.get("load");
        if (p) {
          pending.delete("load");
          p.resolve();
        }
      } else if (d.type === "token") {
        const p = pending.get(d.id);
        if (p && p.onToken) p.onToken(d.token);
      } else if (d.type === "complete") {
        const p = pending.get(d.id);
        if (p) {
          pending.delete(d.id);
          p.resolve((d.text || "").trim());
        }
      } else if (d.type === "error") {
        const p = pending.get(d.id) || pending.get("load");
        if (p) {
          pending.delete(d.id);
          pending.delete("load");
          p.reject(new Error(d.error));
        }
      }
    });
  }

  return {
    get ready() {
      return ready;
    },
    // Opt-in model load, size shown by the caller first. onProgress streams the
    // download so the user sees exactly what is being fetched.
    load(modelKey, onProgress) {
      ensureWorker();
      const spec = WEBGPU_MODELS[modelKey] || WEBGPU_MODELS[DEFAULT_WEBGPU_MODEL];
      return new Promise((resolve, reject) => {
        pending.set("load", { resolve, reject, onProgress });
        worker.postMessage({ type: "load", model: spec.id, dtype: spec.dtype });
      });
    },
    generate({ system, user, onToken, maxTokens }) {
      const id = "g" + ++genId;
      const messages = [];
      if (system) messages.push({ role: "system", content: system });
      messages.push({ role: "user", content: user });
      return new Promise((resolve, reject) => {
        pending.set(id, { resolve, reject, onToken });
        worker.postMessage({ type: "generate", id, messages, maxTokens });
      });
    },
    stop() {
      if (worker) worker.postMessage({ type: "stop" });
    },
    destroy() {
      if (worker) {
        worker.terminate();
        worker = null;
        ready = false;
      }
    },
  };
}

// Build a `propose` for a rung. The returned function is the seam the
// controller calls; tests inject their own instead of ever reaching here.
function makeProposer(rung, config = {}) {
  if (rung === RUNGS.BRIDGE) {
    return ({ system, user, signal, onToken }) =>
      openaiChat({ base: config.base || BRIDGE_BASE, model: config.model || "llama3.2", system, user, signal, onToken });
  }
  if (rung === RUNGS.BYOK) {
    const prov = PROVIDERS[config.provider] || PROVIDERS.openai;
    return ({ system, user, signal, onToken }) =>
      openaiChat({ base: prov.base, key: config.key, model: config.model || prov.model, system, user, signal, onToken });
  }
  if (rung === RUNGS.WEBGPU) {
    const engine = config.engine;
    return ({ system, user, onToken }) => engine.generate({ system, user, onToken });
  }
  throw new Error(`no proposer for rung "${rung}"`);
}
