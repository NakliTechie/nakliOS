// ==== begin io/export.mjs ====
// io/export.mjs — export the v1 document to Markdown / HTML / JSON / DOCX.
// Every export returns a Blob through one exportBlob(kind) (handoff §6, the
// export machinery Batch G's window.draft.export will wrap). Markdown and HTML
// delegate to the engine's own serializers via engine/adapter.mjs (this file
// never imports the editor engine — L5). DOCX uses the pinned docx.js, loaded
// LAZILY so it never costs the cold open — a document that is never exported
// to .docx never pays for docx.js.

const MIME = {
  md: "text/markdown;charset=utf-8",
  html: "text/html;charset=utf-8",
  json: "application/json;charset=utf-8",
  docx: "application/vnd.openxmlformats-officedocument.wordprocessingml.document",
};

// The one export surface. kind ∈ {md, html, json, docx}; returns a Blob.
async function exportBlob(kind, docJSON) {
  switch (kind) {
    case "json":
      return new Blob([JSON.stringify(docJSON, null, 2) + "\n"], { type: MIME.json });
    case "md":
      return new Blob([serializeMarkdown(docJSON)], { type: MIME.md });
    case "html":
      return new Blob([serializeHTMLJSON(docJSON)], { type: MIME.html });
    case "docx":
      return await exportDocx(docJSON);
    default:
      throw new Error(`export: unknown kind "${kind}"`);
  }
}

function b64ToBytes(b64) {
  const bin = atob(b64);
  const out = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
  return out;
}

// v1 doc JSON → .docx Blob. Walks the doc JSON directly (no engine nodes); the
// builders close over docx.js's constructors, imported here on demand. This
// mirrors the M0 harness's exporter minus the golden-fixture determinism pins
// (a runtime export needs no byte-stability).
async function exportDocx(docJSON) {
  const docx = await import("docx");
  const {
    AlignmentType, Document, ExternalHyperlink, FootnoteReferenceRun, HeadingLevel,
    ImageRun, LevelFormat, Packer, Paragraph, Table, TableCell, TableRow, TextRun, WidthType,
  } = docx;
  const HEADING = [null, HeadingLevel.HEADING_1, HeadingLevel.HEADING_2, HeadingLevel.HEADING_3, HeadingLevel.HEADING_4];
  const LIST_TYPES = ["bullet_list", "task_list", "ordered_list"];

  const inlineToRuns = (content, footState) => {
    const runs = [];
    for (const node of content || []) {
      if (node.type === "text") {
        const marks = Object.fromEntries((node.marks || []).map((m) => [m.type, m.attrs || true]));
        const opts = { text: node.text };
        if (marks.bold) opts.bold = true;
        if (marks.italic) opts.italics = true;
        if (marks.underline) opts.underline = {};
        if (marks.strike) opts.strike = true;
        if (marks.code) opts.font = "Courier New";
        const run = new TextRun(opts);
        runs.push(marks.link ? new ExternalHyperlink({ children: [run], link: marks.link.href }) : run);
      } else if (node.type === "image") {
        const src = node.attrs.src || "";
        if (src.startsWith("data:image/png;base64,")) {
          runs.push(new ImageRun({
            data: b64ToBytes(src.slice("data:image/png;base64,".length)),
            type: "png",
            transformation: { width: 96, height: 64 },
            altText: { title: node.attrs.alt || "", description: node.attrs.alt || "", name: node.attrs.ref || "img" },
          }));
        }
      } else if (node.type === "footnote") {
        const id = footState.next++;
        footState.notes[id] = { children: [new Paragraph({ children: inlineToRuns(node.content, footState).filter((r) => r instanceof TextRun || r instanceof ExternalHyperlink) })] };
        runs.push(new FootnoteReferenceRun(id));
      } else if (node.type === "hard_break") {
        runs.push(new TextRun({ break: 1 }));
      }
    }
    return runs;
  };

  const listToDocx = (list, level, footState, out) => {
    const reference = list.type === "ordered_list" ? "draft-num" : "draft-bullet";
    for (const li of list.content || []) {
      const children = li.content || [];
      const first = children[0];
      const runs = inlineToRuns(first && first.content, footState);
      if (list.type === "task_list") runs.unshift(new TextRun(li.attrs && li.attrs.checked ? "[x] " : "[ ] "));
      out.push(new Paragraph({ numbering: { reference, level }, children: runs }));
      for (const rest of children.slice(1)) if (LIST_TYPES.includes(rest.type)) listToDocx(rest, level + 1, footState, out);
    }
  };

  const blockToDocx = (node, footState, out) => {
    switch (node.type) {
      case "heading":
        out.push(new Paragraph({ heading: HEADING[node.attrs.level], children: inlineToRuns(node.content, footState) }));
        break;
      case "paragraph":
        out.push(new Paragraph({ children: inlineToRuns(node.content, footState) }));
        break;
      case "blockquote":
        for (const child of node.content || []) blockToDocx(child, footState, out);
        break;
      case "code_block":
        out.push(new Paragraph({ children: [new TextRun({ text: (node.content || []).map((t) => t.text).join(""), font: "Courier New" })] }));
        break;
      case "bullet_list":
      case "task_list":
      case "ordered_list":
        listToDocx(node, 0, footState, out);
        break;
      case "table":
        out.push(new Table({
          width: { size: 100, type: WidthType.PERCENTAGE },
          rows: (node.content || []).map((row) => new TableRow({
            children: (row.content || []).map((cell) => {
              const paras = [];
              for (const child of cell.content || []) blockToDocx(child, footState, paras);
              return new TableCell({ children: paras.length ? paras : [new Paragraph("")] });
            }),
          })),
        }));
        break;
      case "horizontal_rule":
        out.push(new Paragraph({ thematicBreak: true }));
        break;
      default:
        out.push(new Paragraph({ children: [new TextRun("")] }));
    }
  };

  const footState = { next: 1, notes: {} };
  const children = [];
  for (const block of docJSON.content || []) blockToDocx(block, footState, children);
  const doc = new Document({
    numbering: {
      config: [
        { reference: "draft-bullet", levels: [0, 1, 2, 3].map((level) => ({ level, format: LevelFormat.BULLET, text: "•", alignment: AlignmentType.LEFT })) },
        { reference: "draft-num", levels: [0, 1, 2, 3].map((level) => ({ level, format: LevelFormat.DECIMAL, text: `%${level + 1}.`, alignment: AlignmentType.LEFT })) },
      ],
    },
    footnotes: footState.notes,
    sections: [{ children }],
  });
  return await Packer.toBlob(doc);
}

// ==== begin io/import.mjs ====
// io/import.mjs — DOCX import (Batch E). mammoth's only browser build is UMD
// (its +esm transform fails to initialise in the browser), so it loads LAZILY
// via a dynamically-injected pinned script the first time a .docx is opened:
// the CSP allows cdn.jsdelivr.net for external scripts, a dynamic script needs
// no inline hash and never sits in the static file (so the single-file
// plain-script screen stays satisfied), and a document that is never imported
// from .docx pays no cold-open cost.
//
// The extracted HTML passes the ONE sanitised ingress (sanitizeToSchema, L4):
// macros, embedded OLE objects and external references never reach the schema
// (mammoth extracts only document text/structure, and the sanitiser drops
// anything else). Every loss is itemised for the Import-notes panel (§10).

const MAMMOTH_URL = "https://cdn.jsdelivr.net/npm/mammoth@1.12.1/mammoth.browser.min.js";
let mammothLoading = null;

function loadMammoth() {
  if (typeof window !== "undefined" && window.mammoth) return Promise.resolve(window.mammoth);
  if (mammothLoading) return mammothLoading;
  mammothLoading = new Promise((resolve, reject) => {
    const s = document.createElement("script");
    s.src = MAMMOTH_URL;
    s.onload = () => (window.mammoth ? resolve(window.mammoth) : reject(new Error("the DOCX reader failed to initialise")));
    s.onerror = () => reject(new Error("could not load the DOCX reader"));
    document.head.appendChild(s);
  });
  return mammothLoading;
}

// mammoth emits footnote refs as <sup><a href="#…footnote-N"> with the bodies
// in a trailing <ol>; rebuild them as the schema's footnote atoms (marked
// <sup data-footnote>) before the parse, and drop the footnote <ol>.
function liftFootnotes(html) {
  const d = new DOMParser().parseFromString(html, "text/html");
  const notes = {};
  for (const li of d.querySelectorAll("li[id]")) {
    const m = li.id.match(/footnote-(\d+)$/);
    if (!m) continue;
    const clone = li.cloneNode(true);
    clone.querySelectorAll('a[href^="#"]').forEach((a) => a.remove());
    notes[m[1]] = clone.textContent.trim();
  }
  for (const a of d.querySelectorAll('sup a[href*="footnote"]')) {
    const m = (a.getAttribute("href") || "").match(/footnote-(\d+)$/);
    if (!m || notes[m[1]] === undefined) continue;
    const sup = a.closest("sup") || a;
    const rep = d.createElement("sup");
    rep.setAttribute("data-footnote", "true");
    rep.textContent = notes[m[1]];
    sup.replaceWith(rep);
  }
  for (const ol of d.querySelectorAll("ol")) if (ol.querySelector('li[id*="footnote"]')) ol.remove();
  return d.body.innerHTML;
}

// Import a .docx. `input` is an ArrayBuffer or a Uint8Array. Returns
// { doc, notes, messages } — notes is the itemised loss list for the
// Import-notes panel (the standing DOCX caveats + mammoth's per-file warnings
// + the sanitiser's own losses).
async function importDocx(input) {
  const mammoth = await loadMammoth();
  const arrayBuffer = input instanceof ArrayBuffer ? input : input.buffer.slice(input.byteOffset, input.byteOffset + input.byteLength);
  const res = await mammoth.convertToHtml({ arrayBuffer }, { styleMap: ["u => u"], idPrefix: "dr" });
  const html = liftFootnotes(res.value);
  const clean = sanitizeToSchema(html, { kind: "html" });
  const notes = [];
  // Standing DOCX caveats (§10): what Draft's schema deliberately cannot carry.
  notes.push({ code: "docx-stripped", message: "Macros, embedded OLE objects and external references are not imported." });
  // mammoth's per-conversion warnings (unmapped styles, dropped elements…).
  for (const m of res.messages || []) if (m.type === "warning") notes.push({ code: "docx-warning", message: m.message });
  // The sanitiser's own itemised losses (unknown nodes, unsafe hrefs…).
  for (const n of clean.notes || []) notes.push(n);
  return { doc: clean.doc, notes, messages: res.messages || [] };
}
// ==== end io/import.mjs ====

// ==== begin io/image.mjs ====
// io/image.mjs — image import: re-encode through a canvas to strip embedded
// metadata (EXIF / XMP / PNG tEXt) before the image enters the document
// (handoff §10 — offered, default on). Re-drawing to a canvas and re-encoding
// to PNG keeps only the pixels: every ancillary chunk (camera model, GPS,
// author, timestamps) is dropped, so nothing rides silently into a shared
// file. Returns the sanitised bytes + a data URI for display + the mime.
//
// This module touches only DOM imaging APIs (createImageBitmap / canvas /
// FileReader) — no engine, no storage transport.

function blobToDataURI(blob) {
  return new Promise((resolve, reject) => {
    const r = new FileReader();
    r.onload = () => resolve(r.result);
    r.onerror = () => reject(new Error("could not read the image"));
    r.readAsDataURL(blob);
  });
}

// bytes: Uint8Array of the source image. When strip is false the original
// bytes pass through unchanged (the user declined re-encoding); when true
// (the default) the image is redrawn and re-encoded to PNG, dropping metadata.
async function reencodeImage(bytes, mime = "image/png", { strip = true } = {}) {
  const u = bytes instanceof Uint8Array ? bytes : new Uint8Array(bytes);
  const inputBlob = new Blob([u], { type: mime });
  if (!strip) {
    return { bytes: u, dataURI: await blobToDataURI(inputBlob), mime };
  }
  const bitmap = await createImageBitmap(inputBlob);
  const canvas = document.createElement("canvas");
  canvas.width = bitmap.width;
  canvas.height = bitmap.height;
  canvas.getContext("2d").drawImage(bitmap, 0, 0);
  if (bitmap.close) bitmap.close();
  const outBlob = await new Promise((resolve, reject) =>
    canvas.toBlob((b) => (b ? resolve(b) : reject(new Error("image re-encode failed"))), "image/png")
  );
  const outBytes = new Uint8Array(await outBlob.arrayBuffer());
  return { bytes: outBytes, dataURI: await blobToDataURI(outBlob), mime: "image/png" };
}
// ==== end io/image.mjs ====

// ==== begin io/open.mjs ====
// io/open.mjs — the file-open flow (Batch F): the browser's own file picker
// and drag-and-drop, routed to the one sanitised import machinery built in E.
// This module reads bytes off disk and CLASSIFIES them; it never touches the
// storage transport (L3) and never imports the engine (L5). The caller wires
// each kind to `window.__draft.importDocx / importMarkdown / importImage` (or
// the open-a-.draft.json path) — the single ingress stays sole.

const IMAGE_MIME = {
  png: "image/png", jpg: "image/jpeg", jpeg: "image/jpeg",
  gif: "image/gif", webp: "image/webp", svg: "image/svg+xml",
};

// Classify a filename by extension: what ingress its bytes belong to.
// Returns { kind, mime? }. `draft` = open a native `.draft.json` document;
// `markdown`/`docx`/`image` = import; `unknown` = unsupported.
function classifyFile(name) {
  const lower = String(name || "").toLowerCase();
  if (lower.endsWith(".draft.json")) return { kind: "draft" };
  if (lower.endsWith(".md") || lower.endsWith(".markdown") || lower.endsWith(".txt")) return { kind: "markdown" };
  if (lower.endsWith(".docx")) return { kind: "docx" };
  const ext = lower.slice(lower.lastIndexOf(".") + 1);
  if (IMAGE_MIME[ext]) return { kind: "image", mime: IMAGE_MIME[ext] };
  return { kind: "unknown" };
}

// The accept list for the picker / <input> fallback (kept in one place).
const OPEN_ACCEPT = ".draft.json,.md,.markdown,.txt,.docx,.png,.jpg,.jpeg,.gif,.webp,.svg";

async function fileToRecord(file) {
  return { name: file.name, bytes: new Uint8Array(await file.arrayBuffer()) };
}

// Open the browser's file picker (showOpenFilePicker when present, a hidden
// <input type=file> otherwise) and return the chosen files as
// [{name, bytes}]. Returns [] when the user dismisses the picker.
async function pickFiles({ multiple = false } = {}) {
  if (typeof window !== "undefined" && typeof window.showOpenFilePicker === "function") {
    let handles;
    try {
      handles = await window.showOpenFilePicker({ multiple });
    } catch (e) {
      if (e && e.name === "AbortError") return [];
      throw e;
    }
    return Promise.all(handles.map(async (h) => fileToRecord(await h.getFile())));
  }
  // Fallback: a transient <input type=file>. Resolves [] if nothing is picked.
  return new Promise((resolve) => {
    const input = document.createElement("input");
    input.type = "file";
    input.accept = OPEN_ACCEPT;
    if (multiple) input.multiple = true;
    input.style.position = "fixed";
    input.style.left = "-9999px";
    let settled = false;
    const finish = async () => {
      if (settled) return;
      settled = true;
      const files = [...(input.files || [])];
      input.remove();
      resolve(await Promise.all(files.map(fileToRecord)));
    };
    input.addEventListener("change", finish, { once: true });
    // A cancel fires no 'change'; the window focus returning is the signal.
    window.addEventListener("focus", () => setTimeout(finish, 300), { once: true });
    document.body.appendChild(input);
    input.click();
  });
}

// Read files out of a drop's DataTransfer as [{name, bytes}].
async function readDataTransfer(dataTransfer) {
  const files = dataTransfer && dataTransfer.files ? [...dataTransfer.files] : [];
  return Promise.all(files.map(fileToRecord));
}

// Wire drag-and-drop onto an element: dragover shows the drop affordance,
// drop reads the files and hands them to onFiles([{name,bytes}]). Returns an
// unwire function. Errors reading a drop go to onError.
function wireDropTarget(el, onFiles, { onError, activeClass = "dr-drop-active" } = {}) {
  let depth = 0;
  const over = (e) => {
    if (![...(e.dataTransfer && e.dataTransfer.types || [])].includes("Files")) return;
    e.preventDefault();
    e.dataTransfer.dropEffect = "copy";
  };
  const enter = (e) => {
    if (![...(e.dataTransfer && e.dataTransfer.types || [])].includes("Files")) return;
    e.preventDefault();
    if (depth++ === 0) el.classList.add(activeClass);
  };
  const leave = () => {
    if (depth > 0 && --depth === 0) el.classList.remove(activeClass);
  };
  const drop = async (e) => {
    if (![...(e.dataTransfer && e.dataTransfer.types || [])].includes("Files")) return;
    e.preventDefault();
    depth = 0;
    el.classList.remove(activeClass);
    try {
      const files = await readDataTransfer(e.dataTransfer);
      if (files.length) await onFiles(files);
    } catch (err) {
      if (onError) onError(err);
    }
  };
  el.addEventListener("dragover", over);
  el.addEventListener("dragenter", enter);
  el.addEventListener("dragleave", leave);
  el.addEventListener("drop", drop);
  return () => {
    el.removeEventListener("dragover", over);
    el.removeEventListener("dragenter", enter);
    el.removeEventListener("dragleave", leave);
    el.removeEventListener("drop", drop);
  };
}

function readLocale() {
  try {
    const v = localStorage.getItem(LOCALE_KEY);
    if (v && LOCALES.includes(v)) return v;
  } catch {}
  return "en";
}

let CURRENT = readLocale();

function getLocale() {
  return CURRENT;
}

// Persist the choice; the caller reloads to rebuild the chrome (the honest,
// simplest re-render — the document is already safe on disk via autosave).
function setLocale(loc) {
  if (!LOCALES.includes(loc)) return CURRENT;
  CURRENT = loc;
  try {
    localStorage.setItem(LOCALE_KEY, loc);
  } catch {}
  return CURRENT;
}

function interpolate(str, params) {
  if (!params) return str;
  return str.replace(/\{(\w+)\}/g, (_, k) => (k in params ? String(params[k]) : `{${k}}`));
}

// t(key, params?) — active locale → en fallback → the key itself.
function t(key, params) {
  const table = STRINGS[CURRENT] || STRINGS.en;
  const raw = key in table ? table[key] : key in STRINGS.en ? STRINGS.en[key] : key;
  return interpolate(raw, params);
}
// ==== end ui/i18n.mjs ====

// ==== begin ui/keyboard-guard.mjs ====
// ui/keyboard-guard.mjs — the keyboard guard (handoff §8 / Build Doctrine):
// app-level shortcuts must never fire while the user is typing in a text
// surface. The editing set (⌘B, ⌘K, …) lives INSIDE the ProseMirror keymap
// and only ever sees editor keystrokes; this guard protects everything the
// SHELL binds at window level (today: "?" for help).
//
// Pure module: no DOM globals; takes the event target so it is node-testable.

// True when `target` is a surface that consumes plain keystrokes.
function isTextInputTarget(target) {
  if (!target) return false;
  const tag = typeof target.tagName === "string" ? target.tagName.toUpperCase() : "";
  if (tag === "INPUT" || tag === "TEXTAREA" || tag === "SELECT") return true;
  if (target.isContentEditable) return true;
  return false;
}

// True when an app-level shortcut may act on this keydown: the key matches,
// no modifier is held, and focus is not inside a text surface.
function appShortcutAllowed(event, key) {
  if (event.key !== key) return false;
  if (event.metaKey || event.ctrlKey || event.altKey) return false;
  return !isTextInputTarget(event.target);
}
// ==== end ui/keyboard-guard.mjs ====

// ==== begin ui/status-line.mjs ====
// ui/status-line.mjs — the one line above the page (handoff §8):
// title · words · saved-state · version. Word/char/reading-time counts live
// here; storage failures render as a status-line banner — never a modal.
//
// DOM factory + pure helpers (the helpers are node-tested).
//
// The saved-state passed in is a STABLE English token ("saved" / "not saved" /
// "editing…" / "thinking…") — it drives the dirty logic and is translated only
// for display (Batch J i18n), so the comparison stays locale-independent.


// Reading time at ~200 wpm; 0 words reads as 0 (the segment is hidden).
function readingMinutes(words) {
  return words > 0 ? Math.max(1, Math.round(words / 200)) : 0;
}

function formatCount(n) {
  return n.toLocaleString("en-IN");
}

// Map the internal saved-state token to its localised display string.
function savedDisplay(saved) {
  if (saved === "saved") return t("status.saved");
  if (saved === "not saved") return t("status.notSaved");
  if (saved === "editing…") return t("status.editing");
  if (saved === "thinking…") return t("status.thinking");
  return saved;
}

// The status segments, in order. Pure: returns strings, no DOM.
function statusSegments({ title, words, chars, saved, version }) {
  const mins = readingMinutes(words);
  const counts =
    words > 0
      ? t("status.words", { words: formatCount(words), chars: formatCount(chars), mins })
      : t("status.zeroWords");
  return [title, counts, savedDisplay(saved), version];
}

function createStatusLine(el) {
  let errorText = null;

  // Ink tiers (§8 status hierarchy): title and any not-yet-saved state carry
  // the darker ink; counts sit at the base tint; the version is dimmest.
  function render(segments, dirty) {
    const classes = ["dr-title", "dr-counts", "dr-state" + (dirty ? " dr-dirty" : ""), "dr-version"];
    el.textContent = "";
    segments.forEach((seg, i) => {
      if (i > 0) {
        const sep = document.createElement("span");
        sep.className = "dr-sep";
        sep.textContent = "·";
        el.appendChild(sep);
      }
      const span = document.createElement("span");
      span.className = classes[i] || "";
      span.textContent = seg;
      el.appendChild(span);
    });
  }

  return {
    // Normal update; suppressed while an error banner is showing. `saved` is the
    // English token; dirty is read from it before display translation.
    update(parts) {
      if (errorText !== null) return;
      render(statusSegments(parts), parts.saved !== "saved");
    },
    // Storage failure banner: takes over the line until cleared by the next
    // successful save. In-app, in-place — never a modal (handoff §8).
    error(message) {
      errorText = message;
      el.classList.add("dr-error-banner");
      el.textContent = message;
    },
    clearError() {
      if (errorText === null) return;
      errorText = null;
      el.classList.remove("dr-error-banner");
    },
    get hasError() {
      return errorText !== null;
    },
  };
}
// ==== end ui/status-line.mjs ====

// ==== begin ui/rail.mjs ====
// ui/rail.mjs — the 44px left rail (handoff §8): a quiet icon strip that
// expands on hover/focus (≤150ms; prefers-reduced-motion honoured in CSS).
// It carries the command surface: marks, link, find, headings, lists,
// footnote, tables. Sidecar affordances are ABSENT until the Sidecar chunk
// ships them — nothing on the rail promises what the product cannot do yet.
// The same rule shapes the table group: its row/column commands exist only
// while the caret is in a table (absent, not dimmed).
//
// The glyphs are type, not iconography — the type is the interface. Only
// the link and find buttons use small SVGs (static trusted markup).
//
// A11y (§8, Batch J): the rail is a role="toolbar"; it is ONE Tab stop with a
// roving tabindex — Arrow Up/Down move between the visible commands, Home/End
// jump to the ends. Labels come from the locale table (ui/i18n.mjs).


const LINK_SVG =
  '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" aria-hidden="true">' +
  '<path d="M6.6 9.4l2.8-2.8"/>' +
  '<path d="M7.6 4.6l1.2-1.2a2.4 2.4 0 013.4 3.4l-1.2 1.2"/>' +
  '<path d="M8.4 11.4l-1.2 1.2a2.4 2.4 0 01-3.4-3.4l1.2-1.2"/></svg>';

const FIND_SVG =
  '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" aria-hidden="true">' +
  '<circle cx="7" cy="7" r="4"/>' +
  '<path d="M10 10l3.2 3.2"/></svg>';

const TABLE_SVG =
  '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" aria-hidden="true">' +
  '<rect x="2.5" y="3.5" width="11" height="9" rx="0.5"/>' +
  '<path d="M2.5 6.5h11M7.2 6.5v6M10.9 6.5v6"/></svg>';

const DOCS_SVG =
  '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' +
  '<path d="M2 4.5A1 1 0 013 3.5h3l1.3 1.4H13a1 1 0 011 1V12a1 1 0 01-1 1H3a1 1 0 01-1-1z"/></svg>';

const SETTINGS_SVG =
  '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' +
  '<circle cx="8" cy="8" r="2.1"/>' +
  '<path d="M8 1.6v1.8M8 12.6v1.8M14.4 8h-1.8M3.4 8H1.6M12.5 3.5l-1.3 1.3M4.8 11.2l-1.3 1.3M12.5 12.5l-1.3-1.3M4.8 4.8L3.5 3.5"/></svg>';

// The sidecar affordance (Batch H). A spark, not a robot — the help is quiet
// and optional. It DIMS (never hides) when no model is available; clicking it
// still opens the panel, which says how to install a bridge or add a key.
const SPARK_SVG =
  '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' +
  '<path d="M8 2.4l1.05 2.95 2.95 1.05-2.95 1.05L8 10.4 6.95 7.45 4 6.4l2.95-1.05z"/>' +
  '<path d="M12.5 10.6l.45 1.25 1.25.45-1.25.45-.45 1.25-.45-1.25-1.25-.45 1.25-.45z"/></svg>';

// One item per row. glyphHTML is static markup authored here (trusted).
// `when` gates presence on the active states ("absent, not dimmed"):
//   undefined → always shown · "in-table" → only inside a table ·
//   "no-table" → only outside one.
function railItems(isMac) {
  const mod = isMac ? "⌘" : "Ctrl+";
  const alt = isMac ? "⌥" : "Alt+";
  const shift = isMac ? "⇧" : "Shift+";
  return [
    { id: "documents", label: t("rail.documents"), glyphHTML: DOCS_SVG },
    { gap: true },
    { id: "bold", label: t("rail.bold"), kbd: `${mod}B`, glyphHTML: "<strong>B</strong>", state: "bold" },
    { id: "italic", label: t("rail.italic"), kbd: `${mod}I`, glyphHTML: "<em>I</em>", state: "italic" },
    { id: "underline", label: t("rail.underline"), kbd: `${mod}U`, glyphHTML: "<u>U</u>", state: "underline" },
    { id: "link", label: t("rail.link"), kbd: `${mod}K`, glyphHTML: LINK_SVG, state: "link" },
    { id: "find", label: t("rail.find"), kbd: `${mod}F`, glyphHTML: FIND_SVG },
    { gap: true },
    { id: "h1", label: t("rail.h1"), kbd: `${mod}${alt}1`, glyphHTML: "<strong>H1</strong>", state: "h1" },
    { id: "h2", label: t("rail.h2"), kbd: `${mod}${alt}2`, glyphHTML: "<strong>H2</strong>", state: "h2" },
    { id: "h3", label: t("rail.h3"), kbd: `${mod}${alt}3`, glyphHTML: "<strong>H3</strong>", state: "h3" },
    { id: "h4", label: t("rail.h4"), kbd: `${mod}${alt}4`, glyphHTML: "<strong>H4</strong>", state: "h4" },
    { gap: true },
    { id: "bullet", label: t("rail.bullet"), kbd: `${mod}${shift}8`, glyphHTML: "•", state: "bulletList" },
    { id: "ordered", label: t("rail.ordered"), kbd: `${mod}${shift}7`, glyphHTML: "1.", state: "orderedList" },
    { id: "footnote", label: t("rail.footnote"), glyphHTML: "†", state: "footnote" },
    { gap: true },
    { id: "sidecar", label: t("rail.sidecar"), glyphHTML: SPARK_SVG },
    { gap: true },
    { id: "table", label: t("rail.table"), glyphHTML: TABLE_SVG, when: "no-table" },
    { id: "rowBelow", label: t("rail.rowBelow"), glyphHTML: "+R", when: "in-table" },
    { id: "colRight", label: t("rail.colRight"), glyphHTML: "+C", when: "in-table" },
    { id: "delRow", label: t("rail.delRow"), glyphHTML: "−R", when: "in-table" },
    { id: "delCol", label: t("rail.delCol"), glyphHTML: "−C", when: "in-table" },
    { id: "headerRow", label: t("rail.headerRow"), glyphHTML: "<strong>TH</strong>", when: "in-table" },
    { id: "delTable", label: t("rail.delTable"), glyphHTML: "×", when: "in-table" },
    { gap: true },
    { id: "settings", label: t("rail.settings"), glyphHTML: SETTINGS_SVG },
  ];
}

// Map activeStates() (adapter) onto per-item pressed booleans.
function pressedStates(states) {
  return {
    bold: !!states.bold,
    italic: !!states.italic,
    underline: !!states.underline,
    link: !!states.link,
    footnote: !!states.footnote,
    h1: states.heading === 1,
    h2: states.heading === 2,
    h3: states.heading === 3,
    h4: states.heading === 4,
    bulletList: !!states.bulletList,
    orderedList: !!states.orderedList,
  };
}

function createRail(host, { commands, onLink, onFind, onFootnote, onDocuments, onSettings, onSidecar, isMac }) {
  const actions = {
    documents: () => onDocuments && onDocuments(),
    settings: () => onSettings && onSettings(),
    sidecar: () => onSidecar && onSidecar(),
    bold: () => commands.bold(),
    italic: () => commands.italic(),
    underline: () => commands.underline(),
    link: () => onLink(),
    find: () => onFind(),
    footnote: () => onFootnote(),
    h1: () => commands.heading(1),
    h2: () => commands.heading(2),
    h3: () => commands.heading(3),
    h4: () => commands.heading(4),
    bullet: () => commands.bulletList(),
    ordered: () => commands.orderedList(),
    table: () => commands.insertTable({ rows: 3, cols: 3, header: true }),
    rowBelow: () => commands.addRowAfter(),
    colRight: () => commands.addColumnAfter(),
    delRow: () => commands.deleteRow(),
    delCol: () => commands.deleteColumn(),
    headerRow: () => commands.toggleHeaderRow(),
    delTable: () => commands.deleteTable(),
  };

  const buttons = new Map(); // state key -> button (pressed refresh)
  const gated = []; // { el, when } (presence refresh)
  const allButtons = []; // every command button, in DOM order (roving tabindex)
  let sidecarBtn = null; // dimmed until a model is known available (ground floor)
  for (const item of railItems(isMac)) {
    if (item.gap) {
      const gap = document.createElement("div");
      gap.className = "dr-gap";
      host.appendChild(gap);
      if (item.when) gated.push({ el: gap, when: item.when });
      continue;
    }
    const btn = document.createElement("button");
    btn.type = "button";
    btn.setAttribute("aria-label", item.label);
    btn.tabIndex = -1; // roving: exactly one button is the Tab stop (set below)
    if (item.state) btn.setAttribute("aria-pressed", "false");
    btn.dataset.cmd = item.id;
    const glyph = document.createElement("span");
    glyph.className = "dr-glyph";
    glyph.innerHTML = item.glyphHTML;
    glyph.setAttribute("aria-hidden", "true");
    const label = document.createElement("span");
    label.className = "dr-label";
    label.textContent = item.label;
    btn.append(glyph, label);
    if (item.kbd) {
      const kbd = document.createElement("span");
      kbd.className = "dr-kbd";
      kbd.textContent = item.kbd;
      btn.appendChild(kbd);
    }
    btn.addEventListener("click", () => actions[item.id]());
    host.appendChild(btn);
    allButtons.push(btn);
    if (item.state) buttons.set(item.state, btn);
    if (item.when) gated.push({ el: btn, when: item.when });
    if (item.id === "sidecar") {
      sidecarBtn = btn;
      btn.classList.add("dr-dim"); // ground floor: dim until a model is found
    }
  }

  // ---- roving tabindex (§8 a11y) -------------------------------------------
  // The toolbar is ONE Tab stop; arrows move within it. Exactly one visible
  // button carries tabindex 0. Focusing a button by any means makes it the stop.
  const visibleButtons = () => allButtons.filter((b) => !b.hidden);
  function setRoving(target) {
    for (const b of allButtons) b.tabIndex = b === target ? 0 : -1;
  }
  function repairRoving() {
    const vis = visibleButtons();
    if (!vis.length) return;
    if (!allButtons.some((b) => b.tabIndex === 0 && !b.hidden)) setRoving(vis[0]);
  }
  setRoving(visibleButtons()[0]);
  for (const b of allButtons) b.addEventListener("focus", () => setRoving(b));
  host.addEventListener("keydown", (e) => {
    if (!["ArrowDown", "ArrowUp", "Home", "End"].includes(e.key)) return;
    const vis = visibleButtons();
    if (!vis.length) return;
    let idx = vis.indexOf(document.activeElement);
    if (idx < 0) idx = 0;
    let next;
    if (e.key === "ArrowDown") next = vis[(idx + 1) % vis.length];
    else if (e.key === "ArrowUp") next = vis[(idx - 1 + vis.length) % vis.length];
    else if (e.key === "Home") next = vis[0];
    else next = vis[vis.length - 1];
    e.preventDefault();
    setRoving(next);
    next.focus();
  });

  return {
    refresh(states) {
      const pressed = pressedStates(states);
      for (const [key, btn] of buttons) btn.setAttribute("aria-pressed", String(!!pressed[key]));
      for (const g of gated) g.el.hidden = g.when === "in-table" ? !states.inTable : !!states.inTable;
      repairRoving(); // a gated command that just hid must not hold the Tab stop
    },
    // Un-dim the sidecar affordance once detection finds a rung; re-dim when
    // none remain (handoff §7 — dim, never hide).
    setSidecarAvailable(available) {
      if (sidecarBtn) sidecarBtn.classList.toggle("dr-dim", !available);
    },
  };
}
// ==== end ui/rail.mjs ====

// ==== begin ui/panels.mjs ====
// ui/panels.mjs — in-app cards: the ⌘/Ctrl+K link prompt and the keyboard
// help card ("?"). In-app prompts ONLY — no native dialogs, no blocking
// modal (handoff §8). Esc dismisses; the page stays interactive.
// Strings come from the locale table (ui/i18n.mjs); the help card carries the
// privacy statement verbatim (§14, Batch J).


function createLinkPrompt(host, { onApply, onClose }) {
  const card = document.createElement("div");
  card.className = "dr-card";
  card.hidden = true;
  card.setAttribute("role", "dialog");
  card.setAttribute("aria-label", t("link.title"));

  const title = document.createElement("h2");
  title.textContent = t("link.title");
  const input = document.createElement("input");
  input.type = "text";
  input.placeholder = t("link.placeholder");
  input.setAttribute("aria-label", t("link.aria"));
  const note = document.createElement("div");
  note.className = "dr-note";
  note.textContent = t("link.note");
  card.append(title, input, note);
  host.appendChild(card);

  function close() {
    if (card.hidden) return;
    card.hidden = true;
    if (onClose) onClose();
  }

  input.addEventListener("keydown", (e) => {
    if (e.key === "Enter") {
      e.preventDefault();
      const href = input.value.trim();
      card.hidden = true;
      onApply(href.length ? href : null);
    } else if (e.key === "Escape") {
      e.preventDefault();
      close();
    }
  });

  return {
    open(prefill) {
      card.hidden = false;
      input.value = prefill || "";
      input.focus();
      input.select();
    },
    close,
    get isOpen() {
      return !card.hidden;
    },
  };
}

// The footnote card (Batch D): inserts a footnote at the cursor, or rewrites
// the selected one. Plain text at v1 — the card IS the footnote editor (the
// node is an atom; no nested contenteditable, L8).
function createFootnotePrompt(host, { onApply, onClose }) {
  const card = document.createElement("div");
  card.className = "dr-card";
  card.hidden = true;
  card.setAttribute("role", "dialog");
  card.setAttribute("aria-label", t("footnote.title"));

  const title = document.createElement("h2");
  title.textContent = t("footnote.title");
  const input = document.createElement("input");
  input.type = "text";
  input.placeholder = t("footnote.placeholder");
  input.setAttribute("aria-label", t("footnote.aria"));
  const note = document.createElement("div");
  note.className = "dr-note";
  card.append(title, input, note);
  host.appendChild(card);

  let editing = false;

  function close() {
    if (card.hidden) return;
    card.hidden = true;
    if (onClose) onClose();
  }

  input.addEventListener("keydown", (e) => {
    if (e.key === "Enter") {
      e.preventDefault();
      const text = input.value.trim();
      card.hidden = true;
      onApply(text.length ? text : null);
    } else if (e.key === "Escape") {
      e.preventDefault();
      close();
    }
  });

  return {
    // prefill: existing footnote text (editing) or null (inserting new).
    open(prefill) {
      editing = prefill != null;
      card.hidden = false;
      note.textContent = editing ? t("footnote.noteEdit") : t("footnote.noteNew");
      input.value = prefill || "";
      input.focus();
      input.select();
    },
    close,
    get isOpen() {
      return !card.hidden;
    },
    get editing() {
      return editing;
    },
  };
}

function createHelpCard(host, { isMac }) {
  const mod = isMac ? "⌘" : "Ctrl+";
  const alt = isMac ? "⌥" : "Alt+";
  const shift = isMac ? "⇧" : "Shift+";
  const rows = [
    [t("help.biu"), `${mod}B · ${mod}I · ${mod}U`],
    [t("help.link"), `${mod}K`],
    [t("help.find"), `${mod}F`],
    [t("help.headings"), `${mod}${alt}1–4`],
    [t("help.lists"), `${mod}${shift}7 · ${mod}${shift}8`],
    [t("help.indent"), `Tab · ${shift}Tab`],
    [t("help.cell"), `Tab · ${shift}Tab`],
    [t("help.footnote"), "Enter"],
    [t("help.undo"), `${mod}Z · ${mod}${shift}Z`],
    [t("help.markdown"), "# · - · 1. · > · ``` · --- · **b** · *i* · `c` · ~~s~~"],
    [t("help.thisHelp"), "?"],
  ];

  const card = document.createElement("div");
  card.className = "dr-card dr-card-help";
  card.hidden = true;
  card.setAttribute("role", "dialog");
  card.setAttribute("aria-label", t("help.title"));

  const title = document.createElement("h2");
  title.textContent = t("help.title");
  const table = document.createElement("table");
  for (const [what, keys] of rows) {
    const tr = document.createElement("tr");
    const td1 = document.createElement("td");
    td1.textContent = what;
    const td2 = document.createElement("td");
    td2.className = "dr-kbd-col";
    td2.textContent = keys;
    tr.append(td1, td2);
    table.appendChild(tr);
  }
  // The privacy statement, verbatim (§14). Its own element so it reads as one
  // block; the README carries the identical text.
  const privacy = document.createElement("div");
  privacy.className = "dr-note dr-help-privacy";
  privacy.textContent = t("help.privacy");
  const note = document.createElement("div");
  note.className = "dr-note";
  note.textContent = t("help.escCloses");
  card.append(title, table, privacy, note);
  host.appendChild(card);

  return {
    open() {
      card.hidden = false;
    },
    close() {
      card.hidden = true;
    },
    toggle() {
      card.hidden = !card.hidden;
    },
    get isOpen() {
      return !card.hidden;
    },
  };
}

// The empty-state line: one dim sentence + "?" (handoff §8). No mascot. The
// sentence is the seam into the Documents panel — clicking it (or Enter/Space)
// opens the folder view; the "?" opens keyboard help.
function createEmptyHint(host, { onHelp, onOpen }) {
  const hint = document.createElement("div");
  hint.id = "hint";
  hint.hidden = true;
  const text = document.createElement("span");
  text.textContent = t("hint.text");
  if (onOpen) {
    text.setAttribute("role", "button");
    text.setAttribute("tabindex", "0");
    text.style.cursor = "pointer";
    text.addEventListener("click", onOpen);
    text.addEventListener("keydown", (e) => {
      if (e.key === "Enter" || e.key === " ") {
        e.preventDefault();
        onOpen();
      }
    });
  }
  const help = document.createElement("button");
  help.type = "button";
  help.textContent = "?";
  help.setAttribute("aria-label", t("hint.helpAria"));
  help.addEventListener("click", onHelp);
  hint.append(text, help);
  host.appendChild(hint);
  return {
    setVisible(v) {
      hint.hidden = !v;
    },
    get visible() {
      return !hint.hidden;
    },
  };
}

// The Import-notes panel (Batch E, the owed IO UX): an itemised, per-import
// loss list. In-app, never native, never blocking — it reports what an import
// could not carry (DOCX macros/OLE/external refs, unmapped styles, sanitiser
// drops) without standing between the writer and the page. Esc/Done dismiss.
function createImportNotes(host, { onClose } = {}) {
  const card = document.createElement("div");
  card.className = "dr-card dr-card-notes";
  card.hidden = true;
  card.setAttribute("role", "dialog");
  card.setAttribute("aria-label", t("notes.title"));

  const title = document.createElement("h2");
  title.textContent = t("notes.title");
  const intro = document.createElement("div");
  intro.className = "dr-note";
  const list = document.createElement("ul");
  list.className = "dr-notes-list";
  const done = document.createElement("button");
  done.type = "button";
  done.className = "dr-notes-done";
  done.textContent = t("settings.done");

  function close() {
    if (card.hidden) return;
    card.hidden = true;
    if (onClose) onClose();
  }
  done.addEventListener("click", close);
  card.append(title, intro, list, done);
  host.appendChild(card);

  return {
    // notes: [{code, message}]; source: the file name / kind, for the intro.
    show(notes, { source } = {}) {
      list.textContent = "";
      const n = notes.length;
      intro.textContent = t("notes.intro", {
        source: source || t("notes.defaultSource"),
        count: n,
        noteWord: n === 1 ? t("notes.note") : t("notes.notes"),
      });
      for (const note of notes) {
        const li = document.createElement("li");
        li.textContent = note.message;
        list.appendChild(li);
      }
      card.hidden = false;
      done.focus();
    },
    close,
    get isOpen() {
      return !card.hidden;
    },
  };
}

// ==== begin ui/documents.mjs ====
// ui/documents.mjs — the Documents panel (Batch F): the folder view over the
// Crate folder. Lists the documents on disk (newest first — the recents),
// opens one, creates a new one, renames one (re-pinning its filename), opens a
// file from disk through the import machinery, and downloads the current
// document. In-app card only (handoff §8) — the sole native dialog is the
// browser's own folder/file picker the callbacks reach. Esc / Done dismiss.


function fmtWhen(mtime) {
  if (!mtime) return "";
  const d = new Date(mtime);
  const now = new Date();
  const sameDay = d.toDateString() === now.toDateString();
  if (sameDay) return d.toLocaleTimeString(undefined, { hour: "2-digit", minute: "2-digit" });
  return d.toLocaleDateString(undefined, { month: "short", day: "numeric" });
}

function createDocumentsPanel(host, cbs) {
  const {
    fsaSupported = false,
    storageLabel = () => "",
    documents = () => [],
    activeName = () => null,
    onOpen, onNew, onRename, onChooseFolder, onOpenFile, onExport,
  } = cbs;

  const card = document.createElement("div");
  card.className = "dr-card dr-card-docs";
  card.hidden = true;
  card.setAttribute("role", "dialog");
  card.setAttribute("aria-label", t("docs.title"));

  const title = document.createElement("h2");
  title.textContent = t("docs.title");

  // Storage location + folder grant.
  const loc = document.createElement("div");
  loc.className = "dr-docs-loc";
  const locText = document.createElement("span");
  locText.className = "dr-note";
  const chooseBtn = document.createElement("button");
  chooseBtn.type = "button";
  chooseBtn.className = "dr-docs-choose";
  chooseBtn.textContent = t("docs.choose");
  chooseBtn.addEventListener("click", () => onChooseFolder && onChooseFolder());
  loc.append(locText);
  if (fsaSupported) loc.append(chooseBtn);

  // Actions: new document, open a file from disk.
  const actions = document.createElement("div");
  actions.className = "dr-docs-actions";
  const newBtn = document.createElement("button");
  newBtn.type = "button";
  newBtn.className = "dr-docs-new";
  newBtn.textContent = t("docs.new");
  newBtn.addEventListener("click", async () => {
    await onNew();
    close();
  });

      when.textContent = fmtWhen(d.mtime);
      openB.append(nm, when);
      openB.addEventListener("click", async () => {
        await onOpen(d.name);
        close();
      });

      const renameB = document.createElement("button");
      renameB.type = "button";
      renameB.className = "dr-docs-rename";
      renameB.textContent = t("docs.rename");
      renameB.setAttribute("aria-label", t("docs.renameAria", { name: d.name }));
      renameB.addEventListener("click", () => beginRename(li, d.name));

      li.append(openB, renameB);
      list.appendChild(li);
    }
  }

  // Inline rename: the row becomes an input prefilled with the name. Enter
  // applies (re-pinning the filename), Esc cancels. Never a native prompt.
  function beginRename(li, oldName) {
    li.textContent = "";
    li.classList.add("dr-docs-renaming");
    const input = document.createElement("input");
    input.type = "text";
    input.className = "dr-docs-rename-input";

    input.setAttribute("aria-label", t("docs.renameInputAria", { name: oldName }));
    const err = document.createElement("span");
    err.className = "dr-note dr-docs-rename-err";
    li.append(input, err);
    input.focus();
    input.select();
    input.addEventListener("keydown", async (e) => {
      if (e.key === "Enter") {
        e.preventDefault();
        const next = input.value.trim();
        if (!next || next === oldName) return renderList();
        try {
          await onRename(oldName, next);
          renderList();
        } catch (ex) {
          err.textContent = ex && ex.message ? ex.message : t("docs.renameFailed");
        }
      } else if (e.key === "Escape") {
        e.preventDefault();
        e.stopPropagation();
        renderList();
      }
    });
  }

  function refresh() {
    locText.textContent = storageLabel();
    renderList();
  }

  function close() {
    if (card.hidden) return;
    card.hidden = true;
    if (cbs.onClose) cbs.onClose();
  }

  return {
    open() {
      refresh();
      card.hidden = false;
      done.focus();
    },
    close,
    refresh,
    get isOpen() {
      return !card.hidden;
    },
  };

// ui/find-panel.mjs — the find/replace card (Batch D). ⌘/Ctrl+F opens it —
// the deliberate Batch C deferral ends with this file. In-app, never native,
// never modal-blocking: the page stays interactive, Esc closes. Matches are
// painted by the adapter's find plugin; replacements go through the sole
// write path. The regex toggle compiles the user's pattern; an invalid
// pattern is reported in the count slot, never thrown.


function createFindPanel(host, { search, onClose }) {
  const card = document.createElement("div");
  card.className = "dr-card dr-card-find";
  card.hidden = true;
  card.setAttribute("role", "dialog");
  card.setAttribute("aria-label", t("find.title"));

  const title = document.createElement("h2");
  title.textContent = t("find.title");

  const findRow = document.createElement("div");
  findRow.className = "dr-find-row";
  const findInput = document.createElement("input");
  findInput.type = "text";
  findInput.placeholder = t("find.placeholder");
  findInput.setAttribute("aria-label", t("find.aria"));
  const count = document.createElement("span");
  count.className = "dr-find-count";
  count.setAttribute("role", "status");
  findRow.append(findInput, count);

  const replaceRow = document.createElement("div");
  replaceRow.className = "dr-find-row";
  const replaceInput = document.createElement("input");
  replaceInput.type = "text";
  replaceInput.placeholder = t("find.replacePlaceholder");
  replaceInput.setAttribute("aria-label", t("find.replaceAria"));
  replaceRow.append(replaceInput);

  const controls = document.createElement("div");
  controls.className = "dr-find-controls";
  const mkBtn = (text, label, onClick) => {
    const b = document.createElement("button");
    b.type = "button";
    b.textContent = text;
    b.setAttribute("aria-label", label);
    b.addEventListener("click", onClick);
    return b;
  };
  const prevBtn = mkBtn("‹", t("find.prevAria"), () => render(search.step(-1)));
  const nextBtn = mkBtn("›", t("find.nextAria"), () => render(search.step(1)));
  const replaceBtn = mkBtn(t("find.replace"), t("find.replaceMatchAria"), () => render(search.replaceActive(replaceInput.value)));
  const allBtn = mkBtn(t("find.all"), t("find.replaceAllAria"), () => {
    const n = search.replaceAll(replaceInput.value);
    render(search.state());
    if (n) count.textContent = t("find.replaced", { n });
  });
  const regexLabel = document.createElement("label");
  regexLabel.className = "dr-find-toggle";
  const regexBox = document.createElement("input");
  regexBox.type = "checkbox";
  regexBox.setAttribute("aria-label", t("find.regexAria"));
  regexLabel.append(regexBox, document.createTextNode(".*"));
  regexLabel.title = t("find.regexAria");
  const caseLabel = document.createElement("label");
  caseLabel.className = "dr-find-toggle";
  const caseBox = document.createElement("input");
  caseBox.type = "checkbox";
  caseBox.setAttribute("aria-label", t("find.caseAria"));
  caseLabel.append(caseBox, document.createTextNode("Aa"));
  caseLabel.title = t("find.caseAria");
  controls.append(prevBtn, nextBtn, replaceBtn, allBtn, regexLabel, caseLabel);

  const note = document.createElement("div");
  note.className = "dr-note";
  note.textContent = t("find.note");

  card.append(title, findRow, replaceRow, controls, note);
  host.appendChild(card);

  function render(state) {
    if (state.error) {
      count.textContent = t("find.badPattern");
      count.title = state.error;
      return;
    }
    count.title = "";
    count.textContent =
      state.count === 0
        ? state.query
          ? t("find.ofNone")
          : ""
        : t("find.ofCount", { active: state.active + 1, count: state.count });
  }

  function run() {
    render(search.set({ query: findInput.value, regex: regexBox.checked, caseSensitive: caseBox.checked }));
  }

  findInput.addEventListener("input", run);
  regexBox.addEventListener("change", run);
  caseBox.addEventListener("change", run);

  function close() {
    if (card.hidden) return;
    card.hidden = true;
    search.clear();
    if (onClose) onClose();
  }

  card.addEventListener("keydown", (e) => {
    if (e.key === "Escape") {
      e.preventDefault();
      close();
      return;
    }
    if (e.key === "Enter" && e.target === findInput) {
      e.preventDefault();
      render(search.step(e.shiftKey ? -1 : 1));
    } else if (e.key === "Enter" && e.target === replaceInput) {
      e.preventDefault();
      render(search.replaceActive(replaceInput.value));
    }
  });

  return {
    open() {
      card.hidden = false;
      findInput.focus();
      findInput.select();
      if (findInput.value) run();
    },
    close,
    get isOpen() {
      return !card.hidden;
    },
  };
}

// ==== begin ui/outline.mjs ====
// ui/outline.mjs — the outline sidebar (Batch D): the document's headings on
// the rail's opposite edge, same idiom — a quiet strip of desk substance
// that expands on hover/focus. Collapsed, each heading is a small rule whose
// length carries its level; expanded, the heading text appears, indented.
// Hidden entirely when the document has no headings (absent, not dimmed —
// the Batch C rail decision). Click (or Enter) jumps the caret there.
//
// host is a <nav aria-label="Outline"> — the §8 a11y requirement.


// Stable signature of an outline (skip DOM rebuilds when nothing changed).
function outlineSignature(items) {
  return items.map((h) => `${h.level}:${h.pos}:${h.text}`).join("\n");
}

function createOutline(host, { getOutline, onJump }) {
  let lastSig = null;

  function rebuild(items) {
    host.textContent = "";
    for (const h of items) {
      const btn = document.createElement("button");
      btn.type = "button";
      btn.className = `dr-ol-item dr-ol-l${h.level}`;
      btn.setAttribute("aria-label", t("outline.jumpTo", { text: h.text || t("outline.emptyHeading") }));
      const tick = document.createElement("span");
      tick.className = "dr-ol-tick";
      tick.setAttribute("aria-hidden", "true");
      const label = document.createElement("span");
      label.className = "dr-ol-label";
      label.textContent = h.text || t("outline.emptyHeading");
      btn.append(tick, label);
      btn.addEventListener("click", () => onJump(h.pos));
      host.appendChild(btn);
    }
  }

  return {
    refresh() {
      const items = getOutline();
      host.hidden = items.length === 0;
      const sig = outlineSignature(items);
      if (sig === lastSig) return;
      lastSig = sig;
      rebuild(items);
    },
  };
}

// ==== begin ui/print.mjs ====
// ui/print.mjs — drive @page size + margins from the document's page metadata
// (handoff §8). Browsers implement @page size/margins, but NOT CSS paged-media
// running headers/footers with page numbers, nor page-bottom footnotes — those
// limits are documented in the README; here we do the achievable half. The
// edit goes through CSSOM (delete + reinsert the single @page rule), never a
// dynamically-injected <style> element, which the pinned style-src CSP blocks.

const SIZES = { A4: "A4", Letter: "letter", Legal: "legal" };

// Locate the one CSSPageRule and the sheet + index that hold it.
function findPageRule() {
  for (const sheet of document.styleSheets) {
    let rules;
    try {
      rules = sheet.cssRules;
    } catch {
      continue; // cross-origin sheet; skip
    }
    for (let i = 0; i < rules.length; i++) {
      const rule = rules[i];
      if (rule && rule.constructor && rule.constructor.name === "CSSPageRule") return { sheet, index: i };
    }
  }
  return null;
}

// Normalise a margins array [top, right, bottom, left] (mm) → a CSS value.
function marginValue(margins) {
  const m = Array.isArray(margins) && margins.length === 4 ? margins : [25, 20, 25, 20];
  return m.map((v) => `${Number(v) || 0}mm`).join(" ");
}

// Apply the document's page metadata to @page. Returns the effective
// { size, margin } (for tests/observability), or null when no @page rule
// exists. Idempotent: each call rewrites the single @page rule in place.
function applyPageMetadata(page) {
  const found = findPageRule();
  if (!found) return null;
  const size = SIZES[page && page.size] || "A4";
  const margin = marginValue(page && page.margins);
  const { sheet, index } = found;
  sheet.deleteRule(index);
  sheet.insertRule(`@page { size: ${size}; margin: ${margin}; }`, index);
  return { size, margin };
}

// ==== begin ui/sidecar.mjs ====
// ui/sidecar.mjs — the sidecar surface (Batch H). Two pieces, both in-app cards
// (handoff §8, no native dialogs): the SIDECAR PANEL (the three actions, model
// status, the "what will be sent" preview, the whole-document opt-in, and the
// BYOK key vault) and the REVIEW BAR (hunk-by-hunk accept/reject over a staged
// diff). The panel dims — never hides — when no model is available, and states
// the ground truth: "install bridge or add key". Nothing here calls a model or
// the network; it invokes callbacks the boot controller owns.
// Strings come from the locale table (ui/i18n.mjs); the BYOK note is the
// sidecar's own privacy line (the fuller statement lives in the help card, §14).


const SIDECAR_SPARK_SVG =
  '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' +
  '<path d="M8 2.2l1.1 3.1 3.1 1.1-3.1 1.1L8 10.6 6.9 7.5 3.8 6.4l3.1-1.1z"/>' +
  '<path d="M12.6 10.4l.5 1.4 1.4.5-1.4.5-.5 1.4-.5-1.4-1.4-.5 1.4-.5z"/></svg>';

const ACTIONS = [
  { id: "rewrite", needs: "selection" },
  { id: "continue", needs: "caret" },
  { id: "summarise", needs: "doc" },
];

function createSidecar(host, opts = {}) {
  const {
    actions = {},
    previewFor = () => null,
    refreshLadder = async () => ({ rungs: [] }),
    canRewrite = () => false,
    hasDoc = () => false,
    wholeDoc = { get: () => false, set: () => {} },
    byok = {},
    staging = { state: () => ({ active: false }) },
    onClose = () => {},
  } = opts;

  let ladder = null;

  // ---- the panel ----------------------------------------------------------
  const card = document.createElement("div");
  card.className = "dr-card dr-card-sidecar";
  card.hidden = true;
  card.setAttribute("role", "dialog");
  card.setAttribute("aria-label", t("sidecar.title"));

  const title = document.createElement("h2");
  title.textContent = t("sidecar.title");

  const status = document.createElement("div");
  status.className = "dr-note dr-sidecar-status";

  const actionList = document.createElement("div");
  actionList.className = "dr-sidecar-actions";
  const actionButtons = new Map();
  for (const a of ACTIONS) {
    const btn = document.createElement("button");
    btn.type = "button";
    btn.className = "dr-sidecar-action";
    btn.dataset.action = a.id;
    btn.textContent = t(`sidecar.${a.id}`);
    btn.addEventListener("click", () => invoke(a.id));
    btn.addEventListener("mouseenter", () => showPreview(a.id));
    btn.addEventListener("focus", () => showPreview(a.id));
    actionList.appendChild(btn);
    actionButtons.set(a.id, btn);
  }

  // Whole-document opt-in (handoff §7: explicit, with the byte count shown).
  const wholeRow = document.createElement("label");
  wholeRow.className = "dr-set-row dr-sidecar-whole";
  const wholeBox = document.createElement("input");
  wholeBox.type = "checkbox";
  wholeBox.className = "dr-sidecar-whole-box";
  wholeBox.setAttribute("aria-label", t("sidecar.wholeDocAria"));
  const wholeLabel = document.createElement("span");
  wholeLabel.textContent = t("sidecar.wholeDoc");
  wholeRow.append(wholeBox, wholeLabel);
  wholeBox.addEventListener("change", () => {
    wholeDoc.set(wholeBox.checked);
    showPreview(currentPreviewMode || "rewrite");
  });

  // "What will be sent" — the hovered/focused action's exact payload + where it
  // goes. The one honest window into every byte that leaves the page.
  const preview = document.createElement("div");
  preview.className = "dr-sidecar-preview";
  preview.hidden = true;
  const previewScope = document.createElement("div");
  previewScope.className = "dr-sidecar-preview-scope";
  const previewDest = document.createElement("div");
  previewDest.className = "dr-sidecar-preview-dest";
  const previewText = document.createElement("pre");
  previewText.className = "dr-sidecar-preview-text";
  const previewCap = document.createElement("div");
  previewCap.className = "dr-note";
  previewCap.textContent = t("sidecar.previewCap");
  preview.append(previewScope, previewDest, previewText);

  // ---- BYOK vault ---------------------------------------------------------
  const byokWrap = document.createElement("details");
  byokWrap.className = "dr-sidecar-byok";
  const byokSummary = document.createElement("summary");
  byokSummary.textContent = t("sidecar.byokSummary");
  byokWrap.appendChild(byokSummary);
  const byokNote = document.createElement("div");
  byokNote.className = "dr-note";
  byokNote.textContent = t("sidecar.byokNote");
  const providerSel = document.createElement("select");
  providerSel.className = "dr-sidecar-provider";
  providerSel.setAttribute("aria-label", t("sidecar.providerAria"));
  for (const [id, p] of Object.entries(byok.providers || {})) {
    const opt = document.createElement("option");
    opt.value = id;
    opt.textContent = p.label;
    providerSel.appendChild(opt);
  }
  const keyInput = document.createElement("input");
  keyInput.type = "password";
  keyInput.className = "dr-sidecar-key";
  keyInput.placeholder = t("sidecar.keyPlaceholder");
  keyInput.setAttribute("aria-label", t("sidecar.keyAria"));
  const keySave = document.createElement("button");
  keySave.type = "button";
  keySave.className = "dr-sidecar-key-save";
  keySave.textContent = t("sidecar.saveKey");
  const keyList = document.createElement("div");
  keyList.className = "dr-sidecar-keys";
  keySave.addEventListener("click", async () => {
    const key = keyInput.value.trim();
    if (!key || !byok.save) return;
    await byok.save(providerSel.value, key);
    keyInput.value = "";
    await refreshKeys();
    await refresh();
  });
  byokWrap.append(byokNote, providerSel, keyInput, keySave, keyList);

  const done = document.createElement("button");
  done.type = "button";
  done.className = "dr-notes-done";
  done.textContent = t("sidecar.done");
  done.addEventListener("click", close);

  card.append(title, status, actionList, wholeRow, previewCap, preview, byokWrap, done);
  host.appendChild(card);

  // ---- the review bar (staged-diff navigation) ----------------------------
  const bar = document.createElement("div");
  bar.className = "dr-review-bar";
  bar.hidden = true;
  bar.setAttribute("role", "status");
  const barCount = document.createElement("span");
  barCount.className = "dr-review-count";
  const barKeys = document.createElement("span");
  barKeys.className = "dr-review-keys";
  barKeys.textContent = t("sidecar.reviewKeys");
  const barBtns = document.createElement("span");
  barBtns.className = "dr-review-btns";
  const mk = (label, fn, cls) => {
    const b = document.createElement("button");
    b.type = "button";
    b.className = "dr-review-btn" + (cls ? " " + cls : "");
    b.textContent = label;
    b.addEventListener("click", fn);
    return b;
  };
  barBtns.append(
    mk(t("sidecar.accept"), () => staging.acceptHunk && staging.acceptHunk(), "dr-review-accept"),
    mk(t("sidecar.reject"), () => staging.rejectHunk && staging.rejectHunk(), "dr-review-reject"),
    mk(t("sidecar.acceptAll"), () => staging.acceptAll && staging.acceptAll()),
    mk(t("sidecar.discard"), () => staging.discard && staging.discard())
  );
  bar.append(barCount, barBtns, barKeys);
  host.appendChild(bar);

  // ---- behaviour ----------------------------------------------------------
  let currentPreviewMode = null;

  function showPreview(mode) {
    currentPreviewMode = mode;
    const p = previewFor(mode, { wholeDoc: wholeBox.checked });
    if (!p) {
      preview.hidden = true;
      return;
    }
    preview.hidden = false;
    // The scope/destination/payload strings are the canonical "what will be
    // sent" text built in sidecar/context.mjs — kept as the exact, single source
    // of truth for the bytes that leave the page (not re-localised, so the
    // preview and the payload can never drift). The remote destination is
    // detected from that text.
    previewScope.textContent = p.scope;
    previewDest.textContent = p.destination;
    previewDest.className = "dr-sidecar-preview-dest" + (/leaves this device/.test(p.destination) ? " dr-sidecar-remote" : "");
    previewText.textContent = p.text || "(nothing to send)";
  }

  async function invoke(id) {
    const fn = actions[id];
    if (!fn) return;
    const btn = actionButtons.get(id);
    if (btn && btn.classList.contains("dr-dim")) return; // dim = unavailable
    close();
    await fn({ wholeDoc: wholeBox.checked });
  }

  // Dim (never hide) the actions and the whole panel per the ground-floor rule.
  function paintLadder() {
    const rungs = (ladder && ladder.rungs) || [];
    const has = rungs.length > 0;
    card.classList.toggle("dr-sidecar-nomodel", !has);
    if (!has) {
      status.textContent = t("sidecar.noModel");
    } else {
      status.textContent = ladder.ready
        ? t("sidecar.modelReady", { rungs: rungs.join(", ") })
        : t("sidecar.modelNeedsDownload", { rungs: rungs.join(", ") });
    }
    for (const a of ACTIONS) {
      const btn = actionButtons.get(a.id);
      const applicable = a.needs === "selection" ? canRewrite() : a.needs === "doc" ? hasDoc() : true;
      const usable = has && applicable;
      btn.classList.toggle("dr-dim", !usable);
      btn.setAttribute("aria-disabled", String(!usable));
      btn.title = !has ? t("sidecar.hintInstall") : !applicable ? (a.needs === "selection" ? t("sidecar.hintSelect") : t("sidecar.hintEmpty")) : "";
    }
  }

  async function refreshKeys() {
    if (!byok.list) return;
    const list = await byok.list();
    keyList.textContent = "";
    if (!list.length) {
      const none = document.createElement("div");
      none.className = "dr-note";
      none.textContent = t("sidecar.noKey");
      keyList.appendChild(none);
      return;
    }
    for (const rec of list) {
      const row = document.createElement("div");
      row.className = "dr-sidecar-key-row";
      const fp = document.createElement("span");
      fp.textContent = `${rec.provider} · ${rec.fingerprint}`;
      const rm = document.createElement("button");
      rm.type = "button";
      rm.className = "dr-sidecar-key-remove";
      rm.textContent = t("sidecar.remove");
      rm.addEventListener("click", async () => {
        if (byok.clear) await byok.clear(rec.provider);
        await refreshKeys();
        await refresh();
      });
      row.append(fp, rm);
      keyList.appendChild(row);
    }
  }

  async function refresh() {
    wholeBox.checked = !!wholeDoc.get();
    // Detection runs ONLY here — on an explicit open/refresh, never on boot.
    try {
      ladder = await refreshLadder();
    } catch {
      ladder = { rungs: [] };
    }
    paintLadder();
    await refreshKeys();
  }

  // The review bar reflects the adapter's staging state; boot pumps this on
  // every editor update.
  function refreshReview() {
    const s = staging.state();
    if (!s || !s.active) {
      bar.hidden = true;
      return;
    }
    bar.hidden = false;
    const total = s.hunks.length;
    const at = Math.min(s.cursor + 1, total);
    barCount.textContent = total === 1 ? t("sidecar.oneChange") : t("sidecar.changeOf", { at, total });
  }

  function close() {
    if (card.hidden) return;
    card.hidden = true;
    preview.hidden = true;
    onClose();
  }

  return {
    async open() {
      card.hidden = false;
      await refresh();
      const first = actionButtons.get("rewrite");
      if (first) first.focus();
    },
    close,
    refresh,
    refreshReview,
    get isOpen() {
      return !card.hidden;
    },
    get reviewOpen() {
      return !bar.hidden;
    },
  };
}
// ==== end ui/sidecar.mjs ====

const VERSION = document.querySelector('meta[name="draft-version"]').content;
const IS_MAC = /Mac|iPhone|iPad/.test(navigator.platform);
// i18n (Batch J): reflect the active UI locale on <html lang> and the two rail
// aria hosts. Document text stays script-agnostic; this is the chrome's language
// only. The choice persists (localStorage "draft:locale") and a change reloads.
document.documentElement.lang = getLocale();

const pageEl = document.getElementById("page");

let docTitle = "untitled";

  const stats = ed.docStats();
  statusLine.update({ title: docTitle, words: stats.words, chars: stats.chars, saved: savedState, version: VERSION });
  syncHostTitle();

// ---- NakliOS host integration (Batch I) -----------------------------------
// The vendored naklios SDK is a no-op standalone (window.parent === window); in
// Immersive it lets Draft feel native. We keep the host window title in step
// with the document, honour the host theme (adopting its accent into Draft's
// ONE accent token), and flush the autosaver before a host-initiated close.
// naklios.ready() fires at the end of boot.
let lastHostTitle = "";
function syncHostTitle() {
  const dirty = savedState !== "saved";
  const t = `Draft — ${docTitle}${dirty ? " •" : ""}`;
  if (t === lastHostTitle) return;
  lastHostTitle = t;
  try { window.naklios.title(t); } catch {}
}
function applyHostTheme(theme) {
  if (!theme) return;
  const root = document.documentElement;
  if (theme.id) root.setAttribute("data-nakl-theme", String(theme.id));
  if (theme.mood) root.setAttribute("data-nakl-mood", String(theme.mood));
  // The single safe restyle: adopt the host accent into Draft's one accent
  // token when it is a valid hex — respects the host without disturbing the
  // paper. (A full host-driven dark paper is future work; recorded in STATE.)
  const accent = theme.colors && (theme.colors.accent || theme.colors.primary);
  if (typeof accent === "string" && /^#([0-9a-f]{3}|[0-9a-f]{6})$/i.test(accent)) root.style.setProperty("--dr-accent", accent);
}
