// ---- document session (Batch F) -------------------------------------------
// The app holds ONE active document at a time; opening/creating/renaming
// switches the session. `store` is the Crate façade; `file` the in-memory v1
// envelope; `saver` the autosaver pinned to the active document's filename.
// Assets are per-document (cleared on every activate — a stable object so the
// importImage/_assetBytesB64 closures never dangle).
let store = null;
let file = null;
let name = null;
let saver = null;
let assetSeq = 0;
const sessionAssets = {};
let docList = []; // documentEntries(store.list()) cache for the folder view

function onSaveError(e) {
  statusLine.error(t("banner.saveFailed", { message: e.message }));
}

async function refreshDocList() {
  try {
    docList = documentEntries(await store.list());
  } catch {
    docList = [];
  }
}

async function refreshDocListAndPanel() {
  await refreshDocList();
  if (documentsPanel.isOpen) documentsPanel.refresh();
}

function buildSaver() {
  saver = createAutosaver({
    store,
    snapshot: () => {
      file.doc = ed.getDocJSON();
      file.history.head = ed.historyHead();
      return { file, markdown: ed.serializeMarkdown(), assets: sessionAssets };
    },
    onSaved: (result) => {
      statusLine.clearError();
      savedState = "saved";
      refreshStatus();
      void refreshDocListAndPanel();
      emitSave(result);
    },
    onError: onSaveError,
  });
}

// Switch the active document: flush any pending save, load the doc, reset the
// per-document assets, and re-pin a fresh autosaver to the new filename.
async function activate(newFile, newName, { saved, empty = false } = {}) {
  if (saver && (saver.pending || saver.saving)) {
    try { await saver.flush(); } catch {}
  }
  file = newFile;
  for (const k of Object.keys(sessionAssets)) delete sessionAssets[k];
  assetSeq = 0;
  if (empty) ed.loadEmpty();
  else ed.loadDoc(file.doc);
  applyPageMetadata(file.draft && file.draft.page);
  buildSaver();
  saver.pinName(newName);
  name = newName;
  docTitle = (file.draft.title || "").trim() || saver.name || "untitled";
  savedState = saved ? "saved" : "not saved";
  refreshUI();
}

async function openDoc(idOrPath) {
  const path = String(idOrPath).endsWith(".draft.json") ? idOrPath : `${idOrPath}.draft.json`;
  const opened = await openDocument({ store, path, migrate });
  if (!opened) throw new Error(`no document at ${path}`);
  const clean = sanitizeToSchema(opened.file.doc, { kind: "json" });
  opened.file.doc = clean.doc;
  await activate(opened.file, path.replace(/\.draft\.json$/, ""), { saved: true });
  await refreshDocList();
}

async function newDoc(rawName) {
  const nm = rawName ? cleanDocName(rawName) : nextUntitled(await store.list());
  const f = newDraftFile({ app: VERSION });
  f.draft.title = nm;
  await activate(f, nm, { saved: false, empty: true });
  saver.touch(); // persist the new (empty) document so it joins the recents
  return nm;
}

// Rename a document, re-pinning the filename (the title stays metadata, §5).
// Renaming the active document rebuilds its saver on the new name; renaming a
// listed-but-inactive one just moves its files. Throws surface in the panel.
async function renameDoc(oldName, newRaw) {
  const to = cleanDocName(newRaw);
  if (!to || to === oldName) return;
  if (name === oldName && saver && (saver.pending || saver.saving)) {
    try { await saver.flush(); } catch {}
  }
  await renameDocument(store, oldName, to);
  if (name === oldName) {
    name = to;
    // When the title only ever tracked the auto filename, keep them in sync so
    // the rename shows through; a title the user has set apart is left alone.
    if ((file.draft.title || "").trim() === oldName) file.draft.title = to;
    buildSaver();
    saver.pinName(to);
    docTitle = (file.draft.title || "").trim() || to;
    refreshStatus();
    saver.touch();
  }
  await refreshDocList();
}

// The one native dialog the sovereignty posture allows: the browser's own
// folder picker. Planting the current document into the chosen folder makes
// good on the empty-state promise — "your documents on your disk".
async function chooseFolder() {
  let newStore;
  try {
    newStore = await pickDirectoryStore({});
  } catch (e) {
    if (e && e.name === "AbortError") return; // the user dismissed the picker
    statusLine.error(t("banner.folderUnavailable", { message: e.message }));
    return;
  }
  if (saver && (saver.pending || saver.saving)) {
    try { await saver.flush(); } catch {}
  }
  const old = store;
  store = newStore;
  buildSaver();
  saver.pinName(name);
  saver.touch();
  try { await old.close(); } catch {}
  await refreshDocList();
  documentsPanel.refresh();
  statusLine.clearError();
}

// Import operations (Batch E machinery). importDocx/importMarkdown REPLACE the
// active document's content; importImage INSERTS at the cursor. Each dispatches
// through the sole write path (L4) and touches autosave.
async function doImportDocx(bytes, { source } = {}) {
  const { doc: imported, notes } = await importDocx(bytes);
  ed.loadDoc(imported);
  savedState = "editing…";
  refreshUI();
  saver.touch();
  if (notes.length) importNotes.show(notes, { source });
  return notes;
}

function doImportMarkdown(text) {
  const clean = sanitizeToSchema(text, { kind: "markdown" });
  ed.loadDoc(clean.doc);
  savedState = "editing…";
  refreshUI();
  saver.touch();
  return clean.notes;
}

async function doImportImage(bytes, { mime = "image/png", reencode = true, alt = "" } = {}) {
  const u = bytes instanceof Uint8Array ? bytes : new Uint8Array(bytes);
  const out = await reencodeImage(u, mime, { strip: reencode });
  const ref = `img-${String(++assetSeq).padStart(2, "0")}`;
  sessionAssets[ref] = { bytes: out.bytes, mime: out.mime };
  ed.commands.insertImage({ src: out.dataURI, alt, ref });
  savedState = "editing…";
  refreshUI();
  saver.touch();
  return { ref, mime: out.mime, bytes: out.bytes.length };
}

// The file-open flow: picker/drop bytes classified and routed to the one
// sanitised ingress. docx/markdown/.draft.json OPEN as a fresh document (never
// clobbering the current one); an image INSERTS into the current document.
async function ingestFile({ name: fileName, bytes }) {
  const c = classifyFile(fileName);
  const base = uniqueDocName(await store.list(), String(fileName).replace(/\.(docx|md|markdown|txt)$/i, "").replace(/\.draft\.json$/i, ""));
  if (c.kind === "docx") {
    await newDoc(base);
    await doImportDocx(bytes, { source: fileName });
    return c.kind;
  }
  if (c.kind === "markdown") {
    await newDoc(base);
    doImportMarkdown(new TextDecoder().decode(bytes));
    return c.kind;
  }
  if (c.kind === "image") {
    await doImportImage(bytes, { mime: c.mime });
    return c.kind;
  }
  if (c.kind === "draft") {
    const migrated = migrate(JSON.parse(new TextDecoder().decode(bytes)));
    const clean = sanitizeToSchema(migrated.file.doc, { kind: "json" });
    migrated.file.doc = clean.doc;
    await activate(migrated.file, base, { saved: false });
    saver.touch();
    return c.kind;
  }
  statusLine.error(t("banner.cannotOpenType", { name: fileName }));
  return "unknown";
}

async function openFileFlow() {
  let files;
  try {
    files = await pickFiles({ multiple: false });
  } catch (e) {
    statusLine.error(t("banner.couldNotOpenFile", { message: e.message }));
    return;
  }
  for (const f of files) await ingestFile(f);
}

// Export the active document to disk: a user-initiated download of THEIR file
// to THEIR disk — the product's purpose, not an external send.
const DL_EXT = { md: "md", html: "html", json: "json", docx: "docx" };
async function downloadExport(kind) {
  let blob;
  try {
    blob = await exportBlob(kind, ed.getDocJSON());
  } catch (e) {
    statusLine.error(t("banner.exportFailed", { message: e.message }));
    return null;
  }
  const filename = `${name || "untitled"}.${DL_EXT[kind] || kind}`;
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 10000);
  return { filename, size: blob.size, type: blob.type };
}

function storeLabel() {
  if (!store) return "";
  // A folder grant names the folder; otherwise the documents live in this
  // browser (OPFS/IndexedDB) — said plainly, no storage-backend jargon.
  return store.label ? t("docs.folder", { name: store.label }) : t("docs.thisBrowser");
}

// ---- agent face (Batch G) -------------------------------------------------
// window.draft is the §6 machine actor: read + apply-transaction + export, and
// nothing more — it CANNOT toggle settings, grant a folder, or read keys (no
// such method is exposed). Every transaction it dispatches is tagged
// actor:"api" + origin, visible in History. Behind the Developer setting (off
// by default, persisted per machine). BroadcastChannel("draft") carries the
// same {type, payload, origin} messages as on("change"|"save", fn).
const DEV_KEY = "draft:developer";
const apiListeners = { change: new Set(), save: new Set() };
let channel = null;

function apiOrigin() {
  return typeof location !== "undefined" && location.origin && location.origin !== "null" ? location.origin : "draft-local";
}

function developerEnabled() {
  try {
    return localStorage.getItem(DEV_KEY) === "1";
  } catch {
    return false;
  }
}

function broadcast(type, payload) {
  const msg = { type, payload, origin: apiOrigin() };
  for (const fn of apiListeners[type] || []) {
    try { fn(msg); } catch {}
  }
  if (channel) {
    try { channel.postMessage(msg); } catch {}
  }
}
function emitChange(info) {
  broadcast("change", { txId: info && info.txId != null ? info.txId : null, actor: (info && info.actor) || "owner", origin: (info && info.origin) || "ui" });
}
function emitSave(result) {
  broadcast("save", { name: (result && result.name) || name });
}

// The frozen §6 surface. Frozen so a caller cannot bolt capabilities onto it.
function agentFace() {
  return Object.freeze({
    version: VERSION,
    documents: () => docList.map((d) => ({ id: d.name, name: d.name, mtime: d.mtime })),
    open: (id) => openDoc(id),
    active: () => ({ id: name, name, title: (file.draft.title || "").trim() || name }),
    getDoc: () => ed.getDocJSON(),
    getText: (range) => (range && typeof range.from === "number" ? ed.textBetween(range.from, range.to == null ? range.from : range.to) : ed.docText()),
    outline: () => ed.outline(),
    applyTransaction: (steps) => ed.applyTransaction(steps, { actor: "api", origin: apiOrigin() }),
    replaceRange: (from, to, textOrJSON) => ed.replaceRange(from, to, textOrJSON, { actor: "api", origin: apiOrigin() }),
    find: (q, opts) => ed.findMatches(q, opts || {}),
    export: (kind) => exportBlob(kind, ed.getDocJSON()),
    on: (event, fn) => {
      if (!apiListeners[event]) throw new Error(`draft.on: unknown event "${event}" (use "change" or "save")`);
      apiListeners[event].add(fn);
      return () => apiListeners[event].delete(fn);
    },
  });
}

function installAgentFace() {
  if (!channel && typeof BroadcastChannel !== "undefined") channel = new BroadcastChannel("draft");
  window.draft = agentFace();
}
function uninstallAgentFace() {
  try { delete window.draft; } catch { window.draft = undefined; }
  // Disabling the setting means the API is fully off: drop its listeners and
  // close the channel so nothing keeps emitting after the toggle.
  apiListeners.change.clear();
  apiListeners.save.clear();
  if (channel) {
    try { channel.close(); } catch {}
    channel = null;
  }
}

// The developer toggle: persist the choice per machine, install/remove the API.
// Only the app UI (the Settings card) and the internal __draft test face call
// this — never window.draft itself.
function setDeveloper(on) {
  try { localStorage.setItem(DEV_KEY, on ? "1" : "0"); } catch {}
  if (on) installAgentFace();
  else uninstallAgentFace();
  if (settings) settings.refresh();
}

const documentsPanel = createDocumentsPanel(document.body, {
  fsaSupported: folderPickerSupported(),
  storageLabel: storeLabel,
  documents: () => docList.map((d) => ({ ...d, active: d.name === name })),
  activeName: () => name,
  onOpen: (nm) => openDoc(nm),
  onNew: () => newDoc(),
  onRename: (oldName, newName) => renameDoc(oldName, newName),
  onChooseFolder: () => chooseFolder(),
  onOpenFile: () => openFileFlow(),
  onExport: (kind) => downloadExport(kind),
  onClose: () => ed.focus(),
});

async function openDocumentsPanel() {
  await refreshDocList();
  documentsPanel.open();
}

// Settings card (Batch G + Batch J): the Language selector (en/hi) and the
// Developer toggle that exposes window.draft. Changing the language persists the
// choice, flushes any pending save, and reloads so the chrome rebuilds in the
// new locale — the document is safe on disk (autosave), so a reload never loses
// work. Document text is untouched.
async function changeLocale(loc) {
  if (loc === getLocale()) return;
  setLocale(loc);
  if (saver && (saver.pending || saver.saving)) {
    try { await saver.flush(); } catch {}
  }
  location.reload();
}
const settings = createSettings(document.body, {
  isEnabled: developerEnabled,
  onToggle: (on) => setDeveloper(on),
  onLocale: (loc) => changeLocale(loc),
  onClose: () => ed.focus(),
});

// ---- sidecar (Batch H) ----------------------------------------------------
// Optional, staged-diff-only writing help (handoff §7 / L6). The ground floor
// is zero-AI: nothing here runs — no detection, no network — until an explicit
// action (opening the panel or firing a shortcut). Detection walks the Edge-
// First ladder (bridge → WebGPU → BYOK, L7); a proposal is shown as a staged
// diff and only an accepted result is written, attributed to the Owner.
let sidecarWholeDoc = false;
let webgpuEngine = null;
let lastLadder = null;
let injectedProposer = null; // e2e seam: a fake proposer bypasses all network
let ladderOverride = null; // e2e seam: force a ladder result (deterministic UI)

function docLocale() {
  return (file && file.draft && file.draft.locale) || "";
}

async function webgpuModelCached() {
  try {
    if (!("caches" in window)) return false;
    for (const nm of await caches.keys()) {
      const cache = await caches.open(nm);
      for (const req of await cache.keys())
        if (Object.values(WEBGPU_MODELS).some((m) => req.url.includes(m.id))) return true;
    }
    return false;
  } catch {
    return false;
  }
}

// Detection — the ONLY place the bridge is probed, and only from an explicit
// action (panel open / a fired feature). Local checks (WebGPU present, a stored
// key) never touch the network.
async function detectSidecar() {
  if (ladderOverride) {
    lastLadder = ladderOverride;
    if (rail && rail.setSidecarAvailable) rail.setSidecarAvailable(lastLadder.rungs.length > 0);
    return lastLadder;
  }
  lastLadder = await detectLadder({
    probeBridge: () => probeBridge(),
    hasWebGPU: () => typeof navigator !== "undefined" && !!navigator.gpu,
    probeWebGPUModel: () => webgpuModelCached(),
    hasKey: () => hasAnyKey(),
  });
  if (rail && rail.setSidecarAvailable) rail.setSidecarAvailable(lastLadder.rungs.length > 0);
  return lastLadder;
}

// The proposer for the best available rung (or the injected fake). BYOK loads
// the stored key at call time — never held longer than a request; WebGPU spins
// up the worker + model on first use (opt-in, size shown before download).
async function buildProposer() {
  if (injectedProposer) return { rung: (lastLadder && lastLadder.best) || "byok", local: false, propose: injectedProposer };
  const l = lastLadder || (await detectSidecar());
  const rung = l.best;
  if (!rung) return null;
  if (rung === RUNGS.BRIDGE) {
    const model = await bridgeModel();
    return { rung, local: true, propose: makeProposer(RUNGS.BRIDGE, { model }) };
  }
  if (rung === RUNGS.BYOK) {
    const keys = await storedKeys();
    const provider = keys[0] ? keys[0].provider : "openai";
    const key = await loadKey(provider);
    return { rung, local: false, provider, propose: makeProposer(RUNGS.BYOK, { provider, key }) };
  }
  if (rung === RUNGS.WEBGPU) {
    if (!webgpuEngine) webgpuEngine = createWebGPUEngine();
    if (!webgpuEngine.ready) {
      const spec = WEBGPU_MODELS[DEFAULT_WEBGPU_MODEL];
      statusLine.error(t("sidecar.loading", { label: spec.label, size: spec.sizeMB }));
      await webgpuEngine.load(DEFAULT_WEBGPU_MODEL, () => {});
      statusLine.clearError();
    }
    return { rung, local: true, propose: makeProposer(RUNGS.WEBGPU, { engine: webgpuEngine }) };
  }
  return null;
}

function sidecarTarget(mode) {
  if (mode === "continue") return ed.continueTargetFrom();
  if (mode === "summarise") return { from: 0, to: 0 };
  const s = ed.selectionInfo();
  return { from: s.from, to: s.to };
}

function sidecarProviderLabel() {
  // The destination copy already says "your provider"; naming it again ("(your
  // provider)") is redundant. A real provider name would go here if surfaced.
  return "";
}

// The "what will be sent" preview: the exact slice + its destination, built
// from the SAME slice a run would send. Whole-document is opt-in and shows its
// byte count (handoff §7).
function sidecarPreview(mode, { wholeDoc = sidecarWholeDoc } = {}) {
  const snap = ed.sidecarSnapshot({ locale: docLocale() });
  const slice = buildSlice(snap, { wholeDoc });
  const rung = (lastLadder && lastLadder.best) || null;
  const local = rung ? rungIsLocal(rung) : true;
  return whatWillBeSent(slice, { rung: rung || undefined, local, provider: sidecarProviderLabel() });
}

async function runSidecar(mode, { wholeDoc = sidecarWholeDoc } = {}) {
  if (ed.staging.active()) return null; // one review at a time
  if (!injectedProposer) await detectSidecar();
  const target = sidecarTarget(mode);
  if (mode === "rewrite" && target.from === target.to) {
    statusLine.error(t("sidecar.errNoSelection"));
    return null;
  }
  const proposer = await buildProposer();
  if (!proposer) {
    // No model — open the panel so the user sees how to enable one ("install
    // bridge or add key"), never a silent failure.
    openSidecarPanel();
    return null;
  }
  const snap = ed.sidecarSnapshot({ locale: docLocale() });
  const slice = buildSlice(snap, { wholeDoc });
  const { system, user } = promptFor(mode, slice, { locale: docLocale() });
  savedState = "thinking…";
  refreshStatus();
  let text;
  try {
    text = await proposer.propose({ system, user });
  } catch (e) {
    statusLine.error(t("sidecar.errFailed", { message: e.message }));
    savedState = "editing…";
    refreshStatus();
    return null;
  }
  savedState = "editing…";
  refreshStatus();
  if (!text || !text.trim()) {
    statusLine.error(t("sidecar.errEmpty"));
    return null;
  }
  ed.staging.stage({ from: target.from, to: target.to, proposal: text.trim(), mode });
  sidecar.refreshReview();
  return { staged: true, chars: text.length, rung: proposer.rung };
}

const sidecar = createSidecar(document.body, {
  actions: {
    rewrite: (o) => runSidecar("rewrite", o),
    continue: (o) => runSidecar("continue", o),
    summarise: (o) => runSidecar("summarise", o),
  },
  previewFor: (mode, o) => sidecarPreview(mode, o),
  refreshLadder: () => detectSidecar(),
  canRewrite: () => {
    const s = ed.selectionInfo();
    return s.from !== s.to;
  },
  hasDoc: () => !docIsEmpty(),
  wholeDoc: {
    get: () => sidecarWholeDoc,
    set: (v) => {
      sidecarWholeDoc = v;
    },
  },
  byok: {
    providers: PROVIDERS,
    list: () => storedKeys(),
    save: (p, k) => saveKey(p, k),
    clear: (p) => clearKey(p),
  },
  staging: ed.staging,
  onClose: () => ed.focus(),
});
function openSidecarPanel() {
  sidecar.open();
}
ed.handlers.requestRewrite = () => runSidecar("rewrite");
ed.handlers.requestContinue = () => runSidecar("continue");

const railEl = document.getElementById("rail");
railEl.setAttribute("aria-label", t("rail.aria")); // localise the toolbar label
const rail = createRail(railEl, {
  commands: ed.commands,
  onLink: () => ed.handlers.requestLink(),
  onFind: () => ed.handlers.requestFind(),
  onFootnote: () => ed.handlers.requestFootnote(),
  onDocuments: () => openDocumentsPanel(),
  onSettings: () => settings.open(),
  onSidecar: () => openSidecarPanel(),
  isMac: IS_MAC,
});

// Outline sidebar: the document's headings on the right edge, click-to-jump.
const outlineEl = document.getElementById("outline");
outlineEl.setAttribute("aria-label", t("outline.aria")); // localise the nav label
const outline = createOutline(outlineEl, {
  getOutline: () => ed.outline(),
  onJump: (pos) => ed.jumpTo(pos),
});
const hint = createEmptyHint(pageEl, { onHelp: () => help.toggle(), onOpen: () => openDocumentsPanel() });

// Drag-and-drop a file onto the desk → the same sanitised ingress.
wireDropTarget(document.getElementById("desk"), async (files) => {
  for (const f of files) await ingestFile(f);
}, { onError: (e) => statusLine.error(t("banner.couldNotOpenDropped", { message: e.message })) });

function docIsEmpty() {
  const doc = ed.getDoc();
  return doc.childCount === 1 && doc.firstChild.type.name === "paragraph" && doc.firstChild.content.size === 0;
}

function refreshUI() {
  rail.refresh(ed.activeStates());
  outline.refresh();
  hint.setVisible(docIsEmpty());
  sidecar.refreshReview();
  refreshStatus();
}
ed.onUpdate(refreshUI);

// Window-level app shortcuts pass the keyboard guard: they never fire while
// focus is in the editor, an input, or any other text surface (§8).
window.addEventListener("keydown", (e) => {
  if (e.key === "Escape") {
    // A staged review owns Escape (the editor's review keymap discards it);
    // don't let the window handler also close panels underneath it.
    if (ed.staging.active()) return;
    if (sidecar.isOpen) {
      sidecar.close();
      return;
    }
    if (settings.isOpen) {
      settings.close();
      return;
    }
    if (documentsPanel.isOpen) {
      documentsPanel.close();
      return;
    }
    if (importNotes.isOpen) {
      importNotes.close();
      return;
    }
    if (findPanel.isOpen) {
      findPanel.close();
      return;
    }
    if (footnotePrompt.isOpen) {
      footnotePrompt.close();
      return;
    }
    if (linkPrompt.isOpen) {
      linkPrompt.close();
      return;
    }
    if (help.isOpen) help.close();
    return;
  }
  if (appShortcutAllowed(e, "?")) {
    e.preventDefault();
    help.toggle();
  }
});

async function boot() {
  try {
    store = await openStore({});
  } catch (e) {
    statusLine.error(t("banner.storageUnavailable", { message: e.message }));
    throw e;
  }

  // Restore the most recent document (migrating in memory only), else a fresh
  // untitled page — the honest empty state (§8) until the first keystroke.
  await refreshDocList();
  window.__bootDocs = docList.map((d) => d.path);
  let restored = false;
  if (docList.length) {
    try {
      await openDoc(docList[0].path);
      restored = true;
    } catch (e) {
      window.__bootRestoreError = String((e && e.stack) || e);
      statusLine.error(t("banner.couldNotOpen", { path: docList[0].path, message: e.message }));
    }
  }
  if (!restored) {
    const f = newDraftFile({ app: VERSION });
    f.draft.title = "untitled";
    await activate(f, "untitled", { saved: false, empty: true });
  }

  // The one change subscription: every edit marks the session dirty and
  // debounces a save through the live saver (rebuilt on each activate). It also
  // fans the change out to the agent face's on("change")/BroadcastChannel, with
  // the actor/origin of the transaction (so API edits announce actor:"api").
  ed.onChange((info) => {
    savedState = "editing…";
    refreshStatus();
    saver.touch();
    emitChange(info);
  });

  // Install the agent face if the Developer setting is on (persisted per
  // machine). The API can never turn this on itself — only the Settings UI.
  if (developerEnabled()) installAgentFace();

  window.__draft = {
    ready: true,
    version: VERSION,
    schemaVersion: SCHEMA_VERSION,
    get backend() {
      return store.backend;
    },
    applyTransaction: (steps, meta) => ed.applyTransaction(steps, meta),
    getDocJSON: () => ed.getDocJSON(),
    // ---- Documents (Batch F) test seams. The folder view drives these; the
    // native folder/file pickers are the un-automatable seam (headless can't
    // open them), so the e2e drives the flow through ingestFile/openDoc/etc.
    activeName: () => name,
    documents: () => docList.slice(),
    refreshDocuments: async () => {
      await refreshDocList();
      return docList.slice();
    },
    openDoc: (id) => openDoc(id),
    newDoc: (nm) => newDoc(nm),
    renameDoc: (oldName, newName) => renameDoc(oldName, newName),
    ingestFile: (fileName, bytes) => ingestFile({ name: fileName, bytes }),
    download: (kind) => downloadExport(kind),
    chooseFolder: () => chooseFolder(),
    folderSupported: () => folderPickerSupported(),
    // ---- Agent face (Batch G) test seams. The Settings UI + this internal
    // face toggle the Developer setting; window.draft itself never can.
    setDeveloper: (on) => setDeveloper(on),
    developerEnabled: () => developerEnabled(),
    agentInstalled: () => typeof window.draft !== "undefined",
    settingsOpen: () => settings.isOpen,
    openSettings: () => settings.open(),
    openDocumentsPanel: () => openDocumentsPanel(),
    documentsPanelOpen: () => documentsPanel.isOpen,
    storageLabel: () => storeLabel(),
    // Whole-document load for tests/fixtures — same single ingress (L4/§4).
    loadDoc(docJSON) {
      const clean = sanitizeToSchema(docJSON, { kind: "json" });
      ed.loadDoc(clean.doc);
      file.doc = clean.doc;
      savedState = "editing…";
      refreshUI();
      saver.touch();
      return clean.notes;
    },
    historyHead: () => ed.historyHead(),
    serializeHistory: () => ed.serializeHistory(),
    sanitize: (input, opts) => sanitizeToSchema(input, opts),
    // Export machinery (Batch E): every kind (md/html/json/docx) as a Blob
    // through one export(kind). Batch G's window.draft.export wraps this.
    export: (kind) => exportBlob(kind, ed.getDocJSON()),
    // Markdown / DOCX ingress (Batch E machinery, wired to the file-open flow
    // in F). These REPLACE the active document's content; the folder-view
    // file-open path (ingestFile) wraps them to open as a fresh document.
    importMarkdown: (text) => doImportMarkdown(text),
    importDocx: (bytes, opts) => doImportDocx(bytes, opts),
    importNotesOpen: () => importNotes.isOpen,
    // Test seam: base64 of a session asset's (re-encoded) bytes, for the e2e
    // metadata-stripping assertion.
    _assetBytesB64(ref) {
      const a = sessionAssets[ref];
      if (!a) return null;
      let s = "";
      for (const b of a.bytes) s += String.fromCharCode(b);
      return btoa(s);
    },
    // Image ingress (Batch E): re-encode to strip metadata (offered, default
    // on — §10), register the bytes as a session asset (sha256 + `.assets/`
    // via the autosaver), and INSERT the image through the sole write path.
    // The file-picker/drop that feeds `bytes` is the Documents chunk (F).
    importImage: (bytes, opts) => doImportImage(bytes, opts),
    // Print: apply page metadata (size/margins) to @page via CSSOM; returns
    // the effective descriptors. The browser's own print dialog owns running
    // headers/footers + page numbers (CSS paged media can't — see README).
    applyPage: (page) => applyPageMetadata(page),
    docStats: () => ed.docStats(),
    activeStates: () => ed.activeStates(),
    // ---- Sidecar (Batch H) test seams. The staged-diff/accept-reject logic is
    // driven WITHOUT a live model by injecting a fake proposer at the transport
    // seam; detection + BYOK vault are exercised directly. No network fires
    // unless one of these (an explicit action) is called.
    sidecar: {
      detect: () => detectSidecar(),
      ladder: () => lastLadder,
      run: (mode, opts) => runSidecar(mode, opts || {}),
      preview: (mode, opts) => sidecarPreview(mode, opts || {}),
      snapshot: () => ed.sidecarSnapshot({ locale: docLocale() }),
      stagingState: () => ed.staging.state(),
      stagingActive: () => ed.staging.active(),
      acceptHunk: () => ed.staging.acceptHunk(),
      rejectHunk: () => ed.staging.rejectHunk(),
      acceptAll: () => ed.staging.acceptAll(),
      discard: () => ed.staging.discard(),
      openPanel: () => openSidecarPanel(),
      refreshPanel: () => sidecar.refresh(),
      panelOpen: () => sidecar.isOpen,
      reviewOpen: () => sidecar.reviewOpen,
      setLadderOverride: (o) => {
        ladderOverride = o;
      },
      // Selection seams for the e2e (the un-automatable caret is driven here).
      selectRange: (from, to) => ed.setTextSelection(from, to),
      findText: (s) => ed.findTextPos(s),
      setWholeDoc: (v) => {
        sidecarWholeDoc = !!v;
      },
      setProposer: (fn) => {
        injectedProposer = fn;
      },
      clearProposer: () => {
        injectedProposer = null;
      },
      saveKey: (p, k) => saveKey(p, k),
      storedKeys: () => storedKeys(),
      clearKey: (p) => clearKey(p),
      hasKey: () => hasAnyKey(),
      fingerprint: (k) => fingerprint(k),
    },
    hintVisible: () => hint.visible,
    helpOpen: () => help.isOpen,
    linkPromptOpen: () => linkPrompt.isOpen,
    findPanelOpen: () => findPanel.isOpen,
    footnotePromptOpen: () => footnotePrompt.isOpen,
    findState: () => ed.search.state(),
    outline: () => ed.outline(),
    outlineVisible: () => !document.getElementById("outline").hidden,
    saveCount: () => saver.saveCount,
    statusText: () => document.getElementById("status").textContent,
    listFiles: () => store.list(),
    readFile: async (p) => {
      const b = await store.read(p);
      return b ? new TextDecoder().decode(b) : null;
    },
    // Test seam: drives the SAME error path createAutosaver calls on a
    // failed write (the wiring itself is unit-tested in autosave.test.mjs).
    _test: { emitSaveError: (msg) => onSaveError(new Error(msg)) },
    async reset() {
      if (saver && (saver.pending || saver.saving)) {
        try { await saver.flush(); } catch {}
      }
      for (const e of await store.list()) await store.remove(e.path);
      const f = newDraftFile({ app: VERSION });
      f.draft.title = "untitled";
      await activate(f, "untitled", { saved: false, empty: true });
      statusLine.clearError();
      await refreshDocListAndPanel();
    },
  };
  refreshUI();
  ed.focus();

  // NakliOS: honour the host theme, flush before a host close, announce ready.
  // All no-ops when standalone (window.parent === window).
  try { window.naklios.theme.onChange(applyHostTheme); } catch {}
  try {
    window.naklios.beforeClose(async () => {
      if (saver && (saver.pending || saver.saving)) {
        try { await saver.flush(); } catch {}
      }
    });
  } catch {}
  try { window.naklios.ready(); } catch {}
  syncHostTitle();
}

boot().catch((e) => {
  statusLine.error(t("banner.bootFailed", { message: e.message }));
  console.error(e);
});
</script>
</body>
</html>
