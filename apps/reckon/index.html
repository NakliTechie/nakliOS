    box.setAttribute('aria-label', title);
    const h = document.createElement('div');
    h.className = 'rk-dialog-title';
    h.textContent = title;
    box.appendChild(h);
    const b = document.createElement('div');
    b.className = 'rk-dialog-body';
    if (typeof body === 'string') b.textContent = body; else b.appendChild(body);
    box.appendChild(b);
    const foot = document.createElement('div');
    foot.className = 'rk-dialog-foot';
    for (const { label, primary, onClick } of buttons) {
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = primary ? 'rk-btn rk-btn-primary' : 'rk-btn';
      btn.textContent = label;
      btn.addEventListener('click', () => onClick(api));
      foot.appendChild(btn);
    }
    if (buttons.length) box.appendChild(foot);
    backdrop.appendChild(box);
    els.dialogHost.appendChild(backdrop);
    const keyHandler = (e) => { if (e.key === 'Escape') { e.stopPropagation(); api.close(); } };
    backdrop.addEventListener('keydown', keyHandler);
    backdrop.addEventListener('mousedown', (e) => { if (e.target === backdrop) api.close(); });
    const api = {
      box,
      close() {
        backdrop.remove();
        openDialogClose = null;
        onClose?.();
        grid?.focus();
      },
    };
    openDialogClose = api.close;
    (initialFocus ?? box.querySelector('input, button'))?.focus();
    return api;
  };
  const closeDialog = () => { openDialogClose?.(); };

  const confirmDialog = (title, message) => new Promise((resolve) => {
    showDialog({
      title,
      body: message,
      onClose: () => resolve(false),
      buttons: [
        { label: 'Cancel', onClick: (d) => { d.close(); } },
        { label: 'OK', primary: true, onClick: (d) => { resolve(true); d.close(); } },
      ],
    });
  });

  // ---------- transactions ----------
  const idxToCol = (c) => { let s = ''; c += 1; while (c > 0) { const m = (c - 1) % 26; s = String.fromCharCode(65 + m) + s; c = (c - m - 1) / 26; } return s; };
  const a1Of = (r, c) => `${idxToCol(c)}${r + 1}`;

  const refreshSheets = async () => {
    sheets = await client.sheetNames();
    if (!sheets.some((s) => s.id === activeId)) activeId = sheets[0]?.id ?? null;
    renderTabs();
  };

  let activeFreeze = null; // active sheet's freeze meta (for the toolbar toggle)

  const loadActiveSheet = async () => {
    const meta = await client.getSheetMeta(activeId);
    activeFreeze = meta.freeze ?? null;
    const display = await client.getSheetDisplay(meta.name);
    grid.loadSheet({ sheetMeta: meta, display });
    if (filterState && filterState.sheetId !== activeId) filterState = null;
    updateFilterStatus();
    refreshBar();
    updateHostTitle();
    await refreshCharts();
    await refreshPivots();
  };

  const refreshActiveDisplay = async () => {
    const meta = await client.getSheetMeta(activeId);
    if (!meta) { await refreshSheets(); await loadActiveSheet(); return; }
    activeFreeze = meta.freeze ?? null;
    const display = await client.getSheetDisplay(meta.name);
    grid.setMeta(meta);
    grid.refreshDisplay({ display });
    refreshBar();
  };

  const handleTxResult = async (res, { skipMeta = false } = {}) => {
    const meta = res.meta ?? {};
    if (meta.names) definedNames = await client.getNames();
    if (meta.sheets) { await refreshSheets(); await loadActiveSheet(); return; } // loadActiveSheet refreshes charts
    if (res.display?.full || meta.structural || meta.condfmt || meta.datavalid || (meta.sizes && !skipMeta)) { await refreshActiveDisplay(); await maybeRefreshCharts(res); await maybeRefreshPivots(res); await refreshDvDropdown(); return; }
    if (res.display && !res.display.full && res.display.cells.length) grid.applyCells(res.display.cells);
    refreshBar();
    await maybeRefreshCharts(res);
    await maybeRefreshPivots(res);
  };
  // charts re-render when a chart op ran OR when data changed and charts exist
  // (live update via the same display feed the grid uses — handoff Batch K).
  const maybeRefreshCharts = async (res) => {
    const meta = res?.meta ?? {};
    const dataChanged = !!(res?.display?.full || (res?.display?.cells && res.display.cells.length) || meta.structural);
    if (meta.charts || (activeCharts.length && dataChanged)) await refreshCharts();
  };
  // pivots re-compute when a pivotSet ran OR when data changed and pivots exist
  // (the region reads the source's computed values, so a source edit refreshes it
  // — Batch N). Same live-update seam as charts.
  const maybeRefreshPivots = async (res) => {
    const meta = res?.meta ?? {};
    const dataChanged = !!(res?.display?.full || (res?.display?.cells && res.display.cells.length) || meta.structural);
    if (meta.pivots || (activePivots.length && dataChanged)) await refreshPivots();
  };

  const txApply = async (ops, { origin = 'ui', skipMeta = false, actor = 'owner', enforce = false } = {}) => {
    try {
      const res = await client.applyTransaction(enforce ? { actor, origin, ops, enforce } : { actor, origin, ops });
      // data-validation reject (Batch M, §4): the whole write was refused before
      // it touched state. Surface an in-app message (never a native dialog, §13);
      // nothing to render. API callers get an Error so their promise rejects.
      if (res && res.rejected) {
        const r = res.rejected[0];
        const msg = dvRejectMessage(r);
        if (actor === 'api') throw new Error(msg);
        toast(msg, { kind: 'error', ms: 6000 });
        return null;
      }
      await handleTxResult(res, { skipMeta });
      // a `warn`-mode DV rule let the write land but flagged cells (Batch M)
      if (res && res.warnings && res.warnings.length) toast(dvWarnMessage(res.warnings[0]), { kind: 'info', ms: 5000 });
      // For an API write the agent face's own setRange emits the change event
      // (with the ref); notifying here too would double-fan-out (forward-pass
      // fix). Owner/system/sidecar writes are announced here.
      if (actor !== 'api') agentFace?.notify('change', { txId: res.txId, actor, origin });
      return res;
    } catch (e) {
      if (actor === 'api') throw e; // API callers handle their own errors
      toast(String(e.message ?? e), { kind: 'error' });
      return null;
    }
  };
  // in-app messages for a DV reject / warn. Always name the REJECTED value, not
  // just the cell: a reject leaves the cell holding its prior (valid) content, so
  // a cell-only message ("B2: …") reads as if a valid cell were flagged. Leading
  // with the offending value keeps the message and the cell honest.
  const dvRejectMessage = (r) => {
    const t = (k) => (RK.t ? RK.t(k) : k);
    const tail = r.help || t('dv.notAllowed');
    return `${r.a1}: "${r.value}" ${t('dv.rejectedWord')} — ${tail}`;
  };
  const dvWarnMessage = (r) => {
    const t = (k) => (RK.t ? RK.t(k) : k);
    return `${r.a1}: "${r.value}" ${t('dv.flaggedWord')}${r.help ? ` — ${r.help}` : ''}`;
  };

  const doUndo = async () => { const res = await client.undo(); await handleTxResult(res); if (res.did) agentFace?.notify('change', { actor: 'owner', origin: 'undo' }); };
  const doRedo = async () => { const res = await client.redo(); await handleTxResult(res); if (res.did) agentFace?.notify('change', { actor: 'owner', origin: 'redo' }); };

  // ---------- formula bar / selection ----------
  const refreshBar = async () => {
    if (!grid || editor?.active()) return;
    const sel = grid.selection();
    const { range } = sel;
    const single = range.sri === range.eri && range.sci === range.eci;
    els.namebox.value = single ? a1Of(sel.ri, sel.ci) : `${range.eri - range.sri + 1}R × ${range.eci - range.sci + 1}C`;
    try {
      const cell = await client.getCell(activeName(), a1Of(sel.ri, sel.ci));
      if (!editor?.active()) editor?.setBarText(cell.raw === null || cell.raw === undefined ? '' : String(cell.raw));
      if (toolbar) {
        const fmt = await client.getCellFormat(activeName(), a1Of(sel.ri, sel.ci));
        toolbar.setActive(fmt.def, { frozen: !!(activeFreeze && (activeFreeze.r || activeFreeze.c)), filterActive: !!(filterState && filterState.sheetId === activeId) });
      }
    } catch { /* sheet switching */ }
    refreshStats();
  };

  const refreshStats = () => {
    const { range } = grid.selection();
    const cells = grid.cellsInRange(range.sri, range.sci, range.eri, range.eci);
    // stats use the RAW numeric (c.num for formatted cells; c.text otherwise) so
    // a currency/percent display never breaks the sum
    const nums = cells.filter((c) => c.ty === 'n').map((c) => (c.num !== undefined ? c.num : Number(c.text))).filter((n) => Number.isFinite(n));
    if (nums.length >= 2) {
      const sum = nums.reduce((a, b) => a + b, 0);
      const fmt = (n) => (Math.abs(n) >= 1e12 || (Math.abs(n) < 1e-4 && n !== 0) ? n.toExponential(4) : String(Math.round(n * 10000) / 10000));
      els.statusStats.textContent = `sum ${fmt(sum)} · avg ${fmt(sum / nums.length)} · count ${cells.length}`;
    } else if (cells.length > 1) {
      els.statusStats.textContent = `count ${cells.length}`;
    } else {
      els.statusStats.textContent = '';
    }
  };

  // ---------- edit commit ----------
  const commitEdit = async ({ a1, text, moveDir }) => {
    // `=?` is the sidecar trigger (handoff §7): it is NOT written as a cell. The
    // description goes to the sidecar, which proposes a formula into the staging
    // slot; the target stays the cell being edited (no selection move, no write).
    if (text.trim().startsWith('=?')) {
      sidecar?.request({ targetA1: a1, description: text.trim().slice(2).trim() });
      refreshBar(); // the `=?` text is a sidecar prompt, not cell content — reset the bar to the target cell
      return;
    }
    // move the selection SYNCHRONOUSLY so fast type-Enter-type sequences land
    // in the right cell; the transaction targets a1 captured at session start
    const sel = grid.selection();
    if (moveDir === 'down') grid.selectCell(sel.ri + 1, sel.ci);
    else if (moveDir === 'up') grid.selectCell(Math.max(0, sel.ri - 1), sel.ci);
    else if (moveDir === 'right') grid.selectCell(sel.ri, sel.ci + 1);
    else if (moveDir === 'left') grid.selectCell(sel.ri, Math.max(0, sel.ci - 1));
    grid.focus();
    const trimmed = text;
    let cell;
    if (trimmed === '') cell = null;
    else if (trimmed.startsWith('=') && trimmed.length > 1) cell = { f: trimmed };
    else {
      const typed = RK.typedRaw(trimmed);
      cell = { v: typed };
    }
    await txApply([{ op: 'setCells', sheet: activeId, cells: { [a1]: cell } }], { origin: 'ui:edit', enforce: true });
    refreshBar();
  };

  // ---------- range helpers ----------
  const clampRange = (range) => {
    const dims = grid.usedDims();
    return {
      sri: Math.max(0, range.sri), sci: Math.max(0, range.sci),
      eri: Math.min(range.eri, Math.max(dims.rows - 1, range.sri)),
      eci: Math.min(range.eci, Math.max(dims.cols - 1, range.sci)),
    };
  };
  const rangeToA1 = (r) => `${a1Of(r.sri, r.sci)}:${a1Of(r.eri, r.eci)}`;

  const clearRange = async (range) => {
    const r = clampRange(range);
    const raws = await client.regionCells(activeName(), rangeToA1(r));
    const keys = Object.keys(raws);
    if (!keys.length) return;
    const cells = Object.fromEntries(keys.map((k) => [k, null]));
    await txApply([{ op: 'setCells', sheet: activeId, cells }], { origin: 'ui:clear' });
  };

  // ---------- clipboard ----------
  const doCopy = async (rangeSel, clipboardData, cut) => {
    const r = clampRange(rangeSel);
    const tsv = RK.toTsv(grid.displayGrid(r.sri, r.sci, r.eri, r.eci));
    clipboardData.setData('text/plain', tsv);
    const raws = await client.regionCells(activeName(), rangeToA1(r));
    lastClip = { tsv, sheetId: activeId, sheetName: activeName(), range: r, cells: raws, cut };
    grid.selectRange(r.sri, r.sci, r.eri, r.eci);
    grid.showClipboardMarquee();
  };

  const doPaste = async (clipboardData) => {
    const text = clipboardData.getData('text/plain');
    const sel = grid.selection();
    const anchor = { r: sel.range.sri, c: sel.range.sci };
    if (lastClip && text === lastClip.tsv) {
      // internal paste: formulas + values, refs shifted
      if (lastClip.cut && lastClip.sheetId === activeId) {
        const from = rangeToA1(lastClip.range);
        await txApply([{ op: 'moveRange', sheet: activeId, from, to: a1Of(anchor.r, anchor.c) }], { origin: 'ui:paste-cut' });
        lastClip = null;
        grid.hideClipboardMarquee();
        return;
      }
      const dr = anchor.r - lastClip.range.sri;
      const dc = anchor.c - lastClip.range.sci;
      const cells = {};
      for (const [key, raw] of Object.entries(lastClip.cells)) {
        const m = /^([A-Z]{1,3})([0-9]+)$/.exec(key);
        if (!m) continue;
        let col = 0; for (const ch of m[1]) col = col * 26 + (ch.charCodeAt(0) - 64); col -= 1;
        const row = Number(m[2]) - 1;
        const tr = row + dr; const tc = col + dc;
        if (tr < 0 || tc < 0 || tr >= 1048576 || tc >= 16384) continue;
        cells[a1Of(tr, tc)] = typeof raw === 'string' && raw.startsWith('=')
          ? { f: RK.shiftFormula(raw, dr, dc) }
          : { v: raw };
      }
      if (lastClip.cut) {
        // cross-sheet cut: clear the source alongside the paste, one transaction
        const srcCells = Object.fromEntries(Object.keys(lastClip.cells).map((k) => [k, null]));
        await txApply([
          { op: 'setCells', sheet: activeId, cells },
          { op: 'setCells', sheet: lastClip.sheetId, cells: srcCells },
        ], { origin: 'ui:paste-cut' });
        lastClip = null;
        grid.hideClipboardMarquee();
        return;
      }
      if (Object.keys(cells).length) await txApply([{ op: 'setCells', sheet: activeId, cells }], { origin: 'ui:paste' });
      return;
    }
    // external paste: TSV through the single ingress (validateRange, §4)
    if (!text) return;
    const grid2d = RK.parseTsv(text);
    const values2d = grid2d.map((row) => row.map((v) => (v === '' ? null : RK.typedRaw(v))));
    const check = await client.validateRange(values2d);
    if (!check.ok) {
      toast(`Paste rejected: ${check.errors[0].path} ${check.errors[0].msg}`, { kind: 'error', ms: 6000 });
      return;
    }
    const cells = {};
    values2d.forEach((row, r) => row.forEach((v, c) => {
      if (v === null) return;
      const tr = anchor.r + r; const tc = anchor.c + c;
      if (tr >= 1048576 || tc >= 16384) return;
      cells[a1Of(tr, tc)] = typeof v === 'string' && v.startsWith('=') ? { f: v } : { v };
    }));
    if (Object.keys(cells).length) await txApply([{ op: 'setCells', sheet: activeId, cells }], { origin: 'ui:paste', enforce: true });
  };

  // ---------- fill handle ----------
  const doFill = async (src, dst) => {
    const raws = await client.regionCells(activeName(), rangeToA1({ sri: src.sri, sci: src.sci, eri: src.eri, eci: src.eci }));
    const srcRows = src.eri - src.sri + 1;
    const srcCols = src.eci - src.sci + 1;
    const cells = {};
    const mod = (x, m) => ((x % m) + m) % m;
    for (let r = dst.sri; r <= dst.eri; r += 1) {
      for (let c = dst.sci; c <= dst.eci; c += 1) {
        if (r >= src.sri && r <= src.eri && c >= src.sci && c <= src.eci) continue;
        const srcR = src.sri + mod(r - src.sri, srcRows);
        const srcC = src.sci + mod(c - src.sci, srcCols);
        const raw = raws[a1Of(srcR, srcC)];
        if (raw === undefined) { cells[a1Of(r, c)] = null; continue; }
        cells[a1Of(r, c)] = typeof raw === 'string' && raw.startsWith('=')
          ? { f: RK.shiftFormula(raw, r - srcR, c - srcC) }
          : { v: raw };
      }
    }
    if (Object.keys(cells).length) await txApply([{ op: 'setCells', sheet: activeId, cells }], { origin: 'ui:fill' });
  };

  // ---------- formats (Batch D) ----------
  // The range formatting applies to: numbers/currency/percent/date/text formats
  // + bold/italic + alignment + neutral/accent cell colour + borders. Every
  // change routes through setFormat (single write path); the worker re-emits the
  // touched cells' display so styling appears without a full re-pull.
  const FORMAT_CAP = 20000; // guard a whole-column select; clamp to used beyond this
  const formatRange = () => {
    const { range } = grid.selection();
    let r = { sri: Math.max(0, range.sri), sci: Math.max(0, range.sci), eri: range.eri, eci: range.eci };
    if ((r.eri - r.sri + 1) * (r.eci - r.sci + 1) > FORMAT_CAP) {
      const c = clampRange(r);
      if (c.eri < r.sri) c.eri = r.sri;
      if (c.eci < r.sci) c.eci = r.sci;
      r = c;
      toast('Formatting the used range (selection was very large)', { kind: 'info' });
    }
    return r;
  };

  // apply a per-cell format transform fn(a1, r, c, currentDef, range) -> spec
  const perCellFormat = async (fn) => {
    const rng = formatRange();
    const rangeA1 = `${a1Of(rng.sri, rng.sci)}:${a1Of(rng.eri, rng.eci)}`;
    const curDefs = await client.regionFormats(activeName(), rangeA1);
    const cells = {};
    for (let r = rng.sri; r <= rng.eri; r += 1) {
      for (let c = rng.sci; c <= rng.eci; c += 1) {
        const a1 = a1Of(r, c);
        const cur = curDefs[a1] ?? { kind: 'general' };
        const spec = fn(a1, r, c, cur, rng);
        const norm = RK.normalizeFormatSpec(spec ?? { kind: 'general' });
        const id = RK.isEmptyFormat(norm) ? null : RK.idFromSpec(norm);
        const curId = curDefs[a1] ? RK.idFromSpec(curDefs[a1]) : null;
        if (id !== curId) cells[a1] = id;
      }
    }
    if (Object.keys(cells).length) await txApply([{ op: 'setFormat', sheet: activeId, cells }], { origin: 'ui:format' });
    refreshBar();
  };

  const DEC_KINDS = new Set(['number', 'currency', 'percent']);
  const styleOnly = (cur) => ({ kind: 'general', bold: cur.bold, italic: cur.italic, align: cur.align, bg: cur.bg, border: cur.border });
  const toolbarHooks = {
    setNumberFormat: (spec) => perCellFormat((a1, r, c, cur) => ({ ...cur, ...spec })),
    clearNumberFormat: () => perCellFormat((a1, r, c, cur) => styleOnly(cur)),
    stepDecimals: (delta) => perCellFormat((a1, r, c, cur) => {
      const base = DEC_KINDS.has(cur.kind) ? cur : { ...cur, kind: 'number', grouping: true, decimals: 2 };
      return { ...base, decimals: Math.max(0, Math.min(10, (base.decimals ?? 2) + delta)) };
    }),
    toggle: (prop) => perCellFormat((a1, r, c, cur) => ({ ...cur, [prop]: !cur[prop] })),
    setAlign: (align) => perCellFormat((a1, r, c, cur) => ({ ...cur, align: cur.align === align ? undefined : align })),
    setBg: (slot) => perCellFormat((a1, r, c, cur) => ({ ...cur, bg: slot })),
    setBorder: (intent) => perCellFormat((a1, r, c, cur, rng) => {
      if (intent === null) return { ...cur, border: undefined };
      if (intent === 'outline') {
        const sides = (r === rng.sri ? 't' : '') + (r === rng.eri ? 'b' : '') + (c === rng.sci ? 'l' : '') + (c === rng.eci ? 'r' : '');
        return { ...cur, border: sides || undefined };
      }
      return { ...cur, border: intent };
    }),
    sort: (dir) => sortRange(dir),
    filter: () => openFilter(),
    names: () => openNames(),
    freeze: () => toggleFreeze(),
    condFormat: () => openCondFormat(),
    dataValid: () => openDataValid(),
    pivot: () => openPivotBuilder(),
    insertChart: (type) => insertChart(type),
    importCsv: () => pickFile('csv', '.csv,text/csv'),
    importXlsx: () => pickFile('xlsx', '.xlsx,.xls,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'),
    exportCsv: () => exportCsv().catch((e) => toast(`Export failed: ${e.message ?? e}`, { kind: 'error' })),
    exportXlsx: () => exportXlsx().catch((e) => toast(`Export failed: ${e.message ?? e}`, { kind: 'error' })),
    exportJson: () => exportJson().catch((e) => toast(`Export failed: ${e.message ?? e}`, { kind: 'error' })),
  };

  // ---------- sort (range-aware, moves whole rows within the range) ----------
  const cmpValues = (a, b) => {
    const ae = a === null || a === undefined || a === '';
    const be = b === null || b === undefined || b === '';
    if (ae && be) return 0;
    if (ae) return 1; // blanks sink
    if (be) return -1;
    if (typeof a === 'number' && typeof b === 'number') return a - b;
    if (typeof a === 'number') return -1; // numbers before text
    if (typeof b === 'number') return 1;
    return String(a).localeCompare(String(b));
  };
  const sortRange = async (dir) => {
    const dims = grid.usedDims();
    if (!dims.rows) return;
    const { range, ci } = grid.selection();
    const single = range.sri === range.eri && range.sci === range.eci;
    const rng = single
      ? { sri: 0, sci: 0, eri: dims.rows - 1, eci: Math.max(dims.cols - 1, 0) }
      : { sri: range.sri, sci: range.sci, eri: Math.min(range.eri, dims.rows - 1), eci: range.eci };
    if (rng.eri <= rng.sri) return; // nothing to reorder
    const keyCol = Math.max(rng.sci, Math.min(ci, rng.eci));
    const keyA1 = `${a1Of(rng.sri, keyCol)}:${a1Of(rng.eri, keyCol)}`;
    const { values } = await client.regionValues(activeName(), keyA1);
    const n = rng.eri - rng.sri + 1;
    const order = Array.from({ length: n }, (_, i) => i);
    const sign = dir === 'desc' ? -1 : 1;
    order.sort((i, j) => { const c = cmpValues(values[i]?.[0], values[j]?.[0]) * sign; return c !== 0 ? c : i - j; });
    if (order.every((v, i) => v === i)) return; // already sorted
    const rangeA1 = `${a1Of(rng.sri, rng.sci)}:${a1Of(rng.eri, rng.eci)}`;
    const raws = await client.regionCells(activeName(), rangeA1);
    const defs = await client.regionFormats(activeName(), rangeA1);
    const cells = {};
    order.forEach((oldOff, newOff) => {
      const dr = newOff - oldOff;
      for (let c = rng.sci; c <= rng.eci; c += 1) {
        const src = a1Of(rng.sri + oldOff, c);
        const dst = a1Of(rng.sri + newOff, c);
        const raw = raws[src];
        const fmtId = defs[src] ? RK.idFromSpec(defs[src]) : undefined;
        if (raw === undefined) { if (fmtId === undefined) cells[dst] = null; else cells[dst] = { fmt: fmtId }; continue; }
        const cell = (typeof raw === 'string' && raw.startsWith('=')) ? { f: RK.shiftFormula(raw, dr, 0) } : { v: raw };
        if (fmtId !== undefined) cell.fmt = fmtId;
        cells[dst] = cell;
      }
    });
    await txApply([{ op: 'setCells', sheet: activeId, cells }], { origin: 'ui:sort' });
    if (filterState) { filterState = null; grid.setHiddenRows(new Set()); updateFilterStatus(); }
  };

  // ---------- filter (dim gutter count, true-hide body — handoff §8) ----------
  const updateFilterStatus = () => {
    const hidden = grid?.hiddenRowCount?.() ?? 0;
    els.statusFilter.textContent = hidden ? `${hidden} row${hidden === 1 ? '' : 's'} hidden by filter` : '';
    els.statusFilter.hidden = hidden === 0;
  };
  const openFilter = async () => {
    const dims = grid.usedDims();
    if (!dims.rows) { toast('Nothing to filter yet', { kind: 'info' }); return; }
    const { ci } = grid.selection();
    const col = Math.min(ci, Math.max(dims.cols - 1, 0));
    const colA1 = `${a1Of(0, col)}:${a1Of(dims.rows - 1, col)}`;
    const { values } = await client.regionValues(activeName(), colA1);
    // distinct display values with their row indices (row 0 kept as a header)
    const distinct = new Map(); // display -> {rows:[], sample}
    const displayOfVal = (v) => (v === null || v === undefined || v === '' ? '(blanks)' : String(v));
    for (let r = 1; r < dims.rows; r += 1) {
      const disp = displayOfVal(values[r]?.[0]);
      if (!distinct.has(disp)) distinct.set(disp, []);
      distinct.get(disp).push(r);
    }
    if (distinct.size > 1000) { toast(`Column ${idxToCol(col)} has ${distinct.size} distinct values — too many to filter as a list`, { kind: 'error', ms: 6000 }); return; }
    const keep = new Set(filterState && filterState.sheetId === activeId && filterState.col === col ? filterState.keep : distinct.keys());

    const body = document.createElement('div');
    body.className = 'rk-filter';
    const head = document.createElement('div');
    head.className = 'rk-filter-head';
    head.textContent = `Column ${idxToCol(col)} — ${distinct.size} value${distinct.size === 1 ? '' : 's'} (row 1 kept as header)`;
    body.appendChild(head);
    const list = document.createElement('div');
    list.className = 'rk-filter-list';
    for (const disp of distinct.keys()) {
      const lab = document.createElement('label');
      lab.className = 'rk-filter-item';
      const cb = document.createElement('input');
      cb.type = 'checkbox'; cb.checked = keep.has(disp); cb.dataset.v = disp;
      const span = document.createElement('span');
      span.textContent = disp;
      lab.append(cb, span);
      list.appendChild(lab);
    }
    body.appendChild(list);

    const apply = (checkedSet) => {
      const hidden = new Set();
      for (const [disp, rows] of distinct) if (!checkedSet.has(disp)) for (const r of rows) hidden.add(r);
      grid.setHiddenRows(hidden);
      filterState = hidden.size ? { sheetId: activeId, col, keep: checkedSet } : null;
      updateFilterStatus();
      refreshBar();
    };
    showDialog({
      title: 'Filter',
      body,
      buttons: [
        { label: 'Clear filter', onClick: (d) => { apply(new Set(distinct.keys())); d.close(); } },
        { label: 'Cancel', onClick: (d) => d.close() },
        { label: 'Apply', primary: true, onClick: (d) => { const checked = new Set([...list.querySelectorAll('input:checked')].map((i) => i.dataset.v)); apply(checked); d.close(); } },
      ],
    });
  };

  // ---------- named ranges ----------
  const selectionRef = () => {
    const { range } = grid.selection();
    const a = `${activeName()}!$${idxToCol(range.sci)}$${range.sri + 1}`;
    if (range.sri === range.eri && range.sci === range.eci) return `=${a}`;
    return `=${a}:$${idxToCol(range.eci)}$${range.eri + 1}`;
  };
  const openNames = () => {
    const body = document.createElement('div');
    body.className = 'rk-names';
    const list = document.createElement('div');
    list.className = 'rk-names-list';
    const render = () => {
      list.innerHTML = '';
      const entries = Object.entries(definedNames);
      if (!entries.length) { const none = document.createElement('div'); none.className = 'rk-names-none'; none.textContent = RK.t('names.none'); list.appendChild(none); }
      for (const [name, ref] of entries) {
        const row = document.createElement('div');
        row.className = 'rk-names-row';
        const nm = document.createElement('span'); nm.className = 'rk-names-name'; nm.textContent = name;
        const rf = document.createElement('span'); rf.className = 'rk-names-ref'; rf.textContent = ref;
        const del = document.createElement('button');
        del.type = 'button'; del.className = 'rk-names-del'; del.textContent = '×'; del.setAttribute('aria-label', `Delete ${name}`);
        del.addEventListener('click', async () => { await txApply([{ op: 'nameSet', name, ref: null }], { origin: 'ui:names' }); definedNames = await client.getNames(); render(); });
        row.append(nm, rf, del);
        list.appendChild(row);
      }
    };
    render();
    body.appendChild(list);
    const form = document.createElement('div');
    form.className = 'rk-names-new';
    form.innerHTML = `<input class="rk-names-in-name" type="text" placeholder="${RK.t('names.name')}" aria-label="${RK.t('names.name')}" spellcheck="false" autocomplete="off"><input class="rk-names-in-ref" type="text" aria-label="${RK.t('names.reference')}" spellcheck="false" autocomplete="off">`;
    const nameIn = form.querySelector('.rk-names-in-name');
    const refIn = form.querySelector('.rk-names-in-ref');
    refIn.value = selectionRef();
    body.appendChild(form);

    showDialog({
      title: RK.t('names.title'),
      body,
      initialFocus: nameIn,
      buttons: [
        { label: RK.t('btn.close'), onClick: (d) => d.close() },
        {
          label: RK.t('names.define'),
          primary: true,
          onClick: async () => {
            const name = nameIn.value.trim();
            const ref = refIn.value.trim();
            if (!/^[A-Za-z_][A-Za-z0-9_.]{0,254}$/.test(name)) { toast('Invalid name (letters/digits/underscore, not starting with a digit)', { kind: 'error' }); return; }
            const res = await txApply([{ op: 'nameSet', name, ref: ref || null }], { origin: 'ui:names' });
            if (res) { definedNames = await client.getNames(); nameIn.value = ''; render(); toast(`Defined ${name}`); }
          },
        },
      ],
    });
  };

  // ---------- freeze panes ----------
  const toggleFreeze = async () => {
    const frozen = activeFreeze && (activeFreeze.r || activeFreeze.c);
    const { ri, ci } = grid.selection();
    const freeze = frozen ? null : { r: ri, c: ci };
    await txApply([{ op: 'setFreeze', sheet: activeId, freeze }], { origin: 'ui:freeze' });
    toast(freeze ? `Frozen above row ${ri + 1}, left of column ${idxToCol(ci)}` : 'Unfrozen');
  };

  // ---------- charts (Batch K) ----------
  const newChartId = () => `ch${Date.now().toString(36)}${Math.floor(Math.random() * 1000)}`;
  const readVals2d = async (range) => {
    try { const { values } = await client.regionValues(activeName(), range); return values; } catch { return []; }
  };
  // pull the charts for the active sheet + their computed data, render the layer
  const refreshCharts = async () => {
    if (!chartsLayer) return;
    const meta = await client.getSheetMeta(activeId);
    activeCharts = meta?.charts ?? [];
    const list = [];
    for (const chart of activeCharts) {
      const values = await readVals2d(chart.dataRange);
      list.push({ chart, values, locale: wbLocale || 'en-IN' });
    }
    chartsLayer.setCharts(list);
  };
  // insert a chart from the current selection: infer range + orientation, place
  // it at a free spot, commit as one chartAdd transaction (undo removes it).
  const insertChart = async (type = 'column') => {
    const dims = grid.usedDims();
    const s = grid.selection();
    let range = s.range;
    const single = range.sri === range.eri && range.sci === range.eci;
    if (single) {
      // no explicit selection → chart the used block
      if (!dims.rows) { toast('Nothing to chart — enter some data first', { kind: 'info' }); return; }
      range = { sri: 0, sci: 0, eri: dims.rows - 1, eci: Math.max(0, dims.cols - 1) };
    }
    const norm = { sri: Math.min(range.sri, range.eri), sci: Math.min(range.sci, range.eci), eri: Math.max(range.sri, range.eri), eci: Math.max(range.sci, range.eci) };
    const grd = grid.displayGrid(norm.sri, norm.sci, norm.eri, norm.eci);
    const firstRow = grd[0] ?? [];
    const firstCol = grd.map((r) => r[0]);
    const base = RK.inferChart(norm, { type, firstRow, firstCol });
    // stagger new charts so they don't stack exactly
    const offset = (activeCharts.length % 6) * 24;
    const chart = {
      id: newChartId(),
      ...base,
      title: RK.t ? RK.t('chart.defaultTitle') : 'Chart',
      series: [],
      pos: { x: 60 + offset, y: 60 + offset },
      size: { w: 380, h: 260 },
      options: {},
    };
    const res = await txApply([{ op: 'chartAdd', sheet: activeId, chart }], { origin: 'ui:chart' });
    // keep grid focus (the toolbar button already preserves it) so undo/typing
    // work right after insert; the chart is visible and click-to-focus.
    if (res) { await refreshCharts(); toast(RK.t ? RK.t('chart.inserted') : 'Chart inserted'); }
  };
  const onChartMove = (id, pos) => txApply([{ op: 'chartUpdate', sheet: activeId, id, patch: { pos } }], { origin: 'ui:chart-move' });
  const onChartResize = (id, size) => txApply([{ op: 'chartUpdate', sheet: activeId, id, patch: { size } }], { origin: 'ui:chart-resize' });
  const updateChart = (id, patch) => txApply([{ op: 'chartUpdate', sheet: activeId, id, patch }], { origin: 'ui:chart-edit' });
  const deleteChart = async (id) => { const res = await txApply([{ op: 'chartDelete', sheet: activeId, id }], { origin: 'ui:chart' }); if (res) await refreshCharts(); };

  // chart settings panel (in-app dialog, §13: never a native dialog)
  const openChartSettings = (id) => {
    const chart = activeCharts.find((c) => c.id === id);
    if (!chart) return;
    const t = (k, f) => (RK.t ? RK.t(k) : f);
    const body = document.createElement('div');
    body.className = 'rk-chart-set';
    const field = (labelText, control) => {
      const row = document.createElement('label');
      row.className = 'rk-chart-set-row';
      const span = document.createElement('span');
      span.className = 'rk-chart-set-label';
      span.textContent = labelText;
      row.append(span, control);
      body.appendChild(row);
      return control;
    };
    const typeSel = document.createElement('select');
    for (const ty of ['column', 'bar', 'line', 'area', 'pie', 'scatter', 'combo']) {
      const o = document.createElement('option'); o.value = ty; o.textContent = t(`chart.type.${ty}`, ty); if (ty === chart.type) o.selected = true; typeSel.appendChild(o);
    }
    field(t('chart.set.type', 'Type'), typeSel);
    const titleIn = document.createElement('input'); titleIn.type = 'text'; titleIn.value = chart.title || ''; titleIn.setAttribute('autocomplete', 'off');
    field(t('chart.set.title', 'Title'), titleIn);
    const rangeIn = document.createElement('input'); rangeIn.type = 'text'; rangeIn.value = chart.dataRange; rangeIn.setAttribute('autocomplete', 'off'); rangeIn.spellcheck = false;
    field(t('chart.set.range', 'Data range'), rangeIn);
    const orientSel = document.createElement('select');
    for (const [v, lab] of [['cols', t('chart.set.orientCols', 'Series in columns')], ['rows', t('chart.set.orientRows', 'Series in rows')]]) {
      const o = document.createElement('option'); o.value = v; o.textContent = lab; if (v === chart.orientation) o.selected = true; orientSel.appendChild(o);
    }
    field(t('chart.set.orient', 'Orientation'), orientSel);
    const hdrRow = document.createElement('input'); hdrRow.type = 'checkbox'; hdrRow.checked = chart.headerRow !== false;
    field(t('chart.set.headerRow', 'First row is labels'), hdrRow);
    const hdrCol = document.createElement('input'); hdrCol.type = 'checkbox'; hdrCol.checked = chart.headerCol !== false;
    field(t('chart.set.headerCol', 'First column is labels'), hdrCol);

    const apply = async (d) => {
      const patch = {};
      if (typeSel.value !== chart.type) patch.type = typeSel.value;
      const newTitle = titleIn.value.trim() || null;
      if (newTitle !== (chart.title ?? null)) patch.title = newTitle;
      const newRange = rangeIn.value.trim().toUpperCase();
      if (RK.parseRangeA1(newRange) && newRange !== chart.dataRange) patch.dataRange = newRange;
      else if (!RK.parseRangeA1(newRange)) { toast(t('chart.badRange', 'That is not a valid A1 range'), { kind: 'error' }); return; }
      if (orientSel.value !== chart.orientation) patch.orientation = orientSel.value;
      if (hdrRow.checked !== (chart.headerRow !== false)) patch.headerRow = hdrRow.checked;
      if (hdrCol.checked !== (chart.headerCol !== false)) patch.headerCol = hdrCol.checked;
      if (Object.keys(patch).length) { const res = await updateChart(id, patch); if (res) await refreshCharts(); }
      d.close();
    };
    showDialog({
      title: t('chart.set.title2', 'Chart settings'),
      body,
      initialFocus: typeSel,
      buttons: [
        { label: t('chart.set.delete', 'Delete'), onClick: async (d) => { d.close(); await deleteChart(id); } },
        { label: t('btn.cancel', 'Cancel'), onClick: (d) => d.close() },
        { label: t('chart.set.apply', 'Apply'), primary: true, onClick: apply },
      ],
    });
  };

  // ---------- pivot tables (Batch N) ----------
  // Pivots are per-sheet workbook state (op `pivotSet`, undoable). Each pivot
  // MATERIALISES a read-only region rendered over the grid from its source's
  // computed values (no cells written — no second write path). The worker
  // computes the aggregation off the main thread; the region refreshes when the
  // source data changes (maybeRefreshPivots) and scrolls with the cells.
  const refreshPivots = async () => {
    if (!pivotsLayer) return;
    const meta = await client.getSheetMeta(activeId);
    activePivots = meta?.pivots ?? [];
    const list = [];
    for (const pivot of activePivots) {
      let result = null;
      try { result = await client.pivotResult(activeName(), pivot); } catch { result = { ok: false }; }
      list.push({ pivot, result });
    }
    pivotsLayer.setPivots(list, wbLocale || 'en-IN');
  };
  const commitPivot = async (pivots) => {
    const res = await txApply([{ op: 'pivotSet', sheet: activeId, pivots }], { origin: 'ui:pivot' });
    if (res) await refreshPivots();
    return !!res;
  };
  const deletePivot = async (id) => {
    const next = (await client.getSheetMeta(activeId))?.pivots?.filter((p) => p.id !== id) ?? [];
    await commitPivot(next);
  };
  // suggest an anchor cell two columns to the right of the source block
  const suggestPivotPosition = (rangeA1) => {
    const p = RK.parseRangeA1(rangeA1);
    if (!p) return 'H1';
    return RK.toA1(p.end.col + 2, p.start.row);
  };
  const openPivotBuilder = (id = null) => { if (pivotBuilder) pivotBuilder.open(id); };

  // ---------- conditional formatting (Batch L) ----------
  // Rules are per-sheet workbook state; the whole ordered list is set at once
  // (op `cfSet`, undoable). CF is a render-time layer — the worker re-pulls the
  // display and the grid restyles; no per-cell storage (every cell honest, §8).
  let condFormatRules = [];
  let condFormatPanel = null;
  const commitCondFormat = async (rules) => {
    const res = await txApply([{ op: 'cfSet', sheet: activeId, rules }], { origin: 'ui:condfmt' });
    return !!res;
  };
  const openCondFormat = async () => {
    if (!condFormatPanel) return;
    try { const meta = await client.getSheetMeta(activeId); condFormatRules = meta?.conditionalFormats ?? []; }
    catch { condFormatRules = []; }
    condFormatPanel.open();
  };

  // ---------- data validation (Batch M) ----------
  // Rules are per-sheet workbook state (op `dvSet`, undoable). Unlike CF they
  // GATE user writes at the single ingress (enforce:true on the edit/paste/API
  // paths → the worker's applyTransaction refuses a `reject` or flags a `warn`).
  // Invalid cells render a marker; a list rule shows an in-cell dropdown.
  let dataValidRules = [];
  let dataValidPanel = null;
  let dvDropdown = null;
  const commitDataValid = async (rules) => {
    const res = await txApply([{ op: 'dvSet', sheet: activeId, rules }], { origin: 'ui:datavalid' });
    return !!res;
  };
  const openDataValid = async () => {
    if (!dataValidPanel) return;
    try { const meta = await client.getSheetMeta(activeId); dataValidRules = meta?.dataValidations ?? []; }
    catch { dataValidRules = []; }
    dataValidPanel.open();
  };
  // commit a dropdown selection into the active list cell (rides the enforce path
  // like a typed edit; an allowed value always passes the gate)
  const commitDvChoice = async (value) => {
    const s = grid.selection();
    const a1 = a1Of(s.ri, s.ci);
    await txApply([{ op: 'setCells', sheet: activeId, cells: { [a1]: { v: value } } }], { origin: 'ui:dv-list', enforce: true });
    grid.focus();
  };
  // keep the in-cell dropdown affordance in sync with the active cell: show the
  // caret when the cell has a list rule, hide it otherwise; reposition on scroll.
  const refreshDvDropdown = async () => {
    if (!dvDropdown || !grid) return;
    const s = grid.selection();
    const single = s.range.sri === s.range.eri && s.range.sci === s.range.eci;
    if (!single) { dvDropdown.hide(); return; }
    let list = null;
    try { list = await client.dvListFor(activeName(), a1Of(s.ri, s.ci)); }
    catch { list = null; }
    // guard against a stale async result after the selection moved again
    const now = grid.selection();
    if (now.ri !== s.ri || now.ci !== s.ci) return;
    if (list) {
      const rect = grid.overlayRectOf(s.ri, s.ci);
      if (rect) dvDropdown.show(list.values, rect);
    } else {
      dvDropdown.hide();
    }
  };
  const repositionDvDropdown = () => {
    if (!dvDropdown || !dvDropdown.hasList() || !grid) return;
    const s = grid.selection();
    const rect = grid.overlayRectOf(s.ri, s.ci);
    if (rect) dvDropdown.reposition(rect);
  };

  // ---------- IO (Batch E): CSV + XLSX escape hatch; .reckon.json is the source
  // of truth. Every import passes the single ingress (validateRange /
  // validateWorkbook) and lands through applyTransaction (L4) so undo covers it
  // as one transaction. XLSX macros/VBA + external links are stripped and every
  // loss is itemised into the Import-notes panel — never silent (§8/§10). The
  // heavy libraries load lazily from the pinned CDN on first IO use. ----------
  let ioLibsLoading = null;
  const loadIoLibs = async () => {
    if (globalThis.Papa && globalThis.XLSX) return;
    if (!ioLibsLoading) {
      ioLibsLoading = (async () => {
        if (!globalThis.Papa) { const m = await import('https://cdn.jsdelivr.net/npm/papaparse@5.4.1/+esm'); globalThis.Papa = m.default ?? m; }
        if (!globalThis.XLSX) { const m = await import('https://cdn.jsdelivr.net/npm/xlsx@0.18.5/+esm'); globalThis.XLSX = m.default ?? m; }
      })();
    }
    try { await ioLibsLoading; } catch (e) { ioLibsLoading = null; toast('Could not load the IO libraries (a network connection is needed for import/export)', { kind: 'error', ms: 6000 }); throw e; }
  };

  const downloadBytes = (data, filename, mime) => {
    const blob = data instanceof Blob ? data : new Blob([data], { type: mime });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = filename; a.style.display = 'none';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
  };
  const cleanName = (s) => String(s || '').replace(/[^A-Za-z0-9._ -]/g, '_').trim();
  const baseName = () => (cleanName(fsaState.fileName || 'workbook').replace(/\.reckon\.json$/, '').replace(/\.[^.]+$/, '') || 'workbook');
  const baseFromFile = (fn) => (cleanName(String(fn || '').replace(/\.[^.]+$/, '')) || 'Imported');
  const newSheetId = () => `s${Date.now().toString(36)}${Math.floor(Math.random() * 1000)}`;
  const uniqueSheetName = (base, extra = []) => {
    let b = String(base || 'Sheet').slice(0, 80).trim() || 'Sheet';
    const taken = new Set([...sheets.map((s) => s.name), ...extra]);
    if (!taken.has(b)) return b;
    let n = 2; while (taken.has(`${b} ${n}`)) n += 1; return `${b} ${n}`;
  };
  const usedRangeOf = (cellsObj) => {
    let maxR = -1, maxC = -1;
    for (const k of Object.keys(cellsObj)) { const p = RK.parseA1(k); if (!p) continue; if (p.row > maxR) maxR = p.row; if (p.col > maxC) maxC = p.col; }
    return maxR < 0 ? null : `A1:${idxToCol(maxC)}${maxR + 1}`;
  };

  // ---- imports (one transaction each) ----
  let lastImportNotes = [];
  const importCsvText = async (text, fileName = 'import.csv') => {
    await loadIoLibs();
    const rows = RK.csvParse(text);
    if (!rows.length || (rows.length === 1 && rows[0].every((c) => c === ''))) { toast('CSV is empty', { kind: 'info' }); return null; }
    const values2d = rows.map((row) => row.map((v) => (v === '' ? null : RK.typedRaw(v))));
    const check = await client.validateRange(values2d);
    if (!check.ok) { toast(`CSV rejected: ${check.errors[0].path} ${check.errors[0].msg}`, { kind: 'error', ms: 6000 }); return null; }
    const name = uniqueSheetName(baseFromFile(fileName));
    const id = newSheetId();
    const cells = {};
    values2d.forEach((row, r) => row.forEach((v, c) => { if (v === null) return; cells[`${idxToCol(c)}${r + 1}`] = (typeof v === 'string' && v.startsWith('=')) ? { f: v } : { v }; }));
    const res = await txApply([{ op: 'sheetAdd', id, name }, { op: 'setCells', sheet: id, cells }], { origin: 'io:csv' });
    if (res) { activeId = id; await refreshSheets(); await loadActiveSheet(); toast(`Imported ${rows.length} row${rows.length === 1 ? '' : 's'} into ${name}`); }
    lastImportNotes = [];
    return res;
  };
  const importXlsxBytes = async (bytes, fileName = 'import.xlsx') => {
    await loadIoLibs();
    const parsed = RK.xlsxImport(bytes instanceof Uint8Array ? bytes : new Uint8Array(bytes));
    const chosen = [];
    const candSheets = parsed.sheets.map((sh, i) => {
      const uname = uniqueSheetName(sh.name || `Sheet${i + 1}`, chosen);
      chosen.push(uname);
      const s = { id: newSheetId() + i, name: uname, cells: sh.cells || {} };
      if (sh.cols) s.cols = sh.cols;
      if (sh.merges) s.merges = sh.merges;
      return s;
    });
    if (!candSheets.length) candSheets.push({ id: newSheetId(), name: uniqueSheetName(baseFromFile(fileName)), cells: {} });
    // single ingress: validate the assembled workbook BEFORE it touches state (§4)
    const cand = { reckon: { schema: 1, app: VERSION, created: new Date().toISOString(), modified: new Date().toISOString(), locale: 'en-IN' }, sheets: candSheets, names: {}, formats: {} };
    const vres = await client.validateWorkbook(cand);
    if (!vres.ok) {
      toast(`Import rejected: ${vres.errors[0].path} ${vres.errors[0].msg}`, { kind: 'error', ms: 7000 });
      lastImportNotes = parsed.notes.concat(vres.errors.map((e) => ({ sheet: '*', kind: 'rejected', detail: `${e.path} ${e.msg}` })));
      showImportNotes(lastImportNotes);
      return null;
    }
    // one bounded transaction: sheetAdd (carrying cols/merges) + setCells, then names
    const ops = [];
    for (const s of candSheets) {
      const add = { op: 'sheetAdd', id: s.id, name: s.name };
      if (s.cols) add.cols = s.cols;
      if (s.merges) add.merges = s.merges;
      ops.push(add);
      if (Object.keys(s.cells).length) ops.push({ op: 'setCells', sheet: s.id, cells: s.cells });
    }
    for (const [nm, ref] of Object.entries(parsed.names)) { if (!(nm in definedNames)) ops.push({ op: 'nameSet', name: nm, ref }); }
    const res = await txApply(ops, { origin: 'io:xlsx' });
    if (res) { activeId = candSheets[0].id; await refreshSheets(); await loadActiveSheet(); }
    lastImportNotes = parsed.notes;
    toast(`Imported ${candSheets.length} sheet${candSheets.length === 1 ? '' : 's'} from ${cleanName(fileName)}`);
    if (parsed.notes.length) showImportNotes(parsed.notes);
    return res;
  };

  // ---- exports ----
  const exportJson = async () => { const wb = await client.serialize(); downloadBytes(JSON.stringify(wb, null, 2), `${baseName()}.reckon.json`, 'application/json'); toast('Exported .reckon.json'); };
  const exportCsv = async () => {
    await loadIoLibs();
    const name = activeName();
    const wb = await client.serialize();
    const sh = wb.sheets.find((s) => s.name === name) ?? wb.sheets.find((s) => s.id === activeId);
    const rng = sh ? usedRangeOf(sh.cells) : null;
    let rows = [['']];
    if (rng) { const { values } = await client.regionValues(name, rng); rows = values.map((row) => row.map((v) => (v === null || v === undefined ? '' : (typeof v === 'object' && v.err ? v.err : v)))); }
    downloadBytes(RK.csvStringify(rows), `${baseName()}-${cleanName(name)}.csv`, 'text/csv;charset=utf-8');
    toast(`Exported ${name} as CSV`);
  };
  const exportXlsx = async () => {
    await loadIoLibs();
    const wb = await client.serialize();
    const values = {};
    for (const sh of wb.sheets) {
      const rng = usedRangeOf(sh.cells);
      if (!rng) continue;
      const { values: v2d, start } = await client.regionValues(sh.name, rng);
      const map = {};
      v2d.forEach((row, ri) => row.forEach((val, ci) => { if (val === null || val === undefined) return; map[`${idxToCol(start.col + ci)}${start.row + ri + 1}`] = val; }));
      values[sh.name] = map;
    }
    const out = RK.xlsxExport(wb, { values });
    downloadBytes(out, `${baseName()}.xlsx`, 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet');
    // charts cannot be written by SheetJS CE — itemise the loss, never silent
    // (§8/§10). The on-disk .reckon.json keeps every chart; only the .xlsx copy
    // drops them.
    // charts + conditional-formatting rules cannot be written by SheetJS CE
    const dropNotes = [];
    for (const sh of wb.sheets) for (const ch of (sh.charts ?? [])) {
      dropNotes.push({ sheet: sh.name, kind: 'charts', detail: `Chart "${ch.title || ch.type}" (${ch.type}) is not written to .xlsx. Charts live only in .reckon.json.` });
    }
    for (const sh of wb.sheets) for (const rule of (sh.conditionalFormats ?? [])) {
      dropNotes.push({ sheet: sh.name, kind: 'condfmt', detail: `Conditional-formatting rule (${rule.type}, ${rule.range}) is not written to .xlsx. Rules live only in .reckon.json.` });
    }
    // data-validation rules: SheetJS CE cannot write DataValidations — best-effort
    // is to drop + itemise (Batch M). Rules survive .reckon.json round-trip.
    for (const sh of wb.sheets) for (const rule of (sh.dataValidations ?? [])) {
      dropNotes.push({ sheet: sh.name, kind: 'datavalid', detail: `Data-validation rule (${rule.type}, ${rule.range}) is not written to .xlsx. Rules live only in .reckon.json.` });
    }
    // pivot tables: SheetJS CE cannot write real PivotTables (Batch N). Rather than
    // silently write a static values block that could clobber cells at the anchor,
    // the pivot is dropped + itemised; the pivot (and its live region) survives the
    // .reckon.json round-trip. Honest, and consistent with charts/CF/DV.
    for (const sh of wb.sheets) for (const pv of (sh.pivots ?? [])) {
      dropNotes.push({ sheet: sh.name, kind: 'pivots', detail: `Pivot "${pv.title || pv.id}" (source ${pv.sourceRange}) is not written to .xlsx — SheetJS CE cannot write PivotTables. It lives only in .reckon.json.` });
    }
    const chartN = dropNotes.filter((n) => n.kind === 'charts').length;
    const cfN = dropNotes.filter((n) => n.kind === 'condfmt').length;
    const dvN = dropNotes.filter((n) => n.kind === 'datavalid').length;
    const pvN = dropNotes.filter((n) => n.kind === 'pivots').length;
    if (dropNotes.length) { lastImportNotes = dropNotes; showImportNotes(dropNotes); }
    const parts = [];
    if (chartN) parts.push(`${chartN} chart${chartN > 1 ? 's' : ''}`);
    if (cfN) parts.push(`${cfN} CF rule${cfN > 1 ? 's' : ''}`);
    if (dvN) parts.push(`${dvN} DV rule${dvN > 1 ? 's' : ''}`);
    if (pvN) parts.push(`${pvN} pivot${pvN > 1 ? 's' : ''}`);
    toast(parts.length ? `Exported .xlsx (${parts.join(' + ')} dropped — see notes)` : 'Exported .xlsx');
  };

  // ---- Import-notes panel (new surface, §8: itemised, never a native dialog) ----
  const NOTE_LABEL = { macros: 'Macros removed', 'external-link': 'Link removed', formatting: 'Styling dropped', 'array-formula': 'Array formula', 'defined-name': 'Name skipped', truncated: 'Truncated', rejected: 'Rejected', charts: 'Chart dropped', condfmt: 'CF rule dropped', datavalid: 'DV rule dropped', pivots: 'Pivot dropped' };
  const showImportNotes = (notes) => {
    const body = document.createElement('div');
    body.className = 'rk-notes';
    const lede = document.createElement('p');
    lede.className = 'rk-notes-lede';
    lede.textContent = notes.length
      ? 'Some content was changed to fit Reckon. Your original file on disk is untouched — this affects only the copy imported here.'
      : 'Imported with no loss.';
    body.appendChild(lede);
    if (notes.length) {
      const list = document.createElement('ul');
      list.className = 'rk-notes-list';
      for (const n of notes) {
        const li = document.createElement('li');
        li.className = 'rk-notes-item';
        const tag = document.createElement('span');
        tag.className = `rk-notes-tag rk-notes-k-${n.kind}`;
        tag.textContent = NOTE_LABEL[n.kind] ?? n.kind;
        const where = document.createElement('span');
        where.className = 'rk-notes-where';
        where.textContent = n.sheet && n.sheet !== '*' ? `${n.sheet}${n.cell ? '!' + n.cell : ''}` : '';
        const det = document.createElement('span');
        det.className = 'rk-notes-detail';
        det.textContent = n.detail;
        li.append(tag, where, det);
        list.appendChild(li);
      }
      body.appendChild(list);
    }
    showDialog({ title: 'Import notes', body, buttons: [{ label: 'Close', primary: true, onClick: (d) => d.close() }] });
  };

  // hidden file input drives the import picker (a file dialog, not a native
  // alert/confirm — consistent with the FSA folder picker already in use)
  const fileInput = document.createElement('input');
  fileInput.type = 'file';
  fileInput.style.display = 'none';
  fileInput.setAttribute('aria-hidden', 'true');
  els.app.appendChild(fileInput);
  fileInput.addEventListener('change', async () => {
    const file = fileInput.files && fileInput.files[0];
    const kind = fileInput.dataset.kind;
    fileInput.value = '';
    if (!file) return;
    try {
      const lower = file.name.toLowerCase();
      if (kind === 'csv' || (kind !== 'xlsx' && lower.endsWith('.csv'))) await importCsvText(await file.text(), file.name);
      else await importXlsxBytes(new Uint8Array(await file.arrayBuffer()), file.name);
    } catch (e) { toast(`Import failed: ${e.message ?? e}`, { kind: 'error', ms: 6000 }); }
  });
  const pickFile = (kind, accept) => { fileInput.dataset.kind = kind; fileInput.accept = accept; fileInput.click(); };

  // export the workbook (or active sheet) to bytes WITHOUT downloading —
  // shared by the test hook and the agent face's export()->Blob.
  const ioBytes = async (kind) => {
    const wb = await client.serialize();
    if (kind === 'json') return new TextEncoder().encode(JSON.stringify(wb, null, 2));
    await loadIoLibs();
    if (kind === 'csv') {
      const name = activeName();
      const sh = wb.sheets.find((s) => s.name === name) ?? wb.sheets.find((s) => s.id === activeId);
      const rng = sh ? usedRangeOf(sh.cells) : null;
      let rows = [['']];
      if (rng) { const { values } = await client.regionValues(name, rng); rows = values.map((row) => row.map((v) => (v === null || v === undefined ? '' : (typeof v === 'object' && v.err ? v.err : v)))); }
      return new TextEncoder().encode(RK.csvStringify(rows));
    }
    const values = {};
    for (const s of wb.sheets) {
      const rng = usedRangeOf(s.cells);
      if (!rng) continue;
      const { values: v2d, start } = await client.regionValues(s.name, rng);
      const map = {};
      v2d.forEach((row, ri) => row.forEach((val, ci) => { if (val === null || val === undefined) return; map[`${idxToCol(start.col + ci)}${start.row + ri + 1}`] = val; }));
      values[s.name] = map;
    }
    return RK.xlsxExport(wb, { values });
  };

  // ---------- agent face (Batch F): window.reckon per handoff §6 ----------
  // The API goes through the SAME write path (applyTransaction, actor:"api"); it
  // cannot toggle settings, grant FSA, or read keys (those adapters are simply
  // not handed to it). eval never commits. Gated behind the Developer setting.
  let agentFace = null;
  const API_ORIGIN = () => (typeof location !== 'undefined' && location.origin && location.origin !== 'null' ? location.origin : 'bookmarklet');
  const parseRef = (ref) => {
    let s = String(ref ?? '').trim();
    let sheetName = activeName();
    const bang = s.lastIndexOf('!');
    if (bang >= 0) {
      let sn = s.slice(0, bang).trim();
      s = s.slice(bang + 1).trim();
      if (sn.startsWith("'") && sn.endsWith("'")) sn = sn.slice(1, -1).replace(/''/g, "'");
      sheetName = sn;
    }
    const range = RK.parseRangeA1(s);
    if (!range) throw new Error(`invalid range "${ref}"`);
    if (!sheets.some((x) => x.name === sheetName)) throw new Error(`no sheet "${sheetName}"`);
    return { sheetName, range };
  };
  const API_MAX_CELLS = 500000; // bound getRange so an unclamped A1:XFD... can't walk the worker to death
  const apiGetRange = async (ref) => {
    const { sheetName, range } = parseRef(ref);
    const cellCount = (range.end.row - range.start.row + 1) * (range.end.col - range.start.col + 1);
    if (cellCount > API_MAX_CELLS) throw new Error(`getRange too large: ${cellCount} cells > ${API_MAX_CELLS}`);
    const rangeA1 = `${a1Of(range.start.row, range.start.col)}:${a1Of(range.end.row, range.end.col)}`;
    const { values } = await client.regionValues(sheetName, rangeA1);
    const raws = await client.regionCells(sheetName, rangeA1);
    const rows = range.end.row - range.start.row + 1;
    const cols = range.end.col - range.start.col + 1;
    const formulas = [];
    for (let r = 0; r < rows; r += 1) {
      const fr = [];
      for (let c = 0; c < cols; c += 1) { const raw = raws[a1Of(range.start.row + r, range.start.col + c)]; fr.push(typeof raw === 'string' && raw.startsWith('=') ? raw : null); }
      formulas.push(fr);
    }
    return { values, formulas };
  };
  const apiSetRange = async (ref, values) => {
    const { sheetName, range } = parseRef(ref);
    const sheetId = sheets.find((x) => x.name === sheetName).id;
    if (!Array.isArray(values)) throw new Error('setRange values must be a 2-D array');
    const check = await client.validateRange(values);
    if (!check.ok) throw new Error(`setRange rejected: ${check.errors[0].path} ${check.errors[0].msg}`);
    const cells = {};
    values.forEach((row, r) => (Array.isArray(row) ? row : [row]).forEach((entry, c) => {
      const a1 = a1Of(range.start.row + r, range.start.col + c);
      if (entry === null || entry === undefined) { cells[a1] = null; return; }
      if (typeof entry === 'object') {
        if ('f' in entry) cells[a1] = { f: entry.f };
        else if ('v' in entry) cells[a1] = { v: entry.v };
        else if ('fmt' in entry) cells[a1] = { fmt: entry.fmt };
        else throw new Error(`setRange entry at ${a1} has none of f/v/fmt`);
      } else cells[a1] = (typeof entry === 'string' && entry.startsWith('=')) ? { f: entry } : { v: entry };
    }));
    const res = await txApply([{ op: 'setCells', sheet: sheetId, cells }], { actor: 'api', origin: `api:${API_ORIGIN()}`, enforce: true });
    return res ? res.txId : null;
  };
  const apiEval = async (formula, { sheet } = {}) => {
    const sheetName = sheet ? (sheets.find((x) => x.id === sheet || x.name === sheet)?.name ?? sheet) : activeName();
    const v = await client.evalFormula(sheetName, formula);
    if (v && typeof v === 'object' && v.err) return { error: v.err };
    return v;
  };
  const apiRecalc = async () => { await client.recalc(); await refreshActiveDisplay(); };
  const MIME = { json: 'application/json', csv: 'text/csv;charset=utf-8', xlsx: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' };
  const apiExportBlob = async (kind) => { const k = ['xlsx', 'csv', 'json'].includes(kind) ? kind : 'json'; const bytes = await ioBytes(k); return new Blob([bytes], { type: MIME[k] }); };

  const installAgentFace = () => {
    if (agentFace) return;
    agentFace = RK.createAgentFace({
      version: VERSION,
      sheets: () => sheets.map((s) => ({ id: s.id, name: s.name })),
      activeSheet: () => ({ ...activeSheet() }),
      getRange: apiGetRange,
      setRange: apiSetRange,
      evalFormula: apiEval,
      recalc: apiRecalc,
      exportBlob: apiExportBlob,
      originLabel: API_ORIGIN,
    });
    try { Object.defineProperty(window, 'reckon', { value: agentFace.reckon, configurable: true, writable: false, enumerable: true }); }
    catch { window.reckon = agentFace.reckon; }
  };
  const uninstallAgentFace = () => {
    if (!agentFace) return;
    agentFace.dispose();
    agentFace = null;
    try { delete window.reckon; } catch { window.reckon = undefined; }
  };

  // Developer setting: Enable window.reckon (off by default, persisted per machine)
  let devApi = false;
  const setDevApi = async (on) => {
    devApi = !!on;
    if (!ephemeral) await kvSet('devApi', devApi);
    if (devApi) installAgentFace(); else uninstallAgentFace();
    return devApi;
  };

  // ---------- sidecar (Batch G): AI proposer ladder + staging slot ----------
  // Ground floor is zero-AI. Nothing here runs on load; the ladder rungs are
  // enabled only by explicit user action in AI settings (no ambient calls, L5).
  let sidecar = null;
  let wbLocale = 'en-IN';
  let mockProposer = null;                       // test seam (window.__rk.setProposer)
  let webgpuInst = null;                         // cached WebGPU proposer (holds a worker)
  const aiConfig = { bridge: null, webgpu: null, byok: null }; // enabled rung configs

  // The single place the ladder is resolved to a proposer (bridge > webgpu >
  // byok). Synchronous so the sidecar can call it freely; configs are loaded
  // into aiConfig by explicit user action / boot restore.
  const getProposer = () => {
    if (mockProposer) return mockProposer;
    if (aiConfig.bridge && aiConfig.bridge.model) return RK.bridgeProposer(aiConfig.bridge);
    if (aiConfig.webgpu && aiConfig.webgpu.model) {
      if (!webgpuInst) webgpuInst = RK.webgpuProposer({ modelId: aiConfig.webgpu.model, onProgress: (p) => { if (p && p.status === 'progress' && p.file) toast(`downloading ${p.file}: ${Math.round((p.progress || 0))}%`, { ms: 1200 }); } });
      return webgpuInst;
    }
    if (aiConfig.byok && aiConfig.byok.base && aiConfig.byok.model) return RK.byokProposer(aiConfig.byok);
    return null;
  };

  // Build the bounded context slice from the current selection: selected cells
  // (value + formula), the enclosing block's headers (row 1 per column, col A
  // per row), named ranges, and locale. NEVER the whole sheet.
  const gatherSidecarContext = async ({ targetA1 } = {}) => {
    const s = grid.selection();
    const r = clampRange(s.range);
    const selA1 = rangeToA1(r);
    const [valsRes, raws] = await Promise.all([client.regionValues(activeName(), selA1), client.regionCells(activeName(), selA1)]);
    const vals = valsRes.values || [];
    const rows = r.eri - r.sri + 1; const cols = r.eci - r.sci + 1;
    const cells = [];
    for (let rr = 0; rr < rows && cells.length < 60; rr += 1) {
      for (let cc = 0; cc < cols && cells.length < 60; cc += 1) {
        const a1 = a1Of(r.sri + rr, r.sci + cc);
        const raw = raws[a1];
        cells.push({ a1, value: vals[rr]?.[cc] ?? null, formula: (typeof raw === 'string' && raw.startsWith('=')) ? raw : null });
      }
    }
    const columnHeaders = {}; const rowLabels = {};
    try {
      const hdr = (await client.regionValues(activeName(), `${a1Of(0, r.sci)}:${a1Of(0, r.eci)}`)).values || [];
      for (let cc = 0; cc < cols; cc += 1) { const h = hdr[0]?.[cc]; if (h != null && h !== '') columnHeaders[idxToCol(r.sci + cc)] = String(h); }
      const lab = (await client.regionValues(activeName(), `${a1Of(r.sri, 0)}:${a1Of(r.eri, 0)}`)).values || [];
      for (let rr = 0; rr < rows; rr += 1) { const h = lab[rr]?.[0]; if (h != null && h !== '') rowLabels[String(r.sri + rr + 1)] = String(h); }
    } catch { /* header read is best-effort */ }
    const namedRanges = {};
    for (const [n, ref] of Object.entries(definedNames || {})) namedRanges[n] = ref;
    const selectionRef = `${activeName()}!${targetA1 || a1Of(s.ri, s.ci)}`;
    return RK.buildContextSlice({ selectionRef, cells, columnHeaders, rowLabels, namedRanges, locale: wbLocale });
  };

  // Pre-evaluate a staged formula WITHOUT committing (the loud-failure surface).
  const sidecarEval = async (formula) => {
    const v = await client.evalFormula(activeName(), formula);
    if (v && typeof v === 'object' && v.err) return { error: v.err };
    return v;
  };

  // Accept a proposal: commit as a normal OWNER transaction (attributed to the
  // Owner, not the sidecar — the sidecar only proposed).
  const onSidecarAccept = async (formula, targetA1) => {
    const s = grid.selection();
    const a1 = targetA1 || a1Of(s.ri, s.ci);
    await txApply([{ op: 'setCells', sheet: activeId, cells: { [a1]: { f: formula } } }], { origin: 'ui:sidecar', actor: 'owner' });
    const m = /^([A-Z]{1,3})([0-9]+)$/.exec(a1);
    if (m) { let col = 0; for (const ch of m[1]) col = col * 26 + (ch.charCodeAt(0) - 64); col -= 1; grid.selectCell(Number(m[2]) - 1, col); }
    grid.focus();
    refreshBar();
  };

  const explainActiveCell = async () => {
    const s = grid.selection();
    const a1 = a1Of(s.ri, s.ci);
    const raw = (await client.getCell(activeName(), a1)).raw;
    if (typeof raw !== 'string' || !raw.startsWith('=')) { toast('Select a formula cell to explain', { kind: 'info' }); return; }
    sidecar.explain({ targetA1: a1, formula: raw });
  };

  // ---------- AI settings (explicit opt-in for each ladder rung) ----------
  const persistAi = async () => { if (!ephemeral) { await kvSet('aiBridge', aiConfig.bridge); await kvSet('aiWebgpu', aiConfig.webgpu); } };
  const openAiSettings = () => {
    const body = document.createElement('div'); body.className = 'rk-settings rk-ai-settings';
    const lede = document.createElement('p'); lede.className = 'rk-ai-lede';
    lede.textContent = RK.t('ai.lede');
    body.appendChild(lede);

    // Rung 1 — local bridge (Ollama)
    const s1 = document.createElement('div'); s1.className = 'rk-set-section';
    s1.innerHTML = `<h3>${RK.t('ai.bridgeH')}</h3><small>${RK.t('ai.bridgeNote')}</small>`;
    const bStatus = document.createElement('div'); bStatus.className = 'rk-ai-status';
    bStatus.textContent = aiConfig.bridge && aiConfig.bridge.model ? `enabled · ${aiConfig.bridge.model}` : RK.t('ai.notConnected');
    const bBtn = document.createElement('button'); bBtn.type = 'button'; bBtn.className = 'rk-btn'; bBtn.textContent = RK.t('ai.bridgeCheck');
    bBtn.addEventListener('click', async () => {
      bStatus.textContent = 'probing 127.0.0.1…';
      const models = await RK.probeBridge();
      if (!models || !models.length) { bStatus.textContent = 'no bridge found (start Ollama, then re-check)'; return; }
      const pick = document.createElement('select'); pick.className = 'rk-ai-select';
      for (const m of models) { const o = document.createElement('option'); o.value = m; o.textContent = m; pick.appendChild(o); }
      const use = document.createElement('button'); use.type = 'button'; use.className = 'rk-btn rk-btn-primary'; use.textContent = 'Use';
      use.addEventListener('click', async () => { aiConfig.bridge = { base: 'http://127.0.0.1:11434', model: pick.value }; await persistAi(); bStatus.textContent = `enabled · ${pick.value}`; sidecar?.refreshAffordance(); });
      bStatus.textContent = ''; bStatus.append(`${models.length} model(s): `, pick, ' ', use);
    });
    s1.append(bStatus, bBtn);
    body.appendChild(s1);

    // Rung 2 — on-device (WebGPU)
    const s2 = document.createElement('div'); s2.className = 'rk-set-section';
    s2.innerHTML = `<h3>${RK.t('ai.webgpuH')}</h3>`;
    const w = document.createElement('small');
    w.textContent = RK.webgpuSupported() ? RK.t('ai.webgpuNote') : RK.t('ai.webgpuNone');
    s2.appendChild(w);
    if (RK.webgpuSupported()) {
      const wStatus = document.createElement('div'); wStatus.className = 'rk-ai-status';
      wStatus.textContent = aiConfig.webgpu && aiConfig.webgpu.model ? `enabled · ${aiConfig.webgpu.model.split('/').pop()} (downloads on first use)` : 'off';
      const MODEL = 'onnx-community/Qwen2.5-0.5B-Instruct';
      const wBtn = document.createElement('button'); wBtn.type = 'button'; wBtn.className = 'rk-btn';
      wBtn.textContent = aiConfig.webgpu ? 'Disable' : 'Enable on-device model (~1 GB on first use)';
      wBtn.addEventListener('click', async () => {
        if (aiConfig.webgpu) { aiConfig.webgpu = null; if (webgpuInst) { webgpuInst.dispose?.(); webgpuInst = null; } wStatus.textContent = 'off'; wBtn.textContent = 'Enable on-device model (~1 GB on first use)'; }
        else { aiConfig.webgpu = { model: MODEL }; wStatus.textContent = `enabled · ${MODEL.split('/').pop()} (downloads on first use)`; wBtn.textContent = 'Disable'; }
        await persistAi(); sidecar?.refreshAffordance();
      });
      s2.append(wStatus, wBtn);
    }
    body.appendChild(s2);

    // Rung 3 — BYOK
    const s3 = document.createElement('div'); s3.className = 'rk-set-section';
    s3.innerHTML = `<h3>${RK.t('ai.byokH')}</h3><small>${RK.t('ai.byokNote')}</small>`;
    const baseIn = document.createElement('input'); baseIn.type = 'text'; baseIn.className = 'rk-ai-input'; baseIn.placeholder = 'Base URL (e.g. https://api.openai.com/v1)'; baseIn.value = aiConfig.byok?.base || '';
    const modelIn = document.createElement('input'); modelIn.type = 'text'; modelIn.className = 'rk-ai-input'; modelIn.placeholder = 'Model (e.g. gpt-4o-mini)'; modelIn.value = aiConfig.byok?.model || '';
    const keyIn = document.createElement('input'); keyIn.type = 'password'; keyIn.className = 'rk-ai-input'; keyIn.placeholder = 'API key (kept on this device)'; keyIn.autocomplete = 'off';
    const fp = document.createElement('div'); fp.className = 'rk-ai-fp'; fp.textContent = aiConfig.byok?.key ? `key on file · ${RK.keyFingerprint(aiConfig.byok.key)}` : '';
    const save = document.createElement('button'); save.type = 'button'; save.className = 'rk-btn rk-btn-primary'; save.textContent = RK.t('ai.saveKey');
    save.addEventListener('click', async () => {
      const cfg = { base: baseIn.value.trim(), model: modelIn.value.trim(), key: keyIn.value };
      if (!cfg.base || !cfg.model) { toast('Base URL and model are required', { kind: 'error' }); return; }
      aiConfig.byok = cfg; await RK.saveByok(cfg); fp.textContent = cfg.key ? `key on file · ${RK.keyFingerprint(cfg.key)}` : 'saved (no key — local server)'; keyIn.value = ''; sidecar?.refreshAffordance(); toast('BYOK saved on this device');
    });
    const clear = document.createElement('button'); clear.type = 'button'; clear.className = 'rk-btn'; clear.textContent = RK.t('ai.remove');
    clear.addEventListener('click', async () => { aiConfig.byok = null; await RK.clearByok(); fp.textContent = ''; baseIn.value = ''; modelIn.value = ''; keyIn.value = ''; sidecar?.refreshAffordance(); });
    s3.append(baseIn, modelIn, keyIn, fp, save, clear);
    body.appendChild(s3);

    showDialog({ title: RK.t('ai.title'), body, buttons: [{ label: RK.t('btn.close'), primary: true, onClick: (d) => d.close() }] });
  };

  // ---------- Settings + History panels (in-app, §13) ----------
  const openHistory = async () => {
    const log = await client.getLog();
    const head = await client.getHead();
    const body = document.createElement('div');
    body.className = 'rk-history';
    const list = document.createElement('div');
    list.className = 'rk-history-list';
    if (!log.length) { const none = document.createElement('div'); none.className = 'rk-history-none'; none.textContent = RK.t('hist.none'); list.appendChild(none); }
    for (let i = log.length - 1; i >= 0; i -= 1) {
      const e = log[i];
      const row = document.createElement('div');
      row.className = 'rk-history-row' + (i >= head ? ' undone' : '');
      const actor = document.createElement('span'); actor.className = `rk-history-actor rk-actor-${e.actor}`; actor.textContent = e.actor;
      const origin = document.createElement('span'); origin.className = 'rk-history-origin'; origin.textContent = e.origin;
      const ops = document.createElement('span'); ops.className = 'rk-history-ops'; ops.textContent = e.ops.map((o) => o.op).join(', ');
      const time = document.createElement('span'); time.className = 'rk-history-time'; time.textContent = new Date(e.ts).toLocaleTimeString();
      row.append(actor, origin, ops, time);
      list.appendChild(row);
    }
    body.appendChild(list);
    showDialog({ title: RK.t('hist.title'), body, buttons: [{ label: RK.t('btn.close'), primary: true, onClick: (d) => d.close() }] });
  };
  const setLanguage = async (loc) => {
    if (loc === RK.i18n.locale()) return;
    if (!ephemeral) await kvSet('lang', loc);
    await autosave?.flush().catch(() => {});
    // Apply by a clean reload so every built surface comes up fully translated
    // (the always-visible toolbar is built once at boot). The saved choice is
    // read on the next boot; in ephemeral mode carry it on the URL instead.
    if (ephemeral) { const u = new URL(location.href); u.searchParams.set('lang', loc); location.href = u.toString(); }
    else location.reload();
  };
  const openSettings = () => {
    const body = document.createElement('div');
    body.className = 'rk-settings';
    // Language
    const langSec = document.createElement('div'); langSec.className = 'rk-set-section';
    const langH = document.createElement('h3'); langH.textContent = RK.t('set.language'); langSec.appendChild(langH);
    const langRow = document.createElement('label'); langRow.className = 'rk-set-row';
    const langSel = document.createElement('select'); langSel.className = 'rk-set-lang';
    for (const loc of RK.i18n.locales) { const o = document.createElement('option'); o.value = loc; o.textContent = RK.i18n.localeName(loc); if (loc === RK.i18n.locale()) o.selected = true; langSel.appendChild(o); }
    langSel.setAttribute('aria-label', RK.t('set.language'));
    langSel.addEventListener('change', () => setLanguage(langSel.value));
    const langNote = document.createElement('small'); langNote.textContent = RK.t('set.languageNote');
    langRow.append(langSel); langSec.append(langRow, langNote);
    body.appendChild(langSec);
    const sec = document.createElement('div');
    sec.className = 'rk-set-section';
    const h = document.createElement('h3'); h.textContent = RK.t('set.developer'); sec.appendChild(h);
    const label = document.createElement('label');
    label.className = 'rk-set-row';
    const cb = document.createElement('input'); cb.type = 'checkbox'; cb.checked = devApi;
    const txt = document.createElement('span');
    txt.innerHTML = `${RK.t('set.devApiLabel')}<br><small>${RK.t('set.devApiNote')}</small>`;
    label.append(cb, txt);
    cb.addEventListener('change', () => setDevApi(cb.checked));
    sec.appendChild(label);
    const hist = document.createElement('button');
    hist.type = 'button'; hist.className = 'rk-btn'; hist.textContent = RK.t('set.viewHistory');
    hist.addEventListener('click', () => { closeDialog(); openHistory(); });
    sec.appendChild(hist);
    body.appendChild(sec);
    const aiSec = document.createElement('div'); aiSec.className = 'rk-set-section';
    const aiH = document.createElement('h3'); aiH.textContent = RK.t('set.aiSidecar'); aiSec.appendChild(aiH);
    const aiSmall = document.createElement('small'); aiSmall.textContent = RK.t('set.aiSidecarNote'); aiSec.appendChild(aiSmall);
    const aiBtn = document.createElement('button'); aiBtn.type = 'button'; aiBtn.className = 'rk-btn'; aiBtn.textContent = RK.t('set.aiSettings');
    aiBtn.addEventListener('click', () => { closeDialog(); openAiSettings(); });
    aiSec.appendChild(aiBtn);
    body.appendChild(aiSec);
    showDialog({ title: RK.t('set.title'), body, buttons: [{ label: RK.t('btn.close'), primary: true, onClick: (d) => d.close() }] });
  };
  els.settings?.addEventListener('click', openSettings);

  // ---------- tabs ----------
  const renderTabs = () => {
    els.tabs.querySelectorAll('.rk-tab').forEach((el) => el.remove());
    for (const sh of sheets) {
      const tab = document.createElement('button');
      tab.type = 'button';
      tab.className = 'rk-tab' + (sh.id === activeId ? ' active' : '');
      tab.dataset.sheetId = sh.id;
      const label = document.createElement('span');
      label.textContent = sh.name;
      tab.appendChild(label);
      if (sh.id === activeId && sheets.length > 1) {
        const x = document.createElement('span');
        x.className = 'rk-tab-x';
        x.textContent = '×';
        x.setAttribute('aria-label', `Delete ${sh.name}`);
        x.addEventListener('click', async (e) => {
          e.stopPropagation();
          if (await confirmDialog('Delete sheet', `Delete "${sh.name}"? Undo (⌘Z) can restore it.`)) {
            await txApply([{ op: 'sheetDelete', sheet: sh.id }], { origin: 'ui:tabs' });
          }
        });
        tab.appendChild(x);
      }
      tab.addEventListener('click', async () => {
        if (sh.id !== activeId) { activeId = sh.id; renderTabs(); await loadActiveSheet(); }
      });
      tab.addEventListener('dblclick', () => renameSheetInline(tab, sh));
      els.tabs.insertBefore(tab, els.tabAdd);
    }
  };

  const renameSheetInline = (tab, sh) => {
    const input = document.createElement('input');
    input.type = 'text';
    input.value = sh.name;
    input.className = 'rk-tab-rename';
    input.setAttribute('aria-label', 'Sheet name');
    tab.replaceChildren(input);
    input.focus();
    input.select();
    let done = false;
    const finish = async (commitName) => {
      if (done) return;
      done = true;
      const name = input.value.trim();
      renderTabs();
      if (commitName && name && name !== sh.name) {
        await txApply([{ op: 'sheetRename', sheet: sh.id, name }], { origin: 'ui:tabs' });
      }
      grid.focus();
    };
    input.addEventListener('keydown', (e) => {
      e.stopPropagation();
      if (e.key === 'Enter') finish(true);
      if (e.key === 'Escape') finish(false);
    });
    input.addEventListener('blur', () => finish(true));
  };

  const addSheet = async () => {
    const base = 'Sheet';
    let n = sheets.length + 1;
    while (sheets.some((s) => s.name === `${base}${n}`)) n += 1;
    const id = `s${Date.now().toString(36)}${Math.floor(Math.random() * 100)}`;
    const res = await txApply([{ op: 'sheetAdd', id, name: `${base}${n}` }], { origin: 'ui:tabs' });
    if (res) { activeId = id; await refreshSheets(); await loadActiveSheet(); }
  };
  els.tabAdd.addEventListener('click', addSheet);

  // ---------- find / replace ----------
  const openFind = () => {
    const body = document.createElement('div');
    body.className = 'rk-find';
    body.innerHTML = `
      <div class="rk-find-row">
        <input id="rk-find-q" type="text" placeholder="${RK.t('find.find')}" aria-label="${RK.t('find.find')}" autocomplete="off" spellcheck="false">
        <label class="rk-find-case"><input id="rk-find-case" type="checkbox"> ${RK.t('find.matchCase')}</label>
      </div>
      <div class="rk-find-row">
        <input id="rk-find-r" type="text" placeholder="${RK.t('find.replaceWith')}" aria-label="${RK.t('find.replaceWith')}" autocomplete="off" spellcheck="false">
      </div>
      <div class="rk-find-status" id="rk-find-status" role="status"></div>
      <div class="rk-find-results" id="rk-find-results"></div>`;
    let matches = [];
    let current = -1;
    const q = () => body.querySelector('#rk-find-q').value;
    const rep = () => body.querySelector('#rk-find-r').value;
    const matchCase = () => body.querySelector('#rk-find-case').checked;
    const statusEl = () => body.querySelector('#rk-find-status');
    const resultsEl = () => body.querySelector('#rk-find-results');

    const jumpTo = async (i) => {
      if (!matches[i]) return;
      current = i;
      const m = matches[i];
      const sh = sheets.find((s) => s.name === m.sheet);
      if (sh && sh.id !== activeId) { activeId = sh.id; renderTabs(); await loadActiveSheet(); }
      const p = /^([A-Z]{1,3})([0-9]+)$/.exec(m.a1);
      let col = 0; for (const ch of p[1]) col = col * 26 + (ch.charCodeAt(0) - 64); col -= 1;
      grid.selectCell(Number(p[2]) - 1, col);
      [...resultsEl().children].forEach((el, idx) => el.classList.toggle('active', idx === i));
    };

    const runFind = async () => {
      const query = q();
