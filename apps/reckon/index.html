<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="reckon-version" content="1.1.0">
<!-- CSP per handoff §10: NO unsafe-eval anywhere. unsafe-inline is required by
     the single-file shape (inline module script); it is not unsafe-eval. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline'; connect-src 'self' http://127.0.0.1:* https://cdn.jsdelivr.net https://huggingface.co https://*.hf.co https://api.openai.com https://api.anthropic.com https://openrouter.ai https://api.groq.com https://api.together.xyz https://api.mistral.ai https://generativelanguage.googleapis.com; img-src 'self' data: blob:; font-src 'self' data:; worker-src 'self' blob:">
<title>Reckon</title>
<link rel="icon" href="data:,">
<style id="rk-tokens">
  /* ================= Reckon tokens (handoff §8) =================
     ONE mono-adjacent family; ONE accent (selection / primary / focus only);
     neutral ramp n0..n9; spacing s1..s6. Every colour and spacing below is a
     token. The vendored canvas constants are retinted to these exact values
     at vendor time (scripts/vendor-grid.mjs — keep RK_TOKENS in sync). */
  :root {
    --rk-font: ui-monospace, "SF Mono", "Cascadia Mono", "JetBrains Mono", Menlo, Consolas, monospace;
    --rk-accent: #1a5fb4;
    --rk-accent-soft: rgba(26, 95, 180, 0.08);
    --rk-n0: #ffffff; --rk-n1: #f6f7f8; --rk-n2: #e3e5e8; --rk-n3: #c9ccd1;
    --rk-n4: #a6aab2; --rk-n5: #696e77; --rk-n6: #5c616b; --rk-n7: #40444c;
    --rk-n8: #2a2d33; --rk-n9: #17191d;
    --rk-s1: 2px; --rk-s2: 4px; --rk-s3: 8px; --rk-s4: 12px; --rk-s5: 16px; --rk-s6: 24px;
    /* formula-bar ref colouring, matched by the grid range outlines */
    --rk-ref0: #1a5fb4; --rk-ref1: #9141ac; --rk-ref2: #1d7a45;
    --rk-ref3: #b3541e; --rk-ref4: #a51d2d; --rk-ref5: #613583;
    --rk-danger: #a51d2d;
    --rk-warn: #7c5200; /* dark amber for a warn-mode DV rule; distinct from danger red, ~6.9:1 on white so it carries weight parity with the reject red */
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; height: 100%; overflow: hidden;
    background: var(--rk-n0); color: var(--rk-n8);
    font-family: var(--rk-font); font-size: 12px; line-height: 1.4; }
  button { font-family: var(--rk-font); }

  /* ---------------- shell layout ---------------- */
  #rk-app { display: flex; flex-direction: column; height: 100%; position: relative; }
  /* the formula bar is the instrument's cockpit — the chrome plane is toned
     (n1) so the white name box and formula field read as discrete, boxed
     controls, and the band separates firmly from the scrolling grid below. */
  #rk-bar { display: flex; align-items: stretch; height: 30px; flex: none;
    border-bottom: 1px solid var(--rk-n3); background: var(--rk-n1); padding: 3px 4px; gap: 4px; }
  #rk-namebox { width: 92px; flex: none; outline: none;
    border: 1px solid var(--rk-n2); background: var(--rk-n0);
    font: 12px var(--rk-font); color: var(--rk-n9); text-align: center; }
  #rk-namebox:focus { border-color: var(--rk-accent); box-shadow: inset 0 -2px 0 var(--rk-accent); }
  #rk-fx-wrap { position: relative; flex: 1; display: flex; align-items: center;
    border: 1px solid var(--rk-n2); background: var(--rk-n0); }
  #rk-fx-label { flex: none; width: 28px; text-align: center; color: var(--rk-n7);
    font-style: italic; font-weight: 600; user-select: none; border-right: 1px solid var(--rk-n2);
    align-self: stretch; line-height: 22px; }
  #rk-fx, #rk-fx-mirror {
    position: absolute; left: 29px; right: 0; top: 0; bottom: 0;
    font: 12px/22px var(--rk-font); padding: 0 var(--rk-s3);
    white-space: pre; overflow: hidden; }
  #rk-fx { border: none; outline: none; background: transparent;
    color: transparent; caret-color: var(--rk-n9); z-index: 2; }
  #rk-fx::selection { background: var(--rk-accent-soft); }
  #rk-fx-mirror { z-index: 1; color: var(--rk-n9); pointer-events: none; }
  .rk-ref-0 { color: var(--rk-ref0); } .rk-ref-1 { color: var(--rk-ref1); }
  .rk-ref-2 { color: var(--rk-ref2); } .rk-ref-3 { color: var(--rk-ref3); }
  .rk-ref-4 { color: var(--rk-ref4); } .rk-ref-5 { color: var(--rk-ref5); }
  .rk-tok-fn { color: var(--rk-n9); font-weight: 600; }
  .rk-tok-str { color: var(--rk-n6); }

  /* isolate so the chart layer's high z-index (needed to beat the vendored
     x-spreadsheet overlayer) stays CONTAINED inside the grid — dialogs, toasts
     and popovers (later siblings of #rk-grid) still paint above charts. */
  #rk-grid { position: relative; flex: 1; min-height: 0; overflow: hidden; isolation: isolate; }
  #rk-grid-focus { position: absolute; top: 0; left: 0; width: 1px; height: 1px;
    opacity: 0; outline: none; overflow: hidden; border: none; resize: none;
    padding: 0; }
  .rk-visually-hidden { position: absolute; width: 1px; height: 1px;
    overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

  /* ---------------- in-cell editor + ref outlines ---------------- */
  .rk-cell-editor { position: absolute; z-index: 20; display: flex;
    background: var(--rk-n0); border: 2px solid var(--rk-accent); }
  .rk-cell-editor[hidden] { display: none; }
  .rk-cell-editor input { border: none; outline: none; background: var(--rk-n0);
    font: 12px var(--rk-font); color: var(--rk-n9); padding: 0 3px; }
  .rk-ref-outlines { position: absolute; inset: 0; pointer-events: none; z-index: 15; overflow: hidden; }
  .rk-ref-outline { position: absolute; border: 2px solid; background: transparent; }
  .rk-ref-border-0 { border-color: var(--rk-ref0); } .rk-ref-border-1 { border-color: var(--rk-ref1); }
  .rk-ref-border-2 { border-color: var(--rk-ref2); } .rk-ref-border-3 { border-color: var(--rk-ref3); }
  .rk-ref-border-4 { border-color: var(--rk-ref4); } .rk-ref-border-5 { border-color: var(--rk-ref5); }

  /* ---------------- autocomplete ---------------- */
  .rk-autocomplete { position: fixed; z-index: 60; background: var(--rk-n0);
    border: 1px solid var(--rk-n3); box-shadow: 0 4px 12px rgba(23, 25, 29, 0.12);
    font-size: 12px; max-height: 208px; overflow-y: auto; }
  .rk-ac-item { display: flex; justify-content: space-between; gap: var(--rk-s5);
    padding: var(--rk-s1) var(--rk-s3); cursor: pointer; }
  .rk-ac-item.active { background: var(--rk-accent-soft); }
  .rk-ac-kind { color: var(--rk-n5); }

  /* ---------------- sidecar: `=?` affordance + staging slot (Batch G) ------
     The staging slot is an INSTRUMENT, not a chat panel: a boxed readout that
     shows the proposed formula (monospace), an arrow, and the PRE-EVALUATED
     value — or a loud error in danger-red. One accent for the primary action
     and focus; nothing decorative. Every proposal is honest before you accept. */
  #rk-ai-hint { flex: none; width: 30px; align-self: stretch; cursor: pointer;
    border: 1px solid var(--rk-n2); background: var(--rk-n0); color: var(--rk-accent);
    font: 600 12px var(--rk-font); letter-spacing: -0.5px; }
  #rk-ai-hint:hover { border-color: var(--rk-accent); }
  #rk-ai-hint.rk-dim { color: var(--rk-n5); cursor: default; }
  #rk-ai-hint.rk-dim:hover { border-color: var(--rk-n2); }
  #rk-sidecar { flex: none; border-bottom: 1px solid var(--rk-n3); background: var(--rk-n1);
    padding: var(--rk-s2) var(--rk-s3); }
  #rk-sidecar[hidden] { display: none; }
  .rk-sc-row { display: flex; align-items: center; gap: var(--rk-s3); min-height: 24px; }
  .rk-sc-label { flex: none; width: 24px; text-align: center; color: var(--rk-accent);
    font: 600 12px var(--rk-font); border: 1px solid var(--rk-n2); background: var(--rk-n0); line-height: 20px; }
  .rk-sc-badge { flex: none; font-size: 11px; color: var(--rk-n6); border: 1px solid var(--rk-n2);
    background: var(--rk-n0); padding: 1px var(--rk-s2); }
  .rk-sc-input { flex: 1; min-width: 0; border: 1px solid var(--rk-n2); background: var(--rk-n0);
    font: 12px var(--rk-font); color: var(--rk-n9); padding: 3px var(--rk-s3); outline: none; }
  .rk-sc-input:focus { border-color: var(--rk-accent); }
  .rk-sc-msg { flex: 1; color: var(--rk-n6); }
  .rk-sc-formula { flex: none; font: 12px var(--rk-font); color: var(--rk-n9); background: var(--rk-n0);
    border: 1px solid var(--rk-n2); padding: 2px var(--rk-s3); max-width: 45%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .rk-sc-arrow { flex: none; color: var(--rk-n5); }
  .rk-sc-result { flex: 1; min-width: 0; font: 12px var(--rk-font); color: var(--rk-n9);
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .rk-sc-result.rk-sc-err, .rk-sc-err { color: var(--rk-danger); }
  .rk-sc-wws { margin-top: var(--rk-s2); font-size: 11px; color: var(--rk-n6); white-space: pre-line;
    border-left: 2px solid var(--rk-accent); padding: var(--rk-s2) var(--rk-s3); background: var(--rk-n0); }
  .rk-sc-wws[hidden] { display: none; }
  .rk-sc-send, .rk-sc-cancel, .rk-sc-accept, .rk-sc-discard, .rk-sc-retry, .rk-sc-settings {
    flex: none; height: 24px; padding: 0 var(--rk-s3); font: 12px var(--rk-font); cursor: pointer; }

  /* explain-formula side panel — prose, nothing to commit */
  .rk-explain { position: fixed; top: 0; right: 0; bottom: 0; width: 340px; max-width: 90vw; z-index: 70;
    background: var(--rk-n0); border-left: 1px solid var(--rk-n3); box-shadow: -4px 0 16px rgba(23,25,29,0.12);
    display: flex; flex-direction: column; padding: var(--rk-s4); gap: var(--rk-s3); }
  .rk-explain-head { display: flex; align-items: center; gap: var(--rk-s3); }
  .rk-explain-title { flex: 1; font-weight: 600; color: var(--rk-n8); }
  .rk-explain-x { flex: none; border: none; background: transparent; font-size: 16px; cursor: pointer; color: var(--rk-n6); }
  .rk-explain-formula { display: block; font: 12px var(--rk-font); color: var(--rk-n9);
    background: var(--rk-n1); border: 1px solid var(--rk-n2); padding: var(--rk-s2) var(--rk-s3); word-break: break-all; }
  .rk-explain-body { flex: 1; overflow-y: auto; color: var(--rk-n8); line-height: 1.55; white-space: pre-wrap; }

  /* AI settings */
  .rk-ai-lede { margin: 0 0 var(--rk-s4); color: var(--rk-n6); font-size: 11px; line-height: 1.5; }
  .rk-ai-input { display: block; width: 100%; margin: var(--rk-s2) 0; border: 1px solid var(--rk-n2);
    background: var(--rk-n0); font: 12px var(--rk-font); color: var(--rk-n9); padding: var(--rk-s2) var(--rk-s3); outline: none; }
  .rk-ai-input:focus { border-color: var(--rk-accent); }
  .rk-ai-status { margin: var(--rk-s2) 0; color: var(--rk-n6); font-size: 11px; }
  .rk-ai-fp { margin: var(--rk-s2) 0; color: var(--rk-n7); font-size: 11px; }
  .rk-ai-select { font: 12px var(--rk-font); }

  /* ---------------- toolbar (Batch D) ---------------- */
  /* a dense instrument strip — toned chrome (n1), boxed controls, one accent
     for the active state. No decoration beyond what a control needs. */
  #rk-toolbar { display: flex; align-items: center; gap: 1px; flex: none;
    height: 28px; padding: 0 var(--rk-s2); position: relative;
    border-bottom: 1px solid var(--rk-n3); background: var(--rk-n1);
    overflow: visible; }
  .rk-tb-btn { border: 1px solid transparent; background: transparent;
    color: var(--rk-n7); font: 12px var(--rk-font); height: 22px; min-width: 24px;
    padding: 0 var(--rk-s2); cursor: pointer; display: inline-flex; align-items: center;
    justify-content: center; gap: 2px; white-space: nowrap; }
  .rk-tb-btn:hover { background: var(--rk-n0); border-color: var(--rk-n2); color: var(--rk-n9); }
  /* an ON toggle is a FILLED accent chip (not a hollow outline) so it never
     reads as the grid's hollow cell-selection box — see formats.critique.md */
  .rk-tb-btn.active { background: var(--rk-accent); border-color: var(--rk-accent);
    color: var(--rk-n0); }
  .rk-tb-btn.active .rk-tb-ic { color: var(--rk-n0); }
  .rk-tb-btn:focus-visible { outline: 2px solid var(--rk-accent); outline-offset: 1px; }
  .rk-tb-caret { color: var(--rk-n5); font-size: 9px; }
  .rk-tb-sub { font-size: 9px; vertical-align: super; }
  .rk-tb-sep { width: 1px; align-self: center; height: 16px; background: var(--rk-n3); margin: 0 var(--rk-s2); }
  .rk-tb-ic { display: block; color: var(--rk-n7); }
  .rk-tb-btn:hover .rk-tb-ic, .rk-tb-btn.active .rk-tb-ic { color: currentColor; }
  /* active number format is signalled by accent TEXT, not the toggle box —
     the blue box stays reserved for binary ON toggles (Filter/Freeze) */
  .rk-tb-fmt { min-width: 22px; text-align: center; }
  .rk-tb-btn.rk-tb-fmt-set { color: var(--rk-accent); }
  .rk-tb-btn.rk-tb-fmt-set .rk-tb-caret { color: var(--rk-accent); }
  /* right-anchored context readout: the active format label on wide viewports */
  .rk-tb-readout { margin-left: auto; padding: 0 var(--rk-s3); color: var(--rk-n5);
    font-size: 11px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    max-width: 40%; }

  .rk-tb-pop { position: absolute; z-index: 61; background: var(--rk-n0);
    border: 1px solid var(--rk-n3); box-shadow: 0 4px 12px rgba(23, 25, 29, 0.14);
    min-width: 168px; max-height: 320px; overflow-y: auto; padding: var(--rk-s1); }
  .rk-tb-pop-row { display: block; width: 100%; text-align: left; border: none;
    background: none; color: var(--rk-n8); font: 12px var(--rk-font);
    padding: var(--rk-s1) var(--rk-s3); cursor: pointer; white-space: pre; }
  .rk-tb-pop-row:hover { background: var(--rk-accent-soft); }
  .rk-tb-pop-row.active { color: var(--rk-accent); font-weight: 600; }
  .rk-tb-pop-swatches { display: grid; grid-template-columns: repeat(4, 22px); gap: var(--rk-s2); min-width: 0; padding: var(--rk-s3); }
  .rk-tb-swatch { width: 22px; height: 22px; border: 1px solid var(--rk-n3); cursor: pointer; padding: 0; }
  .rk-tb-swatch:hover { outline: 2px solid var(--rk-accent); outline-offset: 1px; }
  .rk-tb-swatch-none { background: var(--rk-n0); position: relative; }
  .rk-tb-swatch-none::after { content: ""; position: absolute; left: 1px; right: 1px; top: 10px;
    height: 1px; background: var(--rk-danger); transform: rotate(-45deg); }

  /* filter dialog */
  .rk-filter-head { color: var(--rk-n6); font-size: 11px; margin-bottom: var(--rk-s3); }
  .rk-filter-list { max-height: 320px; overflow-y: auto; display: flex; flex-direction: column; gap: 1px; }
  .rk-filter-item { display: flex; align-items: center; gap: var(--rk-s3); padding: var(--rk-s1) var(--rk-s2);
    font-size: 12px; color: var(--rk-n8); cursor: pointer; }
  .rk-filter-item:hover { background: var(--rk-n1); }
  .rk-filter-item span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  /* named-ranges dialog */
  .rk-names-list { display: flex; flex-direction: column; margin-bottom: var(--rk-s4); }
  .rk-names-none { color: var(--rk-n5); padding: var(--rk-s2); }
  .rk-names-row { display: flex; align-items: center; gap: var(--rk-s3); padding: var(--rk-s1) 0;
    border-top: 1px solid var(--rk-n2); }
  .rk-names-name { flex: none; width: 120px; color: var(--rk-n9); font-weight: 600; overflow: hidden; text-overflow: ellipsis; }
  .rk-names-ref { flex: 1; color: var(--rk-n6); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .rk-names-del { flex: none; border: none; background: none; color: var(--rk-n5); cursor: pointer; font-size: 14px; }
  .rk-names-del:hover { color: var(--rk-danger); }
  .rk-names-new { display: flex; gap: var(--rk-s2); }
  .rk-names-new input { font: 12px var(--rk-font); border: 1px solid var(--rk-n3); padding: var(--rk-s2); outline: none; }
  .rk-names-new input:focus { border-color: var(--rk-accent); }
  .rk-names-in-name { width: 120px; }
  .rk-names-in-ref { flex: 1; }

  /* the dimmed, never-hidden filtered-row count (handoff §8) */
  .rk-dim { color: var(--rk-n5); font-style: italic; white-space: nowrap; opacity: 0.75; }

  /* ---------------- footer: tabs + status ---------------- */
  #rk-foot { display: flex; align-items: stretch; height: 27px; flex: none;
    border-top: 1px solid var(--rk-n2); background: var(--rk-n1); }
  #rk-tabs { display: flex; align-items: stretch; overflow-x: auto; max-width: 60%; }
  .rk-tab { display: flex; align-items: center; gap: var(--rk-s2);
    border: none; border-right: 1px solid var(--rk-n2); background: var(--rk-n1);
    color: var(--rk-n6); font-size: 12px; padding: 0 var(--rk-s4); cursor: pointer;
    white-space: nowrap; }
  .rk-tab.active { background: var(--rk-n0); color: var(--rk-n9);
    box-shadow: inset 0 2px 0 var(--rk-accent); }
  .rk-tab-x { color: var(--rk-n5); padding: 0 var(--rk-s1); }
  .rk-tab-x:hover { color: var(--rk-danger); }
  .rk-tab-rename { width: 90px; font: 12px var(--rk-font); border: 1px solid var(--rk-accent); outline: none; padding: 0 var(--rk-s1); }
  #rk-tab-add { border: none; border-right: 1px solid var(--rk-n2); background: var(--rk-n1);
    color: var(--rk-n6); width: 27px; font-size: 14px; cursor: pointer; }
  #rk-tab-add:hover, .rk-tab:hover { color: var(--rk-n9); }
  #rk-status { display: flex; align-items: center; gap: var(--rk-s5);
    margin-left: auto; padding: 0 var(--rk-s3); font-size: 11px; color: var(--rk-n6);
    min-width: 0; }
  #rk-status-left { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #rk-status-left.error { color: var(--rk-danger); }
  #rk-status-stats { white-space: nowrap; color: var(--rk-n7); }
  #rk-status-version { color: var(--rk-n5); white-space: nowrap; }
  #rk-help-btn { border: 1px solid var(--rk-n3); background: var(--rk-n0);
    color: var(--rk-n6); width: 18px; height: 18px; line-height: 1; border-radius: 50%;
    cursor: pointer; font-size: 11px; padding: 0; }
  #rk-help-btn:hover { border-color: var(--rk-accent); color: var(--rk-accent); }
  #rk-settings-btn { border: none; background: none; color: var(--rk-n5); cursor: pointer;
    font-size: 13px; line-height: 1; padding: 0; }
  #rk-settings-btn:hover { color: var(--rk-accent); }
  .rk-chip { border: 1px solid var(--rk-accent); color: var(--rk-accent);
    background: var(--rk-n0); font-size: 11px; padding: 0 var(--rk-s2); cursor: pointer; }

  /* Settings + History panels (Batch F) */
  .rk-set-section h3 { margin: 0 0 var(--rk-s2); font-size: 12px; color: var(--rk-n7); }
  .rk-set-row { display: grid; grid-template-columns: auto 1fr; gap: var(--rk-s3);
    align-items: start; margin-bottom: var(--rk-s3); font-size: 12px; color: var(--rk-n8); }
  .rk-set-row input[type="checkbox"] { margin-top: 2px; accent-color: var(--rk-accent); }
  .rk-set-row small { color: var(--rk-n6); display: block; margin-top: var(--rk-s1); line-height: 1.5; }
  .rk-set-row code, .rk-settings code { background: var(--rk-n1); padding: 0 var(--rk-s1); }
  .rk-history { min-width: 460px; }
  .rk-history-list { display: flex; flex-direction: column; border-top: 1px solid var(--rk-n2);
    max-height: 52vh; overflow-y: auto; }
  .rk-history-row { display: grid; grid-template-columns: 56px 1fr auto 72px; gap: var(--rk-s3);
    align-items: baseline; padding: var(--rk-s2) 0; border-bottom: 1px solid var(--rk-n2); font-size: 12px; }
  .rk-history-row.undone { opacity: 0.45; }
  .rk-history-actor { font-size: 10px; text-transform: uppercase; letter-spacing: 0.04em;
    font-weight: 600; color: var(--rk-n6); }
  .rk-actor-api { color: var(--rk-accent); }
  .rk-history-origin { font-family: var(--rk-mono, ui-monospace, monospace); color: var(--rk-n7);
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .rk-history-ops { color: var(--rk-n8); white-space: nowrap; }
  .rk-history-time { color: var(--rk-n5); text-align: right; white-space: nowrap; }
  .rk-history-none { padding: var(--rk-s3) 0; color: var(--rk-n6); font-size: 12px; }

  /* ---------------- empty state (handoff §8) ---------------- */
  /* optically centered over the grid region and resolution-stable (a % of the
     app height, not a fixed offset from the bottom) — the first-run canvas
     should read as composed, not as a stray link pinned to the footer. */
  #rk-empty { position: absolute; left: 50%; top: 47%; transform: translate(-50%, -50%);
    z-index: 30; display: flex; align-items: center; gap: var(--rk-s3);
    background: var(--rk-n0); border: 1px solid var(--rk-n2);
    box-shadow: 0 2px 8px rgba(23, 25, 29, 0.08);
    padding: var(--rk-s2) var(--rk-s4); font-size: 12px; color: var(--rk-n6); }
  /* the empty-state card's display:flex would otherwise beat the [hidden]
     UA rule, leaving a tiny empty box floating over a data-bearing grid */
  #rk-empty[hidden] { display: none; }
  /* an instrument affordance, not a web hyperlink: weighted accent text,
     underline only on hover/focus */
  .rk-empty-link { border: none; background: none; color: var(--rk-accent);
    font-size: 12px; font-weight: 600; cursor: pointer; text-decoration: none; padding: 0; }
  .rk-empty-link:hover { text-decoration: underline; }
  .rk-empty-help { border: 1px solid var(--rk-n3); background: var(--rk-n0);
    color: var(--rk-n6); width: 18px; height: 18px; line-height: 1; border-radius: 50%;
    cursor: pointer; font-size: 11px; padding: 0; }

  /* ---------------- dialogs (in-app only, §13) ---------------- */
  .rk-dialog-backdrop { position: fixed; inset: 0; z-index: 50;
    background: rgba(23, 25, 29, 0.25); display: flex; align-items: flex-start; justify-content: center; }
  .rk-dialog { margin-top: 10vh; width: 460px; max-width: 92vw; background: var(--rk-n0);
    border: 1px solid var(--rk-n3); box-shadow: 0 8px 24px rgba(23, 25, 29, 0.2); }
  .rk-dialog-title { padding: var(--rk-s3) var(--rk-s4); font-weight: 600;
    border-bottom: 1px solid var(--rk-n2); color: var(--rk-n9); }
  .rk-dialog-body { padding: var(--rk-s4); max-height: 60vh; overflow-y: auto; }
  .rk-dialog-foot { display: flex; justify-content: flex-end; gap: var(--rk-s3);
    padding: var(--rk-s3) var(--rk-s4); border-top: 1px solid var(--rk-n2); }
  .rk-btn { border: 1px solid var(--rk-n3); background: var(--rk-n0); color: var(--rk-n8);
    font-size: 12px; padding: var(--rk-s2) var(--rk-s4); cursor: pointer; }
  .rk-btn:hover { border-color: var(--rk-n6); }
  .rk-btn-primary { background: var(--rk-accent); border-color: var(--rk-accent); color: var(--rk-n0); }
  .rk-btn-primary:hover { border-color: var(--rk-accent); filter: brightness(1.1); }
  .rk-btn:focus-visible, .rk-chip:focus-visible, .rk-tab:focus-visible,
  .rk-empty-link:focus-visible, #rk-help-btn:focus-visible {
    outline: 2px solid var(--rk-accent); outline-offset: 1px; }

  /* find & replace */
  .rk-find-row { display: flex; gap: var(--rk-s3); align-items: center; margin-bottom: var(--rk-s3); }
  .rk-find-row input[type="text"] { flex: 1; font: 12px var(--rk-font);
    border: 1px solid var(--rk-n3); padding: var(--rk-s2) var(--rk-s3); outline: none; }
  .rk-find-row input[type="text"]:focus { border-color: var(--rk-accent); }
  .rk-find-case { color: var(--rk-n6); font-size: 11px; white-space: nowrap; }
  .rk-find-status { color: var(--rk-n6); font-size: 11px; min-height: 16px; }
  .rk-find-results { max-height: 200px; overflow-y: auto; margin-top: var(--rk-s2);
    display: flex; flex-direction: column; }
  .rk-find-hit { display: flex; gap: var(--rk-s4); border: none; background: none;
    padding: var(--rk-s1) var(--rk-s2); font: 12px var(--rk-font); cursor: pointer;
    text-align: left; color: var(--rk-n8); }
  .rk-find-hit:hover, .rk-find-hit.active { background: var(--rk-accent-soft); }
  .rk-find-addr { color: var(--rk-accent); flex: none; }
  .rk-find-raw { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  /* folder dialog */
  .rk-folder-list { display: flex; flex-direction: column; margin-bottom: var(--rk-s4); }
  .rk-folder-file { border: none; background: none; text-align: left; cursor: pointer;
    font: 12px var(--rk-font); color: var(--rk-accent); padding: var(--rk-s2) var(--rk-s2); }
  .rk-folder-file:hover { background: var(--rk-accent-soft); }
  .rk-folder-none { color: var(--rk-n5); padding: var(--rk-s2); }
  .rk-folder-new { display: flex; align-items: center; gap: var(--rk-s2); }
  .rk-folder-new input { flex: 1; font: 12px var(--rk-font);
    border: 1px solid var(--rk-n3); padding: var(--rk-s2) var(--rk-s3); outline: none; }
  .rk-folder-new input:focus { border-color: var(--rk-accent); }
  .rk-folder-ext { color: var(--rk-n5); }

  /* help */
  .rk-help h3 { font-size: 12px; margin: var(--rk-s4) 0 var(--rk-s2); color: var(--rk-n9); }
  .rk-help-lede { margin: 0 0 var(--rk-s3); color: var(--rk-n7); }
  .rk-help-table { border-collapse: collapse; width: 100%; }
  .rk-help-table td { border-top: 1px solid var(--rk-n2); padding: var(--rk-s2) var(--rk-s3) var(--rk-s2) 0; vertical-align: top; }
  .rk-help-table td:first-child { color: var(--rk-n7); white-space: nowrap; }
  .rk-help-note { color: var(--rk-n6); font-size: 11px; margin: var(--rk-s3) 0 0; }
  .rk-help code { background: var(--rk-n1); padding: 0 var(--rk-s1); }

  /* Import-notes panel (Batch E): itemised, never silent (§8/§10) */
  .rk-notes { min-width: 420px; }
  .rk-notes-lede { margin: 0 0 var(--rk-s3); color: var(--rk-n7); font-size: 12px; line-height: 1.5; }
  .rk-notes-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column;
    border-top: 1px solid var(--rk-n2); max-height: 46vh; overflow-y: auto; }
  .rk-notes-item { display: grid; grid-template-columns: 108px 96px 1fr; gap: var(--rk-s3);
    align-items: baseline; padding: var(--rk-s2) 0; border-bottom: 1px solid var(--rk-n2); font-size: 12px; }
  .rk-notes-tag { font-size: 10px; text-transform: uppercase; letter-spacing: 0.04em; font-weight: 600;
    color: var(--rk-n6); white-space: nowrap; }
  /* the two genuine strips carry the single accent as a signal; the rest stay neutral */
  .rk-notes-k-macros, .rk-notes-k-external-link, .rk-notes-k-rejected { color: var(--rk-accent); }
  .rk-notes-where { font-family: var(--rk-mono, ui-monospace, monospace); color: var(--rk-n7); white-space: nowrap; }
  .rk-notes-detail { color: var(--rk-n8); }

  /* toasts */
  #rk-toast-host { position: fixed; right: var(--rk-s4); bottom: 39px; z-index: 70;
    display: flex; flex-direction: column; gap: var(--rk-s2); align-items: flex-end; }
  .rk-toast { background: var(--rk-n8); color: var(--rk-n0); font-size: 12px;
    padding: var(--rk-s2) var(--rk-s4); box-shadow: 0 2px 8px rgba(23, 25, 29, 0.2);
    max-width: 420px; }
  .rk-toast-error { background: var(--rk-danger); }
  .rk-toast.out { opacity: 0; }

  /* ---------------- charts (Batch K) ---------------- */
  /* the layer floats over the grid but never blocks grid mouse/scroll — only
     the chart boxes themselves are interactive (pointer-events auto). */
  /* above the vendored x-spreadsheet overlayer (z-index up to ~1001) so chart
     boxes receive the pointer; the layer itself is pointer-events:none, so grid
     interaction passes through everywhere except on a chart box. */
  .rk-chart-layer { position: absolute; inset: 0; pointer-events: none; z-index: 1010; }
  .rk-chart { position: absolute; pointer-events: auto; background: var(--rk-n0);
    border: 1px solid var(--rk-n3); box-shadow: 0 1px 3px rgba(23,25,29,0.10);
    display: flex; flex-direction: column; outline: none; }
  .rk-chart:focus-visible { border-color: var(--rk-accent); box-shadow: 0 0 0 2px var(--rk-accent-soft); }
  .rk-chart.rk-chart-dragging { opacity: 0.92; }
  .rk-chart-head { flex: none; height: 20px; display: flex; align-items: center;
    gap: var(--rk-s2); padding: 0 var(--rk-s2); background: var(--rk-n1);
    border-bottom: 1px solid var(--rk-n2); cursor: move; user-select: none; }
  .rk-chart-title { flex: 1; font-size: 10px; color: var(--rk-n7); overflow: hidden;
    white-space: nowrap; text-overflow: ellipsis; }
  .rk-chart-edit { flex: none; border: none; background: transparent; color: var(--rk-n6);
    font-size: 11px; line-height: 1; padding: 2px 3px; cursor: pointer; border-radius: 2px; }
  .rk-chart-edit:hover { background: var(--rk-n2); color: var(--rk-n8); }
  .rk-chart-edit:focus-visible { outline: 2px solid var(--rk-accent); outline-offset: 1px; }
  .rk-chart-body { flex: 1; min-height: 0; overflow: hidden; }
  .rk-chart-body svg { width: 100%; height: 100%; }
  .rk-chart-resize { position: absolute; right: 0; bottom: 0; width: 14px; height: 14px;
    cursor: nwse-resize; background:
      linear-gradient(135deg, transparent 0 6px, var(--rk-n4) 6px 7px, transparent 7px 9px, var(--rk-n4) 9px 10px, transparent 10px); }
  /* chart settings panel fields */
  .rk-chart-set { display: flex; flex-direction: column; gap: var(--rk-s3); min-width: 320px; }
  .rk-chart-set-row { display: flex; align-items: center; gap: var(--rk-s3); font-size: 12px; }
  .rk-chart-set-label { flex: none; width: 130px; color: var(--rk-n7); }
  .rk-chart-set-row input[type="text"], .rk-chart-set-row select {
    flex: 1; font: 12px var(--rk-font); padding: 3px 5px;
    border: 1px solid var(--rk-n3); background: var(--rk-n0); color: var(--rk-n9); }
  .rk-chart-set-row input[type="text"]:focus, .rk-chart-set-row select:focus {
    outline: none; border-color: var(--rk-accent); box-shadow: inset 0 -2px 0 var(--rk-accent); }
  .rk-chart-set-row input[type="checkbox"] { flex: none; }
  .rk-notes-k-charts { background: var(--rk-accent-soft); color: var(--rk-accent); }
  .rk-notes-k-condfmt { background: var(--rk-accent-soft); color: var(--rk-accent); }
  .rk-notes-k-pivots { background: var(--rk-accent-soft); color: var(--rk-accent); }

  /* pivot tables (Batch N): a cell-anchored, read-only region overlay that
     scrolls with the grid (lives in the content-overlay space). The left accent
     edge reads it as an instrument region, distinct from the honest cells around
     it; the region writes no cells. No animation -> nothing to suppress under
     prefers-reduced-motion. */
  .rk-pivot-layer { position: absolute; inset: 0; pointer-events: none; z-index: 5; }
  .rk-pivot { position: absolute; pointer-events: auto; background: var(--rk-n0);
    border: 1px solid var(--rk-n3); border-left: 2px solid var(--rk-accent);
    box-shadow: 0 1px 3px rgba(23,25,29,0.10); display: flex; flex-direction: column;
    max-width: min(680px, 80%); max-height: 62%; }
  .rk-pivot-head { flex: none; height: 20px; display: flex; align-items: center;
    gap: var(--rk-s2); padding: 0 var(--rk-s2); background: var(--rk-n1);
    border-bottom: 1px solid var(--rk-n2); user-select: none; }
  .rk-pivot-title { flex: none; font-size: 10px; font-weight: 600; color: var(--rk-n8);
    text-transform: uppercase; letter-spacing: 0.04em; }
  .rk-pivot-summary { flex: 1; min-width: 0; font-size: 10px; color: var(--rk-n7);
    overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
  .rk-pivot-head-sp { flex: 0; }
  .rk-pivot-btn { flex: none; border: none; background: transparent; color: var(--rk-n6);
    font-size: 11px; line-height: 1; padding: 2px 4px; cursor: pointer; border-radius: 2px; }
  .rk-pivot-btn:hover { background: var(--rk-n2); color: var(--rk-n8); }
  .rk-pivot-btn:focus-visible { outline: 2px solid var(--rk-accent); outline-offset: 1px; }
  .rk-pivot-body { flex: 1; min-height: 0; overflow: auto; }
  /* read-only wash (§8 honesty): the pivot BODY sits on the n1 tint (a step off
     the white n0 editable grid) so computed output never reads as a typeable
     cell; header/total tiers step darker (n2) — value < header < total < grand. */
  .rk-pivot-table { border-collapse: collapse; font: 11px var(--rk-font); color: var(--rk-n9); background: var(--rk-n1); }
  .rk-pivot-table th, .rk-pivot-table td { border: 1px solid var(--rk-n2); padding: 2px 6px; text-align: right; white-space: nowrap; }
  .rk-pivot-table th { font-weight: 600; }
  .rk-pv-val { background: var(--rk-n1); font-variant-numeric: tabular-nums; }
  /* axis-label corner cells: italic so the two header tiers separate; n7 keeps
     the de-emphasised metadata honestly ≥4.5:1 on the n2 fill (§8) */
  .rk-pivot-table th.rk-pv-corner, .rk-pivot-table th.rk-pv-rowfield { text-align: left; background: var(--rk-n2); color: var(--rk-n7); font-style: italic; font-weight: 500; }
  .rk-pivot-table th.rk-pv-colhead { text-align: center; background: var(--rk-n2); color: var(--rk-n8); }
  .rk-pivot-table th.rk-pv-valhead { text-align: right; background: var(--rk-n2); color: var(--rk-n7); font-weight: 500; }
  .rk-pivot-table th.rk-pv-rowhead { text-align: left; background: var(--rk-n2); color: var(--rk-n8); }
  /* totals carry weight through TYPE + a rule, not selection-blue (which reads as
     the cursor). Grand total = darker tint + heavier weight + a top border rule. */
  /* totals emphasised by TYPE + border RULES on a flat neutral fill — never a
     darker filled box (which borrows the active-cell selection vocabulary). The
     grand total is bounded by a top rule (tfoot) + a left rule so it reads as a
     ledger total, not a focused cell. */
  .rk-pv-total { background: var(--rk-n2); font-weight: 600; }
  .rk-pivot-table tfoot th, .rk-pivot-table tfoot td { border-top: 2px solid var(--rk-n4); }
  .rk-pivot-table td.rk-pv-grand, .rk-pivot-table th.rk-pv-grand { background: var(--rk-n2); color: var(--rk-n9); font-weight: 700; border-left: 2px solid var(--rk-n4); }
  .rk-pv-emptyrow { text-align: center; color: var(--rk-n6); padding: var(--rk-s3); }

  /* pivot builder dialog — the builder needs more room than the default 460px
     dialog, so the dialog widens when it hosts a pivot builder (:has, supported
     on the browser floor); the content then never overflows/clips. */
  .rk-dialog:has(.rk-pv) { width: min(760px, 94vw); }
  .rk-pv { display: flex; flex-direction: column; gap: var(--rk-s3); width: 100%; min-width: 0; }
  .rk-pv-top { display: grid; grid-template-columns: 1fr 1fr; gap: var(--rk-s2) var(--rk-s3); }
  .rk-pv-field { display: flex; flex-direction: column; gap: 2px; font-size: 11px; min-width: 0; }
  .rk-pv-field:first-child { grid-column: 1 / -1; }
  .rk-pv-flabel { color: var(--rk-n7); }
  .rk-pv-field input { font: 12px var(--rk-font); padding: 3px 5px; border: 1px solid var(--rk-n3); background: var(--rk-n0); color: var(--rk-n9); }
  .rk-pv-field input:focus { outline: none; border-color: var(--rk-accent); box-shadow: inset 0 -2px 0 var(--rk-accent); }
  .rk-pv-cols { display: flex; flex-direction: column; gap: var(--rk-s3); }
  .rk-pv-avail { display: flex; flex-direction: column; gap: var(--rk-s2); }
  .rk-pv-zones { display: grid; grid-template-columns: repeat(4, 1fr); gap: var(--rk-s2); align-content: start; }
  .rk-pv-zonehead { font-size: 10px; text-transform: uppercase; letter-spacing: 0.04em; color: var(--rk-n6); }
  .rk-pv-zone { border: 1px solid var(--rk-n2); padding: var(--rk-s2); min-height: 46px; }
  .rk-pv-chips { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 2px; }
  .rk-pv-chip { display: inline-flex; align-items: center; gap: 4px; background: var(--rk-n1);
    border: 1px solid var(--rk-n3); border-radius: 2px; padding: 1px 4px; font-size: 11px; }
  .rk-pv-chip-name { color: var(--rk-n9); }
  .rk-pv-chip-x { border: none; background: transparent; color: var(--rk-n6); cursor: pointer; font-size: 12px; line-height: 1; padding: 0 2px; }
  .rk-pv-chip-x:hover { color: var(--rk-danger); }
  .rk-pv-add { border: 1px solid var(--rk-n3); background: var(--rk-n0); color: var(--rk-n7);
    font-size: 10px; padding: 0 3px; cursor: pointer; border-radius: 2px; }
  .rk-pv-add:hover:not(:disabled) { border-color: var(--rk-accent); color: var(--rk-accent); }
  .rk-pv-add:disabled, .rk-pv-add-on { opacity: 0.4; cursor: default; }
  .rk-pv-agg, .rk-pv-fltvals { font: 11px var(--rk-font); border: 1px solid var(--rk-n3); background: var(--rk-n0); color: var(--rk-n9); }
  .rk-pv-fltvals { width: 130px; padding: 1px 3px; }
  .rk-pv-agg:focus, .rk-pv-fltvals:focus { outline: none; border-color: var(--rk-accent); }
  .rk-pv-none { font-size: 11px; color: var(--rk-n6); padding: 2px; }
  .rk-pv-preview { border: 1px solid var(--rk-n2); max-height: 200px; overflow: auto; padding: var(--rk-s2); background: var(--rk-n0); }
  .rk-pv-preview-table { border-collapse: collapse; font: 11px var(--rk-font); color: var(--rk-n9); }
  .rk-pv-preview-table th, .rk-pv-preview-table td { border: 1px solid var(--rk-n2); padding: 2px 6px; text-align: right; white-space: nowrap; }
  .rk-pv-preview-table th { background: var(--rk-n1); color: var(--rk-n7); text-align: left; }

  /* conditional formatting (Batch L): data-bar overlay + rules manager */
  .rk-databar-layer { position: absolute; inset: 0; pointer-events: none; z-index: 2; }
  /* translucent so the value stays legible THROUGH the bar (draw-behind, §8);
     no transition -> nothing to suppress under prefers-reduced-motion */
  .rk-databar { position: absolute; border-radius: 1px; }
  .rk-cf { display: flex; flex-direction: column; gap: var(--rk-s3); min-width: 440px; max-width: 520px; }
  .rk-cf-sheet { font-size: 11px; color: var(--rk-n6); }
  .rk-cf-list { display: flex; flex-direction: column; border: 1px solid var(--rk-n2); }
  .rk-cf-none { padding: var(--rk-s3); color: var(--rk-n6); font-size: 12px; text-align: center; }
  .rk-cf-item { display: flex; align-items: center; gap: var(--rk-s2); padding: var(--rk-s2) var(--rk-s3);
    border-bottom: 1px solid var(--rk-n2); font-size: 12px; }
  .rk-cf-item:last-child { border-bottom: none; }
  .rk-cf-item-sw { flex: none; width: 26px; height: 16px; border: 1px solid var(--rk-n3); border-radius: 2px;
    display: inline-flex; align-items: center; justify-content: center; font: 600 10px var(--rk-font); }
  .rk-cf-item-txt { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--rk-n9); }
  .rk-cf-item-range { flex: none; color: var(--rk-n6); font: 11px var(--rk-font); }
  .rk-cf-item-ctl { flex: none; display: inline-flex; gap: 2px; }
  .rk-cf-mv, .rk-cf-edit, .rk-cf-del { border: 1px solid var(--rk-n2); background: var(--rk-n0); color: var(--rk-n7);
    font: 11px var(--rk-font); padding: 1px 5px; cursor: pointer; }
  .rk-cf-mv:disabled { color: var(--rk-n3); cursor: default; }
  .rk-cf-mv:hover:not(:disabled), .rk-cf-edit:hover, .rk-cf-del:hover { border-color: var(--rk-accent); color: var(--rk-accent); }
  .rk-cf-del { color: var(--rk-n6); }
  .rk-cf-form { display: flex; flex-direction: column; gap: var(--rk-s2);
    border-top: 1px solid var(--rk-n2); padding-top: var(--rk-s3); }
  .rk-cf-row { display: flex; align-items: center; gap: var(--rk-s3); font-size: 12px; }
  .rk-cf-label { flex: none; width: 150px; color: var(--rk-n7); }
  .rk-cf-row select, .rk-cf-row input[type="text"] {
    flex: 1; font: 12px var(--rk-font); padding: 3px 5px;
    border: 1px solid var(--rk-n3); background: var(--rk-n0); color: var(--rk-n9); }
  .rk-cf-row select:focus, .rk-cf-row input[type="text"]:focus {
    outline: none; border-color: var(--rk-accent); box-shadow: inset 0 -2px 0 var(--rk-accent); }
  .rk-cf-presets { flex: 1; display: flex; gap: var(--rk-s2); flex-wrap: wrap; }
  .rk-cf-preset { border: 1px solid var(--rk-n2); background: var(--rk-n0); padding: 2px; cursor: pointer; line-height: 0; }
  .rk-cf-preset.active { border-color: var(--rk-accent); box-shadow: 0 0 0 1px var(--rk-accent); }
  .rk-cf-swatch { display: inline-flex; align-items: center; justify-content: center;
    width: 34px; height: 18px; border-radius: 2px; font: 600 11px var(--rk-font); }
  .rk-cf-add { align-self: flex-start; margin-top: var(--rk-s1); }

  /* ---- data validation (Batch M) ---- */
  /* invalid-cell marker: a small danger triangle in the cell's top-right corner,
     drawn in a pointer-eventless overlay layer (the value stays fully legible) */
  .rk-dv-layer { position: absolute; inset: 0; pointer-events: none; z-index: 3; }
  .rk-dv-marker { position: absolute; width: 0; height: 0;
    border-top: 8px solid var(--rk-danger); border-left: 8px solid transparent; }
  /* in-cell list dropdown: caret affordance + listbox popup */
  .rk-dv-caret { position: absolute; z-index: 4; width: 17px; padding: 0;
    display: inline-flex; align-items: center; justify-content: center;
    border: 1px solid var(--rk-n4); border-radius: 2px; background: var(--rk-n2);
    color: var(--rk-n8); font-size: 11px; line-height: 1; cursor: pointer; }
  .rk-dv-caret:hover { border-color: var(--rk-accent); background: var(--rk-accent); color: var(--rk-n0); }
  .rk-dv-pop { position: absolute; z-index: 20; max-height: 220px; overflow-y: auto;
    background: var(--rk-n0); border: 1px solid var(--rk-n4); border-top: none;
    box-shadow: 0 6px 22px rgba(0,0,0,0.24); font: 12px var(--rk-font); }
  .rk-dv-pop-none { padding: var(--rk-s2) var(--rk-s3); color: var(--rk-n6); font-style: italic; }
  .rk-dv-opt { padding: var(--rk-s1) var(--rk-s3); cursor: pointer; white-space: nowrap;
    color: var(--rk-n9); }
  /* the active/hover row echoes the grid's own hollow cell-selection (soft accent
     tint + an accent edge), not a saturated native-select bar — keeps the value
     legible and the control reading as part of the instrument */
  .rk-dv-opt.active { background: var(--rk-accent-soft); color: var(--rk-n9);
    box-shadow: inset 2px 0 0 var(--rk-accent); }
  /* rules manager (mirrors .rk-cf) */
  .rk-dv { display: flex; flex-direction: column; gap: var(--rk-s3); min-width: 460px; max-width: 540px; }
