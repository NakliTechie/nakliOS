<script type="text/reckon-src" id="rk-src::core/transaction.mjs">
// Reckon — transactions, history, undo/redo (RECKON-AGENT-HANDOFF.md §5, L4).
// applyTransaction({actor, origin, ops[]}) is the ONLY write path. Every
// transaction is appended to History with inverse ops PREcomputed at commit
// time; undo/redo is a log walk; replaying the log from empty reconstructs the
// workbook (structural check wired into `make verify`).
//
// Op set (closed, §5): setCells, setFormat, insertRows, deleteRows,
// insertCols, deleteCols, moveRange, sheetAdd, sheetRename, sheetDelete,
// nameSet. Inverse ops are expressed in the same op set so replay and undo
// share one executor.
//
// Module contract (single-file doctrine): no imports; deps injected or read
// lazily from globalThis.Reckon; registers itself on globalThis.Reckon.

const OPS = new Set([
  'setCells', 'setFormat', 'insertRows', 'deleteRows', 'insertCols', 'deleteCols',
  'moveRange', 'sheetAdd', 'sheetRename', 'sheetDelete', 'nameSet',
  // Grid chunk additions (STATE.md interpretation 5): row/col size meta ops,
  // plus setMerges (inverse-restore + display-only merge meta; no merge UI).
  'sizeRows', 'sizeCols', 'setMerges',
  // Batch D addition: freeze-panes meta op (freeze already RENDERS from
  // sheetMeta.freeze; this makes it mutable through the single write path with
  // an inverse). setFormat/nameSet were already in §5's closed set.
  'setFreeze',
  // Batch K addition: per-sheet chart objects. Charts are pure display meta
  // (like merges/freeze) — no engine cells move — so create/move/resize/retype/
  // edit/delete are all meta mutations with a precomputed inverse (undo covers
  // charts; log-replay reconstructs them).
  'chartAdd', 'chartUpdate', 'chartDelete',
  // Batch L addition: per-sheet conditional-formatting rules. CF is a render-time
  // display layer (never stored per cell) — so, like merges, the whole ordered
  // rule list is set at once with a snapshot inverse (add/edit/delete/reorder all
  // ride one op; undo covers each, log-replay reconstructs).
  'cfSet',
  // Batch M addition: per-sheet data-validation rules. DV rules are workbook
  // state (like CF) but GATE user writes at the ingress rather than render — the
  // rule list itself, however, is still meta, so it rides the same whole-array
  // snapshot-inverse op (add/edit/delete all one undoable tx; log-replay rebuilds).
  'dvSet',
  // Batch N addition: per-sheet pivot tables. A pivot is display meta (a
  // materialised region rendered read-only from the source's computed values —
  // it writes no cells, so there is no second write path). The whole ordered
  // pivot list is set at once with a snapshot inverse (create/edit/move/delete
  // all one undoable tx; log-replay reconstructs; .reckon.json round-trips).
  'pivotSet',
]);
// the top-level chart fields a chartUpdate patch may set (id is immutable)
const CHART_PATCH_KEYS = ['type', 'title', 'dataRange', 'orientation', 'headerRow', 'headerCol', 'series', 'pos', 'size', 'options'];
const ACTORS = new Set(['owner', 'api', 'system', 'sidecar']);

const clone = (x) => (x === undefined ? undefined : JSON.parse(JSON.stringify(x)));

export function createSession({ engine, baseline, now = () => new Date().toISOString() } = {}) {
  const NS = globalThis.Reckon;
  if (!engine) throw new Error('createSession needs an engine adapter');

  // ---- document state (cells live in the engine; the doc holds meta) ----
  let doc; // {reckon, sheetMeta:[{id,name,cols,rows,freeze,fmt}], names, formats}
  const baselineDoc = clone(baseline) ?? NS.emptyWorkbook(now());
  {
    const res = NS.validateWorkbook(baselineDoc);
    if (!res.ok) {
      const first = res.errors[0];
      throw new Error(`invalid baseline workbook: ${first.path}: ${first.msg} (${res.errors.length} error(s))`);
    }
  }

  const listeners = {};
  const fire = (evt, payload) => (listeners[evt] ?? []).forEach((fn) => { try { fn(payload); } catch { /* listener errors never break the session */ } });

  // Normalise a chart so every top-level field is present (title null, defaults
  // filled). This keeps chartUpdate inverses exact: a patch's prior value is
  // always defined, so JSON-cloning the inverse never drops an "absent" key.
  // normalise a CF rule so every stored/cloned copy is field-exact (mirrors
  // normalizeChart; keeps cfSet snapshot inverses byte-stable across JSON-clone)
  const normalizeRule = (r) => (NS.normalizeRule ? NS.normalizeRule(r) : clone(r));
  // same, for a DV rule (Batch M)
  const normalizeDvRule = (r) => (NS.normalizeDvRule ? NS.normalizeDvRule(r) : clone(r));
  // same, for a pivot (Batch N)
  const normalizePivot = (p) => (NS.normalizePivot ? NS.normalizePivot(p) : clone(p));

  const normalizeChart = (ch) => ({
    id: ch.id, type: ch.type, dataRange: ch.dataRange,
    title: ch.title ?? null,
    orientation: ch.orientation ?? 'cols',
    headerRow: ch.headerRow ?? true,
    headerCol: ch.headerCol ?? true,
    series: clone(ch.series) ?? [],
    pos: { x: ch.pos.x, y: ch.pos.y },
    size: { w: ch.size.w, h: ch.size.h },
    options: clone(ch.options) ?? {},
  });

  const loadBaseline = () => {
    doc = {
      reckon: clone(baselineDoc.reckon),
      sheetMeta: baselineDoc.sheets.map((sh) => ({
        id: sh.id, name: sh.name,
        cols: clone(sh.cols) ?? {}, rows: clone(sh.rows) ?? {},
        freeze: clone(sh.freeze) ?? null,
        merges: clone(sh.merges) ?? [],
        charts: (clone(sh.charts) ?? []).map(normalizeChart),
        cf: (clone(sh.conditionalFormats) ?? []).map(normalizeRule),
        dv: (clone(sh.dataValidations) ?? []).map(normalizeDvRule),
        pivots: (clone(sh.pivots) ?? []).map(normalizePivot),
        fmt: Object.fromEntries(Object.entries(sh.cells).filter(([, c]) => c.fmt != null).map(([k, c]) => [k, c.fmt])),
      })),
      names: clone(baselineDoc.names) ?? {},
      formats: clone(baselineDoc.formats) ?? {},
    };
    engine.load(baselineDoc);
  };
  loadBaseline();

  // ---- history ----
  const log = [];
  let head = 0; // number of applied entries
  let txSeq = 0;

  const metaById = (id) => {
    const m = doc.sheetMeta.find((s) => s.id === id);
    if (!m) throw new Error(`no sheet with id "${id}"`);
    return m;
  };

  // ---- key-shift helpers for doc-side overlays (fmt map, row/col meta) ----
  const shiftFmtRows = (fmt, at0, n, insert) => {
    const out = {};
    for (const [key, v] of Object.entries(fmt)) {
      const { col, row } = NS.parseA1(key);
      if (insert) out[NS.toA1(col, row >= at0 ? row + n : row)] = v;
      else if (row >= at0 && row < at0 + n) continue; // dropped with the rows
      else out[NS.toA1(col, row >= at0 + n ? row - n : row)] = v;
    }
    return out;
  };
  const shiftFmtCols = (fmt, at0, n, insert) => {
    const out = {};
    for (const [key, v] of Object.entries(fmt)) {
      const { col, row } = NS.parseA1(key);
      if (insert) out[NS.toA1(col >= at0 ? col + n : col, row)] = v;
      else if (col >= at0 && col < at0 + n) continue;
      else out[NS.toA1(col >= at0 + n ? col - n : col, row)] = v;
    }
    return out;
  };
  const shiftRowsMeta = (rows, at1, n, insert) => {
    const out = {};
    for (const [r, def] of Object.entries(rows)) {
      const ri = Number(r);
      if (insert) out[ri >= at1 ? ri + n : ri] = def;
      else if (ri >= at1 && ri < at1 + n) continue;
      else out[ri >= at1 + n ? ri - n : ri] = def;
    }
    return out;
  };
  const shiftColsMeta = (cols, at0, n, insert) => {
    const out = {};
    for (const [c, def] of Object.entries(cols)) {
      const ci = NS.colToIdx(c);
      if (insert) out[NS.idxToCol(ci >= at0 ? ci + n : ci)] = def;
      else if (ci >= at0 && ci < at0 + n) continue;
      else out[NS.idxToCol(ci >= at0 + n ? ci - n : ci)] = def;
    }
    return out;
  };
  // merges are display-only ranges; insert expands/shifts, delete shrinks/drops.
  // Deletes that swallow a merge (or collapse it to one cell) drop it; the
  // structural-op inverse restores the full prior merge list via setMerges.
  const shiftMerges = (merges, at0, n, insert, axis /* 'row' | 'col' */) => {
    const out = [];
    for (const rg of merges) {
      const p = NS.parseRangeA1(rg);
      if (!p) continue;
      let s = axis === 'row' ? p.start.row : p.start.col;
      let e = axis === 'row' ? p.end.row : p.end.col;
      if (insert) {
        if (s >= at0) { s += n; e += n; }
        else if (e >= at0) e += n; // insert inside the merge expands it
      } else {
        s = s < at0 ? s : Math.max(at0, s - n);
        e = e < at0 ? e : (e >= at0 + n ? e - n : at0 - 1);
      }
      const sc = axis === 'row' ? p.start.col : s;
      const scR = axis === 'row' ? s : p.start.row;
      const ec = axis === 'row' ? p.end.col : e;
      const ecR = axis === 'row' ? e : p.end.row;
      if (ecR < scR || ec < sc) continue; // fully deleted
      if (scR === ecR && sc === ec) continue; // collapsed to a single cell
      out.push(`${NS.toA1(sc, scR)}:${NS.toA1(ec, ecR)}`);
    }
    return out;
  };
  // ---- A1-range/cell shifters for the four v1.1 feature overlays (Batch O) ----
  // Charts (dataRange), CF rules (range), DV rules (range + list ref), and
  // pivots (sourceRange + position) store their targets as A1 strings that live
  // OUTSIDE the engine grid, so a row/col insert/delete must re-anchor them just
  // like fmt/merges — otherwise the overlay paints the wrong cells (interp 45).
  // Same insert/delete semantics as shiftMerges; a delete that fully swallows a
  // range collapses it to a single line at the cut (kept valid, never dropped;
  // the delete inverse snapshot-restores the exact prior list).
  const shiftA1Range = (range, at0, n, insert, axis /* 'row' | 'col' */) => {
    const p = NS.parseRangeA1(range);
    if (!p) return range;
    let s = axis === 'row' ? p.start.row : p.start.col;
    let e = axis === 'row' ? p.end.row : p.end.col;
    if (insert) {
      if (s >= at0) { s += n; e += n; }
      else if (e >= at0) e += n; // an insert inside the range expands it
    } else {
      s = s < at0 ? s : Math.max(at0, s - n);
      e = e < at0 ? e : (e >= at0 + n ? e - n : at0 - 1);
      if (e < s) e = s; // fully swallowed → collapse to a single line at the cut
    }
    const sc = axis === 'row' ? p.start.col : s;
    const sr = axis === 'row' ? s : p.start.row;
    const ec = axis === 'row' ? p.end.col : e;
    const er = axis === 'row' ? e : p.end.row;
    return `${NS.toA1(sc, sr)}:${NS.toA1(ec, er)}`;
  };
  const shiftA1Cell = (a1, at0, n, insert, axis) => {
    const p = NS.parseA1(a1);
    if (!p) return a1;
    let v = axis === 'row' ? p.row : p.col;
    if (insert) v = v >= at0 ? v + n : v;
    else v = v < at0 ? v : Math.max(at0, v - n); // clamp into the surviving range
    return axis === 'row' ? NS.toA1(p.col, v) : NS.toA1(v, p.row);
  };
  // re-anchor every feature overlay on a structural row/col edit
  const shiftFeatureRanges = (meta, at0, n, insert, axis) => {
    for (const ch of meta.charts) if (ch.dataRange) ch.dataRange = shiftA1Range(ch.dataRange, at0, n, insert, axis);
    for (const r of meta.cf) if (r.range) r.range = shiftA1Range(r.range, at0, n, insert, axis);
    for (const r of meta.dv) {
      if (r.range) r.range = shiftA1Range(r.range, at0, n, insert, axis);
      if (r.ref) r.ref = shiftA1Range(r.ref, at0, n, insert, axis);
    }
    for (const pv of meta.pivots) {
      if (pv.sourceRange) pv.sourceRange = shiftA1Range(pv.sourceRange, at0, n, insert, axis);
      if (pv.position) pv.position = shiftA1Cell(pv.position, at0, n, insert, axis);
    }
  };
  // snapshot-restore ops for the delete inverse (a shrink is not re-derivable by
  // the inverse insert alone, so restore the exact prior feature state)
  const featureRestoreOps = (op, meta) => {
    const ops = [];
    if (meta.cf.length) ops.push({ op: 'cfSet', sheet: op.sheet, rules: clone(meta.cf) });
    if (meta.dv.length) ops.push({ op: 'dvSet', sheet: op.sheet, rules: clone(meta.dv) });
    if (meta.pivots.length) ops.push({ op: 'pivotSet', sheet: op.sheet, pivots: clone(meta.pivots) });
    for (const ch of meta.charts) ops.push({ op: 'chartUpdate', sheet: op.sheet, id: ch.id, patch: { dataRange: ch.dataRange } });
    return ops;
  };
  const moveFmtRange = (fmt, range, to) => {
    const { start, end } = NS.parseRangeA1(range);
    const t = NS.parseA1(to);
    const dr = t.row - start.row; const dc = t.col - start.col;
    const out = {}; const moved = {};
    const inSrc = ({ col, row }) => col >= start.col && col <= end.col && row >= start.row && row <= end.row;
    const inDest = ({ col, row }) => col >= start.col + dc && col <= end.col + dc && row >= start.row + dr && row <= end.row + dr;
    for (const [key, v] of Object.entries(fmt)) {
      const p = NS.parseA1(key);
      if (inSrc(p)) { moved[NS.toA1(p.col + dc, p.row + dr)] = v; continue; }
      if (inDest(p)) continue; // overwritten by the move
      out[key] = v;
    }
    return Object.assign(out, moved);
  };

  // ---- cell snapshot: engine raw + fmt overlay -> restorable cell entry ----
  const cellSnapshot = (meta, key) => {
    const raw = engine.getCellRaw(meta.name, key);
    const fmt = meta.fmt[key];
    if (raw === null && fmt === undefined) return null;
    const cell = {};
    if (raw !== null) {
      if (typeof raw === 'string' && raw.startsWith('=')) cell.f = raw;
      else cell.v = raw;
    }
    if (fmt !== undefined) cell.fmt = fmt;
    return cell;
  };
  const snapshotKeys = (meta, keys) => {
    const out = {};
    for (const key of keys) out[key] = cellSnapshot(meta, key);
    return out;
  };
  const snapshotRegion = (meta, range) => {
    const { start, end } = NS.parseRangeA1(range);
    const keys = [];
    for (let r = start.row; r <= end.row; r++) for (let c = start.col; c <= end.col; c++) keys.push(NS.toA1(c, r));
    return snapshotKeys(meta, keys);
  };
  // Structural undo needs every formula text restored: deletes bake #REF! /
  // shrunk ranges into formula text, and the inverse structural op alone
  // cannot recover them. Restoring all pre-op formula texts is idempotent for
  // the unaffected ones and exact for the damaged ones.
  const formulaRestoreOps = () => {
    const bySheet = new Map();
    for (const { sheet, key, f } of engine.allFormulaCells()) {
      const meta = doc.sheetMeta.find((s) => s.name === sheet);
      if (!meta) continue;
      if (!bySheet.has(meta.id)) bySheet.set(meta.id, {});
      const cell = { f };
      if (meta.fmt[key] !== undefined) cell.fmt = meta.fmt[key];
      bySheet.get(meta.id)[key] = cell;
    }
    return [...bySheet.entries()].map(([id, cells]) => ({ op: 'setCells', sheet: id, cells }));
  };

  const rangeDims = (range) => {
    const { start, end } = NS.parseRangeA1(range);
    return { start, end, rows: end.row - start.row + 1, cols: end.col - start.col + 1 };
  };

  // ---- op validation (part of the single ingress) ----
  const opError = (op) => {
    if (typeof op !== 'object' || op === null) return 'op must be an object';
    if (!OPS.has(op.op)) return `unknown op "${op.op}"`;
    const needSheet = !['nameSet', 'sheetAdd'].includes(op.op);
    if (needSheet) {
      if (typeof op.sheet !== 'string') return 'op needs a sheet id';
      if (!doc.sheetMeta.some((s) => s.id === op.sheet)) return `no sheet with id "${op.sheet}"`;
    }
    switch (op.op) {
      case 'setCells': {
        if (typeof op.cells !== 'object' || op.cells === null || Object.keys(op.cells).length === 0) return 'setCells needs cells';
        for (const [key, cell] of Object.entries(op.cells)) {
          if (!NS.parseA1(key)) return `invalid A1 key "${key}"`;
          const e = NS.cellEntryError(cell);
          if (e) return `${key}: ${e}`;
        }
        return null;
      }
      case 'setFormat': {
        if (typeof op.cells !== 'object' || op.cells === null || Object.keys(op.cells).length === 0) return 'setFormat needs cells';
        for (const [key, fmt] of Object.entries(op.cells)) {
          if (!NS.parseA1(key)) return `invalid A1 key "${key}"`;
          if (fmt !== null && typeof fmt !== 'string') return `${key}: fmt must be a string id or null`;
        }
        return null;
      }
      case 'insertRows': case 'deleteRows':
        return Number.isInteger(op.at) && op.at >= 1 && Number.isInteger(op.n) && op.n >= 1 ? null : 'needs at>=1, n>=1';
      case 'insertCols': case 'deleteCols':
        return Number.isInteger(op.at) && op.at >= 1 && Number.isInteger(op.n) && op.n >= 1 ? null : 'needs at>=1, n>=1';
      case 'moveRange':
        if (!NS.parseRangeA1(op.from ?? '')) return 'invalid from range';
        if (!NS.parseA1(op.to ?? '')) return 'invalid to cell';
        return null;
      case 'sizeRows': {
        if (typeof op.rows !== 'object' || op.rows === null || Object.keys(op.rows).length === 0) return 'sizeRows needs rows';
        for (const [r, h] of Object.entries(op.rows)) {
          const ri = Number(r);
          if (!Number.isInteger(ri) || ri < 1) return `invalid row number "${r}"`;
          if (h !== null && (typeof h !== 'number' || !Number.isFinite(h) || h < 2 || h > 1000)) return `${r}: height must be 2..1000 or null`;
        }
        return null;
      }
      case 'sizeCols': {
        if (typeof op.cols !== 'object' || op.cols === null || Object.keys(op.cols).length === 0) return 'sizeCols needs cols';
        for (const [c, w] of Object.entries(op.cols)) {
          if (!/^[A-Z]{1,3}$/.test(c)) return `invalid col letter "${c}"`;
          if (w !== null && (typeof w !== 'number' || !Number.isFinite(w) || w < 5 || w > 2000)) return `${c}: width must be 5..2000 or null`;
        }
        return null;
      }
      case 'setMerges': {
        if (!Array.isArray(op.merges)) return 'setMerges needs a merges array';
        for (const rg of op.merges) {
          const parsed = typeof rg === 'string' ? NS.parseRangeA1(rg) : null;
          if (!parsed) return `invalid merge range "${rg}"`;
          if (parsed.start.col === parsed.end.col && parsed.start.row === parsed.end.row) return `merge "${rg}" must span more than one cell`;
        }
        return null;
      }
      case 'setFreeze': {
        if (op.freeze === null) return null;
        const fz = op.freeze;
        if (typeof fz !== 'object' || fz === null || !Number.isInteger(fz.r) || !Number.isInteger(fz.c) || fz.r < 0 || fz.c < 0) return 'freeze must be null or {r>=0, c>=0}';
        return null;
      }
      case 'chartAdd': {
        const e = NS.chartError(op.chart);
        if (e) return `chart: ${e}`;
        const meta = metaById(op.sheet);
        if (meta.charts.some((c) => c.id === op.chart.id)) return `duplicate chart id "${op.chart.id}"`;
        if ('index' in op && (!Number.isInteger(op.index) || op.index < 0)) return 'index must be int >= 0';
        return null;
      }
      case 'chartUpdate': {
        if (typeof op.id !== 'string') return 'chartUpdate needs a chart id';
        const meta = metaById(op.sheet);
        const cur = meta.charts.find((c) => c.id === op.id);
        if (!cur) return `no chart with id "${op.id}"`;
        if (typeof op.patch !== 'object' || op.patch === null || Array.isArray(op.patch)) return 'chartUpdate needs a patch object';
        for (const k of Object.keys(op.patch)) if (!CHART_PATCH_KEYS.includes(k)) return `chartUpdate cannot set "${k}"`;
        const merged = { ...cur, ...op.patch };
        const e = NS.chartError(merged);
        if (e) return `chart after patch: ${e}`;
        return null;
      }
      case 'chartDelete': {
        if (typeof op.id !== 'string') return 'chartDelete needs a chart id';
        const meta = metaById(op.sheet);
        if (!meta.charts.some((c) => c.id === op.id)) return `no chart with id "${op.id}"`;
        return null;
      }
      case 'cfSet': {
        if (!Array.isArray(op.rules)) return 'cfSet needs a rules array';
        const ids = new Set();
        for (const r of op.rules) {
          const e = NS.cfError(r);
          if (e) return `cf rule: ${e}`;
          if (ids.has(r.id)) return `duplicate rule id "${r.id}"`;
          ids.add(r.id);
        }
        return null;
      }
      case 'dvSet': {
        if (!Array.isArray(op.rules)) return 'dvSet needs a rules array';
        const ids = new Set();
        for (const r of op.rules) {
          const e = NS.dvError(r);
          if (e) return `dv rule: ${e}`;
          if (ids.has(r.id)) return `duplicate rule id "${r.id}"`;
          ids.add(r.id);
        }
        return null;
      }
      case 'pivotSet': {
        if (!Array.isArray(op.pivots)) return 'pivotSet needs a pivots array';
        const ids = new Set();
        for (const pv of op.pivots) {
          const e = NS.pivotError(pv);
          if (e) return `pivot: ${e}`;
          if (ids.has(pv.id)) return `duplicate pivot id "${pv.id}"`;
          ids.add(pv.id);
        }
        return null;
      }
      case 'sheetAdd': {
        if (typeof op.id !== 'string' || op.id.length === 0) return 'sheetAdd needs id';
        if (typeof op.name !== 'string' || op.name.length === 0) return 'sheetAdd needs name';
        if (doc.sheetMeta.some((s) => s.id === op.id)) return `duplicate sheet id "${op.id}"`;
        if (doc.sheetMeta.some((s) => s.name === op.name)) return `duplicate sheet name "${op.name}"`;
        if ('index' in op && (!Number.isInteger(op.index) || op.index < 0)) return 'index must be int >= 0';
        if ('charts' in op) {
          if (!Array.isArray(op.charts)) return 'sheetAdd charts must be an array';
          for (const ch of op.charts) { const e = NS.chartError(ch); if (e) return `chart: ${e}`; }
        }
        if ('cf' in op) {
          if (!Array.isArray(op.cf)) return 'sheetAdd cf must be an array';
          for (const r of op.cf) { const e = NS.cfError(r); if (e) return `cf rule: ${e}`; }
        }
        if ('dv' in op) {
          if (!Array.isArray(op.dv)) return 'sheetAdd dv must be an array';
          for (const r of op.dv) { const e = NS.dvError(r); if (e) return `dv rule: ${e}`; }
        }
        if ('pivots' in op) {
          if (!Array.isArray(op.pivots)) return 'sheetAdd pivots must be an array';
          for (const pv of op.pivots) { const e = NS.pivotError(pv); if (e) return `pivot: ${e}`; }
        }
        return null;
      }
      case 'sheetRename':
        if (typeof op.name !== 'string' || op.name.length === 0) return 'sheetRename needs name';
        if (doc.sheetMeta.some((s) => s.name === op.name && s.id !== op.sheet)) return `duplicate sheet name "${op.name}"`;
        return null;
      case 'sheetDelete':
        return doc.sheetMeta.length > 1 ? null : 'cannot delete the last sheet';
      case 'nameSet':
        if (typeof op.name !== 'string' || !/^[A-Za-z_][A-Za-z0-9_.]{0,254}$/.test(op.name)) return 'invalid name';
        if (op.ref !== null && (typeof op.ref !== 'string' || op.ref.length === 0)) return 'ref must be a string or null';
        return null;
      default: return `unknown op "${op.op}"`;
    }
  };

  // ---- inverse computation (against current state, before the op applies) ----
  const computeInverse = (op) => {
    switch (op.op) {
      case 'setCells': {
        const meta = metaById(op.sheet);
        return [{ op: 'setCells', sheet: op.sheet, cells: snapshotKeys(meta, Object.keys(op.cells)) }];
      }
      case 'setFormat': {
        const meta = metaById(op.sheet);
        const prior = {};
        for (const key of Object.keys(op.cells)) prior[key] = meta.fmt[key] ?? null;
        return [{ op: 'setFormat', sheet: op.sheet, cells: prior }];
      }
      case 'insertRows':
        return [{ op: 'deleteRows', sheet: op.sheet, at: op.at, n: op.n }];
      case 'insertCols':
        return [{ op: 'deleteCols', sheet: op.sheet, at: op.at, n: op.n }];
      case 'deleteRows': {
        const meta = metaById(op.sheet);
        const dims = engine.sheetDims(meta.name); // bound the snapshot to used cells
        const lastCol = Math.max(dims.cols, 1) - 1;
        const region = dims.rows >= op.at
          ? snapshotRegion(meta, `A${op.at}:${NS.idxToCol(lastCol)}${Math.min(op.at + op.n - 1, dims.rows)}`)
          : {};
        const cells = Object.fromEntries(Object.entries(region).filter(([, c]) => c !== null));
        const inv = [{ op: 'insertRows', sheet: op.sheet, at: op.at, n: op.n }];
        if (Object.keys(cells).length) inv.push({ op: 'setCells', sheet: op.sheet, cells });
        // size-meta restore (STATE.md interpretation 5): deleted rows' heights
        // are dropped by the shift; restore them after the inverse insert.
        const sizes = {};
        for (const [r, def] of Object.entries(meta.rows)) {
          const ri = Number(r);
          if (ri >= op.at && ri < op.at + op.n && def && typeof def.h === 'number') sizes[ri] = def.h;
        }
        if (Object.keys(sizes).length) inv.push({ op: 'sizeRows', sheet: op.sheet, rows: sizes });
        // merges swallowed by the delete cannot be re-derived; restore the full prior list
        if (meta.merges.length) inv.push({ op: 'setMerges', sheet: op.sheet, merges: clone(meta.merges) });
        // feature overlays (charts/CF/DV/pivots) shrink like merges — restore exact prior ranges (interp 45)
        inv.push(...featureRestoreOps(op, meta));
        return inv.concat(formulaRestoreOps());
      }
      case 'deleteCols': {
        const meta = metaById(op.sheet);
        const dims = engine.sheetDims(meta.name);
        const lastRow = Math.max(dims.rows, 1);
        const from = NS.idxToCol(op.at - 1);
        const region = dims.cols >= op.at
          ? snapshotRegion(meta, `${from}1:${NS.idxToCol(Math.min(op.at + op.n - 1, dims.cols) - 1)}${lastRow}`)
          : {};
        const cells = Object.fromEntries(Object.entries(region).filter(([, c]) => c !== null));
        const inv = [{ op: 'insertCols', sheet: op.sheet, at: op.at, n: op.n }];
        if (Object.keys(cells).length) inv.push({ op: 'setCells', sheet: op.sheet, cells });
        const sizes = {};
        for (const [c, def] of Object.entries(meta.cols)) {
          const ci = NS.colToIdx(c);
          if (ci >= op.at - 1 && ci < op.at - 1 + op.n && def && typeof def.w === 'number') sizes[c] = def.w;
        }
        if (Object.keys(sizes).length) inv.push({ op: 'sizeCols', sheet: op.sheet, cols: sizes });
        if (meta.merges.length) inv.push({ op: 'setMerges', sheet: op.sheet, merges: clone(meta.merges) });
        inv.push(...featureRestoreOps(op, meta));
        return inv.concat(formulaRestoreOps());
      }
      case 'sizeRows': {
        const meta = metaById(op.sheet);
        const prior = {};
        for (const r of Object.keys(op.rows)) prior[r] = meta.rows[r]?.h ?? null;
        return [{ op: 'sizeRows', sheet: op.sheet, rows: prior }];
      }
      case 'sizeCols': {
        const meta = metaById(op.sheet);
        const prior = {};
        for (const c of Object.keys(op.cols)) prior[c] = meta.cols[c]?.w ?? null;
        return [{ op: 'sizeCols', sheet: op.sheet, cols: prior }];
      }
      case 'setMerges': {
        const meta = metaById(op.sheet);
        return [{ op: 'setMerges', sheet: op.sheet, merges: clone(meta.merges) }];
      }
      case 'setFreeze': {
        const meta = metaById(op.sheet);
        return [{ op: 'setFreeze', sheet: op.sheet, freeze: clone(meta.freeze) }];
      }
      case 'chartAdd': {
        return [{ op: 'chartDelete', sheet: op.sheet, id: op.chart.id }];
      }
      case 'chartUpdate': {
        const meta = metaById(op.sheet);
        const cur = meta.charts.find((c) => c.id === op.id);
        const prior = {};
        for (const k of Object.keys(op.patch)) prior[k] = clone(cur[k]);
        return [{ op: 'chartUpdate', sheet: op.sheet, id: op.id, patch: prior }];
      }
      case 'chartDelete': {
        const meta = metaById(op.sheet);
        const index = meta.charts.findIndex((c) => c.id === op.id);
        const chart = clone(meta.charts[index]);
        return [{ op: 'chartAdd', sheet: op.sheet, chart, index }];
      }
      case 'cfSet': {
        const meta = metaById(op.sheet);
        return [{ op: 'cfSet', sheet: op.sheet, rules: clone(meta.cf) }];
      }
      case 'dvSet': {
        const meta = metaById(op.sheet);
        return [{ op: 'dvSet', sheet: op.sheet, rules: clone(meta.dv) }];
      }
      case 'pivotSet': {
        const meta = metaById(op.sheet);
        return [{ op: 'pivotSet', sheet: op.sheet, pivots: clone(meta.pivots) }];
      }
      case 'moveRange': {
        const meta = metaById(op.sheet);
        const { start, rows, cols } = rangeDims(op.from);
        const to = NS.parseA1(op.to);
        const destRange = `${NS.toA1(to.col, to.row)}:${NS.toA1(to.col + cols - 1, to.row + rows - 1)}`;
        const destPrior = snapshotRegion(meta, destRange);
        const inv = [{ op: 'moveRange', sheet: op.sheet, from: destRange, to: NS.toA1(start.col, start.row) }];
        if (Object.keys(destPrior).length) inv.push({ op: 'setCells', sheet: op.sheet, cells: destPrior });
        return inv.concat(formulaRestoreOps());
      }
      case 'sheetAdd':
        return [{ op: 'sheetDelete', sheet: op.id }];
      case 'sheetDelete': {
        const meta = metaById(op.sheet);
        const index = doc.sheetMeta.findIndex((s) => s.id === op.sheet);
        const cells = {};
        const serialized = engine.serializeSheet(meta.name);
        const keys = new Set([...Object.keys(serialized), ...Object.keys(meta.fmt)]);
        for (const key of keys) {
          const cell = { ...(serialized[key] ?? {}) };
          if (meta.fmt[key] !== undefined) cell.fmt = meta.fmt[key];
          cells[key] = cell;
        }
        const inv = [{
          op: 'sheetAdd', id: meta.id, name: meta.name, index,
          cols: clone(meta.cols), rows: clone(meta.rows), freeze: clone(meta.freeze), merges: clone(meta.merges), charts: clone(meta.charts), cf: clone(meta.cf), dv: clone(meta.dv), pivots: clone(meta.pivots),
        }];
        if (Object.keys(cells).length) inv.push({ op: 'setCells', sheet: meta.id, cells });
        return inv.concat(formulaRestoreOps().filter((o) => o.sheet !== meta.id));
      }
      case 'sheetRename': {
        const meta = metaById(op.sheet);
        return [{ op: 'sheetRename', sheet: op.sheet, name: meta.name }];
      }
      case 'nameSet':
        return [{ op: 'nameSet', name: op.name, ref: doc.names[op.name] ?? null }];
      default: throw new Error(`no inverse for op "${op.op}"`);
    }
  };

  // ---- executor (shared by forward apply, undo, redo, replay) ----
  const applyOp = (op) => {
    switch (op.op) {
      case 'setCells': {
        const meta = metaById(op.sheet);
        const entries = [];
        for (const [key, cell] of Object.entries(op.cells)) {
          if (cell === null) {
            entries.push({ key, raw: null });
            delete meta.fmt[key];
          } else {
            if ('f' in cell) entries.push({ key, raw: cell.f });
            else if ('v' in cell) entries.push({ key, raw: cell.v });
            else entries.push({ key, raw: engine.getCellRaw(meta.name, key) }); // fmt-only update keeps content
            if ('fmt' in cell) {
              if (cell.fmt === null) delete meta.fmt[key];
              else meta.fmt[key] = cell.fmt;
            }
          }
        }
        engine.setCells(meta.name, entries);
        break;
      }
      case 'setFormat': {
        const meta = metaById(op.sheet);
        for (const [key, fmt] of Object.entries(op.cells)) {
          if (fmt === null) delete meta.fmt[key];
          else meta.fmt[key] = fmt;
        }
        break;
      }
      case 'insertRows': {
        const meta = metaById(op.sheet);
        engine.insertRows(meta.name, op.at, op.n);
        meta.fmt = shiftFmtRows(meta.fmt, op.at - 1, op.n, true);
        meta.rows = shiftRowsMeta(meta.rows, op.at, op.n, true);
        meta.merges = shiftMerges(meta.merges, op.at - 1, op.n, true, 'row');
        shiftFeatureRanges(meta, op.at - 1, op.n, true, 'row');
        break;
      }
      case 'deleteRows': {
        const meta = metaById(op.sheet);
        engine.deleteRows(meta.name, op.at, op.n);
        meta.fmt = shiftFmtRows(meta.fmt, op.at - 1, op.n, false);
        meta.rows = shiftRowsMeta(meta.rows, op.at, op.n, false);
        meta.merges = shiftMerges(meta.merges, op.at - 1, op.n, false, 'row');
        shiftFeatureRanges(meta, op.at - 1, op.n, false, 'row');
        break;
      }
      case 'insertCols': {
        const meta = metaById(op.sheet);
        engine.insertCols(meta.name, op.at, op.n);
        meta.fmt = shiftFmtCols(meta.fmt, op.at - 1, op.n, true);
        meta.cols = shiftColsMeta(meta.cols, op.at - 1, op.n, true);
        meta.merges = shiftMerges(meta.merges, op.at - 1, op.n, true, 'col');
        shiftFeatureRanges(meta, op.at - 1, op.n, true, 'col');
        break;
      }
      case 'deleteCols': {
        const meta = metaById(op.sheet);
        engine.deleteCols(meta.name, op.at, op.n);
        meta.fmt = shiftFmtCols(meta.fmt, op.at - 1, op.n, false);
        meta.cols = shiftColsMeta(meta.cols, op.at - 1, op.n, false);
        meta.merges = shiftMerges(meta.merges, op.at - 1, op.n, false, 'col');
        shiftFeatureRanges(meta, op.at - 1, op.n, false, 'col');
        break;
      }
      case 'sizeRows': {
        const meta = metaById(op.sheet);
        for (const [r, h] of Object.entries(op.rows)) {
          if (h === null) delete meta.rows[r];
          else meta.rows[r] = { h };
        }
        break;
      }
      case 'sizeCols': {
        const meta = metaById(op.sheet);
        for (const [c, w] of Object.entries(op.cols)) {
          if (w === null) delete meta.cols[c];
          else meta.cols[c] = { w };
        }
        break;
      }
      case 'setMerges': {
        const meta = metaById(op.sheet);
        meta.merges = clone(op.merges);
        break;
      }
      case 'setFreeze': {
        const meta = metaById(op.sheet);
        meta.freeze = op.freeze === null ? null : { r: op.freeze.r, c: op.freeze.c };
        break;
      }
      case 'chartAdd': {
        const meta = metaById(op.sheet);
        const chart = normalizeChart(op.chart);
        const index = Number.isInteger(op.index) ? Math.min(op.index, meta.charts.length) : meta.charts.length;
        meta.charts.splice(index, 0, chart);
        break;
      }
      case 'chartUpdate': {
        const meta = metaById(op.sheet);
        const chart = meta.charts.find((c) => c.id === op.id);
        if (!chart) throw new Error(`no chart with id "${op.id}"`);
        Object.assign(chart, clone(op.patch));
        break;
      }
      case 'chartDelete': {
        const meta = metaById(op.sheet);
        meta.charts = meta.charts.filter((c) => c.id !== op.id);
        break;
      }
      case 'cfSet': {
        const meta = metaById(op.sheet);
        meta.cf = clone(op.rules).map(normalizeRule);
        break;
      }
      case 'dvSet': {
        const meta = metaById(op.sheet);
        meta.dv = clone(op.rules).map(normalizeDvRule);
        break;
      }
      case 'pivotSet': {
        const meta = metaById(op.sheet);
        meta.pivots = clone(op.pivots).map(normalizePivot);
        break;
      }
      case 'moveRange': {
        const meta = metaById(op.sheet);
        engine.moveRange(meta.name, op.from, op.to);
        meta.fmt = moveFmtRange(meta.fmt, op.from, op.to);
        break;
      }
      case 'sheetAdd': {
        engine.addSheet(op.name);
        const meta = {
          id: op.id, name: op.name,
          cols: clone(op.cols) ?? {}, rows: clone(op.rows) ?? {}, freeze: clone(op.freeze) ?? null,
          merges: clone(op.merges) ?? [], charts: (clone(op.charts) ?? []).map(normalizeChart),
          cf: (clone(op.cf) ?? []).map(normalizeRule),
          dv: (clone(op.dv) ?? []).map(normalizeDvRule),
          pivots: (clone(op.pivots) ?? []).map(normalizePivot), fmt: {},
        };
        const index = Number.isInteger(op.index) ? Math.min(op.index, doc.sheetMeta.length) : doc.sheetMeta.length;
        doc.sheetMeta.splice(index, 0, meta);
        break;
      }
      case 'sheetRename': {
        const meta = metaById(op.sheet);
        engine.renameSheet(meta.name, op.name);
        meta.name = op.name;
        break;
      }
      case 'sheetDelete': {
        const meta = metaById(op.sheet);
        engine.removeSheet(meta.name);
        doc.sheetMeta = doc.sheetMeta.filter((s) => s.id !== op.sheet);
        break;
      }
      case 'nameSet': {
        engine.nameSet(op.name, op.ref);
        if (op.ref === null) delete doc.names[op.name];
        else doc.names[op.name] = op.ref;
        break;
      }
      default: throw new Error(`unknown op "${op.op}"`);
    }
  };

  // referenced-format catalog: id -> normalised def, for every id any cell uses
  const referencedFormats = () => {
    const out = {};
    for (const meta of doc.sheetMeta) {
      for (const id of Object.values(meta.fmt)) {
        if (typeof id !== 'string' || id in out) continue;
        const def = NS.resolveFormat ? NS.resolveFormat(id, doc.formats) : (doc.formats[id] ?? null);
        if (def) out[id] = def;
      }
    }
    return out;
  };
  // resolve a cell's format def (loaded catalog first, then the id codec)
  const fmtDefFor = (sheetName, a1) => {
    const meta = doc.sheetMeta.find((s) => s.name === sheetName);
    if (!meta) return null;
    const id = meta.fmt[a1];
    if (typeof id !== 'string') return null;
    return NS.resolveFormat ? NS.resolveFormat(id, doc.formats) : (doc.formats[id] ?? null);
  };

  // ---- public surface ----
  const session = {
    applyTransaction({ actor, origin, ops } = {}) {
      if (typeof actor !== 'string' || !ACTORS.has(actor)) throw new Error(`invalid actor "${actor}" (owner|api|system|sidecar)`);
      if (typeof origin !== 'string' || origin.length === 0) throw new Error('transaction needs an origin string');
      if (!Array.isArray(ops) || ops.length === 0) throw new Error('transaction needs a non-empty ops array');
      // validate all ops up-front against the pre-tx state where possible;
      // ops that depend on earlier ops in the same tx re-validate at apply time
      const inverse = [];
      const applied = [];
      try {
        for (const op of ops) {
          const e = opError(op);
          if (e) throw new Error(`invalid op: ${e}`);
          const inv = computeInverse(op);
          applyOp(op);
          applied.push(op);
          inverse.unshift(...inv); // prepend group (keeps group-internal order); undo runs latest-first
        }
      } catch (err) {
        // roll back the partial transaction with the inverses gathered so far
        for (const inv of inverse) applyOp(inv);
        throw err;
      }
      txSeq += 1;
      const entry = {
        id: txSeq, ts: now(), actor, origin,
        ops: clone(ops), inverse: clone(inverse),
      };
      log.length = head; // drop redo tail
      log.push(entry);
      head = log.length;
      fire('transaction', { type: 'apply', entry });
      return { txId: entry.id };
    },

    undo() {
      if (head === 0) return false;
      const entry = log[head - 1];
      for (const op of entry.inverse) applyOp(op);
      head -= 1;
      fire('transaction', { type: 'undo', entry });
      return true;
    },
    redo() {
      if (head === log.length) return false;
      const entry = log[head];
      for (const op of entry.ops) applyOp(op);
      head += 1;
      fire('transaction', { type: 'redo', entry });
      return true;
    },

    canUndo: () => head > 0,
    canRedo: () => head < log.length,
    getLog: () => clone(log),
    entryAt: (i) => (i >= 0 && i < log.length ? clone(log[i]) : null),
    getHead: () => head,
    getBaseline: () => clone(baselineDoc),

    serialize() {
      const sheets = doc.sheetMeta.map((meta) => {
        const cells = engine.serializeSheet(meta.name);
        for (const [key, fmt] of Object.entries(meta.fmt)) {
          cells[key] = { ...(cells[key] ?? {}), fmt };
        }
        const sh = { id: meta.id, name: meta.name, cells };
        if (Object.keys(meta.cols).length) sh.cols = clone(meta.cols);
        if (Object.keys(meta.rows).length) sh.rows = clone(meta.rows);
        if (meta.freeze) sh.freeze = clone(meta.freeze);
        if (meta.merges.length) sh.merges = clone(meta.merges);
        if (meta.charts.length) sh.charts = clone(meta.charts);
        if (meta.cf.length) sh.conditionalFormats = clone(meta.cf);
        if (meta.dv.length) sh.dataValidations = clone(meta.dv);
        if (meta.pivots.length) sh.pivots = clone(meta.pivots);
        return sh;
      });
      return {
        reckon: { ...clone(doc.reckon), modified: now() },
        sheets,
        names: clone(doc.names),
        // the formats catalog is DERIVED from the ids the cells reference
        // (core/formats.mjs doctrine): only referenced ids are emitted (orphans
        // left by undo are pruned, keeping log-replay snapshots exact), and each
        // resolves via the loaded catalog first (hand-authored §4 names) then
        // the self-describing id codec.
        formats: referencedFormats(),
        history: { head },
      };
    },

    // canonical snapshot for structural comparison (modified timestamp and
    // history pointer excluded; every object's keys sorted recursively)
    snapshotJson() {
      const wb = session.serialize();
      delete wb.reckon.modified;
      delete wb.history;
      const canon = (x) => {
        if (Array.isArray(x)) return x.map(canon);
        if (x && typeof x === 'object') {
          return Object.fromEntries(Object.keys(x).sort().map((k) => [k, canon(x[k])]));
        }
        return x;
      };
      return JSON.stringify(canon(wb));
    },

    getValue: (sheetName, a1) => engine.getValue(sheetName, a1),
    getFormula: (sheetName, a1) => engine.getFormula(sheetName, a1),
    sheetNames: () => doc.sheetMeta.map((s) => ({ id: s.id, name: s.name })),
    getNames: () => clone(doc.names),
    // Batch D: format resolution for the display feed + the cell's fmt id
    fmtDefFor,
    fmtIdFor: (sheetName, a1) => {
      const meta = doc.sheetMeta.find((s) => s.name === sheetName);
      return meta ? (meta.fmt[a1] ?? null) : null;
    },
    fmtKeys: (sheetName) => {
      const meta = doc.sheetMeta.find((s) => s.name === sheetName);
      return meta ? Object.keys(meta.fmt) : [];
    },
    getFormats: () => referencedFormats(),
    getLocale: () => doc.reckon.locale || 'en-IN',
    // per-sheet display meta for the grid surface (sizes, freeze, merges)
    getSheetMeta: (id) => {
      const m = doc.sheetMeta.find((s) => s.id === id);
      if (!m) return null;
      return { id: m.id, name: m.name, cols: clone(m.cols), rows: clone(m.rows), freeze: clone(m.freeze), merges: clone(m.merges), charts: clone(m.charts), conditionalFormats: clone(m.cf), dataValidations: clone(m.dv), pivots: clone(m.pivots) };
    },
    getCharts: (id) => {
      const m = doc.sheetMeta.find((s) => s.id === id);
      return m ? clone(m.charts) : [];
    },
    getConditionalFormats: (id) => {
      const m = doc.sheetMeta.find((s) => s.id === id);
      return m ? clone(m.cf) : [];
    },
    // rules by sheet NAME (the worker's display feed keys off sheet name)
    cfForSheet: (sheetName) => {
      const m = doc.sheetMeta.find((s) => s.name === sheetName);
      return m ? clone(m.cf) : [];
    },
    getDataValidations: (id) => {
      const m = doc.sheetMeta.find((s) => s.id === id);
      return m ? clone(m.dv) : [];
    },
    // DV rules by sheet NAME (the worker's ingress gate + marker feed key off name)
    dvForSheet: (sheetName) => {
      const m = doc.sheetMeta.find((s) => s.name === sheetName);
      return m ? clone(m.dv) : [];
    },
    getPivots: (id) => {
      const m = doc.sheetMeta.find((s) => s.id === id);
      return m ? clone(m.pivots) : [];
    },
    // pivots by sheet NAME (the worker's pivot compute keys off sheet name)
    pivotsForSheet: (sheetName) => {
      const m = doc.sheetMeta.find((s) => s.name === sheetName);
      return m ? clone(m.pivots) : [];
    },

    on(evt, fn) { (listeners[evt] ??= []).push(fn); },
    destroy() { engine.destroy(); },
  };
  return session;
}

// Structural check (§5): replay the log from the baseline on a FRESH engine
// and compare canonical snapshots. Returns {ok, expected, got}.
export function replayCheck(session, makeEngine) {
  const NS = globalThis.Reckon;
  const replayed = NS.createSession({
    engine: makeEngine(),
    baseline: session.getBaseline(),
  });
  try {
    const entries = session.getLog().slice(0, session.getHead());
    for (const entry of entries) {
      replayed.applyTransaction({ actor: entry.actor, origin: entry.origin, ops: entry.ops });
    }
    const expected = session.snapshotJson();
    const got = replayed.snapshotJson();
    return { ok: expected === got, expected, got };
  } finally {
    replayed.destroy();
  }
}

// single-file composition: register on the shared namespace
const NS3 = (globalThis.Reckon ||= {});
Object.assign(NS3, { createSession, replayCheck });
</script>
<script type="text/reckon-src" id="rk-src::engine/worker.mjs">
// Reckon — engine worker entry (handoff §10): formula evaluation runs in a
// Web Worker; the MAIN THREAD NEVER EVALUATES USER TEXT. The single-file
// build concatenates core/schema.mjs + engine/adapter.mjs +
// core/transaction.mjs + this file into one module-worker blob; everything
// talks through globalThis.Reckon.
//
// Protocol:
//   main -> worker : { id, method, args }
//   worker -> main : { id, ok, result } | { id, ok: false, error }
//   worker -> main : { event: 'transaction'|'recalc', payload }   (unsolicited)

const RK = globalThis.Reckon;
let HFns = null;
let engine = null;
let session = null;

const makeEngine = () => RK.createEngine(HFns);

const wireSession = (s) => {
  s.on('transaction', (payload) => {
    postMessage({ event: 'transaction', payload: { type: payload.type, txId: payload.entry?.id ?? null } });
  });
};

// ---------- display feed (grid surface) ----------
// The grid renders display text only; formulas and raw values stay in here.
// Plain (unformatted) display — also the shape the find index compares against.
const displayOf = (v) => {
  if (v === null || v === undefined) return { text: '', ty: '' };
  if (typeof v === 'object' && v.err) return { text: v.err, ty: 'e' };
  if (typeof v === 'boolean') return { text: v ? 'TRUE' : 'FALSE', ty: 'b' };
  if (typeof v === 'number') return { text: String(v), ty: 'n' };
  return { text: String(v), ty: 's' };
};

// Format-aware display for one cell (Batch D): resolves the cell's fmt def and
// applies it. `num` carries the raw numeric so selection stats never re-parse a
// formatted string; `sd` carries the render style descriptor (bold/italic/
// align/bg/border) so a cell can be styled even when its value is empty.
// Batch L: an optional `cf` overlay ({bg,fg,bold,bar}) from a render-time
// conditional-formatting rule is layered ONTO sd (never stored per cell); the
// grid's xsStyleFor applies it over the base format (CF-over-format precedence).
// Batch M: an optional `dv:true` flag marks the cell as holding a value that
// violates a data-validation rule (render-time, never stored per cell — the
// value + format are untouched; the grid draws an invalid marker). Layered onto
// sd like the CF overlay.
const displayCell = (sheetName, a1, v, cf = null, dv = false) => {
  const def = session.fmtDefFor(sheetName, a1);
  const d = def ? RK.formatValue(v, def, { locale: session.getLocale() }) : displayOf(v);
  const out = { text: d.text, ty: d.ty };
  if (def && typeof v === 'number' && Number.isFinite(v)) out.num = v;
  let sd = def ? RK.styleDescriptor(def) : null;
  if (cf) { sd = sd ? { ...sd, cf } : { cf }; }
  if (dv) { sd = sd ? { ...sd, dv: true } : { dv: true }; }
  if (sd) out.sd = sd;
  return out;
};

// dense computed values for a range (errors -> their code string), as the CF
// evaluator + regionValues both consume
const regionVals = (sheetName, range) => {
  const p = RK.parseRangeA1(range);
  if (!p) return null;
  const values = [];
  for (let r = p.start.row; r <= p.end.row; r += 1) {
    const row = [];
    for (let c = p.start.col; c <= p.end.col; c += 1) {
      const v = engine.getValue(sheetName, `${RK.idxToCol(c)}${r + 1}`);
      row.push(v && typeof v === 'object' && v.err ? v.err : v);
    }
    values.push(row);
  }
  return { start: p.start, values };
};

const sheetHasCf = (sheetName) => !!(session.cfForSheet && session.cfForSheet(sheetName).length);
const sheetHasDv = (sheetName) => !!(session.dvForSheet && session.dvForSheet(sheetName).length);

// evaluate every CF rule on a sheet once -> Map(a1 -> {bg,fg,bold,bar}).
// Formula rules are evaluated per cell against the live engine (the main thread
// never evaluates user text, §10): the formula is authored relative to the
// range top-left and shifted by the cell's (dr,dc) offset before evalFormula.
const cfStyleMap = (sheetName) => {
  const rules = session.cfForSheet ? session.cfForSheet(sheetName) : [];
  if (!rules.length || !RK.evaluateRules) return null;
  const formulaEval = (formula, dr, dc) => engine.evalFormula(sheetName, RK.shiftFormula ? RK.shiftFormula(formula, dr, dc) : formula);
  return RK.evaluateRules(rules, (rg) => regionVals(sheetName, rg), { formulaEval });
};

// evaluate every DV rule on a sheet once -> Map(a1 -> ruleId) for the cells that
// currently VIOLATE (non-blank only). Custom rules eval per cell against the live
// engine (main thread never evaluates user text, §10); a list rule referencing a
// range resolves that range's live values. This is a render-time marker feed only
// — it never gates a write (that is the ingress gate below).
const dvMarkerMap = (sheetName) => {
  const rules = session.dvForSheet ? session.dvForSheet(sheetName) : [];
  if (!rules.length || !RK.evaluateValidity) return null;
  const formulaEval = (formula, dr, dc) => engine.evalFormula(sheetName, RK.shiftFormula ? RK.shiftFormula(formula, dr, dc) : formula);
  const listValuesFor = (ref) => { const rg = regionVals(sheetName, ref); return rg ? rg.values : null; };
  return RK.evaluateValidity(rules, (rg) => regionVals(sheetName, rg), { formulaEval, listValuesFor });
};

const buildSheetDisplay = (sheetName) => {
  const values = engine.sheetValues(sheetName);
  const cfMap = cfStyleMap(sheetName);
  const dvMap = dvMarkerMap(sheetName);
  const rows = {};
  let cellCount = 0;
  values.forEach((rowArr, r) => {
    let cells = null;
    rowArr.forEach((v, c) => {
      if (v === null || v === undefined) return;
      const a1 = `${RK.idxToCol(c)}${r + 1}`;
      const d = displayCell(sheetName, a1, v, cfMap ? cfMap.get(a1) : null, dvMap ? dvMap.has(a1) : false);
      if (d.text === '' && d.ty !== 's' && !d.sd) return;
      (cells ??= {})[c] = d;
      cellCount += 1;
    });
    if (cells) rows[r] = cells;
  });
  // empty-but-styled cells (a format/colour set on a blank cell) still render
  for (const a1 of session.fmtKeys(sheetName)) {
    const p = RK.parseA1(a1);
    if (!p) continue;
    if (rows[p.row] && rows[p.row][p.col]) continue; // already emitted with a value
    const d = displayCell(sheetName, a1, engine.getValue(sheetName, a1), cfMap ? cfMap.get(a1) : null, dvMap ? dvMap.has(a1) : false);
    if (d.text === '' && d.ty !== 's' && !d.sd) continue;
    (rows[p.row] ??= {})[p.col] = d;
    cellCount += 1;
  }
  const dims = engine.sheetDims(sheetName);
  return { rows, dims, cellCount };
};

// changed-cell drain resolved to display text; full:true means re-pull sheets.
// `extra` (a1 keys touched by setFormat/fmt-only setCells) are merged in because
// a pure format change moves no engine value and so never enters drainChanges.
const drainDisplay = (extra = [], ops = []) => {
  const ch = engine.drainChanges();
  if (ch.full) return { full: true };
  // Batch L: CF is non-local (one edit can flip a colour scale / top-N /
  // above-average across the whole range), so an incremental cell drain cannot
  // repaint it correctly. Force a full re-pull when a rule list changed (cfSet)
  // or when a changed cell sits on a sheet carrying CF rules — the app then
  // re-pulls the active sheet display, re-evaluating CF end to end.
  if (ops.some((o) => o && (o.op === 'cfSet' || o.op === 'dvSet'))) return { full: true };
  const seen = new Set();
  const cells = [];
  const push = (sheet, r, c) => {
    const key = `${sheet}␀${r}␀${c}`;
    if (seen.has(key)) return;
    seen.add(key);
    const a1 = `${RK.idxToCol(c)}${r + 1}`;
    const d = displayCell(sheet, a1, engine.getValue(sheet, a1));
    cells.push({ sheet, r, c, text: d.text, ty: d.ty, ...(d.num !== undefined ? { num: d.num } : {}), ...(d.sd ? { sd: d.sd } : {}) });
  };
  for (const { sheet, r, c } of ch.cells) { if (sheetHasCf(sheet) || sheetHasDv(sheet)) return { full: true }; push(sheet, r, c); }
  for (const { sheet, r, c } of extra) { if (sheetHasCf(sheet) || sheetHasDv(sheet)) return { full: true }; push(sheet, r, c); }
  return { full: false, cells };
};

// a1 keys touched by format-bearing ops, mapped to {sheet,r,c} display coords
const fmtTouched = (ops) => {
  const out = [];
  for (const op of ops) {
    let keys = null;
    if (op.op === 'setFormat') keys = Object.keys(op.cells);
    else if (op.op === 'setCells') keys = Object.entries(op.cells).filter(([, cell]) => cell && typeof cell === 'object' && 'fmt' in cell).map(([k]) => k);
    if (!keys || !keys.length) continue;
    const meta = session.getSheetMeta(op.sheet);
    if (!meta) continue;
    for (const k of keys) { const p = RK.parseA1(k); if (p) out.push({ sheet: meta.name, r: p.row, c: p.col }); }
  }
  return out;
};

const STRUCTURAL = new Set(['insertRows', 'deleteRows', 'insertCols', 'deleteCols', 'moveRange']);
const SHEETOPS = new Set(['sheetAdd', 'sheetRename', 'sheetDelete']);
// setFreeze rides with the size/merge meta bucket (the app re-pulls sheet meta)
const SIZEOPS = new Set(['sizeRows', 'sizeCols', 'setMerges', 'setFreeze']);
const CHARTOPS = new Set(['chartAdd', 'chartUpdate', 'chartDelete']);
const metaAffecting = (ops) => ({
  structural: ops.some((o) => STRUCTURAL.has(o.op)),
  sheets: ops.some((o) => SHEETOPS.has(o.op)),
  sizes: ops.some((o) => SIZEOPS.has(o.op)),
  names: ops.some((o) => o.op === 'nameSet'),
  charts: ops.some((o) => CHARTOPS.has(o.op)),
  condfmt: ops.some((o) => o.op === 'cfSet'),
  datavalid: ops.some((o) => o.op === 'dvSet'),
  pivots: ops.some((o) => o.op === 'pivotSet'),
});

// ---------- data-validation ingress gate (Batch M, handoff §4/L4) ----------
// Runs BEFORE session.applyTransaction when a USER-entry transaction opts in
// (enforce:true — set by the app's edit-commit, external paste, and
// window.reckon.setRange paths; the single write funnel, no second path). It
// gates only LITERAL user values (a cell op carrying `v`) — a formula entry
// (`f`) is a computed result and is never gated (spec). For each such cell the
// FIRST DV rule whose range covers it decides:
//   reject -> the whole transaction is refused (Excel blocks a paste wholesale)
//   warn   -> the write proceeds; the offending cells are reported + marked
// list-range membership resolves the referenced range live; a custom rule is
// evaluated with the PROPOSED value temporarily in the engine so a self-
// referential formula (=ISNUMBER(A1)) sees what the user typed, then restored.
const dvValueOfCell = (cell) => {
  if (cell === null || typeof cell !== 'object') return undefined;
  if ('f' in cell) return undefined; // computed result, never gated
  if ('v' in cell) return cell.v;
  return undefined; // fmt-only update carries no user value
};
const enforceDataValidation = (ops) => {
  const rejects = [];
  const warns = [];
  let touchedEngine = false; // a custom rule temp-set the engine and restored it
  if (!RK.dvRuleForCell || !RK.dvValueValid) return { rejects, warns };
  for (const op of ops) {
    if (!op || op.op !== 'setCells' || typeof op.cells !== 'object' || op.cells === null) continue;
    const meta = session.getSheetMeta(op.sheet);
    if (!meta) continue;
    const rules = session.dvForSheet ? session.dvForSheet(meta.name) : [];
    if (!rules.length) continue;
    for (const [a1, cell] of Object.entries(op.cells)) {
      const value = dvValueOfCell(cell);
      if (value === undefined) continue;
      const rule = RK.dvRuleForCell(rules, a1);
      if (!rule) continue;
      let valid;
      if (rule.type === 'custom') {
        const rg = RK.parseRangeA1(rule.range);
        const p = RK.parseA1(a1);
        const dr = p.row - rg.start.row;
        const dc = p.col - rg.start.col;
        const shifted = RK.shiftFormula ? RK.shiftFormula(rule.formula, dr, dc) : rule.formula;
        const prevRaw = engine.getCellRaw(meta.name, a1);
        engine.setCells(meta.name, [{ key: a1, raw: value }]);
        touchedEngine = true;
        let customResult;
        try { customResult = engine.evalFormula(meta.name, shifted); }
        finally { engine.setCells(meta.name, [{ key: a1, raw: prevRaw }]); }
        valid = RK.dvValueValid(rule, value, { customResult });
      } else if (rule.type === 'list' && rule.source === 'range') {
        const rg = regionVals(meta.name, rule.ref);
        const listValues = RK.dvListValues(rule, () => (rg ? rg.values : null));
        valid = RK.dvValueValid(rule, value, { listValues });
      } else {
        valid = RK.dvValueValid(rule, value, {});
      }
      if (valid) continue;
      const rec = { a1, sheet: meta.name, ruleId: rule.id, type: rule.type, onInvalid: rule.onInvalid, help: rule.help ?? null, value };
      if (rule.onInvalid === 'reject') rejects.push(rec); else warns.push(rec);
    }
  }
  // the custom-rule temp-set/restore nets to no state change, but churns the
  // engine's change log; discard it so the real apply's drain is clean
  if (touchedEngine) engine.drainChanges();
  return { rejects, warns };
};

const methods = {
  async init({ hfUrl } = {}) {
    if (!HFns) {
      if (hfUrl) {
        // pinned CDN UMD sets self.HyperFormula. Classic worker (the shipped
        // shape — module blob workers are blocked on file:// in Chromium)
        // loads it with importScripts; a module context falls back to import.
        if (typeof importScripts === 'function') importScripts(hfUrl);
        else await import(hfUrl);
      }
      HFns = globalThis.HyperFormula;
      if (!HFns) throw new Error('HyperFormula global missing after init');
    }
    engine = makeEngine();
    session = RK.createSession({ engine });
    wireSession(session);
    engine.drainChanges(); // discard the load-time full marker; the UI pulls full display on boot
    return { ready: true, sheets: session.sheetNames() };
  },
  loadWorkbook({ workbook }) {
    // migrate an on-disk workbook to the current schema at ingress (Batch K):
    // a v1 file (no charts) opens unchanged and saves forward as the new version.
    workbook = RK.migrate(workbook);
    const res = RK.validateWorkbook(workbook);
    if (!res.ok) return { ok: false, errors: res.errors };
    if (session) session.destroy();
    engine = makeEngine();
    session = RK.createSession({ engine, baseline: workbook });
    wireSession(session);
    engine.drainChanges(); // discard the load-time full marker; the UI pulls full display after load
    return { ok: true, sheets: session.sheetNames() };
  },
  applyTransaction(tx) {
    // data-validation ingress gate (§4/L4): only USER-entry transactions opt in
    // (enforce:true). A reject refuses the WHOLE transaction before it applies.
    if (tx && tx.enforce) {
      const gate = enforceDataValidation(tx.ops || []);
      if (gate.rejects.length) return { rejected: gate.rejects };
      const result = session.applyTransaction(tx);
      return { ...result, display: drainDisplay(fmtTouched(tx.ops), tx.ops), meta: metaAffecting(tx.ops), warnings: gate.warns };
    }
    const result = session.applyTransaction(tx);
    return { ...result, display: drainDisplay(fmtTouched(tx.ops), tx.ops), meta: metaAffecting(tx.ops) };
  },
  // list values a cell's DV rule offers for the in-cell dropdown (Batch M).
  // Returns { values, onInvalid } if the cell has a list rule, else null.
  dvListFor({ sheet, a1 }) {
    const rules = session.dvForSheet ? session.dvForSheet(sheet) : [];
    if (!rules.length || !RK.dvRuleForCell) return null;
    const rule = RK.dvRuleForCell(rules, a1);
    if (!rule || rule.type !== 'list') return null;
    const values = RK.dvListValues(rule, (ref) => { const rg = regionVals(sheet, ref); return rg ? rg.values : null; });
    return { values, onInvalid: rule.onInvalid };
  },
  // compute a pivot table for a def (committed pivot OR an uncommitted builder
  // preview) in the worker — the group-by + aggregation runs off the main thread
  // (handoff §10). Reads the source range's COMPUTED values (regionVals, errors
  // as their code string) and runs the pure engine (core/pivot.mjs). Returns the
  // structured result (rowKeys/colKeys/body/totals/fields) the region renderer
  // consumes; on a bad source range returns { ok:false }.
  pivotResult({ sheet, def }) {
    if (!def || typeof def !== 'object' || !RK.computePivot) return { ok: false, error: 'no pivot def' };
    const rg = regionVals(sheet, def.sourceRange);
    if (!rg) return { ok: false, error: 'invalid sourceRange' };
    const values2d = rg.values;
    const blankLabel = (RK.t && RK.t('pivot.blank') !== 'pivot.blank') ? RK.t('pivot.blank') : '(blank)';
    try {
      const res = RK.computePivot(def, values2d, { blankLabel });
      return res;
    } catch (err) {
      return { ok: false, error: String((err && err.message) || err) };
    }
  },
  undo() {
    const entry = session.entryAt(session.getHead() - 1);
    const did = session.undo();
    const ops = did && entry ? entry.inverse : [];
    return { did, display: drainDisplay(fmtTouched(ops), ops), meta: metaAffecting(ops) };
  },
  redo() {
    const entry = session.entryAt(session.getHead());
    const did = session.redo();
    const ops = did && entry ? entry.ops : [];
    return { did, display: drainDisplay(fmtTouched(ops), ops), meta: metaAffecting(ops) };
  },
  canUndo() { return session.canUndo(); },
  canRedo() { return session.canRedo(); },
  serialize() { return session.serialize(); },
  snapshotJson() { return session.snapshotJson(); },
  getValue({ sheet, a1 }) { return session.getValue(sheet, a1); },
  getFormula({ sheet, a1 }) { return session.getFormula(sheet, a1); },
  // raw content + display for the formula bar / editor
  getCell({ sheet, a1 }) {
    const f = session.getFormula(sheet, a1);
    const v = session.getValue(sheet, a1);
    const raw = f ?? engine.getCellRaw(sheet, a1);
    const d = displayCell(sheet, a1, v);
    return { f, v, raw, display: d.text, ty: d.ty, fmt: session.fmtIdFor(sheet, a1) };
  },
  // the resolved format def + id for a cell (toolbar reads the active cell here)
  getCellFormat({ sheet, a1 }) {
    return { id: session.fmtIdFor(sheet, a1), def: session.fmtDefFor(sheet, a1) };
  },
  getSheetDisplay({ sheet }) { return buildSheetDisplay(sheet); },
  regionCells({ sheet, range }) { return engine.regionCells(sheet, range); },
  // computed values across a range as a dense 2-D array (sort keys, filter
  // predicates) — errors surface as their code string, empties as null
  regionValues({ sheet, range }) {
    const p = RK.parseRangeA1(range);
    if (!p) return { values: [] };
    const values = [];
    for (let r = p.start.row; r <= p.end.row; r += 1) {
      const row = [];
      for (let c = p.start.col; c <= p.end.col; c += 1) {
        const v = engine.getValue(sheet, `${RK.idxToCol(c)}${r + 1}`);
        row.push(v && typeof v === 'object' && v.err ? v.err : v);
      }
      values.push(row);
    }
    return { values, start: p.start, end: p.end };
  },
  sheetNames() { return session.sheetNames(); },
  getSheetMeta({ id }) { return session.getSheetMeta(id); },
  // resolved format defs for the formatted cells inside a range (toolbar patch)
  regionFormats({ sheet, range }) {
    const p = RK.parseRangeA1(range);
    if (!p) return {};
    const out = {};
    for (const a1 of session.fmtKeys(sheet)) {
      const q = RK.parseA1(a1);
      if (!q || q.row < p.start.row || q.row > p.end.row || q.col < p.start.col || q.col > p.end.col) continue;
      const def = session.fmtDefFor(sheet, a1);
      if (def) out[a1] = def;
    }
    return out;
  },
  getNames() { return session.getNames(); },
  getLocale() { return session.getLocale(); },
  // function names for formula autocomplete (seam-registered set included)
  engineInfo() {
    const cls = HFns.HyperFormula ?? HFns;
    let functions = [];
    try { functions = cls.getRegisteredFunctionNames('enGB'); } catch { /* older API */ }
    return { functions, version: cls.version ?? null };
  },
  // find: substring match over raw content and display text, capped
  search({ query, matchCase = false, limit = 500 } = {}) {
    if (typeof query !== 'string' || query.length === 0) return { matches: [] };
    const q = matchCase ? query : query.toLowerCase();
    const matches = [];
    for (const { name } of session.sheetNames()) {
      const raws = engine.serializeSheet(name);
      const values = engine.sheetValues(name);
      const seen = new Set();
      for (const [key, cell] of Object.entries(raws)) {
        const raw = cell.f !== undefined ? cell.f : String(cell.v);
        const hay = matchCase ? raw : raw.toLowerCase();
        if (hay.includes(q)) {
          matches.push({ sheet: name, a1: key, raw, display: displayOf(engine.getValue(name, key)).text });
          seen.add(key);
        }
        if (matches.length >= limit) return { matches, truncated: true };
      }
      values.forEach((rowArr, r) => rowArr.forEach((v, c) => {
        if (v === null || v === undefined) return;
        const a1 = `${RK.idxToCol(c)}${r + 1}`;
        if (seen.has(a1)) return;
        const d = displayOf(v).text;
        const hay = matchCase ? d : d.toLowerCase();
        if (hay.includes(q)) {
          const cell = raws[a1];
          const raw = cell ? (cell.f !== undefined ? cell.f : String(cell.v)) : d;
          matches.push({ sheet: name, a1, raw, display: d });
        }
      }));
      if (matches.length >= limit) return { matches: matches.slice(0, limit), truncated: true };
    }
    return { matches };
  },
  getLog() { return session.getLog(); },
  getHead() { return session.getHead(); },
  replayCheck() {
    const { ok } = RK.replayCheck(session, makeEngine);
    return { ok };
  },
  validateRange({ values }) { return RK.validateRange(values); },
  // validate-only ingress (§4) for IO import: checks the parsed payload WITHOUT
  // loading it, so the import can then land through applyTransaction (L4) with undo.
  validateWorkbook({ workbook }) { return RK.validateWorkbook(RK.migrate(workbook)); },
  // eval a formula WITHOUT committing (agent face §6): the main thread never
  // evaluates user text — this runs in the worker against the live engine.
  evalFormula({ sheet, formula }) { return engine.evalFormula(sheet, formula); },
  // force a full rebuild + recalc (agent face recalc()); returns a full display marker
  recalc() { engine.recalc(); return { display: drainDisplay(), meta: {} }; },
};

onmessage = async (e) => {
  const { id, method, args } = e.data ?? {};
  if (typeof id !== 'number' || !(method in methods)) {
    postMessage({ id: id ?? -1, ok: false, error: `unknown method "${method}"` });
    return;
  }
  try {
    const result = await methods[method](args ?? {});
    postMessage({ id, ok: true, result });
  } catch (err) {
    postMessage({ id, ok: false, error: String((err && err.message) || err) });
  }
};

postMessage({ event: 'boot', payload: { ok: true } });
</script>

      capabilities.system = msg.system === true;
      capabilities.sysFs = msg.sysFs === true;
      if (typeof msg.ai === 'boolean') capabilities.ai = msg.ai;
      capabilities.aiModel = typeof msg.aiModel === 'string' ? msg.aiModel : null;
      capabilities.aiModelLabel = typeof msg.aiModelLabel === 'string' ? msg.aiModelLabel : null;
      capabilities.aiProvider = typeof msg.aiProvider === 'string' ? msg.aiProvider : null;
      capabilities.aiLocal = msg.aiLocal !== false;
      capabilities.aiState = typeof msg.aiState === 'string' ? msg.aiState : 'idle';
      capabilities.aiImages = msg.aiImages === true;
      capabilities.aiImageModel = typeof msg.aiImageModel === 'string' ? msg.aiImageModel : null;
      capabilities.aiImageModelLabel = typeof msg.aiImageModelLabel === 'string'
        ? msg.aiImageModelLabel
        : null;
      capabilities.aiImageProvider = typeof msg.aiImageProvider === 'string'
        ? msg.aiImageProvider

      capabilities.aiImageLocal = msg.aiImageLocal !== false;
      capabilities.aiImageState = typeof msg.aiImageState === 'string'

      capabilities.aiSearchState = typeof msg.aiSearchState === 'string'

      }

    capabilities: capabilities,   // mutated in place; read fields directly
    ready: function () {

          fsSubscribe: true,
          aiStream: true,
          aiImages: true,
          aiSearch: true,
        },

    title: function (s) { send('naklios:title', { title: String(s) }); },
    close: function () { send('naklios:close'); },
    openSettings: function (section) {

    },
    beforeClose: function (cb) { beforeCloseCb = typeof cb === 'function' ? cb : null; },
    theme: {
      get current() { return currentTheme; },
      onChange: function (cb) {
        if (typeof cb !== 'function') return function () {};
        themeListeners.add(cb);
        if (currentTheme) { try { cb(currentTheme); } catch (_) {} }

      },
      request: function () { send('naklios:theme-request'); },
    },
    onCapabilitiesChange: function (cb) {
      if (typeof cb !== 'function') return function () {};
      capListeners.add(cb);
      try { cb(capabilities); } catch (_) {}

    },
    requestCapabilities: function () { send('naklios:capabilities-request'); },
    fs: {
      // All paths are app-relative (under apps/<your-id>/ in the host folder).
      // Returns Promises. Reject if no folder connected, permission denied,

      read:       function (path)       { return rpc('naklios:fs:read', fsPayload({ path: path })); },
      readBinary: function (path)       { return rpc('naklios:fs:readBinary', fsPayload({ path: path })); },
      write:      function (path, data) { return rpc('naklios:fs:write', fsPayload({ path: path, data: data })); },
      append:     function (path, line) { return rpc('naklios:fs:append', fsPayload({ path: path, line: line })); },
      list:       function (prefix)     { return rpc('naklios:fs:list', fsPayload({ prefix: prefix || '' })); },
      delete:     function (path)       { return rpc('naklios:fs:delete', fsPayload({ path: path })); },
      exists:     function (path)       { return rpc('naklios:fs:exists', fsPayload({ path: path })); },
      // Watch an app-relative path or directory. Crate events are immediate;

      // an unsubscribe function.
      subscribe: async function (path, cb) {
        if (typeof cb !== 'function') throw new Error('naklios.fs.subscribe requires a callback');

          'naklios:fs:subscribe',
          fsPayload({ path: path || '' }),
        );

        var active = true;
        return function () {
          if (!active) return;
          active = false;
          fsSubscriptions.delete(subscriptionId);
          send('naklios:fs:unsubscribe', { subscriptionId: subscriptionId });
        };
      },
      // Explicit backend changes are always confirmed by the NakliOS host.
      // Switching changes the app-scoped view; it never copies or deletes data.
      useBackend: function (backend)    { return rpc('naklios:fs:selectBackend', { backend: backend }); },

    // full-from-store-root (e.g. 'apps/anvil/ws/demo/main.py', 'state.json'),

    // file manager: one app can see every other app's files.
    sys: {
      fs: {
        read:       function (path)       { return rpc('naklios:sysfs:read', fsPayload({ path: path })); },
        readBinary: function (path)       { return rpc('naklios:sysfs:readBinary', fsPayload({ path: path })); },
        write:      function (path, data) { return rpc('naklios:sysfs:write', fsPayload({ path: path, data: data })); },
        append:     function (path, line) { return rpc('naklios:sysfs:append', fsPayload({ path: path, line: line })); },
        list:       function (prefix)     { return rpc('naklios:sysfs:list', fsPayload({ prefix: prefix || '' })); },
        delete:     function (path)       { return rpc('naklios:sysfs:delete', fsPayload({ path: path })); },
        exists:     function (path)       { return rpc('naklios:sysfs:exists', fsPayload({ path: path })); },
      },
    },
    files: {
      // Ask NakliOS to open one app-relative file in another cooperative app.
      // The target gets a window-lifetime token for exactly that file; it does
      // not receive the source app's namespace or a Folder/Crate credential.
      openWith: function (appId, path) {
        return rpc('naklios:file:openWith', fsPayload({
          appId: String(appId || ''),
          path: String(path || ''),
        }));
      },
      onOpen: function (cb) {
        if (typeof cb !== 'function') return function () {};
        fileOpenListeners.add(cb);
        var queued = pendingFileGrants.splice(0);
        queued.forEach(function (grant) {
          try { cb(grant); } catch (_) {}
        });
        return function () { fileOpenListeners.delete(cb); };
      },
      read: function (token) {
        return rpc('naklios:file:read', { token: String(token || '') });
      },
      write: function (token, data) {
        return rpc('naklios:file:write', { token: String(token || ''), data: data });
      },
      release: function (token) {
        send('naklios:file:release', { token: String(token || '') });
      },
    },
    ai: {
      chat: {
        completions: {
          create: createAiCompletion,
        },
      },
      images: {
        generate: createAiImage,
      },
      // Semantic search over the app's own namespace on the connected
      // backend. The host builds/refreshes a local embedding index on first
      // use (one consent prompt) and returns ranked chunks.
      search: function (options) {
        if (!inNakliOS) {
          return Promise.reject(new Error('Not hosted — naklios.ai unavailable standalone'));
        }
        if (!capabilities.aiSearch) {
          return Promise.reject(new Error('NakliOS semantic search is unavailable or not permitted'));
        }
        options = options || {};
        var requestId = 's' + (++rpcCounter) + '_' + Date.now();
        return new Promise(function (resolve, reject) {
          ragSearches.set(requestId, {
            onIndexing: typeof options.onIndexing === 'function' ? options.onIndexing : null,
          });
          pendingRpc.set(requestId, { resolve: resolve, reject: reject });
          send('naklios:rag:search', {
            requestId: requestId,
            query: String(options.query || ''),
            limit: options.limit,
            prefix: options.prefix,
          });
          // Index building embeds every changed chunk locally; allow 15 min.
          setTimeout(function () {
            if (pendingRpc.has(requestId)) {
              pendingRpc.delete(requestId);
              reject(new Error('naklios RPC timeout: naklios:rag:search'));
            }
          }, 15 * 60 * 1000);
        }).finally(function () {
          ragSearches.delete(requestId);
        });
      },
      searchStatus: function () {
        return rpc('naklios:rag:status', {});
      },
      cancelAll: function () {
        aiRequests.forEach(function (_, requestId) {
          send('naklios:ai:cancel', { requestId: requestId });
        });
        aiImageRequests.forEach(function (_, requestId) {
          send('naklios:ai:cancel', { requestId: requestId });
        });
      },
    },
  };
})();
