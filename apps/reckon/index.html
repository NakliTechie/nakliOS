      if (!query) { matches = []; resultsEl().innerHTML = ''; statusEl().textContent = ''; return; }
      const res = await client.search({ query, matchCase: matchCase() });
      matches = res.matches;
      current = -1;
      statusEl().textContent = matches.length
        ? `${matches.length}${res.truncated ? '+' : ''} match${matches.length === 1 ? '' : 'es'}`
        : 'no matches';
      const list = resultsEl();
      list.innerHTML = '';
      matches.slice(0, 200).forEach((m, i) => {
        const row = document.createElement('button');
        row.type = 'button';
        row.className = 'rk-find-hit';
        row.innerHTML = `<span class="rk-find-addr"></span><span class="rk-find-raw"></span>`;
        row.querySelector('.rk-find-addr').textContent = `${m.sheet}!${m.a1}`;
        row.querySelector('.rk-find-raw').textContent = m.raw;
        row.addEventListener('click', () => jumpTo(i));
        list.appendChild(row);
      });
      if (matches.length) jumpTo(0);
    };

    const doReplace = async (all) => {
      const query = q();
      if (!query) return;
      await runFind();
      const scope = all ? matches : (matches[Math.max(current, 0)] ? [matches[Math.max(current, 0)]] : []);
      const bySheet = new Map();
      const flags = matchCase() ? 'g' : 'gi';
      const rx = new RegExp(query.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'), flags);
      for (const m of scope) {
        if (!rx.test(m.raw)) { rx.lastIndex = 0; continue; }
        rx.lastIndex = 0;
        // Replacement is a LITERAL string, not a regex substitution template: a
        // function replacer bypasses $&, $1, $$, $` handling so a value like
        // "$$5" or "a$b" writes exactly those characters (was: m.raw corruption).
        const replacement = rep();
        const next = m.raw.replace(rx, () => replacement);
        const sh = sheets.find((s) => s.name === m.sheet);
        if (!sh) continue;
        if (!bySheet.has(sh.id)) bySheet.set(sh.id, {});
        const typed = RK.typedRaw(next);
        bySheet.get(sh.id)[m.a1] = next === '' ? null : (typeof typed === 'string' && typed.startsWith('=') ? { f: typed } : { v: typed });
      }
      const ops = [...bySheet.entries()].map(([sheet, cells]) => ({ op: 'setCells', sheet, cells }));
      if (!ops.length) { statusEl().textContent = RK.t('find.nothing'); return; }
      await txApply(ops, { origin: 'ui:replace' });
      statusEl().textContent = `replaced ${[...bySheet.values()].reduce((a, c) => a + Object.keys(c).length, 0)} cell(s)`;
      await runFind();
    };

    const d = showDialog({
      title: RK.t('find.title'),
      body,
      buttons: [
        { label: RK.t('find.replace'), onClick: () => doReplace(false) },
        { label: RK.t('find.replaceAll'), onClick: () => doReplace(true) },
        { label: RK.t('find.find'), primary: true, onClick: () => runFind() },
      ],
      initialFocus: body.querySelector('#rk-find-q'),
    });
    body.querySelector('#rk-find-q').addEventListener('keydown', (e) => { if (e.key === 'Enter') { e.preventDefault(); runFind(); } });
    return d;
  };

  // ---------- help ----------
  // §14 privacy statement — the SAME wording ships verbatim in README.md. Reckon
  // runs entirely in the browser; the only thing that can ever leave is the
  // optional AI sidecar, and only on an explicit Send, as a bounded slice.
  const PRIVACY_STATEMENT_HTML = `
      <p class="rk-help-lede">Reckon runs entirely in your browser. Your workbook, your edits, and your formulas never leave your device on their own — there is no server, no account, and no telemetry.</p>
      <p class="rk-help-note">The one feature that can send anything is the optional AI sidecar (the <code>=?</code> formula drafting and the formula explanations), and only when you press Send. It never calls out on its own. When you do send, Reckon sends a bounded <em>slice</em> of context, never the whole sheet: the target cell reference and the selected cells' values and formulas; the row-1 column headers and column-A row labels of the enclosing block; your named ranges and your locale.</p>
      <p class="rk-help-note">Where that slice goes depends on which rung of the model ladder is active:</p>
      <table class="rk-help-table">
        <tr><td>Local bridge</td><td>Ollama on 127.0.0.1 — the slice stays on your own machine.</td></tr>
        <tr><td>In-browser (WebGPU)</td><td>runs in this tab; the model downloads once from Hugging Face, then inference is local — nothing you type is sent anywhere.</td></tr>
        <tr><td>Your own key (BYOK)</td><td>the slice goes to the provider <em>you</em> configured, using <em>your</em> key. The key is stored in this browser (IndexedDB), shown only as a fingerprint, and is never sent to us — Reckon has no server to send it to.</td></tr>
      </table>
      <p class="rk-help-note">Hover the Send button to see exactly what will be sent before you send it.</p>`;

  const openHelp = () => {
    const body = document.createElement('div');
    body.className = 'rk-help';
    body.innerHTML = `
      <p class="rk-help-lede">${RK.t('help.lede')}</p>
      <h3>${RK.t('help.dataLives')}</h3>
      <table class="rk-help-table">
        <tr><td>${RK.t('help.folderGranted')}</td><td>${RK.t('help.folderGrantedD')}</td></tr>
        <tr><td>${RK.t('help.noFolder')}</td><td>${RK.t('help.noFolderD')}</td></tr>
      </table>
      <h3>${RK.t('help.keyboard')}</h3>
      <table class="rk-help-table">
        <tr><td>Arrows · Tab · Enter</td><td>move (Shift reverses / extends)</td></tr>
        <tr><td>⌘/Ctrl+Arrow</td><td>jump to data edge; +Shift extends</td></tr>
        <tr><td>Type or F2</td><td>edit cell · Esc cancels · Enter/Tab commits</td></tr>
        <tr><td>⌘/Ctrl+Z / Y</td><td>undo / redo</td></tr>
        <tr><td>⌘/Ctrl+C / X / V</td><td>copy / cut / paste (formulas shift refs)</td></tr>
        <tr><td>⌘/Ctrl+F</td><td>find &amp; replace</td></tr>
        <tr><td>Shift+Space / Ctrl+Space</td><td>select row / column</td></tr>
        <tr><td>⌘/Ctrl+A · ⌘/Ctrl+Home/End</td><td>select used range · jump to A1 / last cell</td></tr>
        <tr><td>Drag row/column edge</td><td>resize (undoable) · drag fill handle to fill</td></tr>
      </table>
      <p class="rk-help-note">${RK.t('help.conflicts')}</p>
      <h3>${RK.t('help.privacyTitle')}</h3>
      ${PRIVACY_STATEMENT_HTML}
      <p class="rk-help-note">Version ${VERSION} · AGPL-3.0 · engine: HyperFormula (GPLv3) · grid: x-spreadsheet (MIT) · AI: @huggingface/transformers (Apache-2.0)</p>`;
    showDialog({ title: RK.t('help.title'), body, buttons: [{ label: RK.t('btn.close'), primary: true, onClick: (d) => d.close() }] });
  };
  els.help.addEventListener('click', openHelp);

  // ---------- storage ----------
  const enc = (s) => new TextEncoder().encode(s);
  const dec = (b) => new TextDecoder().decode(b);

  const setSaveStatus = (text, { error = false } = {}) => {
    els.statusLeft.textContent = text;
    els.statusLeft.classList.toggle('error', error);
    if (fsaState.needsReconnect) {
      const chip = document.createElement('button');
      chip.type = 'button';
      chip.className = 'rk-chip';
      chip.textContent = 'Reconnect folder';
      chip.addEventListener('click', reconnectFsa);
      els.statusLeft.append(' — ', chip);
    }
  };

  const describeStorage = () => {
    if (!facade) return 'not saving (fixture mode)';
    if (facade.primaryKind === 'fsa') return `on disk: ${fsaState.fileName}`;
    if (facade.primaryKind === 'memory') return 'in memory only';
    return 'in this browser only';
  };

  const wireFacade = () => {
    facade.onStatus((st) => {
      if (st.lastError) setSaveStatus(`${describeStorage()} — save problem: ${st.lastError}`, { error: true });
      else if (st.saving) setSaveStatus(`${describeStorage()} — saving…`);
      else if (st.lastSavedAt) setSaveStatus(`${describeStorage()} — saved ${new Date(st.lastSavedAt).toLocaleTimeString()}`);
      else setSaveStatus(describeStorage());
    });
    setSaveStatus(describeStorage());
  };

  const buildAutosave = () => {
    autosave?.dispose();
    autosave = RK.createAutosave({
      session: client,
      facade,
      serialize: async () => enc(JSON.stringify(await client.serialize())),
    });
  };

  const adoptFsa = async (dirHandle, fileHandle) => {
    fsaState.dir = dirHandle;
    fsaState.file = fileHandle;
    fsaState.fileName = fileHandle.name;
    fsaState.needsReconnect = false;
    facade = await RK.createCrateFacade({ backends: [
      RK.makeFsaBackend(fileHandle),
      RK.makeOpfsBackend(),
      RK.makeIdbBackend(),
    ] });
    buildAutosave();
    wireFacade();
    await kvSet('fsa', { dir: dirHandle, file: fileHandle, fileName: fileHandle.name });
    renderEmptyState();
  };

  const reconnectFsa = async () => {
    const saved = fsaState.saved;
    if (!saved?.file) return;
    try {
      const perm = await saved.file.requestPermission({ mode: 'readwrite' });
      if (perm !== 'granted') { toast('Folder access was not granted', { kind: 'error' }); return; }
      await adoptFsa(saved.dir, saved.file);
      const file = await saved.file.getFile();
      const bytes = new Uint8Array(await file.arrayBuffer());
      if (bytes.length) {
        const wb = JSON.parse(dec(bytes));
        const res = await client.loadWorkbook(wb);
        if (res.ok) { await refreshSheets(); await loadActiveSheet(); }
        else toast('Workbook on disk failed validation — keeping the in-browser copy', { kind: 'error', ms: 8000 });
      }
      toast(`Reconnected: ${saved.file.name}`);
    } catch (e) {
      toast(`Reconnect failed: ${e.message}`, { kind: 'error' });
    }
  };

  const openFolderFlow = async () => {
    if (!fsaState.supported) { openHelp(); return; }
    let dir;
    try {
      dir = await window.showDirectoryPicker({ mode: 'readwrite', id: 'reckon' });
    } catch { return; /* user cancelled the picker */ }
    const files = [];
    try {
      for await (const entry of dir.values()) {
        if (entry.kind === 'file' && entry.name.endsWith('.reckon.json')) files.push(entry);
      }
    } catch (e) { toast(`Could not list folder: ${e.message}`, { kind: 'error' }); return; }
    files.sort((a, b) => a.name.localeCompare(b.name));

    const body = document.createElement('div');
    body.className = 'rk-folder';
    const list = document.createElement('div');
    list.className = 'rk-folder-list';
    if (files.length === 0) {
      const none = document.createElement('div');
      none.className = 'rk-folder-none';
      none.textContent = 'No workbooks in this folder yet.';
      list.appendChild(none);
    }
    body.appendChild(list);
    const newRow = document.createElement('div');
    newRow.className = 'rk-folder-new';
    newRow.innerHTML = '<input type="text" placeholder="new-workbook" aria-label="New workbook name" spellcheck="false"><span class="rk-folder-ext">.reckon.json</span>';
    body.appendChild(newRow);

    const d = showDialog({
      title: `Folder: ${dir.name}`,
      body,
      buttons: [
        { label: 'Cancel', onClick: (dd) => dd.close() },
        {
          label: 'Create & keep current workbook here',
          primary: true,
          onClick: async (dd) => {
            const nameInput = newRow.querySelector('input');
            const base = (nameInput.value.trim() || 'workbook').replace(/[^A-Za-z0-9._ -]/g, '');
            const fileName = base.endsWith('.reckon.json') ? base : `${base}.reckon.json`;
            try {
              const fh = await dir.getFileHandle(fileName, { create: true });
              await adoptFsa(dir, fh);
              await autosave.flush();
              dd.close();
              toast(`Saving to ${fileName}`);
            } catch (e) { toast(`Could not create: ${e.message}`, { kind: 'error' }); }
          },
        },
      ],
      initialFocus: files.length ? undefined : newRow.querySelector('input'),
    });

    for (const fh of files) {
      const row = document.createElement('button');
      row.type = 'button';
      row.className = 'rk-folder-file';
      row.textContent = fh.name;
      row.addEventListener('click', async () => {
        try {
          const file = await fh.getFile();
          const wb = JSON.parse(await file.text());
          const res = await client.loadWorkbook(wb);
          if (!res.ok) {
            toast(`${fh.name} failed validation: ${res.errors[0].path} ${res.errors[0].msg}`, { kind: 'error', ms: 8000 });
            return;
          }
          await adoptFsa(dir, fh);
          await refreshSheets();
          await loadActiveSheet();
          d.close();
          toast(`Opened ${fh.name}`);
        } catch (e) { toast(`Could not open: ${e.message}`, { kind: 'error' }); }
      });
      list.appendChild(row);
    }
  };

  const renderEmptyState = () => {
    const showOpen = !ephemeral && facade && facade.primaryKind !== 'fsa';
    els.empty.hidden = !showOpen;
    if (!showOpen) return;
    els.empty.innerHTML = '';
    if (fsaState.supported) {
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'rk-empty-link';
      btn.textContent = RK.t('empty.open');
      btn.addEventListener('click', openFolderFlow);
      els.empty.appendChild(btn);
    } else {
      const span = document.createElement('span');
      span.textContent = RK.t('empty.browserOnly');
      els.empty.appendChild(span);
    }
    const help = document.createElement('button');
    help.type = 'button';
    help.className = 'rk-empty-help';
    help.setAttribute('aria-label', RK.t('a11y.help'));
    help.textContent = '?';
    help.addEventListener('click', openHelp);
    els.empty.appendChild(help);
  };

  const initStorage = async () => {
    if (ephemeral) {
      facade = await RK.createCrateFacade({ backends: [RK.makeMemoryBackend()] });
      buildAutosave();
      wireFacade();
      return;
    }
    const saved = await kvGet('fsa');
    fsaState.saved = saved ?? null;
    let fsaBackend = null;
    if (saved?.file) {
      try {
        const perm = await saved.file.queryPermission({ mode: 'readwrite' });
        if (perm === 'granted') {
          fsaBackend = RK.makeFsaBackend(saved.file);
          fsaState.dir = saved.dir;
          fsaState.file = saved.file;
          fsaState.fileName = saved.fileName ?? saved.file.name;
        } else fsaState.needsReconnect = true;
      } catch { fsaState.needsReconnect = true; }
    }
    facade = await RK.createCrateFacade({ backends: [
      ...(fsaBackend ? [fsaBackend] : []),
      RK.makeOpfsBackend(),
      RK.makeIdbBackend(),
    ] });
    const { bytes, from } = await facade.load();
    if (bytes && bytes.length) {
      try {
        const wb = JSON.parse(dec(bytes));
        const res = await client.loadWorkbook(wb);
        if (!res.ok) toast(`Stored workbook (${from}) failed validation — starting empty`, { kind: 'error', ms: 8000 });
      } catch {
        toast(`Stored workbook (${from}) is unreadable — starting empty`, { kind: 'error', ms: 8000 });
      }
    }
    buildAutosave();
    wireFacade();
  };

  // ---------- fixture loading (e2e / screens; http only) ----------
  const initFixture = async () => {
    const fixture = params.get('fixture');
    if (!fixture || location.protocol === 'file:') return;
    const res = await fetch(fixture);
    const wb = await res.json();
    const out = await client.loadWorkbook(wb);
    if (!out.ok) throw new Error(`fixture failed validation: ${out.errors[0].path} ${out.errors[0].msg}`);
  };

  // ---------- boot ----------
  const boot = async () => {
    // i18n: choose the UI locale BEFORE any chrome is built (?lang= wins, for
    // e2e/screens; then the saved choice; then en), and reflect it on <html lang>.
    const savedLang = ephemeral ? null : await kvGet('lang');
    const lang = RK.i18n.setLocale(params.get('lang') || savedLang || 'en');
    document.documentElement.lang = lang;

    await initStorage();
    await initFixture();

    const info = await client.engineInfo();
    fnNames = (info.functions ?? []).map((f) => f.toUpperCase()).sort();
    definedNames = await client.getNames();
    sheets = await client.sheetNames();
    activeId = sheets[0]?.id ?? null;

    grid = RK.createGridView({
      mount: els.grid,
      defaults: { rowHeight: 22, colWidth: 100 },
      hooks: {
        onSelect: () => { refreshBar(); refreshDvDropdown(); },
        onEditStart: ({ initial }) => editor.start({ initial }),
        onUndo: doUndo,
        onRedo: doRedo,
        onFind: openFind,
        onSave: () => autosave?.flush().catch(() => {}),
        onClear: (range) => clearRange(range),
        onCopy: doCopy,
        onPaste: doPaste,
        onFill: doFill,
        onResizeRow: (ri, h) => txApply([{ op: 'sizeRows', sheet: activeId, rows: { [ri + 1]: h } }], { origin: 'ui:resize', skipMeta: true }),
        onResizeCol: (ci, w) => txApply([{ op: 'sizeCols', sheet: activeId, cols: { [idxToCol(ci)]: w } }], { origin: 'ui:resize', skipMeta: true }),
        onViewportChanged: () => { editor.reposition(); repositionDvDropdown(); pivotsLayer?.reposition(); },
        onEscape: () => { lastClip = null; grid.hideClipboardMarquee(); toolbar?.closePop(); if (dvDropdown?.isOpen()) dvDropdown.close(); },
        onBold: () => toolbarHooks.toggle('bold'),
        onItalic: () => toolbarHooks.toggle('italic'),
      },
    });

    toolbar = RK.createToolbar({ mount: els.toolbar, hooks: toolbarHooks });

    // charts overlay (Batch K): floats over the grid; drag/resize commit chartUpdate
    chartsLayer = RK.createChartsLayer({
      mount: els.grid,
      onMove: onChartMove,
      onResize: onChartResize,
      onOpenSettings: openChartSettings,
      onUndo: doUndo,
      onRedo: doRedo,
      getAccent: () => (getComputedStyle(document.documentElement).getPropertyValue('--rk-accent').trim() || undefined),
    });

    // pivot region overlay (Batch N): cell-anchored, scrolls with the grid
    pivotsLayer = RK.createPivotsLayer({
      mount: grid.overlayEl,
      rectOf: (r, c) => grid.overlayRectOf(r, c),
      onOpenSettings: (id) => openPivotBuilder(id),
      onDelete: (id) => deletePivot(id),
    });
    // pivot builder (Batch N): in-app dialog, pivotSet tx; live preview via worker
    pivotBuilder = RK.createPivotBuilder({
      showDialog,
      commit: commitPivot,
      remove: deletePivot,
      computeResult: (def) => client.pivotResult(activeName(), def),
      getSelectionRange: () => grid.rangeA1().a1,
      suggestPosition: suggestPivotPosition,
      getPivots: () => activePivots,
      toast: (msg) => toast(msg, { kind: 'error' }),
    });

    // conditional-formatting rules manager (Batch L): in-app dialog, cfSet tx
    condFormatPanel = RK.createCondFormatPanel({
      showDialog,
      commit: commitCondFormat,
      getRules: () => condFormatRules,
      getSelectionRange: () => grid.rangeA1().a1,
      sheetLabel: () => `${RK.t ? RK.t('cf.onSheet') : 'Rules on'} ${activeName()}`,
      toast: (msg) => toast(msg, { kind: 'error' }),
    });

    // data-validation rules manager (Batch M): in-app dialog, dvSet tx
    dataValidPanel = RK.createDataValidPanel({
      showDialog,
      commit: commitDataValid,
      getRules: () => dataValidRules,
      getSelectionRange: () => grid.rangeA1().a1,
      sheetLabel: () => `${RK.t ? RK.t('dv.onSheet') : 'Rules on'} ${activeName()}`,
      toast: (msg) => toast(msg, { kind: 'error' }),
    });
    // in-cell list dropdown (Batch M): the caret + listbox pinned to the active
    // list cell, in the grid's overlay layer; a choice commits through the gate.
    dvDropdown = RK.createDvDropdown({
      layer: grid.overlayEl,
      commit: commitDvChoice,
      onClose: () => grid.focus(),
    });

    editor = RK.createEditController({
      grid,
      bar: { input: els.fx, mirror: els.fxMirror, wrap: els.fxWrap },
      getCellRaw: async (a1) => (await client.getCell(activeName(), a1)).raw,
      getFnNames: () => fnNames,
      getDefinedNames: () => definedNames,
      onCommit: commitEdit,
      onCancel: () => { grid.focus(); refreshBar(); },
    });

    // sidecar (Batch G): staging slot + explain panel + `=?` affordance
    try { wbLocale = await client.getLocale(); } catch { wbLocale = 'en-IN'; }
    sidecar = RK.createSidecar({
      slotEl: els.sidecar,
      hintEl: els.aiHint,
      evalFormula: sidecarEval,
      gatherContext: gatherSidecarContext,
      onAccept: onSidecarAccept,
      onClosed: () => { if (!editor.active()) { grid.focus(); refreshBar(); } },
      getProposer,
      openAiSettings,
    });
    els.aiHint?.addEventListener('click', () => {
      const s = grid.selection();
      if (editor.active()) editor.cancel();
      sidecar.request({ targetA1: a1Of(s.ri, s.ci), description: '' });
    });
    // global sidecar shortcuts: Ctrl/Cmd+Shift+F draft, Ctrl/Cmd+Shift+E explain
    document.addEventListener('keydown', (e) => {
      const mod = e.metaKey || e.ctrlKey;
      if (!mod || !e.shiftKey) return;
      const k = e.key.toLowerCase();
      if (k === 'f') { e.preventDefault(); const s = grid.selection(); if (editor.active()) editor.cancel(); sidecar.request({ targetA1: a1Of(s.ri, s.ci), description: '' }); }
      else if (k === 'e') { e.preventDefault(); if (editor.active()) editor.cancel(); explainActiveCell(); }
    }, true);
    // DV list dropdown keyboard (Batch M): capture phase runs before the grid's
    // catcher handler, so an open listbox owns arrows/Enter/Esc, and Alt+ArrowDown
    // (Excel's binding) opens the list of the active list cell.
    document.addEventListener('keydown', (e) => {
      if (!dvDropdown) return;
      if (dvDropdown.isOpen()) {
        if (dvDropdown.handleKeydown(e)) { e.stopPropagation(); }
        return;
      }
      if (e.altKey && e.key === 'ArrowDown' && dvDropdown.hasList() && grid.focused() && !editor.active()) {
        e.preventDefault(); e.stopPropagation();
        dvDropdown.open();
      }
    }, true);
    // restore enabled ladder rungs (no ambient network — bridge stays off until
    // the user re-checks; only persisted configs are restored)
    if (!ephemeral) {
      try { aiConfig.bridge = (await kvGet('aiBridge')) || null; } catch { /* none */ }
      try { aiConfig.webgpu = (await kvGet('aiWebgpu')) || null; } catch { /* none */ }
    }
    try { aiConfig.byok = await RK.loadByok(); } catch { aiConfig.byok = null; }
    sidecar.refreshAffordance();

    // name box: type an address or defined name, Enter jumps
    els.namebox.addEventListener('keydown', (e) => {
      e.stopPropagation();
      if (e.key !== 'Enter') return;
      e.preventDefault();
      let target = els.namebox.value.trim();
      if (definedNames[target]) target = definedNames[target].replace(/^=/, '').split('!').pop();
      const m = /^\$?([A-Za-z]{1,3})\$?([0-9]+)/.exec(target);
      if (m) {
        let col = 0; for (const ch of m[1].toUpperCase()) col = col * 26 + (ch.charCodeAt(0) - 64); col -= 1;
        grid.selectCell(Number(m[2]) - 1, col);
        grid.focus();
      } else refreshBar();
    });

    renderTabs();
    await loadActiveSheet();
    renderEmptyState();

    // e2e/test surface (read-state hooks; writes still go through the UI)
    window.__rk = {
      ready: true,
      version: VERSION,
      client,
      grid,
      editorActive: () => editor.active(),
      activeSheet: () => ({ ...activeSheet() }),
      sheets: () => sheets.map((s) => ({ ...s })),
      selection: () => grid.selection(),
      cellText: (r, c) => grid.cellText(r, c),
      barText: () => els.fx.value,
      nameBox: () => els.namebox.value,
      statusText: () => els.statusLeft.textContent,
      statsText: () => els.statusStats.textContent,
      filterStatusText: () => els.statusFilter.textContent,
      filterStatusDim: () => els.statusFilter.classList.contains('rk-dim'),
      hiddenRowCount: () => grid.hiddenRowCount(),
      isRowHidden: (ri) => grid.isRowHidden(ri),
      cellFormat: (a1) => client.getCellFormat(activeName(), a1),
      cellStyle: (r, c) => {
        const bag = grid.xs.sheet.data;
        const cell = bag.rows._[r]?.cells?.[c];
        if (!cell || cell.style === undefined) return null;
        return bag.styles[cell.style] ?? null;
      },
      openFind,
      openFilter,
      openNames,
      // charts (Batch K)
      charts: () => activeCharts.map((c) => JSON.parse(JSON.stringify(c))),
      chartCount: () => chartsLayer?.count() ?? 0,
      chartSvg: (id) => chartsLayer?.svgOf(id) ?? null,
      insertChart: (type) => insertChart(type),
      openChartSettings,
      refreshCharts,
      // conditional formatting (Batch L)
      openCondFormat,
      conditionalFormats: async () => (await client.getSheetMeta(activeId))?.conditionalFormats ?? [],
      setCondFormat: (rules) => commitCondFormat(rules),
      dataBarCount: () => grid.dataBarCount(),
      // data validation (Batch M)
      openDataValid,
      dataValidations: async () => (await client.getSheetMeta(activeId))?.dataValidations ?? [],
      setDataValid: (rules) => commitDataValid(rules),
      dvMarkerCount: () => grid.dvMarkerCount(),
      dvDropdownVisible: () => !!(dvDropdown && dvDropdown.hasList()),
      dvDropdownOpen: () => !!(dvDropdown && dvDropdown.isOpen()),
      dvOpenDropdown: () => dvDropdown?.open(),
      dvOptionCount: () => dvDropdown?.optionCount() ?? 0,
      dvChoose: (value) => commitDvChoice(value),
      // pivots (Batch N)
      openPivotBuilder,
      pivots: async () => (await client.getSheetMeta(activeId))?.pivots ?? [],
      setPivots: (pivots) => commitPivot(pivots),
      deletePivot,
      pivotCount: () => pivotsLayer?.count() ?? 0,
      pivotTableHtml: (id) => pivotsLayer?.tableHtml(id) ?? null,
      pivotResult: (def) => client.pivotResult(activeName(), def),
      refreshPivots,
      toolbarHook: (name, ...args) => toolbarHooks[name]?.(...args),
      flushSave: () => autosave?.flush(),
      // IO (Batch E) — drive imports/exports headlessly (bytes in/out, no picker)
      importCsvText,
      importXlsxBytes,
      exportCsv,
      exportXlsx,
      exportJson,
      exportBytes: ioBytes,
      lastImportNotes: () => lastImportNotes.slice(),
      // agent face (Batch F) test hooks: toggle the Developer setting + inspect
      setDevApi,
      devApiEnabled: () => devApi,
      hasReckon: () => typeof window.reckon !== 'undefined',
      openSettings,
      openHistory,
      // sidecar (Batch G) test hooks: inject a mock proposer at the transport
      // seam, inspect the staging slot + affordance, read the context slice.
      openAiSettings,
      setProposer: (p) => { mockProposer = p ? (typeof p === 'function' ? { rung: 'mock', label: 'mock', propose: p } : p) : null; sidecar?.refreshAffordance(); },
      getProposerRung: () => (getProposer()?.rung ?? null),
      sidecarOpen: () => !!sidecar?.isOpen(),
      sidecarPeek: () => sidecar?._peek() ?? null,
      aiHintDim: () => !!els.aiHint?.classList.contains('rk-dim'),
      sidecarContext: (opts) => gatherSidecarContext(opts || {}),
      explainActiveCell,
    };

    // Flush the debounced autosave when the tab is being hidden or torn down.
    // Autosave debounces 500ms after the LAST edit, so a standalone browser
    // close/navigate during active work would otherwise drop every transaction
    // since the user's last pause. visibilitychange->hidden fires early enough
    // for the async serialize+write to usually complete; pagehide is the backstop.
    // (NakliOS beforeClose below covers the hosted-close path.)
    const flushOnExit = () => { autosave?.flush().catch(() => {}); };
    document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden') flushOnExit(); });
    window.addEventListener('pagehide', flushOnExit);

    // NakliOS integration (Batch H): the cooperative host protocol. window.naklios
    // is the vendored inline SDK; every method no-ops when standalone
    // (window.parent === window), so this is inert outside Immersive mode. We
    // announce ready, keep the host window title in sync with the workbook, honour
    // the host theme's accent, and flush pending autosaves before the host closes
    // us (Reckon autosaves — a "Done" button is not appropriate for an always-open
    // workbench, so close() is not wired to a control; beforeClose covers a clean
    // exit). Same-origin postMessage only — CSP is unchanged.
    const nak = typeof window !== 'undefined' ? window.naklios : null;
    if (nak) {
      updateHostTitle = () => { try { nak.title(`Reckon — ${baseName()}`); } catch { /* host gone */ } };
      try {
        nak.theme.onChange((th) => {
          try {
            if (th && th.colors && th.colors.accent) document.documentElement.style.setProperty('--rk-accent', th.colors.accent);
            if (th && th.mood) document.documentElement.setAttribute('data-nakli-mood', th.mood);
          } catch { /* ignore a malformed theme */ }
        });
        nak.beforeClose(() => autosave?.flush().catch(() => {}));
        nak.ready();
        updateHostTitle();
      } catch { /* standalone / older host — stay inert */ }
    }

    // restore the Developer setting (window.reckon is off by default). In
    // ephemeral/e2e mode a ?devapi=1 param opts in without touching real storage.
    const savedDev = ephemeral ? (params.get('devapi') === '1') : (await kvGet('devApi'));
    if (savedDev) await setDevApi(true);
  };

  return { boot };
}

// single-file composition: register on the shared namespace
const NS9 = (globalThis.Reckon ||= {});
Object.assign(NS9, { createApp });
//__RK_INLINE_END ui/app.mjs

// ======================================================================
// Boot: compose the engine worker (classic blob — module blob workers are
// blocked on file://, probed 2026-08-26), then either the full app or the
// spine self-test (?selftest=1, used by `make e2e`'s spine smoke).
// ======================================================================
const RK = globalThis.Reckon;
const HF_URL = 'https://cdn.jsdelivr.net/npm/hyperformula@3.4.0/dist/hyperformula.full.min.js';
const params = new URLSearchParams(location.search);

const srcOf = (p) => {
  const el = document.getElementById('rk-src::' + p);
  const text = el.textContent;
  if (!text.trim()) throw new Error(`inline source block empty: ${p} (run scripts/inline-sync.mjs --write)`);
  return text;
};
// The spine modules register their exports on globalThis.Reckon, so their ESM
// export keywords are node-only sugar — stripped at compose time (a boot-time
// view of the same bytes, never a build step; inline-sync checks byte-identity).
const stripEsm = (src) => src.replace(/^export (?=(const|let|var|function|class)\b)/gm, '');

const bootWorker = () => {
  const workerSrc = ['core/schema.mjs', 'core/formats.mjs', 'ui/formula-lang.mjs', 'core/condfmt.mjs', 'core/datavalid.mjs', 'core/pivot.mjs', 'engine/adapter.mjs', 'core/transaction.mjs', 'engine/worker.mjs'].map((p) => stripEsm(srcOf(p))).join('\n;\n');
  const blobUrl = URL.createObjectURL(new Blob([workerSrc], { type: 'application/javascript' }));
  const worker = new Worker(blobUrl, { name: 'reckon-engine' });
  return RK.createWorkerClient(worker);
};

async function runSelfTest(rk) {
  document.getElementById('rk-app').remove();
  const box = document.createElement('main');
  box.id = 'rk-selftest';
  box.innerHTML = '<h1>Reckon <small></small></h1><p id="rk-st-status">running the spine self-test…</p><ul id="rk-st-results"></ul>';
  document.body.appendChild(box);
  const VERSION = document.querySelector('meta[name="reckon-version"]').content;
  box.querySelector('small').textContent = VERSION + ' — spine self-test';
  const resultsEl = box.querySelector('#rk-st-results');
  const statusEl = box.querySelector('#rk-st-status');
  const results = [];
  const add = (name, ok, detail = '') => {
    results.push({ name, ok, detail });
    const li = document.createElement('li');
    li.className = ok ? 'ok' : 'fail';
    li.textContent = name;
    if (detail) { const s = document.createElement('small'); s.textContent = detail; li.appendChild(s); }
    resultsEl.appendChild(li);
  };
  const eq = (got, exp) => JSON.stringify(got) === JSON.stringify(exp);

  // 1 — engine worker boots (all evaluation stays off the main thread)
  add('engine worker boots; formula evaluation isolated off the main thread', true);

  // 2 — applyTransaction through the worker, with parity-seam formulas
  await rk.applyTransaction({ actor: 'owner', origin: 'shell-selftest', ops: [{ op: 'setCells', sheet: 's1', cells: {
    A1: { v: 6 }, A2: { v: 7 },
    B1: { f: '=A1*A2' },
    C1: { f: '=INDIRECT("B1")+MOD(-3,2)' },
    D1: { f: '=TEXT(0.285,"0.0%")' },
    E1: { f: '=EDATE(DATE(2024,1,31),1)' },
  } }] });
  const b1 = await rk.getValue('Sheet1', 'B1');
  const c1 = await rk.getValue('Sheet1', 'C1');
  const d1 = await rk.getValue('Sheet1', 'D1');
  const e1 = await rk.getValue('Sheet1', 'E1');
  add('transaction applied; parity seam live (INDIRECT, MOD, TEXT, EDATE)',
    eq(b1, 42) && eq(c1, 43) && eq(d1, '28.5%') && eq(e1, 45351),
    `B1=${JSON.stringify(b1)} C1=${JSON.stringify(c1)} D1=${JSON.stringify(d1)} E1=${JSON.stringify(e1)}`);

  // 3 — structural op + undo/redo log walk
  await rk.applyTransaction({ actor: 'owner', origin: 'shell-selftest', ops: [{ op: 'insertRows', sheet: 's1', at: 1, n: 1 }] });
  const shifted = await rk.getFormula('Sheet1', 'B2');
  await rk.undo();
  const back = await rk.getFormula('Sheet1', 'B1');
  await rk.redo();
  const again = await rk.getFormula('Sheet1', 'B2');
  await rk.undo();
  add('structural op shifts refs; undo/redo is a log walk',
    shifted === '=A2*A3' && back === '=A1*A2' && again === '=A2*A3',
    `insert->${shifted} undo->${back} redo->${again}`);

  // 4 — log replay reconstructs the workbook on a fresh engine (in-worker)
  const replay = await rk.replayCheck();
  add('log replay from empty reconstructs the workbook', replay.ok === true);

  // 5 — storage façade ladder (FSA needs a user gesture, so the headless
  // ladder starts at OPFS), mirrored writes
  const facade = await RK.createCrateFacade({ backends: [
    RK.makeOpfsBackend('spine-selftest.reckon.json'),
    RK.makeIdbBackend({ db: 'reckon-spine-selftest' }),
    RK.makeMemoryBackend({ kind: 'memory' }),
  ] });
  const wbJson = JSON.stringify(await rk.serialize());
  await facade.save(new TextEncoder().encode(wbJson));
  const { bytes, from } = await facade.load();
  const roundTrip = bytes && new TextDecoder().decode(bytes) === wbJson;
  add(`storage façade save/load round-trips (primary: ${facade.primaryKind}, mirrors: ${facade.mirrorKinds.join('+') || 'none'})`,
    !!roundTrip, `loaded from ${from}, ${bytes ? bytes.length : 0} bytes, ${facade.status().lastError ? 'mirror errors: ' + facade.status().lastError : 'all mirrors clean'}`);

  // 6 — loading the persisted bytes passes the single ingress + engine reload
  const reload = await rk.loadWorkbook(JSON.parse(new TextDecoder().decode(bytes)));
  const b1r = await rk.getValue('Sheet1', 'B1');
  add('persisted workbook revalidates (validateWorkbook ingress) and recalcs on open', reload.ok === true && eq(b1r, 42), `B1=${JSON.stringify(b1r)} after reload`);

  const pass = results.every((r) => r.ok);
  statusEl.textContent = pass
    ? `spine self-test: ${results.length}/${results.length} passed — engine in worker, history live, storage mirrored`
    : 'spine self-test: FAILURES above';
  window.__spine = { ready: true, pass, results, version: VERSION };
}

async function main() {
  const rk = bootWorker();
  await rk.init(HF_URL);
  if (params.has('selftest')) {
    await runSelfTest(rk);
    return;
  }
  const app = RK.createApp({ client: rk, params });
  await app.boot();
}

main().catch((e) => {
  if (params.has('selftest')) {
    window.__spine = { ready: true, pass: false, error: String(e), results: [] };
  }
  window.__rk = { ready: false, error: String(e && e.stack || e) };
  const el = document.createElement('div');
  el.style.cssText = 'position:fixed;top:0;left:0;right:0;background:#a51d2d;color:#fff;padding:6px 12px;font:12px monospace;z-index:99';
  el.textContent = 'Reckon failed to boot: ' + String(e && e.message || e);
  document.body.appendChild(el);
  console.error(e);
});
</script>
