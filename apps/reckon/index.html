// naklios worker doctrine; worker.onerror is wired on the main side below.
const WEBGPU_WORKER_SRC = `
let TF = null, tok = null, model = null, loaded = null;
async function tf() { if (!TF) { TF = await import('https://cdn.jsdelivr.net/npm/@huggingface/transformers@4/+esm'); TF.env.allowLocalModels = false; TF.env.allowRemoteModels = true; } return TF; }
async function load(id, onp) {
  if (loaded === id && model) return;
  const { AutoTokenizer, AutoModelForCausalLM } = await tf();
  tok = await AutoTokenizer.from_pretrained(id, { progress_callback: onp });
  model = await AutoModelForCausalLM.from_pretrained(id, { dtype: 'q4f16', device: 'webgpu', progress_callback: onp });
  await model.generate({ ...tok('a'), max_new_tokens: 1 });
  loaded = id;
}
self.onmessage = async (e) => {
  const { id, type, modelId, messages } = e.data;
  try {
    if (type === 'load') { await load(modelId, (p) => self.postMessage({ type: 'progress', data: p })); self.postMessage({ id, type: 'loaded' }); return; }
    if (type === 'generate') {
      await load(modelId, (p) => self.postMessage({ type: 'progress', data: p }));
      const inputs = tok.apply_chat_template(messages, { add_generation_prompt: true, return_dict: true });
      const out = await model.generate({ ...inputs, max_new_tokens: 256, do_sample: false });
      const gen = out.slice ? out.slice(null, [inputs.input_ids.dims.at(-1), null]) : out;
      const text = tok.batch_decode(gen, { skip_special_tokens: true });
      self.postMessage({ id, type: 'result', text: Array.isArray(text) ? text[0] : String(text) });
    }
  } catch (err) { self.postMessage({ id, type: 'error', error: String(err && err.message || err) }); }
};
`;
export function webgpuProposer({ modelId, onProgress }) {
  let worker = null; let seq = 0; const pending = new Map();
  const ensure = () => {
    if (worker) return worker;
    const blobUrl = URL.createObjectURL(new Blob([WEBGPU_WORKER_SRC], { type: 'application/javascript' }));
    worker = new Worker(blobUrl, { type: 'module', name: 'reckon-sidecar' });
    // worker.onerror is non-negotiable (naklios CLAUDE.md): a module blob worker
    // fails completely silently otherwise.
    worker.addEventListener('error', (ev) => { for (const [, p] of pending) p.reject(new Error(`sidecar worker error: ${ev.message || 'load failed'}`)); pending.clear(); });
    worker.addEventListener('message', (ev) => {
      const m = ev.data;
      if (m.type === 'progress') { onProgress?.(m.data); return; }
      const p = pending.get(m.id); if (!p) return; pending.delete(m.id);
      if (m.type === 'error') p.reject(new Error(m.error)); else p.resolve(m);
    });
    return worker;
  };
  const call = (type, extra) => new Promise((resolve, reject) => { const id = ++seq; pending.set(id, { resolve, reject }); ensure().postMessage({ id, type, modelId, ...extra }); });
  return {
    rung: 'webgpu', label: `on-device · ${modelId.split('/').pop()}`,
    warmup: () => call('load', {}),
    async propose({ messages }) { const r = await call('generate', { messages }); return r.text ?? ''; },
    dispose() { try { worker && worker.terminate(); } catch { /* already gone */ } worker = null; },
  };
}

// ---------- BYOK key store (IndexedDB; never leaves the device except to the
// user's own provider) ----------
const KEY_DB = 'reckon-sidecar';
const openKeyDb = () => new Promise((res, rej) => {
  const req = indexedDB.open(KEY_DB, 1);
  req.onupgradeneeded = () => req.result.createObjectStore('kv');
  req.onsuccess = () => res(req.result);
  req.onerror = () => rej(req.error);
});
export async function saveByok(cfg) {
  try { const db = await openKeyDb(); await new Promise((res, rej) => { const t = db.transaction('kv', 'readwrite').objectStore('kv').put(cfg, 'byok'); t.onsuccess = () => { res(); db.close(); }; t.onerror = () => { rej(t.error); db.close(); }; }); } catch { /* best effort */ }
}
export async function loadByok() {
  try { const db = await openKeyDb(); return await new Promise((res, rej) => { const t = db.transaction('kv', 'readonly').objectStore('kv').get('byok'); t.onsuccess = () => { res(t.result || null); db.close(); }; t.onerror = () => { rej(t.error); db.close(); }; }); } catch { return null; }
}
export async function clearByok() {
  try { const db = await openKeyDb(); await new Promise((res, rej) => { const t = db.transaction('kv', 'readwrite').objectStore('kv').delete('byok'); t.onsuccess = () => { res(); db.close(); }; t.onerror = () => { rej(t.error); db.close(); }; }); } catch { /* best effort */ }
}

// ---------- the DOM controller: staging slot + explain panel + affordance ----------
export function createSidecar(deps) {
  const {
    slotEl,          // container beneath the formula bar (empty; we build inside)
    hintEl,          // the small "=? ask" affordance (dims when no model)
    evalFormula,     // (formula) -> Promise<value | { error }>   (NO commit)
    gatherContext,   // ({ targetA1, formula }) -> Promise<{ slice, summary }>
    onAccept,        // (formula, targetA1) -> Promise<void>       (commit as owner)
    onClosed = () => {}, // return focus to the grid
    getProposer,     // () -> proposer | null   (highest available ladder rung)
    openAiSettings = () => {}, // link target when no model
  } = deps;

  const RK = globalThis.Reckon;
  const T = (k) => RK.t(k); // i18n (default en; unchanged for tests booting without ?lang)
  const esc = (s) => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  let state = null; // { targetA1, description, formula, proposer } | null
  let onKeyDoc = null;

  const close = () => {
    slotEl.hidden = true;
    slotEl.innerHTML = '';
    state = null;
    if (onKeyDoc) { document.removeEventListener('keydown', onKeyDoc, true); onKeyDoc = null; }
    onClosed();
  };

  const armDocKeys = () => {
    if (onKeyDoc) return;
    onKeyDoc = (e) => {
      if (slotEl.hidden) return;
      if (e.key === 'Escape') { e.preventDefault(); e.stopPropagation(); close(); }
    };
    document.addEventListener('keydown', onKeyDoc, true);
  };

  // Review state: description shown/editable + an explicit Send button whose
  // hover reveals exactly "what will be sent". NO network yet — Send is the
  // explicit user action that touches the wire.
  const showReview = async ({ targetA1, description, editable }) => {
    const proposer = getProposer();
    slotEl.hidden = false;
    armDocKeys();
    if (!proposer) { showUnavailable(); return; }
    const { summary } = await gatherContext({ targetA1 });
    slotEl.innerHTML = '';
    const row = document.createElement('div'); row.className = 'rk-sc-row';
    const badge = document.createElement('span'); badge.className = 'rk-sc-badge'; badge.textContent = rungLabel(proposer.rung);
    const label = document.createElement('span'); label.className = 'rk-sc-label'; label.textContent = '=?';
    const input = document.createElement('input');
    input.type = 'text'; input.className = 'rk-sc-input'; input.spellcheck = false; input.value = description || '';
    input.setAttribute('aria-label', T('sc.describeAria'));
    input.placeholder = T('sc.describe');
    input.readOnly = !editable && !!description; // typed `=?` path arrives with a description; still editable so the user can refine
    input.readOnly = false;
    const send = document.createElement('button');
    send.type = 'button'; send.className = 'rk-btn rk-btn-primary rk-sc-send'; send.textContent = T('sc.send');
    // "what will be sent" on hover of the send button (§7)
    const wws = document.createElement('div'); wws.className = 'rk-sc-wws'; wws.hidden = true;
    wws.setAttribute('role', 'tooltip');
    wws.textContent = summary;
    send.setAttribute('aria-describedby', 'rk-sc-wws');
    wws.id = 'rk-sc-wws';
    const showWws = () => { wws.hidden = false; }; const hideWws = () => { wws.hidden = true; };
    send.addEventListener('mouseenter', showWws); send.addEventListener('mouseleave', hideWws);
    send.addEventListener('focus', showWws); send.addEventListener('blur', hideWws);
    const cancel = document.createElement('button'); cancel.type = 'button'; cancel.className = 'rk-btn rk-sc-cancel'; cancel.textContent = T('btn.cancel');
    row.append(label, badge, input, send, cancel);
    slotEl.append(row, wws);
    const dispatch = () => { const d = input.value.trim(); if (!d) { input.focus(); return; } runPropose({ targetA1, description: d, proposer }); };
    send.addEventListener('click', dispatch);
    cancel.addEventListener('click', () => { close(); });
    input.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') { e.preventDefault(); dispatch(); }
      else if (e.key === 'Escape') { e.preventDefault(); close(); }
      e.stopPropagation();
    });
    // typed-`=?` path: description already present -> focus Send so Enter fires
    // it and the user sees "what will be sent"; Ctrl+Shift+F path -> focus input
    if (description) send.focus(); else input.focus();
  };

  const showUnavailable = () => {
    slotEl.innerHTML = '';
    const row = document.createElement('div'); row.className = 'rk-sc-row rk-sc-unavail';
    const label = document.createElement('span'); label.className = 'rk-sc-label'; label.textContent = '=?';
    const msg = document.createElement('span'); msg.className = 'rk-sc-msg'; msg.textContent = T('sc.unavailable');
    const settings = document.createElement('button'); settings.type = 'button'; settings.className = 'rk-btn rk-sc-settings'; settings.textContent = T('set.aiSettings');
    settings.addEventListener('click', () => { close(); openAiSettings(); });
    const cancel = document.createElement('button'); cancel.type = 'button'; cancel.className = 'rk-btn rk-sc-cancel'; cancel.textContent = T('btn.close');
    cancel.addEventListener('click', () => close());
    row.append(label, msg, settings, cancel);
    slotEl.append(row);
    settings.focus();
  };

  const runPropose = async ({ targetA1, description, proposer }) => {
    slotEl.innerHTML = '';
    const row = document.createElement('div'); row.className = 'rk-sc-row rk-sc-thinking';
    row.innerHTML = `<span class="rk-sc-label">=?</span><span class="rk-sc-msg">asking ${esc(rungLabel(proposer.rung))}…</span>`;
    slotEl.append(row);
    let formula = '';
    try {
      const { slice } = await gatherContext({ targetA1 });
      const reply = await proposer.propose({ kind: 'formula', messages: buildFormulaMessages(description, slice) });
      formula = extractFormula(reply);
    } catch (e) { showProposeError(String(e && e.message || e), { targetA1, description, proposer }); return; }
    if (!formula) { showProposeError('the model returned nothing usable', { targetA1, description, proposer }); return; }
    // pre-evaluate WITHOUT committing (the loud-failure surface)
    let evalOut;
    try { evalOut = await evalFormula(formula); } catch (e) { evalOut = { error: String(e && e.message || e) }; }
    state = { targetA1, description, formula, proposer };
    showProposal(evalOut);
  };

  const showProposeError = (message, retryCtx) => {
    slotEl.innerHTML = '';
    const row = document.createElement('div'); row.className = 'rk-sc-row rk-sc-fail';
    const label = document.createElement('span'); label.className = 'rk-sc-label'; label.textContent = '=?';
    const msg = document.createElement('span'); msg.className = 'rk-sc-msg rk-sc-err'; msg.textContent = message;
    const retry = document.createElement('button'); retry.type = 'button'; retry.className = 'rk-btn rk-sc-retry'; retry.textContent = T('sc.tryAgain');
    retry.addEventListener('click', () => runPropose(retryCtx));
    const cancel = document.createElement('button'); cancel.type = 'button'; cancel.className = 'rk-btn rk-sc-cancel'; cancel.textContent = T('sc.discardShort');
    cancel.addEventListener('click', () => close());
    row.append(label, msg, retry, cancel);
    slotEl.append(row);
    retry.focus();
  };

  const showProposal = (evalOut) => {
    const isErr = evalOut && typeof evalOut === 'object' && ('error' in evalOut || evalOut.err);
    const errText = isErr ? (evalOut.error || evalOut.err) : null;
    slotEl.innerHTML = '';
    const row = document.createElement('div'); row.className = 'rk-sc-row rk-sc-proposed';
    const label = document.createElement('span'); label.className = 'rk-sc-label'; label.textContent = '=?';
    const formulaEl = document.createElement('code'); formulaEl.className = 'rk-sc-formula'; formulaEl.textContent = state.formula;
    const arrow = document.createElement('span'); arrow.className = 'rk-sc-arrow'; arrow.textContent = '→';
    const result = document.createElement('span');
    result.className = 'rk-sc-result' + (isErr ? ' rk-sc-err' : '');
    result.textContent = isErr ? String(errText) : formatPreview(evalOut);
    const accept = document.createElement('button'); accept.type = 'button'; accept.className = 'rk-btn rk-btn-primary rk-sc-accept'; accept.textContent = T('sc.accept');
    accept.disabled = isErr;
    const discard = document.createElement('button'); discard.type = 'button'; discard.className = 'rk-btn rk-sc-discard'; discard.textContent = T('sc.discard');
    accept.addEventListener('click', doAccept);
    discard.addEventListener('click', () => close());
    row.append(label, formulaEl, arrow, result, accept, discard);
    slotEl.append(row);
    // Enter accepts (only when the formula is valid); Esc discards. Bound at the
    // row so focus on Accept/Discard both work; the document Esc handler covers
    // the rest.
    row.tabIndex = -1;
    row.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !isErr) { e.preventDefault(); doAccept(); }
      else if (e.key === 'Escape') { e.preventDefault(); close(); }
    });
    (isErr ? discard : accept).focus();
  };

  const formatPreview = (v) => {
    if (v === null || v === undefined) return '(empty)';
    if (typeof v === 'object') return JSON.stringify(v);
    return String(v);
  };

  const doAccept = async () => {
    if (!state || !state.formula) return;
    const { formula, targetA1 } = state;
    close();
    await onAccept(formula, targetA1); // owner transaction
  };

  // ---------- explain-formula side panel ----------
  const explain = async ({ targetA1, formula }) => {
    const proposer = getProposer();
    if (!proposer) { openExplainPanel(T('sc.explainUnavail'), { unavailable: true }); return; }
    openExplainPanel(`Asking ${rungLabel(proposer.rung)} to explain…`, { pending: true });
    try {
      const { slice } = await gatherContext({ targetA1, formula });
      const reply = await proposer.propose({ kind: 'explain', messages: buildExplainMessages(formula, slice) });
      openExplainPanel(reply.trim() || '(the model returned nothing)', { formula });
    } catch (e) { openExplainPanel(`Could not explain: ${String(e && e.message || e)}`, { error: true }); }
  };

  let panelClose = null;
  const openExplainPanel = (text, meta = {}) => {
    if (panelClose) panelClose();
    const aside = document.createElement('aside');
    aside.className = 'rk-explain'; aside.setAttribute('role', 'dialog'); aside.setAttribute('aria-label', 'Explain formula');
    const head = document.createElement('div'); head.className = 'rk-explain-head';
    const title = document.createElement('span'); title.className = 'rk-explain-title'; title.textContent = T('sc.explainTitle');
    const x = document.createElement('button'); x.type = 'button'; x.className = 'rk-explain-x'; x.setAttribute('aria-label', T('btn.close')); x.textContent = '×';
    head.append(title, x);
    if (meta.formula) { const f = document.createElement('code'); f.className = 'rk-explain-formula'; f.textContent = meta.formula; head.append(f); }
    const bodyEl = document.createElement('div'); bodyEl.className = 'rk-explain-body' + (meta.error ? ' rk-sc-err' : ''); bodyEl.textContent = text;
    aside.append(head, bodyEl);
    document.body.appendChild(aside);
    const onKey = (e) => { if (e.key === 'Escape') { e.stopPropagation(); panelClose?.(); } };
    aside.addEventListener('keydown', onKey);
    x.addEventListener('click', () => panelClose?.());
    panelClose = () => { aside.remove(); panelClose = null; onClosed(); };
    x.focus();
  };

  // affordance: dim (never hide) when no model is available
  const refreshAffordance = () => {
    if (!hintEl) return;
    const available = !!getProposer();
    hintEl.classList.toggle('rk-dim', !available);
    hintEl.title = available ? T('sc.hintAvailable') : T('sc.unavailable');
    // a11y §8: reflect the dim (no-model) condition as an accessible state, not
    // colour alone. The button stays reachable (dim, never hidden) but announces
    // itself unavailable so a screen reader conveys what the muted colour does.
    hintEl.setAttribute('aria-disabled', available ? 'false' : 'true');
    hintEl.setAttribute('aria-label', available ? T('sc.aiDraft') : T('sc.aiDraftUnavail'));
  };

  return {
    // Feature 1: formula-from-description. `description` present => typed `=?`
    // path; absent => Ctrl/Cmd+Shift+F opens an empty prompt.
    request: ({ targetA1, description = '' }) => showReview({ targetA1, description, editable: !description }),
    // Feature 2: explain the active formula cell
    explain,
    refreshAffordance,
    close,
    isOpen: () => !slotEl.hidden || !!panelClose,
    // test/introspection surface
    _peek: () => (state ? { ...state, proposer: state.proposer?.rung } : null),
  };
}

  buildFormulaMessages, buildExplainMessages, extractFormula,
  probeBridge, bridgeProposer, byokProposer, webgpuProposer, webgpuSupported,

//__RK_INLINE_BEGIN ui/charts.mjs
// Reckon — chart overlay layer (Batch K). Floating, movable + resizable chart
// objects drawn over the grid. Rendering is the hand-rolled SVG engine
// (core/chart-model.mjs); this module owns the DOM: a pointer-eventless layer
// pinned over #rk-grid, one focusable box per chart, drag-to-move and
// drag-to-resize that commit ONE transaction on release (the app turns the
// callback into a chartUpdate — undo covers a whole drag), and Enter/⚙ to open
// the settings panel. No native dialogs; honours prefers-reduced-motion (the
// boxes carry no animation).
//
// Module contract (single-file doctrine): no imports; uses globalThis.Reckon;
// registers on globalThis.Reckon.

export function createChartsLayer({ mount, onMove, onResize, onOpenSettings, getAccent, onUndo, onRedo } = {}) {
  const RK = globalThis.Reckon;
  const HEAD_H = 20;
  const MIN_W = 140;
  const MIN_H = 100;

  const layer = document.createElement('div');
  layer.className = 'rk-chart-layer';
  layer.setAttribute('aria-hidden', 'false');
  mount.appendChild(layer);

  const boxes = new Map(); // id -> { el, chart }

  const clampPos = (x, y, w, h) => {
    const cw = mount.clientWidth || w;
    const ch = mount.clientHeight || h;
    return {
      x: Math.max(0, Math.min(x, Math.max(0, cw - Math.min(w, cw)))),
      y: Math.max(0, Math.min(y, Math.max(0, ch - Math.min(h, ch)))),
    };
  };

  const buildBox = (chart, values, locale) => {
    const el = document.createElement('div');
    el.className = 'rk-chart';
    el.dataset.id = chart.id;
    el.tabIndex = 0;
    el.setAttribute('role', 'group');

    const head = document.createElement('div');
    head.className = 'rk-chart-head';
    const titleEl = document.createElement('span');
    titleEl.className = 'rk-chart-title';
    const edit = document.createElement('button');
    edit.type = 'button';
    edit.className = 'rk-chart-edit';
    edit.textContent = '⚙';
    edit.setAttribute('aria-label', 'Chart settings');
    edit.addEventListener('mousedown', (e) => e.stopPropagation());
    edit.addEventListener('click', (e) => { e.stopPropagation(); onOpenSettings?.(chart.id); });
    head.append(titleEl, edit);

    const body = document.createElement('div');
    body.className = 'rk-chart-body';

    const resize = document.createElement('div');
    resize.className = 'rk-chart-resize';
    resize.setAttribute('aria-hidden', 'true');

    el.append(head, body, resize);

    // drag-to-move (from the header)
    head.addEventListener('pointerdown', (ev) => startDrag(ev, chart.id, 'move'));
    // drag-to-resize (from the corner)
    resize.addEventListener('pointerdown', (ev) => startDrag(ev, chart.id, 'resize'));

    el.addEventListener('keydown', (ev) => {
      const mod = ev.metaKey || ev.ctrlKey;
      if (ev.key === 'Enter' || ev.key === ' ') { ev.preventDefault(); ev.stopPropagation(); onOpenSettings?.(chart.id); }
      else if (ev.key === 'Escape') { el.blur(); }
      // undo/redo reach here even when a chart box holds focus (e.g. right after
      // a drag) so ⌘/Ctrl+Z behaves as the user expects
      else if (mod && (ev.key === 'z' || ev.key === 'Z')) { ev.preventDefault(); ev.stopPropagation(); (ev.shiftKey ? onRedo : onUndo)?.(); }
      else if (mod && (ev.key === 'y' || ev.key === 'Y')) { ev.preventDefault(); ev.stopPropagation(); onRedo?.(); }
    });

    layer.appendChild(el);
    const rec = { el, head, titleEl, body, chart, values, locale };
    boxes.set(chart.id, rec);
    paint(rec);
    return rec;
  };

  const paint = (rec) => {
    const { el, titleEl, body, chart } = rec;
    const pos = chart.pos || { x: 0, y: 0 };
    const size = chart.size || { w: 360, h: 240 };
    el.style.left = `${pos.x}px`;
    el.style.top = `${pos.y}px`;
    el.style.width = `${size.w}px`;
    el.style.height = `${size.h}px`;
    titleEl.textContent = chart.title || `${chart.type} chart`;
    const svgSize = { w: size.w, h: Math.max(40, size.h - HEAD_H) };
    const svg = RK.buildChartSvg({ ...chart, size: svgSize }, rec.values, { locale: rec.locale, accent: getAccent ? getAccent() : undefined, hideTitle: true });
    body.innerHTML = svg;
    el.setAttribute('aria-label', RK.chartSummary(chart, RK.readSeries(chart, rec.values)));
  };

  // ---- pointer drag (move + resize); one commit on release ----
  // Window-level move/up listeners (rather than pointer capture) so a drag that
  // strays outside the box — or a headless-driven pointer — still tracks.
  let drag = null;
  const startDrag = (ev, id, kind) => {
    const rec = boxes.get(id);
    if (!rec) return;
    ev.preventDefault();
    ev.stopPropagation();
    rec.el.focus();
    const size = rec.chart.size || { w: 360, h: 240 };
    const pos = rec.chart.pos || { x: 0, y: 0 };
    drag = { id, kind, startX: ev.clientX, startY: ev.clientY, origPos: { ...pos }, origSize: { ...size }, moved: false };
    window.addEventListener('pointermove', onDragMove, true);
    window.addEventListener('pointerup', onDragEnd, true);
    rec.el.classList.add('rk-chart-dragging');
  };
  const onDragMove = (ev) => {
    if (!drag) return;
    const rec = boxes.get(drag.id);
    if (!rec) return;
    const dx = ev.clientX - drag.startX;
    const dy = ev.clientY - drag.startY;
    if (Math.abs(dx) > 2 || Math.abs(dy) > 2) drag.moved = true;
    if (drag.kind === 'move') {
      const p = clampPos(drag.origPos.x + dx, drag.origPos.y + dy, drag.origSize.w, drag.origSize.h);
      rec.el.style.left = `${p.x}px`;
      rec.el.style.top = `${p.y}px`;
      drag.live = { pos: p };
    } else {
      const w = Math.max(MIN_W, Math.min(4000, drag.origSize.w + dx));
      const h = Math.max(MIN_H, Math.min(4000, drag.origSize.h + dy));
      rec.el.style.width = `${w}px`;
      rec.el.style.height = `${h}px`;
      // live re-render at the new size so the chart reflows during resize
      rec.chart = { ...rec.chart, size: { w, h } };
      paint(rec);
      drag.live = { size: { w, h } };
    }
  };
  const onDragEnd = () => {
    if (!drag) return;
    const rec = boxes.get(drag.id);
    const d = drag;
    drag = null;
    window.removeEventListener('pointermove', onDragMove, true);
    window.removeEventListener('pointerup', onDragEnd, true);
    if (rec) rec.el.classList.remove('rk-chart-dragging');
    if (!d.moved) return; // a click, not a drag
    if (d.kind === 'move' && d.live?.pos) onMove?.(d.id, d.live.pos);
    else if (d.kind === 'resize' && d.live?.size) onResize?.(d.id, d.live.size);
  };

  return {
    el: layer,
    // render the full set for the active sheet: charts with their fetched values
    setCharts(list) {
      const keep = new Set(list.map((c) => c.chart.id));

export function createCondFormatPanel({ showDialog, commit, getRules, getSelectionRange, sheetLabel, toast } = {}) {

  const RK = globalThis.Reckon;
  const t = (k, f) => (RK.t ? RK.t(k) : f);
  const newId = () => `cf${Date.now().toString(36)}${Math.floor(Math.random() * 1000)}`;

  const OP_LABELS = () => ([
    ['gt', t('cf.op.gt', 'greater than')], ['lt', t('cf.op.lt', 'less than')],
    ['ge', t('cf.op.ge', '≥')], ['le', t('cf.op.le', '≤')],
    ['eq', t('cf.op.eq', 'equal to')], ['ne', t('cf.op.ne', 'not equal to')],
    ['between', t('cf.op.between', 'between')], ['notBetween', t('cf.op.notBetween', 'not between')],
    ['contains', t('cf.op.contains', 'text contains')], ['notContains', t('cf.op.notContains', 'text does not contain')],
    ['beginsWith', t('cf.op.beginsWith', 'begins with')], ['endsWith', t('cf.op.endsWith', 'ends with')],
    ['duplicate', t('cf.op.duplicate', 'duplicate values')], ['unique', t('cf.op.unique', 'unique values')],
    ['top', t('cf.op.top', 'top N')], ['bottom', t('cf.op.bottom', 'bottom N')],
    ['aboveAvg', t('cf.op.aboveAvg', 'above average')], ['belowAvg', t('cf.op.belowAvg', 'below average')],
    ['blank', t('cf.op.blank', 'is blank')], ['notBlank', t('cf.op.notBlank', 'is not blank')],
  ]);
  const NO_OPERAND = new Set(['duplicate', 'unique', 'aboveAvg', 'belowAvg', 'blank', 'notBlank']);
  const TWO_OPERAND = new Set(['between', 'notBetween']);
  const N_OPERAND = new Set(['top', 'bottom']);

  // format presets: fills (bg+fg) then text (fg+bold); id -> {bg,fg,bold}
  const FILL = RK.CF_FILL_PRESETS || [];
  const TEXT = RK.CF_TEXT_PRESETS || [];
  const formatOfPreset = (pid) => {
    const f = FILL.find((p) => p.id === pid);
    if (f) return { bg: f.bg, fg: f.fg, bold: false };
    const tx = TEXT.find((p) => p.id === pid);
    if (tx) return { bg: null, fg: tx.fg, bold: !!tx.bold };
    return { bg: FILL[0]?.bg ?? '#f8d7da', fg: FILL[0]?.fg ?? '#842029', bold: false };
  };
  const presetOfFormat = (fmt) => {
    if (!fmt) return FILL[0]?.id ?? null;
    if (fmt.bg) return (FILL.find((p) => p.bg === fmt.bg)?.id) ?? FILL[0]?.id ?? null;
    if (fmt.fg) return (TEXT.find((p) => p.fg === fmt.fg)?.id) ?? TEXT[0]?.id ?? null;
    return FILL[0]?.id ?? null;
  };
  const SCALES = RK.CF_SCALE_PRESETS || [];
  const BARS = RK.CF_BAR_PRESETS || [];

  const summarize = (rule) => {
    const ops = Object.fromEntries(OP_LABELS());
    if (rule.type === 'cellValue') {
      let s = ops[rule.op] || rule.op;
      if (N_OPERAND.has(rule.op)) s += ` ${rule.v1 ?? ''}`;
      else if (TWO_OPERAND.has(rule.op)) s += ` ${rule.v1 ?? ''}–${rule.v2 ?? ''}`;
      else if (!NO_OPERAND.has(rule.op)) s += ` ${rule.v1 ?? ''}`;
      return `${t('cf.type.cellValue', 'Cell value')}: ${s}`;
    }
    if (rule.type === 'colorScale') return t('cf.type.colorScale', 'Colour scale');
    if (rule.type === 'dataBar') return t('cf.type.dataBar', 'Data bar');
    if (rule.type === 'formula') return `${t('cf.type.formula', 'Formula')}: ${rule.formula}`;

  const swatch = (bg, fg, cls = '') => {

    return s;
  };

  const open = () => {
    let rules = (getRules() || []).map((r) => JSON.parse(JSON.stringify(r)));
    let editingId = null; // id being edited, or null for a new rule

    const body = document.createElement('div');
    body.className = 'rk-cf';

    const sub = document.createElement('div');
    sub.className = 'rk-cf-sheet';
    sub.textContent = sheetLabel ? sheetLabel() : '';
    body.appendChild(sub);

    const listEl = document.createElement('div');
    listEl.className = 'rk-cf-list';
    body.appendChild(listEl);

    // ---- editor form ----
    const form = document.createElement('div');
    form.className = 'rk-cf-form';
    body.appendChild(form);

    const field = (labelText, control) => {
      const row = document.createElement('label');
      row.className = 'rk-cf-row';
      const span = document.createElement('span');
      span.className = 'rk-cf-label';
      span.textContent = labelText;
      row.append(span, control);
      form.appendChild(row);
      return row;
    };

    const typeSel = document.createElement('select');
    for (const [v, lab] of [['cellValue', t('cf.type.cellValue', 'Cell value')], ['colorScale', t('cf.type.colorScale', 'Colour scale')], ['dataBar', t('cf.type.dataBar', 'Data bar')], ['formula', t('cf.type.formula', 'Formula')]]) {
      const o = document.createElement('option'); o.value = v; o.textContent = lab; typeSel.appendChild(o);
    }
    field(t('cf.field.type', 'Type'), typeSel);

    const rangeIn = document.createElement('input');
    rangeIn.type = 'text'; rangeIn.spellcheck = false; rangeIn.autocomplete = 'off';
    field(t('cf.field.range', 'Apply to range'), rangeIn);

    // cellValue controls
    const opSel = document.createElement('select');
    for (const [v, lab] of OP_LABELS()) { const o = document.createElement('option'); o.value = v; o.textContent = lab; opSel.appendChild(o); }
    const opRow = field(t('cf.field.condition', 'Condition'), opSel);
    const v1In = document.createElement('input'); v1In.type = 'text'; v1In.autocomplete = 'off'; v1In.className = 'rk-cf-operand';
    const v1Row = field(t('cf.field.value', 'Value'), v1In);
    const v2In = document.createElement('input'); v2In.type = 'text'; v2In.autocomplete = 'off'; v2In.className = 'rk-cf-operand';
    const v2Row = field(t('cf.field.value2', 'and'), v2In);

    // formula control
    const formulaIn = document.createElement('input'); formulaIn.type = 'text'; formulaIn.spellcheck = false; formulaIn.autocomplete = 'off'; formulaIn.placeholder = '=A1>10';
    const formulaRow = field(t('cf.field.formula', 'Formula (for the first cell)'), formulaIn);

    // format preset picker (cellValue + formula)
    const fmtPick = document.createElement('div'); fmtPick.className = 'rk-cf-presets';
    let selFormatId = FILL[0]?.id ?? null;
    const renderFmtPick = () => {
      fmtPick.textContent = '';
      const add = (id, node) => {
        const b = document.createElement('button'); b.type = 'button'; b.className = 'rk-cf-preset' + (id === selFormatId ? ' active' : '');
        b.appendChild(node); b.title = id;
        b.addEventListener('mousedown', (e) => e.preventDefault());
        b.addEventListener('click', () => { selFormatId = id; renderFmtPick(); });
        fmtPick.appendChild(b);
      };
      for (const p of FILL) add(p.id, swatch(p.bg, p.fg));
      for (const p of TEXT) add(p.id, swatch(null, p.fg));
    };
    const fmtRow = field(t('cf.field.format', 'Format'), fmtPick);

    // colour-scale preset picker
    const scalePick = document.createElement('div'); scalePick.className = 'rk-cf-presets';
    let selScaleId = SCALES[0]?.id ?? null;
    const renderScalePick = () => {
      scalePick.textContent = '';
      for (const p of SCALES) {
        const b = document.createElement('button'); b.type = 'button'; b.className = 'rk-cf-preset' + (p.id === selScaleId ? ' active' : ''); b.title = p.label;
        const g = document.createElement('span'); g.className = 'rk-cf-swatch';
        g.style.background = p.mid ? `linear-gradient(90deg, ${p.min}, ${p.mid}, ${p.max})` : `linear-gradient(90deg, ${p.min}, ${p.max})`;
        b.appendChild(g);
        b.addEventListener('mousedown', (e) => e.preventDefault());
        b.addEventListener('click', () => { selScaleId = p.id; renderScalePick(); });
        scalePick.appendChild(b);
      }
    };
    const scaleRow = field(t('cf.field.scale', 'Colours'), scalePick);

    // data-bar preset picker
    const barPick = document.createElement('div'); barPick.className = 'rk-cf-presets';
    let selBarId = BARS[0]?.id ?? null;
    const renderBarPick = () => {
      barPick.textContent = '';
      for (const p of BARS) {
        const b = document.createElement('button'); b.type = 'button'; b.className = 'rk-cf-preset' + (p.id === selBarId ? ' active' : ''); b.title = p.id;
        b.appendChild(swatch(p.color, null));
        b.addEventListener('mousedown', (e) => e.preventDefault());
        b.addEventListener('click', () => { selBarId = p.id; renderBarPick(); });
        barPick.appendChild(b);
      }
    };
    const barRow = field(t('cf.field.barColour', 'Bar colour'), barPick);

    const addBtn = document.createElement('button');
    addBtn.type = 'button'; addBtn.className = 'rk-btn rk-btn-primary rk-cf-add';
    form.appendChild(addBtn);

    const syncFormVisibility = () => {
      const ty = typeSel.value;
      const op = opSel.value;
      opRow.style.display = ty === 'cellValue' ? '' : 'none';
      v1Row.style.display = ty === 'cellValue' && !NO_OPERAND.has(op) ? '' : 'none';
      v2Row.style.display = ty === 'cellValue' && TWO_OPERAND.has(op) ? '' : 'none';
      v1Row.querySelector('.rk-cf-label').textContent = N_OPERAND.has(op) ? t('cf.field.count', 'How many') : t('cf.field.value', 'Value');
      formulaRow.style.display = ty === 'formula' ? '' : 'none';
      fmtRow.style.display = (ty === 'cellValue' || ty === 'formula') ? '' : 'none';
      scaleRow.style.display = ty === 'colorScale' ? '' : 'none';
      barRow.style.display = ty === 'dataBar' ? '' : 'none';
      addBtn.textContent = editingId ? t('cf.update', 'Update rule') : t('cf.add', 'Add rule');
    };
    typeSel.addEventListener('change', syncFormVisibility);
    opSel.addEventListener('change', syncFormVisibility);

    const resetForm = () => {
      editingId = null;
      typeSel.value = 'cellValue'; opSel.value = 'gt';
      rangeIn.value = getSelectionRange ? getSelectionRange() : '';
      v1In.value = ''; v2In.value = ''; formulaIn.value = '';
      selFormatId = FILL[0]?.id ?? null; selScaleId = SCALES[0]?.id ?? null; selBarId = BARS[0]?.id ?? null;
      renderFmtPick(); renderScalePick(); renderBarPick();
      syncFormVisibility();
    };

    const loadForEdit = (rule) => {
      editingId = rule.id;
      typeSel.value = rule.type;
      rangeIn.value = rule.range;
      if (rule.type === 'cellValue') {
        opSel.value = rule.op;
        v1In.value = rule.v1 == null ? '' : String(rule.v1);
        v2In.value = rule.v2 == null ? '' : String(rule.v2);
        selFormatId = presetOfFormat(rule.format);
      } else if (rule.type === 'formula') {
        formulaIn.value = rule.formula;
        selFormatId = presetOfFormat(rule.format);
      } else if (rule.type === 'colorScale') {
        const m = SCALES.find((p) => p.min === rule.scale.min && p.max === rule.scale.max && (p.mid ?? null) === (rule.scale.mid ?? null));
        selScaleId = m ? m.id : (SCALES[0]?.id ?? null);
      } else if (rule.type === 'dataBar') {
        const m = BARS.find((p) => p.color === rule.bar.color);
        selBarId = m ? m.id : (BARS[0]?.id ?? null);
      }
      renderFmtPick(); renderScalePick(); renderBarPick();
      syncFormVisibility();
      rangeIn.focus();
    };

    const typedOperand = (s) => {
      const tr = s.trim();
      if (tr === '') return null;
      const n = Number(tr);
      return Number.isFinite(n) && tr !== '' ? n : tr;
    };

    const buildRuleFromForm = () => {
      const range = rangeIn.value.trim().toUpperCase();
      if (!RK.parseRangeA1(range)) { return { error: t('cf.badRange', 'That is not a valid A1 range') }; }
      const id = editingId || newId();
      const ty = typeSel.value;
      if (ty === 'cellValue') {
        const op = opSel.value;
        const rule = { id, type: 'cellValue', range, op, format: formatOfPreset(selFormatId) };
        if (!NO_OPERAND.has(op)) rule.v1 = typedOperand(v1In.value);
        if (TWO_OPERAND.has(op)) rule.v2 = typedOperand(v2In.value);
        if (!NO_OPERAND.has(op) && (rule.v1 === null || rule.v1 === '')) return { error: t('cf.needValue', 'Enter a value for the condition') };
        if (TWO_OPERAND.has(op) && (rule.v2 === null || rule.v2 === '')) return { error: t('cf.needValue', 'Enter a value for the condition') };
        return { rule };
      }
      if (ty === 'formula') {
        const f = formulaIn.value.trim();
        if (!f.startsWith('=')) return { error: t('cf.needFormula', 'The formula must start with =') };
        return { rule: { id, type: 'formula', range, formula: f, format: formatOfPreset(selFormatId) } };
      }
      if (ty === 'colorScale') {

    };

    const persist = async (nextRules) => {
      const ok = await commit(nextRules);
      if (ok) { rules = nextRules.map((r) => JSON.parse(JSON.stringify(r))); renderList(); }
      return ok;
    };

    addBtn.addEventListener('click', async () => {
      const { rule, error } = buildRuleFromForm();
      if (error) { warn(error); return; }
      let next;
      if (editingId) next = rules.map((r) => (r.id === editingId ? rule : r));
      else next = [rule, ...rules]; // new rules go to the top (highest priority)
      const ok = await persist(next);
      if (ok) resetForm();
    });

    const move = async (idx, delta) => {
      const j = idx + delta;
      if (j < 0 || j >= rules.length) return;
      const next = rules.slice();
      const [it] = next.splice(idx, 1);
      next.splice(j, 0, it);
      await persist(next);
    };
    const del = async (id) => { await persist(rules.filter((r) => r.id !== id)); };

    const renderList = () => {
      listEl.textContent = '';
      if (!rules.length) {
        const none = document.createElement('div'); none.className = 'rk-cf-none';
        none.textContent = t('cf.none', 'No rules yet. Top of the list wins.');
        listEl.appendChild(none);
        return;
      }
      rules.forEach((rule, i) => {
        const row = document.createElement('div'); row.className = 'rk-cf-item';
        const sw = document.createElement('span'); sw.className = 'rk-cf-item-sw';
        if (rule.type === 'colorScale') sw.style.background = rule.scale.mid ? `linear-gradient(90deg, ${rule.scale.min}, ${rule.scale.mid}, ${rule.scale.max})` : `linear-gradient(90deg, ${rule.scale.min}, ${rule.scale.max})`;
        else if (rule.type === 'dataBar') sw.style.background = rule.bar.color;
        else if (rule.format && rule.format.bg) { sw.style.background = rule.format.bg; sw.style.color = rule.format.fg; sw.textContent = 'A'; }
        else if (rule.format && rule.format.fg) { sw.style.color = rule.format.fg; sw.textContent = 'A'; }
        const txt = document.createElement('span'); txt.className = 'rk-cf-item-txt';
        txt.textContent = summarize(rule);
        const rng = document.createElement('span'); rng.className = 'rk-cf-item-range'; rng.textContent = rule.range;
        const ctl = document.createElement('span'); ctl.className = 'rk-cf-item-ctl';
        const up = document.createElement('button'); up.type = 'button'; up.className = 'rk-cf-mv'; up.textContent = '▲'; up.title = t('cf.up', 'Higher priority'); up.disabled = i === 0;
        const dn = document.createElement('button'); dn.type = 'button'; dn.className = 'rk-cf-mv'; dn.textContent = '▼'; dn.title = t('cf.down', 'Lower priority'); dn.disabled = i === rules.length - 1;
        const ed = document.createElement('button'); ed.type = 'button'; ed.className = 'rk-cf-edit'; ed.textContent = t('cf.edit', 'Edit');
        const rm = document.createElement('button'); rm.type = 'button'; rm.className = 'rk-cf-del'; rm.textContent = '×'; rm.setAttribute('aria-label', t('cf.delete', 'Delete rule'));
        up.addEventListener('click', () => move(i, -1));
        dn.addEventListener('click', () => move(i, 1));
        ed.addEventListener('click', () => loadForEdit(rule));
        rm.addEventListener('click', () => del(rule.id));
        ctl.append(up, dn, ed, rm);
        row.append(sw, txt, rng, ctl);
        listEl.appendChild(row);
      });
    };

    renderList();
    resetForm();

    showDialog({
      title: t('cf.title', 'Conditional formatting'),
      body,
      initialFocus: typeSel,
      // Close is the dismiss action; the form's "Add rule" is the sole primary
      // (kept consistent with the data-validation manager — two filled-accent
      // buttons in one dialog flatten the hierarchy).
      buttons: [{ label: t('btn.close', 'Close'), primary: false, onClick: (d) => d.close() }],
    });
  };

  return { open };
}

    ['date', t('dv.type.date', 'Date')],
    ['textLength', t('dv.type.textLength', 'Text length')],
    ['custom', t('dv.type.custom', 'Custom formula')],

  const OP_LABELS = () => ([
    ['between', t('dv.op.between', 'between')], ['notBetween', t('dv.op.notBetween', 'not between')],
    ['gt', t('dv.op.gt', 'greater than')], ['lt', t('dv.op.lt', 'less than')],
    ['ge', t('dv.op.ge', '≥')], ['le', t('dv.op.le', '≤')],
    ['eq', t('dv.op.eq', 'equal to')], ['ne', t('dv.op.ne', 'not equal to')],

      return `${t('dv.type.list', 'List')}: ${src}`;
    }
    if (rule.type === 'custom') return `${t('dv.type.custom', 'Custom')}: ${rule.formula}`;

    rangeIn.type = 'text'; rangeIn.spellcheck = false; rangeIn.autocomplete = 'off';
    field(t('dv.field.range', 'Apply to range'), rangeIn);

    // list controls: a source toggle + either literal values or a range ref
    const listSrcSel = document.createElement('select');
    for (const [v, lab] of [['literal', t('dv.list.literal', 'Values I type')], ['range', t('dv.list.range', 'A range of cells')]]) { const o = document.createElement('option'); o.value = v; o.textContent = lab; listSrcSel.appendChild(o); }

    const v1In = document.createElement('input'); v1In.type = 'text'; v1In.autocomplete = 'off'; v1In.className = 'rk-dv-operand';
    const v1Row = field(t('dv.field.value', 'Value'), v1In);
    const v2In = document.createElement('input'); v2In.type = 'text'; v2In.autocomplete = 'off'; v2In.className = 'rk-dv-operand';

    const modeSel = document.createElement('select');
    for (const [v, lab] of [['reject', t('dv.mode.reject', 'Reject the entry')], ['warn', t('dv.mode.warn', 'Warn but allow')]]) { const o = document.createElement('option'); o.value = v; o.textContent = lab; modeSel.appendChild(o); }

    const addBtn = document.createElement('button');

      listValsRow.style.display = ty === 'list' && listSrcSel.value === 'literal' ? '' : 'none';
      listRefRow.style.display = ty === 'list' && listSrcSel.value === 'range' ? '' : 'none';
      opRow.style.display = isCmp ? '' : 'none';
      v1Row.style.display = isCmp ? '' : 'none';
      v2Row.style.display = isCmp && TWO_OPERAND.has(opSel.value) ? '' : 'none';
      v1Row.querySelector('.rk-dv-label').textContent = ty === 'textLength'

      addBtn.textContent = editingId ? t('dv.update', 'Update rule') : t('dv.add', 'Add rule');

    listSrcSel.addEventListener('change', syncFormVisibility);

      rangeIn.value = getSelectionRange ? getSelectionRange() : '';
      listValsIn.value = ''; listRefIn.value = ''; v1In.value = ''; v2In.value = ''; formulaIn.value = ''; helpIn.value = '';

    const loadForEdit = (rule) => {
      editingId = rule.id;

      rangeIn.value = rule.range;
      modeSel.value = rule.onInvalid;

      if (rule.type === 'list') {
        listSrcSel.value = rule.source;
        if (rule.source === 'literal') listValsIn.value = (rule.values || []).join(', ');
        else listRefIn.value = rule.ref || '';
      } else if (rule.type === 'custom') {
        formulaIn.value = rule.formula;
      } else {

        v2In.value = rule.v2 == null ? '' : String(rule.v2);

      const range = rangeIn.value.trim().toUpperCase();
      if (!RK.parseRangeA1(range)) return { error: t('dv.badRange', 'That is not a valid A1 range') };
      const id = editingId || newId();
      const ty = typeSel.value;
      const onInvalid = modeSel.value;
      const help = helpIn.value.trim() || null;
      const base = { id, type: ty, range, onInvalid, help };
      if (ty === 'list') {
        if (listSrcSel.value === 'literal') {
          const values = listValsIn.value.split(',').map((s) => s.trim()).filter((s) => s !== '');

        const ref = listRefIn.value.trim().toUpperCase();
        if (!RK.parseRangeA1(ref)) return { error: t('dv.badListRef', 'The list range is not a valid A1 range') };

        const f = formulaIn.value.trim();
        if (!f.startsWith('=')) return { error: t('dv.needFormula', 'The formula must start with =') };

      const op = opSel.value;
      const v1raw = v1In.value.trim();
      if (v1raw === '') return { error: t('dv.needValue', 'Enter a value for the condition') };
      const rule = { ...base, op, v1: ty === 'date' ? v1raw : typedOperand(v1raw) };
      if (TWO_OPERAND.has(op)) {

    const persist = async (nextRules) => {

    addBtn.addEventListener('click', async () => {
      const { rule, error } = buildRuleFromForm();

    const del = async (id) => { await persist(rules.filter((r) => r.id !== id)); };

    const renderList = () => {

        const none = document.createElement('div'); none.className = 'rk-dv-none';
        none.textContent = t('dv.none', 'No validation rules yet.');

        const row = document.createElement('div'); row.className = 'rk-dv-item';
        const txt = document.createElement('span'); txt.className = 'rk-dv-item-txt';
        txt.textContent = summarize(rule);
        const rng = document.createElement('span'); rng.className = 'rk-dv-item-range'; rng.textContent = rule.range;
        const mode = document.createElement('span');
        mode.className = `rk-dv-item-mode rk-dv-mode-${rule.onInvalid}`;
        mode.textContent = rule.onInvalid === 'reject' ? t('dv.mode.rejectShort', 'reject') : t('dv.mode.warnShort', 'warn');
        const ctl = document.createElement('span'); ctl.className = 'rk-dv-item-ctl';
        const ed = document.createElement('button'); ed.type = 'button'; ed.className = 'rk-dv-edit'; ed.textContent = t('dv.edit', 'Edit');
        const rm = document.createElement('button'); rm.type = 'button'; rm.className = 'rk-dv-del'; rm.textContent = '×'; rm.setAttribute('aria-label', t('dv.delete', 'Delete rule'));
        ed.addEventListener('click', () => loadForEdit(rule));
        rm.addEventListener('click', () => del(rule.id));

        row.append(txt, rng, mode, ctl);
        listEl.appendChild(row);
      });
    };

    renderList();
    resetForm();

    showDialog({
      title: t('dv.title', 'Data validation'),
      body,
      initialFocus: typeSel,
      // Close is the dismiss action, not the commit action — the form's "Add
      // rule" is the sole primary, so Close stays a neutral (ghost) button:
      // two filled-accent buttons in one dialog flatten the hierarchy.
      buttons: [{ label: t('btn.close', 'Close'), primary: false, onClick: (d) => d.close() }],
    });
  };

  return { open };
}

// Reckon — in-cell list dropdown for data validation (Batch M). A list rule on
// the active cell shows a caret affordance pinned to the cell (in the grid's
// overlay layer, same coordinate space as the ref-outline / editor overlays).
// Opening it shows the allowed values (literal list or a live referenced range);
// choosing one commits through the app's enforce path (applyTransaction, which
// re-checks the DV gate — an allowed value always passes). Keyboard-accessible:
// the popup is a role=listbox with roving focus (Arrow/Home/End move, Enter
// commits, Esc closes); the app opens it with Alt+ArrowDown (Excel's binding).
// Dim-never-hide (§8): the caret shows whenever the active cell has a list rule,
// even if the referenced range is currently empty (the popup then reads "no
// values yet" rather than vanishing).
//
// Module contract (single-file doctrine): no imports; uses globalThis.Reckon;
// registers on globalThis.Reckon.

export function createDvDropdown({ layer, commit, onOpen, onClose } = {}) {
  const RK = globalThis.Reckon;
  const t = (k, f) => (RK.t ? RK.t(k) : f);

  let state = null; // { values, rect } for the active list cell, or null
  let popup = null;
  let activeIdx = -1;

  const caret = document.createElement('button');
  caret.type = 'button';
  caret.className = 'rk-dv-caret';
  caret.tabIndex = -1; // reached via Alt+ArrowDown / mouse; not a tab stop (grid owns focus)
  caret.setAttribute('aria-haspopup', 'listbox');
  caret.setAttribute('aria-expanded', 'false');
  caret.setAttribute('aria-label', t('dv.openList', 'Open list'));
  caret.textContent = '▾';
  caret.style.display = 'none';
  caret.addEventListener('mousedown', (e) => e.preventDefault());
  caret.addEventListener('click', (e) => { e.preventDefault(); toggle(); });
  if (layer) layer.appendChild(caret);

  const CARET_W = 16;
  const positionCaret = (rect) => {
    caret.style.left = `${rect.left + rect.width - CARET_W}px`;
    caret.style.top = `${rect.top}px`;
    caret.style.height = `${Math.max(12, rect.height)}px`;
  };

  const closePopup = () => {
    if (!popup) return;
    popup.remove();
    popup = null;
    activeIdx = -1;
    caret.setAttribute('aria-expanded', 'false');
    if (typeof onClose === 'function') onClose();
  };

  const renderActive = () => {
    if (!popup) return;
    const opts = popup.querySelectorAll('.rk-dv-opt');
    opts.forEach((o, i) => {
      const on = i === activeIdx;
      o.classList.toggle('active', on);
      o.setAttribute('aria-selected', on ? 'true' : 'false');
      if (on) { popup.setAttribute('aria-activedescendant', o.id); o.scrollIntoView({ block: 'nearest' }); }
    });
  };

  const choose = async (value) => {
    closePopup();
    if (typeof commit === 'function') await commit(value);
  };

  const openPopup = () => {
    if (popup || !state) return;
    const { values, rect } = state;
    popup = document.createElement('div');
    popup.className = 'rk-dv-pop';
    popup.setAttribute('role', 'listbox');
    popup.setAttribute('aria-label', t('dv.listbox', 'Allowed values'));
    popup.style.left = `${rect.left}px`;
    popup.style.top = `${rect.top + rect.height}px`;
    popup.style.minWidth = `${Math.max(rect.width, 96)}px`;
    if (!values.length) {
      const none = document.createElement('div');
      none.className = 'rk-dv-pop-none';
      none.textContent = t('dv.listEmpty', 'No values yet');
      popup.appendChild(none);
    } else {
      values.forEach((v, i) => {
        const o = document.createElement('div');
        o.id = `rk-dv-opt-${i}`;
        o.className = 'rk-dv-opt';
        o.setAttribute('role', 'option');
        o.setAttribute('aria-selected', 'false');
        o.textContent = v;
        o.addEventListener('mousedown', (e) => e.preventDefault());
        o.addEventListener('mouseenter', () => { activeIdx = i; renderActive(); });
        o.addEventListener('click', () => choose(v));
        popup.appendChild(o);
      });
    }
    layer.appendChild(popup);
    caret.setAttribute('aria-expanded', 'true');
    activeIdx = values.length ? 0 : -1;
    renderActive();
    if (typeof onOpen === 'function') onOpen();
  };

  const toggle = () => { if (popup) closePopup(); else openPopup(); };

  // key handling while the popup is open; returns true if the key was consumed
  const handleKeydown = (e) => {
    if (!popup) return false;
    const opts = state ? state.values.length : 0;
    switch (e.key) {
      case 'Escape': e.preventDefault(); closePopup(); return true;
      case 'ArrowDown': e.preventDefault(); if (opts) { activeIdx = (activeIdx + 1) % opts; renderActive(); } return true;
      case 'ArrowUp': e.preventDefault(); if (opts) { activeIdx = (activeIdx - 1 + opts) % opts; renderActive(); } return true;
      case 'Home': e.preventDefault(); if (opts) { activeIdx = 0; renderActive(); } return true;
      case 'End': e.preventDefault(); if (opts) { activeIdx = opts - 1; renderActive(); } return true;
      case 'Enter':
      case 'Tab':
        e.preventDefault();
        if (activeIdx >= 0 && state.values[activeIdx] !== undefined) choose(state.values[activeIdx]);
        else closePopup();
        return true;
      default:
        return false;
    }
  };

  return {
    // the active cell has a list rule: show the caret and stash its values/rect
    show(values, rect) {
      state = { values: values.slice(), rect };
      positionCaret(rect);
      caret.style.display = '';
      if (popup) { // reposition an open popup + refresh its options
        closePopup();
        openPopup();
      }
    },
    // the active cell has no list rule (or the grid moved away): tear down
    hide() {
      state = null;
      caret.style.display = 'none';
      closePopup();
    },
    // viewport/selection changed: keep the caret + popup pinned
    reposition(rect) {
      if (!state) return;
      state.rect = rect;
      positionCaret(rect);
      if (popup) { popup.style.left = `${rect.left}px`; popup.style.top = `${rect.top + rect.height}px`; }
    },
    open() { if (state) openPopup(); },
    close: closePopup,
    isOpen: () => !!popup,
    hasList: () => !!state,
    handleKeydown,
    optionCount: () => (popup ? popup.querySelectorAll('.rk-dv-opt').length : 0),
  };
}

// Reckon — pivot region overlay (Batch N). Each pivot MATERIALISES its result as
// a read-only table region rendered over the grid, ANCHORED to a cell so it
// scrolls WITH the cells (unlike the chart px-overlay, interp 36) — it lives in
// the grid's content-overlay space (grid.overlayEl, the same scroll-adjusted
// coordinate space as the data-bar / DV-marker layers) and is repositioned on
// scroll/resize via getRect of its anchor cell. It writes NO cells (no second
// write path, §L4): the underlying grid values are untouched and stay visible
// around the region; the region is a real <table role="table"> styled with the
// grid's own --rk tokens PLUS a read-only wash + left accent edge so a viewer
// never mistakes computed output for editable cells (§8 honesty).
//
// The region body is pointer-events:none so the grid keeps scrolling/selecting
// THROUGH it; only the header's ⚙/× controls take the pointer (the charts trick).
//
// `buildPivotTableEl` is the ONE renderer shared by the region AND the builder's
// live preview — so the preview always predicts the committed artifact exactly
// (same header structure, same Grand-Total treatment, same read-only styling).
//
// Module contract (single-file doctrine): no imports; uses globalThis.Reckon;
// registers on globalThis.Reckon.

const pvT = (k, f) => { const RK = globalThis.Reckon; return (RK && RK.t && RK.t(k) !== k) ? RK.t(k) : f; };

const pvNumFmt = (n, locale) => {
  if (n === null || n === undefined) return '';
  if (typeof n !== 'number' || !Number.isFinite(n)) return String(n);
  try { return n.toLocaleString(locale || undefined, { maximumFractionDigits: 4 }); }
  catch { return String(Math.round(n * 10000) / 10000); }
};

const pvCell = (tag, text, cls, { scope, colspan } = {}) => {
  const el = document.createElement(tag);
  if (cls) el.className = cls;
  if (text !== undefined && text !== null) el.textContent = text;
  if (scope) el.setAttribute('scope', scope);
  if (colspan && colspan > 1) el.colSpan = colspan;
  return el;
};

// Build the <table> for a computed result — the shared renderer. Layout (Excel
// tabular idiom):
//   corner (row-field names) | colKey groups (each spans V value cols) | [Grand Total group]
//   [row-field name cells]   | value-field labels per group            | ...
//   ... body rows: row-key cells + value cells (+ row totals) ...
//   Grand Total row: label + col totals + grand totals
export function buildPivotTableEl(result, { locale, className = 'rk-pivot-table' } = {}) {
  const table = document.createElement('table');
  table.className = className;
  table.setAttribute('role', 'table');
  if (!result || result.ok === false) {
    const d = document.createElement('div');
    d.className = 'rk-pv-emptyrow';
    d.textContent = result && result.error ? pvT('pivot.badSource', 'Cannot compute — check the source range') : pvT('pivot.empty', 'No data to summarise');
    return d;
  }
  const R = result.rowFields.length;
  const V = result.valueFields.length || 1;
  const showColGroups = result.colFields.length > 0;
  const colKeys = result.colKeys;

  const thead = document.createElement('thead');
  if (showColGroups) {
    const rA = document.createElement('tr');
    if (R > 0) rA.appendChild(pvCell('th', result.colFields.join(' · '), 'rk-pv-corner', { colspan: R }));
    colKeys.forEach((ck) => rA.appendChild(pvCell('th', ck.join(' · '), 'rk-pv-colhead', { scope: 'colgroup', colspan: V })));
    rA.appendChild(pvCell('th', pvT('pivot.grandTotal', 'Grand Total'), 'rk-pv-colhead rk-pv-total', { scope: 'colgroup', colspan: V }));
    thead.appendChild(rA);
  }
  const rB = document.createElement('tr');
  result.rowFields.forEach((f) => rB.appendChild(pvCell('th', f, 'rk-pv-rowfield', { scope: 'col' })));
  const groups = showColGroups ? colKeys.length + 1 : 1;
  for (let g = 0; g < groups; g += 1) {
    const isTotal = showColGroups && g === colKeys.length;
    result.valueFields.forEach((vf) => rB.appendChild(pvCell('th', vf.label, `rk-pv-valhead${isTotal ? ' rk-pv-total' : ''}`, { scope: 'col' })));
  }
  thead.appendChild(rB);
  table.appendChild(thead);

  const tbody = document.createElement('tbody');
  if (result.rowKeys.length === 0) {
    const tr = document.createElement('tr');
    tr.appendChild(pvCell('td', pvT('pivot.empty', 'No data to summarise'), 'rk-pv-emptyrow', { colspan: Math.max(1, R) + groups * V }));
    tbody.appendChild(tr);
  }
  result.rowKeys.forEach((rk, ri) => {
    const tr = document.createElement('tr');
    rk.forEach((label) => tr.appendChild(pvCell('th', label, 'rk-pv-rowhead', { scope: 'row' })));
    colKeys.forEach((_, ci) => {
      result.valueFields.forEach((vf, vi) => tr.appendChild(pvCell('td', pvNumFmt(result.body[ri][ci][vi], locale), 'rk-pv-val')));
    });
    // single implicit group == the row total; with col groups it is a totals column
    result.valueFields.forEach((vf, vi) => tr.appendChild(pvCell('td', pvNumFmt(result.rowTotals[ri][vi], locale), `rk-pv-val${showColGroups ? ' rk-pv-total' : ''}`)));
    tbody.appendChild(tr);
  });
  table.appendChild(tbody);

  if (result.rowKeys.length > 0) {
    const tfoot = document.createElement('tfoot');
    const tr = document.createElement('tr');
    if (R > 0) tr.appendChild(pvCell('th', pvT('pivot.grandTotal', 'Grand Total'), 'rk-pv-rowhead rk-pv-total', { scope: 'row', colspan: R }));
    if (showColGroups) result.colTotals.forEach((ct) => result.valueFields.forEach((vf, vi) => tr.appendChild(pvCell('td', pvNumFmt(ct[vi], locale), 'rk-pv-val rk-pv-total'))));
    result.valueFields.forEach((vf, vi) => tr.appendChild(pvCell('td', pvNumFmt(result.grandTotals[vi], locale), 'rk-pv-val rk-pv-total rk-pv-grand')));
    tfoot.appendChild(tr);
    table.appendChild(tfoot);
  }
  return table;
}

export function pivotSummaryLabel(pivot) {
  const parts = [];
  if (pivot.rows.length) parts.push(`${pvT('pivot.rows', 'Rows')}: ${pivot.rows.join(', ')}`);
  if (pivot.cols.length) parts.push(`${pvT('pivot.cols', 'Cols')}: ${pivot.cols.join(', ')}`);
  if (pivot.values.length) parts.push(pivot.values.map((v) => `${v.agg}(${v.field})`).join(', '));
  return parts.join('  ·  ');
}

export function createPivotsLayer({ mount, rectOf, onOpenSettings, onDelete } = {}) {
  const RK = globalThis.Reckon;

  const layer = document.createElement('div');
  layer.className = 'rk-pivot-layer';
  layer.setAttribute('aria-hidden', 'false');
  mount.appendChild(layer);

  const boxes = new Map(); // id -> { el, table, anchor:{r,c}, pivot }

  const buildBox = (pivot, result, locale) => {
    const el = document.createElement('div');
    el.className = 'rk-pivot';
    el.dataset.id = pivot.id;
    el.setAttribute('role', 'group');
    el.setAttribute('aria-label', `${pvT('pivot.region', 'Pivot table')}: ${pivot.title || pivotSummaryLabel(pivot)}`);

    const head = document.createElement('div');
    head.className = 'rk-pivot-head';
    const titleEl = document.createElement('span');
    titleEl.className = 'rk-pivot-title';
    titleEl.textContent = pivot.title || pvT('pivot.region', 'Pivot table');
    const sumEl = document.createElement('span');
    sumEl.className = 'rk-pivot-summary';
    sumEl.textContent = pivotSummaryLabel(pivot);
    const spacer = document.createElement('span');
    spacer.className = 'rk-pivot-head-sp';
    const edit = document.createElement('button');
    edit.type = 'button'; edit.className = 'rk-pivot-btn'; edit.textContent = '⚙';
    edit.setAttribute('aria-label', pvT('pivot.settings', 'Pivot settings'));
    edit.addEventListener('mousedown', (e) => e.stopPropagation());
    edit.addEventListener('click', (e) => { e.stopPropagation(); onOpenSettings?.(pivot.id); });
    const del = document.createElement('button');
    del.type = 'button'; del.className = 'rk-pivot-btn'; del.textContent = '×';
    del.setAttribute('aria-label', pvT('pivot.delete', 'Delete pivot'));
    del.addEventListener('mousedown', (e) => e.stopPropagation());
    del.addEventListener('click', (e) => { e.stopPropagation(); onDelete?.(pivot.id); });
    head.append(titleEl, sumEl, spacer, edit, del);

    const bodyWrap = document.createElement('div');
    bodyWrap.className = 'rk-pivot-body';
    const table = buildPivotTableEl(result, { locale });
    bodyWrap.appendChild(table);
    el.append(head, bodyWrap);

    layer.appendChild(el);
    const rec = { el, table, anchor: anchorOf(pivot), pivot };
    boxes.set(pivot.id, rec);
    positionBox(rec);
    return rec;
  };

  const anchorOf = (pivot) => {
    const p = RK.parseA1(pivot.position || 'A1');
    return p ? { r: p.row, c: p.col } : { r: 0, c: 0 };
  };

  const positionBox = (rec) => {
    const rect = rectOf ? rectOf(rec.anchor.r, rec.anchor.c) : null;
    if (!rect) { rec.el.style.display = 'none'; return; }
    const cw = mount.clientWidth || 0;
    const chh = mount.clientHeight || 0;
    if (rect.left > cw || rect.top > chh || rect.left + 40 < 0 || rect.top + 20 < 0) { rec.el.style.display = 'none'; return; }
    rec.el.style.display = '';
    rec.el.style.left = `${Math.max(0, rect.left)}px`;
    rec.el.style.top = `${Math.max(0, rect.top)}px`;
  };

  return {
    el: layer,
    setPivots(list, locale) {
      const keep = new Set(list.map((x) => x.pivot.id));
      for (const [id, rec] of boxes) if (!keep.has(id)) { rec.el.remove(); boxes.delete(id); }
      for (const { pivot, result } of list) {
        const existing = boxes.get(pivot.id);
        if (existing) { existing.el.remove(); boxes.delete(pivot.id); }
        buildBox(pivot, result, locale);
      }
    },
    reposition() { for (const [, rec] of boxes) { rec.anchor = anchorOf(rec.pivot); positionBox(rec); } },
    count: () => boxes.size,
    tableHtml: (id) => boxes.get(id)?.table?.outerHTML ?? null,
    clear() { for (const [, rec] of boxes) rec.el.remove(); boxes.clear(); },
    destroy() { this.clear(); layer.remove(); },
  };
}

// Reckon — pivot builder (Batch N). An in-app dialog (§13: never a native
// dialog) to define a pivot: pick the source range, assign fields to Rows /
// Columns / Values (with an aggregation selector) / Filters, see a live preview,
// and choose where the region anchors. It owns NO engine state — a Save hands the
// whole pivot list to the app, committed through applyTransaction (op `pivotSet`,
// undoable). Keyboard-accessible: fields are assigned via buttons/selects (no
// drag needed), and every control is reachable by Tab.
//
// Module contract (single-file doctrine): no imports; uses globalThis.Reckon;
// registers on globalThis.Reckon.

export function createPivotBuilder({ showDialog, commit, remove, computeResult, getSelectionRange, suggestPosition, getPivots, toast } = {}) {
  const RK = globalThis.Reckon;
  const t = (k, f) => (RK.t && RK.t(k) !== k ? RK.t(k) : f);
  const warn = (msg) => { if (typeof toast === 'function') toast(msg); };
  const newId = () => `pv${Date.now().toString(36)}${Math.floor(Math.random() * 1000)}`;
  const AGGS = ['sum', 'count', 'countUnique', 'average', 'min', 'max'];
  const aggLabel = (a) => t(`pivot.agg.${a}`, a);
  const clone = (x) => JSON.parse(JSON.stringify(x));

  const open = (editId = null) => {
    const existing = editId ? (getPivots() || []).find((p) => p.id === editId) : null;
    const def = existing ? clone(existing) : {
      id: newId(), sourceRange: (getSelectionRange ? getSelectionRange() : 'A1:A1'),
      rows: [], cols: [], values: [], filters: [], position: '', title: null,
    };
    def.rows ||= []; def.cols ||= []; def.values ||= []; def.filters ||= [];
    let fields = [];

    const body = document.createElement('div');
    body.className = 'rk-pv';

    // ---- source + position + title ----
    const top = document.createElement('div');
    top.className = 'rk-pv-top';
    const mkField = (labelText, control, host) => {
      const row = document.createElement('label');
      row.className = 'rk-pv-field';
      const span = document.createElement('span'); span.className = 'rk-pv-flabel'; span.textContent = labelText;
      row.append(span, control); host.appendChild(row); return control;
    };
    const srcIn = document.createElement('input'); srcIn.type = 'text'; srcIn.spellcheck = false; srcIn.autocomplete = 'off'; srcIn.value = def.sourceRange;
    mkField(t('pivot.field.source', 'Source range (first row = headers)'), srcIn, top);
    const posIn = document.createElement('input'); posIn.type = 'text'; posIn.spellcheck = false; posIn.autocomplete = 'off'; posIn.placeholder = 'H1';
    mkField(t('pivot.field.position', 'Place region at'), posIn, top);
    const titleIn = document.createElement('input'); titleIn.type = 'text'; titleIn.autocomplete = 'off'; titleIn.maxLength = 255; titleIn.value = def.title || '';
    mkField(t('pivot.field.title', 'Title (optional)'), titleIn, top);
    body.appendChild(top);

    // ---- available fields + four zones ----
    const cols = document.createElement('div');
    cols.className = 'rk-pv-cols';
    const availWrap = document.createElement('div'); availWrap.className = 'rk-pv-avail';
    const availHead = document.createElement('div'); availHead.className = 'rk-pv-zonehead'; availHead.textContent = t('pivot.fields', 'Fields');
    const availList = document.createElement('div'); availList.className = 'rk-pv-chips';
    availWrap.append(availHead, availList);

    const zonesWrap = document.createElement('div'); zonesWrap.className = 'rk-pv-zones';
    const mkZone = (key, labelText) => {
      const z = document.createElement('div'); z.className = 'rk-pv-zone'; z.dataset.zone = key;
      const h = document.createElement('div'); h.className = 'rk-pv-zonehead'; h.textContent = labelText;
      const chips = document.createElement('div'); chips.className = 'rk-pv-chips';
      z.append(h, chips); zonesWrap.appendChild(z);
      return chips;
    };
    const rowChips = mkZone('rows', t('pivot.rows', 'Rows'));
    const colChips = mkZone('cols', t('pivot.cols', 'Columns'));
    const valChips = mkZone('values', t('pivot.values', 'Values'));
    const fltChips = mkZone('filters', t('pivot.filters', 'Filters'));
    cols.append(availWrap, zonesWrap);
    body.appendChild(cols);

    // ---- live preview ----
    const previewHead = document.createElement('div'); previewHead.className = 'rk-pv-zonehead'; previewHead.textContent = t('pivot.preview', 'Preview');
    const preview = document.createElement('div'); preview.className = 'rk-pv-preview';
    body.append(previewHead, preview);

    const inRows = (f) => def.rows.includes(f);
    const inCols = (f) => def.cols.includes(f);
    const inVals = (f) => def.values.some((v) => v.field === f);
    const inFlt = (f) => def.filters.some((v) => v.field === f);

    const renderAvail = () => {
      availList.textContent = '';
      if (!fields.length) {
        const none = document.createElement('span'); none.className = 'rk-pv-none';
        none.textContent = t('pivot.noFields', 'Set a source range to list its fields.');
        availList.appendChild(none); return;
      }
      fields.forEach((f) => {
        const chip = document.createElement('div'); chip.className = 'rk-pv-chip rk-pv-avail-chip';
        const name = document.createElement('span'); name.className = 'rk-pv-chip-name'; name.textContent = f;
        chip.appendChild(name);
        const add = (zone, label, disabled) => {
          const b = document.createElement('button'); b.type = 'button'; b.className = 'rk-pv-add'; b.textContent = label;
          b.title = `${t('pivot.addTo', 'Add to')} ${label}`;
          b.disabled = disabled; if (disabled) b.classList.add('rk-pv-add-on');
          b.addEventListener('click', () => { assign(zone, f); });
          chip.appendChild(b);
        };
        add('rows', t('pivot.rowsShort', 'Rows'), inRows(f));
        add('cols', t('pivot.colsShort', 'Cols'), inCols(f));
        add('values', t('pivot.valuesShort', 'Σ'), inVals(f));
        add('filters', t('pivot.filtersShort', 'Filter'), inFlt(f));
        availList.appendChild(chip);
      });
    };

    const chip = (labelText, onRemove, extra) => {
      const c = document.createElement('div'); c.className = 'rk-pv-chip';
      const name = document.createElement('span'); name.className = 'rk-pv-chip-name'; name.textContent = labelText;
      c.appendChild(name);
      if (extra) c.appendChild(extra);
      const rm = document.createElement('button'); rm.type = 'button'; rm.className = 'rk-pv-chip-x'; rm.textContent = '×';
      rm.setAttribute('aria-label', t('pivot.remove', 'Remove'));
      rm.addEventListener('click', onRemove);
      c.appendChild(rm);
      return c;
    };

    const renderZones = () => {
      rowChips.textContent = ''; colChips.textContent = ''; valChips.textContent = ''; fltChips.textContent = '';
      def.rows.forEach((f) => rowChips.appendChild(chip(f, () => { def.rows = def.rows.filter((x) => x !== f); refresh(); })));
      def.cols.forEach((f) => colChips.appendChild(chip(f, () => { def.cols = def.cols.filter((x) => x !== f); refresh(); })));
      def.values.forEach((v) => {
        const sel = document.createElement('select'); sel.className = 'rk-pv-agg';
        AGGS.forEach((a) => { const o = document.createElement('option'); o.value = a; o.textContent = aggLabel(a); if (a === v.agg) o.selected = true; sel.appendChild(o); });
        sel.addEventListener('change', () => { v.agg = sel.value; refresh(); });
        valChips.appendChild(chip(v.field, () => { def.values = def.values.filter((x) => x !== v); refresh(); }, sel));
      });
      def.filters.forEach((v) => {
        const inp = document.createElement('input'); inp.type = 'text'; inp.className = 'rk-pv-fltvals'; inp.autocomplete = 'off';
        inp.placeholder = t('pivot.filterPlaceholder', 'keep values (comma-sep; blank = all)');
        inp.value = (v.values || []).join(', ');
        inp.addEventListener('change', () => { v.values = inp.value.split(',').map((s) => s.trim()).filter((s) => s !== ''); refresh(); });
        fltChips.appendChild(chip(v.field, () => { def.filters = def.filters.filter((x) => x !== v); refresh(); }, inp));
      });
    };

    const assign = (zone, f) => {
      if (zone === 'rows') { if (!inRows(f)) { def.rows.push(f); def.cols = def.cols.filter((x) => x !== f); } }
      else if (zone === 'cols') { if (!inCols(f)) { def.cols.push(f); def.rows = def.rows.filter((x) => x !== f); } }
      else if (zone === 'values') { if (!inVals(f)) def.values.push({ field: f, agg: 'sum' }); }
      else if (zone === 'filters') { if (!inFlt(f)) def.filters.push({ field: f, values: [] }); }
      refresh();
    };

    const currentDef = () => ({
      id: def.id, sourceRange: srcIn.value.trim().toUpperCase(),
      rows: def.rows.slice(), cols: def.cols.slice(),
      values: def.values.map((v) => ({ field: v.field, agg: v.agg })),
      filters: def.filters.map((v) => ({ field: v.field, values: (v.values || []).slice() })),
      position: (posIn.value.trim().toUpperCase()) || suggestedPos(),
      title: titleIn.value.trim() || null,
    });

    const suggestedPos = () => (suggestPosition ? suggestPosition(srcIn.value.trim().toUpperCase()) : 'H1');

    // The preview uses the SAME renderer as the committed on-grid region
    // (RK.buildPivotTableEl) — so it predicts the artifact exactly: same header
    // tiers, same Grand-Total treatment, same read-only styling (fixes the
    // preview/region mismatch a fresh critique flagged).
    const renderPreview = (result) => {
      preview.textContent = '';
      if (!result || result.ok === false) { const d = document.createElement('div'); d.className = 'rk-pv-none'; d.textContent = t('pivot.badSource', 'Cannot compute — check the source range'); preview.appendChild(d); return; }
      if (!def.values.length) { const d = document.createElement('div'); d.className = 'rk-pv-none'; d.textContent = t('pivot.needValue', 'Add at least one Values field to see a summary.'); preview.appendChild(d); return; }
      preview.appendChild(RK.buildPivotTableEl(result, { locale: undefined }));
      if (result.truncated) { const m = document.createElement('div'); m.className = 'rk-pv-none'; m.textContent = t('pivot.truncated', 'Source is large — preview is based on a capped sample.'); preview.appendChild(m); }
    };

    let refreshSeq = 0;
    const refresh = async () => {
      renderAvail();
      renderZones();
      const my = ++refreshSeq;
      let result = null;
      try { result = await computeResult(currentDef()); } catch { result = { ok: false }; }
      if (my !== refreshSeq) return; // a newer refresh superseded this one
      if (result && Array.isArray(result.fields)) { fields = result.fields; renderAvail(); }
      renderPreview(result);
    };

    // reload fields when the source range changes
    srcIn.addEventListener('change', () => { refresh(); });

    const save = async (d) => {
      const range = srcIn.value.trim().toUpperCase();
      if (!RK.parseRangeA1(range)) { warn(t('pivot.badRange', 'That is not a valid A1 range')); return; }
      const pos = (posIn.value.trim().toUpperCase()) || suggestedPos();
      if (!RK.parseA1(pos)) { warn(t('pivot.badPos', 'The region position is not a valid A1 cell')); return; }
      if (!def.values.length) { warn(t('pivot.needValue', 'Add at least one Values field to summarise.')); return; }
      const built = currentDef();
      const list = (getPivots() || []).map((p) => clone(p));
      const idx = list.findIndex((p) => p.id === built.id);
      if (idx >= 0) list[idx] = built; else list.push(built);
      const ok = await commit(list);
      if (ok) d.close();
    };

    const buttons = [];
    if (existing) buttons.push({ label: t('pivot.deleteBtn', 'Delete'), onClick: async (d) => { d.close(); await remove(existing.id); } });
    buttons.push({ label: t('btn.cancel', 'Cancel'), onClick: (d) => d.close() });
    buttons.push({ label: existing ? t('pivot.save', 'Save') : t('pivot.create', 'Create'), primary: true, onClick: save });

    showDialog({ title: existing ? t('pivot.editTitle', 'Edit pivot table') : t('pivot.newTitle', 'New pivot table'), body, initialFocus: srcIn, buttons });
    refresh();
  };

  return { open };
}

// Reckon — app composition: grid + formula bar + tabs + status + storage.
// Every write is a transaction through the worker session (L4); the app owns
// selection->formula-bar sync, clipboard, fill, find/replace, the FSA grant
// flow (in-app dialogs only, §8/§13), autosave wiring and the empty state.
//
// Module contract (single-file doctrine): no imports; uses globalThis.Reckon;
// registers on globalThis.Reckon.

export function createApp({ client, params = new URLSearchParams() }) {
  const RK = globalThis.Reckon;
  const $ = (id) => document.getElementById(id);

  const els = {
    app: $('rk-app'),
    namebox: $('rk-namebox'),
    fxWrap: $('rk-fx-wrap'),
    fx: $('rk-fx'),
    fxMirror: $('rk-fx-mirror'),
    aiHint: $('rk-ai-hint'),
    sidecar: $('rk-sidecar'),
    toolbar: $('rk-toolbar'),
    statusFilter: $('rk-status-filter'),
    grid: $('rk-grid'),
    tabs: $('rk-tabs'),
    tabAdd: $('rk-tab-add'),
    statusLeft: $('rk-status-left'),
    statusStats: $('rk-status-stats'),
    statusVersion: $('rk-status-version'),
    empty: $('rk-empty'),
    dialogHost: $('rk-dialog-host'),
    toastHost: $('rk-toast-host'),
    help: $('rk-help-btn'),
    settings: $('rk-settings-btn'),
  };

  const VERSION = document.querySelector('meta[name="reckon-version"]').content;
  els.statusVersion.textContent = VERSION;

  // ---------- state ----------
  let sheets = [];
  let activeId = null;
  let fnNames = [];
  let definedNames = {};
  let grid = null;
  let editor = null;
  let toolbar = null;
  let chartsLayer = null;      // Batch K: floating chart overlay over the grid
  let activeCharts = [];       // charts on the active sheet (from getSheetMeta)
  let pivotsLayer = null;      // Batch N: cell-anchored pivot region overlay
  let pivotBuilder = null;     // Batch N: pivot builder dialog
  let activePivots = [];       // pivots on the active sheet (from getSheetMeta)
  let filterState = null; // {sheetId, col, hidden:Set, keep:Set<string>} active filter
  let facade = null;
  let autosave = null;
  let fsaState = { supported: typeof window.showDirectoryPicker === 'function', file: null, dir: null, fileName: null, needsReconnect: false, saved: null };
  let lastClip = null; // {tsv, sheet, range:{...}, cells:{a1:raw}, cut}
  let updateHostTitle = () => {}; // NakliOS host title (Batch H); no-op until wired + hosted
  const ephemeral = params.has('fixture') || params.has('fresh'); // e2e/screens: never touch real storage

  const activeSheet = () => sheets.find((s) => s.id === activeId);
  const activeName = () => activeSheet()?.name ?? '';

  // ---------- tiny IDB kv (persists the FSA handles across sessions) ----------
  const kvOpen = () => new Promise((res, rej) => {
    const req = indexedDB.open('reckon-shell', 1);
    req.onupgradeneeded = () => req.result.createObjectStore('kv');
    req.onsuccess = () => res(req.result);
    req.onerror = () => rej(req.error);
  });
  const kvGet = async (key) => {
    try {
      const db = await kvOpen();
      return await new Promise((res, rej) => {
        const t = db.transaction('kv', 'readonly').objectStore('kv').get(key);
        t.onsuccess = () => { res(t.result); db.close(); };
        t.onerror = () => { rej(t.error); db.close(); };
      });
    } catch { return undefined; }
  };
  const kvSet = async (key, value) => {
    try {
      const db = await kvOpen();
      await new Promise((res, rej) => {
        const t = db.transaction('kv', 'readwrite').objectStore('kv').put(value, key);
        t.onsuccess = () => { res(); db.close(); };
        t.onerror = () => { rej(t.error); db.close(); };
      });
    } catch { /* persistence of the grant is best-effort */ }
  };

  // ---------- toasts + dialogs (in-app only, §13: no native dialogs) ----------
  const toast = (msg, { kind = 'info', ms = 4000 } = {}) => {
    const el = document.createElement('div');
    el.className = `rk-toast rk-toast-${kind}`;
    el.setAttribute('role', 'status');
    el.textContent = msg;
    els.toastHost.appendChild(el);
    setTimeout(() => { el.classList.add('out'); setTimeout(() => el.remove(), 250); }, ms);
  };

  let openDialogClose = null;
  const showDialog = ({ title, body, buttons = [], onClose = null, initialFocus = null }) => {
    closeDialog();
    const backdrop = document.createElement('div');
    backdrop.className = 'rk-dialog-backdrop';
    const box = document.createElement('div');
    box.className = 'rk-dialog';
    box.setAttribute('role', 'dialog');
