  return { ...base, bar: { color: rule.bar.color, negColor: rule.bar.negColor ?? null } };
}

// ---------- evaluation ----------
// getRangeValues(a1Range) -> { start:{col,row}, values: v[][] }  (dense, as the
//   worker's regionValues). opts.formulaEval(formula, dr, dc) -> engine value
//   (worker injects engine.evalFormula over a per-cell shifted formula).
// Returns Map(a1 -> { bg?, fg?, bold?, bar? }) where bar = { start, end, color }
//   (fractions 0..1 of cell width; the overlay draws a translucent rect behind
//   the text — draw-behind honesty, handoff §8). First-rule-wins per attribute.
export function evaluateRules(rules, getRangeValues, opts = {}) {
  const NS = globalThis.Reckon;
  const out = new Map();
  const setAttr = (a1, key, val) => {
    let s = out.get(a1);
    if (!s) { s = {}; out.set(a1, s); }
    if (s[key] === undefined) s[key] = val; // first-wins (top of list = priority)
  };
  const applyFmt = (a1, format) => {
    if (format.bg) { setAttr(a1, 'bg', format.bg); setAttr(a1, 'fg', format.fg || pickTextColor(format.bg)); }
    else if (format.fg) setAttr(a1, 'fg', format.fg);
    if (format.bold) setAttr(a1, 'bold', true);
  };

  for (const raw of rules ?? []) {
    if (cfError(raw)) continue; // defensive; ingress already validated
    const rule = normalizeRule(raw);
    const rg = getRangeValues(rule.range);
    if (!rg || !Array.isArray(rg.values) || !rg.values.length) continue;
    const { start, values } = rg;
    const a1At = (ri, ci) => NS.toA1(start.col + ci, start.row + ri);
    const each = (fn) => values.forEach((row, ri) => row.forEach((v, ci) => fn(v, ri, ci)));

    if (rule.type === 'colorScale') {
      let lo = Infinity; let hi = -Infinity;
      each((v) => { const n = cfNum(v); if (n !== null) { if (n < lo) lo = n; if (n > hi) hi = n; } });
      if (!Number.isFinite(lo)) continue;
      each((v, ri, ci) => {
        const n = cfNum(v);
        if (n === null) return;
        const bg = colorScaleColor(rule.scale, n, lo, hi);
        const a1 = a1At(ri, ci);
        setAttr(a1, 'bg', bg);
        setAttr(a1, 'fg', pickTextColor(bg));
      });
      continue;
    }

    if (rule.type === 'dataBar') {
      let lo = Infinity; let hi = -Infinity;
      each((v) => { const n = cfNum(v); if (n !== null) { if (n < lo) lo = n; if (n > hi) hi = n; } });
      if (!Number.isFinite(lo)) continue;
      const gMin = Math.min(0, lo); const gMax = Math.max(0, hi);
      const span = gMax - gMin;
      if (!(span > 0)) continue; // all zero -> no bars
      const zero = (0 - gMin) / span; // fraction of the zero axis
      each((v, ri, ci) => {
        const n = cfNum(v);
        if (n === null) return;
        const f = (n - gMin) / span;
        const bar = n >= 0
          ? { start: zero, end: f, color: rule.bar.color }
          : { start: f, end: zero, color: rule.bar.negColor || rule.bar.color };
        setAttr(a1At(ri, ci), 'bar', bar);
      });
      continue;
    }

    if (rule.type === 'formula') {
      let cells = 0;
      for (const row of values) cells += row.length;
      if (cells > CF_FORMULA_CELL_CAP) continue; // bounded; the panel warns
      const evalAt = opts.formulaEval;
      if (typeof evalAt !== 'function') continue;
      each((v, ri, ci) => {
        const res = evalAt(rule.formula, ri, ci); // worker shifts by (ri,ci) from the range top-left
        if (res && typeof res === 'object' && res.err) return; // an error is not TRUE
        const truthy = res === true || (typeof res === 'number' && res !== 0) || (typeof res === 'string' && res !== '' && res.toUpperCase() === 'TRUE');
        if (truthy) applyFmt(a1At(ri, ci), rule.format);
      });
      continue;
    }

    // ---- cellValue ----
    const op = rule.op;
    // range stats needed by some ops
    let avg = 0; let ncount = 0;
    const dupCounts = new Map();
    if (op === 'aboveAvg' || op === 'belowAvg') {
      let sum = 0; each((v) => { const n = cfNum(v); if (n !== null) { sum += n; ncount += 1; } });
      avg = ncount ? sum / ncount : 0;
    }
    if (op === 'duplicate' || op === 'unique') {
      each((v) => { if (isBlank(v)) return; const k = dupKey(v); dupCounts.set(k, (dupCounts.get(k) || 0) + 1); });
    }
    let threshold = null; // top/bottom N cutoff value
    if (op === 'top' || op === 'bottom') {
      const nums = [];
      each((v) => { const n = cfNum(v); if (n !== null) nums.push(n); });
      const N = Math.max(1, Math.floor(cfNum(rule.v1) ?? 1));
      if (nums.length) {
        nums.sort((a, b) => (op === 'top' ? b - a : a - b));
        threshold = nums[Math.min(N, nums.length) - 1];
      }
    }
    const v1n = cfNum(rule.v1); const v2n = cfNum(rule.v2);
    const v1s = asStr(rule.v1).toLowerCase();
    const test = (v) => {
      const n = cfNum(v);
      switch (op) {
        case 'gt': return n !== null && v1n !== null && n > v1n;
        case 'lt': return n !== null && v1n !== null && n < v1n;
        case 'ge': return n !== null && v1n !== null && n >= v1n;
        case 'le': return n !== null && v1n !== null && n <= v1n;
        case 'eq': return (n !== null && v1n !== null) ? n === v1n : (!isBlank(v) && asStr(v).toLowerCase() === v1s);
        case 'ne': return (n !== null && v1n !== null) ? n !== v1n : (asStr(v).toLowerCase() !== v1s);
        case 'between': return n !== null && v1n !== null && v2n !== null && n >= Math.min(v1n, v2n) && n <= Math.max(v1n, v2n);
        case 'notBetween': return n !== null && v1n !== null && v2n !== null && (n < Math.min(v1n, v2n) || n > Math.max(v1n, v2n));
        case 'contains': return !isBlank(v) && asStr(v).toLowerCase().includes(v1s);
        case 'notContains': return !asStr(v).toLowerCase().includes(v1s);
        case 'beginsWith': return !isBlank(v) && asStr(v).toLowerCase().startsWith(v1s);
        case 'endsWith': return !isBlank(v) && asStr(v).toLowerCase().endsWith(v1s);
        case 'blank': return isBlank(v);
        case 'notBlank': return !isBlank(v);
        case 'duplicate': return !isBlank(v) && (dupCounts.get(dupKey(v)) || 0) > 1;
        case 'unique': return !isBlank(v) && (dupCounts.get(dupKey(v)) || 0) === 1;
        case 'aboveAvg': return n !== null && ncount > 0 && n > avg;
        case 'belowAvg': return n !== null && ncount > 0 && n < avg;
        case 'top': return n !== null && threshold !== null && n >= threshold;
        case 'bottom': return n !== null && threshold !== null && n <= threshold;
        default: return false;
      }
    };
    each((v, ri, ci) => { if (test(v)) applyFmt(a1At(ri, ci), rule.format); });
  }
  return out;
}

// single-file composition: register on the shared namespace
const NScf = (globalThis.Reckon ||= {});
Object.assign(NScf, {
  CF_TYPES, CF_CELL_OPS, CF_FORMULA_CELL_CAP,
  CF_FILL_PRESETS, CF_TEXT_PRESETS, CF_SCALE_PRESETS, CF_BAR_PRESETS,
  hexToRgb, rgbToHex, relLum, contrastRatio, pickTextColor, interpColor, colorScaleColor,
  cfError, normalizeRule, evaluateRules,
});
</script>
<script type="text/reckon-src" id="rk-src::core/datavalid.mjs">
// Reckon — data-validation model + evaluation (Batch M). PURE + DOM-free, so it
// is node-testable AND worker-safe. Unlike conditional formatting (which only
// RENDERS), data validation GATES THE WRITE at the single ingress (handoff §4,
// L4): a proposed USER value that fails a `reject` rule is refused before it
// touches state; a `warn` rule lets the write land but the cell is flagged.
// DV governs USER DATA ENTRY (typed input, paste, window.reckon.setRange), never
// engine-computed formula results — a formula cell's value is never gated.
//
// A rule is per-sheet workbook state {id, type, range, onInvalid, help?, params}
// carried in dataValidations[]; every mutation rides applyTransaction (op
// `dvSet`, undoable, log-replay reconstructs — the whole-array snapshot-inverse
// precedent from cfSet/setMerges). ui/dv-panel.mjs owns the rules-manager DOM;
// ui/dv-dropdown.mjs owns the in-cell list dropdown; both call the validators
// here. The worker resolves engine-dependent context (a list rule's referenced
// range, a custom rule's per-cell formula result) and passes it in, so this
// module stays pure and the main thread never evaluates user text (§10).
//
// Five rule types (the documented 80% + custom): list, number, date, textLength,
// custom. list + number + custom are the priority per the batch spec.
//
// Module contract (single-file doctrine): no imports; reads globalThis.Reckon
// (A1 helpers) inside functions; registers on globalThis.Reckon. Top-level
// identifiers are dv-prefixed so this module can share the concatenated worker
// blob + main module scope with condfmt/schema without a redeclaration clash
// (STATE.md interpretation 37).

export const DV_TYPES = new Set(['list', 'number', 'date', 'textLength', 'custom']);
// number / date / textLength share one comparison op set
export const DV_OPS = new Set(['between', 'notBetween', 'gt', 'lt', 'ge', 'le', 'eq', 'ne']);
export const DV_ON_INVALID = new Set(['reject', 'warn']);
const DV_ID_RE = /^[A-Za-z0-9_-]{1,64}$/;
// list-rule enforcement over a referenced range is bounded so a pathological
// A1:XFD1048576 source can never hang the ingress check or the marker feed
export const DV_LIST_CAP = 10000;

// ---------- value coercion (engine values: number|string|boolean|null|errStr) ----------
const dvNum = (v) => {
  if (v === null || v === undefined) return null;
  if (typeof v === 'number') return Number.isFinite(v) ? v : null;
  if (typeof v === 'boolean') return v ? 1 : 0;
  if (typeof v === 'string') {
    const t = v.trim();
    if (t === '') return null;
    const n = Number(t);
    return Number.isFinite(n) ? n : null;
  }
  return null;
};
const dvBlank = (v) => v === null || v === undefined || (typeof v === 'string' && v.trim() === '');
const dvStr = (v) => (v === null || v === undefined ? '' : String(v));
const dvIsErr = (v) => v && typeof v === 'object' && !!v.err;
// serial-day number for date comparison. Cell date values arrive from the engine
// already as serials (days since 1899-12-30); operands may be that serial or an
// ISO/parseable date string — both normalise to the same axis.
const dvDateNum = (v) => {
  if (typeof v === 'number') return Number.isFinite(v) ? v : null;
  if (typeof v === 'string') {
    const t = v.trim();
    if (t === '') return null;
    const n = Number(t);
    if (Number.isFinite(n)) return n; // a bare serial typed as text
    const ms = Date.parse(t);
    if (!Number.isNaN(ms)) return ms / 86400000 + 25569; // → spreadsheet serial
    return null;
  }
  return null;
};
// case-insensitive string equality for list membership (Excel list match)
const dvStrEq = (a, b) => dvStr(a).trim().toLowerCase() === dvStr(b).trim().toLowerCase();

// ---------- comparison core (number / date / textLength) ----------
const cmp = (op, n, a, b) => {
  if (n === null) return false;
  switch (op) {
    case 'gt': return a !== null && n > a;
    case 'lt': return a !== null && n < a;
    case 'ge': return a !== null && n >= a;
    case 'le': return a !== null && n <= a;
    case 'eq': return a !== null && n === a;
    case 'ne': return a !== null && n !== a;
    case 'between': return a !== null && b !== null && n >= Math.min(a, b) && n <= Math.max(a, b);
    case 'notBetween': return a !== null && b !== null && (n < Math.min(a, b) || n > Math.max(a, b));
    default: return false;
  }
};

// ---------- validation (single ingress: schema validator + tx op both call this) ----------
// Returns an error string or null. Kept strict so a malformed rule is rejected
// at ingress (handoff §4) before it can gate any write.
export function dvError(rule) {
  if (typeof rule !== 'object' || rule === null || Array.isArray(rule)) return 'rule must be an object';
  if (typeof rule.id !== 'string' || !DV_ID_RE.test(rule.id)) return 'invalid rule id';
  if (!DV_TYPES.has(rule.type)) return `invalid rule type "${rule.type}"`;
  const NS = globalThis.Reckon;
  if (typeof rule.range !== 'string' || !NS.parseRangeA1(rule.range)) return 'invalid range (A1 range)';
  if (!DV_ON_INVALID.has(rule.onInvalid)) return 'onInvalid must be "reject" or "warn"';
  if ('help' in rule && rule.help !== null && (typeof rule.help !== 'string' || rule.help.length > 255)) return 'help must be a string (<=255) or null';
  const isScalarOperand = (v) => typeof v === 'string' || typeof v === 'number';
  if (rule.type === 'list') {
    if (rule.source !== 'literal' && rule.source !== 'range') return 'list source must be "literal" or "range"';
    if (rule.source === 'literal') {
      if (!Array.isArray(rule.values) || rule.values.length === 0) return 'list needs a non-empty values array';
      if (rule.values.length > DV_LIST_CAP) return `list has more than ${DV_LIST_CAP} values`;
      for (const v of rule.values) if (typeof v !== 'string' && typeof v !== 'number') return 'list values must be strings or numbers';
    } else {
      if (typeof rule.ref !== 'string' || !NS.parseRangeA1(rule.ref)) return 'list range ref must be an A1 range';
    }
  } else if (rule.type === 'number' || rule.type === 'date' || rule.type === 'textLength') {
    if (!DV_OPS.has(rule.op)) return `invalid ${rule.type} op "${rule.op}"`;
    if (!isScalarOperand(rule.v1)) return 'v1 must be a string or number';
    if ((rule.op === 'between' || rule.op === 'notBetween') && !isScalarOperand(rule.v2)) return 'v2 must be a string or number for between';
  } else if (rule.type === 'custom') {
    if (typeof rule.formula !== 'string' || !rule.formula.startsWith('=')) return 'formula must be a string starting with "="';
    if (rule.formula.length > 8192) return 'formula longer than 8192 chars';
  }
  return null;
}

// fill every top-level field so a stored/cloned rule is field-exact (mirrors
// normalizeRule/normalizeChart in the transaction layer; keeps dvSet snapshot
// inverses byte-stable across JSON-clone and log-replay).
export function normalizeDvRule(rule) {
  const base = {
    id: rule.id, type: rule.type, range: rule.range,
    onInvalid: rule.onInvalid, help: rule.help ?? null,
  };
  if (rule.type === 'list') {
    return rule.source === 'range'
      ? { ...base, source: 'range', ref: rule.ref, values: null }
      : { ...base, source: 'literal', ref: null, values: rule.values.slice() };
  }
  if (rule.type === 'custom') return { ...base, formula: rule.formula };
  // number / date / textLength
  return { ...base, op: rule.op, v1: rule.v1, v2: rule.v2 ?? null };
}

// ---------- single-value test (the ingress gate + the marker feed share this) ----------
// value: an engine-computed / typed scalar (number|string|boolean|null|errStr).
// ctx.listValues: resolved allowed values for a list rule whose source is 'range'
//   (the worker resolves the referenced range; undefined = unresolvable → allow).
// ctx.customResult: the engine result of the rule's per-cell formula (custom).
// A BLANK value is always valid (Excel "ignore blank" default). Returns boolean.
export function dvValueValid(rule, value, ctx = {}) {
  if (dvBlank(value)) return true;
  switch (rule.type) {
    case 'list': {
      const allowed = rule.source === 'range' ? ctx.listValues : rule.values;
      if (!Array.isArray(allowed)) return true; // unresolvable source → cannot gate
      return allowed.some((a) => dvStrEq(a, value));
    }
    case 'number':
      return cmp(rule.op, dvNum(value), dvNum(rule.v1), dvNum(rule.v2));
    case 'date':
      return cmp(rule.op, dvDateNum(value), dvDateNum(rule.v1), dvDateNum(rule.v2));
    case 'textLength':
      return cmp(rule.op, dvStr(value).length, dvNum(rule.v1), dvNum(rule.v2));
    case 'custom': {
      const r = ctx.customResult;
      if (dvIsErr(r)) return false; // an error is not TRUE
      return r === true || (typeof r === 'number' && r !== 0) || (typeof r === 'string' && r.toUpperCase() === 'TRUE');
    }
    default:
      return true;
  }
}

// the allowed values a list rule offers for the dropdown (literal list, or the
// resolved referenced range). rangeValues(ref) -> dense v[][] (worker injects
// regionVals). Non-blank, de-duplicated, order-preserving, capped.
export function dvListValues(rule, rangeValues) {
  if (rule.type !== 'list') return [];
  let raw;
  if (rule.source === 'range') {
    const vals = typeof rangeValues === 'function' ? rangeValues(rule.ref) : null;
    raw = [];
    if (vals && Array.isArray(vals)) {
      for (const row of vals) for (const v of row) { if (!dvBlank(v)) raw.push(v); if (raw.length >= DV_LIST_CAP) break; }
    }
  } else {
    raw = rule.values.slice();
  }
  const seen = new Set();
  const out = [];
  for (const v of raw) {
    const s = dvStr(v);
    const k = s.trim().toLowerCase();
    if (seen.has(k)) continue;
    seen.add(k);
    out.push(s);
    if (out.length >= DV_LIST_CAP) break;
  }
  return out;
}

// ---------- range covering the ingress: the first rule (array order) whose range
// contains a1 governs that cell for enforcement (Excel: one DV per cell). ----------
export function dvRuleForCell(rules, a1) {
  const NS = globalThis.Reckon;
  const p = NS.parseA1(a1);
  if (!p) return null;
  for (const rule of rules ?? []) {
    const rg = NS.parseRangeA1(rule.range);
    if (!rg) continue;
    if (p.col >= rg.start.col && p.col <= rg.end.col && p.row >= rg.start.row && p.row <= rg.end.row) return rule;
  }
  return null;
}

// ---------- render-time marker feed ----------
// Evaluate every rule over its range's CURRENT computed values and collect the
// cells that violate (non-blank only — blanks are always allowed). Returns
// Map(a1 -> ruleId). Mirrors condfmt.evaluateRules: the worker's display feed
// layers this into sd.dv so the grid draws an invalid marker. First covering
// rule wins per cell.
//   getRangeValues(a1Range) -> { start:{col,row}, values: v[][] }
//   opts.formulaEval(formula, dr, dc) -> engine value (custom rules)
//   opts.listValuesFor(ref) -> resolved v[][] (list-range rules)
export function evaluateValidity(rules, getRangeValues, opts = {}) {
  const NS = globalThis.Reckon;
  const out = new Map();
  for (const raw of rules ?? []) {
    if (dvError(raw)) continue; // defensive; ingress already validated
    const rule = normalizeDvRule(raw);
    const rg = getRangeValues(rule.range);
    if (!rg || !Array.isArray(rg.values) || !rg.values.length) continue;
    const { start, values } = rg;
    // resolve engine context once per rule
    let listValues;
    if (rule.type === 'list' && rule.source === 'range' && typeof opts.listValuesFor === 'function') {
      listValues = dvListValues(rule, opts.listValuesFor);
    } else if (rule.type === 'list') {
      listValues = rule.values;
    }
    values.forEach((row, ri) => row.forEach((v, ci) => {
      if (dvBlank(v)) return;
      const a1 = NS.toA1(start.col + ci, start.row + ri);
      if (out.has(a1)) return; // first covering rule wins
      let ctx = {};
      if (rule.type === 'list') ctx = { listValues };
      else if (rule.type === 'custom' && typeof opts.formulaEval === 'function') {
        ctx = { customResult: opts.formulaEval(rule.formula, ri, ci) };
      }
      if (!dvValueValid(rule, v, ctx)) out.set(a1, rule.id);
    }));
  }
  return out;
}

// single-file composition: register on the shared namespace
const NSdv = (globalThis.Reckon ||= {});
Object.assign(NSdv, {
  DV_TYPES, DV_OPS, DV_ON_INVALID, DV_LIST_CAP,
  dvError, normalizeDvRule, dvValueValid, dvListValues, dvRuleForCell, evaluateValidity,
});
</script>
<script type="text/reckon-src" id="rk-src::core/pivot.mjs">
// Reckon — pivot-table model + aggregation engine (Batch N, schema v5). A pivot
// aggregates a source range (first row = field headers) by row/col fields into a
// 2-D result with grand totals. This module is PURE + DOM-free (no engine, no
// imports): it takes the source range's already-computed values as a dense 2-D
// array and returns the aggregated table, so it runs unchanged in the worker
// (where the heavy grouping belongs — large sources must not block the main
// thread, handoff §10) and is node-testable.
//
// It is NOT a SQL/query surface (that is NakliData, handoff §13/L10) — it is a
// spreadsheet PivotTable: group-by + aggregate over a rectangular range.
//
// Module contract (single-file doctrine): no imports; deps read lazily off
// globalThis.Reckon; registers itself there. Top-level identifiers are
// pivot-/pv-prefixed so the shared main-thread module scope never sees a
// redeclaration clash (interp 37).

// aggregations (handoff Batch N): the documented set
export const PIVOT_AGGS = new Set(['sum', 'count', 'countUnique', 'average', 'min', 'max']);
const PIVOT_ID_RE = /^[A-Za-z0-9_-]{1,64}$/;
// guard the group scan: a source larger than this yields a truncated result
// rather than an unbounded worker stall (same order as the API/INDIRECT caps).
export const PIVOT_MAX_CELLS = 500000;

const pvAggLabelKeys = {
  sum: 'pivot.agg.sum', count: 'pivot.agg.count', countUnique: 'pivot.agg.countUnique',
  average: 'pivot.agg.average', min: 'pivot.agg.min', max: 'pivot.agg.max',
};
const pvAggLabelFallback = {
  sum: 'Sum', count: 'Count', countUnique: 'Unique', average: 'Average', min: 'Min', max: 'Max',
};
// "Sum of Sales" — localised head, verbatim field
export function pivotValueLabel(vf) {
  const NS = globalThis.Reckon;
  const head = (NS && NS.t) ? NS.t(pvAggLabelKeys[vf.agg] || '') : null;
  const agg = head && head !== pvAggLabelKeys[vf.agg] ? head : (pvAggLabelFallback[vf.agg] || vf.agg);
  const of = (NS && NS.t && NS.t('pivot.of') !== 'pivot.of') ? NS.t('pivot.of') : 'of';
  return `${agg} ${of} ${vf.field}`;
}

// ---------- validation (schema v5) ----------
// pivotError lives here (not core/schema.mjs) and is read lazily by the validator
// off the shared namespace — same lazy-NS pattern as cfError/dvError (interp 33).
export function pivotError(p) {
  const NS = globalThis.Reckon;
  const parseRange = NS && NS.parseRangeA1;
  const parseCell = NS && NS.parseA1;
  if (typeof p !== 'object' || p === null || Array.isArray(p)) return 'pivot must be an object';
  if (typeof p.id !== 'string' || !PIVOT_ID_RE.test(p.id)) return 'invalid pivot id';
  if (typeof p.sourceRange !== 'string' || (parseRange && !parseRange(p.sourceRange))) return 'invalid sourceRange (A1 range)';
  for (const axis of ['rows', 'cols']) {
    if (axis in p) {
      if (!Array.isArray(p[axis]) || p[axis].length > 64) return `${axis} must be an array (<=64)`;
      for (const f of p[axis]) if (typeof f !== 'string' || f.length === 0 || f.length > 255) return `${axis} field must be a non-empty string`;
    }
  }
  if (!Array.isArray(p.values) || p.values.length === 0 || p.values.length > 64) return 'values must be a non-empty array (<=64)';
  for (const v of p.values) {
    if (typeof v !== 'object' || v === null || Array.isArray(v)) return 'each value must be an object';
    if (typeof v.field !== 'string' || v.field.length === 0 || v.field.length > 255) return 'value field must be a non-empty string';
    if (!PIVOT_AGGS.has(v.agg)) return `invalid aggregation "${v.agg}"`;
  }
  if ('filters' in p) {
    if (!Array.isArray(p.filters) || p.filters.length > 64) return 'filters must be an array (<=64)';
    for (const f of p.filters) {
      if (typeof f !== 'object' || f === null || Array.isArray(f)) return 'each filter must be an object';
      if (typeof f.field !== 'string' || f.field.length === 0) return 'filter field must be a non-empty string';
      if (!Array.isArray(f.values)) return 'filter values must be an array';
      for (const val of f.values) if (val !== null && typeof val !== 'string' && typeof val !== 'number' && typeof val !== 'boolean') return 'filter value must be scalar';
    }
  }
  if (typeof p.position !== 'string' || (parseCell && !parseCell(p.position))) return 'position must be an A1 cell';
  if ('title' in p && p.title !== null && (typeof p.title !== 'string' || p.title.length > 255)) return 'title must be a string (<=255) or null';
  if ('options' in p && (typeof p.options !== 'object' || p.options === null || Array.isArray(p.options))) return 'options must be an object';
  return null;
}

const pvClone = (x) => (x === undefined ? undefined : JSON.parse(JSON.stringify(x)));

// field-exact normalised copy (every stored/cloned pivot is byte-stable, so a
// pivotSet snapshot inverse survives JSON-clone — mirrors normalizeChart/Rule)
export function normalizePivot(p) {
  return {
    id: p.id,
    sourceRange: p.sourceRange,
    rows: pvClone(p.rows) ?? [],
    cols: pvClone(p.cols) ?? [],
    values: (pvClone(p.values) ?? []).map((v) => ({ field: v.field, agg: v.agg })),
    filters: (pvClone(p.filters) ?? []).map((f) => ({ field: f.field, values: pvClone(f.values) ?? [] })),
    position: p.position,
    title: p.title ?? null,
    options: pvClone(p.options) ?? {},
  };
}

// ---------- field names from the source header row ----------
export function pivotFieldNames(values2d) {
  if (!Array.isArray(values2d) || values2d.length === 0) return [];
  const header = values2d[0] || [];
  const out = [];
  const seen = new Set();
  header.forEach((h, i) => {
    let name = (h === null || h === undefined || h === '') ? `Column ${i + 1}` : String(h);
    // de-dup so a repeated header still yields a usable, distinct label
    let name0 = name; let k = 2;
    while (seen.has(name)) { name = `${name0} (${k})`; k += 1; }
    seen.add(name);
    out.push(name);
  });
  return out;
}

// ---------- aggregation ----------
const pvIsBlank = (v) => v === null || v === undefined || v === '';
const pvNum = (v) => {
  if (typeof v === 'number') return Number.isFinite(v) ? v : null;
  if (typeof v === 'boolean') return v ? 1 : 0;
  if (typeof v === 'string' && v.trim() !== '') { const n = Number(v); return Number.isFinite(n) ? n : null; }
  return null;
};
// aggregate a raw value list -> number | null. Empty scope -> null (blank cell,
// Excel-honest); a numeric agg with records but no numerics -> null too.
const pvAggregate = (agg, vals) => {
  if (agg === 'count') { let n = 0; for (const v of vals) if (!pvIsBlank(v)) n += 1; return n === 0 ? null : n; }
  if (agg === 'countUnique') { const s = new Set(); for (const v of vals) if (!pvIsBlank(v)) s.add(typeof v === 'number' ? v : String(v)); return s.size === 0 ? null : s.size; }
  const nums = [];
  for (const v of vals) { const n = pvNum(v); if (n !== null) nums.push(n); }
  if (nums.length === 0) return null;
  switch (agg) {
    case 'sum': return nums.reduce((a, b) => a + b, 0);
    case 'average': return nums.reduce((a, b) => a + b, 0) / nums.length;
    case 'min': return Math.min(...nums);
    case 'max': return Math.max(...nums);
    default: return null;
  }
};

// stable key for a tuple of raw values (used for grouping + sorting display)
const pvKeyOf = (tuple) => JSON.stringify(tuple.map((v) => (pvIsBlank(v) ? null : (typeof v === 'number' ? { n: v } : String(v)))));
const pvDisplayTuple = (tuple, blankLabel) => tuple.map((v) => (pvIsBlank(v) ? blankLabel : (typeof v === 'boolean' ? (v ? 'TRUE' : 'FALSE') : String(v))));
// element-wise tuple compare: numbers numerically, else by string
const pvCmpTuple = (a, b) => {
  const n = Math.max(a.length, b.length);
  for (let i = 0; i < n; i += 1) {
    const x = a[i]; const y = b[i];
    const xb = pvIsBlank(x); const yb = pvIsBlank(y);
    if (xb && yb) continue;
    if (xb) return 1; if (yb) return -1; // blanks sink
    if (typeof x === 'number' && typeof y === 'number') { if (x !== y) return x - y; continue; }
    const c = String(x).localeCompare(String(y));
    if (c !== 0) return c;
  }
  return 0;
};

// computePivot(def, values2d, {locale}) -> structured result. values2d is the
// source range's computed values INCLUDING the header row. The result carries
// everything the renderer needs; the aggregation (body + totals) is what the
// unit tests pin. Totals are RE-AGGREGATED over the underlying value lists (never
// derived from cell aggregates — average/min/max/countUnique of aggregates is
// wrong), so every total is honest.
export function computePivot(def, values2d, { blankLabel = '(blank)' } = {}) {
  const rowsF = def.rows || [];
  const colsF = def.cols || [];
  const valuesF = (def.values || []).map((v) => ({ field: v.field, agg: v.agg, label: pivotValueLabel(v) }));
  const filters = def.filters || [];
  const empty = {
    ok: true, rowFields: rowsF.slice(), colFields: colsF.slice(), valueFields: valuesF,
    rowKeys: [], colKeys: [], body: [], rowTotals: [], colTotals: [], grandTotals: valuesF.map(() => null),
    fields: pivotFieldNames(values2d), recordCount: 0, truncated: false,
  };
  if (!Array.isArray(values2d) || values2d.length < 1) return empty;
  const header = values2d[0] || [];
  const fieldIdx = new Map();
  header.forEach((h, i) => { const name = (pvIsBlank(h)) ? `Column ${i + 1}` : String(h); if (!fieldIdx.has(name)) fieldIdx.set(name, i); });
  const idxOf = (name) => (fieldIdx.has(name) ? fieldIdx.get(name) : -1);

  const records = values2d.slice(1);
  const truncated = records.length * Math.max(1, header.length) > PIVOT_MAX_CELLS;
  const used = truncated ? records.slice(0, Math.floor(PIVOT_MAX_CELLS / Math.max(1, header.length))) : records;

  // filter predicate (include-list membership, string-compared)
  const filterSets = filters.map((f) => ({ idx: idxOf(f.field), set: new Set((f.values || []).map((v) => String(v))) }));
  const passes = (rec) => {
    for (const { idx, set } of filterSets) {
      if (idx < 0) continue;
      if (set.size === 0) continue; // an empty include-list is "no restriction"
      const v = rec[idx];
      if (!set.has(pvIsBlank(v) ? '' : String(v))) return false;
    }
    return true;
  };

  const rowIdx = rowsF.map(idxOf);
  const colIdx = colsF.map(idxOf);
  const valIdx = valuesF.map((v) => idxOf(v.field));

  // grouping: bucket[rowKey][colKey] = per-value-field arrays of raw values
  const rowMap = new Map(); // rowKey -> {tuple, cols: Map(colKey -> {tuple, vals:[[]]})}
  const colMap = new Map(); // colKey -> tuple (distinct)
  let recordCount = 0;
  for (const rec of used) {
    if (!passes(rec)) continue;
    recordCount += 1;
    const rTuple = rowIdx.map((i) => (i < 0 ? null : rec[i]));
    const cTuple = colIdx.map((i) => (i < 0 ? null : rec[i]));
    const rKey = pvKeyOf(rTuple);
    const cKey = pvKeyOf(cTuple);
    if (!colMap.has(cKey)) colMap.set(cKey, cTuple);
    let rEntry = rowMap.get(rKey);
    if (!rEntry) { rEntry = { tuple: rTuple, cols: new Map() }; rowMap.set(rKey, rEntry); }
    let cEntry = rEntry.cols.get(cKey);
    if (!cEntry) { cEntry = valuesF.map(() => []); rEntry.cols.set(cKey, cEntry); }
    valIdx.forEach((i, vi) => { cEntry[vi].push(i < 0 ? null : rec[i]); });
  }

  // sorted distinct keys
  const rowEntries = [...rowMap.entries()].sort((a, b) => pvCmpTuple(a[1].tuple, b[1].tuple));
  const colEntries = [...colMap.entries()].sort((a, b) => pvCmpTuple(a[1], b[1]));
  const rowKeys = rowEntries.map(([, e]) => pvDisplayTuple(e.tuple, blankLabel));
  const colKeys = colEntries.map(([, tuple]) => pvDisplayTuple(tuple, blankLabel));

  // body[r][c] = [aggForVf0, aggForVf1, ...]; totals re-aggregate over unions
  const body = [];
  const rowTotals = [];
  const grandLists = valuesF.map(() => []);
  const colLists = colEntries.map(() => valuesF.map(() => []));
  for (const [, rEntry] of rowEntries) {
    const bodyRow = [];
    const rowUnion = valuesF.map(() => []);
    colEntries.forEach(([cKey], ci) => {
      const cEntry = rEntry.cols.get(cKey);
      const cell = valuesF.map((vf, vi) => {
        const list = cEntry ? cEntry[vi] : [];
        if (cEntry) { for (const v of list) { rowUnion[vi].push(v); colLists[ci][vi].push(v); grandLists[vi].push(v); } }
        return pvAggregate(vf.agg, list);
      });
      bodyRow.push(cell);
    });
    body.push(bodyRow);
    rowTotals.push(valuesF.map((vf, vi) => pvAggregate(vf.agg, rowUnion[vi])));
  }
  const colTotals = colEntries.map((_, ci) => valuesF.map((vf, vi) => pvAggregate(vf.agg, colLists[ci][vi])));
  const grandTotals = valuesF.map((vf, vi) => pvAggregate(vf.agg, grandLists[vi]));

  return {
    ok: true, rowFields: rowsF.slice(), colFields: colsF.slice(), valueFields: valuesF,
    rowKeys, colKeys, body, rowTotals, colTotals, grandTotals,
    fields: pivotFieldNames(values2d), recordCount, truncated,
  };
}

// single-file composition: register on the shared namespace
const NSpv = (globalThis.Reckon ||= {});
Object.assign(NSpv, { PIVOT_AGGS, PIVOT_MAX_CELLS, pivotError, normalizePivot, computePivot, pivotFieldNames, pivotValueLabel });
</script>
<script type="text/reckon-src" id="rk-src::engine/adapter.mjs">
// Reckon — engine adapter over HyperFormula 3.4.0 (M0 winner B).
// v1.0 code only ever talks to this adapter (handoff §4). All Excel-parity
// gaps recorded in M0 (m0/DECISION.md) are fixed HERE, at the seam:
//   MOD / INT floor semantics, TEXT format patterns, EDATE month-end clamping
//   (leap-aware), INDIRECT (absent from HyperFormula entirely).
// Plus the M0 seam functions RANK, MODE, AVERAGEIFS and TRUE/FALSE literals.
//
// Module contract (single-file doctrine): no imports; the HyperFormula
// namespace (UMD global or node module namespace) is injected; registers on
// globalThis.Reckon for concatenated worker/inline builds.

// ---------- local A1 helpers (kept self-contained; mirror core/schema.mjs) ----------
const colToIdx_ = (letters) => {
  let n = 0;
  for (const ch of letters) n = n * 26 + (ch.charCodeAt(0) - 64);
  return n - 1;
};
const idxToCol_ = (c) => {
  let s = '';
  c += 1;
  while (c > 0) { const m = (c - 1) % 26; s = String.fromCharCode(65 + m) + s; c = (c - m - 1) / 26; }
  return s;
};
const parseA1_ = (a1) => {
  const m = /^\$?([A-Z]{1,3})\$?([0-9]+)$/.exec(a1);
  if (!m) throw new Error(`bad A1 address: ${a1}`);
  return { col: colToIdx_(m[1]), row: Number(m[2]) - 1 };
};
const parseRange_ = (rg) => {
  const [a, b] = String(rg).split(':');
  const s = parseA1_(a); const e = parseA1_(b ?? a);
  return {
    start: { col: Math.min(s.col, e.col), row: Math.min(s.row, e.row) },
    end: { col: Math.max(s.col, e.col), row: Math.max(s.row, e.row) },
  };
};

const ERR_RE = /^#(DIV\/0!|N\/A|NAME\?|NULL!|NUM!|REF!|VALUE!|SPILL!|CALC!|CYCLE!|ERROR!)$/;

// ---------- Excel date helpers (1900 system, epoch 1899-12-30, as HF default) ----------
const DAY_MS = 86400000;
const EPOCH = Date.UTC(1899, 11, 30);
const serialToDate = (n) => new Date(EPOCH + Math.trunc(n) * DAY_MS);
const ymdToSerial = (y, m0, d) => (Date.UTC(y, m0, d) - EPOCH) / DAY_MS;
const daysInMonth = (y, m0) => new Date(Date.UTC(y, m0 + 1, 0)).getUTCDate();

// ---------- Excel TEXT() mini-formatter ----------
// Supports the working subset: number masks (0, #, ?, grouping comma, decimal
// point, %, quoted literals, currency/sign literals, thousands-scaling
// trailing commas), date/time masks (yyyy yy mmmm mmm mm m dddd ddd dd d hh h
// mm ss AM/PM), sections pos;neg;zero;text, and the @ text placeholder.
const MONTHS = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];
const DAYS = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];

const stripQuoted = (fmt) => fmt.replace(/"[^"]*"/g, '');
const isDateFormat = (fmt) => {
  const s = stripQuoted(fmt);
  if (/[#0?]/.test(s)) return false;
  return /(y|d|h|s|am\/pm)/i.test(s) || /^m+$/i.test(s.replace(/[^a-z]/gi, ''));
};

function formatDateSerial(serial, fmt) {
  if (serial < 0) return null; // #VALUE! in Excel
  const whole = Math.floor(serial);
  const frac = serial - whole;
  const d = new Date(EPOCH + whole * DAY_MS);
  let secs = Math.round(frac * 86400);
  let hh = Math.floor(secs / 3600); secs -= hh * 3600;
  const mi = Math.floor(secs / 60); const ss = secs - mi * 60;
  const ampm = /am\/pm/i.test(stripQuoted(fmt));
  const h12 = ampm ? ((hh % 12) || 12) : hh;
  const toks = [];
  const re = /("[^"]*")|am\/pm|yyyy|yyy|yy|y|mmmm|mmm|mm|m|dddd|ddd|dd|d|hh|h|ss|s|./giy;
  let m;
  while ((m = re.exec(fmt)) !== null) toks.push(m[0]);
  // month-vs-minute: an m-token is minutes when the previous time token is an
  // hour or the next time token is a second.
  const kinds = toks.map((t) => {
    const lower = t.toLowerCase();
    if (t.startsWith('"')) return 'lit';
    if (lower === 'am/pm') return 'ampm';
    if (/^y+$/.test(lower)) return 'y';
    if (/^m+$/.test(lower)) return 'm';
    if (/^d+$/.test(lower)) return 'd';
    if (/^h+$/.test(lower)) return 'h';
    if (/^s+$/.test(lower)) return 's';
    return 'lit';
  });
  const out = toks.map((t, i) => {
    const lower = t.toLowerCase();
    const kind = kinds[i];
    if (kind === 'lit') return t.startsWith('"') ? t.slice(1, -1) : t;
    if (kind === 'ampm') return (Math.floor(frac * 24) % 24) < 12 ? 'AM' : 'PM';
    const pad = (n, w) => String(n).padStart(w, '0');
    if (kind === 'y') return lower.length >= 3 ? String(d.getUTCFullYear()) : pad(d.getUTCFullYear() % 100, 2);
    if (kind === 'd') {
      if (lower.length >= 4) return DAYS[d.getUTCDay()];
      if (lower.length === 3) return DAYS[d.getUTCDay()].slice(0, 3);
      return pad(d.getUTCDate(), lower.length);
    }
    if (kind === 'h') return pad(h12, lower.length);
    if (kind === 's') return pad(ss, lower.length);
    // m: month or minute — minutes when preceded by an hour token or followed by a seconds token
    let minutes = false;
    for (let j = i - 1; j >= 0; j--) if (kinds[j] !== 'lit') { if (kinds[j] === 'h') minutes = true; break; }
    if (!minutes) for (let j = i + 1; j < kinds.length; j++) if (kinds[j] !== 'lit') { if (kinds[j] === 's') minutes = true; break; }
    if (minutes) return pad(mi, lower.length);
    if (lower.length >= 4) return MONTHS[d.getUTCMonth()];
    if (lower.length === 3) return MONTHS[d.getUTCMonth()].slice(0, 3);
    return pad(d.getUTCMonth() + 1, lower.length);
  });
  return out.join('');
}

function formatNumber(value, fmt) {
  // tokenize preserving quoted literals
  const toks = [];
  const re = /("[^"]*")|./gy;
  let m;
  while ((m = re.exec(fmt)) !== null) toks.push(m[0]);
  // percent scaling
  const pctCount = toks.filter((t) => t === '%').length;
  let v = value * Math.pow(100, pctCount);
  // digit-mask span: first to last of [#0?,.]
  const isMaskChar = (t) => t === '#' || t === '0' || t === '?' || t === ',' || t === '.';
  let first = -1; let last = -1;
  toks.forEach((t, i) => { if (isMaskChar(t)) { if (first === -1) first = i; last = i; } });
  if (first === -1) {
    // no digit mask: literals only
    return toks.map((t) => (t.startsWith('"') ? t.slice(1, -1) : t)).join('');
  }
  const mask = toks.slice(first, last + 1).join('');
  // thousands scaling: trailing commas on the mask
  const scaleMatch = /,+$/.exec(mask);
  const coreMask = scaleMatch ? mask.slice(0, -scaleMatch[0].length) : mask;
  if (scaleMatch) v /= Math.pow(1000, scaleMatch[0].length);
  const dot = coreMask.indexOf('.');
  const intMask = dot === -1 ? coreMask : coreMask.slice(0, dot);
  const fracMask = dot === -1 ? '' : coreMask.slice(dot + 1);
  const fracMax = (fracMask.match(/[#0?]/g) ?? []).length;
  const fracMin = (fracMask.match(/0/g) ?? []).length;
  const grouping = intMask.includes(',');
  const intMin = (intMask.match(/0/g) ?? []).length;

  const neg = v < 0;
  const abs = Math.abs(v);
  const rounded = fracMax > 0 ? abs.toFixed(fracMax) : String(Math.round(abs));
  let [intStr, fracStr = ''] = rounded.split('.');
  // trim frac to minimum (drop trailing zeros beyond fracMin)
  while (fracStr.length > fracMin && fracStr.endsWith('0')) fracStr = fracStr.slice(0, -1);
  if (intStr.length < intMin) intStr = intStr.padStart(intMin, '0');
  if (intStr === '0' && intMin === 0 && /^#+,?#*$/.test(intMask.replace(/,/g, ''))) intStr = ''; // pure-# mask hides bare zero
  if (grouping && intStr.length > 3) intStr = intStr.replace(/\B(?=(\d{3})+(?!\d))/g, ',');
  const num = intStr + (fracStr.length ? '.' + fracStr : (fracMin > 0 ? '.' + '0'.repeat(fracMin) : ''));

  const prefix = toks.slice(0, first).filter((t) => t !== '%').map((t) => (t.startsWith('"') ? t.slice(1, -1) : t)).join('');
  const suffix = toks.slice(last + 1).map((t) => (t.startsWith('"') ? t.slice(1, -1) : t)).join('');
  return (neg ? '-' : '') + prefix + num + suffix;
}

export function excelText(value, fmt) {
  if (typeof value === 'string') {
    if (fmt.includes('@')) return fmt.replace(/@/g, value).replace(/"([^"]*)"/g, '$1');
    return value;
  }
  if (typeof value === 'boolean') return value ? 'TRUE' : 'FALSE';
  const sections = [];
  {
    // split on ';' outside quotes
    let cur = ''; let inQ = false;
    for (const ch of fmt) {
      if (ch === '"') { inQ = !inQ; cur += ch; }
      else if (ch === ';' && !inQ) { sections.push(cur); cur = ''; }
      else cur += ch;
    }
    sections.push(cur);
  }
  let sec = sections[0];
  let v = value;
  if (sections.length >= 2 && value < 0) { sec = sections[1]; v = Math.abs(value); }
  else if (sections.length >= 3 && value === 0) sec = sections[2];
  if (sec.includes('@')) return sec.replace(/@/g, String(value)).replace(/"([^"]*)"/g, '$1');
  if (isDateFormat(sec)) {
    const out = formatDateSerial(v, sec);
    return out === null ? { error: 'VALUE' } : out;
  }
  return formatNumber(v, sec);
}

// ---------- HyperFormula seam registration (static, idempotent) ----------
const HF_OPTS = {
  licenseKey: 'gpl-v3',
  useArrayArithmetic: true,
  smartRounding: true,
  evaluateNullToZero: true, // Excel parity: empty-cell reference evaluates to 0
};

function resolveNamespace(HF) {
  // Accept either the UMD global (class with statics attached) or the node
  // module namespace ({ HyperFormula, FunctionPlugin, ... }).
  const cls = HF.HyperFormula ?? HF;
  const ns = HF.FunctionPlugin ? HF : cls;
  if (typeof cls.buildEmpty !== 'function' || !ns.FunctionPlugin) throw new Error('HyperFormula namespace not resolvable');
  return { cls, ns };
}

const SEAM_FLAG = '__reckonSeamRegistered';

export function ensureSeamRegistered(HF) {
  const { cls, ns } = resolveNamespace(HF);
  if (cls[SEAM_FLAG]) return { cls, ns };
  const { FunctionPlugin, FunctionArgumentType, CellError, ErrorType, SimpleRangeValue } = ns;

  // Excel-divergent BUILT-INS are replaced at the seam (M0 recorded gaps).
  for (const fn of ['MOD', 'INT', 'TEXT', 'EDATE']) {
    try { cls.unregisterFunction(fn); } catch { /* not registered / already removed */ }
  }

  const parseCriterion = (c) => {
    if (typeof c === 'number' || typeof c === 'boolean') return (x) => x === c;
    const m = /^(<=|>=|<>|=|<|>)?([\s\S]*)$/.exec(String(c));
    const op = m[1] || '=';
    const rhsRaw = m[2];
    const rhsNum = rhsRaw !== '' && !isNaN(Number(rhsRaw)) ? Number(rhsRaw) : null;
    return (x) => {
      if (rhsNum !== null) {
        if (typeof x !== 'number') return op === '<>';
        switch (op) {
          case '=': return x === rhsNum; case '<>': return x !== rhsNum;
          case '>': return x > rhsNum; case '<': return x < rhsNum;
          case '>=': return x >= rhsNum; case '<=': return x <= rhsNum;
        }
      }
      const xs = x === null || x === undefined ? '' : String(x).toLowerCase();
      const rs = rhsRaw.toLowerCase();
      if (op === '=') return xs === rs;
      if (op === '<>') return xs !== rs;
      return false;
    };
  };

  const INDIRECT_RE = /^(?:'([^']+)'!|([^'!]+)!)?\$?([A-Za-z]{1,3})\$?([0-9]+)(?::\$?([A-Za-z]{1,3})\$?([0-9]+))?$/;

  class ReckonSeamFunctions extends FunctionPlugin {
    mod(ast, state) {
      return this.runFunction(ast.args, state, this.metadata('MOD'), (n, d) => {
        if (d === 0) return new CellError(ErrorType.DIV_BY_ZERO, 'division by zero');
        return n - d * Math.floor(n / d); // Excel: result takes the divisor's sign
      });
    }
    int(ast, state) {
      return this.runFunction(ast.args, state, this.metadata('INT'), (x) => Math.floor(x)); // Excel INT floors
    }
    text(ast, state) {
      return this.runFunction(ast.args, state, this.metadata('TEXT'), (value, fmt) => {
        const out = excelText(value, String(fmt));
        if (out && typeof out === 'object' && out.error) return new CellError(ErrorType.VALUE, 'unformattable');
        return out;
      });
    }
    edate(ast, state) {
      return this.runFunction(ast.args, state, this.metadata('EDATE'), (start, months) => {
        if (start < 0) return new CellError(ErrorType.NUM, 'date before epoch');
        const d = serialToDate(start);
        const target = d.getUTCMonth() + Math.trunc(months);
        const ty = d.getUTCFullYear() + Math.floor(target / 12);
        const tm = ((target % 12) + 12) % 12;
        const day = Math.min(d.getUTCDate(), daysInMonth(ty, tm)); // month-end clamp, leap-aware
        const serial = ymdToSerial(ty, tm, day);
        return serial < 0 ? new CellError(ErrorType.NUM, 'result before epoch') : serial;
      });
    }
    indirect(ast, state) {
      return this.runFunction(ast.args, state, this.metadata('INDIRECT'), (txt, a1Style) => {
        if (a1Style === false) return new CellError(ErrorType.REF, 'R1C1 style not supported');
        const m = INDIRECT_RE.exec(String(txt).trim());
        if (!m) return new CellError(ErrorType.REF, 'invalid reference text');
        let sheet = state.formulaAddress.sheet;
        const sheetName = m[1] ?? m[2];
        if (sheetName !== undefined) {
          const sid = this.dependencyGraph.sheetMapping.getSheetId(sheetName);
          if (sid === undefined) return new CellError(ErrorType.REF, 'no such sheet');
          sheet = sid;
        }
        const c1 = colToIdx_(m[3].toUpperCase()); const r1 = Number(m[4]) - 1;
        const read = (col, row) => {
          try { return this.dependencyGraph.getCellValue({ sheet, col, row }); }
          catch { return new CellError(ErrorType.REF, 'RK_PENDING'); } // target not computed yet; settle pass re-runs
        };
        if (m[5] === undefined) return read(c1, r1);
        const c2 = colToIdx_(m[5].toUpperCase()); const r2 = Number(m[6]) - 1;
        // Bound the manual expansion: unlike native ranges (lazy in HF), INDIRECT
        // expands every cell here, and settleIndirect re-runs it up to 3x. A huge
        // literal range (e.g. INDIRECT("A1:XFD1048576")) is billions of reads —
        // a permanent worker hang. Cap it and surface a #NUM! instead.
        const cellCount = (Math.abs(r2 - r1) + 1) * (Math.abs(c2 - c1) + 1);
        if (cellCount > 500000) return new CellError(ErrorType.NUM, 'INDIRECT range too large');
        const data = [];
        for (let r = Math.min(r1, r2); r <= Math.max(r1, r2); r++) {
          const rowVals = [];
          for (let c = Math.min(c1, c2); c <= Math.max(c1, c2); c++) {
            const v = read(c, r);
            if (v instanceof CellError && v.message === 'RK_PENDING') return v;
            rowVals.push(v);
          }
          data.push(rowVals);
        }
        return SimpleRangeValue.onlyValues(data);
      });
    }
    rank(ast, state) {
      return this.runFunction(ast.args, state, this.metadata('RANK'), (value, range, order) => {
        const vals = range.valuesFromTopLeftCorner().filter((x) => typeof x === 'number');
        if (!vals.includes(value)) return new CellError(ErrorType.NA, 'value not found in ref');
        return 1 + (order === 0 ? vals.filter((x) => x > value).length : vals.filter((x) => x < value).length);
      });
    }
    mode(ast, state) {
      return this.runFunction(ast.args, state, this.metadata('MODE'), (...args) => {
        const nums = [];
        for (const a of args) {
          if (a && typeof a.valuesFromTopLeftCorner === 'function') nums.push(...a.valuesFromTopLeftCorner().filter((x) => typeof x === 'number'));
          else if (typeof a === 'number') nums.push(a);
        }
        const counts = new Map();
        for (const n of nums) counts.set(n, (counts.get(n) ?? 0) + 1);
        let best = null; let bestC = 1;
        for (const n of nums) { const c = counts.get(n); if (c > bestC) { best = n; bestC = c; } }
        if (best === null) return new CellError(ErrorType.NA, 'no repeated value');
        return best;
      });
    }
    averageifs(ast, state) {
      return this.runFunction(ast.args, state, this.metadata('AVERAGEIFS'), (avgRange, ...crits) => {
        const avg = avgRange.valuesFromTopLeftCorner();
        const preds = [];
        for (let i = 0; i < crits.length; i += 2) {
          const rangeVals = crits[i].valuesFromTopLeftCorner();
          if (rangeVals.length !== avg.length) return new CellError(ErrorType.VALUE, 'range size mismatch');
          preds.push({ vals: rangeVals, test: parseCriterion(crits[i + 1]) });
        }
        let sum = 0; let n = 0;
        for (let j = 0; j < avg.length; j++) {
          if (preds.every((p) => p.test(p.vals[j])) && typeof avg[j] === 'number') { sum += avg[j]; n += 1; }
        }
        if (n === 0) return new CellError(ErrorType.DIV_BY_ZERO, 'no cells matched');
        return sum / n;
      });
    }
  }
  ReckonSeamFunctions.implementedFunctions = {
    MOD: { method: 'mod', parameters: [
      { argumentType: FunctionArgumentType.NUMBER },
      { argumentType: FunctionArgumentType.NUMBER },
    ] },
    INT: { method: 'int', parameters: [{ argumentType: FunctionArgumentType.NUMBER }] },
    TEXT: { method: 'text', parameters: [
      { argumentType: FunctionArgumentType.NOERROR },
      { argumentType: FunctionArgumentType.STRING },
    ] },
    EDATE: { method: 'edate', parameters: [
      { argumentType: FunctionArgumentType.NUMBER },
      { argumentType: FunctionArgumentType.NUMBER },
    ] },
    INDIRECT: { method: 'indirect', isVolatile: true, parameters: [
      { argumentType: FunctionArgumentType.STRING },
      { argumentType: FunctionArgumentType.BOOLEAN, defaultValue: true },
    ] },
    RANK: { method: 'rank', parameters: [
      { argumentType: FunctionArgumentType.NUMBER },
      { argumentType: FunctionArgumentType.RANGE },
      { argumentType: FunctionArgumentType.NUMBER, defaultValue: 0 },
    ] },
    MODE: { method: 'mode', repeatLastArgs: 1, parameters: [{ argumentType: FunctionArgumentType.ANY }] },
    AVERAGEIFS: { method: 'averageifs', repeatLastArgs: 2, parameters: [
      { argumentType: FunctionArgumentType.RANGE },
      { argumentType: FunctionArgumentType.RANGE },
      { argumentType: FunctionArgumentType.NOERROR },
    ] },
  };
  cls.registerFunctionPlugin(ReckonSeamFunctions, {
    enGB: {
      MOD: 'MOD', INT: 'INT', TEXT: 'TEXT', EDATE: 'EDATE', INDIRECT: 'INDIRECT',
      RANK: 'RANK', MODE: 'MODE', AVERAGEIFS: 'AVERAGEIFS',
    },
  });
  cls[SEAM_FLAG] = true;
  return { cls, ns };
}

// ---------- adapter ----------
export function createEngine(HF) {
  const { cls } = ensureSeamRegistered(HF);

  let hf = cls.buildEmpty(HF_OPTS);
  const listeners = { recalc: [] };
  const indirectCells = new Set(); // JSON [sheetName, a1] keys for cells whose formula mentions INDIRECT
  const fire = (evt) => (listeners[evt] ?? []).forEach((fn) => { try { fn(); } catch { /* listener errors never break the engine */ } });

  // ---- change collection (for the grid surface's incremental display sync) ----
  // Cell-level ExportedChanges are collected from HF mutations; structural ops
  // shift cells without exporting every move, so they degrade to full:true and
  // the UI re-pulls the whole sheet display.
  const CHANGE_CAP = 20000;
  let changedCells = new Set(); // JSON [sheetName, row, col]
  let changesFull = false;
  const markFull = () => { changesFull = true; changedCells.clear(); };
  const collect = (exported) => {
    if (changesFull) return;
    if (!Array.isArray(exported)) { markFull(); return; }
    for (const ch of exported) {
      const a = ch && ch.address;
      if (!a || typeof a.sheet !== 'number' || typeof a.row !== 'number' || typeof a.col !== 'number') {
        // named-expression or unrecognized change shape -> degrade safely
        markFull();
        return;
      }
      const name = hf.getSheetName(a.sheet);
      if (name === undefined) continue; // sheet gone (e.g. removeSheet cascade)
      changedCells.add(JSON.stringify([name, a.row, a.col]));
      if (changedCells.size > CHANGE_CAP) { markFull(); return; }
    }
  };
  const drainChanges = () => {
    const out = changesFull
      ? { full: true, cells: [] }
      : { full: false, cells: [...changedCells].map((k) => { const [sheet, r, c] = JSON.parse(k); return { sheet, r, c }; }) };
    changedCells = new Set();
    changesFull = false;
    return out;
  };

  const registerBooleanLiterals = () => {
    // Excel parity: HF has no TRUE/FALSE literals (parses them as named expressions)
    try { hf.addNamedExpression('TRUE', '=TRUE()'); } catch { /* exists */ }
    try { hf.addNamedExpression('FALSE', '=FALSE()'); } catch { /* exists */ }
  };

  const sheetId = (name) => {
    const id = hf.getSheetId(name);
    if (id === undefined) throw new Error(`no such sheet: ${name}`);
    return id;
  };
  const addr = (sheet, a1) => { const { col, row } = parseA1_(a1); return { sheet: sheetId(sheet), col, row }; };

  const normVal = (v) => {
    if (v === null || v === undefined) return null;
    if (typeof v === 'object') {
      const s = v.value ?? String(v);
      return { err: typeof s === 'string' && ERR_RE.test(s) ? s : '#ERROR!' };
    }
    if (typeof v === 'string' && ERR_RE.test(v)) return { err: v };
    return v;
  };

  const HAS_INDIRECT = /INDIRECT\s*\(/i;
  const trackIndirect = (sheet, a1, raw) => {
    const key = JSON.stringify([sheet, a1]);
    if (typeof raw === 'string' && raw.startsWith('=') && HAS_INDIRECT.test(raw)) indirectCells.add(key);
    else indirectCells.delete(key);
  };
  const rescanIndirect = () => {
    indirectCells.clear();
    for (const name of hf.getSheetNames()) {
      const sid = hf.getSheetId(name);
      hf.getSheetSerialized(sid).forEach((rowArr, r) => rowArr.forEach((raw, c) => {
        if (typeof raw === 'string' && raw.startsWith('=') && HAS_INDIRECT.test(raw)) {
          indirectCells.add(JSON.stringify([name, `${idxToCol_(c)}${r + 1}`]));
        }
      }));
    }
  };
  // INDIRECT targets are not tracked dependencies; after mutations, re-dirty
  // every INDIRECT cell (bounded passes) so values settle deterministically.
  const settleIndirect = () => {
    if (indirectCells.size === 0) return;
    for (let pass = 0; pass < 3; pass++) {
      const before = new Map();
      for (const key of indirectCells) {
        const [sheet, a1] = JSON.parse(key);
        if (hf.getSheetId(sheet) === undefined) { indirectCells.delete(key); continue; }
        before.set(key, JSON.stringify(normVal(hf.getCellValue(addr(sheet, a1)))));
      }
      for (const key of indirectCells) {
        const [sheet, a1] = JSON.parse(key);
        const a = addr(sheet, a1);
        const f = hf.getCellFormula(a);
        if (f === undefined || !HAS_INDIRECT.test(f)) { indirectCells.delete(key); continue; }
        collect(hf.setCellContents(a, [[f]])); // re-parse marks the vertex dirty; recomputes after its targets
      }
      let stable = true;
      for (const key of indirectCells) {
        const [sheet, a1] = JSON.parse(key);
        if (JSON.stringify(normVal(hf.getCellValue(addr(sheet, a1)))) !== before.get(key)) { stable = false; break; }
      }
      if (stable) break;
    }
  };
  const afterMutate = ({ rescan = false } = {}) => {
    if (rescan) rescanIndirect();
    settleIndirect();
    fire('recalc');
  };

  const engine = {
    load(wb) {
      markFull();
      hf.destroy();
      const sheets = {};
      for (const sh of wb.sheets) {
        let maxR = 0; let maxC = 0;
        for (const key of Object.keys(sh.cells)) {
          const { col, row } = parseA1_(key);
          if (row + 1 > maxR) maxR = row + 1;
          if (col + 1 > maxC) maxC = col + 1;
        }
        const aoa = Array.from({ length: maxR }, () => Array(maxC).fill(null));
        for (const [key, cell] of Object.entries(sh.cells)) {
          const { col, row } = parseA1_(key);
          aoa[row][col] = cell.f !== undefined ? cell.f : (cell.v !== undefined ? cell.v : null);
        }
        sheets[sh.name] = aoa;
      }
      hf = cls.buildFromSheets(sheets, HF_OPTS);
      registerBooleanLiterals();
      for (const [name, ref] of Object.entries(wb.names ?? {})) {
        hf.addNamedExpression(name, ref.startsWith('=') ? ref : `=${ref}`);
      }
      afterMutate({ rescan: true });
    },

    reset() {
      markFull();
      hf.destroy();
      hf = cls.buildEmpty(HF_OPTS);
      hf.addSheet('Sheet1');
      registerBooleanLiterals();
      indirectCells.clear();
      fire('recalc');
    },

    sheets: () => hf.getSheetNames(),
    addSheet(name) { hf.addSheet(name); fire('recalc'); },
    removeSheet(name) { markFull(); hf.removeSheet(sheetId(name)); afterMutate({ rescan: true }); },
    renameSheet(oldName, newName) { markFull(); hf.renameSheet(sheetId(oldName), newName); afterMutate({ rescan: true }); },

    setCell(sheet, a1, raw) {
      collect(hf.setCellContents(addr(sheet, a1), [[raw]]));
      trackIndirect(sheet, a1, raw);
      afterMutate();
    },
    setCells(sheet, entries) { // entries: [{key, raw}]
      if (entries.length > 1 && typeof hf.batch === 'function') {
        // one recompute for the whole batch; batch() returns the exported changes
        collect(hf.batch(() => {
          for (const { key, raw } of entries) hf.setCellContents(addr(sheet, key), [[raw]]);
        }));
      } else {
        for (const { key, raw } of entries) collect(hf.setCellContents(addr(sheet, key), [[raw]]));
      }
      for (const { key, raw } of entries) trackIndirect(sheet, key, raw);
      afterMutate();
    },

    // evaluate a formula string WITHOUT mutating the sheet (agent face eval):
    // HyperFormula computes it in the given sheet's context and discards it.
    evalFormula(sheet, formula) {
      const f = typeof formula === 'string' && formula.startsWith('=') ? formula : `=${formula}`;
      try { return normVal(hf.calculateFormula(f, sheetId(sheet))); }
      catch (e) { return { err: '#ERROR!', detail: String((e && e.message) || e) }; }
    },
    getValue(sheet, a1) { return normVal(hf.getCellValue(addr(sheet, a1))); },
    getFormula(sheet, a1) { return hf.getCellFormula(addr(sheet, a1)) ?? null; },
    getCellRaw(sheet, a1) { const v = hf.getCellSerialized(addr(sheet, a1)); return v === undefined || v === null || v === '' ? null : v; },

    recalc() { markFull(); hf.rebuildAndRecalculate(); registerBooleanLiterals(); afterMutate({ rescan: true }); },

    insertRows(sheet, at1, n) { markFull(); hf.addRows(sheetId(sheet), [at1 - 1, n]); afterMutate({ rescan: true }); },
    deleteRows(sheet, at1, n) { markFull(); hf.removeRows(sheetId(sheet), [at1 - 1, n]); afterMutate({ rescan: true }); },
    insertCols(sheet, at1, n) { markFull(); hf.addColumns(sheetId(sheet), [at1 - 1, n]); afterMutate({ rescan: true }); },
    deleteCols(sheet, at, n) {
      markFull();
      const at0 = typeof at === 'string' ? colToIdx_(at) : at - 1;
      hf.removeColumns(sheetId(sheet), [at0, n]);
      afterMutate({ rescan: true });
    },
    moveRange(sheet, fromRange, toCell) {
      const { start, end } = parseRange_(fromRange);
      const to = parseA1_(toCell);
      const sid = sheetId(sheet);
      markFull();
      hf.moveCells(
        { start: { sheet: sid, col: start.col, row: start.row }, end: { sheet: sid, col: end.col, row: end.row } },
        { sheet: sid, col: to.col, row: to.row },
      );
      afterMutate({ rescan: true });
    },

    nameSet(name, ref) {
      markFull(); // named-expression dependents are not enumerated cheaply
      try { hf.removeNamedExpression(name); } catch { /* absent */ }
      if (ref !== null && ref !== undefined) hf.addNamedExpression(name, ref.startsWith('=') ? ref : `=${ref}`);
      afterMutate();
    },

    serializeSheet(sheet) {
      const sid = sheetId(sheet);
      const cells = {};
      hf.getSheetSerialized(sid).forEach((rowArr, r) => rowArr.forEach((raw, c) => {
        if (raw === null || raw === undefined || raw === '') return;
        const key = `${idxToCol_(c)}${r + 1}`;
        cells[key] = typeof raw === 'string' && raw.startsWith('=') ? { f: raw } : { v: raw };
      }));
      return cells;
    },
    allFormulaCells() {
      const out = [];
      for (const name of hf.getSheetNames()) {
        const sid = hf.getSheetId(name);
        hf.getSheetSerialized(sid).forEach((rowArr, r) => rowArr.forEach((raw, c) => {
          if (typeof raw === 'string' && raw.startsWith('=')) out.push({ sheet: name, key: `${idxToCol_(c)}${r + 1}`, f: raw });
        }));
      }
      return out;
    },
    sheetDims(sheet) {
      const { width, height } = hf.getSheetDimensions(sheetId(sheet));
      return { cols: width, rows: height };
    },
    regionCells(sheet, range) { // serialized contents of an A1 range: {A1: raw}
      const { start, end } = parseRange_(range);
      const sid = sheetId(sheet);
      const out = {};
      for (let r = start.row; r <= end.row; r++) {
        for (let c = start.col; c <= end.col; c++) {
          const raw = hf.getCellSerialized({ sheet: sid, col: c, row: r });
          if (raw !== undefined && raw !== null && raw !== '') out[`${idxToCol_(c)}${r + 1}`] = raw;
        }
      }
      return out;
    },

    // computed values of a whole sheet, normalized (errors as {err}) — display feed
    sheetValues(sheet) {
      return hf.getSheetValues(sheetId(sheet)).map((rowArr) => rowArr.map((v) => normVal(v)));
    },
    drainChanges,

    on(evt, fn) { (listeners[evt] ??= []).push(fn); },
    destroy() { hf.destroy(); },
  };
  return engine;
}

// single-file composition: register on the shared namespace
const NS2 = (globalThis.Reckon ||= {});
