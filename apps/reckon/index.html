<script type="module">
//__RK_INLINE_BEGIN core/schema.mjs
// Reckon — .reckon.json schema v1 + validation (RECKON-AGENT-HANDOFF.md §4).
// Single ingress: every external payload (XLSX, CSV, window.reckon.setRange,
// paste) passes validateWorkbook() / validateRange() before touching state.
//
// Module contract (single-file doctrine): no imports; dependencies injected;
// registers on globalThis.Reckon so concatenated worker/inline builds work.

export const SCHEMA_VERSION = 5; // v5 (Batch N): per-sheet pivots[]. v4 (DV) + v3 (CF) + v2 (charts) + v1 load unchanged (migrate).
export const MAX_ROWS = 1048576; // Excel row floor
export const MAX_COLS = 16384;   // Excel col floor (XFD)

// ---------- A1 helpers (shared by adapter + transactions) ----------
export const colToIdx = (letters) => {
  let n = 0;
  for (const ch of letters) n = n * 26 + (ch.charCodeAt(0) - 64);
  return n - 1;
};
export const idxToCol = (c) => {
  let s = '';
  c += 1;
  while (c > 0) { const m = (c - 1) % 26; s = String.fromCharCode(65 + m) + s; c = (c - m - 1) / 26; }
  return s;
};
const A1_RE = /^([A-Z]{1,3})([1-9][0-9]{0,6})$/;
export const parseA1 = (key) => {
  const m = A1_RE.exec(key);
  if (!m) return null;
  const col = colToIdx(m[1]);
  const row = Number(m[2]) - 1;
  if (col >= MAX_COLS || row >= MAX_ROWS) return null;
  return { col, row };
};
export const toA1 = (col, row) => `${idxToCol(col)}${row + 1}`;
export const parseRangeA1 = (rg) => {
  const parts = String(rg).split(':');
  if (parts.length > 2) return null;
  const start = parseA1(parts[0]);
  const end = parseA1(parts[1] ?? parts[0]);
  if (!start || !end) return null;
  return {
    start: { col: Math.min(start.col, end.col), row: Math.min(start.row, end.row) },
    end: { col: Math.max(start.col, end.col), row: Math.max(start.row, end.row) },
  };
};

// ---------- cell entry validation ----------
const isScalar = (v) => typeof v === 'string' || typeof v === 'number' || typeof v === 'boolean';
const CELL_KEYS = new Set(['v', 'f', 'fmt']);

// Returns error string or null. A cell entry is {v} | {f} | {v,f} | any + fmt.
// Formulas persist as text and must start with '='. Cached v alongside f is
// allowed on ingress (XLSX carries it) but is never authoritative (§4).
export function cellEntryError(cell) {
  if (cell === null) return null; // explicit clear
  if (typeof cell !== 'object' || Array.isArray(cell)) return 'cell must be an object or null';
  const keys = Object.keys(cell);
  if (keys.length === 0) return 'cell has no keys';
  for (const k of keys) if (!CELL_KEYS.has(k)) return `unknown cell key "${k}"`;
  if ('f' in cell) {
    if (typeof cell.f !== 'string' || !cell.f.startsWith('=')) return 'f must be a string starting with "="';
    if (cell.f.length > 8192) return 'formula longer than 8192 chars';
  }
  if ('v' in cell) {
    if (!isScalar(cell.v)) return 'v must be string, number, or boolean';
    if (typeof cell.v === 'number' && !Number.isFinite(cell.v)) return 'v must be finite';
    if (typeof cell.v === 'string' && cell.v.length > 32768) return 'v longer than 32768 chars';
  }
  if ('fmt' in cell && cell.fmt !== null && typeof cell.fmt !== 'string') return 'fmt must be a string id or null';
  if (!('f' in cell) && !('v' in cell) && !('fmt' in cell)) return 'cell needs v, f, or fmt';
  return null;
}

// ---------- chart entry validation (schema v2, Batch K) ----------
// A chart is a per-sheet floating object rendered from the computed values of
// dataRange. Kept lean + self-describing so a .reckon.json replays in any
// future Reckon without one (closure in the artifact, V&R §2).
export const CHART_TYPES = new Set(['column', 'bar', 'line', 'area', 'pie', 'scatter', 'combo']);
const CHART_ID_RE = /^[A-Za-z0-9_-]{1,64}$/;
const finitePos = (n) => typeof n === 'number' && Number.isFinite(n) && n >= 0;

// Returns error string or null.
export function chartError(ch) {
  if (typeof ch !== 'object' || ch === null || Array.isArray(ch)) return 'chart must be an object';
  if (typeof ch.id !== 'string' || !CHART_ID_RE.test(ch.id)) return 'invalid chart id';
  if (!CHART_TYPES.has(ch.type)) return `invalid chart type "${ch.type}"`;
  if (typeof ch.dataRange !== 'string' || !parseRangeA1(ch.dataRange)) return 'invalid dataRange (A1 range)';
  if ('title' in ch && ch.title !== null && (typeof ch.title !== 'string' || ch.title.length > 255)) return 'title must be a string (<=255) or null';
  if ('orientation' in ch && ch.orientation !== 'cols' && ch.orientation !== 'rows') return 'orientation must be "cols" or "rows"';
  for (const k of ['headerRow', 'headerCol']) if (k in ch && typeof ch[k] !== 'boolean') return `${k} must be a boolean`;
  if ('series' in ch) {
    if (!Array.isArray(ch.series) || ch.series.length > 256) return 'series must be an array (<=256)';
    for (const s of ch.series) {
      if (typeof s !== 'object' || s === null || Array.isArray(s)) return 'each series must be an object';
      if ('name' in s && s.name !== null && typeof s.name !== 'string') return 'series name must be a string or null';
      if ('kind' in s && s.kind !== 'line' && s.kind !== 'column') return 'series kind must be "line" or "column"';
    }
  }
  const pos = ch.pos;
  if (typeof pos !== 'object' || pos === null || !finitePos(pos.x) || !finitePos(pos.y)) return 'pos must be {x>=0, y>=0}';
  const size = ch.size;
  if (typeof size !== 'object' || size === null) return 'size must be {w, h}';
  if (typeof size.w !== 'number' || !Number.isFinite(size.w) || size.w < 40 || size.w > 4000) return 'size.w must be 40..4000';
  if (typeof size.h !== 'number' || !Number.isFinite(size.h) || size.h < 40 || size.h > 4000) return 'size.h must be 40..4000';
  if ('options' in ch && (typeof ch.options !== 'object' || ch.options === null || Array.isArray(ch.options))) return 'options must be an object';
  return null;
}

// ---------- validateWorkbook ----------
const ID_RE = /^[A-Za-z0-9_-]{1,64}$/;
const NAME_RE = /^[A-Za-z_][A-Za-z0-9_.]{0,254}$/; // named-range identifier

export function validateWorkbook(wb) {
  const errors = [];
  const err = (path, msg) => { if (errors.length < 50) errors.push({ path, msg }); };

  if (typeof wb !== 'object' || wb === null || Array.isArray(wb)) {
    return { ok: false, errors: [{ path: '$', msg: 'workbook must be an object' }] };
  }
  const meta = wb.reckon;
  if (typeof meta !== 'object' || meta === null) err('$.reckon', 'missing reckon meta');
  else {
    // accept every shipped schema version (back-compat, Batch K): an on-disk v1
    // workbook (no charts) still loads unchanged; migrate() upgrades it on open.
    if (typeof meta.schema !== 'number' || !Number.isInteger(meta.schema) || meta.schema < 1 || meta.schema > SCHEMA_VERSION) err('$.reckon.schema', `schema must be 1..${SCHEMA_VERSION}`);
    for (const k of ['app', 'created', 'modified', 'locale']) {
      if (k in meta && typeof meta[k] !== 'string') err(`$.reckon.${k}`, 'must be a string');
    }
  }
  if (!Array.isArray(wb.sheets) || wb.sheets.length === 0) {
    err('$.sheets', 'sheets must be a non-empty array');
    return { ok: errors.length === 0, errors };
  }
  const ids = new Set(); const names = new Set();
  wb.sheets.forEach((sh, i) => {
    const p = `$.sheets[${i}]`;
    if (typeof sh !== 'object' || sh === null) { err(p, 'sheet must be an object'); return; }
    if (typeof sh.id !== 'string' || !ID_RE.test(sh.id)) err(`${p}.id`, 'invalid sheet id');
    else if (ids.has(sh.id)) err(`${p}.id`, `duplicate sheet id "${sh.id}"`);
    else ids.add(sh.id);
    if (typeof sh.name !== 'string' || sh.name.length === 0 || sh.name.length > 255) err(`${p}.name`, 'invalid sheet name');
    else if (names.has(sh.name)) err(`${p}.name`, `duplicate sheet name "${sh.name}"`);
    else names.add(sh.name);
    if (typeof sh.cells !== 'object' || sh.cells === null || Array.isArray(sh.cells)) {
      err(`${p}.cells`, 'cells must be an object');
    } else {
      for (const [key, cell] of Object.entries(sh.cells)) {
        if (!parseA1(key)) { err(`${p}.cells.${key}`, 'invalid A1 key'); continue; }
        const e = cellEntryError(cell);
        if (e) err(`${p}.cells.${key}`, e);
        else if (cell === null) err(`${p}.cells.${key}`, 'persisted cell must not be null (omit instead)');
      }
    }
    if ('cols' in sh) {
      if (typeof sh.cols !== 'object' || sh.cols === null) err(`${p}.cols`, 'cols must be an object');
      else for (const [c, def] of Object.entries(sh.cols)) {
        if (!/^[A-Z]{1,3}$/.test(c) || colToIdx(c) >= MAX_COLS) err(`${p}.cols.${c}`, 'invalid col letter');
        else if (typeof def !== 'object' || def === null || typeof def.w !== 'number' || def.w <= 0) err(`${p}.cols.${c}`, 'col def needs positive w');
      }
    }
    if ('rows' in sh) {
      if (typeof sh.rows !== 'object' || sh.rows === null) err(`${p}.rows`, 'rows must be an object');
      else for (const [r, def] of Object.entries(sh.rows)) {
        const n = Number(r);
        if (!Number.isInteger(n) || n < 1 || n > MAX_ROWS) err(`${p}.rows.${r}`, 'invalid row number');
        else if (typeof def !== 'object' || def === null || typeof def.h !== 'number' || def.h <= 0) err(`${p}.rows.${r}`, 'row def needs positive h');
      }
    }
    if ('merges' in sh) {

// ---------- validateRange ----------
// Ingress shape for pastes / setRange / CSV import: a 2-D array (rows) whose
// entries are scalar | null | cell-entry object ({v}/{f}/{fmt} combinations).
export function validateRange(values2d, { maxCells = 1000000 } = {}) {
  const errors = [];
  const err = (path, msg) => { if (errors.length < 50) errors.push({ path, msg }); };
  if (!Array.isArray(values2d)) return { ok: false, errors: [{ path: '$', msg: 'range must be an array of rows' }] };
  let count = 0;
  values2d.forEach((row, r) => {
    if (!Array.isArray(row)) { err(`$[${r}]`, 'row must be an array'); return; }
    count += row.length;
    row.forEach((entry, c) => {
      if (entry === null || entry === undefined) return;
      if (isScalar(entry)) {
        if (typeof entry === 'number' && !Number.isFinite(entry)) err(`$[${r}][${c}]`, 'number must be finite');
        return;
      }
      const e = cellEntryError(entry);
      if (e) err(`$[${r}][${c}]`, e);
    });
  });
  if (count > maxCells) err('$', `range exceeds ${maxCells} cells`);
  return { ok: errors.length === 0, errors };
}

// Reckon — main-thread RPC client for the engine worker. The main thread
// holds no engine: every method is an async postMessage round-trip into the
// worker created from the concatenated spine sources (see reckon.html).
//
// Module contract (single-file doctrine): no imports; registers on
// globalThis.Reckon.

export function createWorkerClient(worker) {
  let seq = 0;
  const pending = new Map();
  const eventListeners = {};

  worker.addEventListener('message', (e) => {
    const msg = e.data ?? {};
    if (msg.event) {
      (eventListeners[msg.event] ?? []).forEach((fn) => { try { fn(msg.payload); } catch { /* ignore */ } });
      return;
    }
    const p = pending.get(msg.id);
    if (!p) return;
    pending.delete(msg.id);
    if (msg.ok) p.resolve(msg.result);
    else p.reject(new Error(msg.error));
  });
  worker.addEventListener('error', (e) => {
    const err = new Error(`worker error: ${e.message ?? 'unknown'}`);
    for (const p of pending.values()) p.reject(err);
    pending.clear();
    (eventListeners.error ?? []).forEach((fn) => { try { fn(err); } catch { /* ignore */ } });
  });

  const call = (method, args) => new Promise((resolve, reject) => {
    seq += 1;
    pending.set(seq, { resolve, reject });
    worker.postMessage({ id: seq, method, args });
  });

  return {
    init: (hfUrl) => call('init', { hfUrl }),
    loadWorkbook: (workbook) => call('loadWorkbook', { workbook }),
    applyTransaction: (tx) => call('applyTransaction', tx),
    undo: () => call('undo'),
    redo: () => call('redo'),
    canUndo: () => call('canUndo'),
    canRedo: () => call('canRedo'),
    serialize: () => call('serialize'),
    snapshotJson: () => call('snapshotJson'),
    getValue: (sheet, a1) => call('getValue', { sheet, a1 }),
    getFormula: (sheet, a1) => call('getFormula', { sheet, a1 }),
    getCell: (sheet, a1) => call('getCell', { sheet, a1 }),
    getCellFormat: (sheet, a1) => call('getCellFormat', { sheet, a1 }),
    getSheetDisplay: (sheet) => call('getSheetDisplay', { sheet }),
    regionCells: (sheet, range) => call('regionCells', { sheet, range }),
    regionValues: (sheet, range) => call('regionValues', { sheet, range }),
    getSheetMeta: (id) => call('getSheetMeta', { id }),
    dvListFor: (sheet, a1) => call('dvListFor', { sheet, a1 }),
    pivotResult: (sheet, def) => call('pivotResult', { sheet, def }),
    regionFormats: (sheet, range) => call('regionFormats', { sheet, range }),
    getNames: () => call('getNames'),
    getLocale: () => call('getLocale'),
    engineInfo: () => call('engineInfo'),
    search: (opts) => call('search', opts),
    sheetNames: () => call('sheetNames'),
    getLog: () => call('getLog'),
    getHead: () => call('getHead'),
    replayCheck: () => call('replayCheck'),
    validateRange: (values) => call('validateRange', { values }),
    validateWorkbook: (workbook) => call('validateWorkbook', { workbook }),
    evalFormula: (sheet, formula) => call('evalFormula', { sheet, formula }),
    recalc: () => call('recalc'),
    on(evt, fn) { (eventListeners[evt] ??= []).push(fn); },
    terminate() { worker.terminate(); },
  };
}

// Reckon — Crate storage façade (L3): FSA → OPFS mirror → IndexedDB, every
// write mirrored; autosave debounce 500ms after the last transaction with a
// write-lock during save (handoff §5).
//
// DIVERGENCE (recorded in STATE.md): the frozen Crate ESM API
// (private-mesh-universe/crate/lib/crate.js) is a remote-bucket E2EE client —
// Crate.open({bucketConfig, credentials, passphrase}) — and cannot serve a
// local FSA/OPFS/IndexedDB façade. Per the handoff contract this façade is
// implemented in-repo instead. Its backend interface mirrors the FSA shape
// (as Crate's docs do), so a Crate bucket backend can slot in later.
//
// Backend contract (single-workbook scope):
//   { kind, available(): Promise<bool>, read(): Promise<Uint8Array|null>,
//     write(bytes): Promise<void> }
//
// Module contract (single-file doctrine): no imports; registers on
// globalThis.Reckon.

// ---------- backends ----------
export function makeMemoryBackend({ kind = 'memory', available = true, failWrites = false } = {}) {
  let stored = null;
  const b = {
    kind,
    writes: 0,
    async available() { return available; },
    async read() { return stored ? new Uint8Array(stored) : null; },
    async write(bytes) {
      if (b.failWrites) throw new Error(`${kind}: write failed`);
      b.writes += 1;
      stored = new Uint8Array(bytes);
    },
    failWrites,
  };
  return b;
}

export function makeFsaBackend(fileHandle) {
  return {
    kind: 'fsa',
    async available() {
      if (!fileHandle) return false;
      try {
        const perm = await fileHandle.queryPermission({ mode: 'readwrite' });
        return perm === 'granted';
      } catch { return false; }
    },
    async read() {
      const file = await fileHandle.getFile();
      return new Uint8Array(await file.arrayBuffer());
    },
    async write(bytes) {
      const w = await fileHandle.createWritable();
      await w.write(bytes);
      await w.close();
    },
  };
}

export function makeOpfsBackend(filename = 'workbook.reckon.json') {
  return {
    kind: 'opfs',
    async available() {
      try { return typeof navigator !== 'undefined' && !!(await navigator.storage?.getDirectory?.()); }
      catch { return false; }
    },
    async read() {
      try {
        const root = await navigator.storage.getDirectory();
        const fh = await root.getFileHandle(filename);
        const file = await fh.getFile();
        return new Uint8Array(await file.arrayBuffer());
      } catch { return null; }
    },
    async write(bytes) {
      const root = await navigator.storage.getDirectory();
      const fh = await root.getFileHandle(filename, { create: true });
      const w = await fh.createWritable();
      await w.write(bytes);
      await w.close();
    },
  };
}

export function makeIdbBackend({ db = 'reckon', store = 'workbooks', key = 'workbook' } = {}) {
  const open = () => new Promise((resolve, reject) => {
    const req = indexedDB.open(db, 1);
    req.onupgradeneeded = () => { req.result.createObjectStore(store); };
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
  const tx = (mode, fn) => open().then((conn) => new Promise((resolve, reject) => {
    const t = conn.transaction(store, mode);
    const req = fn(t.objectStore(store));
    req.onsuccess = () => { resolve(req.result); conn.close(); };
    req.onerror = () => { reject(req.error); conn.close(); };
  }));
  return {
    kind: 'idb',
    async available() {
      if (typeof indexedDB === 'undefined') return false;
      try { (await open()).close(); return true; } catch { return false; }
    },
    async read() {
      const got = await tx('readonly', (s) => s.get(key));
      return got ? new Uint8Array(got) : null;
    },
    async write(bytes) { await tx('readwrite', (s) => s.put(new Uint8Array(bytes), key)); },
  };
}

// ---------- façade ----------
// Ladder semantics (L3): primary = first available of [fsa, opfs, idb];
// every save is mirrored to every OTHER available backend in the ladder
// ("every write mirrored"; §5 "mirror to IndexedDB on every save").
export async function createCrateFacade({ backends } = {}) {
  if (!Array.isArray(backends) || backends.length === 0) throw new Error('createCrateFacade needs a backends ladder');
  const avail = [];
  for (const b of backends) {
    try { if (await b.available()) avail.push(b); } catch { /* unavailable */ }
  }
  if (avail.length === 0) throw new Error('no storage backend available');
  const primary = avail[0];
  const mirrors = avail.slice(1);

  let saving = false;      // write-lock: the FSA watcher must not fight a save
  let queued = null;       // latest bytes queued while a save is in flight
  let lastSavedAt = null;
  let lastError = null;
  const listeners = [];
  const notify = () => listeners.forEach((fn) => { try { fn(facade.status()); } catch { /* ignore */ } });

  const doSave = async (bytes) => {
    await primary.write(bytes);
    const mirrorErrors = [];
    for (const m of mirrors) {
      try { await m.write(bytes); }
      catch (e) { mirrorErrors.push(`${m.kind}: ${e.message}`); }
    }
    return mirrorErrors;
  };

  const facade = {
    primaryKind: primary.kind,
    mirrorKinds: mirrors.map((m) => m.kind),

    // save with write-lock; concurrent saves collapse to the latest bytes
    async save(bytes) {
      if (saving) { queued = bytes; return { queued: true }; }
      saving = true;
      notify();
      try {
        let current = bytes;
        let mirrorErrors = [];
        for (;;) {
          mirrorErrors = await doSave(current);
          if (queued === null) break;
          current = queued; queued = null;
        }
        lastSavedAt = Date.now();
        lastError = mirrorErrors.length ? `mirror: ${mirrorErrors.join('; ')}` : null;
        return { saved: true, mirrorErrors };
      } catch (e) {
        lastError = `${primary.kind}: ${e.message}`;
        throw e;
      } finally {
        saving = false;
        notify();
      }
    },

    // read primary; on miss/failure fall through the mirrors in ladder order
    async load() {
      for (const b of [primary, ...mirrors]) {
        try {
          const bytes = await b.read();
          if (bytes && bytes.length) return { bytes, from: b.kind };
        } catch { /* fall through */ }
      }
      return { bytes: null, from: null };
    },

    locked: () => saving,
    status: () => ({ primary: primary.kind, mirrors: mirrors.map((m) => m.kind), saving, lastSavedAt, lastError }),
    onStatus(fn) { listeners.push(fn); },
  };
  return facade;
}

// ---------- autosave ----------
// Debounce 500ms after the last transaction; serialize() is called at fire
// time so the save always captures the latest state.
export function createAutosave({ session, facade, serialize, debounceMs = 500 } = {}) {
  if (!session || !facade) throw new Error('createAutosave needs session + facade');
  const ser = serialize ?? (() => new TextEncoder().encode(JSON.stringify(session.serialize())));
  let timer = null;
  let disposed = false;
  let saves = 0;
  let lastResult = null;

  const flush = async () => {
    if (timer !== null) { clearTimeout(timer); timer = null; }
    const bytes = await ser(); // ser may be async (e.g. serialize over the worker RPC)
    lastResult = await facade.save(bytes);
    if (!lastResult.queued) saves += 1;
    return lastResult;
  };
  const schedule = () => {
    if (disposed) return;
    if (timer !== null) clearTimeout(timer);
    timer = setTimeout(() => { timer = null; flush().catch(() => { /* surfaced via facade.status().lastError */ }); }, debounceMs);
  };
  session.on('transaction', schedule);

  return {
    schedule,
    flush,
    pending: () => timer !== null,
    stats: () => ({ saves, lastResult }),
    dispose() { disposed = true; if (timer !== null) { clearTimeout(timer); timer = null; } },
  };
}

// The real display FORMATTER (G8): number / currency / percent / date / text,
// plus the cell-presentation style (bold, italic, alignment, neutral-ramp or

// formula text stay authoritative (§4); the formula bar always shows raw.
//
// Format identity is SELF-DESCRIBING: a cell's `fmt` string id encodes its
// entire spec deterministically, so the same logical format always yields ONE
// id (natural dedup) and the `formats` catalog in .reckon.json is DERIVED from

// resolution falls back to the loaded catalog before the id codec.

// SAME number of fraction digits and is right-aligned (the number default), so
// the decimal points line up automatically — no separate decimal-tab needed.

// globalThis.Reckon. Pure (no DOM, no engine) — runs identically in the engine
// worker (display feed) and on the main thread (toolbar id math + unit tests).

const KINDS = new Set(['general', 'number', 'currency', 'percent', 'date', 'text']);
const CURRENCIES = ['INR', 'USD', 'EUR', 'GBP', 'JPY'];
const DATE_PATTERNS = { A: 'dmy', B: 'mdy', C: 'iso', D: 'dmonthy', E: 'monthy' };
const DATE_CODE = Object.fromEntries(Object.entries(DATE_PATTERNS).map(([k, v]) => [v, k]));
const ALIGN_CODE = { left: 'l', center: 'c', right: 'r' };
const CODE_ALIGN = { l: 'left', c: 'center', r: 'right' };

// order). Full names and the 'outline' preset map in via canonBorder; the app
// resolves a range 'outline' into per-cell side subsets before it makes ids.
const SIDE_ALIAS = { top: 't', bottom: 'b', left: 'l', right: 'r', t: 't', b: 'b', l: 'l', r: 'r' };

  else if (/^[tblr]+$/.test(v)) for (const ch of v) set.add(ch); // a side subset like 'tl'
  else return undefined; // anything else (incl. the app-only 'outline' intent)

const clampDecimals = (n) => Math.max(0, Math.min(10, Number.isFinite(n) ? Math.trunc(n) : 0));

// ---------- canonicalise a loose spec into a normalised def ----------
export function normalizeFormatSpec(spec) {
  const s = spec && typeof spec === 'object' ? spec : {};
  const kind = KINDS.has(s.kind) ? s.kind : 'general';
  const def = { kind };

    def.decimals = clampDecimals(s.decimals ?? 2);
    def.grouping = !!s.grouping;
  } else if (kind === 'currency') {
    def.code = CURRENCIES.includes(s.code) ? s.code : 'INR';
    def.decimals = clampDecimals(s.decimals ?? 2);
    def.grouping = s.grouping === 'std' ? 'std' : 'in';
  } else if (kind === 'percent') {
    def.decimals = clampDecimals(s.decimals ?? 0);
  } else if (kind === 'date') {
    def.pattern = DATE_CODE[s.pattern] ? s.pattern : 'dmy';
  }

  if (s.bold) def.bold = true;
  if (s.italic) def.italic = true;
  if (s.align && ALIGN_CODE[s.align]) def.align = s.align;
  if (s.bg != null && BG_SLOTS.has(String(s.bg))) def.bg = String(s.bg);
  const bd = canonBorder(s.border);
  if (bd) def.border = bd;
  return def;
}

export function isEmptyFormat(def) {
  const d = normalizeFormatSpec(def);

// core token by kind, then style tokens in a FIXED order, joined by '-'.
export function idFromSpec(spec) {
  const d = normalizeFormatSpec(spec);
  let core;
  switch (d.kind) {
    case 'number': core = `n${d.decimals}${d.grouping ? 'g' : ''}`; break;
    case 'currency': core = `c${d.code}${d.decimals}${d.grouping === 'std' ? 's' : 'i'}`; break;
    case 'percent': core = `p${d.decimals}`; break;
    case 'date': core = `d${DATE_CODE[d.pattern]}`; break;
    case 'text': core = 't'; break;
    default: core = 'g';
  }
  const tokens = [core];
  if (d.bold) tokens.push('fb');
  if (d.italic) tokens.push('fi');
  if (d.align) tokens.push(`a${ALIGN_CODE[d.align]}`);
  if (d.bg) tokens.push(`g${d.bg}`);
  if (d.border) tokens.push(`B${d.border === 'all' ? 'a' : d.border}`); // Ba | Bt/Bb/Bl/Br subsets
  return tokens.join('-');
}

// parse a self-describing id back into a def; returns null if not a codec id
export function defFromId(id) {
  if (typeof id !== 'string' || id.length === 0) return null;
  const tokens = id.split('-');
  const core = tokens[0];
  const def = {};
  if (core === 'g') def.kind = 'general';
  else if (core === 't') def.kind = 'text';
  else if (core[0] === 'n') {
    const m = /^n(\d{1,2})(g?)$/.exec(core);
    if (!m) return null;
    def.kind = 'number'; def.decimals = clampDecimals(Number(m[1])); def.grouping = m[2] === 'g';
  } else if (core[0] === 'c') {
    const m = /^c([A-Z]{3})(\d{1,2})([is])$/.exec(core);
    if (!m || !CURRENCIES.includes(m[1])) return null;
    def.kind = 'currency'; def.code = m[1]; def.decimals = clampDecimals(Number(m[2])); def.grouping = m[3] === 's' ? 'std' : 'in';
  } else if (core[0] === 'p') {
    const m = /^p(\d{1,2})$/.exec(core);
    if (!m) return null;
    def.kind = 'percent'; def.decimals = clampDecimals(Number(m[1]));
  } else if (core[0] === 'd') {
    const m = /^d([A-E])$/.exec(core);
    if (!m) return null;
    def.kind = 'date'; def.pattern = DATE_PATTERNS[m[1]];
  } else return null;
  for (const tok of tokens.slice(1)) {
    if (tok === 'fb') def.bold = true;
    else if (tok === 'fi') def.italic = true;
    else if (tok[0] === 'a' && CODE_ALIGN[tok[1]]) def.align = CODE_ALIGN[tok[1]];
    else if (tok[0] === 'g' && BG_SLOTS.has(tok.slice(1))) def.bg = tok.slice(1);
    else if (tok[0] === 'B') { const bd = canonBorder(tok.slice(1) === 'a' ? 'all' : tok.slice(1)); if (!bd) return null; def.border = bd; }
    else return null;
  }
  return normalizeFormatSpec(def);
}

// resolve a fmt id against a loaded catalog first (hand-authored §4 names),
// then the deterministic codec. Returns a normalised def or null.
export function resolveFormat(id, catalog = {}) {
  if (typeof id !== 'string' || id.length === 0) return null;
  if (catalog && Object.prototype.hasOwnProperty.call(catalog, id)) return normalizeFormatSpec(catalog[id]);
  return defFromId(id);
}

// ---------- date serial -> parts ----------
const fmtSerialToDate = (serial) => new Date(DATE_EPOCH + Math.round(serial) * 86400000);
const pad2 = (n) => String(n).padStart(2, '0');
function formatDate(serial, pattern) {
  const dt = fmtSerialToDate(serial);
  const y = dt.getUTCFullYear(); const m = dt.getUTCMonth() + 1; const d = dt.getUTCDate();
  switch (pattern) {
    case 'mdy': return `${pad2(m)}/${pad2(d)}/${y}`;
    case 'iso': return `${y}-${pad2(m)}-${pad2(d)}`;
    case 'dmonthy': return `${d} ${FMT_MONTHS[m - 1]} ${y}`;
    case 'monthy': return `${FMT_MONTHS[m - 1]} ${y}`;
    case 'dmy': default: return `${pad2(d)}/${pad2(m)}/${y}`;
  }
}

const intl = (locale, opts) => new Intl.NumberFormat(locale, opts);

// ---------- the formatter: (value, def, ctx) -> {text, ty} ----------
// value is the ENGINE value: number | string | boolean | {err} | null.
// A format never masks an error and never fabricates a number from text —
// a number format on a text value falls back to the raw string.
export function formatValue(value, def, { locale = 'en-IN' } = {}) {
  if (value === null || value === undefined) return { text: '', ty: '' };
  if (typeof value === 'object' && value.err) return { text: value.err, ty: 'e' };
  const d = normalizeFormatSpec(def);
  if (d.kind === 'text') return { text: String(value), ty: 's' };
  if (typeof value === 'boolean') return { text: value ? 'TRUE' : 'FALSE', ty: 'b' };
  if (typeof value !== 'number' || !Number.isFinite(value)) {
    // non-numeric value under a numeric/date format: show it honestly as text
    return { text: String(value), ty: typeof value === 'string' ? 's' : 'n' };
  }
  try {
    switch (d.kind) {
      case 'number':
        return { text: intl(locale, { minimumFractionDigits: d.decimals, maximumFractionDigits: d.decimals, useGrouping: d.grouping }).format(value), ty: 'n' };
      case 'currency': {
        const loc = d.grouping === 'std' ? 'en-US' : 'en-IN';
        return { text: intl(loc, { style: 'currency', currency: d.code, minimumFractionDigits: d.decimals, maximumFractionDigits: d.decimals }).format(value), ty: 'n' };
      }
      case 'percent':
        return { text: intl(locale, { style: 'percent', minimumFractionDigits: d.decimals, maximumFractionDigits: d.decimals }).format(value), ty: 'n' };
      case 'date':
        return { text: formatDate(value, d.pattern), ty: 'n' };
      default: // general with (possibly) only a style layer — raw number text
        return { text: String(value), ty: 'n' };
    }
  } catch {
    return { text: String(value), ty: 'n' };
  }
}

// ---------- style descriptor for the grid (symbolic; gridview -> hex) ----------
// Only the render-relevant fields; base alignment/colour by cell TYPE is the
// gridview's job, this OVERRIDES where the format asks.
export function styleDescriptor(def) {
  const d = normalizeFormatSpec(def);
  const sd = {};
  if (d.bold) sd.b = 1;
  if (d.italic) sd.i = 1;
  if (d.align) sd.a = d.align;
  if (d.bg) sd.g = d.bg;
  if (d.border) sd.d = d.border;
  return Object.keys(sd).length ? sd : null;
}

// human label for the toolbar / names (short, no decoration)
export function formatLabel(def) {
  const d = normalizeFormatSpec(def);
  switch (d.kind) {
    case 'number': return `Number${d.grouping ? ' (,)' : ''} · ${d.decimals}dp`;
    case 'currency': return `${d.code} · ${d.decimals}dp`;
    case 'percent': return `Percent · ${d.decimals}dp`;
    case 'date': return `Date · ${d.pattern}`;
    case 'text': return 'Text';
    default: return 'General';
  }
}

export const FORMAT_META = { CURRENCIES, DATE_PATTERNS };

// Reckon — IO adapters (Batch E): CSV via papaparse, XLSX escape hatch via
// SheetJS CE. This module is the pure LIBRARY BOUNDARY only: it parses/serializes
// bytes and maps between Excel number formats and Reckon's self-describing format
// codec (core/formats.mjs). It NEVER touches engine state — the app runs every
// parsed payload through the single ingress (validateWorkbook / validateRange)
// and writes it with applyTransaction (L4). Formatting loss on XLSX import is
// itemised into `notes`, never silent (handoff §8/§10, V&R §5).
//
// The heavy libraries are injected as globals (globalThis.Papa, globalThis.XLSX)
// — the same precedent as the engine's HyperFormula global — so this file stays
// import-free (single-file doctrine) and testable in node.
//
// Module contract: no imports; uses globalThis.Reckon (pure format helpers +
// A1 math); registers on globalThis.Reckon.

// ---------- CSV ----------
export function csvParse(text) {
  const Papa = globalThis.Papa;
  if (!Papa) throw new Error('CSV library not loaded');
  const out = Papa.parse(String(text ?? ''), { skipEmptyLines: false });
  const rows = out.data.map((r) => (Array.isArray(r) ? r.map((c) => (c == null ? '' : String(c))) : [String(r)]));
  // papaparse appends a trailing empty row for a file ending in a newline; drop
  // a single all-empty trailing row so a round-trip does not grow the sheet
  while (rows.length > 1 && rows[rows.length - 1].every((c) => c === '')) rows.pop();
  return rows;
}

export function csvStringify(rows) {
  const Papa = globalThis.Papa;
  if (!Papa) throw new Error('CSV library not loaded');
  return Papa.unparse(rows.map((r) => r.map((c) => (c == null ? '' : c))), { newline: '\n' });
}

// ---------- Excel numFmt <-> Reckon format spec ----------
const CUR_SYMBOL = { INR: '₹', USD: '$', EUR: '€', GBP: '£', JPY: '¥' };
const DATE_NUMFMT = { dmy: 'dd/mm/yyyy', mdy: 'mm/dd/yyyy', iso: 'yyyy-mm-dd', dmonthy: 'd mmm yyyy', monthy: 'mmm yyyy' };

const fracDigits = (sec) => { const m = /\.([0#]+)/.exec(sec); return m ? Math.min(10, m[1].length) : 0; };
const currencyOf = (sec0) => {
  // drop Excel locale-only tags like [$-409] before sniffing — they carry a bare
  // "$" (the LCID prefix) that must NOT read as USD on a plain number/date mask.
  const sec = sec0.replace(/\[\$-[0-9A-Fa-f]+\]/g, '');
  if (sec.includes('₹') || /\binr\b/i.test(sec) || /\[\$?inr/i.test(sec)) return 'INR';
  if (sec.includes('€') || /\beur\b/i.test(sec)) return 'EUR';
  if (sec.includes('£') || /\bgbp\b/i.test(sec)) return 'GBP';
  if (sec.includes('¥') || /\bjpy\b/i.test(sec)) return 'JPY';
  if (sec.includes('$') || /\busd\b/i.test(sec)) return 'USD';
  return null;
};
const datePattern = (sec) => {
  const l = sec.toLowerCase().replace(/\[[^\]]*\]/g, '');
  if (/mmm/.test(l)) return /\bd/.test(l) ? 'dmonthy' : 'monthy';
  if (/^\s*y{2,4}\s*-\s*mm?\s*-\s*dd?/.test(l) || (/^\s*y/.test(l) && l.includes('-'))) return 'iso';
  const di = l.indexOf('d'), mi = l.indexOf('m');
  if (di >= 0 && mi >= 0) return di < mi ? 'dmy' : 'mdy';
  return 'dmy';
};

// Excel format string -> a Reckon format spec (or null for General). Used for
// XLSX import; reuses core/formats.mjs to canonicalise.
export function numFmtToSpec(z) {
  if (z == null) return null;
  const s = String(z).trim();
  if (s === '' || /^general$/i.test(s)) return null;
  if (s === '@') return { kind: 'text' };
  const sec = s.split(';')[0];
  const bare = sec.replace(/\[[^\]]*\]/g, '').replace(/"[^"]*"/g, '');
  if (sec.includes('%')) return { kind: 'percent', decimals: fracDigits(sec) };
  // date/time: has date tokens and is not a plain number mask
  if (/[yd]/i.test(bare) && /(yy|d|mmm)/i.test(bare) && !/[#]/.test(bare)) return { kind: 'date', pattern: datePattern(sec) };
  const cur = currencyOf(sec);
  if (cur) return { kind: 'currency', code: cur, decimals: fracDigits(sec), grouping: cur === 'INR' ? 'in' : 'std' };
  if (/[0#]/.test(bare)) return { kind: 'number', decimals: fracDigits(sec), grouping: /[#0],[#0]/.test(bare) || bare.includes('#,') || bare.includes(',#') || /,0/.test(bare) };
  return null;
}

// a Reckon format def -> an Excel format string (or null for General/style-only).
// Used for XLSX export.
export function specToNumFmt(def) {
  const RK = globalThis.Reckon;
  const d = RK.normalizeFormatSpec(def);
  const dp = (n) => (n > 0 ? '.' + '0'.repeat(n) : '');
  switch (d.kind) {
    case 'number': return (d.grouping ? '#,##0' : '0') + dp(d.decimals);
    case 'percent': return '0' + dp(d.decimals) + '%';
    case 'currency': return '"' + (CUR_SYMBOL[d.code] || '') + '"#,##0' + dp(d.decimals);
    case 'date': return DATE_NUMFMT[d.pattern] || DATE_NUMFMT.dmy;
    case 'text': return '@';
    default: return null;
  }
}

// ---------- XLSX import ----------
// external-workbook reference marker in a SheetJS formula (e.g. [1]Sheet1!A1)
const EXTERNAL_RE = /\[\d+\]|\[[^\]]*\.xl/i;
const wchToPx = (col) => {
  if (typeof col.wpx === 'number') return Math.round(col.wpx);
  const w = typeof col.wch === 'number' ? col.wch : (typeof col.width === 'number' ? col.width : null);
  return w == null ? null : Math.round(w * 7 + 5);
};

// Returns { sheets:[{name, cells:{A1:{v|f, fmt?}}, cols, merges}], names, notes }.
// notes: [{sheet, cell?, kind, detail}] — every stripped / lossy item, itemised.
export function xlsxImport(data, { maxCells = 200000 } = {}) {
  const RK = globalThis.Reckon;
  const XLSX = globalThis.XLSX;
  if (!XLSX) throw new Error('XLSX library not loaded');
  const bytes = data instanceof Uint8Array ? data : new Uint8Array(data);
  // cellStyles:true is what makes SheetJS populate '!cols' (column widths) on
  // read; we still import only .z (numFmt), never fonts/fills/borders.
  const wb = XLSX.read(bytes, { type: 'array', cellFormula: true, cellNF: true, cellStyles: true, cellDates: false, bookVBA: true });
  const notes = [];
  const note = (o) => { notes.push(o); };

  // macros / VBA — stripped: we only ever emit .reckon.json, never the vbaraw
  if (wb.vbaraw) note({ sheet: '*', kind: 'macros', detail: `Macro / VBA project removed (${wb.vbaraw.length ?? '?'} bytes). Reckon does not run macros.` });
  // styling that the escape hatch does not import — stated once, honestly
  note({ sheet: '*', kind: 'formatting', detail: 'Fonts, fills, borders and other cell styling are not imported. Values, formulas and number formats are.' });

  const sheets = [];
  let total = 0;
  let truncated = false;
  for (const name of wb.SheetNames) {
    const ws = wb.Sheets[name];
    if (!ws || !ws['!ref']) { sheets.push({ name, cells: {} }); continue; }
    const range = XLSX.utils.decode_range(ws['!ref']);
    const cells = {};
    let arrayNoted = false;
    for (let r = range.s.r; r <= range.e.r && !truncated; r += 1) {
      for (let c = range.s.c; c <= range.e.c; c += 1) {
        const addr = XLSX.utils.encode_cell({ r, c });
        const cell = ws[addr];
        if (!cell || (cell.v === undefined && cell.f === undefined)) continue;
        if (total >= maxCells) { truncated = true; break; }
        const a1 = `${RK.idxToCol(c)}${r + 1}`;
        const out = {};
        if (cell.f !== undefined && cell.f !== null && String(cell.f).length) {
          const f = String(cell.f);
          if (EXTERNAL_RE.test(f)) {
            // external link stripped: keep the cached value, drop the live ref
            note({ sheet: name, cell: a1, kind: 'external-link', detail: `Formula referencing another workbook removed: =${f}` });
            assignImportValue(out, cell);
          } else {
            if (cell.F && !arrayNoted) { note({ sheet: name, cell: a1, kind: 'array-formula', detail: 'Array/spill formulas imported as their anchor formula; re-enter if results differ.' }); arrayNoted = true; }
            out.f = '=' + f;
          }
        } else {
          assignImportValue(out, cell);
        }
        if (out.f === undefined && out.v === undefined) continue;
        const spec = numFmtToSpec(cell.z);
        if (spec) out.fmt = RK.idFromSpec(RK.normalizeFormatSpec(spec));
        cells[a1] = out;
        total += 1;
      }
    }
    const sheet = { name, cells };
    // column widths
    if (Array.isArray(ws['!cols'])) {
      const cols = {};
      ws['!cols'].forEach((col, i) => { if (!col) return; const px = wchToPx(col); if (px && (col.customWidth || col.wpx || col.wch)) cols[RK.idxToCol(i)] = { w: Math.max(5, Math.min(2000, px)) }; });
      if (Object.keys(cols).length) sheet.cols = cols;
    }
    // merges (schema requires spans > 1 cell)
    if (Array.isArray(ws['!merges']) && ws['!merges'].length) {
      const merges = [];
      for (const m of ws['!merges']) {
        if (m.s.r === m.e.r && m.s.c === m.e.c) continue;
        merges.push(`${RK.idxToCol(m.s.c)}${m.s.r + 1}:${RK.idxToCol(m.e.c)}${m.e.r + 1}`);
      }
      if (merges.length) sheet.merges = merges;
    }
    sheets.push(sheet);
  }
  if (truncated) note({ sheet: '*', kind: 'truncated', detail: `Import stopped at ${maxCells} cells; the workbook is larger.` });

  // defined names (skip Excel built-ins and external refs)
  const names = {};
  const defs = wb.Workbook && Array.isArray(wb.Workbook.Names) ? wb.Workbook.Names : [];
  for (const d of defs) {
    if (!d || typeof d.Name !== 'string') continue;
    if (/^_xlnm\./i.test(d.Name)) { note({ sheet: '*', cell: null, kind: 'defined-name', detail: `Built-in name ${d.Name} skipped.` }); continue; }
    if (!/^[A-Za-z_][A-Za-z0-9_.]{0,254}$/.test(d.Name)) { note({ sheet: '*', kind: 'defined-name', detail: `Name "${d.Name}" is not a valid Reckon identifier; skipped.` }); continue; }
    const ref = String(d.Ref ?? '');
    if (!ref || EXTERNAL_RE.test(ref)) { note({ sheet: '*', kind: 'defined-name', detail: `Name "${d.Name}" references another workbook; skipped.` }); continue; }
    names[d.Name] = ref.startsWith('=') ? ref : `=${ref}`;
  }
  return { sheets, names, notes };
}

function assignImportValue(out, cell) {
  switch (cell.t) {
    case 'n': out.v = typeof cell.v === 'number' && Number.isFinite(cell.v) ? cell.v : 0; break;
    case 'b': out.v = !!cell.v; break;
    case 'e': out.v = typeof cell.w === 'string' && cell.w ? cell.w : '#ERROR'; break;
    case 'd': out.v = typeof cell.v === 'number' ? cell.v : (cell.v instanceof Date ? Math.round((cell.v.getTime() / 86400000) + 25569) : 0); break;
    default: { const v = cell.v; out.v = v == null ? '' : String(v); }
  }
}

// ---------- XLSX export ----------
// workbook: the .reckon.json shape (client.serialize()); values: optional
// {sheetName: {A1: computedValue}} so exported formulas carry a cached value.
// Returns a Uint8Array of the .xlsx bytes.
export function xlsxExport(workbook, { values = {} } = {}) {
  const RK = globalThis.Reckon;
  const XLSX = globalThis.XLSX;
  if (!XLSX) throw new Error('XLSX library not loaded');
  const catalog = workbook.formats || {};
  const wb = XLSX.utils.book_new();
  const usedNames = new Set();
  for (const sh of workbook.sheets) {
    const ws = {};
    let minR = Infinity, minC = Infinity, maxR = 0, maxC = 0;
    const entries = Object.entries(sh.cells || {});
    for (const [a1, cell] of entries) {
      const p = RK.parseA1(a1);
      if (!p) continue;
      const out = {};
      if (cell && typeof cell === 'object' && 'f' in cell && typeof cell.f === 'string') {
        out.t = 'n'; out.f = cell.f.replace(/^=/, '');
        const cv = values[sh.name] ? values[sh.name][a1] : undefined;
        applyExportValue(out, cv);
      } else if (cell && 'v' in cell) {
        applyExportValue(out, cell.v);
      } else if (cell && 'fmt' in cell) {
        out.t = 'z';
      } else continue;
      const def = cell && cell.fmt ? RK.resolveFormat(cell.fmt, catalog) : null;
      if (def) { const z = specToNumFmt(def); if (z) out.z = z; }
      const addr = XLSX.utils.encode_cell({ r: p.row, c: p.col });
      ws[addr] = out;
      minR = Math.min(minR, p.row); minC = Math.min(minC, p.col); maxR = Math.max(maxR, p.row); maxC = Math.max(maxC, p.col);
    }
    if (minR === Infinity) { minR = 0; minC = 0; maxR = 0; maxC = 0; }
    ws['!ref'] = XLSX.utils.encode_range({ s: { r: minR, c: minC }, e: { r: maxR, c: maxC } });
    if (sh.cols) {
      const cols = [];
      for (const [letter, def] of Object.entries(sh.cols)) { if (def && typeof def.w === 'number') cols[RK.colToIdx(letter)] = { wpx: def.w, wch: Math.max(1, (def.w - 5) / 7), width: Math.max(1, (def.w - 5) / 7), customWidth: 1 }; }
      if (cols.length) ws['!cols'] = cols;
    }
    if (Array.isArray(sh.merges) && sh.merges.length) {
      ws['!merges'] = sh.merges.map((rg) => { const pr = RK.parseRangeA1(rg); return pr ? { s: { r: pr.start.row, c: pr.start.col }, e: { r: pr.end.row, c: pr.end.col } } : null; }).filter(Boolean);
    }
    if (sh.freeze && (sh.freeze.r || sh.freeze.c)) ws['!freeze'] = { xSplit: sh.freeze.c, ySplit: sh.freeze.r, topLeftCell: `${RK.idxToCol(sh.freeze.c)}${sh.freeze.r + 1}`, activePane: 'bottomRight', state: 'frozen' };
    let safe = sanitizeSheetName(sh.name);
    // de-dup with a monotonic counter, re-clamped to Excel's 31-char limit so
    // the candidate always changes and never overflows (no infinite loop).
    for (let n = 2; usedNames.has(safe.toLowerCase()); n += 1) { const suf = `~${n}`; safe = sanitizeSheetName(sh.name).slice(0, 31 - suf.length) + suf; }
    usedNames.add(safe.toLowerCase());
    XLSX.utils.book_append_sheet(wb, ws, safe);
  }
  const names = workbook.names || {};
  const nameKeys = Object.keys(names);
  if (nameKeys.length) {
    wb.Workbook = wb.Workbook || {};
    wb.Workbook.Names = nameKeys.map((n) => ({ Name: n, Ref: String(names[n]).replace(/^=/, '') }));
  }
  const out = XLSX.write(wb, { type: 'array', bookType: 'xlsx' });
  return out instanceof Uint8Array ? out : new Uint8Array(out);
}

function applyExportValue(out, v) {
  if (typeof v === 'number' && Number.isFinite(v)) { out.t = 'n'; out.v = v; }
  else if (typeof v === 'boolean') { out.t = 'b'; out.v = v; }
  else if (v == null || v === '') { if (out.f === undefined) out.t = 'z'; }
  else if (typeof v === 'object' && v.err) { out.t = 'e'; out.w = v.err; out.v = 0; }
  else { out.t = 's'; out.v = String(v); }
}

export function sanitizeSheetName(name) {
  let s = String(name || 'Sheet').replace(/[[\]*?:/\\]/g, '_').trim();
  if (!s) s = 'Sheet';
  return s.slice(0, 31);
}

//__RK_INLINE_BEGIN core/chart-model.mjs
// Reckon — chart model + scale/tick math + hand-rolled SVG renderer (Batch K).
// NO charting dependency (a lib would be a BLOCKER, handoff §13): this is the
// in-repo engine. PURE + DOM-free, so it is node-testable; ui/charts.mjs owns
// the overlay, drag/resize and settings panel and calls buildChartSvg here.
//
// Tufte-lean (V&R §5, "no chart chrome"): thin single-hairline axes, direct
// end-labels on lines/areas, a token-derived categorical palette (the
// design-system ref colours — ranges<->series — never a rainbow), no
// gradients, shadows or 3-D. Renders from the engine's COMPUTED values.
//
// Module contract (single-file doctrine): no imports; registers on
// globalThis.Reckon.

// Token values mirror reckon.html :root --rk-* (same substitution precedent as
// ui/gridview.mjs: a detached SVG string cannot read CSS custom properties).
// The categorical series ramp IS the formula-bar ref palette (--rk-ref0..5):
// already tokenised, muted, and semantically "one range = one colour".
const TOKENS = {
  n0: '#ffffff', n1: '#f6f7f8', n2: '#e3e5e8', n3: '#c9ccd1', n4: '#a6aab2',
  n5: '#696e77', n6: '#5c616b', n7: '#40444c', n8: '#2a2d33', n9: '#17191d',
  accent: '#1a5fb4', danger: '#a51d2d',
  // ordered so ADJACENT series differ strongly in hue AND luminance
  // (blue -> green -> orange -> purple -> red -> violet) — the ref-colour tokens,
  // just resequenced so a 2-3 series chart never pairs two close blues/purples.
  series: ['#1a5fb4', '#1d7a45', '#b3541e', '#9141ac', '#a51d2d', '#613583'],
};
export const CHART_PALETTE = TOKENS.series.slice();
const seriesColor = (i, tk) => (tk.series[i % tk.series.length]);

// ---------- value coercion ----------
// engine values arrive as number | string | boolean | null | error-code string.
const coerceNum = (v) => {
  if (v === null || v === undefined) return null;
  if (typeof v === 'number') return Number.isFinite(v) ? v : null;
  if (typeof v === 'boolean') return v ? 1 : 0;
  if (typeof v === 'string') {
    const t = v.trim();
    if (t === '') return null;
    const n = Number(t);
    return Number.isFinite(n) ? n : null;
  }
  return null;
};
const asLabel = (v) => (v === null || v === undefined ? '' : String(v));

// ---------- nice-number scale + ticks (classic Heckbert algorithm) ----------
export function niceNum(range, round) {
  if (!(range > 0)) return 1;
  const exp = Math.floor(Math.log10(range));
  const f = range / Math.pow(10, exp);
  let nf;
  if (round) nf = f < 1.5 ? 1 : f < 3 ? 2 : f < 7 ? 5 : 10;
  else nf = f <= 1 ? 1 : f <= 2 ? 2 : f <= 5 ? 5 : 10;
  return nf * Math.pow(10, exp);
}
export function niceScale(min, max, maxTicks = 5) {
  if (!Number.isFinite(min) || !Number.isFinite(max)) { min = 0; max = 1; }
  if (min === max) {
    if (min === 0) { min = 0; max = 1; }
    else { const d = Math.abs(min) * 0.1; min -= d; max += d; }
  }
  const range = niceNum(max - min, false);
  const step = niceNum(range / Math.max(1, maxTicks - 1), true);
  const niceMin = Math.floor(min / step) * step;
  const niceMax = Math.ceil(max / step) * step;
  const ticks = [];
  for (let v = niceMin; v <= niceMax + step * 0.5; v += step) ticks.push(Number(v.toFixed(10)));
  return { min: niceMin, max: niceMax, step, ticks };
}

// ---------- read a chart's data model from the range's 2-D values ----------
// values2d: dense rows of the dataRange (row-major). Returns a normalised model.
export function readSeries(chart, values2d) {
  const rows = Array.isArray(values2d) ? values2d : [];
  const nRows = rows.length;
  const nCols = rows.reduce((m, r) => Math.max(m, Array.isArray(r) ? r.length : 0), 0);
  const at = (r, c) => (rows[r] && rows[r][c] !== undefined ? rows[r][c] : null);
  const orient = chart.orientation === 'rows' ? 'rows' : 'cols';
  const headerRow = chart.headerRow !== false;
  const headerCol = chart.headerCol !== false;

  // Build a grid of [seriesIndex][categoryIndex] plus labels, orientation-aware.
  let catCount, serCount, dataAt, catLabel, serName;
  if (orient === 'cols') {
    const r0 = headerRow ? 1 : 0;
    const c0 = headerCol ? 1 : 0;
    catCount = Math.max(0, nRows - r0);
    serCount = Math.max(0, nCols - c0);
    dataAt = (s, k) => at(r0 + k, c0 + s);
    catLabel = (k) => (headerCol ? asLabel(at(r0 + k, 0)) : String(k + 1));
    serName = (s) => (headerRow ? asLabel(at(0, c0 + s)) : `Series ${s + 1}`);
  } else {
    const r0 = headerRow ? 1 : 0;
    const c0 = headerCol ? 1 : 0;
    catCount = Math.max(0, nCols - c0);
    serCount = Math.max(0, nRows - r0);
    dataAt = (s, k) => at(r0 + s, c0 + k);
    catLabel = (k) => (headerRow ? asLabel(at(0, c0 + k)) : String(k + 1));
    serName = (s) => (headerCol ? asLabel(at(r0 + s, 0)) : `Series ${s + 1}`);
  }

  const categories = [];
  for (let k = 0; k < catCount; k += 1) categories.push(catLabel(k));

  const cfg = Array.isArray(chart.series) ? chart.series : [];
  const kindFor = (s) => {
    if (cfg[s] && (cfg[s].kind === 'line' || cfg[s].kind === 'column')) return cfg[s].kind;
    if (chart.type === 'combo') return s === 0 ? 'column' : 'line';
    return chart.type;
  };

  // scatter: the first data series is the shared X; the rest are Y series.
  if (chart.type === 'scatter') {
    const xValues = [];
    for (let k = 0; k < catCount; k += 1) xValues.push(coerceNum(dataAt(0, k)));
    const series = [];
    // colorIndex tracks the SOURCE series slot so a series keeps the SAME colour
    // across chart types (scatter consumes slot 0 as X, so its Y series stay on
    // slots 1,2… — Q2 green, Q3 orange, matching every other panel).
    for (let s = 1; s < serCount; s += 1) {
      const values = [];
      for (let k = 0; k < catCount; k += 1) values.push(coerceNum(dataAt(s, k)));
      series.push({ name: (cfg[s] && cfg[s].name) || serName(s), kind: 'scatter', values, colorIndex: s });
    }
    // one Y column with no explicit X → plot against the row index
    if (serCount === 1) {
      for (let k = 0; k < catCount; k += 1) xValues[k] = k + 1;
      const values = [];
      for (let k = 0; k < catCount; k += 1) values.push(coerceNum(dataAt(0, k)));
      series.push({ name: (cfg[0] && cfg[0].name) || serName(0), kind: 'scatter', values, colorIndex: 0 });
    }
    return { type: 'scatter', categories, xValues, series };
  }

  const series = [];
  for (let s = 0; s < serCount; s += 1) {
    const values = [];
    for (let k = 0; k < catCount; k += 1) values.push(coerceNum(dataAt(s, k)));
    series.push({ name: (cfg[s] && cfg[s].name) || serName(s), kind: kindFor(s), values, colorIndex: s });
  }
  return { type: chart.type, categories, xValues: null, series };
}

// text summary for a11y (title + series names + type)
export function chartSummary(chart, model) {
  const names = model.series.map((s) => s.name).filter(Boolean);
  const t = chart.title || 'Chart';
  return `${t}. ${chart.type} chart, ${model.series.length} series${names.length ? ': ' + names.join(', ') : ''}.`;
}

// ---------- SVG builder ----------
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const FONT = 'ui-monospace, Menlo, Consolas, monospace';

const fmtNum = (v, locale) => {
  if (v === null || v === undefined || !Number.isFinite(v)) return '';
  const abs = Math.abs(v);
  try {
    if (abs !== 0 && (abs >= 1e6 || abs < 1e-3)) return new Intl.NumberFormat(locale, { notation: 'compact', maximumFractionDigits: 1 }).format(v);
    const maxFrac = Number.isInteger(v) ? 0 : 2;
    return new Intl.NumberFormat(locale, { maximumFractionDigits: maxFrac }).format(v);
  } catch { return String(v); }
};

// Build a self-contained SVG string for a chart. opts: {locale, accent}.
// The SVG carries role="img" + <title>/<desc> for a11y; the DOM host adds the
// focusable wrapper + aria-label.
export function buildChartSvg(chart, values2d, opts = {}) {
  const tk = opts.accent ? { ...TOKENS, series: [opts.accent, ...TOKENS.series.slice(1)], accent: opts.accent } : TOKENS;
  const locale = opts.locale || 'en-US';
  const W = Math.max(40, Math.round(chart.size?.w ?? 360));
  const H = Math.max(40, Math.round(chart.size?.h ?? 240));
  const model = readSeries(chart, values2d);
  const title = chart.title || '';
  const parts = [];
  const summary = chartSummary(chart, model);
  parts.push(`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" role="img" aria-label="${esc(summary)}" font-family="${FONT}" style="display:block">`);
  parts.push(`<title>${esc(title || 'Chart')}</title><desc>${esc(summary)}</desc>`);
  parts.push(`<rect x="0" y="0" width="${W}" height="${H}" fill="${tk.n0}"/>`);
  // the visible title can be suppressed (opts.hideTitle) when the host chrome
  // already shows it (the overlay box header) — avoids repeating it. The a11y
  // <title>/<desc> stay regardless.
  const showTitle = title && !opts.hideTitle;
  const titleH = showTitle ? 22 : 8;
  if (showTitle) parts.push(`<text x="10" y="15" font-size="12" font-weight="600" fill="${tk.n9}">${esc(title)}</text>`);

  if (chart.type === 'pie') {
    parts.push(pieBody(model, { W, H, titleH, tk, locale }));
  } else {
    parts.push(cartesianBody(chart, model, { W, H, titleH, tk, locale }));
  }
  parts.push('</svg>');
  return parts.join('');
}

// ---------- cartesian (column / bar / line / area / scatter / combo) ----------
function cartesianBody(chart, model, ctx) {
  const { W, H, titleH, tk, locale } = ctx;
  const horizontal = chart.type === 'bar';
  const cats = model.categories;
  const n = cats.length;
  const series = model.series;
  const out = [];

  // ONE labeling method per chart (consistency): pure line/area name their
  // series with direct end-labels (Tufte) and carry NO legend; every other
  // chart (bar-bearing or point) uses a bottom legend instead. Pie has its own.
  const directLabels = chart.type === 'line' || chart.type === 'area';
  const showLegend = !directLabels && series.length > 1;
  const legendH = showLegend ? 18 : 0;

  // value domain across all series. Category comparisons share a zero baseline
  // (column/bar/line/area/combo) so panels read consistently; scatter (a numeric
  // x-y relationship, not a magnitude comparison) keeps its auto range.
  let vmin = Infinity; let vmax = -Infinity; let any = false;
  for (const s of series) for (const v of s.values) if (v !== null) { any = true; if (v < vmin) vmin = v; if (v > vmax) vmax = v; }
  if (!any) { vmin = 0; vmax = 1; }
  const zeroBase = chart.type === 'column' || chart.type === 'bar' || chart.type === 'area' || chart.type === 'combo' || chart.type === 'line';
  if (zeroBase) { vmin = Math.min(vmin, 0); vmax = Math.max(vmax, 0); }
  const vScale = niceScale(vmin, vmax, 5);

  if (n === 0 || series.length === 0) {
    out.push(`<text x="${W / 2}" y="${(H + titleH) / 2}" font-size="11" fill="${tk.n5}" text-anchor="middle">No data in range</text>`);
    return out.join('');
  }

  // plot rectangle — reserve a right gutter for direct end-labels (line/area)
  const mLeft = horizontal ? Math.min(120, Math.max(48, maxLabelWidth(cats))) : 46;
  const mRight = directLabels ? 40 : 14;
  const mTop = titleH + 6;
  const mBottom = 24 + legendH;
  const px = mLeft; const py = mTop;
  const pw = Math.max(10, W - mLeft - mRight);
  const ph = Math.max(10, H - mTop - mBottom);

  // scatter has a numeric X axis; everything else is categorical
  const isScatter = chart.type === 'scatter';
  let xScale = null;
  if (isScatter) {
    let xmin = Infinity; let xmax = -Infinity; let xany = false;
    for (const x of model.xValues) if (x !== null) { xany = true; if (x < xmin) xmin = x; if (x > xmax) xmax = x; }
    if (!xany) { xmin = 0; xmax = 1; }
    xScale = niceScale(xmin, xmax, 5);
  }

  // value axis mapping (v -> pixel along the value dimension)
  const vToPix = (v) => {
    const t = (v - vScale.min) / (vScale.max - vScale.min || 1);
    return horizontal ? px + t * pw : py + ph - t * ph;
  };
  const xToPix = (x) => {
    const t = (x - xScale.min) / (xScale.max - xScale.min || 1);
    return px + t * pw;
  };

  // ---- value-axis ticks + hairline gridlines (Tufte: faint, n2) ----
  for (const tickv of vScale.ticks) {
    if (horizontal) {
      const x = vToPix(tickv);
      out.push(`<line x1="${r1(x)}" y1="${py}" x2="${r1(x)}" y2="${py + ph}" stroke="${tk.n2}" stroke-width="1"/>`);
      out.push(`<text x="${r1(x)}" y="${py + ph + 14}" font-size="9" fill="${tk.n5}" text-anchor="middle">${esc(fmtNum(tickv, locale))}</text>`);
    } else {
      const y = vToPix(tickv);
      out.push(`<line x1="${px}" y1="${r1(y)}" x2="${px + pw}" y2="${r1(y)}" stroke="${tk.n2}" stroke-width="1"/>`);
      out.push(`<text x="${px - 6}" y="${r1(y) + 3}" font-size="9" fill="${tk.n5}" text-anchor="end">${esc(fmtNum(tickv, locale))}</text>`);
    }
  }
  // axes (thin single hairline, n7)
  out.push(`<line x1="${px}" y1="${py}" x2="${px}" y2="${py + ph}" stroke="${tk.n7}" stroke-width="1"/>`);
  out.push(`<line x1="${px}" y1="${py + ph}" x2="${px + pw}" y2="${py + ph}" stroke="${tk.n7}" stroke-width="1"/>`);

  // ---- category axis ----
  const band = (horizontal ? ph : pw) / n;
  const catCenter = (k) => (horizontal ? py + band * (k + 0.5) : px + band * (k + 0.5));
  if (!isScatter) {
    const every = labelStride(cats, horizontal ? 14 : Math.max(28, maxLabelWidth(cats)), horizontal ? ph : pw);
    for (let k = 0; k < n; k += 1) {
      if (k % every !== 0) continue;
      const c = catCenter(k);
      if (horizontal) out.push(`<text x="${px - 6}" y="${r1(c) + 3}" font-size="9" fill="${tk.n6}" text-anchor="end">${esc(clip(cats[k], 16))}</text>`);
      else out.push(`<text x="${r1(c)}" y="${py + ph + 13}" font-size="9" fill="${tk.n6}" text-anchor="middle">${esc(clip(cats[k], 10))}</text>`);
    }
  } else {
    for (const tickx of xScale.ticks) {
      const x = xToPix(tickx);
      out.push(`<text x="${r1(x)}" y="${py + ph + 13}" font-size="9" fill="${tk.n6}" text-anchor="middle">${esc(fmtNum(tickx, locale))}</text>`);
    }
  }

  // ---- marks ----
  const zeroPix = vToPix(0 >= vScale.min && 0 <= vScale.max ? 0 : vScale.min);
  const isBar = (s) => s.kind === 'column' || s.kind === 'bar';

  // bars (column/bar/combo-column): grouped within each category band
  const barSeries = series.filter(isBar);
  const groupW = Math.min(band * 0.8, 46);
  const barW = barSeries.length ? Math.max(2, groupW / barSeries.length) : groupW;
  series.forEach((s, si) => {
    if (!isBar(s)) return;
    const bIdx = barSeries.indexOf(s);
    const color = seriesColor(s.colorIndex ?? si, tk);
    for (let k = 0; k < n; k += 1) {
      const v = s.values[k];
      if (v === null) continue;
      const center = catCenter(k);
      if (horizontal) {
        const y0 = center - groupW / 2 + bIdx * barW;
        const xv = vToPix(v); const x0 = Math.min(zeroPix, xv); const wBar = Math.abs(xv - zeroPix);
        out.push(`<rect x="${r1(x0)}" y="${r1(y0)}" width="${r1(Math.max(1, wBar))}" height="${r1(Math.max(1, barW - 1))}" fill="${color}"/>`);
      } else {
        const x0 = center - groupW / 2 + bIdx * barW;
        const yv = vToPix(v); const y0 = Math.min(zeroPix, yv); const hBar = Math.abs(yv - zeroPix);
        out.push(`<rect x="${r1(x0)}" y="${r1(y0)}" width="${r1(Math.max(1, barW - 1))}" height="${r1(Math.max(1, hBar))}" fill="${color}"/>`);
      }
    }
  });

  // areas + lines + scatter
  series.forEach((s, si) => {
    const color = seriesColor(s.colorIndex ?? si, tk);
    const pointX = (k) => (isScatter ? xToPix(model.xValues[k] ?? k + 1) : catCenter(k));
    // direct end-label helper (Tufte) — only on pure line/area charts, kept
    // clear of the right axis by the reserved gutter
    const endLabel = (pts) => {
      if (!directLabels || !s.name) return;
      const last = pts[pts.length - 1];
      const y = Math.max(py + 4, Math.min(py + ph - 1, last[1] + 3));
      out.push(`<text x="${r1(last[0]) + 5}" y="${r1(y)}" font-size="9" fill="${color}">${esc(clip(s.name, 6))}</text>`);
    };
    if (s.kind === 'area' || (chart.type === 'area' && s.kind !== 'column' && s.kind !== 'line')) {
      const pts = [];
      for (let k = 0; k < n; k += 1) { const v = s.values[k]; if (v === null) continue; pts.push([pointX(k), vToPix(v)]); }
      if (pts.length) {
        const d = `M ${r1(pts[0][0])} ${r1(zeroPix)} ` + pts.map((p) => `L ${r1(p[0])} ${r1(p[1])}`).join(' ') + ` L ${r1(pts[pts.length - 1][0])} ${r1(zeroPix)} Z`;
        out.push(`<path d="${d}" fill="${color}" fill-opacity="0.18"/>`);
        out.push(`<path d="M ${pts.map((p) => `${r1(p[0])} ${r1(p[1])}`).join(' L ')}" fill="none" stroke="${color}" stroke-width="1.6"/>`);
        markDots(out, pts, color, tk, n <= 24);
        endLabel(pts);
      }
    } else if (s.kind === 'line') {
      const pts = [];
      for (let k = 0; k < n; k += 1) { const v = s.values[k]; if (v === null) continue; pts.push([pointX(k), vToPix(v)]); }
      if (pts.length) {
        out.push(`<path d="M ${pts.map((p) => `${r1(p[0])} ${r1(p[1])}`).join(' L ')}" fill="none" stroke="${color}" stroke-width="1.6"/>`);
        markDots(out, pts, color, tk, n <= 24);
        endLabel(pts); // combo lines have directLabels=false → legend covers them
      }
    } else if (s.kind === 'scatter') {
      // a shape channel per series (circle / square / diamond) so points stay
      // distinguishable even where two series colours sit close
      const shape = (s.colorIndex ?? si) % 3;
      for (let k = 0; k < n; k += 1) {
        const v = s.values[k]; if (v === null) continue;
        out.push(scatterMark(r1(pointX(k)), r1(vToPix(v)), shape, color));
      }
    }
  });

  if (showLegend) out.push(legend(series, { W, H, tk, seriesColor })); // one method: legend XOR direct end-labels
  return out.join('');
}

function markDots(out, pts, color, tk, show) {
  if (!show) return;
  for (const p of pts) out.push(`<circle cx="${r1(p[0])}" cy="${r1(p[1])}" r="2" fill="${tk.n0}" stroke="${color}" stroke-width="1.3"/>`);
}
// scatter point mark with a per-series shape channel (0 circle, 1 square, 2 diamond)
function scatterMark(x, y, shape, color) {
  if (shape === 1) return `<rect x="${r1(x - 2.4)}" y="${r1(y - 2.4)}" width="4.8" height="4.8" fill="${color}" fill-opacity="0.85"/>`;
  if (shape === 2) return `<path d="M ${r1(x)} ${r1(y - 3)} L ${r1(x + 3)} ${r1(y)} L ${r1(x)} ${r1(y + 3)} L ${r1(x - 3)} ${r1(y)} Z" fill="${color}" fill-opacity="0.85"/>`;
  return `<circle cx="${r1(x)}" cy="${r1(y)}" r="2.6" fill="${color}" fill-opacity="0.85"/>`;
}

// ---------- pie ----------
function pieBody(model, ctx) {
  const { W, H, titleH, tk, locale } = ctx;
  const s = model.series[0];
  const out = [];
  if (!s) { out.push(`<text x="${W / 2}" y="${H / 2}" font-size="11" fill="${tk.n5}" text-anchor="middle">No data in range</text>`); return out.join(''); }
  const cats = model.categories;
  const vals = s.values.map((v) => (v === null || v < 0 ? 0 : v));
  const total = vals.reduce((a, b) => a + b, 0);
  const cx = W * 0.36; const cy = titleH + (H - titleH) / 2; const rad = Math.max(10, Math.min(W * 0.30, (H - titleH) / 2 - 8));
  if (total <= 0) { out.push(`<circle cx="${r1(cx)}" cy="${r1(cy)}" r="${r1(rad)}" fill="none" stroke="${tk.n3}"/>`); out.push(`<text x="${r1(cx)}" y="${r1(cy)}" font-size="10" fill="${tk.n5}" text-anchor="middle">no positive values</text>`); return out.join(''); }
  let a0 = -Math.PI / 2;
  const legendX = Math.min(W - 90, cx + rad + 16);
  vals.forEach((v, i) => {
    const frac = v / total;
    const a1 = a0 + frac * Math.PI * 2;
    const color = seriesColor(i, tk);
    if (frac > 0) {
      if (frac >= 0.9999) {
        out.push(`<circle cx="${r1(cx)}" cy="${r1(cy)}" r="${r1(rad)}" fill="${color}"/>`);
      } else {
        const x0 = cx + rad * Math.cos(a0); const y0 = cy + rad * Math.sin(a0);
        const x1 = cx + rad * Math.cos(a1); const y1 = cy + rad * Math.sin(a1);
        const large = a1 - a0 > Math.PI ? 1 : 0;
        out.push(`<path d="M ${r1(cx)} ${r1(cy)} L ${r1(x0)} ${r1(y0)} A ${r1(rad)} ${r1(rad)} 0 ${large} 1 ${r1(x1)} ${r1(y1)} Z" fill="${color}" stroke="${tk.n0}" stroke-width="1"/>`);
      }
    }
    // legend row
    const ly = titleH + 8 + i * 15;
    if (ly < H - 6 && i < 10) {
      out.push(`<rect x="${r1(legendX)}" y="${r1(ly)}" width="9" height="9" fill="${color}"/>`);
      out.push(`<text x="${r1(legendX + 13)}" y="${r1(ly + 8)}" font-size="9" fill="${tk.n7}">${esc(clip(cats[i] || `#${i + 1}`, 12))} ${esc(pct(frac))}</text>`);
    }
    a0 = a1;
  });
  return out.join('');
}

// ---------- shared bits ----------
function legend(series, ctx) {
  const { W, H, tk } = ctx;
  const out = [];
  const y = H - 6;
  let x = 46;
  series.forEach((s, si) => {
    const color = ctx.seriesColor(s.colorIndex ?? si, tk);
    const label = clip(s.name || `Series ${si + 1}`, 14);
    out.push(`<rect x="${r1(x)}" y="${r1(y - 8)}" width="9" height="9" fill="${color}"/>`);

const dvDateNum = (v) => {
  if (typeof v === 'number') return Number.isFinite(v) ? v : null;
  if (typeof v === 'string') {
    const t = v.trim();
    if (t === '') return null;
    const n = Number(t);
    if (Number.isFinite(n)) return n; // a bare serial typed as text

  if (n === null) return false;

    case 'gt': return a !== null && n > a;
    case 'lt': return a !== null && n < a;
    case 'ge': return a !== null && n >= a;
    case 'le': return a !== null && n <= a;
    case 'eq': return a !== null && n === a;
    case 'ne': return a !== null && n !== a;
    case 'between': return a !== null && b !== null && n >= Math.min(a, b) && n <= Math.max(a, b);

  }

export function normalizeDvRule(rule) {

// ---------- single-value test (the ingress gate + the marker feed share this) ----------
// value: an engine-computed / typed scalar (number|string|boolean|null|errStr).
// ctx.listValues: resolved allowed values for a list rule whose source is 'range'
//   (the worker resolves the referenced range; undefined = unresolvable → allow).
// ctx.customResult: the engine result of the rule's per-cell formula (custom).
// A BLANK value is always valid (Excel "ignore blank" default). Returns boolean.
export function dvValueValid(rule, value, ctx = {}) {
  if (dvBlank(value)) return true;
  switch (rule.type) {
    case 'list': {
      const allowed = rule.source === 'range' ? ctx.listValues : rule.values;
      if (!Array.isArray(allowed)) return true; // unresolvable source → cannot gate
      return allowed.some((a) => dvStrEq(a, value));

    case 'date':

    case 'textLength':
      return cmp(rule.op, dvStr(value).length, dvNum(rule.v1), dvNum(rule.v2));

      const r = ctx.customResult;

// the allowed values a list rule offers for the dropdown (literal list, or the
// resolved referenced range). rangeValues(ref) -> dense v[][] (worker injects
// regionVals). Non-blank, de-duplicated, order-preserving, capped.
export function dvListValues(rule, rangeValues) {

    const s = dvStr(v);
    const k = s.trim().toLowerCase();
    if (seen.has(k)) continue;
    seen.add(k);
    out.push(s);
    if (out.length >= DV_LIST_CAP) break;

}

// cells that violate (non-blank only — blanks are always allowed). Returns
// Map(a1 -> ruleId). Mirrors condfmt.evaluateRules: the worker's display feed
// layers this into sd.dv so the grid draws an invalid marker. First covering
// rule wins per cell.
//   getRangeValues(a1Range) -> { start:{col,row}, values: v[][] }
//   opts.formulaEval(formula, dr, dc) -> engine value (custom rules)
//   opts.listValuesFor(ref) -> resolved v[][] (list-range rules)

// Reckon — pivot-table model + aggregation engine (Batch N, schema v5). A pivot
// aggregates a source range (first row = field headers) by row/col fields into a
// 2-D result with grand totals. This module is PURE + DOM-free (no engine, no
// imports): it takes the source range's already-computed values as a dense 2-D
// array and returns the aggregated table, so it runs unchanged in the worker
// (where the heavy grouping belongs — large sources must not block the main
// thread, handoff §10) and is node-testable.
//
// It is NOT a SQL/query surface (that is NakliData, handoff §13/L10) — it is a
// spreadsheet PivotTable: group-by + aggregate over a rectangular range.
//
// Module contract (single-file doctrine): no imports; deps read lazily off
// globalThis.Reckon; registers itself there. Top-level identifiers are
// pivot-/pv-prefixed so the shared main-thread module scope never sees a
// redeclaration clash (interp 37).

export const PIVOT_AGGS = new Set(['sum', 'count', 'countUnique', 'average', 'min', 'max']);

// rather than an unbounded worker stall (same order as the API/INDIRECT caps).
export const PIVOT_MAX_CELLS = 500000;

  sum: 'pivot.agg.sum', count: 'pivot.agg.count', countUnique: 'pivot.agg.countUnique',
  average: 'pivot.agg.average', min: 'pivot.agg.min', max: 'pivot.agg.max',
};
const pvAggLabelFallback = {
  sum: 'Sum', count: 'Count', countUnique: 'Unique', average: 'Average', min: 'Min', max: 'Max',

export function pivotValueLabel(vf) {
  const NS = globalThis.Reckon;
  const head = (NS && NS.t) ? NS.t(pvAggLabelKeys[vf.agg] || '') : null;
  const agg = head && head !== pvAggLabelKeys[vf.agg] ? head : (pvAggLabelFallback[vf.agg] || vf.agg);
  const of = (NS && NS.t && NS.t('pivot.of') !== 'pivot.of') ? NS.t('pivot.of') : 'of';

// ---------- validation (schema v5) ----------
// pivotError lives here (not core/schema.mjs) and is read lazily by the validator
// off the shared namespace — same lazy-NS pattern as cfError/dvError (interp 33).
export function pivotError(p) {
  const NS = globalThis.Reckon;
  const parseRange = NS && NS.parseRangeA1;
  const parseCell = NS && NS.parseA1;
  if (typeof p !== 'object' || p === null || Array.isArray(p)) return 'pivot must be an object';
  if (typeof p.id !== 'string' || !PIVOT_ID_RE.test(p.id)) return 'invalid pivot id';
  if (typeof p.sourceRange !== 'string' || (parseRange && !parseRange(p.sourceRange))) return 'invalid sourceRange (A1 range)';
  for (const axis of ['rows', 'cols']) {

      for (const f of p[axis]) if (typeof f !== 'string' || f.length === 0 || f.length > 255) return `${axis} field must be a non-empty string`;

  for (const v of p.values) {
    if (typeof v !== 'object' || v === null || Array.isArray(v)) return 'each value must be an object';
    if (typeof v.field !== 'string' || v.field.length === 0 || v.field.length > 255) return 'value field must be a non-empty string';
    if (!PIVOT_AGGS.has(v.agg)) return `invalid aggregation "${v.agg}"`;

    if (!Array.isArray(p.filters) || p.filters.length > 64) return 'filters must be an array (<=64)';
    for (const f of p.filters) {
      if (typeof f !== 'object' || f === null || Array.isArray(f)) return 'each filter must be an object';
      if (typeof f.field !== 'string' || f.field.length === 0) return 'filter field must be a non-empty string';
      if (!Array.isArray(f.values)) return 'filter values must be an array';
      for (const val of f.values) if (val !== null && typeof val !== 'string' && typeof val !== 'number' && typeof val !== 'boolean') return 'filter value must be scalar';

  if ('options' in p && (typeof p.options !== 'object' || p.options === null || Array.isArray(p.options))) return 'options must be an object';

const pvClone = (x) => (x === undefined ? undefined : JSON.parse(JSON.stringify(x)));

// field-exact normalised copy (every stored/cloned pivot is byte-stable, so a
// pivotSet snapshot inverse survives JSON-clone — mirrors normalizeChart/Rule)
export function normalizePivot(p) {
  return {
    id: p.id,
    sourceRange: p.sourceRange,
    rows: pvClone(p.rows) ?? [],
    cols: pvClone(p.cols) ?? [],
    values: (pvClone(p.values) ?? []).map((v) => ({ field: v.field, agg: v.agg })),
    filters: (pvClone(p.filters) ?? []).map((f) => ({ field: f.field, values: pvClone(f.values) ?? [] })),
    position: p.position,
    title: p.title ?? null,
    options: pvClone(p.options) ?? {},
