// ---------- field names from the source header row ----------
export function pivotFieldNames(values2d) {
  if (!Array.isArray(values2d) || values2d.length === 0) return [];
  const header = values2d[0] || [];
  const out = [];
  const seen = new Set();
  header.forEach((h, i) => {
    let name = (h === null || h === undefined || h === '') ? `Column ${i + 1}` : String(h);
    // de-dup so a repeated header still yields a usable, distinct label
    let name0 = name; let k = 2;
    while (seen.has(name)) { name = `${name0} (${k})`; k += 1; }
    seen.add(name);
    out.push(name);
  });
  return out;
}

// ---------- aggregation ----------
const pvIsBlank = (v) => v === null || v === undefined || v === '';
const pvNum = (v) => {
  if (typeof v === 'number') return Number.isFinite(v) ? v : null;
  if (typeof v === 'boolean') return v ? 1 : 0;
  if (typeof v === 'string' && v.trim() !== '') { const n = Number(v); return Number.isFinite(n) ? n : null; }
  return null;
};
// aggregate a raw value list -> number | null. Empty scope -> null (blank cell,
// Excel-honest); a numeric agg with records but no numerics -> null too.
const pvAggregate = (agg, vals) => {
  if (agg === 'count') { let n = 0; for (const v of vals) if (!pvIsBlank(v)) n += 1; return n === 0 ? null : n; }
  if (agg === 'countUnique') { const s = new Set(); for (const v of vals) if (!pvIsBlank(v)) s.add(typeof v === 'number' ? v : String(v)); return s.size === 0 ? null : s.size; }
  const nums = [];
  for (const v of vals) { const n = pvNum(v); if (n !== null) nums.push(n); }
  if (nums.length === 0) return null;
  switch (agg) {
    case 'sum': return nums.reduce((a, b) => a + b, 0);
    case 'average': return nums.reduce((a, b) => a + b, 0) / nums.length;
    case 'min': return Math.min(...nums);
    case 'max': return Math.max(...nums);
    default: return null;
  }
};

// stable key for a tuple of raw values (used for grouping + sorting display)
const pvKeyOf = (tuple) => JSON.stringify(tuple.map((v) => (pvIsBlank(v) ? null : (typeof v === 'number' ? { n: v } : String(v)))));
const pvDisplayTuple = (tuple, blankLabel) => tuple.map((v) => (pvIsBlank(v) ? blankLabel : (typeof v === 'boolean' ? (v ? 'TRUE' : 'FALSE') : String(v))));
// element-wise tuple compare: numbers numerically, else by string
const pvCmpTuple = (a, b) => {
  const n = Math.max(a.length, b.length);
  for (let i = 0; i < n; i += 1) {
    const x = a[i]; const y = b[i];
    const xb = pvIsBlank(x); const yb = pvIsBlank(y);
    if (xb && yb) continue;
    if (xb) return 1; if (yb) return -1; // blanks sink
    if (typeof x === 'number' && typeof y === 'number') { if (x !== y) return x - y; continue; }
    const c = String(x).localeCompare(String(y));
    if (c !== 0) return c;
  }
  return 0;
};

// computePivot(def, values2d, {locale}) -> structured result. values2d is the
// source range's computed values INCLUDING the header row. The result carries
// everything the renderer needs; the aggregation (body + totals) is what the
// unit tests pin. Totals are RE-AGGREGATED over the underlying value lists (never
// derived from cell aggregates — average/min/max/countUnique of aggregates is
// wrong), so every total is honest.
export function computePivot(def, values2d, { blankLabel = '(blank)' } = {}) {
  const rowsF = def.rows || [];
  const colsF = def.cols || [];
  const valuesF = (def.values || []).map((v) => ({ field: v.field, agg: v.agg, label: pivotValueLabel(v) }));
  const filters = def.filters || [];
  const empty = {
    ok: true, rowFields: rowsF.slice(), colFields: colsF.slice(), valueFields: valuesF,
    rowKeys: [], colKeys: [], body: [], rowTotals: [], colTotals: [], grandTotals: valuesF.map(() => null),
    fields: pivotFieldNames(values2d), recordCount: 0, truncated: false,
  };
  if (!Array.isArray(values2d) || values2d.length < 1) return empty;
  const header = values2d[0] || [];
  const fieldIdx = new Map();
  header.forEach((h, i) => { const name = (pvIsBlank(h)) ? `Column ${i + 1}` : String(h); if (!fieldIdx.has(name)) fieldIdx.set(name, i); });
  const idxOf = (name) => (fieldIdx.has(name) ? fieldIdx.get(name) : -1);

  const records = values2d.slice(1);
  const truncated = records.length * Math.max(1, header.length) > PIVOT_MAX_CELLS;
  const used = truncated ? records.slice(0, Math.floor(PIVOT_MAX_CELLS / Math.max(1, header.length))) : records;

  // filter predicate (include-list membership, string-compared)
  const filterSets = filters.map((f) => ({ idx: idxOf(f.field), set: new Set((f.values || []).map((v) => String(v))) }));
  const passes = (rec) => {
    for (const { idx, set } of filterSets) {
      if (idx < 0) continue;
      if (set.size === 0) continue; // an empty include-list is "no restriction"
      const v = rec[idx];
      if (!set.has(pvIsBlank(v) ? '' : String(v))) return false;
    }
    return true;
  };

  const rowIdx = rowsF.map(idxOf);
  const colIdx = colsF.map(idxOf);
  const valIdx = valuesF.map((v) => idxOf(v.field));

  // grouping: bucket[rowKey][colKey] = per-value-field arrays of raw values
  const rowMap = new Map(); // rowKey -> {tuple, cols: Map(colKey -> {tuple, vals:[[]]})}
  const colMap = new Map(); // colKey -> tuple (distinct)
  let recordCount = 0;
  for (const rec of used) {
    if (!passes(rec)) continue;
    recordCount += 1;
    const rTuple = rowIdx.map((i) => (i < 0 ? null : rec[i]));
    const cTuple = colIdx.map((i) => (i < 0 ? null : rec[i]));
    const rKey = pvKeyOf(rTuple);
    const cKey = pvKeyOf(cTuple);
    if (!colMap.has(cKey)) colMap.set(cKey, cTuple);
    let rEntry = rowMap.get(rKey);
    if (!rEntry) { rEntry = { tuple: rTuple, cols: new Map() }; rowMap.set(rKey, rEntry); }
    let cEntry = rEntry.cols.get(cKey);
    if (!cEntry) { cEntry = valuesF.map(() => []); rEntry.cols.set(cKey, cEntry); }
    valIdx.forEach((i, vi) => { cEntry[vi].push(i < 0 ? null : rec[i]); });
  }

  // sorted distinct keys
  const rowEntries = [...rowMap.entries()].sort((a, b) => pvCmpTuple(a[1].tuple, b[1].tuple));
  const colEntries = [...colMap.entries()].sort((a, b) => pvCmpTuple(a[1], b[1]));
  const rowKeys = rowEntries.map(([, e]) => pvDisplayTuple(e.tuple, blankLabel));
  const colKeys = colEntries.map(([, tuple]) => pvDisplayTuple(tuple, blankLabel));

  // body[r][c] = [aggForVf0, aggForVf1, ...]; totals re-aggregate over unions
  const body = [];
  const rowTotals = [];
  const grandLists = valuesF.map(() => []);
  const colLists = colEntries.map(() => valuesF.map(() => []));
  for (const [, rEntry] of rowEntries) {
    const bodyRow = [];
    const rowUnion = valuesF.map(() => []);
    colEntries.forEach(([cKey], ci) => {
      const cEntry = rEntry.cols.get(cKey);
      const cell = valuesF.map((vf, vi) => {
        const list = cEntry ? cEntry[vi] : [];
        if (cEntry) { for (const v of list) { rowUnion[vi].push(v); colLists[ci][vi].push(v); grandLists[vi].push(v); } }
        return pvAggregate(vf.agg, list);
      });
      bodyRow.push(cell);
    });
    body.push(bodyRow);
    rowTotals.push(valuesF.map((vf, vi) => pvAggregate(vf.agg, rowUnion[vi])));
  }
  const colTotals = colEntries.map((_, ci) => valuesF.map((vf, vi) => pvAggregate(vf.agg, colLists[ci][vi])));
  const grandTotals = valuesF.map((vf, vi) => pvAggregate(vf.agg, grandLists[vi]));

  return {
    ok: true, rowFields: rowsF.slice(), colFields: colsF.slice(), valueFields: valuesF,
    rowKeys, colKeys, body, rowTotals, colTotals, grandTotals,
    fields: pivotFieldNames(values2d), recordCount, truncated,
  };
}

// Reckon — formula-language utilities for the grid surface (no DOM, no engine).
// Tokenizer for ref colouring, ref extraction for range outlines, relative-ref
// shifting for paste/fill, and the typed-raw ingress coercion (M0 pattern,
// STATE.md interpretation 7: typing "123" -> 123 is the UI's job).
//
// Module contract (single-file doctrine): no imports; registers on
// globalThis.Reckon.

const REF_CORE = String.raw`(?:(?:'[^']+'|[A-Za-z_][A-Za-z0-9_.]*)!)?\$?[A-Za-z]{1,3}\$?[0-9]{1,7}(?::\$?[A-Za-z]{1,3}\$?[0-9]{1,7})?`;
// a ref must not be glued to an identifier char (LOG10, R1C1-ish names) and
// must not be a function call (followed by '(')
const REF_RE = new RegExp(String.raw`(?<![A-Za-z0-9_.$])${REF_CORE}(?![A-Za-z0-9_(])`, 'g');

export const REF_COLOR_COUNT = 6; // --rk-ref0..--rk-ref5 in the stylesheet

const colToIdxL = (letters) => {
  let n = 0;
  for (const ch of letters.toUpperCase()) n = n * 26 + (ch.charCodeAt(0) - 64);
  return n - 1;
};
const idxToColL = (c) => {
  let s = '';
  c += 1;
  while (c > 0) { const m = (c - 1) % 26; s = String.fromCharCode(65 + m) + s; c = (c - m - 1) / 26; }
  return s;
};

const A1_PART = /^(\$?)([A-Za-z]{1,3})(\$?)([0-9]{1,7})$/;

// parse one matched ref text -> {sheet|null, sr,sc,er,ec, absS*, text}
export function parseRefText(text) {
  let sheet = null;
  let body = text;
  const bang = text.lastIndexOf('!');
  if (bang !== -1) {
    sheet = text.slice(0, bang);
    if (sheet.startsWith("'") && sheet.endsWith("'")) sheet = sheet.slice(1, -1);
    body = text.slice(bang + 1);
  }
  const parts = body.split(':');
  const p1 = A1_PART.exec(parts[0]);
  if (!p1) return null;
  const p2 = parts[1] ? A1_PART.exec(parts[1]) : p1;
  if (!p2) return null;
  const c1 = colToIdxL(p1[2]); const r1 = Number(p1[4]) - 1;
  const c2 = colToIdxL(p2[2]); const r2 = Number(p2[4]) - 1;
  return {
    sheet,
    sr: Math.min(r1, r2), sc: Math.min(c1, c2),
    er: Math.max(r1, r2), ec: Math.max(c1, c2),
  };
}

// tokenize a formula string ('=' + rest) into spans for colouring.
// types: eq str ref fn name num op ws
export function tokenizeFormula(text) {
  const toks = [];
  if (!text.startsWith('=')) return [{ type: 'text', start: 0, end: text.length, text }];
  toks.push({ type: 'eq', start: 0, end: 1, text: '=' });
  let i = 1;
  const n = text.length;
  while (i < n) {
    const ch = text[i];
    if (ch === '"') {
      let j = i + 1;
      while (j < n) {
        if (text[j] === '"') { if (text[j + 1] === '"') j += 2; else { j += 1; break; } } else j += 1;
      }
      toks.push({ type: 'str', start: i, end: j, text: text.slice(i, j) });
      i = j;
      continue;
    }
    REF_RE.lastIndex = i;
    const m = REF_RE.exec(text);
    if (m && m.index === i) {
      toks.push({ type: 'ref', start: i, end: i + m[0].length, text: m[0] });
      i += m[0].length;
      continue;
    }
    if (/[A-Za-z_]/.test(ch)) {
      let j = i + 1;
      while (j < n && /[A-Za-z0-9_.']/.test(text[j])) j += 1;
      // sheet-qualified ref starting with a quote or crossing '!' is handled by REF_RE above
      const word = text.slice(i, j);
      const type = text[j] === '(' ? 'fn' : 'name';
      toks.push({ type, start: i, end: j, text: word });
      i = j;
      continue;
    }
    if (/[0-9.]/.test(ch)) {
      let j = i + 1;
      while (j < n && /[0-9.eE+-]/.test(text[j]) && !(/[+-]/.test(text[j]) && !/[eE]/.test(text[j - 1]))) j += 1;
      toks.push({ type: 'num', start: i, end: j, text: text.slice(i, j) });
      i = j;
      continue;
    }
    if (/\s/.test(ch)) {
      let j = i + 1;
      while (j < n && /\s/.test(text[j])) j += 1;
      toks.push({ type: 'ws', start: i, end: j, text: text.slice(i, j) });
      i = j;
      continue;
    }
    toks.push({ type: 'op', start: i, end: i + 1, text: ch });
    i += 1;
  }
  return toks;
}

// unique refs with stable colour indexes (same ref text -> same colour)
export function extractRefs(text) {
  const out = [];
  const seen = new Map();
  for (const tok of tokenizeFormula(text)) {
    if (tok.type !== 'ref') continue;
    const parsed = parseRefText(tok.text);
    if (!parsed) continue;
    const key = tok.text.replace(/\$/g, '').toUpperCase();
    let colorIdx = seen.get(key);
    if (colorIdx === undefined) { colorIdx = seen.size % REF_COLOR_COUNT; seen.set(key, colorIdx); }
    out.push({ ...parsed, text: tok.text, start: tok.start, end: tok.end, colorIdx });
  }
  return out;
}

// shift relative refs by (dr, dc) — paste/fill semantics. Absolute parts ($)
// stay; refs shifted off the sheet become #REF!.
export function shiftFormula(text, dr, dc) {
  if (!text.startsWith('=') || (dr === 0 && dc === 0)) return text;
  const toks = tokenizeFormula(text);
  let out = '';
  for (const tok of toks) {
    if (tok.type !== 'ref') { out += tok.text; continue; }
    let sheet = '';
    let body = tok.text;
    const bang = tok.text.lastIndexOf('!');
    if (bang !== -1) { sheet = tok.text.slice(0, bang + 1); body = tok.text.slice(bang + 1); }
    const shifted = body.split(':').map((part) => {
      const m = A1_PART.exec(part);
      if (!m) return part;
      let col = colToIdxL(m[2]);
      let row = Number(m[4]) - 1;
      if (m[1] !== '$') col += dc;
      if (m[3] !== '$') row += dr;
      if (col < 0 || row < 0 || col >= 16384 || row >= 1048576) return null;
      return `${m[1]}${idxToColL(col)}${m[3]}${row + 1}`;
    });
    out += shifted.includes(null) ? '#REF!' : sheet + shifted.join(':');
  }
  return out;
}

// UI/CSV/paste ingress typing (M0 typedRaw): numeric strings become numbers;
// formulas pass through; everything else stays text.
export function typedRaw(raw) {
  if (typeof raw !== 'string') return raw;
  if (raw.startsWith('=')) return raw;
  if (raw !== '' && raw.trim() !== '' && !isNaN(Number(raw))) return Number(raw);
  if (raw === 'TRUE') return true;
  if (raw === 'FALSE') return false;
  return raw;
}

// ---------- clipboard text (TSV) ----------
export function toTsv(grid2d) {
  return grid2d.map((row) => row.map((v) => {
    const s = v === null || v === undefined ? '' : String(v);
    return /[\t\n"]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
  }).join('\t')).join('\n');
}

export function parseTsv(text) {
  const src = text.replace(/\r\n?/g, '\n').replace(/\n$/, '');
  const rows = [[]];
  let cur = '';
  let inQ = false;
  let i = 0;
  const pushCell = () => { rows[rows.length - 1].push(cur); cur = ''; };
  while (i < src.length) {
    const ch = src[i];
    if (inQ) {
      if (ch === '"') {
        if (src[i + 1] === '"') { cur += '"'; i += 2; continue; }
        inQ = false; i += 1; continue;
      }
      cur += ch; i += 1; continue;
    }
    if (ch === '"' && cur === '') { inQ = true; i += 1; continue; }
    if (ch === '\t') { pushCell(); i += 1; continue; }
    if (ch === '\n') { pushCell(); rows.push([]); i += 1; continue; }
    cur += ch; i += 1;
  }
  pushCell();
  return rows;
}

const NS6 = (globalThis.Reckon ||= {});
Object.assign(NS6, {
  REF_COLOR_COUNT, tokenizeFormula, extractRefs, parseRefText, shiftFormula, typedRaw, toTsv, parseTsv,
});

export function createGridView({ mount, hooks = {}, defaults = {} }) {
  const XS = globalThis.x_spreadsheet;

  //
  // Token VALUES mirror reckon.html :root --rk-* (the canvas cannot read CSS
  // custom properties — same substitution precedent as scripts/vendor-grid.mjs).
  const RAMP = ['#ffffff', '#f6f7f8', '#e3e5e8', '#c9ccd1', '#a6aab2', '#7d828c', '#5c616b', '#40444c', '#2a2d33', '#17191d'];
  const ACCENT = '#1a5fb4';
  const INK = { n: '#17191d', s: '#5c616b', e: '#a51d2d', b: '#5c616b' };
  const BASE_ALIGN = { n: 'right', e: 'center', b: 'center', s: 'left' };
  const bgHex = (g) => (g === 'a' ? ACCENT : RAMP[Number(g)] ?? undefined);
  // dark grounds (accent + n6..n9) flip the ink to n0 so text keeps ≥4.5:1
  const DARK_BG = new Set(['a', '6', '7', '8', '9']);
  const borderSpec = (sides) => {
    if (!sides) return undefined;
    const line = ['thin', '#40444c']; // --rk-n7 hairline
    const on = sides === 'all' ? 'tblr' : sides;
    const bd = {};
    if (on.includes('t')) bd.top = line;
    if (on.includes('b')) bd.bottom = line;
    if (on.includes('l')) bd.left = line;
    if (on.includes('r')) bd.right = line;
    return bd;
  };
  // build an x-spreadsheet cell style object from (type, format descriptor)
  const xsStyleFor = (ty, sd) => {
    const t = ty || 's';
    const st = { align: (sd && sd.a) || BASE_ALIGN[t] || 'left' };
    let color = INK[t] ?? INK.s;
    if (sd) {
      if (sd.b || sd.i) st.font = { bold: !!sd.b, italic: !!sd.i };
      if (sd.g) {
        const bg = bgHex(sd.g);
        if (bg) {
          st.bgcolor = bg;
          // a filled cell takes a high-contrast ink (the muted type ink is the
          // honesty signal only on the plain white ground) — errors stay red
          if (t !== 'e') color = DARK_BG.has(sd.g) ? '#ffffff' : '#17191d';
        }
      }
      const bd = borderSpec(sd.d);
      if (bd) st.border = bd;
    }
    // Batch L: a conditional-formatting overlay (sd.cf) layers OVER the base
    // format (CF-over-format precedence, Excel). bg/fg are direct hex (the
    // worker auto-picks fg for >=4.5:1 contrast); a data bar is drawn by the
    // overlay layer, not on the canvas, so cf.bar sets no canvas style here.
    if (sd && sd.cf) {
      const cf = sd.cf;
      if (cf.bg) { st.bgcolor = cf.bg; color = cf.fg || '#17191d'; }
      else if (cf.fg) color = cf.fg;
      if (cf.bold) st.font = { ...(st.font || {}), bold: true };
    }
    st.color = color;
    return st;
  };
  // a cell with neither content nor style contributes nothing to the styles.
  // The DV `dv` marker is a validity SIGNAL, not a format (§8: an invalid cell's
  // value + format are untouched — only the corner triangle flags it), so a cell
  // whose only sd is `dv` must render exactly like an unstyled cell (grid-default
  // ink). Otherwise a dv-only string would route through xsStyleFor and pick up
  // the muted string ink, rendering an INVALID cell LIGHTER than its valid
  // siblings — the inverse of honest.
  const hasRealStyle = (sd) => !!(sd && Object.keys(sd).some((k) => k !== 'dv'));
  const hasStyle = (ty, sd) => !!(hasRealStyle(sd) || (ty && ty !== 's'));

  const xs = XS(mount, {
    mode: 'read', // disarms every internal mutation path; mouse stays live
    showToolbar: false,
    showContextmenu: false,
    showBottomBar: false,
    showGrid: true,
    view: { height: () => mount.clientHeight, width: () => mount.clientWidth },
    row: { len: 200, height: rowH },
    col: { len: 26, width: colW, indexWidth: 46, minWidth: 24 },
    style: {
      bgcolor: defaults.bg ?? '#ffffff',
      color: defaults.fg ?? '#2a2d33',
      font: { name: defaults.fontName ?? 'ui-monospace,Menlo,Consolas,monospace', size: 9, bold: false, italic: false },
    },
  });
  const sheet = xs.sheet;

  // Disarm the renderer's own window keydown/paste handlers permanently.
  Object.defineProperty(sheet, 'focusing', { get: () => false, set: () => {} });
  // Disarm the selector's mobile hidden-input focus steal (SelectorElement
  // useHideInput calls hideInput.focus() on every area update, which would
  // yank keyboard focus off Reckon's catcher mid-navigation).
  for (const part of ['br', 'brt', 'brl', 't', 'l', 'tl']) {
    const hi = sheet.selector?.[part]?.hideInput;
    if (hi && hi.el) hi.el.focus = () => {};
  }

  // ---------- focus / a11y ----------
  // The catcher is a hidden TEXTAREA: an editable focus target is what makes
  // the browser fire native copy/cut/paste events for ⌘/Ctrl+C/X/V. Its text
  // is inert (handled keys are preventDefault'ed); role=grid + a live region
  // on the mount carry the accessible structure.
  mount.setAttribute('role', 'grid');
  mount.setAttribute('aria-label', 'Spreadsheet grid');
  mount.setAttribute('aria-rowcount', '200');
  mount.setAttribute('aria-colcount', '26');
  const catcher = document.createElement('textarea');
  catcher.id = 'rk-grid-focus';
  catcher.setAttribute('aria-label', 'Spreadsheet keyboard input');
  catcher.setAttribute('autocomplete', 'off');
  catcher.setAttribute('autocorrect', 'off');
  catcher.setAttribute('spellcheck', 'false');
  catcher.value = ' ';
  const srCell = document.createElement('div');
  srCell.id = 'rk-active-cell';
  srCell.className = 'rk-visually-hidden';
  srCell.setAttribute('aria-live', 'polite');
  mount.appendChild(catcher);
  mount.appendChild(srCell);
  const armClipboard = () => { catcher.value = ' '; try { catcher.select(); } catch { /* detached */ } };
  const focusGrid = () => {
    try { catcher.focus({ preventScroll: true }); armClipboard(); } catch { /* detached */ }
  };
  const gridFocused = () => document.activeElement === catcher;

  // clicking anywhere in the grid returns focus to the catcher
  sheet.overlayerEl.el.addEventListener('mousedown', () => { setTimeout(focusGrid, 0); }, true);

  // ---------- data-bar overlay (Batch L) ----------
  // Data bars are drawn as translucent rects in a pointer-eventless layer pinned
  // over the grid's overlay (same coordinate space as the ref outlines). Because
  // the layer sits above the canvas text and the fill is translucent, the value
  // stays legible THROUGH the bar — "draw behind" honesty (handoff §8) without
  // touching the vendored cell renderer. prefers-reduced-motion: the bars carry
  // no animation, so nothing to suppress.
  const barLayer = document.createElement('div');
  barLayer.className = 'rk-databar-layer';
  barLayer.setAttribute('aria-hidden', 'true');
  sheet.overlayerCEl.el.appendChild(barLayer);
  let anyBars = false;
  const hexRgba = (hex, a) => {
    const h = String(hex).replace('#', '');
    const r = parseInt(h.slice(0, 2), 16); const g = parseInt(h.slice(2, 4), 16); const b = parseInt(h.slice(4, 6), 16);
    return `rgba(${r},${g},${b},${a})`;
  };
  const paintDataBars = () => {
    if (!anyBars) { if (barLayer.firstChild) barLayer.textContent = ''; return; }
    barLayer.textContent = '';
    const d = data();
    let vr;
    try { vr = d.viewRange(); } catch { return; }
    if (!vr) return;
    let drawn = 0;
    for (let r = vr.sri; r <= vr.eri && drawn < 4000; r += 1) {
      const drow = displayRows[r];
      if (!drow) continue;
      for (let c = vr.sci; c <= vr.eci; c += 1) {
        const bar = drow[c] && drow[c].sd && drow[c].sd.cf && drow[c].sd.cf.bar;
        if (!bar) continue;
        const rect = d.getRect({ sri: r, sci: c, eri: r, eci: c });
        if (!rect || !(rect.width > 0)) continue;
        const span = Math.max(0, (bar.end - bar.start)) * rect.width;
        if (span <= 0.5) continue;
        const el = document.createElement('div');
        el.className = 'rk-databar';
        el.style.left = `${rect.left + bar.start * rect.width}px`;
        el.style.top = `${rect.top + 1}px`;
        el.style.width = `${span}px`;
        el.style.height = `${Math.max(2, rect.height - 2)}px`;
        el.style.background = hexRgba(bar.color, 0.5);
        barLayer.appendChild(el);
        drawn += 1;
      }
    }
  };

  // ---------- data-validation invalid markers (Batch M) ----------
  // A cell whose value violates a DV rule carries sd.dv (a render-time flag, set
  // by the worker's marker feed — the value + format are untouched, §8 honesty).
  // We draw a small corner triangle in a pointer-eventless layer over the grid
  // overlay (same coordinate space + culling as the data-bar overlay), so the
  // vendored cell renderer is never patched. Each marker is a labelled role=img
  // so the invalid state is reachable by assistive tech (not aria-hidden, unlike
  // the decorative data bars). No animation → nothing to suppress under reduced
  // motion.
  const dvLayer = document.createElement('div');
  dvLayer.className = 'rk-dv-layer';
  sheet.overlayerCEl.el.appendChild(dvLayer);
  let anyDv = false;
  const dvInvalidLabel = () => (globalThis.Reckon && globalThis.Reckon.t ? globalThis.Reckon.t('dv.invalidCell') : 'Invalid entry');
  const paintDvMarkers = () => {
    if (!anyDv) { if (dvLayer.firstChild) dvLayer.textContent = ''; return; }
    dvLayer.textContent = '';
    const d = data();
    let vr;
    try { vr = d.viewRange(); } catch { return; }
    if (!vr) return;
    const label = dvInvalidLabel();
    let drawn = 0;
    for (let r = vr.sri; r <= vr.eri && drawn < 4000; r += 1) {
      const drow = displayRows[r];
      if (!drow) continue;
      for (let c = vr.sci; c <= vr.eci; c += 1) {
        const isDv = drow[c] && drow[c].sd && drow[c].sd.dv;
        if (!isDv) continue;
        const rect = d.getRect({ sri: r, sci: c, eri: r, eci: c });
        if (!rect || !(rect.width > 0)) continue;
        const el = document.createElement('div');
        el.className = 'rk-dv-marker';
        el.setAttribute('role', 'img');
        el.setAttribute('aria-label', label);
        el.style.left = `${rect.left + rect.width - 8}px`;
        el.style.top = `${rect.top}px`;
        dvLayer.appendChild(el);
        drawn += 1;
      }
    }
  };
  // both overlay layers (data bars + DV markers) repaint on the same events:
  // scroll, load, resize, cell apply. One helper keeps them in lockstep.
  const repaintOverlays = () => { paintDataBars(); paintDvMarkers(); };

  // ---------- local display model ----------
  let meta = null; // {id, name, cols, rows, freeze, merges}
  let dims = { rows: 0, cols: 0 };
  let hiddenRows = new Set(); // filter: 0-based row indices true-hidden in the body

  const data = () => sheet.data;
  const rowsBag = () => data().rows._;

  const idxToCol = (c) => {
    let s = '';
    c += 1;
    while (c > 0) { const m = (c - 1) % 26; s = String.fromCharCode(65 + m) + s; c = (c - m - 1) / 26; }
    return s;
  };
  const colToIdx = (letters) => {
    let n = 0;
    for (const ch of letters) n = n * 26 + (ch.charCodeAt(0) - 64);
    return n - 1;
  };

  // per-build style dedup: a stable JSON key -> index into the styles array
  const makeStyleTable = () => {
    const arr = [];
    const byKey = new Map();
    const idxOf = (ty, sd) => {
      if (!hasStyle(ty, sd)) return undefined;
      const key = `${ty}|${sd ? JSON.stringify(sd) : ''}`;
      let i = byKey.get(key);
      if (i === undefined) { i = arr.length; arr.push(xsStyleFor(ty, sd)); byKey.set(key, i); }
      return i;
    };
    return { arr, idxOf };
  };

  const buildData = () => {
    const gridRows = Math.max(dims.rows + 40, 120);
    const gridCols = Math.min(Math.max(dims.cols + 8, 26), 702);
    const rows = { len: gridRows };
    const styleTable = makeStyleTable();
    anyBars = false; // recomputed from the fresh display: any cell carrying a CF data bar
    anyDv = false;   // any cell flagged as a DV-invalid entry
    for (const [rk, cells] of Object.entries(displayRows)) {
      const out = {};
      for (const [ck, cell] of Object.entries(cells)) {
        const entry = { text: cell.text };
        const st = styleTable.idxOf(cell.ty, cell.sd);
        if (st !== undefined) entry.style = st;
        if (cell.sd && cell.sd.cf && cell.sd.cf.bar) anyBars = true;
        if (cell.sd && cell.sd.dv) anyDv = true;
        out[ck] = entry;
      }
      rows[rk] = { cells: out };
    }
    for (const [rk, def] of Object.entries(meta.rows ?? {})) {
      const ri = Number(rk) - 1;
      (rows[ri] ??= { cells: {} }).height = def.h;
    }
    const cols = { len: gridCols };
    for (const [ck, def] of Object.entries(meta.cols ?? {})) {
      cols[colToIdx(ck)] = { width: def.w };
    }
    // re-apply any active filter's hidden rows to the freshly built row bag
    for (const ri of hiddenRows) (rows[ri] ??= { cells: {} }).hide = true;
    const d = {
      name: meta.name,
      styles: styleTable.arr,
      rows,
      cols,
      merges: [],
    };
    if (meta.freeze && (meta.freeze.r > 0 || meta.freeze.c > 0)) {
      d.freeze = `${idxToCol(meta.freeze.c)}${meta.freeze.r + 1}`;
    }
    if (Array.isArray(meta.merges) && meta.merges.length) {
      d.merges = meta.merges.slice();
      for (const rg of meta.merges) {
        const [a, b] = rg.split(':');
        const pa = /^([A-Z]{1,3})([0-9]+)$/.exec(a);
        const pb = /^([A-Z]{1,3})([0-9]+)$/.exec(b);
        if (!pa || !pb) continue;
        const sr = Number(pa[2]) - 1; const sc = colToIdx(pa[1]);
        const er = Number(pb[2]) - 1; const ec = colToIdx(pb[1]);
        for (let r = sr; r <= er; r += 1) {
          for (let c = sc; c <= ec; c += 1) {
            if (r === sr && c === sc) continue;
            const row = rows[r];
            if (row && row.cells) delete row.cells[c]; // covered cells never draw their own text
          }
        }
        const row = (rows[sr] ??= { cells: {} });
        (row.cells[sc] ??= { text: '' }).merge = [er - sr, ec - sc];
      }
    }
    return d;
  };

  let displayRows = {};

  const setAriaCounts = () => {
    mount.setAttribute('aria-rowcount', String(data().rows.len));
    mount.setAttribute('aria-colcount', String(data().cols.len));
  };

  // ---------- ports of x-spreadsheet sheet internals (source: sheet.js, MIT) ----------
  const tableOffset = () => sheet.getTableOffset();

  const scrollSelectedIntoView = () => {
    const d = data();
    const { l, t, left, top, width, height } = d.getSelectedRect();
    const tOffset = tableOffset();
    if (Math.abs(left) + width > tOffset.width) {
      sheet.horizontalScrollbar.move({ left: l + width - tOffset.width });
    } else {
      const fsw = d.freezeTotalWidth();
      if (left < fsw) sheet.horizontalScrollbar.move({ left: l - 1 - fsw });
    }
    if (Math.abs(top) + height > tOffset.height) {
      sheet.verticalScrollbar.move({ top: t + height - tOffset.height - 1 });
    } else {
      const fsh = d.freezeTotalHeight();
      if (top < fsh) sheet.verticalScrollbar.move({ top: t - 1 - fsh });
    }
  };

  const announce = () => {
    const { ri, ci } = data().selector;
    const cell = rowsBag()[ri]?.cells?.[ci];
    const a1 = `${idxToCol(ci)}${ri + 1}`;
    srCell.textContent = `${a1} ${cell && cell.text !== '' ? cell.text : 'empty'}`;
    if (gridFocused()) armClipboard(); // keep the copy/cut event source armed
  };

  const fireSelect = () => {
    announce();
    const d = data();
    const { ri, ci } = d.selector;
    hooks.onSelect?.({ ri, ci, range: { ...sheet.selector.range } });
  };

  const selectCell = (ri, ci, { scroll = true } = {}) => {
    const d = data();
    ri = Math.max(0, Math.min(ri, d.rows.len - 1));
    ci = Math.max(0, Math.min(ci, d.cols.len - 1));
    sheet.selector.set(ri, ci, true);
    sheet.table.render();
    if (scroll) scrollSelectedIntoView();
    fireSelect();
  };

  const selectEnd = (ri, ci) => {
    const d = data();
    ri = Math.max(0, Math.min(ri, d.rows.len - 1));
    ci = Math.max(0, Math.min(ci, d.cols.len - 1));
    sheet.selector.setEnd(ri, ci, false);
    sheet.table.render();
    // scroll toward the moving corner
    const { left, top, width, height } = d.cellRect(ri, ci);
    const scroll = d.scroll;
    const tOffset = tableOffset();
    const vleft = left - scroll.x; const vtop = top - scroll.y;
    if (vleft + width > tOffset.width) sheet.horizontalScrollbar.move({ left: left + width - tOffset.width });
    else if (vleft < d.freezeTotalWidth()) sheet.horizontalScrollbar.move({ left: left - 1 - d.freezeTotalWidth() });
    if (vtop + height > tOffset.height) sheet.verticalScrollbar.move({ top: top + height - tOffset.height - 1 });
    else if (vtop < d.freezeTotalHeight()) sheet.verticalScrollbar.move({ top: top - 1 - d.freezeTotalHeight() });
    announce();
    hooks.onSelect?.({ ri: data().selector.ri, ci: data().selector.ci, range: { ...sheet.selector.range } });
  };

  const selectRow = (ri) => { sheet.selector.set(ri, -1, false); sheet.table.render(); fireSelect(); };
  const selectCol = (ci) => { sheet.selector.set(-1, ci, false); sheet.table.render(); fireSelect(); };

  // ---------- occupancy walks (ctrl+arrow jumps) ----------
  const occupied = (ri, ci) => {
    const cell = rowsBag()[ri]?.cells?.[ci];
    return !!cell && cell.text !== '' && cell.text !== undefined;
  };
  const jumpTarget = (ri, ci, dr, dc) => {
    const d = data();
    const maxR = d.rows.len - 1; const maxC = d.cols.len - 1;
    const step = (r, c) => [r + dr, c + dc];
    const inBounds = (r, c) => r >= 0 && c >= 0 && r <= maxR && c <= maxC;
    let [r, c] = step(ri, ci);
    if (!inBounds(r, c)) return [ri, ci];
    if (occupied(ri, ci) && occupied(r, c)) {
      // run of filled cells: go to its end
      let [pr, pc] = [r, c];
      while (inBounds(...step(pr, pc)) && occupied(...step(pr, pc))) [pr, pc] = step(pr, pc);
      return [pr, pc];
    }
    // scan for the next filled cell; stop at the edge
    while (inBounds(r, c)) {
      if (occupied(r, c)) return [r, c];
      [r, c] = step(r, c);
    }
    const clamp = (v, hi) => Math.max(0, Math.min(v, hi));
    return [clamp(ri + dr * 1e7, maxR), clamp(ci + dc * 1e7, maxC)];
  };

  const usedBounds = () => {
    let maxR = 0; let maxC = 0; let any = false;
    for (const [rk, row] of Object.entries(displayRows)) {
      const ri = Number(rk);
      for (const ck of Object.keys(row)) {
        any = true;
        if (ri > maxR) maxR = ri;
        const ci = Number(ck);
        if (ci > maxC) maxC = ci;
      }
    }
    return any ? { maxR, maxC } : null;
  };

  // ---------- keyboard model (handoff §8) ----------
  const pageRows = () => Math.max(1, Math.floor(tableOffset().height / rowH) - 1);

  catcher.addEventListener('keydown', (evt) => {
    const mod = evt.metaKey || evt.ctrlKey;
    const d = data();
    const { ri, ci } = d.selector;
    const range = sheet.selector.range;
    const key = evt.key;
    const move = (nri, nci) => { evt.preventDefault(); selectCell(nri, nci); };
    const extend = (nri, nci) => { evt.preventDefault(); selectEnd(nri, nci); };

    const arrows = { ArrowUp: [-1, 0], ArrowDown: [1, 0], ArrowLeft: [0, -1], ArrowRight: [0, 1] };
    if (key in arrows) {
      const [dr, dc] = arrows[key];
      if (mod) {
        const [jr, jc] = jumpTarget(
          evt.shiftKey ? range.eri : ri,
          evt.shiftKey ? range.eci : ci,
          dr, dc,
        );
        if (evt.shiftKey) extend(jr, jc); else move(jr, jc);
      } else if (evt.shiftKey) {
        extend(range.eri + dr, range.eci + dc);
      } else {
        move(ri + dr, ci + dc);
      }
      return;
    }
    if (key === 'Tab') { evt.preventDefault(); selectCell(ri, ci + (evt.shiftKey ? -1 : 1)); return; }
    if (key === 'Enter') { evt.preventDefault(); selectCell(ri + (evt.shiftKey ? -1 : 1), ci); return; }
    if (key === 'PageDown') { move(ri + pageRows(), ci); return; }
    if (key === 'PageUp') { move(Math.max(0, ri - pageRows()), ci); return; }
    if (key === 'Home') { if (mod) move(0, 0); else move(ri, 0); return; }
    if (key === 'End' && mod) { const b = usedBounds(); move(b ? b.maxR : 0, b ? b.maxC : 0); return; }
    if (key === ' ' && evt.shiftKey && !mod) { evt.preventDefault(); selectRow(ri); return; }
    if (key === ' ' && evt.ctrlKey && !evt.shiftKey) { evt.preventDefault(); selectCol(ci); return; }
    if (mod && (key === 'z' || key === 'Z')) { evt.preventDefault(); if (evt.shiftKey) hooks.onRedo?.(); else hooks.onUndo?.(); return; }
    if (mod && (key === 'y' || key === 'Y')) { evt.preventDefault(); hooks.onRedo?.(); return; }
    if (mod && (key === 'f' || key === 'F')) { evt.preventDefault(); hooks.onFind?.(); return; }
    if (mod && (key === 's' || key === 'S')) { evt.preventDefault(); hooks.onSave?.(); return; }
    if (mod && (key === 'b' || key === 'B')) { evt.preventDefault(); hooks.onBold?.(); return; }
    if (mod && (key === 'i' || key === 'I')) { evt.preventDefault(); hooks.onItalic?.(); return; }
    if (mod && (key === 'a' || key === 'A')) {
      evt.preventDefault();
      const b = usedBounds();
      if (b) { selectCell(0, 0, { scroll: false }); selectEnd(b.maxR, b.maxC); }
      return;
    }
    // copy/cut/paste ride the native clipboard events (document listeners)
    if (mod && ['c', 'x', 'v', 'C', 'X', 'V'].includes(key)) return;
    if (key === 'Delete' || key === 'Backspace') { evt.preventDefault(); hooks.onClear?.(rangeA1()); return; }
    if (key === 'F2') { evt.preventDefault(); hooks.onEditStart?.({ initial: null }); return; }
    if (key === 'Escape') { hooks.onEscape?.(); return; }
    if (key === '=' || (key.length === 1 && !mod && !evt.altKey)) {
      evt.preventDefault();
      hooks.onEditStart?.({ initial: key });
      return;
    }
  });

  // native clipboard events — the textarea focus target makes ⌘/Ctrl+C/X/V
  // fire these even in a canvas UI
  catcher.addEventListener('copy', (evt) => {
    evt.preventDefault();
    hooks.onCopy?.(rangeA1(), evt.clipboardData, false);
  });
  catcher.addEventListener('cut', (evt) => {
    evt.preventDefault();
    hooks.onCopy?.(rangeA1(), evt.clipboardData, true);
  });
  catcher.addEventListener('paste', (evt) => {
    evt.preventDefault();
    evt.stopPropagation(); // the renderer's own window paste listener stays dead
    hooks.onPaste?.(evt.clipboardData);
  });

  // double-click opens the editor (renderer's editor is dead in read mode)
  sheet.overlayerEl.el.addEventListener('dblclick', () => { hooks.onEditStart?.({ initial: null }); });

  // ---------- renderer event bridge ----------
  xs.on('cell-selected', () => { announce(); hooks.onSelect?.({ ri: data().selector.ri, ci: data().selector.ci, range: { ...sheet.selector.range } }); });
  xs.on('cells-selected', () => { announce(); hooks.onSelect?.({ ri: data().selector.ri, ci: data().selector.ci, range: { ...sheet.selector.range } }); });

  // ---------- resize seam (port of rowResizerFinished/colResizerFinished) ----------
  const verticalScrollbarSet = () => {
    const d = data();
    sheet.verticalScrollbar.set(tableOffset().height, d.rows.totalHeight() - d.exceptRowTotalHeight(0, -1));
  };
  const horizontalScrollbarSet = () => {
    sheet.horizontalScrollbar.set(tableOffset().width, data().cols.totalWidth());
  };
  sheet.rowResizer.finishedFn = (cRect, distance) => {
    const { ri } = cRect;
    data().rows.setHeight(ri, distance);
    sheet.table.render();
    sheet.selector.resetAreaOffset();
    verticalScrollbarSet();
    repaintOverlays();
    hooks.onResizeRow?.(ri, distance);
    hooks.onViewportChanged?.();
  };
  sheet.colResizer.finishedFn = (cRect, distance) => {
    const { ci } = cRect;
    data().cols.setWidth(ci, distance);
    sheet.table.render();
    sheet.selector.resetAreaOffset();
    horizontalScrollbarSet();
    repaintOverlays();
    hooks.onResizeCol?.(ci, distance);
    hooks.onViewportChanged?.();
  };
  // programmatic size set (undo/redo of resize ops replays through here)
  const setRowHeight = (ri, h) => {
    data().rows.setHeight(ri, h ?? rowH);
    if (h === null || h === undefined) { const row = data().rows._[ri]; if (row) delete row.height; }
    sheet.table.render();
    sheet.selector.resetAreaOffset();
    verticalScrollbarSet();
    repaintOverlays();
  };
  const setColWidth = (ci, w) => {
    if (w === null || w === undefined) { delete data().cols._[ci]; }
    else data().cols.setWidth(ci, w);
    sheet.table.render();
    sheet.selector.resetAreaOffset();
    horizontalScrollbarSet();
    repaintOverlays();
  };

  // ---------- fill handle seam ----------
  const origHideAutofill = sheet.selector.hideAutofill.bind(sheet.selector);
  sheet.selector.hideAutofill = () => {
    const arange = sheet.selector.arange;
    const srange = { ...sheet.selector.range };
    origHideAutofill();
    if (arange && hooks.onFill) {
      const target = { sri: arange.sri, sci: arange.sci, eri: arange.eri, eci: arange.eci };
      if (target.sri !== srange.sri || target.sci !== srange.sci || target.eri !== srange.eri || target.eci !== srange.eci) {
        hooks.onFill(srange, target);
      }
    }
  };

  // ---------- scroll hook (editor/outline reposition) ----------
  for (const key of ['verticalScrollbar', 'horizontalScrollbar']) {
    const bar = sheet[key];
    const orig = bar.moveFn;
    bar.moveFn = (distance, e) => { orig(distance, e); repaintOverlays(); hooks.onViewportChanged?.(); };
  }

  // ---------- geometry for the editor overlay + ref outlines ----------
  const rangeA1 = () => {
    const { sri, sci, eri, eci } = sheet.selector.range;
    return { sri, sci, eri, eci, a1: `${idxToCol(sci)}${sri + 1}:${idxToCol(eci)}${eri + 1}` };
  };

  const api = {
    xs,
    focus: focusGrid,
    focused: gridFocused,
    catcher,
    overlayEl: sheet.overlayerCEl.el,

    loadSheet({ sheetMeta, display }) {
      meta = sheetMeta;
      dims = display.dims;
      displayRows = display.rows;
      hiddenRows = new Set(); // filter is per-sheet view state; a fresh load clears it
      xs.loadData([buildData()]);
      setAriaCounts();
      selectCell(0, 0);
      focusGrid();
      repaintOverlays();
    },
    refreshDisplay({ display }) { // same sheet, full re-pull (structural ops)
      const { ri, ci } = data().selector;
      const scroll = { x: data().scroll.x, y: data().scroll.y };
      dims = display.dims;
      displayRows = display.rows;
      xs.loadData([buildData()]);
      setAriaCounts();
      // restore viewport + selection
      sheet.horizontalScrollbar.move({ left: scroll.x });
      sheet.verticalScrollbar.move({ top: scroll.y });
      selectCell(ri, ci, { scroll: false });
      repaintOverlays();
    },
    setMeta(sheetMeta) { meta = sheetMeta; },
    applyCells(cells, sheetName) {
      const bag = rowsBag();
      for (const { sheet: sname, r, c, text, ty, sd, num } of cells) {
        if (sname !== meta.name) continue;
        // a truly cleared cell carries no text, no type, no style -> delete
        if (text === '' && ty === '' && !sd) {
          const row = bag[r];
          if (row && row.cells) delete row.cells[c];
          const drow = displayRows[r]; if (drow) delete drow[c];
          continue;
        }
        const row = (bag[r] ??= { cells: {} });
        row.cells ??= {};
        const entry = { text };
        if (hasStyle(ty, sd)) entry.style = data().addStyle(xsStyleFor(ty, sd));
        row.cells[c] = entry;
        const drec = { text, ty };
        if (sd) drec.sd = sd;
        if (num !== undefined) drec.num = num;
        (displayRows[r] ??= {})[c] = drec;
        if (r >= dims.rows) dims.rows = r + 1;
        if (c >= dims.cols) dims.cols = c + 1;
        if (sd && sd.cf && sd.cf.bar) anyBars = true;
        if (sd && sd.dv) anyDv = true;
      }
      sheet.table.render();
      repaintOverlays();
    },

    selection: () => ({ ri: data().selector.ri, ci: data().selector.ci, range: { ...sheet.selector.range } }),
    rangeA1,
    selectCell,
    selectEnd,
    selectRange(sri, sci, eri, eci) { selectCell(sri, sci); selectEnd(eri, eci); },
    activeA1: () => { const { ri, ci } = data().selector; return `${idxToCol(ci)}${ri + 1}`; },

    selectedRect: () => data().getSelectedRect(),
    // rect of the ACTIVE (anchor) cell — where the in-cell editor sits
    selectedEditRect() {
      const { ri, ci } = data().selector;
      return data().getRect({ sri: ri, sci: ci, eri: ri, eci: ci });
    },
    currentSheetName: () => meta?.name ?? '',
    rectOfRange: (sri, sci, eri, eci) => data().getRect({ sri, sci, eri, eci }),
    // typed cells within a range (clamped to used cells) — selection stats etc.
    cellsInRange(sri, sci, eri, eci) {
      const out = [];
      for (const [rk, row] of Object.entries(displayRows)) {
        const r = Number(rk);
        if (r < sri || r > eri) continue;
        for (const [ck, cell] of Object.entries(row)) {
          const c = Number(ck);
          if (c < sci || c > eci) continue;
          out.push({ r, c, text: cell.text, ty: cell.ty, num: cell.num });
        }
      }
      return out;
    },
    usedDims: () => ({ rows: dims.rows, cols: dims.cols }),
    tableOffset,
    cellText: (ri, ci) => rowsBag()[ri]?.cells?.[ci]?.text ?? '',
    displayGrid(sri, sci, eri, eci) {
      const out = [];
      for (let r = sri; r <= eri; r += 1) {
        const row = [];
        for (let c = sci; c <= eci; c += 1) row.push(rowsBag()[r]?.cells?.[c]?.text ?? '');
        out.push(row);
      }
      return out;
    },
    setRowHeight,
    setColWidth,
    // ---------- filter: TRUE-hide rows in the body (handoff §8) ----------
    // The renderer's rows.setHide gives height 0, so hidden rows never draw in
    // the body or the number gutter (the jump in row numbers is the honest
    // signal); the DIMMED filtered count lives in the app's status bar.
    setHiddenRows(set) {
      const next = new Set(set);
      const d = data();
      for (const ri of hiddenRows) if (!next.has(ri)) d.rows.setHide(ri, false);
      for (const ri of next) d.rows.setHide(ri, true);
      hiddenRows = next;
      d.rows.len; // no-op read; keep len intact
      sheet.table.render();
      sheet.selector.resetAreaOffset();
      verticalScrollbarSet();
      repaintOverlays();
    },
    hiddenRowCount: () => hiddenRows.size,
    isRowHidden: (ri) => hiddenRows.has(ri),
    showClipboardMarquee() { data().copy(); sheet.selector.showClipboard(); },
    hideClipboardMarquee() { data().clearClipboard(); sheet.selector.hideClipboard(); },
    scrollIntoView: scrollSelectedIntoView,
    reload() { sheet.reload(); },
    // Batch L data-bar overlay: repaint hook + a count for the e2e surface
    paintDataBars,
    dataBarCount: () => barLayer.childElementCount,
    // Batch M DV markers: repaint hook + a count for the e2e surface
    paintDvMarkers,
    dvMarkerCount: () => dvLayer.childElementCount,
    // rect of the active/anchor cell in overlay coordinates — the DV list
    // dropdown affordance pins to this (same space as the data-bar/marker layers,
    // i.e. api.overlayEl = sheet.overlayerCEl.el)
    overlayRectOf: (ri, ci) => data().getRect({ sri: ri, sci: ci, eri: ri, eci: ci }),
    idxToCol,
    colToIdx,
  };
  return api;
}

//__RK_INLINE_BEGIN ui/editor.mjs
// Reckon — edit controller: one edit session shown in two instruments — the
// in-cell editor overlay and the formula bar (monospace, ref colouring
// matching the range outlines drawn over the grid; autocomplete for function
// names and defined names). Commit goes to the app's transaction path; this
// module never evaluates anything (handoff §10).
//
// Module contract (single-file doctrine): no imports; uses globalThis.Reckon
// helpers (formula-lang); registers on globalThis.Reckon.

export function createEditController({ grid, bar, getCellRaw, getFnNames, getDefinedNames, onCommit, onCancel }) {
  const RK = globalThis.Reckon;

  // ---------- DOM ----------
  const overlay = document.createElement('div'); // ref outlines layer
  overlay.className = 'rk-ref-outlines';
  grid.overlayEl.appendChild(overlay);

  const cellBox = document.createElement('div');
  cellBox.className = 'rk-cell-editor';
  cellBox.hidden = true;
  const cellInput = document.createElement('input');
  cellInput.type = 'text';
  cellInput.spellcheck = false;
  cellInput.autocomplete = 'off';
  cellInput.setAttribute('aria-label', 'Cell editor');
  cellBox.appendChild(cellInput);
  grid.overlayEl.appendChild(cellBox);

  const ac = document.createElement('div'); // autocomplete dropdown
  ac.className = 'rk-autocomplete';
  ac.hidden = true;
  ac.setAttribute('role', 'listbox');
  document.body.appendChild(ac);

  const barInput = bar.input;
  const barMirror = bar.mirror;

  // ---------- state ----------
  let session = null; // {a1, ri, ci, text, source: 'cell'|'bar'}
  let acItems = [];
  let acIndex = -1;

  const active = () => session !== null;

  // ---------- colouring ----------
  const esc = (s) => s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  const colourHtml = (text) => {
    if (!text.startsWith('=')) return esc(text);
    const refs = RK.extractRefs(text);
    const colorAt = new Map(refs.map((r) => [r.start, r.colorIdx]));
    let html = '';
    for (const tok of RK.tokenizeFormula(text)) {
      if (tok.type === 'ref' && colorAt.has(tok.start)) {
        html += `<span class="rk-ref rk-ref-${colorAt.get(tok.start)}">${esc(tok.text)}</span>`;
      } else if (tok.type === 'fn') {
        html += `<span class="rk-tok-fn">${esc(tok.text)}</span>`;
      } else if (tok.type === 'str') {
        html += `<span class="rk-tok-str">${esc(tok.text)}</span>`;
      } else {
        html += esc(tok.text);
      }
    }
    return html;
  };

  const drawOutlines = () => {
    overlay.textContent = '';
    if (!session || !session.text.startsWith('=')) return;
    const refs = RK.extractRefs(session.text);
    const seen = new Set();
    for (const ref of refs) {
      if (ref.sheet !== null && ref.sheet !== grid.currentSheetName?.()) continue; // other-sheet refs have no rect here
      const key = `${ref.sr},${ref.sc},${ref.er},${ref.ec}`;
      if (seen.has(key)) continue;
      seen.add(key);
      const rect = grid.rectOfRange(ref.sr, ref.sc, ref.er, ref.ec);
      if (!rect || rect.width === undefined) continue;
      const el = document.createElement('div');
      el.className = `rk-ref-outline rk-ref-border-${ref.colorIdx}`;
      el.style.left = `${rect.left}px`;
      el.style.top = `${rect.top}px`;
      el.style.width = `${rect.width}px`;
      el.style.height = `${rect.height}px`;
      overlay.appendChild(el);
    }
  };

  const syncMirror = () => {
    barMirror.innerHTML = colourHtml(barInput.value);
    barMirror.scrollLeft = barInput.scrollLeft;
  };

  // ---------- autocomplete ----------
  const acClose = () => { ac.hidden = true; acItems = []; acIndex = -1; };
  const acQuery = (input) => {
    const text = input.value;
    if (!text.startsWith('=')) return null;
    const upToCaret = text.slice(0, input.selectionStart ?? text.length);
    const m = /(?:^|[^A-Za-z0-9_.$!])([A-Za-z_][A-Za-z0-9_.]*)$/.exec(upToCaret);
    if (!m || m[1].length < 1) return null;
    // a plain cell ref prefix (e.g. "A1") is not an autocomplete target
    if (/^[A-Za-z]{1,3}[0-9]+$/.test(m[1])) return null;
    return { prefix: m[1], start: upToCaret.length - m[1].length };
  };
  const acOpen = (input) => {
    const q = acQuery(input);
    if (!q) { acClose(); return; }
    const P = q.prefix.toUpperCase();
    const fns = getFnNames().filter((f) => f.startsWith(P)).slice(0, 8).map((f) => ({ label: f, kind: 'fn' }));
    const names = Object.keys(getDefinedNames()).filter((n) => n.toUpperCase().startsWith(P)).slice(0, 4).map((n) => ({ label: n, kind: 'name' }));
    acItems = [...fns, ...names];
    if (acItems.length === 0 || (acItems.length === 1 && acItems[0].label === P)) { acClose(); return; }
    acIndex = 0;
    ac.innerHTML = '';
    acItems.forEach((item, i) => {
      const row = document.createElement('div');
      row.className = 'rk-ac-item' + (i === acIndex ? ' active' : '');
      row.setAttribute('role', 'option');
      row.innerHTML = `<span class="rk-ac-label">${esc(item.label)}</span><span class="rk-ac-kind">${item.kind === 'fn' ? 'function' : 'name'}</span>`;
      row.addEventListener('mousedown', (e) => { e.preventDefault(); acAccept(input, i); });
      ac.appendChild(row);
    });
    const r = input.getBoundingClientRect();
    ac.style.left = `${r.left}px`;
    ac.style.top = `${r.bottom + 2}px`;
    ac.style.minWidth = `${Math.min(r.width, 280)}px`;
    ac.hidden = false;
    ac.dataset.start = String(q.start);
    ac.dataset.prefixLen = String(q.prefix.length);
  };
  const acMove = (delta) => {
    if (ac.hidden || acItems.length === 0) return;
    acIndex = (acIndex + delta + acItems.length) % acItems.length;
    [...ac.children].forEach((el, i) => el.classList.toggle('active', i === acIndex));
  };
  const acAccept = (input, idx = acIndex) => {
    if (ac.hidden || idx < 0 || !acItems[idx]) return false;
    const start = Number(ac.dataset.start);
    const plen = Number(ac.dataset.prefixLen);
    const item = acItems[idx];
    const insert = item.kind === 'fn' ? `${item.label}(` : item.label;
    const text = input.value;
    input.value = text.slice(0, start) + insert + text.slice(start + plen);
    const caret = start + insert.length;
    input.setSelectionRange(caret, caret);
    acClose();
    onInput(input);
    return true;
  };

  // ---------- session ----------
  const positionCellBox = () => {
    if (!session) return;
    const rect = grid.selectedEditRect();
    cellBox.style.left = `${rect.left - 1}px`;
    cellBox.style.top = `${rect.top - 1}px`;
    cellBox.style.minWidth = `${rect.width + 1}px`;
    cellBox.style.height = `${rect.height + 1}px`;
    cellInput.style.minWidth = `${rect.width - 3}px`;
  };

  const onInput = (input) => {
    if (!session) return;
    session.text = input.value;
    const other = input === cellInput ? barInput : cellInput;
    if (other.value !== session.text) other.value = session.text;
    syncMirror();
    drawOutlines();
    acOpen(input);
    if (input === cellInput) {
      // grow with content
      cellInput.style.width = `${Math.max(cellInput.scrollWidth + 8, parseFloat(cellInput.style.minWidth) || 0)}px`;
    }
  };

  const start = async ({ initial = null, source = 'cell', selectAll = false } = {}) => {
    if (session) return;
    const { ri, ci } = grid.selection();
    const a1 = grid.activeA1();
    let text;
    if (initial !== null) text = initial; // type-to-replace
    else {
      const cell = await getCellRaw(a1);
      text = cell === null || cell === undefined ? '' : String(cell);
    }
    session = { a1, ri, ci, text, source };
    cellBox.hidden = false;
    positionCellBox();
    cellInput.value = text;
    barInput.value = text;
    barInput.readOnly = false;
    syncMirror();
    drawOutlines();
    const input = source === 'bar' ? barInput : cellInput;
    input.focus();
    if (selectAll) input.select();
    else input.setSelectionRange(text.length, text.length);
    document.body.classList.add('rk-editing');
  };

  const stop = () => {
    session = null;
    cellBox.hidden = true;
    cellInput.value = '';
    cellInput.style.width = '';
    overlay.textContent = '';
    acClose();
    barInput.readOnly = true;
    document.body.classList.remove('rk-editing');
    // hand focus back to the grid SYNCHRONOUSLY — a hidden input drops focus
    // to <body> and keystrokes typed before the async commit lands would vanish
    grid.focus();
  };

  const commit = (moveDir) => {
    if (!session) return;
    const { a1, text } = session;
    stop();
    onCommit({ a1, text, moveDir });
  };
  const cancel = () => {
    if (!session) return;
    stop();
    onCancel();
  };

  // ---------- input wiring ----------
  for (const input of [cellInput, barInput]) {
    input.addEventListener('input', () => onInput(input));
    input.addEventListener('scroll', () => { if (input === barInput) barMirror.scrollLeft = barInput.scrollLeft; });
    input.addEventListener('keydown', (evt) => {
      if (!session) return;
      const key = evt.key;
      if (!ac.hidden) {
        if (key === 'ArrowDown') { evt.preventDefault(); acMove(1); return; }
        if (key === 'ArrowUp') { evt.preventDefault(); acMove(-1); return; }
        if (key === 'Tab' || key === 'Enter') {
          if (acAccept(input)) { evt.preventDefault(); return; }
        }
        if (key === 'Escape') { evt.preventDefault(); acClose(); return; }
      }
      if (key === 'Enter') { evt.preventDefault(); commit(evt.shiftKey ? 'up' : 'down'); return; }
      if (key === 'Tab') { evt.preventDefault(); commit(evt.shiftKey ? 'left' : 'right'); return; }
      if (key === 'Escape') { evt.preventDefault(); cancel(); return; }
      evt.stopPropagation(); // typing stays in the editor — the grid model never sees it
    });
  }

  // clicking the (read-only) formula bar starts editing the active cell
  barInput.addEventListener('focus', () => { if (!session) start({ source: 'bar' }); });

  // clicks outside while editing commit the session (Excel behaviour)
  document.addEventListener('mousedown', (evt) => {
    if (!session) return;
    if (cellBox.contains(evt.target) || bar.wrap.contains(evt.target) || ac.contains(evt.target)) return;
    commit(null);
  }, true);

  return {
    active,
    start,
    cancel,
    commit,
    reposition() { if (session) { positionCellBox(); drawOutlines(); } },
    setBarText(text) { if (!session) { barInput.value = text ?? ''; syncMirror(); } },
    destroy() { overlay.remove(); cellBox.remove(); ac.remove(); },
  };
}

// Reckon — the formats / data toolbar (Batch D). A dense single-row instrument
// panel between the formula bar and the grid: number formats, text style,
// alignment, cell colour (neutral ramp + the single accent only — no arbitrary
// picker, handoff §8), borders, sort, filter, named ranges, freeze panes.
//
// The toolbar owns NO state and mutates NOTHING directly: every control calls a
// hook the app wires to a transaction (L4). It reflects the active cell's format
// through setActive(). Popovers are in-app (§13: no native selects/dialogs).
//
// Module contract (single-file doctrine): no imports; uses globalThis.Reckon
// (formats id math); registers on globalThis.Reckon.

export function createToolbar({ mount, hooks = {} }) {
  const RK = globalThis.Reckon;
  const CURRENCIES = RK.FORMAT_META?.CURRENCIES ?? ['INR', 'USD', 'EUR', 'GBP', 'JPY'];

  // ---------- popover host (one open at a time) ----------

  const closePop = () => { if (openPop) { openPop.remove(); openPop = null; document.removeEventListener('mousedown', outside, true); } };
  const outside = (e) => { if (openPop && !openPop.contains(e.target) && !e.target.closest?.('.rk-tb-btn')) closePop(); };
  const popover = (anchor, build) => {
    const wasOpen = openPop && openPop.dataset.for === anchor.dataset.k;
    closePop();
    if (wasOpen) return;
    const pop = document.createElement('div');
    pop.className = 'rk-tb-pop';
    pop.dataset.for = anchor.dataset.k;
    build(pop);
    mount.appendChild(pop);
    const r = anchor.getBoundingClientRect();
    const m = mount.getBoundingClientRect();
    pop.style.left = `${Math.max(2, r.left - m.left)}px`;
    pop.style.top = `${r.bottom - m.top + 2}px`;
    openPop = pop;
    document.addEventListener('mousedown', outside, true);
  };

  const btn = (label, { title, k, cls = '' } = {}) => {
    const b = document.createElement('button');
    b.type = 'button';
    b.className = `rk-tb-btn ${cls}`.trim();
    b.innerHTML = label;
    if (title) b.title = title;

  const ICON = {

    alignC: svg('<g stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><line x1="2" y1="4" x2="14" y2="4"/><line x1="5" y1="8" x2="11" y2="8"/><line x1="4" y1="12" x2="12" y2="12"/></g>'),
    alignR: svg('<g stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><line x1="2" y1="4" x2="14" y2="4"/><line x1="6" y1="8" x2="14" y2="8"/><line x1="4" y1="12" x2="14" y2="12"/></g>'),
    fill: svg('<rect x="2.5" y="2.5" width="11" height="11" rx="1" fill="none" stroke="currentColor" stroke-width="1.3"/><rect x="2.5" y="9.5" width="11" height="4" fill="currentColor"/>'),

// Reckon — the agent face (Batch F): window.reckon (handoff §6) + the
// BroadcastChannel("reckon") cross-tab bus. This module owns ONLY the API shape,
// event fan-out, and cross-tab messaging. It performs NO writes itself: setRange
// / recalc are thin calls into app-provided adapters that go through the single
// write path (applyTransaction, actor:"api"). eval never commits. The API cannot
// toggle settings, grant FSA, or read keys — those adapters are simply not given
// to it (§13).
//
// Module contract (single-file doctrine): no imports; uses globalThis; registers
// on globalThis.Reckon.

export function createAgentFace(deps) {
  const {
    version,
    sheets,        // () -> [{id,name}]
    activeSheet,   // () -> {id,name}
    getRange,      // (ref) -> Promise<{values, formulas}>
    setRange,      // (ref, values) -> Promise<txId>   (goes through applyTransaction, actor:"api")
    evalFormula,   // (formula, {sheet, at}) -> Promise<value | {error}>   (no commit)
    recalc,        // () -> Promise<void>
    exportBlob,    // (kind) -> Promise<Blob>
    originLabel = () => (typeof location !== 'undefined' ? location.origin : 'bookmarklet'),
  } = deps;

  const listeners = { change: new Set(), recalc: new Set() };
  const deliver = (bag, msg) => { for (const fn of bag) { try { fn(msg); } catch { /* listener error is not ours */ } } };

  let channel = null;
  try { channel = new BroadcastChannel('reckon'); } catch { channel = null; }
  if (channel) channel.onmessage = (e) => {
    const m = e && e.data;
    if (m && (m.type === 'change' || m.type === 'recalc')) deliver(listeners[m.type], m);
  };
  const broadcast = (type, payload) => { if (channel) { try { channel.postMessage({ type, payload, origin: originLabel() }); } catch { /* channel closed */ } } };

  // fan a locally-produced event out to same-tab listeners AND other tabs
  const emit = (type, payload) => {
    const msg = { type, payload, origin: originLabel() };
    deliver(listeners[type] ?? new Set(), msg);
    broadcast(type, payload);
  };

  const reckon = {
    get version() { return version; },
    sheets: () => sheets(),
    activeSheet: () => activeSheet(),
    getRange: (ref) => getRange(ref),
    async setRange(ref, values) {
      const txId = await setRange(ref, values);
      // The face owns the change event for an API write (it carries the `ref`);
      // the app's txApply deliberately does NOT notify for actor:"api" so the
      // fan-out is single, not double (L4).
      emit('change', { ref, txId, actor: 'api' });
      return txId;
    },
    eval: (formula, opts) => evalFormula(formula, opts || {}),
    async recalc() { await recalc(); emit('recalc', {}); },
    export: (kind) => exportBlob(kind),
    on(evt, fn) {
      if (!listeners[evt] || typeof fn !== 'function') return () => {};
      listeners[evt].add(fn);
      return () => listeners[evt].delete(fn);
    },
  };

  return {
    reckon,
    // the app calls this after ANY committed transaction / recalc (owner or api)
    // so window.reckon.on('change') and other tabs see every mutation
    notify: (type, payload) => emit(type, payload),
    dispose() { try { channel && channel.close(); } catch { /* already closed */ } listeners.change.clear(); listeners.recalc.clear(); },
  };
}

// Reckon — the sidecar (Batch G): AI that PROPOSES, never acts (L5). Two
// features (handoff §7): `=?` formula-from-description (proposed formula text
// lands in a staging slot beneath the formula bar, the engine PRE-EVALUATES it
// via evalFormula WITHOUT committing, Enter accepts as a normal owner
// transaction, Esc discards) and Explain-formula (prose in a side panel;
// nothing to commit).
//
// Ground floor is zero-AI: every other feature works with no model. The
// inference ladder (L6 / Edge-First) is: (1) nakli-local-bridge (Ollama on
// 127.0.0.1) → (2) WebGPU / Transformers.js (opt-in download, size shown) →
// (3) BYOK (key in IndexedDB, fingerprint shown, never sent to our origin). No
// relay at v1.0. When no rung is available the `=?` affordance DIMS (never
// hides). No AI call ever happens without an explicit user action; the network
// is only ever touched when the user presses Send.
//
// The model transport is a SEAM: a `proposer` is `{ rung, label, propose }`
// where `propose({ kind, messages }) -> Promise<string>`. The three ladder
// rungs are proposer factories; tests inject a fake proposer at this seam.
//
// Module contract (single-file doctrine): no static imports; uses globalThis;
// registers on globalThis.Reckon. DOM is touched only inside createSidecar.

// ---------- caps: the slice is bounded, the whole sheet is NEVER sent ----------
const MAX_CTX_CELLS = 60;
const MAX_HEADERS = 40;
const MAX_NAMES = 30;

// Assemble the bounded context slice + the human-readable "what will be sent"
// text from pieces the caller has ALREADY bounded (selection cells, enclosing-
// block headers, named ranges, locale). Pure — node-testable. It never receives
// and never emits the whole sheet: the caller passes only the slice inputs, and
// every list here is additionally capped.
export function buildContextSlice({ selectionRef = '', cells = [], columnHeaders = {}, rowLabels = {}, namedRanges = {}, locale = 'en-US' } = {}) {
  const capObj = (obj, n) => Object.fromEntries(Object.entries(obj).slice(0, n));
  const slice = {
    locale,
    selection: selectionRef,
    cells: cells.slice(0, MAX_CTX_CELLS).map((c) => ({ a1: c.a1, value: c.value ?? null, formula: c.formula ?? null })),
    columnHeaders: capObj(columnHeaders, MAX_HEADERS),
    rowLabels: capObj(rowLabels, MAX_HEADERS),
    namedRanges: capObj(namedRanges, MAX_NAMES),
  };
  return { slice, summary: summarizeContext(slice) };
}

export function summarizeContext(slice) {
  const cols = Object.entries(slice.columnHeaders).map(([k, v]) => `${k}=${v}`);
  const names = Object.keys(slice.namedRanges);
  const lines = [
    `Locale: ${slice.locale}`,
    `Selection: ${slice.selection || '(none)'}`,
    `${slice.cells.length} selected cell${slice.cells.length === 1 ? '' : 's'} (value + formula)`,
  ];
  if (cols.length) lines.push(`Column headers: ${cols.join(', ')}`);
  if (Object.keys(slice.rowLabels).length) lines.push(`Row labels: ${Object.values(slice.rowLabels).join(', ')}`);
  if (names.length) lines.push(`Named ranges: ${names.join(', ')}`);
  lines.push('The full sheet is never sent.');
  return lines.join('\n');
}

// VaultMind pattern: show a stable, non-reversible fingerprint of a BYOK key so
// the user can recognise it without the key ever being displayed. FNV-1a over
// the key + its length; the raw key is never returned or logged.
export function keyFingerprint(key) {
  const s = String(key || '');
  if (!s) return '';
  let h = 0x811c9dc5;
  for (let i = 0; i < s.length; i += 1) { h ^= s.charCodeAt(i); h = Math.imul(h, 0x01000193); }
  const hex = (h >>> 0).toString(16).padStart(8, '0');
  return `fp:${hex} · ${s.length} chars`;
}

// Ladder priority: local bridge first (fastest, most private), then on-device
// WebGPU, then BYOK. Returns the highest available rung id, or null (ground
// floor — no model).
export function pickRung(state = {}) {
  if (state.bridge) return 'bridge';
  if (state.webgpu) return 'webgpu';
  if (state.byok) return 'byok';
  return null;
}
export function rungLabel(rung) {
  return rung === 'bridge' ? 'local bridge' : rung === 'webgpu' ? 'on-device (WebGPU)' : rung === 'byok' ? 'your provider (BYOK)' : 'no model';
}

// Prompt construction. The system prompt pins the output shape; the user prompt
// carries ONLY the bounded slice.
export function buildFormulaMessages(description, slice) {
  const ctx = summarizeContext(slice);
  const headerHint = Object.entries(slice.columnHeaders).map(([col, h]) => `${col}: "${h}"`).join(', ');
  const names = Object.entries(slice.namedRanges).map(([n, r]) => `${n} -> ${r}`).join(', ');
  return [
    { role: 'system', content: 'You write spreadsheet formulas for a HyperFormula/Excel-compatible engine. Reply with ONE formula only, beginning with "=". No prose, no explanation, no markdown code fences.' },
    { role: 'user', content: `Locale: ${slice.locale}. Target cell: ${slice.selection}.\n${headerHint ? `Columns: ${headerHint}.\n` : ''}${names ? `Named ranges: ${names}.\n` : ''}Task: ${description}\n\n(${ctx.replace(/\n/g, ' ')})` },
  ];
}
export function buildExplainMessages(formula, slice) {
  const headerHint = Object.entries(slice.columnHeaders).map(([col, h]) => `${col}: "${h}"`).join(', ');
  return [
    { role: 'system', content: 'You explain spreadsheet formulas in plain language, concisely (2-5 sentences). Describe what the formula computes and what each part does. No markdown headings.' },
    { role: 'user', content: `${headerHint ? `Columns: ${headerHint}.\n` : ''}Explain this formula: ${formula}` },
  ];
}

// Pull a single formula out of a model reply: drop code fences, take the first
// line that looks like a formula, guarantee a leading "=". If nothing formula-
// shaped is found, return the trimmed reply so the pre-eval fails LOUDLY
// (#NAME?/#VALUE!) rather than silently — an honest failure surface.
export function extractFormula(text) {
  let t = String(text || '').trim();
  t = t.replace(/```[a-zA-Z]*\n?/g, '').replace(/```/g, '').trim();
  const lines = t.split('\n').map((l) => l.trim()).filter(Boolean);
  let cand = lines.find((l) => l.startsWith('=')) ?? lines[0] ?? '';
  cand = cand.replace(/^`+|`+$/g, '').trim();
  if (cand && !cand.startsWith('=')) cand = `=${cand}`;
  return cand;
}

// ---------- ladder transports (real; each is a proposer factory) ----------

const withTimeout = (ms) => { const c = new AbortController(); const t = setTimeout(() => c.abort(), ms); return { signal: c.signal, done: () => clearTimeout(t) }; };
const hostOf = (u) => { try { return new URL(u).host; } catch { return String(u); } };

// Rung 1 — nakli-local-bridge (Ollama). Probe /api/tags; chat via /api/chat.
export async function probeBridge(base = 'http://127.0.0.1:11434') {
  const to = withTimeout(1500);
  try {
    const r = await fetch(`${base.replace(/\/$/, '')}/api/tags`, { signal: to.signal });
    if (!r.ok) return null;
    const j = await r.json();
    return (j.models || []).map((m) => m.name).filter(Boolean);
  } catch { return null; } finally { to.done(); }
}
export function bridgeProposer({ base = 'http://127.0.0.1:11434', model }) {
  return {
    rung: 'bridge', label: `local bridge · ${model}`,
    async propose({ messages }) {
      const to = withTimeout(60000);
      try {
        const r = await fetch(`${base.replace(/\/$/, '')}/api/chat`, {
          method: 'POST', headers: { 'Content-Type': 'application/json' }, signal: to.signal,
          body: JSON.stringify({ model, messages, stream: false, options: { temperature: 0 } }),
        });
        if (!r.ok) throw new Error(`bridge HTTP ${r.status}`);
        const j = await r.json();
        return j.message?.content ?? '';
      } finally { to.done(); }
    },
  };
}

// Rung 3 — BYOK (OpenAI-compatible). Key never reaches our origin: it is sent
// only in the Authorization header to the user's chosen provider host (which
// CSP connect-src must allowlist). Never guard on key presence — some local
// servers need none — but for a remote provider the key is required by them.
export function byokProposer({ base, model, key }) {
  return {
    rung: 'byok', label: `${hostOf(base)} · ${model}`,
    async propose({ messages }) {
      const to = withTimeout(60000);
      try {
        const r = await fetch(`${base.replace(/\/$/, '')}/chat/completions`, {
          method: 'POST', signal: to.signal,
          headers: { 'Content-Type': 'application/json', ...(key ? { Authorization: `Bearer ${key}` } : {}) },
          body: JSON.stringify({ model, messages, temperature: 0, max_tokens: 400, stream: false }),
        });
        if (!r.ok) throw new Error(`provider HTTP ${r.status}`);
        const j = await r.json();
        return j.choices?.[0]?.message?.content ?? '';
      } finally { to.done(); }
    },
  };
}
