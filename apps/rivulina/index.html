<style>/* 00-base.css */
/* 00-base.css — tokens, layout, buttons, dialogs, focus. Owned by core. Areas add their own file in src/css/
   (named <nn>-<area>.css) and use these tokens; they never restyle another area's elements. Light by default. */
:root {
  --bg: #f6f7f5; --panel: #ffffff; --ink: #1d2523; --muted: #5b6763; --line: #dfe4e1;
  --accent: #0f766e; --accent-ink: #ffffff; --accent-soft: #d8eeeb; --ok: #15803d; --warn: #a16207; --err: #b91c1c;
  --sel-bg: #e3f1ee; --unread: #0f766e; --star: #ca8a04;
  --radius: 8px; --gap: 12px; --font: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --mono: ui-monospace, "SF Mono", Menlo, monospace; --topbar-h: 48px; --player-h: 64px;
  color-scheme: light;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font: 14px/1.45 var(--font); }
#app { display: grid; grid-template-rows: var(--topbar-h) 1fr auto; height: 100vh; height: 100dvh; overflow: hidden; }
.panes { display: grid; grid-template-columns: minmax(200px, 260px) minmax(260px, 380px) 1fr; min-height: 0; }
.pane { min-height: 0; overflow: auto; background: var(--panel); border-right: 1px solid var(--line); }
.pane.detail { border-right: 0; background: var(--bg); }
.topbar { display: flex; align-items: center; gap: 8px; padding: 0 12px; background: var(--panel); border-bottom: 1px solid var(--line); min-width: 0; }
.playerbar { background: var(--panel); border-top: 1px solid var(--line); min-height: 0; }
.playerbar:empty { display: none; }

/* One pane at a time below 900 px: #app[data-pane] picks it. */
@media (max-width: 900px) {
  .panes { grid-template-columns: 1fr; }
  .pane { border-right: 0; }
  /* Hide the other panes with a selector stronger than any area's own display rule on its pane. */
  #app:not([data-pane="sidebar"]) .panes > .pane.sidebar, #app:not([data-pane="list"]) .panes > .pane.list, #app:not([data-pane="detail"]) .panes > .pane.detail { display: none; }
}

/* Buttons and inputs */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 32px; padding: 4px 12px; border: 1px solid var(--line); border-radius: var(--radius); background: var(--panel); color: var(--ink); font: inherit; cursor: pointer; white-space: nowrap; }
.btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.icon { min-width: 32px; padding: 4px 8px; }
.btn.ghost { border-color: transparent; background: transparent; }
.btn[disabled], .btn[aria-disabled="true"] { opacity: .45; cursor: not-allowed; }
input[type="text"], input[type="search"], input[type="url"], input[type="number"], select, textarea { font: inherit; color: var(--ink); background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 6px 10px; min-height: 32px; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.muted { color: var(--muted); }
.badge { display: inline-block; padding: 0 6px; border-radius: 999px; font-size: 12px; line-height: 18px; background: var(--accent-soft); color: var(--accent); }
.badge.warn { background: #fef3c7; color: var(--warn); }
.badge.err { background: #fee2e2; color: var(--err); }

/* Dialogs (ui/dom.js dialog()) */
dialog.dlg { border: 1px solid var(--line); border-radius: 12px; padding: 0; width: min(640px, calc(100vw - 32px)); max-height: calc(100vh - 64px); background: var(--panel); color: var(--ink); box-shadow: 0 12px 40px rgba(0,0,0,.18); }
dialog.dlg::backdrop { background: rgba(20, 30, 28, .28); }
.dlg-head { display: flex; align-items: center; justify-content: space-between; padding: 12px 16px; border-bottom: 1px solid var(--line); }
.dlg-head h2 { margin: 0; font-size: 16px; }
.dlg-body { padding: 16px; overflow: auto; max-height: calc(100vh - 140px); }

/* Status bar message (the shell area places #status; core styles it) */
#status { font-size: 13px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
#status[data-kind="err"] { color: var(--err); }
#status[data-kind="warn"] { color: var(--warn); }
#status[data-kind="ok"] { color: var(--ok); }

/* Cover art (ui/dom.js cover()): an image, or a tile with a letter when no image loads. */
.cover { display: inline-flex; flex: none; width: var(--cover-size, 48px); height: var(--cover-size, 48px); border-radius: 6px; overflow: hidden; background: var(--accent-soft); color: var(--accent); align-items: center; justify-content: center; }
.cover img { width: 100%; height: 100%; object-fit: cover; display: block; }
.cover-letter { font-weight: 700; font-size: calc(var(--cover-size, 48px) * .45); line-height: 1; }

/* 10-routes.css */
/* 10-routes.css — the settings dialog (ui/settings-dialog.js). Owned by the routes area; styles only .rt- classes. */
dialog.dlg.rt-settings { width: min(640px, calc(100vw - 32px)); }
.rt-sec { padding: 4px 0 16px; border-top: 1px solid var(--line); }
.rt-sec:first-child { border-top: 0; }
.rt-sec:focus { outline: none; }
.rt-sec:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.rt-h { font-size: 15px; margin: 12px 0 6px; }
.rt-sec > p { margin: 0 0 10px; font-size: 13px; }
.rt-route { margin: 10px 0; }
.rt-route.rt-sub { margin-left: 28px; }
.rt-switch { display: inline-flex; align-items: center; gap: 8px; font-weight: 600; cursor: pointer; min-height: 32px; }
.rt-switch input { width: 18px; height: 18px; margin: 0; }
.rt-state { margin-left: 8px; font-size: 13px; color: var(--muted); }
.rt-about { margin: 2px 0 0 26px; font-size: 13px; }
.rt-form { display: grid; gap: 8px; max-width: 420px; }
.rt-form.rt-inline { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; max-width: none; }
.rt-field { display: grid; gap: 4px; font-size: 13px; }
.rt-inline .rt-field { display: inline-flex; align-items: center; gap: 8px; }
.rt-inline input[type="number"] { width: 6em; }
.rt-actions { display: flex; gap: 8px; flex-wrap: wrap; }
.rt-actions [hidden] { display: none; }
.rt-note { font-size: 13px; margin: 8px 0 0; min-height: 1.45em; }
.rt-err { color: var(--err); }
@media (max-width: 520px) {
  .rt-route.rt-sub { margin-left: 12px; }
  .rt-about { margin-left: 0; }
}

/* 20-library.css */
/* 20-library.css — sidebar (views, folders, feeds) and the item list. Library classes only (.lib-*). */

/* Sidebar */
.lib-side { padding: 8px 6px 16px; }
.lib-heading { margin: 14px 8px 4px; font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); }
.lib-nav-list { list-style: none; margin: 0; padding: 0; }
.lib-kids { padding-left: 18px; }
.lib-row { display: flex; align-items: center; gap: 2px; min-width: 0; }
.lib-nav { flex: 1; display: flex; align-items: center; gap: 6px; min-width: 0; min-height: 30px; padding: 4px 8px; border: 0; border-radius: 6px; background: transparent; color: var(--ink); font: inherit; text-align: left; cursor: pointer; }
.lib-nav:hover { background: var(--bg); }
.lib-nav[aria-current="page"] { background: var(--sel-bg); font-weight: 600; }
.lib-name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.lib-count { flex: none; font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
.lib-fail { flex: none; display: inline-flex; align-items: center; justify-content: center; width: 16px; height: 16px; border-radius: 50%; background: #fee2e2; color: var(--err); font-size: 11px; font-weight: 700; }
.lib-twisty, .lib-more { flex: none; min-height: 28px; min-width: 28px; padding: 0 4px; color: var(--muted); }
.lib-more { opacity: .55; }
.lib-row:hover .lib-more, .lib-more:focus-visible { opacity: 1; }
.lib-empty { margin: 8px; }
.lib-side > .btn { margin: 0 8px; }

/* Options dialogs */
.lib-sec { padding: 10px 0; border-top: 1px solid var(--line); }
.lib-sec:first-child { border-top: 0; padding-top: 0; }
.lib-sec h3 { margin: 0 0 8px; font-size: 14px; }
.lib-sec p { margin: 4px 0; }
.lib-warn h3 { color: var(--err); }
.lib-inline { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.lib-form { display: grid; gap: 10px; }
.lib-field { display: grid; grid-template-columns: 1fr 110px; align-items: center; gap: 2px 10px; }
.lib-field .lib-hint { grid-column: 1 / -1; font-size: 12px; }
.lib-form .btn.primary { justify-self: start; }
.lib-check { display: flex; align-items: center; gap: 6px; margin-bottom: 8px; }
.lib-danger { border-color: var(--err); color: var(--err); }
.lib-danger[data-armed="1"] { background: var(--err); color: #fff; }

/* Item list */
.lib-list { display: flex; flex-direction: column; }
.lib-list-head { position: sticky; top: 0; z-index: 1; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 6px 10px; padding: 10px 12px; background: var(--panel); border-bottom: 1px solid var(--line); }
.lib-list-name { min-width: 0; }
.lib-list-title { margin: 0; font-size: 15px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.lib-list-total { font-size: 12px; }
.lib-list-actions { display: flex; gap: 6px; align-items: center; }
.lib-list-actions select { min-height: 30px; padding: 2px 6px; }
.lib-rows { list-style: none; margin: 0; padding: 0; }
.lib-item { display: flex; gap: 8px; padding: 9px 12px; border-bottom: 1px solid var(--line); cursor: pointer; }
.lib-item:hover { background: var(--bg); }
.lib-item[aria-selected="true"] { background: var(--sel-bg); }
.lib-item:focus-visible { outline-offset: -2px; }
.lib-mark { flex: none; width: 10px; padding-top: 2px; color: var(--unread); font-size: 9px; }
.lib-item-body { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.lib-item-title { font-weight: 600; overflow-wrap: anywhere; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.lib-item.is-read .lib-item-title { font-weight: 400; color: var(--muted); }
.lib-item-meta { font-size: 12px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.lib-star { color: var(--star); }
.lib-played { color: var(--ok); }
.lib-list > .lib-empty { padding: 16px 12px; margin: 0; }
.lib-more-rows { margin: 12px; align-self: center; }

/* Private feeds (D10): a word mark beside the name */
.lib-private { flex: none; display: inline-flex; align-items: center; padding: 0 6px; border: 1px solid var(--line); border-radius: 999px; font-size: 11px; color: var(--muted); }

/* Rules section of the settings dialog (T11) */
.lib-rules > p { margin: 4px 0 8px; }
.lib-rule-list { list-style: none; margin: 0 0 12px; padding: 0; display: grid; gap: 6px; }
.lib-rule { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 6px 8px; border: 1px solid var(--line); border-radius: var(--radius); }
.lib-rule-text { min-width: 0; overflow-wrap: anywhere; }
.lib-rules h3 { margin: 8px 0; font-size: 14px; }
.lib-rule-form { display: grid; gap: 8px; }
.lib-rule-form .lib-field { grid-template-columns: 110px 1fr; }
.lib-rule-form .btn.primary { justify-self: start; }

/* Podcast tags under the feed name (P13); the section inside is styled by 30-reader.css */
.lib-about { padding: 6px 12px 10px; border-bottom: 1px solid var(--line); font-size: 13px; }
.lib-about[hidden] { display: none; }
.lib-about > details > summary { cursor: pointer; color: var(--muted); }

/* 30-reader.css */
/* 30-reader.css — the reading and episode view (src/ui/detail.js). Styles only .rd- classes. The reading pane can
   switch to dark colours on its own (reading setting); the app chrome stays light. */
.rd {
  --rd-bg: var(--bg); --rd-ink: var(--ink); --rd-muted: var(--muted); --rd-line: var(--line); --rd-link: var(--accent);
  --rd-code: #eef1ef; --rd-size: 16px; --rd-measure: 68ch;
  min-height: 100%; padding: 20px 24px 48px; background: var(--rd-bg); color: var(--rd-ink);
}
.rd[data-theme="dark"] {
  --rd-bg: #1b2120; --rd-ink: #e4ebe8; --rd-muted: #a3b0ab; --rd-line: #34403d; --rd-link: #5eead4; --rd-code: #26302e;
  color-scheme: dark;
}
.rd.rd-w-narrow { --rd-measure: 56ch; }
.rd.rd-w-medium { --rd-measure: 68ch; }
.rd.rd-w-wide { --rd-measure: 90ch; }
.rd > * { max-width: var(--rd-measure); margin-left: auto; margin-right: auto; }
.rd.rd-font-serif .rd-body, .rd.rd-font-serif .rd-title { font-family: Charter, "Iowan Old Style", Georgia, "Times New Roman", serif; }

.rd-empty { display: grid; place-items: center; min-height: 100%; padding: 32px; color: var(--muted); text-align: center; }

/* Reading settings */
.rd-settings { margin-bottom: 12px; font-size: 13px; }
.rd-settings > summary { cursor: pointer; color: var(--rd-muted); width: max-content; margin-left: auto; padding: 4px 8px; border-radius: var(--radius); }
.rd-settings[open] > summary { color: var(--rd-ink); }
.rd-settings-body { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; padding: 10px 12px; margin-top: 6px; border: 1px solid var(--rd-line); border-radius: var(--radius); background: var(--panel); color: var(--ink); }
.rd-field { display: inline-flex; align-items: center; gap: 6px; }
.rd-size { min-width: 4ch; text-align: center; font-variant-numeric: tabular-nums; }

/* Header */
.rd-head { display: flex; gap: 16px; align-items: flex-start; margin-bottom: 12px; }
.rd-art { width: 120px; height: 120px; flex: none; border-radius: var(--radius); object-fit: cover; background: var(--rd-line); }
.rd-titles { min-width: 0; }
.rd-feed { margin: 0 0 4px; font-size: 13px; font-weight: 600; color: var(--rd-link); }
.rd-title { margin: 0 0 6px; font-size: calc(var(--rd-size) * 1.6); line-height: 1.2; overflow-wrap: anywhere; }
.rd-meta, .rd-playstate { margin: 0; font-size: 13px; color: var(--rd-muted); }
.rd-playstate { margin-top: 4px; }

/* Actions, download state, image bar */
.rd-actions, .rd-queue { display: flex; flex-wrap: wrap; gap: 8px; }
.rd-actions { margin: 12px auto; }
.rd-download { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-bottom: 12px; }
.rd-download:empty { display: none; }
.rd-note { margin: 0; font-size: 13px; color: var(--rd-muted); }
.rd-note.ok { color: var(--ok); }
.rd-note.err { color: var(--err); }
.rd[data-theme="dark"] .rd-note.ok { color: #86efac; }
.rd[data-theme="dark"] .rd-note.err { color: #fca5a5; }
.rd-imagebar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; padding: 8px 12px; margin-bottom: 12px; border: 1px dashed var(--rd-line); border-radius: var(--radius); font-size: 13px; color: var(--rd-muted); }
.rd-imagebar[hidden] { display: none; }
.rd-imagebar p { margin: 0; flex: 1 1 240px; }

/* Chapters */
.rd-section { font-size: 14px; text-transform: uppercase; letter-spacing: .04em; color: var(--rd-muted); margin: 20px auto 8px; }
.rd-chapters[hidden] { display: none; }
.rd-chapter-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; }
.rd-chapter { width: 100%; justify-content: flex-start; white-space: normal; text-align: left; }
.rd-chapter[aria-current="true"] { border-color: var(--accent); background: var(--sel-bg); font-weight: 600; }
.rd-chapter-time { font-family: var(--mono); font-size: 12px; color: var(--muted); }

/* Content */
.rd-body { font-size: var(--rd-size); line-height: 1.65; overflow-wrap: break-word; }
.rd-body a { color: var(--rd-link); }
.rd-body img { max-width: 100%; height: auto; border-radius: 4px; }
.rd-body pre { overflow-x: auto; padding: 12px; background: var(--rd-code); border-radius: var(--radius); font-size: .88em; }
.rd-body code { font-family: var(--mono); font-size: .9em; background: var(--rd-code); padding: 0 .25em; border-radius: 4px; }
.rd-body pre code { background: none; padding: 0; }
.rd-body blockquote { margin: 1em 0; padding-left: 1em; border-left: 3px solid var(--rd-line); color: var(--rd-muted); }
.rd-body table { border-collapse: collapse; display: block; overflow-x: auto; }
.rd-body th, .rd-body td { border: 1px solid var(--rd-line); padding: 4px 8px; }
.rd-body h1, .rd-body h2, .rd-body h3 { line-height: 1.25; }
.rd-body hr { border: 0; border-top: 1px solid var(--rd-line); }
.rd-imgbtn { display: inline-flex; max-width: 100%; margin: 4px 0; padding: 6px 10px; border: 1px dashed var(--rd-line); border-radius: var(--radius); background: transparent; color: var(--rd-muted); font: inherit; font-size: 13px; cursor: pointer; white-space: normal; text-align: left; }
.rd-imgbtn:hover { border-color: var(--accent); color: var(--rd-ink); }

@media (max-width: 900px) {
  .rd { padding: 16px 16px 40px; }
  .rd-art { width: 80px; height: 80px; }
}

/* AI slot, full article bar (T4), podcast tags (P13) */
.rd-ai:empty, .rd-full:empty { display: none; }
.rd-ai { margin-bottom: 12px; }
.rd-full { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-bottom: 12px; }
.rd-tags { margin-bottom: 12px; }
.rd-tags-head { margin: 10px 0 4px; font-size: 13px; font-weight: 600; }
.rd-tags-list { margin: 0; padding-left: 1.2em; font-size: 14px; }
.rd-tags-list a { color: var(--rd-link, var(--accent)); }
.rd-tags-host, .rd-tags-role { color: var(--rd-muted, var(--muted)); }

/* 40-player.css */
/* 40-player.css — the player bar and its panels. Classes start with .pl- */
.pl-bar { display: grid; grid-template-columns: auto minmax(120px, 1fr) auto minmax(180px, 2fr) auto; align-items: center; gap: 8px 12px; padding: 8px 12px; min-height: var(--player-h); }
.pl-art { width: 48px; height: 48px; border-radius: 6px; object-fit: cover; background: var(--accent-soft); }
.pl-art[hidden] { display: none; }
.pl-meta { min-width: 0; display: flex; flex-direction: column; }
.pl-title { justify-content: flex-start; padding: 0; min-height: 0; font-weight: 600; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }
.pl-feed { font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pl-controls, .pl-extras { display: flex; align-items: center; gap: 6px; }
.pl-play { min-width: 72px; }
.pl-seek { display: flex; align-items: center; gap: 8px; min-width: 0; }
.pl-slider { flex: 1; min-width: 80px; accent-color: var(--accent); }
.pl-time { font: 12px/1 var(--mono); color: var(--muted); min-width: 4.5ch; text-align: center; }
.pl-speed { min-height: 32px; }
.pl-chapters[hidden] { display: none; }
.pl-error { grid-column: 1 / -1; color: var(--err); font-size: 13px; }
.pl-error[hidden] { display: none; }
.pl-fx[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); }
.pl-fx:disabled { opacity: 0.6; cursor: not-allowed; }
.pl-fxnote { grid-column: 1 / -1; font-size: 12px; }
.pl-fxnote[hidden] { display: none; }

/* Video panel (P14): above the bar, height set by dragging its bottom-right corner. */
.pl-video { display: flex; flex-direction: column; border-bottom: 1px solid var(--line); background: var(--panel); }
