  background: var(--border);
  border-radius: 1px;
  margin-top: 4px;
  overflow: hidden;
}
.confidence-fill {
  height: 100%;
  transition: width 200ms ease;
}
/* T2 \u2014 the certain-family chip beside an uncertain leaf. */
.family-chip {
  font-size: 10px;
  color: var(--text-muted);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 0 5px;
  white-space: nowrap;
}
/* T5 \u2014 the per-source unassigned slice under the coverage line. */
.schema-coverage-slice {
  font-size: 11px;
  color: var(--text-muted);
  margin-top: ${ue[1]};
}
/* T1 \u2014 runners-up line: label + one ghost button per alternate. */
.schema-alternates {
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: 4px;
  margin-top: 4px;
  font-size: 11px;
}
.schema-alternates-label {
  color: var(--text-muted);
}
.schema-alternate {
  font-size: 11px;
  padding: 0 6px;
}
.schema-alternate .confidence-pct {
  min-width: 0;
}
.schema-col-actions {
  display: flex;
  flex-wrap: wrap;
  gap: 4px;
  margin-top: 6px;
}
.schema-col-actions .btn {
  padding: 2px 6px;
  font-size: 11px;
}
.schema-override summary {
  list-style: none;
  cursor: pointer;
  display: inline-flex; align-items: center; gap: 4px;
}
.schema-override summary::-webkit-details-marker { display: none; }
.schema-override[open] .override-menu {
  width: min(360px, calc(100vw - ${ue[7]}));
  display: flex;
  flex-direction: column;
  overflow: hidden;
  background: var(--surface);
  border: 1px solid var(--border-strong);
  border-radius: 6px;
  box-shadow: var(--shadow-md);
  min-width: 0;
}
/* Lets the type list shrink and scroll when max-height caps the menu. */
.schema-override .override-menu > div { min-height: 0; }
.schema-override .type-option {
  width: 100%;
  white-space: normal;
  overflow-wrap: anywhere;
  flex-wrap: wrap;
  text-align: left;
}
.schema-quick-chart {
  display: inline-block;
}
.schema-quick-chart summary {
  list-style: none;
  cursor: pointer;
  display: inline-flex; align-items: center; gap: 4px;
}
.schema-quick-chart summary::-webkit-details-marker { display: none; }
.schema-quick-chart[open] .quick-chart-menu {
  background: var(--surface);
  border: 1px solid var(--border-strong);
  border-radius: 6px;
  box-shadow: var(--shadow-md);
  min-width: min(280px, calc(100vw - ${ue[7]}));
  max-width: calc(100vw - ${ue[7]});
  overflow: auto;
  padding: 4px;
  display: flex;
  flex-direction: column;
}
.quick-chart-item {
  width: 100%;
  justify-content: flex-start;
  text-align: left;
  font-size: 12px;
  padding: 6px 8px;
}
.schema-evidence {
  margin-top: 6px;
  padding: 8px;
  background: var(--surface);
  border-radius: 4px;
  border: 1px solid var(--border);
}
.evidence-row { margin-bottom: 8px; }
.evidence-row:last-child { margin-bottom: 0; }
.evidence-row-head {
  display: flex; justify-content: space-between;
  font-size: 12px;
  margin-bottom: 2px;
}
.evidence-bullets {
  margin: 0;
  padding-left: 16px;
  font-size: 11px;
  color: var(--text-muted);
}
.evidence-bullets li { margin: 1px 0; }
.schema-local-suggestions {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 4px;
  padding: 5px 0;
  color: var(--text-muted);
  font-size: 11px;
}
.schema-local-suggestions[hidden] { display: none; }
.schema-local-suggestions > span { flex-basis: 100%; }
.schema-local-suggestions .btn {
  max-width: 100%;
  white-space: normal;
  text-align: left;
}

/* Sidecar "Ask sidecar" trigger on ambiguous columns.
   Rendered only when the column qualifies (origin='detector' + 2+
   candidates + confidence in [0.5, 0.9)), and only visible when the
   app root has .app-sidecar-enabled. */
.schema-sidecar-ask {
  font-size: 11px;
  color: var(--accent);
  display: none;
}
.app-sidecar-enabled .schema-sidecar-ask {
  display: inline-flex;
}
.schema-sidecar-ask:disabled {
  opacity: 0.6;
  cursor: progress;
}

/* Bulk "Classify all unknowns" toolbar button \u2014 same enable-gating as
   the per-column trigger: only shown when the sidecar is on. */
.schema-sidecar-bulk {
  display: none;
  color: var(--accent);
}
.app-sidecar-enabled .schema-sidecar-bulk {
  display: inline-flex;
}
.schema-sidecar-bulk:disabled {
  opacity: 0.6;
  cursor: progress;
}

/* Column-profile pane (Theme 4 wave 1) \u2014 rendered inline below the
   row when a profile has been loaded. Hidden until the user clicks
   the Profile button. */
.schema-profile-pane {
  margin-top: 6px;
  padding: 8px 10px;
  background: var(--surface);
  border-radius: 4px;
  border: 1px solid var(--border);
  font-size: 11px;
}
.schema-profile-pane[hidden] { display: none; }
.schema-profile-pane.schema-profile-loading {
  color: var(--text-muted);
  font-style: italic;
}
.schema-profile-pane.schema-profile-error {
  background: var(--danger-bg);
  color: var(--text);
}
.schema-profile-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
  gap: 6px 12px;
  margin-bottom: 8px;
}
.schema-profile-row {
  display: flex;
  flex-direction: column;
  gap: 2px;
}
.schema-profile-label {
  font-size: 10px;
  color: var(--text-muted);
  text-transform: uppercase;
  letter-spacing: 0.05em;
}
.schema-profile-value {
  font-size: 12px;
  font-variant-numeric: tabular-nums;
  color: var(--text);
}
.schema-profile-pct {
  color: var(--text-muted);
  font-weight: normal;
  margin-left: 2px;
}
.schema-profile-topk {
  border-top: 1px dashed var(--border);
  padding-top: 6px;
}
.schema-profile-topk-head {
  font-size: 10px;
  color: var(--text-muted);
  text-transform: uppercase;
  letter-spacing: 0.05em;
  margin-bottom: 4px;
}
.schema-profile-topk ul {
  list-style: none;
  margin: 0;
  padding: 0;
}
.schema-profile-topk-row {
  display: flex;
  align-items: baseline;
  gap: 8px;
  padding: 2px 0;
}
.schema-profile-topk-row code {
  font-family: var(--font-mono);
  font-size: 11px;
  background: var(--surface-alt);
  padding: 1px 4px;
  border-radius: 2px;
  flex: 1;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.schema-profile-topk-count {
  font-variant-numeric: tabular-nums;
  color: var(--text-muted);
}

.notebook {
  max-width: 920px;
  margin: 0 auto;
  padding: 24px 32px 64px;
  display: flex;
  flex-direction: column;
  gap: 20px;
}
.nb-only-generated .cell:not([data-generated]) { display: none; }
.app-present-mode .sql-auto-run { display: none; }
.sql-auto-run { margin: ${ue[3]} 0; padding: ${ue[3]}; border: 1px solid var(--border); }

.notebook-toolbar {

  gap: 8px;

.cell {

  border-radius: 8px;
  overflow: hidden;
  display: flex;
  flex-direction: column;
}
.cell.running { box-shadow: 0 0 0 1px var(--warning); }
.cell.errored { box-shadow: 0 0 0 1px var(--danger); }
.cell-head {

.cell-head .cell-kind {

.cell-head .cell-name {

  font-size: 12px;
  color: var(--accent);
}
.cell-head .cell-actions { margin-left: auto; display: flex; gap: 4px; }
.cell-head .cell-actions .btn {

  font-size: 11px;
}
.cell-editor {
  font-family: var(--font-mono);
  font-size: 13px;
}
.cell-editor .cm-editor { background: transparent; }
.cell-editor .cm-focused { outline: none; }
.cell-editor .cm-scroller { font-family: var(--font-mono); }
.cell-editor .cm-content { padding: 12px; }

}

}
.cell-output-error {
  padding: 12px;

  font-size: 12px;
  color: var(--danger);

}
.python-code {
  width: 100%;

  resize: vertical;
}
.python-shape { font-size: 12px; color: var(--text-muted); margin-bottom: 4px; }

  border-collapse: collapse;

}
.result-table th, .result-table td {
  text-align: left;
  padding: 4px 8px;
  border-bottom: 1px solid var(--border);
  font-variant-numeric: tabular-nums;
}
.result-table th {
  background: var(--surface-alt);
  font-weight: 600;
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: 0.04em;
  color: var(--text-muted);
  position: sticky;
  top: 0;
}
.result-table td.numeric { text-align: right; }

.result-table td[data-action="toggle-selection"]:hover {

}
.result-table td.xf-excluded {

  color: var(--text-muted);
}
.cell-result-meta {
  padding: 6px 12px;

}
.cell-add-row {

  justify-content: center;
  flex-wrap: wrap;
  padding: 8px 0 24px;
}
.markdown-preview {
  padding: 12px 16px;
  font-size: 14px;

}
.markdown-preview h1, .markdown-preview h2, .markdown-preview h3 {
  margin: 12px 0 8px;
  font-weight: 600;
}
.markdown-preview h1 { font-size: 20px; }
.markdown-preview h2 { font-size: 17px; }
.markdown-preview h3 { font-size: 15px; }
.markdown-preview p { margin: 8px 0; }
.markdown-preview code {
  font-family: var(--font-mono);
  background: var(--surface-alt);
  padding: 1px 4px;
  border-radius: 3px;
  font-size: 12px;
}
.markdown-preview ul, .markdown-preview ol { padding-left: 22px; }

/* v1.3 M5 Phase 2 \u2014 shelf-based chart authoring. */
.chart-mode-toggle { display: inline-flex; gap: 2px; }
.chart-mode-toggle .btn { font-size: 11px; padding: 2px 8px; }
.chart-mode-toggle .btn.is-active {
  background: var(--surface-alt);
  border-color: var(--border-strong);
  font-weight: 600;
}
.shelf-zone {
  border: 1px solid var(--border);
  border-radius: 6px;
  background: var(--surface);
  padding: 10px 12px;
  margin: 8px 0;
  display: flex;
  flex-direction: column;
  gap: 10px;
}
.shelf-zone-empty { color: var(--text-muted); font-size: 12px; }
.shelf-tray { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
.shelf-tray-label, .shelf-name {
  font-size: 10px;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  color: var(--text-muted);
}
.shelf-chip {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  font-size: 12px;
  padding: 3px 8px;
  border: 1px solid var(--border);
  border-radius: 999px;
  background: var(--surface-alt);
  cursor: grab;
  user-select: none;
}
.shelf-chip:active { cursor: grabbing; }
.shelf-cls {
  font-style: normal;
  font-size: 9px;
  text-transform: uppercase;
  letter-spacing: 0.04em;
  color: var(--text-muted);
}
.shelf-cls.cls-temporal, .shelf-cls.cls-numeric { color: var(--focus); }
.shelf-cls.cls-identifier { color: var(--danger); }
.shelf-row { display: flex; gap: 10px; flex-wrap: wrap; }
.shelf {
  flex: 1 1 140px;
  display: flex;
  flex-direction: column;
  gap: 4px;
}
.shelf-drop {
  min-height: 30px;
  border: 1px dashed var(--border-strong);
  border-radius: 5px;
  display: flex;
  align-items: center;
  padding: 0 8px;
  font-size: 12px;
}
.shelf-drop.over { border-color: var(--accent); background: var(--surface-alt); }
.shelf-placeholder { color: var(--text-muted); font-size: 11px; }
.shelf-assigned {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  font-weight: 600;
}
.shelf-clear {
  border: 0;
  background: transparent;
  color: var(--text-muted);
  cursor: pointer;
  font-size: 14px;
  line-height: 1;
  padding: 0 2px;
}
.shelf-clear:hover { color: var(--danger); }
.shelf-select { font-size: 11px; }
.shelf-readout { font-size: 12px; color: var(--text-muted); }
.shelf-readout strong { color: var(--text); }
.shelf-warning {
  margin-top: 6px;

:root {
  color-scheme: light;
  --bg: ${L.bg};
  --surface: ${L.surface};
  --surface-subtle: ${L.surfaceSubtle};
  --surface-cool: ${L.surfaceCool};
  --surface-alt: ${L.surfaceAlt};
  --border: ${L.border};
  --border-strong: ${L.borderStrong};
  --text: ${L.text};
  --text-muted: ${L.textMuted};
  --text-cool-muted: ${L.textCoolMuted};
  --on-strong: ${L.onStrong};
  --accent: ${L.accent};
  --accent-hover: ${L.accentHover};
  --focus: ${L.focus};
  --danger: ${L.danger};
  --success: ${L.success};
  --warning: ${L.warning};
  --danger-soft: ${Re.dangerSoft};
  --danger-bg: ${Re.dangerBg};
  --info-bg: ${Re.infoBg};
  --info-text: ${Re.infoText};
  --info-accent: ${Re.infoAccent};
  --warning-bg: ${Re.warningBg};
  --warning-text: ${Re.warningText};
  --warning-accent: ${Re.warningAccent};
  --success-bg: ${Re.successBg};
  --success-text: ${Re.successText};
  --success-accent: ${Re.successAccent};
  --overlay-scrim: ${xt.scrim};
  --overlay-dim: ${xt.dim};
  --overlay-shadow: ${xt.shadow};
  --overlay-border-08: ${xt.border08};
  --overlay-border-12: ${xt.border12};
  --overlay-border-16: ${xt.border16};
  --overlay-muted: ${xt.muted};
  --overlay-hover: ${xt.hover};
  --overlay-selected: ${xt.selected};
  --font: ${R.family};
  --font-mono: ${R.familyMono};
  --shadow-sm: ${mu.sm};
  --shadow-md: ${mu.md};
  --shadow-lg: ${mu.lg};
  --space-1: ${ue[1]};
  --space-2: ${ue[2]};
  --space-3: ${ue[3]};
  --space-4: ${ue[4]};
  --space-5: ${ue[5]};
  --space-6: ${ue[6]};
  --space-7: ${ue[7]};
  --space-8: ${ue[8]};
  --radius-sm: ${pu.sm};
  --radius-md: ${pu.md};
  --radius-lg: ${pu.lg};
}

*, *::before, *::after { box-sizing: border-box; }
html, body { margin: 0; padding: 0; height: 100%; }
body {
  font-family: var(--font);
  font-size: ${R.size.md};
  line-height: ${R.lineHeight.normal};
  color: var(--text);
  background: var(--bg);
  -webkit-font-smoothing: antialiased;
}
button {
  font: inherit;
  color: inherit;
  min-width: 24px;
  min-height: 24px;
}
input:not([type='hidden']), select, textarea { min-height: 24px; }
summary { min-height: 24px; }
*:focus-visible {
  outline: 2px solid var(--focus);
  outline-offset: 2px;
  border-radius: var(--radius-sm);
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    scroll-behavior: auto !important;
    animation-duration: 0.01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.01ms !important;
  }
}
.visually-hidden {
  position: absolute;
  width: 1px;
  height: 1px;
  padding: 0;
  margin: -1px;
  overflow: hidden;
  clip: rect(0, 0, 0, 0);
  white-space: nowrap;
  border: 0;
}

/* Shell layout. The column is minmax(0, 1fr), not 1fr: a bare 1fr has an
   auto minimum, so the header's min-content would widen the whole column
   past the viewport and #app's overflow:hidden would clip the Schema rail. */
#app, .shell {
  display: grid;
  grid-template-rows: auto 1fr auto;
  grid-template-columns: minmax(0, 1fr);
  height: 100vh;
  width: 100vw;
  overflow: hidden;
}
.shell-header {
  display: flex;
  align-items: center;
  gap: var(--space-4);
  padding: var(--space-3) var(--space-5);
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  height: 44px;
}
.shell-header .brand {
  display: flex;
  align-items: center;
  gap: var(--space-3);
  font-weight: ${R.weight.semibold};
  letter-spacing: 0.01em;
}
.shell-header .brand-mark {
  color: var(--accent);
  display: inline-flex;
}
.shell-header .crumb {
  color: var(--text-muted);
  font-size: ${R.size.sm};
}
.shell-header .right {
  margin-left: auto;
  display: flex;
  align-items: center;
  gap: var(--space-3);
}
/* Header shrink order, lowest priority first: the session name ellipsizes
   (.session-switcher below), the build crumb drops under 1200px, and the
   decorative leading glyphs drop under 900px. Primary action labels stay. */
@media (max-width: 1199px) {
  .shell-header .crumb { display: none; }
}
@media (max-width: 900px) {
  .shell-header .right > .btn > svg,
  .shell-header .header-menu > summary > svg:first-child { display: none; }
}
.header-menu {
  position: relative;
}
.header-menu > summary {
  list-style: none;
  white-space: nowrap;
}
.header-menu > summary::-webkit-details-marker { display: none; }
.header-menu-panel {
  position: absolute;
  top: calc(100% + var(--space-2));
  right: 0;
  z-index: 80;
  min-width: 220px;
  display: flex;
  flex-direction: column;
  gap: var(--space-1);
  padding: var(--space-2);
  background: var(--surface);
  border: 1px solid var(--border-strong);
  border-radius: var(--radius-md);
  box-shadow: var(--shadow-md);
}
.header-menu-panel .btn {
  width: 100%;
  justify-content: flex-start;
  white-space: nowrap;
}

.shell-body {
  --sources-rail-width: 240px;
  --schema-rail-width: 320px;
  display: grid;
  grid-template-columns: var(--sources-rail-width) minmax(0, 1fr) var(--schema-rail-width);
  overflow: hidden;
  min-height: 0;
}
.shell.sources-rail-collapsed .shell-body { --sources-rail-width: 44px; }
.shell.schema-rail-collapsed .shell-body { --schema-rail-width: 44px; }
.rail-toggle { padding: var(--space-1); }
.rail-title { margin-right: auto; }
.sources-rail-collapsed .sources-panel .rail-title,
.sources-rail-collapsed .sources-panel .rail-secondary,
.sources-rail-collapsed .sources-panel .panel-body,
.schema-rail-collapsed .schema-panel-rail .rail-title,
.schema-rail-collapsed .schema-panel-rail .rail-secondary,
.schema-rail-collapsed .schema-panel-rail .panel-body,
.schema-rail-collapsed .schema-panel-rail .templates-panel-header {
  display: none;
}
.sources-rail-collapsed .sources-panel .panel-header,
.schema-rail-collapsed .schema-panel-rail .panel-header {
  justify-content: center;
  padding-inline: var(--space-2);
}
.sources-rail-collapsed .sources-panel .rail-toggle svg { transform: rotate(-90deg); }
.schema-rail-collapsed .schema-panel-rail .rail-toggle svg { transform: rotate(90deg); }
.panel {
  background: var(--surface);
  border-right: 1px solid var(--border);
  overflow: auto;
  display: flex;
  flex-direction: column;
}
.panel:last-child {
  border-right: 0;
  border-left: 1px solid var(--border);
}
.panel-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: var(--space-4) var(--space-5);
  border-bottom: 1px solid var(--border);
  font-weight: ${R.weight.semibold};
  font-size: ${R.size.sm};
  text-transform: uppercase;
  letter-spacing: 0.05em;
  color: var(--text-muted);
}
.panel-body {
  padding: var(--space-4) var(--space-5);
  flex: 1;
  overflow: auto;
}
/* Schema rail split: the schema list (handoff \xA79) keeps the remaining height.
   Suggested reports starts collapsed to its header. Expanded, it takes its
   content height up to a cap and scrolls on its own, so classified columns
   stay visible at laptop heights. */
.schema-panel-rail [data-region="templates-panel"] {
  flex: 0 1 auto;
  max-height: 40%;
}
.templates-panel-header {
  display: flex;
  padding: var(--space-2) var(--space-5);
  border-top: 1px solid var(--border);
  border-bottom: 1px solid var(--border);
}
.templates-toggle {
  flex: 1;
  justify-content: flex-start;
  padding: var(--space-3) var(--space-1);
  font-weight: ${R.weight.semibold};
  font-size: ${R.size.sm};
  text-transform: uppercase;
  letter-spacing: 0.05em;
  color: var(--text-muted);
}
.templates-toggle[aria-expanded="false"] svg { transform: rotate(-90deg); }
.templates-count {
  margin-left: auto;
  font-size: ${R.size.xs};
  color: var(--text-muted);
}
.center {
  background: var(--bg);
  overflow: auto;
}

.shell-footer {
  display: flex;
  align-items: center;
  gap: var(--space-4);
  padding: var(--space-2) var(--space-5);
  background: var(--surface);
  border-top: 1px solid var(--border);
  font-size: ${R.size.xs};
  color: var(--text-muted);
  height: 28px;
}

/* Buttons */
.btn {
  display: inline-flex;
  align-items: center;
  gap: var(--space-2);
  padding: var(--space-2) var(--space-4);
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-md);
  cursor: pointer;
  font-size: ${R.size.md};
  transition: background 80ms ease, border-color 80ms ease;
}
.btn:hover { background: var(--surface-alt); border-color: var(--border-strong); }
.btn[disabled] { opacity: 0.5; cursor: not-allowed; }
.btn-primary {
  background: var(--accent);
  color: var(--on-strong);
  border-color: var(--accent);
}
.btn-primary:hover { background: var(--accent-hover); border-color: var(--accent-hover); }
.btn-ghost { background: transparent; border-color: transparent; }
.btn-ghost:hover { background: var(--surface-alt); }

.btn-stack {
  display: flex;
  flex-direction: column;
  gap: var(--space-3);
}

/* Empty state */
.empty-state {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: var(--space-5);
  text-align: center;
  gap: var(--space-3);
  max-width: 900px;
  margin: 0 auto;
  margin-top: var(--space-4);
}
.empty-state h1 {
  font-size: ${R.size.xxl};
  margin: 0;
  font-weight: ${R.weight.semibold};
}
.empty-state p {
  color: var(--text-muted);
  margin: 0;
  max-width: 440px;
}
.empty-state .source-option-groups {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: var(--space-4);
  width: 100%;
  margin-top: var(--space-2);
  text-align: left;
}
.empty-state .source-option-group {
  min-width: 0;
  padding: var(--space-3);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  background: color-mix(in srgb, var(--surface) 74%, transparent);
}
.empty-state .source-option-group h2 {
  margin: 0;
  font-size: ${R.size.sm};
  font-weight: ${R.weight.semibold};
  text-transform: uppercase;
  letter-spacing: 0.05em;
}
.empty-state .source-option-group > p {
  margin: var(--space-1) 0 var(--space-3);
  font-size: ${R.size.xs};
  line-height: 1.35;
}
.empty-state .options {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: var(--space-2);
}
.empty-state .opt {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: var(--space-2);
  padding: var(--space-3);
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  cursor: pointer;
  transition: background 80ms ease, border-color 80ms ease, transform 80ms ease;
}
.empty-state .opt:hover {
  border-color: var(--accent);
  transform: translateY(-1px);
}
.empty-state .opt[disabled] {
  cursor: not-allowed;
  opacity: 0.62;
  border-style: dashed;
}
.empty-state .opt[disabled]:hover {
  border-color: var(--border);
  transform: none;
}
.empty-state .opt[data-readiness='advanced'] {
  border-color: var(--border-strong);
}
.empty-state .opt .label { font-weight: ${R.weight.semibold}; }
.empty-state .opt .hint {
  color: var(--text-muted);
  font-size: ${R.size.xs};
  line-height: 1.3;
  text-align: center;
}
.empty-state .examples-link {
  margin-top: var(--space-4);
  color: var(--text-muted);
  font-size: ${R.size.sm};
}
.empty-state .examples-link button {
  background: none; border: 0; color: var(--accent); cursor: pointer;
  text-decoration: underline; padding: 0; font: inherit;
}
.shell-footer .privacy-summary { margin-left: auto; }
.shell-footer .storage-warning { color: var(--danger); }
.shell-footer .storage-warning[hidden] { display: none; }

@media (max-width: 980px) {
  .empty-state .source-option-groups { grid-template-columns: 1fr; }
  .shell-body {
    --sources-rail-width: 200px;
    grid-template-columns: var(--sources-rail-width) minmax(0, 1fr);
  }
  .shell-body > aside.panel:last-child { display: none; }
}

/* Status dots */
.status-dot {
  display: inline-block;
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: var(--text-muted);
}
.status-dot.ready { background: var(--success); }
.status-dot.busy { background: var(--warning); }
.status-dot.error { background: var(--danger); }

/* Sources list */
.source-row {
  display: flex;
  align-items: center;
  gap: var(--space-3);
  padding: var(--space-3) 0;
  border-bottom: 1px dashed var(--border);
}
.source-row:last-child { border-bottom: 0; }
.source-row .label {
  flex: 1;
  font-size: ${R.size.sm};
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

/* Banner */
.banner {
  display: flex;
  align-items: center;
  gap: var(--space-3);
  padding: var(--space-3) var(--space-5);
  background: var(--danger-soft);
  color: var(--text);
  border-bottom: 1px solid var(--border);
}
.banner.danger { background: var(--danger-bg); }
.banner button { margin-left: auto; }

/* Session switcher (header dropdown) */
.session-switcher {
  position: relative;
  min-width: 0;
}
.session-trigger {
  display: inline-flex;
  align-items: center;
  gap: var(--space-2);
  max-width: 100%;
  padding: var(--space-1) var(--space-3);
}
.session-trigger > svg { flex-shrink: 0; }
.session-trigger .session-name {
  font-weight: ${R.weight.semibold};
  max-width: 220px;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.session-menu {
  position: absolute;
  top: calc(100% + 4px);
  left: 0;
  min-width: 280px;
  max-width: 360px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-md);
  box-shadow: var(--shadow-md);
  padding: var(--space-2);
  display: none;
  z-index: 50;
}
.session-menu[data-open] { display: block; }
.session-menu .session-new {
  display: flex;
  align-items: center;
  gap: var(--space-2);
  width: 100%;
  padding: var(--space-2) var(--space-3);
  background: transparent;
  border: 0;
  border-radius: var(--radius-sm);
  cursor: pointer;
  font: inherit;
  text-align: left;
  color: var(--accent);
}
.session-menu .session-new:hover { background: var(--surface-alt); }
.session-menu ul {
  list-style: none;
  margin: var(--space-2) 0 0;
  padding: var(--space-2) 0 0;
  border-top: 1px solid var(--border);
}
.session-menu .session-row {
  display: flex;
  align-items: center;
  gap: var(--space-1);
}
.session-menu .session-row.active .name { font-weight: ${R.weight.semibold}; }
.session-menu .session-pick {
  display: flex;
  align-items: center;
  gap: var(--space-2);
  flex: 1;
  padding: var(--space-2) var(--space-3);
  background: transparent;
  border: 0;
  border-radius: var(--radius-sm);
  cursor: pointer;
  font: inherit;
  text-align: left;
  color: inherit;
  min-width: 0;
}
.session-menu .session-pick:hover { background: var(--surface-alt); }
.session-menu .session-pick .name {
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.session-menu .session-pick .dot { color: var(--success); display: inline-flex; }
.session-menu .session-pick .dot-empty { width: 12px; height: 12px; }
.session-menu .session-row-action {
  padding: var(--space-1);
  color: var(--text-muted);
}
.session-menu .session-row-action:hover { color: var(--text); }

/* Schema-graph modal (Cytoscape-rendered type relationships) */
.schema-graph-overlay {
  position: fixed;
  inset: 0;
  background: var(--overlay-dim);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 100;
  padding: var(--space-5);
}
.schema-graph-modal {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  box-shadow: var(--shadow-lg);
  width: min(1080px, 100%);
  height: min(720px, 100%);
  display: flex;
  flex-direction: column;
  overflow: hidden;
}
.schema-graph-header {
  display: flex;
  align-items: center;
  gap: var(--space-3);
  padding: var(--space-3) var(--space-5);
  border-bottom: 1px solid var(--border);
}
.schema-graph-status {
  color: var(--text-muted);
  font-size: ${R.size.sm};
  margin-right: auto;
}
.schema-graph-close {
  padding: var(--space-1);
}
.schema-graph-canvas {
  flex: 1;
  min-height: 0;
  background: var(--bg);
}

/* Excel export \u2014 fresh workbook or surgical named-table template injection. */
.xlsx-export-modal {
  width: min(680px, 100%);
  height: auto;
  max-height: min(88vh, 780px);
}
.xlsx-export-title {
  margin: 0;
  font-size: ${R.size.xl};
}
.xlsx-export-subtitle {
  margin: var(--space-1) 0 0;
  color: var(--text-muted);
  font-size: ${R.size.sm};
}
.xlsx-export-body {
  display: flex;
  flex-direction: column;
  gap: var(--space-4);
  padding: var(--space-5);
  overflow: auto;
}
.xlsx-export-mode {
  display: grid;
  gap: var(--space-3);
  margin: 0;
  padding: 0;
  border: 0;
}
.xlsx-export-mode legend,
.xlsx-export-field > span {
  margin-bottom: var(--space-2);
  color: var(--text-muted);
  font-size: ${R.size.sm};
  font-weight: ${R.weight.semibold};
}
.xlsx-export-choice {
  display: flex;
  align-items: flex-start;
  gap: var(--space-3);
  padding: var(--space-3);
  border: 1px solid var(--border);
  border-radius: var(--radius-md);
  cursor: pointer;
}
.xlsx-export-choice:has(input:checked) {
  border-color: var(--accent);
  background: var(--accent-soft);
}
.xlsx-export-choice span {
  display: flex;
  flex-direction: column;
  gap: var(--space-1);
}
.xlsx-export-choice small,
.xlsx-template-status,
.xlsx-export-privacy {
  color: var(--text-muted);
  font-size: ${R.size.sm};
}
.xlsx-template-section {
  display: flex;
  flex-direction: column;
  gap: var(--space-3);
  padding: var(--space-4);
  border: 1px solid var(--border);
  border-radius: var(--radius-md);
  background: var(--surface-alt);
}
.xlsx-template-section[hidden] { display: none; }
.xlsx-template-drop {
  display: grid;
  place-items: center;
  min-height: var(--space-8);
  padding: var(--space-4);
  border: 1px dashed var(--border-strong);
  border-radius: var(--radius-md);
  background: var(--surface);
  color: var(--accent);
  font-size: ${R.size.sm};
  font-weight: ${R.weight.semibold};
  cursor: pointer;
}
.xlsx-template-drop[data-dragging="true"] {
  border-color: var(--accent);
  background: var(--accent-soft);
}
.xlsx-template-drop input {
  width: 1px;
  height: 1px;
  overflow: hidden;
  clip-path: inset(50%);
}
.xlsx-template-status,
.xlsx-export-privacy { margin: 0; }
.xlsx-template-error,
.xlsx-template-mismatch,
.xlsx-template-match {
  margin: 0;
  padding: var(--space-3);
  border-radius: var(--radius-sm);
  font-size: ${R.size.sm};
}
.xlsx-template-error,
.xlsx-template-mismatch {
  border-left: var(--space-1) solid var(--danger);
  background: var(--danger-soft);
  color: var(--danger);
}
.xlsx-template-match {
  border-left: var(--space-1) solid var(--success);
  background: var(--success-bg);
  color: var(--success-text);
}
.xlsx-template-mismatch ul { margin: var(--space-2) 0; padding-left: var(--space-5); }
.xlsx-template-mismatch p { margin: 0; }
.xlsx-export-field {
  display: flex;
  flex-direction: column;
}
.xlsx-export-field input,
.xlsx-export-field select {
  width: 100%;
  padding: var(--space-3);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  background: var(--surface);
  color: var(--text);
  font: inherit;
}
.xlsx-export-actions {
  display: flex;
  justify-content: flex-end;
  gap: var(--space-3);
  padding: var(--space-4) var(--space-5);
  border-top: 1px solid var(--border);
}
@media (max-width: 520px) {
  .xlsx-export-overlay { padding: var(--space-3); }
  .xlsx-export-actions { flex-direction: column-reverse; }
  .xlsx-export-actions .btn { width: 100%; }
}

.platform-entry-body {
  padding: var(--space-4) var(--space-5);
  display: flex;
  flex-direction: column;
  gap: var(--space-4);
}
.platform-entry-intro {
  display: grid;
  grid-template-columns: minmax(0, 1.35fr) minmax(0, 1fr);
  gap: var(--space-4);
  color: var(--text-muted);
  font-size: ${R.size.md};
  line-height: ${R.lineHeight.normal};
}
.platform-entry-intro p { margin: 0; }
.platform-entry-grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: var(--space-3);
}
.platform-entry-card {
  appearance: none;
  min-width: 0;
  padding: var(--space-4);
  border: 1px solid var(--border);
  border-radius: var(--radius-md);
  background: var(--surface);
  color: var(--text);
  font: inherit;
  text-align: left;
  cursor: pointer;
  display: flex;
  flex-direction: column;
  gap: var(--space-2);
}
.platform-entry-card:hover {
  border-color: var(--border-strong);
  background: var(--surface-alt);
}
.platform-entry-card:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
}
.platform-entry-card-heading {
  display: flex;
  align-items: center;
  gap: var(--space-2);
}
.platform-entry-card-icon {
  color: var(--accent);
  display: inline-flex;
}
.platform-entry-sample {
  margin-left: auto;
  padding: 1px 6px;
  border-radius: 999px;
  background: var(--info-bg);
  color: var(--info-text);
  font-size: ${R.size.xs};
  font-weight: ${R.weight.semibold};
}
.platform-entry-promise,
.platform-entry-map,
.platform-entry-outcome,
.platform-entry-boundary {
  display: block;
  line-height: ${R.lineHeight.normal};
}
.platform-entry-promise { font-size: ${R.size.md}; }
.platform-entry-map {
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: var(--space-2);
  color: var(--text-muted);
  font-size: ${R.size.sm};
}
.platform-entry-map strong { color: var(--text); }
.platform-entry-outcome {
  color: var(--accent);
  font-size: ${R.size.sm};
  font-weight: ${R.weight.semibold};
}
.platform-entry-boundary {
  color: var(--text-muted);
  font-size: ${R.size.xs};
}
.platform-entry-footer {
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: var(--space-2);
  padding-top: var(--space-3);
  border-top: 1px solid var(--border);
}
.help-orientation {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: var(--space-3);
  padding: var(--space-3);
  border: 1px solid var(--border);
  border-radius: var(--radius-md);
  background: var(--surface-alt);
  font-size: ${R.size.sm};
}
.help-orientation > div {
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: var(--space-2);
}
.help-orientation .platform-entry-sample { margin-left: 0; }
.help-orientation-actions {
  display: inline-flex;
  align-items: center;
  flex-wrap: wrap;
  gap: var(--space-2);
}

@media (max-width: 640px) {
  .platform-entry-intro,
  .platform-entry-grid { grid-template-columns: minmax(0, 1fr); }
  .platform-entry-body { padding: var(--space-3); }
  .platform-entry-footer .btn { width: 100%; justify-content: center; }
  .help-orientation { align-items: flex-start; flex-direction: column; }
  .help-orientation-actions { width: 100%; }
  .help-orientation-actions .btn { flex: 1 1 auto; }
}

.onboarding-tour-layer {
  position: fixed; inset: 0; z-index: 140; overflow: hidden;
}
.onboarding-tour-spotlight {
  position: fixed; pointer-events: none; border: 2px solid var(--accent);
  border-radius: var(--radius-md); box-shadow: 0 0 0 100vmax var(--overlay-dim);
}
.onboarding-tour-card {
  position: fixed; overflow: auto;
  width: min(360px, calc(100vw - 2 * var(--space-4)));
  max-height: calc(100vh - 2 * var(--space-4)); padding: var(--space-5);
  background: var(--surface); border: 1px solid var(--border-strong);
  border-radius: var(--radius-lg); box-shadow: var(--shadow-lg);
}
.onboarding-tour-progress {
  color: var(--text-muted); text-transform: uppercase;
  font-size: ${R.size.xs}; font-weight: ${R.weight.semibold}; letter-spacing: 0.06em;
}
.onboarding-tour-card h2 {
  margin: var(--space-2) 0 0; font-size: ${R.size.lg};
}
.onboarding-tour-card p {
  margin: var(--space-3) 0 var(--space-5); color: var(--text-muted);
  font-size: ${R.size.md}; line-height: ${R.lineHeight.normal};
}
.onboarding-tour-card [data-tour-body] { margin-bottom: var(--space-3); }
.onboarding-tour-card .onboarding-tour-expected,
.onboarding-tour-card .onboarding-tour-terminology,
.onboarding-tour-card .onboarding-tour-boundary {
  margin: 0 0 var(--space-3);
  padding: var(--space-2) var(--space-3);
  border-radius: var(--radius-sm);
  font-size: ${R.size.sm};
}
.onboarding-tour-card .onboarding-tour-expected {
  background: var(--success-bg);
  color: var(--success-text);
}
.onboarding-tour-card .onboarding-tour-terminology {
  background: var(--info-bg);
  color: var(--info-text);
}
.onboarding-tour-card .onboarding-tour-boundary {
  border: 1px solid var(--border);
  color: var(--text-muted);
}
.onboarding-tour-actions {
  display: flex; align-items: center; gap: var(--space-2);
}
.onboarding-tour-spacer { flex: 1; }

/* Settings modal \u2014 reuses .schema-graph-overlay + .schema-graph-modal
   with .settings-overlay / .settings-modal modifiers for layout tweaks. */
.settings-modal {
  width: min(720px, 100%);
  height: auto;
  max-height: 90vh;
}
.settings-body {
  padding: var(--space-5);
  overflow: auto;
  display: flex;
  flex-direction: column;
  gap: var(--space-5);
}
.settings-group {
  border: 1px solid var(--border);
  border-radius: var(--radius-md);
  padding: var(--space-4);
}
.settings-group > h2 {
  margin: 0 0 var(--space-4);
  color: var(--text-muted);
  font-size: ${R.size.xs};
  font-weight: ${R.weight.semibold};
  letter-spacing: 0.06em;
  text-transform: uppercase;
}
.settings-section + .settings-section {
  border-top: 1px solid var(--border);
  margin-top: var(--space-4);
  padding-top: var(--space-4);
}
.settings-section h3 {
  margin: 0 0 var(--space-3);
  font-size: ${R.size.md};
  font-weight: ${R.weight.semibold};
}
.settings-radio-row {
  display: flex;
  gap: var(--space-5);
  margin-bottom: var(--space-3);
}
.settings-radio-row label {
  display: inline-flex;
  align-items: center;
  gap: var(--space-2);
  cursor: pointer;
}
.settings-field {
  display: flex;
  flex-direction: column;
  gap: var(--space-2);
  margin-bottom: var(--space-3);
}
/* \`display: flex\` above would otherwise override the \`hidden\` attribute
   that shows each provider-specific row only for its provider. */
.settings-field[hidden] { display: none; }
.settings-field span {
  font-size: ${R.size.sm};
  color: var(--text-muted);
}
.settings-field input {
  padding: var(--space-2) var(--space-3);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  font: inherit;
  background: var(--surface);
}
.settings-remember {
  display: inline-flex;
  align-items: center;
  gap: var(--space-2);
  cursor: pointer;
  font-size: ${R.size.sm};
  margin: var(--space-2) 0;
}
.settings-provider-block {
  border: 1px solid var(--border);
  border-radius: var(--radius-md);
  padding: var(--space-4);
  margin-bottom: var(--space-3);
  background: var(--surface);
}
.settings-provider-head {
  display: flex;
  align-items: center;
  gap: var(--space-3);
  margin-bottom: var(--space-2);
}
.settings-active-pill {
  font-size: ${R.size.xs};
  background: var(--accent);
  color: var(--on-strong);
  padding: 2px 8px;
  border-radius: 999px;
}
.settings-provider-status {
  font-size: ${R.size.sm};
  color: var(--text-muted);
  margin-bottom: var(--space-3);
}
.settings-hint {
  font-size: ${R.size.xs};
  color: var(--text-muted);
  margin: var(--space-2) 0 0;
}
.settings-actions {
  display: flex;
  gap: var(--space-3);
  margin-top: var(--space-3);
}

/* Sidecar \u2014 Explain-this-error UI on errored SQL cells.
   Hidden by default; shown when the app root has .app-sidecar-enabled. */
.cell-output-error-actions {
  margin-top: var(--space-2);
  display: flex;
  gap: var(--space-2);
}
.cell-sidecar-trigger {
  font-size: ${R.size.sm};
  display: none;
}
.app-sidecar-enabled .cell-sidecar-trigger {
  display: inline-flex;
}
.cell-sidecar-result {
  margin-top: var(--space-3);
}
.cell-sidecar-result:empty {
  display: none;
}
.cell-sidecar-loading {
  color: var(--text-muted);
  font-size: ${R.size.sm};
}
.cell-sidecar-explanation {
  background: var(--surface-alt);
  border-left: 3px solid var(--accent);
  padding: var(--space-3) var(--space-4);
  border-radius: var(--radius-sm);
  font-size: ${R.size.sm};
  line-height: 1.55;
  white-space: pre-wrap;
}
.cell-sidecar-suggested {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  padding: var(--space-3);
  margin: var(--space-3) 0 var(--space-2);
  overflow: auto;
  font-size: ${R.size.sm};
  font-family: var(--font-mono);
}
.cell-sidecar-footnote {
  color: var(--text-muted);
  font-size: ${R.size.xs};
  margin-top: var(--space-2);
}
.cell-sidecar-error {
  background: var(--danger-bg);
  color: var(--text);
  border-radius: var(--radius-sm);
  padding: var(--space-3);
  font-size: ${R.size.sm};
}

/* Define-new-type modal \u2014 reuses .schema-graph-overlay + .schema-graph-modal
   with a column-split body (sample context on the left, form on the right). */
.define-type-modal {
  width: min(880px, 100%);
  height: auto;
  max-height: 90vh;
}
.define-type-body {
  padding: var(--space-5);
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: var(--space-5);
  overflow: auto;
}
.define-type-context,
.define-type-form {
  display: flex;
  flex-direction: column;
  gap: var(--space-3);
}
.define-type-context textarea,
.define-type-form textarea,
.define-type-context input,
.define-type-form input {
  font-family: var(--font-mono);
  font-size: ${R.size.sm};
  width: 100%;
  padding: var(--space-2) var(--space-3);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  background: var(--surface);
}
.define-type-context input:disabled,
.define-type-context textarea:disabled {
  background: var(--surface-alt);
  color: var(--text-muted);
}

/* Wave 2 slice 1 \u2014 Mount URL modal. Compact form: label + URL +
   help + actions. Reuses .schema-graph-overlay + .schema-graph-modal. */
.mount-url-modal {
  width: min(540px, 100%);
  height: auto;
  max-height: 90vh;
}
.mount-url-body {
  padding: var(--space-5);
  display: flex;
  flex-direction: column;
  gap: var(--space-4);
}
.mount-url-field {
  display: flex;
  flex-direction: column;
  gap: var(--space-1);
  font-size: ${R.size.sm};
}
.mount-url-field span {
  color: var(--text-muted);
}
.mount-url-field em {
  color: var(--text-muted);
  font-style: normal;
}
.mount-url-field input,
.mount-url-field textarea {
  font-family: var(--font-mono);
  font-size: ${R.size.sm};
  width: 100%;
  padding: var(--space-2) var(--space-3);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  background: var(--surface);
}
.mount-url-field textarea {
  resize: vertical;
  line-height: 1.4;
}
.mount-url-hint {
  margin: 0;
  font-size: ${R.size.sm};
  color: var(--text-muted);
  line-height: 1.5;
}
.mount-url-hint code {
  font-family: var(--font-mono);
  background: var(--surface-alt);
  padding: 0 var(--space-1);
  border-radius: var(--radius-sm);
}
.mount-url-error {
  background: var(--surface-alt);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  padding: var(--space-2) var(--space-3);
  font-size: ${R.size.sm};
  color: var(--danger);
}
.mount-url-actions {
  display: flex;
  justify-content: flex-end;
  gap: var(--space-3);
}

/* Wave 2 slice 2 \u2014 Mount S3-compatible bucket modal. Wider than
   mount-url to fit the two-column field rows. Same base styles. */
.mount-s3-modal {
  width: min(720px, 100%);
  height: auto;
  max-height: 90vh;
}
.mount-s3-body {
  padding: var(--space-5);
  display: flex;
  flex-direction: column;
  gap: var(--space-3);
  overflow: auto;
}
.mount-s3-row {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: var(--space-3);
}
.mount-s3-row .mount-url-field {
  min-width: 0;
}
.mount-s3-body > div[data-provider-section]:not(.mount-s3-row):not([hidden]) {
  display: flex;
  flex-direction: column;
  gap: var(--space-3);
}
.mount-s3-body > [data-provider-section][hidden] {
  display: none;
}
.mount-url-field select {
  font-family: inherit;
  font-size: ${R.size.sm};
  width: 100%;
  padding: var(--space-2) var(--space-3);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  background: var(--surface);
}
.mount-s3-remember {
  flex-direction: row;
  align-items: flex-start;
  gap: var(--space-2);
}
.mount-s3-remember input[type="checkbox"] {
  flex: 0 0 auto;
  margin-top: 4px;
}
.mount-s3-remember span {
  color: var(--text);
  font-size: ${R.size.sm};
  line-height: 1.4;
}
.mount-s3-remember em {
  display: block;
  margin-top: 2px;

  display: none;

.app-present-mode {

.app-present-mode .shell-header .right > *:not(.present-exit) {

}
.app-present-mode .shell-header .session-switcher {
  display: none;
}
.app-present-mode .shell-body > aside.panel {
  display: none;
}
.app-present-mode .shell-body {

  grid-template-columns: 1fr;
}
.app-present-mode .center {

}
