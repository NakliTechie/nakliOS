<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Chat — NakliOS</title>
<meta name="description" content="Ask about your mail, calendar, follow-ups and meetings; your NakliOS model answers from those apps.">
<style>
:root{
  --body:#faf2e2;--panel:#fdf8ec;--ink:#2c1810;--brand:#8a4a2a;--act:#2a4a8a;--row:#f0e2c8;--me:#eadcc0;
  --muted:color-mix(in srgb,var(--ink) 58%,var(--body));--line:color-mix(in srgb,var(--ink) 14%,transparent);
}
*{box-sizing:border-box}[hidden]{display:none!important}html,body{height:100%;margin:0}
body{background:var(--body);color:var(--ink);font:13px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;overflow:hidden}
button,textarea{font:inherit;color:inherit}button{cursor:pointer}button:disabled{cursor:default;opacity:.55}
button:focus-visible,textarea:focus-visible{outline:2px solid var(--act);outline-offset:2px}
.app{height:100%;display:flex;flex-direction:column;min-height:0}
.topbar{display:flex;align-items:center;gap:9px;flex-wrap:wrap;min-height:54px;padding:8px 12px;background:var(--panel);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:8px;font-size:15px;font-weight:760}
.mark{display:grid;place-items:center;width:29px;height:29px;border-radius:9px;background:var(--brand);color:#fff}
.model{color:var(--muted);font-size:11px;margin-left:auto}
.btn{border:1px solid var(--line);border-radius:8px;background:var(--row);padding:6px 10px}.btn:hover:not(:disabled){background:color-mix(in srgb,var(--row) 70%,var(--ink) 6%)}
.btn.small{padding:2px 8px;font-size:12px}.btn.go{background:var(--act);border-color:var(--act);color:#fff;font-weight:650}
.body{flex:1;display:flex;min-height:0}
aside{width:240px;flex:none;border-right:1px solid var(--line);overflow:auto;padding:8px}
.ct{display:block;width:100%;text-align:left;border:1px solid transparent;border-radius:9px;background:none;padding:7px 9px;margin-bottom:3px}
.ct:hover{background:var(--row)}.ct.on{background:var(--panel);border-color:var(--line)}
.ct .t{font-weight:650;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.ct .m{color:var(--muted);font-size:11px}
.pane{flex:1;display:flex;flex-direction:column;min-width:0;min-height:0}
main{flex:1;overflow:auto;padding:12px 18px 18px}
.head{display:flex;gap:8px;align-items:center;flex-wrap:wrap;max-width:820px;margin-bottom:8px}.head .t{flex:1;font-size:15px;font-weight:700;min-width:160px}
.msg{max-width:820px;margin:10px 0;padding:9px 12px;border-radius:11px;border:1px solid var(--line);background:var(--panel)}
.msg.user{background:var(--me);margin-left:auto;max-width:640px}
.msg p{margin:0 0 6px;white-space:pre-wrap;overflow-wrap:anywhere}.msg p:last-child{margin-bottom:0}
.msg ul{margin:2px 0 6px;padding-left:18px}
.steps{color:var(--muted);font-size:11px;margin-bottom:5px}.steps .bad{color:#9a2a1a}
.working{color:var(--muted);font-style:italic}
.empty{color:var(--muted);padding:40px 12px;text-align:center;max-width:560px;margin:auto}
.empty ul{text-align:left;display:inline-block;margin:8px 0 0}
form.compose{display:flex;gap:8px;align-items:flex-end;padding:10px 12px;border-top:1px solid var(--line);background:var(--panel)}
textarea{flex:1;min-height:42px;max-height:180px;resize:vertical;border:1px solid var(--line);border-radius:9px;background:var(--body);padding:8px 10px}
.status{min-height:26px;display:flex;align-items:center;padding:4px 12px;border-top:1px solid var(--line);background:var(--panel);color:var(--muted);font-size:11px}
@media (max-width:640px){aside{display:none}}
</style>
</head>
<body>
<script src="../../sdk/naklios.js"></script>
<div class="app">
  <header class="topbar">
    <div class="brand"><span class="mark">❝</span><span>Chat</span></div>
    <button class="btn" id="new" title="Start a new chat">New chat</button>
    <span class="model" id="model"></span>
  </header>
  <div class="body">
    <aside id="list" aria-label="Chats"></aside>
    <div class="pane">
      <main id="main"></main>
      <form class="compose" id="compose">
        <textarea id="draft" rows="2" placeholder="Ask about your mail, calendar, follow-ups or meetings" aria-label="Your question"></textarea>
        <button class="btn go" id="send" type="submit" title="Ask (Enter); Shift+Enter starts a new line">Ask</button>
        <button class="btn" id="stop" type="button" hidden title="Stop this answer">Stop</button>
      </form>
    </div>
  </div>
  <footer class="status"><span id="status">Chat reads your apps through their own commands. A change asks you once per app on each visit.</span></footer>
</div>
<script type="module">
import * as C from './core.mjs';
const $=id=>document.getElementById(id);
const DB='naklios-chat';
let chats=[], selected=null, run=null, deleteArmed=null, toolset=null;
function setStatus(t){$('status').textContent=t}
const byId=id=>chats.find(c=>c.id===id);
const aiOn=()=>!!naklios.capabilities?.ai;
const mode=()=>naklios.capabilities?.aiProvider==='endpoint'?'endpoint':'local';

// ── storage: every chat in IndexedDB, in this browser only ──
function idb(){return new Promise((res,rej)=>{const r=indexedDB.open(DB,1);r.onupgradeneeded=()=>r.result.createObjectStore('kv');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
async function get(key){try{const db=await idb();return await new Promise(res=>{const q=db.transaction('kv').objectStore('kv').get(key);q.onsuccess=()=>res(q.result??null);q.onerror=()=>res(null)})}catch{return null}}
async function put(key,value){const db=await idb();await new Promise((res,rej)=>{const t=db.transaction('kv','readwrite');t.objectStore('kv').put(value,key);t.oncomplete=res;t.onerror=()=>rej(t.error)})}
const save=()=>put('chats',chats);

// ── the tools: the other apps' own commands.json, read once from this origin ──
async function tools(){
  if(toolset)return toolset;
  const manifests={};
  await Promise.all(C.APPS.map(async app=>{try{manifests[app]=await (await fetch(`../${app}/commands.json`)).json()}catch(e){console.warn('[chat] no manifest for',app,e)}}));
  return toolset=C.toolsFrom(manifests);
}

// ── one question: the model calls tools until it answers, within the turn limit ──
async function ask(chat,question){
  if(!aiOn())throw new Error('No AI model is available. Turn one on in NakliOS Settings → AI.');
  if(!naklios.experimental_commands?.call)throw new Error('Open Chat inside NakliOS: it reads your other apps through NakliOS.');
  if(run)throw new Error('Chat is still answering; stop it first.');
  const {tools:list,byTool}=await tools();
  const lim=C.LIMITS[mode()], ctl=new AbortController(), token=`chat-${Date.now()}`;
  const user={role:'user',content:question,at:Date.now()}, reply={role:'assistant',content:'',steps:[],at:0};
  const messages=[{role:'system',content:C.systemPrompt(new Date())},...C.history(chat),{role:'user',content:question}];
  chat.messages.push(user);if(chat.messages.length===1)chat.title=C.titleOf(question);
  run={chat,reply,ctl,token};chat.updated=Date.now();await save();render();
  let useTools=list.length>0;
  try{
    for(let turn=0;;turn++){
      if(turn>=lim.turns){reply.content=reply.content||`I stopped after ${lim.turns} lookups without a full answer. Ask a narrower question.`;break}
      let res;
      try{res=await naklios.ai.chat.completions.create({agent:true,messages,...(useTools?{tools:list}:{}),max_tokens:lim.maxTokens,signal:ctl.signal,
        onStatus:s=>setStatus(s==='loading'?'Loading the model…':s==='queued'?'Waiting for the model…':s==='permission'?'Waiting for your permission…':'Thinking…')})}
      catch(e){
        if(ctl.signal.aborted)throw new Error('Stopped.');
        if(turn===0&&useTools&&C.noToolsError(e)){useTools=false;messages[0]={role:'system',content:C.systemPrompt(new Date(),{tools:false})};reply.steps.push({label:'This model cannot look things up',ok:false});continue}
        throw e;
      }
      // A cancelled model call ends quietly with no text, so Stop is checked here as well as in the catch.
      if(ctl.signal.aborted)throw new Error('Stopped.');
      const msg=res?.choices?.[0]?.message||{}, calls=msg.tool_calls||[];
      if(!calls.length){reply.content=String(msg.content||'').trim();if(!reply.content){reply.content='(The model gave no answer.)';reply.error=true}break}
      const a={role:'assistant',content:typeof msg.content==='string'?msg.content:'',tool_calls:calls};
      if(msg.reasoning_content)a.reasoning_content=msg.reasoning_content;
      messages.push(a);
      for(const tc of calls){
        if(ctl.signal.aborted)throw new Error('Stopped.');
        const full=byTool[tc.function?.name], step={label:full?C.stepLabel(full):`Unknown tool ${tc.function?.name}`,ok:true};
        reply.steps.push(step);render();
        let out;
        if(!full)out={ok:false,error:'There is no such tool.'};
        else{
          setStatus(`${step.label}…`);
          // Stop ends the run at once, even while another app or a permission dialog is still answering.
          const stopped=new Promise((_,rej)=>ctl.signal.addEventListener('abort',()=>rej(new Error('Stopped.')),{once:true}));
          try{const r=await Promise.race([naklios.experimental_commands.call(full,C.parseArgs(tc.function.arguments),{token}),stopped]);out=r&&r.ok===false?{ok:false,error:r.message||r.code||'refused'}:(r?.result??r)}
          catch(e){if(ctl.signal.aborted)throw e;out={ok:false,error:String(e?.message||e)}}
        }
        if(out&&out.ok===false)step.ok=false;
        messages.push({role:'tool',tool_call_id:tc.id,content:C.cut(C.asJson(out))});
      }
    }
    setStatus(reply.steps.length?`Answered after ${reply.steps.length} lookup(s).`:'Answered.');
  }catch(e){
    if(!reply.content){reply.content=e.message==='Stopped.'?'Stopped.':`Chat could not answer: ${e.message}`;reply.error=true}
    setStatus(reply.content);
  }finally{
    if(ctl.signal.aborted)naklios.experimental_commands?.abandon?.(token);
    reply.at=Date.now();chat.messages.push(reply);chat.updated=reply.at;run=null;await save();render();
  }
  return reply;
}
function newChat(){const c={id:'c'+Date.now().toString(36)+Math.random().toString(36).slice(2,6),title:'New chat',created:Date.now(),updated:Date.now(),messages:[]};return c}
// The composer asks in the open chat, or starts one.
async function startAsk(text){
  const q=String(text||'').trim();if(!q)throw new Error('Type a question first.');
  let c=byId(selected);
  if(!c){c=newChat();chats.unshift(c);selected=c.id}
  return ask(c,q);
}

// ── drawing ──
const el=(tag,cls,text)=>{const e=document.createElement(tag);if(cls)e.className=cls;if(text!=null)e.textContent=text;return e};
// Plain text with paragraphs and "- " lists; nothing from the model becomes HTML.
function textBlock(text){
  const box=document.createDocumentFragment();let ul=null;
  for(const line of String(text).split('\n')){
    const m=/^\s*(?:[-*•]|\d+[.)])\s+(.*)$/.exec(line);
    if(m){if(!ul){ul=el('ul');box.append(ul)}ul.append(el('li',null,m[1].replace(/\*\*/g,'')));continue}
    ul=null;if(line.trim())box.append(el('p',null,line.replace(/\*\*/g,'')));
  }
  return box;
}
function renderList(){
  const list=$('list');list.textContent='';
  for(const c of chats){const b=el('button','ct'+(c.id===selected?' on':''));b.type='button';
    b.append(el('div','t',c.title),el('div','m',`${new Date(c.updated).toLocaleDateString('en-GB',{day:'numeric',month:'short'})} · ${Math.ceil(c.messages.length/2)} question(s)`));
    b.addEventListener('click',()=>{selected=c.id;render()});list.append(b)}
}
function render(){
  renderList();
  $('model').textContent=aiOn()?`${naklios.capabilities.aiModel||'NakliOS model'}${mode()==='local'?' · in this browser':''}`:'No AI model: Settings → AI';
  $('send').hidden=!!run;$('stop').hidden=!run;
  const main=$('main');main.textContent='';const c=byId(selected);
  if(!c||!c.messages.length&&!run){
    const e=el('div','empty');e.append(el('div',null,'Ask about your own mail, calendar, follow-ups and meetings. Your NakliOS model looks them up through those apps, in this browser. For example:'));
    const ul=el('ul');for(const s of['What did Ravi promise in this week\'s meetings?','Which follow-ups are overdue?','What is on my calendar tomorrow?','Draft a reply to the latest mail from Anupam saying Friday works'])ul.append(el('li',null,s));
    e.append(ul);main.append(e);return;
  }
  const head=el('div','head');head.append(el('div','t',c.title));
  const btn=(id,label,fn,title)=>{const b=el('button','btn small',label);b.id=id;if(title)b.title=title;b.addEventListener('click',async()=>{b.disabled=true;try{await fn()}catch(e){setStatus(e.message)}finally{b.disabled=false}});return b};
  head.append(
    btn('copy','Copy',async()=>{await navigator.clipboard.writeText(C.toMarkdown(c));setStatus('Copied the chat as Markdown.')},'Copy the chat as Markdown'),
    btn('delete',deleteArmed===c.id?'Confirm delete':'Delete',async()=>{
      if(run?.chat===c)throw new Error('Stop the answer first.');
      if(deleteArmed!==c.id){deleteArmed=c.id;render();setTimeout(()=>{if(deleteArmed===c.id){deleteArmed=null;render()}},4000);return}
      deleteArmed=null;chats=chats.filter(x=>x!==c);selected=chats[0]?.id||null;await save();render();setStatus(`Deleted "${c.title}".`)},'Delete this chat from this browser'));
  main.append(head);
  const shown=run?.chat===c?[...c.messages,run.reply]:c.messages;
  for(const m of shown){
    const d=el('div','msg '+m.role);
    if(m.steps?.length){const s=el('div','steps');m.steps.forEach((x,i)=>{if(i)s.append(' · ');s.append(el('span',x.ok?null:'bad',x.label+(x.ok?'':' (failed)')))});d.append(s)}
    if(m===run?.reply&&!m.content)d.append(el('p','working','Working…'));else d.append(textBlock(m.content));
    main.append(d);
  }
  main.scrollTop=main.scrollHeight;
}

$('compose').addEventListener('submit',e=>{e.preventDefault();const q=$('draft').value;if(!q.trim())return;$('draft').value='';void startAsk(q).catch(err=>{$('draft').value=q;setStatus(err.message)})});
$('draft').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey&&!e.isComposing){e.preventDefault();$('compose').requestSubmit()}});
$('stop').addEventListener('click',()=>{run?.ctl.abort();setStatus('Stopping…')});
$('new').addEventListener('click',()=>{if(run)return setStatus('Chat is still answering; stop it first.');selected=null;render();$('draft').focus()});

// ── commands: the same paths the composer uses (two doors, one core) ──
const need=id=>{const c=byId(String(id||''));if(!c)throw new Error('No chat has that id; chat.list gives the ids.');return c};
const COMMAND_HANDLERS={
  async 'chat.list'(args){const n=Math.min(Math.max(Number(args?.limit)||20,1),100);return{count:chats.length,chats:chats.slice(0,n).map(C.view)}},
  async 'chat.read'(args){const c=need(args?.id);return{...C.view(c),messages:c.messages.map(m=>({role:m.role,content:m.content,steps:(m.steps||[]).map(s=>s.label)}))}},
  // From an Ask button in Mail, Follow-ups or Meetings: a new chat whose draft starts with one line about the item.
  async 'chat.open'(args){
    if(run)throw new Error('Chat is still answering; try again when it finishes.');
    selected=null;render();$('draft').value=C.draftFrom(args?.about);$('draft').focus();
    $('draft').setSelectionRange($('draft').value.length,$('draft').value.length);
    setStatus(args?.about?'Type your question after the line about the item.':'New chat.');return{ok:true}},
  async 'chat.ask'(args){
    const q=[C.aboutLine(args?.about),String(args?.question||'').trim()].filter(Boolean).join('\n\n');
    if(!String(args?.question||'').trim())throw new Error('chat.ask needs a question.');
    const c=newChat();chats.unshift(c);selected=c.id;const r=await ask(c,q);
    return{id:c.id,answer:r.content,lookups:r.steps.map(s=>s.label+(s.ok?'':' (failed)'))}},
};
if(naklios.experimental_commands){
  fetch('./commands.json').then(r=>r.json()).then(manifest=>naklios.experimental_commands.register(manifest.commands.map(c=>({...c,handler:COMMAND_HANDLERS[c.name]})))).catch(e=>console.warn('[chat] commands could not register',e));
}

(async()=>{chats=(await get('chats'))||[];selected=chats[0]?.id||null;render()})();
naklios.onCapabilitiesChange(()=>render());
naklios.requestCapabilities();naklios.ready();
</script>
</body>
</html>
