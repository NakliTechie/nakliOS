<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Files — NakliOS</title>
<meta name="description" content="Browse the folder NakliOS saves to.">
<style>
:root{
  --body:#15100c; --panel:#1e1813; --ink:#f5e6c8;
  --brand:#c8512a; --row:#221a13;
  --muted:color-mix(in srgb, var(--ink) 70%, var(--body));
  --faint:color-mix(in srgb, var(--ink) 62%, var(--body));
  --line:color-mix(in srgb, var(--ink) 14%, transparent);
  --line-strong:color-mix(in srgb, var(--ink) 30%, transparent);
}
*{box-sizing:border-box;}
html,body{margin:0; padding:0; height:100%; background:var(--body); color:var(--ink);
  font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size:13px;}
body{display:flex; flex-direction:column;}
header{
  display:flex; align-items:center; gap:12px;
  padding:8px 14px; background:var(--panel);
  border-bottom:1px solid var(--line); flex:0 0 auto;
}
header h1{margin:0; font-size:14px; font-weight:700;}
header .folder{color:var(--muted); font-size:12px;}
header .spacer{flex:1;}
button{
  background:var(--row); color:var(--ink); border:1px solid var(--line);
  padding:4px 10px; font-size:12px; border-radius:6px; cursor:pointer;
  font-family:inherit;
}
button:hover{background:color-mix(in srgb, var(--brand) 18%, var(--row));}
button.danger:hover{background:color-mix(in srgb, #d94545 30%, var(--row)); color:#fff;}
.main{flex:1; display:flex; min-height:0;}
.sidebar{
  width:260px; flex:0 0 auto; overflow:auto;
  background:color-mix(in srgb, var(--panel) 70%, var(--body));
  border-right:1px solid var(--line);
  padding:8px 0;
}
.tree-node{
  display:flex; align-items:center; gap:6px;
  padding:5px 12px; cursor:pointer; user-select:none;
  font-size:12px; color:var(--ink);
}
.tree-node:hover{background:var(--row);}
.tree-node.active{background:color-mix(in srgb, var(--brand) 22%, var(--panel)); color:var(--ink);}
.tree-node .chev{
  width:12px; display:inline-block; text-align:center; color:var(--muted);
  transition:transform 0.12s;
}
.tree-node.expanded .chev{transform:rotate(90deg);}
.tree-node .icon{font-size:13px; opacity:0.8;}
.tree-children{margin-left:14px;}
.body{flex:1; display:flex; flex-direction:column; min-width:0;}
.toolbar{
  display:flex; align-items:center; gap:8px;
  padding:6px 14px; background:var(--panel);
  border-bottom:1px solid var(--line); flex:0 0 auto;
  font-size:11px; color:var(--muted);
}
.toolbar .crumbs{flex:1; display:flex; align-items:center; flex-wrap:wrap; gap:2px;}
.toolbar .crumbs .crumb{color:var(--ink); cursor:pointer; padding:1px 3px; border-radius:4px;}
.toolbar .crumbs .crumb:hover{background:var(--row); text-decoration:underline;}
.toolbar .crumbs .sep{color:var(--muted); padding:0 1px;}
.scope-badge{
  font-size:10px; font-weight:600; letter-spacing:.03em; text-transform:uppercase;
  padding:2px 7px; border-radius:999px; margin-left:2px;
  background:color-mix(in srgb, var(--brand) 22%, var(--panel));
  color:color-mix(in srgb, var(--ink) 90%, var(--brand));
  border:1px solid var(--line-strong);
}
.list{flex:1; overflow:auto;}
.list-row{
  display:flex; align-items:center; gap:10px;
  padding:6px 14px; cursor:default;
  border-bottom:1px solid color-mix(in srgb, var(--line) 50%, transparent);
}
.list-row:hover{background:color-mix(in srgb, var(--row) 60%, transparent);}
.list-row.selected{background:color-mix(in srgb, var(--brand) 18%, var(--panel));}
.list-row .name{flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.list-row .size{color:var(--muted); font-size:11px; min-width:80px; text-align:right; font-variant-numeric:tabular-nums;}
.list-row .icon{opacity:0.8; min-width:18px; text-align:center;}
.preview{
  flex:0 0 auto; max-height:40%; min-height:140px; overflow:auto;
  border-top:1px solid var(--line-strong);
  background:var(--panel);
  padding:10px 14px; font-size:12px;
}
.preview h3{margin:0 0 6px; font-size:12px; color:var(--muted); font-weight:600; text-transform:uppercase; letter-spacing:0.05em;}
.preview pre{margin:0; white-space:pre-wrap; word-wrap:break-word; font-family:ui-monospace, SFMono-Regular, Menlo, monospace; font-size:11px; color:var(--ink);}
.preview img{max-width:100%; max-height:300px; border-radius:6px;}
.preview .meta{color:var(--muted); font-size:11px;}
.preview .meta span{margin-right:14px;}
.empty{
  flex:1; display:flex; align-items:center; justify-content:center;
  color:var(--muted); font-size:13px; padding:40px;
  text-align:center;
}
.empty .btn-cta{
  display:inline-block; margin-top:14px;
  padding:8px 16px; background:var(--brand); color:var(--panel);
  border-radius:8px; cursor:pointer; font-weight:600; font-size:12px;
}
button:disabled{opacity:.45; cursor:not-allowed;}
.context-menu{
  position:fixed; z-index:1000;
  background:var(--panel); border:1px solid var(--line-strong); border-radius:8px;
  box-shadow:0 8px 24px rgba(0,0,0,0.35); padding:4px 0; min-width:160px;
}
.context-menu button{
  display:block; width:100%; text-align:left;
  padding:6px 14px; background:none; border:none; border-radius:0;
  color:var(--ink); font-size:12px; cursor:pointer;
}
.context-menu button:hover{background:var(--row);}
.context-menu button.danger{color:#e88;}
.context-menu .sep{height:1px; background:var(--line); margin:4px 0;}
footer{
  flex:0 0 auto; padding:6px 14px;
  background:var(--panel); border-top:1px solid var(--line);
  color:var(--muted); font-size:11px;
  display:flex; gap:12px;
}
footer .spacer{flex:1;}
dialog{
  width:min(420px, calc(100vw - 32px)); padding:0;
  color:var(--ink); background:var(--panel);
  border:1px solid var(--line-strong); border-radius:12px;
  box-shadow:0 18px 60px rgba(0,0,0,.5);
}
dialog::backdrop{background:rgba(0,0,0,.58);}
.dialog-body{padding:18px 18px 8px;}
.dialog-body h2{margin:0 0 8px; font-size:16px;}
.dialog-body p{margin:0; color:var(--muted); line-height:1.5; overflow-wrap:anywhere;}
.dialog-actions{display:flex; justify-content:flex-end; gap:8px; padding:12px 18px 18px;}
.dialog-actions .danger{background:#b43c3c; border-color:#b43c3c; color:#fff;}
.field{display:grid; gap:5px; margin-top:12px; color:var(--muted); font-size:11px;}
.field input,.field textarea{width:100%; border:1px solid var(--line-strong); border-radius:7px; background:var(--body); color:var(--ink); padding:8px; font:inherit;}
.field textarea{min-height:120px; resize:vertical; font-family:ui-monospace,SFMono-Regular,Menlo,monospace;}
.field-error{min-height:1.2em; margin-top:8px; color:#ef8c8c; font-size:11px;}
.toast{position:fixed; right:16px; bottom:38px; z-index:1100; max-width:min(420px,calc(100vw - 32px)); padding:9px 12px; border:1px solid var(--line-strong); border-left:3px solid var(--brand); border-radius:8px; background:var(--panel); color:var(--ink); box-shadow:0 10px 30px rgba(0,0,0,.4);}
</style>
</head>
<body>
<script src="../../sdk/naklios.js?v=2026-08-26-files-rootfs"></script>

<header>
  <h1>📁 Files</h1>
  <span class="scope-badge" id="scope-badge" hidden>All apps</span>
  <span class="folder" id="folder-name">—</span>
  <span class="spacer"></span>
  <button id="new-text">New text file</button>
  <button id="refresh">Refresh</button>
</header>
<div class="main">
  <aside class="sidebar" id="tree"></aside>
  <div class="body">
    <div class="toolbar">
      <span class="crumbs" id="crumbs">/</span>
    </div>
    <div class="list" id="list"></div>
    <div class="preview" id="preview" hidden></div>
  </div>
</div>
<footer>
  <span id="status">Loading…</span>
  <span class="spacer"></span>
  <span>NakliOS · Files</span>
</footer>

<dialog id="delete-dialog" aria-labelledby="delete-dialog-title" aria-describedby="delete-dialog-copy">
  <form method="dialog">
    <div class="dialog-body">
      <h2 id="delete-dialog-title">Delete file?</h2>
      <p id="delete-dialog-copy"></p>
    </div>
    <div class="dialog-actions">
      <button value="cancel" id="delete-dialog-cancel">Cancel</button>
      <button value="delete" class="danger">Delete</button>
    </div>
  </form>
</dialog>

<dialog id="new-file-dialog" aria-labelledby="new-file-title">
  <form method="dialog" id="new-file-form">
    <div class="dialog-body">
      <h2 id="new-file-title">New text file</h2>
      <label class="field">File name
        <input id="new-file-name" value="naklios-roundtrip.txt" autocomplete="off">
      </label>
      <label class="field">Contents
        <textarea id="new-file-contents">NakliOS ↔ Crate live round-trip</textarea>
      </label>
      <div class="field-error" id="new-file-error" role="status"></div>
    </div>
    <div class="dialog-actions">
      <button value="cancel" type="button" id="new-file-cancel">Cancel</button>
      <button value="create" type="submit">Create</button>
    </div>
  </form>
</dialog>

<script>
(function(){
'use strict';

// Files is the OS-level file manager. When the host grants system-fs
// (capabilities.sysFs — true for same-origin system apps), it browses the
// WHOLE store on the active backend: every app's apps/<id>/ tree plus any
// top-level files. If system-fs is unavailable it degrades to the namespaced
// SDK (its own apps/files/ only). Either way the code below works on whatever
// paths the active facade returns from list() — full-from-store-root in root
// mode, app-relative otherwise — and never re-concatenates parent + entry.
const $ = id => document.getElementById(id);

// The active fs facade + whether it sees the whole store. Chosen in refresh().
let fs = window.naklios?.fs || null;
let rootMode = false;

// Friendly labels for known app namespaces (apps/<id>). Unknowns title-case.
const APP_LABELS = {
  anvil:'Anvil', files:'Files', notes:'Notes', editor:'Editor',
  slate:'Slate', tijori:'Tijori', kanzen:'KanZen', vaultmind:'VaultMind',
  nakliposter:'NakliPoster', forge:'Forge', mehfil:'Mehfil', roster:'Roster',
};
function cap(s){ return s ? s.charAt(0).toUpperCase() + s.slice(1) : s; }

function pickFacade(){
  const caps = window.naklios?.capabilities || {};
  if (caps.sysFs && window.naklios?.sys?.fs){ rootMode = true; return window.naklios.sys.fs; }
  rootMode = false;
  return window.naklios?.fs || null;
}

let currentPath = '';     // listing prefix, '' = facade root (full-path in root mode)
let selectedFile = null;  // selected file path (as returned by list, full for facade)
let expanded = new Set(); // expanded folder paths (facade-full)
let listing = [];         // current dir entries

function setStatus(text){ $('status').textContent = text; }
function showToast(text){
  document.querySelector('.toast')?.remove();
  const toast = document.createElement('div');
  toast.className = 'toast';
  toast.setAttribute('role', 'status');
  toast.textContent = text;
  document.body.appendChild(toast);
  setTimeout(() => toast.remove(), 5000);
}
function fmtSize(bytes){
  if (bytes == null) return '';
  if (bytes < 1024) return bytes + ' B';
  if (bytes < 1024*1024) return (bytes/1024).toFixed(1) + ' KB';
  if (bytes < 1024*1024*1024) return (bytes/(1024*1024)).toFixed(1) + ' MB';
  return (bytes/(1024*1024*1024)).toFixed(2) + ' GB';
}
function fmtDate(ts){
  if (!ts) return '';
  const d = new Date(ts);
  return d.toLocaleString();
}
function fmtPath(p){ return '/' + p; }

// Use a simpler heuristic: trailing slash from list() means directory.
function isDirEntry(name){ return name.endsWith('/'); }
function basename(p){ return p.replace(/\/$/, '').split('/').filter(Boolean).pop() || ''; }
function parent(p){
  const segs = p.replace(/\/$/, '').split('/').filter(Boolean);
  segs.pop();
  return segs.join('/');
}
// Display label for an entry path. In root mode, an app namespace root
// (apps/<id>) shows the app's friendly name instead of the bare id.
function prettyLabel(entryPath){
  const segs = entryPath.replace(/\/$/, '').split('/').filter(Boolean);
  const name = segs[segs.length - 1] || '';
  if (rootMode && segs.length === 2 && segs[0] === 'apps'){
    return APP_LABELS[name] || cap(name);
  }
  return name;
}
// Icon for a directory entry (app roots and the apps/ container get their own).
function dirIconFor(entryPath){
  const segs = entryPath.replace(/\/$/, '').split('/').filter(Boolean);
  if (rootMode && segs.length === 1 && segs[0] === 'apps') return '📂';
  if (rootMode && segs.length === 2 && segs[0] === 'apps') return '📦';
  return '📁';
}

function notConnected(detail){
  $('new-text').disabled = true;
  $('list').innerHTML = `
    <div class="empty">
      <div>
        <strong>Connect storage to browse Files</strong><br><br>
        Files uses the Folder or encrypted Crate selected in NakliOS.
        ${detail && !/permission denied|backend disconnected/i.test(detail) ? `<br><br>${escapeHtml(detail)}` : ''}
        <br>
        <button class="btn-cta" id="open-storage-settings" type="button">Open Storage settings…</button>
      </div>
    </div>
  `;
  $('open-storage-settings').addEventListener('click', () => naklios.openSettings?.('storage'));
  $('preview').hidden = true;
  $('tree').innerHTML = '';
  $('status').textContent = 'Not connected';
}

function backendLabel(){
  const caps = window.naklios?.capabilities || {};
  const d = (caps.fsBackends || []).find(b => b && b.id === caps.fsBackend);
  return d?.label || (caps.fsBackend === 'crate' ? 'Crate' : caps.fsBackend === 'fsa' ? 'Folder' : '');
}

async function refresh(){
  fs = pickFacade();
  if (!naklios.capabilities.hosted || !fs){
    notConnected();
    return;
  }
  $('new-text').disabled = false;
  try {
    // The first SDK operation asks the host to bind Files to an available
    // backend and show the normal per-app permission prompt.
    await fs.list('');
  } catch (e){
    notConnected(e.message);
    return;
  }
  // Reset navigation to the facade root if the previous path no longer applies
  // (e.g. we just upgraded from namespaced → whole-store).
  const be = backendLabel();
  $('scope-badge').hidden = !rootMode;
  const title = rootMode ? 'All apps' : 'Files';
  $('folder-name').textContent = be ? `${be}` : '';
  naklios.title(rootMode ? `Files — All apps${be ? ' · ' + be : ''}` : `Files${be ? ' — ' + be : ''}`);
  await renderTree();
  await openPath(currentPath);
}

async function renderTree(){
  const root = $('tree');
  root.innerHTML = '';
  const rootLabel = rootMode ? 'All files' : 'Files';
  const rootIcon = rootMode ? '💽' : '📁';
  await renderTreeNode(root, '', rootLabel, rootIcon);
}

// path is the facade-full path of this node ('' = root). Entries returned by
// list(path) are themselves facade-full paths, so we use them directly.
async function renderTreeNode(parentEl, path, label, icon){
  let entries = [];
  try { entries = await fs.list(path); } catch(_){}
  const dirs = entries.filter(isDirEntry).map(d => d.replace(/\/$/, ''));

  const node = document.createElement('div');
  node.className = 'tree-node';
  node.dataset.path = path;
  if (path === currentPath) node.classList.add('active');
  if (expanded.has(path) || path === '') node.classList.add('expanded');

  const hasChildren = dirs.length > 0;
  const chev = hasChildren ? '▸' : ' ';
  node.innerHTML = `
    <span class="chev">${chev}</span>
    <span class="icon">${icon}</span>
    <span class="label">${escapeHtml(label)}</span>
  `;
  node.addEventListener('click', async (e) => {
    e.stopPropagation();
    if (expanded.has(path)) expanded.delete(path);
    else expanded.add(path);
    document.querySelectorAll('.tree-node.active').forEach(n => n.classList.remove('active'));
    node.classList.add('active');
    currentPath = path;
    await openPath(path);
    await renderTree();
  });
  parentEl.appendChild(node);

  if ((expanded.has(path) || path === '') && hasChildren){
    const children = document.createElement('div');
    children.className = 'tree-children';
    for (const dirPath of dirs){
      await renderTreeNode(children, dirPath, prettyLabel(dirPath), dirIconFor(dirPath));
    }
    parentEl.appendChild(children);
  }
}

function renderCrumbs(path){
  const el = $('crumbs');
  el.innerHTML = '';
  const nav = (target) => async () => {
    currentPath = target;
    if (target) expanded.add(target);
    await openPath(target);
    await renderTree();
  };
  const mkCrumb = (label, target) => {
    const span = document.createElement('span');
    span.className = 'crumb';
    span.textContent = label;
    span.addEventListener('click', nav(target));
    return span;
  };
  const mkSep = () => {
    const s = document.createElement('span');
    s.className = 'sep'; s.textContent = '/';
    return s;
  };
  el.appendChild(mkCrumb(rootMode ? 'All files' : 'Files', ''));
  const segs = path.split('/').filter(Boolean);
  let acc = '';
  segs.forEach((seg, i) => {
    acc = acc ? `${acc}/${seg}` : seg;
    el.appendChild(mkSep());
    const label = (rootMode && i === 1 && segs[0] === 'apps') ? (APP_LABELS[seg] || cap(seg)) : seg;
    el.appendChild(mkCrumb(label, acc));
  });
}

async function openPath(path){
  currentPath = path;
  renderCrumbs(path);

  let entries = [];
  try { entries = await fs.list(path); }
  catch (e){ setStatus('Error: ' + e.message); return; }

  // Sort: directories first, alphabetical within each. Entries are facade-full
  // paths, so navigation and reads use them verbatim — no re-concatenation.
  const dirs = entries.filter(isDirEntry).sort();
  const files = entries.filter(e => !isDirEntry(e)).sort();
  listing = [...dirs, ...files];

  const list = $('list');
  list.innerHTML = '';
  if (!listing.length){
    selectedFile = null;
    $('preview').hidden = true;
    $('preview').innerHTML = '';
    list.innerHTML = '<div class="empty"><div>This folder is empty.</div></div>';
    setStatus(`${dirs.length} folders · 0 files`);
    return;
  }

  for (const entry of listing){
    const fullPath = entry.replace(/\/$/, '');
    const isDir = isDirEntry(entry);
    const row = document.createElement('div');
    row.className = 'list-row';
    row.dataset.path = fullPath;
    row.dataset.isDir = isDir ? '1' : '0';
    row.innerHTML = `
      <span class="icon">${isDir ? dirIconFor(entry) : iconFor(fullPath)}</span>
      <span class="name">${escapeHtml(prettyLabel(fullPath))}</span>
      <span class="size" id="size-${cssEscape(fullPath)}"></span>
    `;
    row.addEventListener('click', () => selectRow(row));
    row.addEventListener('dblclick', async () => {
      if (isDir){
        expanded.add(fullPath);
        currentPath = fullPath;
        await openPath(fullPath);
        await renderTree();
      } else {
        await previewFile(fullPath);
      }
    });
    row.addEventListener('contextmenu', (e) => {
      e.preventDefault();
      showContextMenu(e.clientX, e.clientY, fullPath, isDir);
    });
    list.appendChild(row);

    // Lazy-load file size
    if (!isDir){
      readFileSize(fullPath).then(sz => {
        const el = document.getElementById(`size-${cssEscape(fullPath)}`);
        if (el) el.textContent = fmtSize(sz);
      }).catch(() => {});
    }
  }

  setStatus(`${dirs.length} folders · ${files.length} files`);
}

function cssEscape(s){ return s.replace(/[^a-zA-Z0-9]/g, '_'); }

function iconFor(name){
  if (name.endsWith('.json')) return '🗂️';
  if (name.endsWith('.jsonl')) return '📜';
  if (name.endsWith('.md') || name.endsWith('.txt')) return '📝';
  if (/\.(png|jpe?g|gif|webp|svg)$/i.test(name)) return '🖼️';
  if (/\.(mp3|wav|ogg|m4a|flac)$/i.test(name)) return '🎵';
  if (/\.(mp4|mov|webm|avi)$/i.test(name)) return '🎬';
  return '📄';
}

async function readFileSize(path){
  try {
    return asBytes(await fs.readBinary(path)).byteLength;
  } catch(_){ return null; }
}

function asBytes(value){
  if (value instanceof Uint8Array) return value;
  if (value instanceof ArrayBuffer) return new Uint8Array(value);
  if (ArrayBuffer.isView(value)){
    return new Uint8Array(value.buffer, value.byteOffset, value.byteLength);
  }
  return new Uint8Array(value);
}

function previewMime(path){
  const ext = (path.split('.').pop() || '').toLowerCase();
  return {
    png:'image/png', jpg:'image/jpeg', jpeg:'image/jpeg',
    gif:'image/gif', webp:'image/webp', svg:'image/svg+xml',
  }[ext] || 'application/octet-stream';
}

function selectRow(row){
  document.querySelectorAll('.list-row.selected').forEach(r => r.classList.remove('selected'));
  row.classList.add('selected');
  const path = row.dataset.path;
  selectedFile = row.dataset.isDir === '1' ? null : path;
  if (selectedFile) previewFile(selectedFile);
  else $('preview').hidden = true;
}

async function previewFile(path){
  const pv = $('preview');
  pv.hidden = false;
  pv.innerHTML = `<h3>Preview · ${escapeHtml(basename(path))}</h3><div class="meta">Loading…</div>`;
  try {
    const bytes = asBytes(await fs.readBinary(path));
    const meta = `<div class="meta">
      <span>${fmtSize(bytes.byteLength)}</span>
      <span>${escapeHtml(fmtPath(path))}</span>
    </div>`;

    // Choose preview by extension/type
    if (bytes.byteLength > 1024 * 1024) {
      pv.innerHTML = `<h3>Preview · ${escapeHtml(basename(path))}</h3>${meta}<div class="meta" style="margin-top:8px;">File is over 1 MB — preview skipped.</div>`;
      return;
    }
    if (/\.(png|jpe?g|gif|webp|svg)$/i.test(path)) {
      const url = URL.createObjectURL(new Blob([bytes], { type: previewMime(path) }));
      pv.innerHTML = `<h3>Preview · ${escapeHtml(basename(path))}</h3>${meta}<img src="${url}" alt="">`;
      return;
    }
    const text = new TextDecoder().decode(bytes);
    let formatted = text;
    if (path.endsWith('.json')) {
      try { formatted = JSON.stringify(JSON.parse(text), null, 2); } catch(_){}
    }
    pv.innerHTML = `<h3>Preview · ${escapeHtml(basename(path))}</h3>${meta}<pre>${escapeHtml(formatted)}</pre>`;
  } catch (e){
    pv.innerHTML = `<h3>Preview · ${escapeHtml(basename(path))}</h3><div class="meta">Error: ${escapeHtml(e.message)}</div>`;
  }
}

function escapeHtml(s){
  return s.replace(/[&<>]/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;' }[c]));
}

function askToDelete(path){
  const dialog = $('delete-dialog');
  $('delete-dialog-copy').textContent = `${fmtPath(path)} will be permanently removed from this storage location.`;
  dialog.returnValue = 'cancel';
  dialog.showModal();
  $('delete-dialog-cancel').focus();
  return new Promise(resolve => {
    dialog.addEventListener('close', () => resolve(dialog.returnValue === 'delete'), { once:true });
  });
}

function showContextMenu(x, y, path, isDir){
  closeContextMenu();
  const menu = document.createElement('div');
  menu.className = 'context-menu';
  menu.id = 'ctx-menu';
  menu.style.left = x + 'px';
  menu.style.top = y + 'px';
  // "Edit in Editor" rides the namespaced Open-With grant, which the host
  // clamps to apps/files/. It can therefore only hand off files that live in
  // the Files namespace — offer it only for those (all files, in namespaced
  // mode; only apps/files/* in whole-store mode).
  const editable = !rootMode || path === 'apps/files' || path.startsWith('apps/files/');
  const editPath = rootMode ? path.replace(/^apps\/files\//, '') : path;
  const inner = [];
  if (!isDir){
    inner.push(`<button id="ctx-open">Open / preview</button>`);
    if (editable) inner.push(`<button id="ctx-edit">Edit in Editor</button>`);
    inner.push(`<button id="ctx-download">Download…</button>`);
    inner.push(`<div class="sep"></div>`);
  }
  inner.push(`<button id="ctx-delete" class="danger">Delete…</button>`);
  menu.innerHTML = inner.join('');
  document.body.appendChild(menu);

  menu.querySelector('#ctx-open')?.addEventListener('click', () => {
    closeContextMenu();
    previewFile(path);
  });
  menu.querySelector('#ctx-edit')?.addEventListener('click', async () => {
    closeContextMenu();
    try {
      const opened = await naklios.files.openWith('editor', editPath);
      setStatus(opened ? `Opened ${basename(path)} in Editor` : 'Open With cancelled');
    } catch (e){ showToast('Could not open in Editor: ' + e.message); }
  });
  menu.querySelector('#ctx-download')?.addEventListener('click', async () => {
    closeContextMenu();
    try {
      const bytes = asBytes(await fs.readBinary(path));
      const url = URL.createObjectURL(new Blob([bytes]));
      const a = document.createElement('a');
      a.href = url; a.download = basename(path); document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 1000);
    } catch (e){ showToast('Download failed: ' + e.message); }
  });
  menu.querySelector('#ctx-delete')?.addEventListener('click', async () => {
    closeContextMenu();
    if (!await askToDelete(path)) return;
    try {
      await fs.delete(path);
      if (selectedFile === path){
        selectedFile = null;
        $('preview').hidden = true;
        $('preview').innerHTML = '';
      }
      await refresh();
    } catch (e){ showToast('Delete failed: ' + e.message); }
  });

  setTimeout(() => document.addEventListener('pointerdown', closeContextMenuOnOutside, true), 0);
}
function closeContextMenu(){
  document.getElementById('ctx-menu')?.remove();
  document.removeEventListener('pointerdown', closeContextMenuOnOutside, true);
}
function closeContextMenuOnOutside(e){
  const menu = document.getElementById('ctx-menu');
  if (menu && !menu.contains(e.target)) closeContextMenu();
}

// Wire toolbar
$('new-text').addEventListener('click', async () => {
  $('new-file-error').textContent = '';
  $('new-file-dialog').showModal();
  $('new-file-name').focus();
  $('new-file-name').select();
});
$('new-file-cancel').addEventListener('click', () => $('new-file-dialog').close('cancel'));
$('new-file-form').addEventListener('submit', async e => {
  e.preventDefault();
  const name = $('new-file-name').value.trim();
  if (!name || name === '.' || name === '..' || /[\/\\]/.test(name)){
    $('new-file-error').textContent = 'Use a plain file name without folders or slashes.';
    $('new-file-name').focus();
    return;
  }
  try {
    const target = currentPath ? `${currentPath}/${name}` : name;
    await fs.write(target, $('new-file-contents').value);
    $('new-file-dialog').close('create');
    await refresh();
    setStatus(`Created ${target}`);
  } catch (e){
    $('new-file-error').textContent = 'Create failed: ' + e.message;
  }
});
$('refresh').addEventListener('click', () => refresh());

// Boot
let storageWasAvailable = false;
// Coalesce overlapping refreshes: the initial namespaced render can race the
// capability message that upgrades us to whole-store mode.
let refreshing = false, refreshQueued = false;
async function refreshSafe(){
  if (refreshing){ refreshQueued = true; return; }
  refreshing = true;
  try { await refresh(); }
  finally {
    refreshing = false;
    if (refreshQueued){ refreshQueued = false; void refreshSafe(); }
  }
}
naklios.onCapabilitiesChange(capabilities => {
  const available = !!capabilities.fs;
  // Whole-store access can arrive a beat after fs (the host resolves system
  // status + backend binding separately) and does NOT necessarily re-broadcast
  // after ready(). Upgrade the moment it flips — not gated on boot completion —
  // so first open lands directly in the full file manager, no manual refresh.
  const wantRoot = !!(capabilities.sysFs && window.naklios?.sys?.fs);
  const facadeChanged = wantRoot !== rootMode;
  if (available && (facadeChanged || !storageWasAvailable)){
    if (facadeChanged) currentPath = '';
    void refreshSafe();
  }
  if (!available && storageWasAvailable) notConnected();
  storageWasAvailable = available;
});
naklios.requestCapabilities();
refreshSafe()
  .catch(e => setStatus('Error: ' + e.message))
  .finally(() => { naklios.ready(); });

})();
</script>
