    if (!parent) ui.toast('This folder is browse-only, so saves download a copy.', 'info');
  }

  // A save beside the original adds a file to the folder: index it.
  on('save:complete', () => {
    if (state.session.source !== 'library' || !editorRoot || state.export.saveMode !== 'sidecar') return;
    if (!lib.roots.has(editorRoot)) return;
    lib.rescan(editorRoot).catch(err => scanFailed(editorRoot, err));
  });

  // ── slideshow (row B8): Slate's slideshow runs over state.session.files ──
  async function startSlideshow() {
    const pick = (sel.size ? ids.filter(id => sel.has(id)) : ids).filter(id => lib.get(id)?.kind === 'photo' && !lib.get(id)?.missing);
    if (!pick.length) { ui.toast('There are no photos to show here.', 'warn'); return; }
    if (pick.length > SLIDESHOW_MAX) ui.toast(`The slideshow shows the first ${SLIDESHOW_MAX.toLocaleString('en-GB')} photos.`, 'info');
    const chosen = pick.slice(0, SLIDESHOW_MAX);
    const files = (await Promise.all(chosen.map(id => lib.getFile(id).catch(() => null))))
      .map((f, i) => f && { handle: null, name: lib.get(chosen[i]).name, size: f.size, type: f.type, index: 0, file: f })
      .filter(Boolean);
    if (!files.length) { ui.toast('Could not read those photos.', 'error'); return; }
    files.forEach((f, i) => { f.index = i; });
    state.session.source = 'library';
    state.session.folderHandle = null;
    state.session.files = files;
    state.session.currentIndex = 0;
    editorRoot = null;
    hideLibrary();
    await navigateTo(0);
    emit('session:changed', state.session);
    emit('slideshow:start', null);
  }

  // ── query ────────────────────────────────────────────────────────────────
  function baseOpts() {
    switch (cur.view) {
      case 'favourites': return { fav: true };
      case 'videos': return { kind: 'video' };
      case 'album': return { album: cur.albumId };
      case 'folder': return { root: cur.rootId, folder: cur.folder };
      case 'hidden': return { hidden: 'only' };
      case 'trash': return { trashed: 'only', hidden: 'include' };
      default: return {};
    }
  }
  function currentOpts() {
    const o = { ...baseOpts(), ...filters };
    if (q) o.q = q;
    if (cur.view === 'videos') o.kind = 'video';
    if (cur.view === 'favourites') o.fav = true;
    return o;
  }

  function requery() {
    dirty = false;
    const keep = scrollAnchor();
    list = lib.search(currentOpts());
    ids = list.map(r => r.id);
    indexOf = new Map(ids.map((id, i) => [id, i]));
    let pruned = false;
    for (const id of sel) if (!indexOf.has(id)) { sel.delete(id); pruned = true; }
    relayout(keep);
    renderHead();
    viewer.refresh();
    if (pruned) { announceSelection(); selectionChanged(); }
  }

  let rqTimer = null, rqLast = 0;
  function scheduleRequery() {
    dirty = true;
    if (!open || rqTimer) return;
    const wait = Math.max(0, rqLast + 500 - performance.now());
    rqTimer = setTimeout(() => { rqTimer = null; rqLast = performance.now(); if (open) requery(); }, wait);
  }
  function relayoutOrRequery() { if (dirty) requery(); else relayout(scrollAnchor()); }

  // ── layout and rendering ─────────────────────────────────────────────────
  const sortable = () => true; // every view sorts by capture time, newest first
  function relayout(keep) {
    const width = grid.clientWidth - PAD * 2;
    if (width <= 0) return;
    lastWidth = grid.clientWidth;
    layout = buildLayout(list, { width, zoom, grouped: sortable() });
    months = monthTable(layout, list);
    sizer.style.height = `${layout.height}px`;
    sizer.style.width = `${width}px`;
    const carry = clearRows();
    renderScrubber();
    if (keep && indexOf.has(keep.id)) grid.scrollTop = itemRect(layout, indexOf.get(keep.id)).y - keep.offset;
    render(carry);
    renderEmpty();
  }

  // The first visible item and its distance from the top, to hold position across relayouts.
  function scrollAnchor() {
    if (!layout.rows.length || !list.length) return null;
    const top = grid.scrollTop - PAD;
    const fi = indexOf.get(focusId);
    if (fi != null && layout.itemRow.length > fi) {
      const r = itemRect(layout, fi);
      if (r.y >= top && r.y < top + grid.clientHeight) return { id: focusId, offset: r.y - grid.scrollTop };
    }
    const { first } = visibleRows(layout, top, grid.clientHeight, 0);
    for (let r = first; r < layout.rows.length; r++) {
      const row = layout.rows[r];
      if (row.type === 'tiles' && row.start < ids.length) return { id: ids[row.start], offset: row.top - grid.scrollTop };
    }
    return null;
  }

  function clearRows() {
    const carry = new Map();
    for (const { el: r, ctl } of rowEls.values()) {
      ctl.abort();
      for (const img of r.querySelectorAll('img[src]')) carry.set(img.closest('[data-id]').dataset.id, img.src);
      r.remove();
    }
    rowEls.clear();
    return carry;
  }

  let renderQueued = false;
  function queueRender() {
    if (renderQueued) return;
    renderQueued = true;
    requestAnimationFrame(() => { renderQueued = false; render(); });
  }

  function render(carry = null) {
    if (!open) return;
    const { first, last } = visibleRows(layout, grid.scrollTop - PAD, grid.clientHeight, 600);
    for (const [r, entry] of rowEls) {
      if (r < first || r > last) { entry.ctl.abort(); entry.el.remove(); rowEls.delete(r); }
    }
    for (let r = first; r <= last; r++) if (!rowEls.has(r)) makeRow(r, carry);
    updateScrubThumb();
  }

  function makeRow(r, carry) {
    const row = layout.rows[r];
    const ctl = new AbortController();
    const div = document.createElement('div');
    div.className = row.type === 'header' ? `lib-row lib-head-row lib-head-${row.unit}` : 'lib-row';
    div.setAttribute('role', 'row');
    div.style.transform = `translateY(${row.top}px)`;
    div.style.height = `${row.height}px`;
    if (row.type === 'header') {
      const label = row.unit === 'month' ? monthLabel(row.key) : dayLabel(row.key);
      const all = ids.slice(row.start, row.start + row.count).every(id => sel.has(id));
      div.innerHTML = `<div role="rowheader" class="lib-hcell">
        <button class="lib-daysel" data-group="${r}" aria-pressed="${all}" aria-label="Select all ${row.count} in ${esc(label)}"><span class="lib-tick" aria-hidden="true"></span></button>
        <span class="lib-hlabel">${esc(label)}</span><span class="lib-hcount">${row.count.toLocaleString('en-GB')}</span></div>`;
    } else {
      for (let i = row.start; i < row.end; i++) div.appendChild(makeTile(i, ctl.signal, carry));
    }
    sizer.appendChild(div);
    rowEls.set(r, { el: div, ctl });
  }

  function makeTile(i, signal, carry) {
    const rec = list[i];
    const c = lib.choice(rec.id);
    const rating = lib.rating(rec.id);
    const t = document.createElement('div');
    t.className = 'lib-tile';
    t.id = `lib-t-${i}`;
    t.dataset.id = rec.id;
    t.dataset.i = i;
    t.setAttribute('role', 'gridcell');
    t.setAttribute('aria-selected', String(sel.has(rec.id)));
    t.style.width = t.style.height = `${layout.tile}px`;
    if (sel.has(rec.id)) t.classList.add('is-sel');
    if (rec.id === focusId) t.classList.add('is-focus');
    if (c.hidden) t.classList.add('is-hidden');
    const label = [rec.name, formatTaken(rec.time)];
    const badges = [];
    if (rec.kind === 'video') { label.push(`video${rec.dur ? ' ' + formatDuration(rec.dur) : ''}`); badges.push(`<span class="lib-b lib-b-dur">${rec.dur ? formatDuration(rec.dur) : 'Video'}</span>`); }
    if (c.fav) { label.push('favourite'); badges.push('<span class="lib-b lib-b-fav">&#9829;</span>'); }
    if (rating) { label.push(`${rating} star${rating === 1 ? '' : 's'}`); badges.push(`<span class="lib-b lib-b-star">&#9733;${rating}</span>`); }
    if (c.flag === 'pick') { label.push('picked'); badges.push('<span class="lib-b lib-b-pick">&#10003;</span>'); }
    if (c.flag === 'reject') { label.push('rejected'); badges.push('<span class="lib-b lib-b-reject">&#10005;</span>'); }
    if (rec.missing) { label.push('missing'); badges.push('<span class="lib-b lib-b-missing">Missing</span>'); }
    t.setAttribute('aria-label', label.join(', '));
    t.innerHTML = `<span class="lib-ph" aria-hidden="true">${esc(rec.ext.toUpperCase())}</span><span class="lib-badges" aria-hidden="true">${badges.join('')}</span><span class="lib-selmark" aria-hidden="true"></span>`;
    const known = carry?.get(rec.id);
    if (known) setThumb(t, known);
    if (rec.thumb !== 'fail' && rec.thumb !== 'none') loadThumb(t, rec.id, signal);
    return t;
  }

  function setThumb(t, url) {
    let img = t.querySelector('img');
    if (!img) { img = document.createElement('img'); img.alt = ''; img.draggable = false; img.decoding = 'async'; t.insertBefore(img, t.firstChild); }
    if (img.src !== url) img.src = url;
    t.classList.add('has-img');
  }

  function loadThumb(t, id, signal) {
    const thumbs = lib.services.thumbs;
    if (!thumbs?.url) return;
    // The signal lets a thumbnail service drop requests for rows that scrolled away;
    // either way a late answer for a removed tile is ignored here.
    Promise.resolve(thumbs.url(id, { signal })).then(u => {
      if (!u || signal.aborted || t.dataset.id !== id || !t.isConnected) return;
      setThumb(t, u);
    }).catch(() => {});
  }

  // Tiles whose record changed without a change of order (thumbnails, durations, choices).
  function refreshTiles(changed) {
    for (const [, { el: rowEl, ctl }] of rowEls) {
      for (const t of rowEl.querySelectorAll('.lib-tile')) {
        if (!changed.has(t.dataset.id)) continue;
        const fresh = makeTile(Number(t.dataset.i), ctl.signal, new Map([[t.dataset.id, t.querySelector('img')?.src]].filter(x => x[1])));
        t.replaceWith(fresh);
      }
    }
  }

  function repaintSelection() {
    for (const [, { el: rowEl }] of rowEls) {
      for (const t of rowEl.querySelectorAll('.lib-tile')) {
        const on1 = sel.has(t.dataset.id);
        t.classList.toggle('is-sel', on1);
        t.setAttribute('aria-selected', String(on1));
        t.classList.toggle('is-focus', t.dataset.id === focusId);
      }
      for (const b of rowEl.querySelectorAll('.lib-daysel')) {
        const row = layout.rows[Number(b.dataset.group)];
        b.setAttribute('aria-pressed', String(ids.slice(row.start, row.start + row.count).every(id => sel.has(id))));
      }
    }
  }

  // ── header, counts, empty state ──────────────────────────────────────────
  function viewTitle() {
    if (q || Object.keys(filters).length) { if (cur.view === 'timeline') return 'Search results'; }
    switch (cur.view) {
      case 'favourites': return 'Favourites';
      case 'videos': return 'Videos';
      case 'album': return lib.albums.get(cur.albumId)?.name ?? 'Album';
      case 'folder': return `${lib.roots.get(cur.rootId)?.name ?? ''}${cur.folder ? '/' + cur.folder : ''}`;
      case 'hidden': return 'Hidden';
      case 'trash': return 'Trash';
      default: return 'Timeline';
    }
  }
  function renderHead() {
    viewNameEl.textContent = viewTitle();
    const n = list.length.toLocaleString('en-GB');
    countEl.textContent = `${n} item${list.length === 1 ? '' : 's'}${sel.size ? `, ${sel.size.toLocaleString('en-GB')} selected` : ''}`;
  }
  function announceSelection() { renderHead(); }

  function renderEmpty() {
    if (!lib.roots.size) {
      emptyEl.hidden = false;
      emptyEl.innerHTML = `<div class="lib-empty-inner"><h2>Add a folder of photos</h2>
        <p>Slate reads the photos where they are. Nothing is uploaded or copied, and your choices are saved in the folder.</p>
        <button class="btn btn-primary" data-act="add-folder">Add folder</button>
        ${hasDirPicker ? '' : `<p class="lib-note">${BROWSE_ONLY_NOTE}</p>`}</div>`;
      return;
    }
    if (list.length) { emptyEl.hidden = true; return; }
    const busy = !lib.jobs.status().idle;
    const msg = busy ? 'Reading your folders. Photos appear here as they are found.'
      : q || Object.keys(filters).length ? 'No photos match this search.'
        : { trash: 'The trash is empty.', hidden: 'No hidden photos.', favourites: 'No favourites yet.', videos: 'No videos.', album: 'This album is empty.' }[cur.view] ?? 'No photos here.';
    emptyEl.hidden = false;
    emptyEl.innerHTML = `<div class="lib-empty-inner"><p>${esc(msg)}</p></div>`;
  }

  // ── sidebar ──────────────────────────────────────────────────────────────
  function isCurrent(v, extra = {}) {
    if (cur.view !== v) return false;
    return Object.entries(extra).every(([k, val]) => cur[k] === val);
  }
  function viewBtn(view, label, count, extra = {}, cls = '') {
    const attrs = Object.entries(extra).map(([k, v]) => `data-${k}="${esc(String(v))}"`).join(' ');
    return `<button class="lib-nav ${cls}" data-view="${view}" ${attrs} ${isCurrent(view, extra) ? 'aria-current="page"' : ''}><span class="lib-nav-label">${esc(label)}</span>${count != null ? `<span class="lib-nav-count">${count.toLocaleString('en-GB')}</span>` : ''}</button>`;
  }

  function renderSidebar() {
    if (!open) return;
    const c = lib.counts();
    const albums = [...lib.albums.values()].sort((a, b) => a.name.localeCompare(b.name));
    const folders = lib.folders();
    let html = `<div class="lib-side-sec">
      ${viewBtn('timeline', 'Timeline', c.photos + c.videos)}
      ${viewBtn('favourites', 'Favourites', c.favourites)}
      ${viewBtn('videos', 'Videos', c.videos)}
    </div>
    <h2 class="lib-side-h">Albums</h2><div class="lib-side-sec">`;
    if (!albums.length) html += '<p class="lib-side-note">No albums yet.</p>';
    for (const al of albums) {
      const n = [...al.items].filter(id => lib.get(id) && !lib.choice(id).trashed).length;
      html += `<div class="lib-side-row">${viewBtn('album', al.name, n, { album: al.id })}<button class="btn-icon lib-more" data-album-menu="${esc(al.id)}" aria-label="Options for album ${esc(al.name)}" aria-haspopup="menu"><span aria-hidden="true">&#8943;</span></button></div>`;
    }
    html += '</div><h2 class="lib-side-h">Folders</h2><div class="lib-side-sec">';
    for (const root of lib.roots.values()) {
      const browseOnly = root.mode === 'files' || !root.handle;
      html += `<div class="lib-root"><div class="lib-root-head">${viewBtn('folder', root.name, subtreeCounts(folders.get(root.id) ?? new Map()).get('') ?? 0, { root: root.id, folder: '' }, 'lib-root-name')}`;
      if (reconnect.has(root.id)) html += `<button class="btn btn-sm btn-primary" data-reconnect="${esc(root.id)}" aria-label="Reconnect ${esc(root.name)}">Reconnect</button>`;
      html += '</div>';
      if (browseOnly) html += '<p class="lib-side-note">Browse-only</p>';
      if (needsDownload(lib, root)) html += `<button class="btn btn-sm lib-dl" data-download="${esc(root.id)}" aria-label="Download the library file for ${esc(root.name)}">Download library file</button>`;
      html += folderTree(root, folders.get(root.id) ?? new Map());
      html += '</div>';
    }
    html += `<button class="btn lib-add" data-act="add-folder">${icon('folder').replace('class="icon"', 'class="icon icon-sm"')} Add folder</button>`;
    if (!hasDirPicker) html += `<p class="lib-side-note">${BROWSE_ONLY_NOTE}</p>`;
    html += `</div><div class="lib-side-sec lib-side-end">
      ${viewBtn('hidden', 'Hidden', c.hidden)}
      ${viewBtn('trash', 'Trash', c.trashed)}
    </div>`;
    side.innerHTML = html;
  }

  // Top-level folders of a root, plus the branch down to (and the children of) the current folder.
  // Photos in a folder and every folder below it.
  function subtreeCounts(counts) {
    const out = new Map();
    for (const [p, n] of counts) {
      const parts = p ? p.split('/') : [];
      for (let k = 0; k <= parts.length; k++) {
        const key = parts.slice(0, k).join('/');
        out.set(key, (out.get(key) || 0) + n);
      }
    }
    return out;
  }

  function folderTree(root, direct) {
    const counts = subtreeCounts(direct);
    const all = new Set();
    for (const p of counts.keys()) {
      if (!p) continue;
      const parts = p.split('/');
      for (let k = 1; k <= parts.length; k++) all.add(parts.slice(0, k).join('/'));
    }
    const curFolder = cur.view === 'folder' && cur.rootId === root.id ? cur.folder : null;
    const shown = [...all].filter(p => {
      const parent = p.includes('/') ? p.slice(0, p.lastIndexOf('/')) : '';
      return parent === '' || (curFolder != null && (curFolder === parent || curFolder.startsWith(parent + '/')));
    }).sort((a, b) => a.localeCompare(b, undefined, { numeric: true }));
    if (!shown.length) return '';
    return `<div class="lib-tree">${shown.map(p => {
      const depth = p.split('/').length;
      return `<div style="padding-left:${(depth - 1) * 12}px">${viewBtn('folder', p.slice(p.lastIndexOf('/') + 1), counts.get(p) ?? 0, { root: root.id, folder: p })}</div>`;
    }).join('')}</div>`;
  }

  side.addEventListener('click', (e) => {
    const menu = e.target.closest('[data-album-menu]');
    if (menu) { ui.hooks.albumMenu?.(menu.dataset.albumMenu, menu); return; }
    const dl = e.target.closest('[data-download]');
    if (dl) { downloadLibFile(lib, dl.dataset.download); return; }
    const rc = e.target.closest('[data-reconnect]');
    if (rc) { reconnectRoot(rc.dataset.reconnect); return; }
    const b = e.target.closest('[data-view]');
    if (!b) return;
    const v = b.dataset.view;
    cur = { view: v };
    if (v === 'album') cur.albumId = b.dataset.album;
    if (v === 'folder') { cur.rootId = b.dataset.root; cur.folder = b.dataset.folder ?? ''; }
    switchView();
  });

  function switchView() {
    sel = new Set(); anchor = -1; focusId = null;
    viewer.close();
    grid.scrollTop = 0;
    requery();
    grid.scrollTop = 0;
    render();
    renderSidebar();
    selectionChanged();
    viewChanged();
  }

  // ── folders: add, rescan, reconnect ──────────────────────────────────────
  el.addEventListener('click', (e) => {
    const a = e.target.closest('[data-act]')?.dataset.act;
    if (!a) return;
    if (a === 'add-folder') addFolder();
    else if (a === 'editor') hideLibrary();
    else if (a === 'filters') toggleFilters();
    else if (a === 'zoom-in') setZoom(zoom + 1);
    else if (a === 'zoom-out') setZoom(zoom - 1);
    else if (a === 'slideshow') startSlideshow();
    else if (a === 'storage') openStoragePanel(lib, storageDlg);
  });

  function pickFiles() {
    return new Promise((resolve) => {
      const input = document.createElement('input');
      input.type = 'file';
      input.multiple = true;
      input.webkitdirectory = true;
      input.onchange = () => resolve(Array.from(input.files ?? []));
      input.click();
    });
  }

  async function addFolder() {
    if (hasDirPicker) {
      let handle;
      try { handle = await window.showDirectoryPicker({ mode: 'readwrite', id: 'slate-library' }); }
      catch (err) { if (err.name !== 'AbortError') emit('error', { message: `Could not add the folder: ${err.message}` }); return; }
      cur = { view: 'timeline' };
      switchView();
      lib.addRoot({ handle }).then(() => renderSidebar()).catch(async (err) => {
        for (const r of lib.roots.values()) if (r.handle && await r.handle.isSameEntry?.(handle)) { scanFailed(r.id, err); return; }
        emit('error', { message: `Could not add the folder: ${err.message}` });
      });
    } else {
      const files = await pickFiles();
      if (!files.length) return;
      const name = (files[0].webkitRelativePath || '').split('/')[0] || 'Photos';
      cur = { view: 'timeline' };
      switchView();
      ui.toast(`${name} is browse-only in this browser.`, 'info');
      lib.addRoot({ name, files }).then(() => renderSidebar()).catch(err => emit('error', { message: `Could not read ${name}: ${err.message}` }));
    }
  }

  function scanFailed(rootId, err) {
    if (err?.code === 'permission') {
      reconnect.add(rootId);
      renderSidebar();
      ui.toast(`Slate needs your permission to read ${lib.roots.get(rootId)?.name ?? 'a folder'} again. Press Reconnect.`, 'warn');
    } else emit('error', { message: `Could not scan ${lib.roots.get(rootId)?.name ?? 'a folder'}: ${err?.message ?? err}` });
  }

  function rescanRoot(rootId) {
    return lib.rescan(rootId).then(() => { if (reconnect.delete(rootId)) renderSidebar(); }, err => scanFailed(rootId, err));
  }

  // Once per session, look for new, changed and missing files (row L4). This runs
  // from the click or key that opened the library, so a permission prompt can show.
  async function rescanAll() {
    for (const root of [...lib.roots.values()]) {
      if (!root.handle && !root.files) { reconnect.add(root.id); continue; }
      await rescanRoot(root.id);
    }
    renderSidebar();
  }

  async function reconnectRoot(rootId) {
    const root = lib.roots.get(rootId);
    if (!root) return;
    if (!root.handle) {
      const files = await pickFiles();
      if (!files.length) return;
      root.files = files; // browse-only roots hold their files in memory (see library.js addRoot)
    }
    rescanRoot(rootId);
  }

  // ── search and filters ───────────────────────────────────────────────────
  let qTimer = null;
  search.addEventListener('input', () => {
    clearTimeout(qTimer);
    qTimer = setTimeout(() => { q = search.value.trim(); grid.scrollTop = 0; requery(); viewChanged(); }, 150);
  });

  function toggleFilters() {
    const show = filtersForm.hidden;
    filtersForm.hidden = !show;
    el.querySelector('[data-act="filters"]').setAttribute('aria-expanded', String(show));
    if (show) { fillFilterLists(); filtersForm.querySelector('input,select')?.focus(); }
  }

  function fillFilterLists() {
    const cams = new Set();
    for (const r of lib.records.values()) if (r.camera) cams.add(r.camera);
    const fill = (name, values) => {
      const s = filtersForm.elements[name];
      const keep = s.value;
      s.innerHTML = '<option value="">Any</option>' + values.map(v => `<option value="${esc(v)}">${esc(v)}</option>`).join('');
      s.value = values.includes(keep) ? keep : '';
    };
    fill('camera', [...cams].sort());
    fill('tag', [...lib.tags().keys()].sort((a, b) => a.localeCompare(b)));
  }

  function readFilters() {
    const f = filtersForm.elements;
    const out = {};
    const date = (v) => { const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(v); return m ? Date.UTC(+m[1], +m[2] - 1, +m[3]) : null; };
    const from = date(f.from.value), to = date(f.to.value);
    if (from != null) out.from = from;
    if (to != null) out.to = to + 86400000; // the "to" day is included
    if (f.kind.value) out.kind = f.kind.value;
    if (f.camera.value) out.camera = f.camera.value;
    if (f.minRating.value) out.minRating = Number(f.minRating.value);

    dlg.setAttribute('role', 'dialog');

  // Tags: the photos' own tags with a remove button each, an input with

    const all = [...lib.tags()].sort((a, b) => b[1] - a[1]).map(([t]) => t);

        <form class="org-row">

      const chips = body.querySelector('.org-chips'), sugg = body.querySelector('.org-suggest'), inp = body.querySelector('input');

      function render() {
        const cur = current();

          ? cur.map(t => `<span class="org-chip" role="listitem">${esc(t)}${own.has(t) && own.get(t) < ids.length ? ` <small>${own.get(t)}/${ids.length}</small>` : ''}<button type="button" class="org-chip-x" data-rm="${esc(t)}" aria-label="Remove tag ${esc(t)}">×</button></span>`).join('')

      }

      <button type="button" class="btn" data-act="favourite" aria-pressed="${allFav}" title="Favourite (F)"${off}>${allFav ? 'Unfavourite' : 'Favourite'}</button>
      <button type="button" class="btn" data-act="rate" aria-haspopup="menu" title="Rate (0 to 5)"${off}>Rate</button>
      <button type="button" class="btn" data-act="flag" aria-haspopup="menu" title="Pick (P), reject (X), clear (U)"${off}>Flag</button>
      <button type="button" class="btn" data-act="tag" aria-haspopup="dialog" title="Tag (T)"${off}>Tag…</button>
      <button type="button" class="btn" data-act="album" aria-haspopup="dialog"${off}>Add to album…</button>
      ${v.view === 'album' && v.albumId ? `<button type="button" class="btn" data-act="unalbum"${off}>Remove from album</button>` : ''}
      <button type="button" class="btn" data-act="hide" title="Hide (H)"${off}>${allHidden ? 'Unhide' : 'Hide'}</button>
      <button type="button" class="btn" data-act="trash" title="Move to trash (Delete)"${off}>Move to trash</button>
      <span class="separator" aria-hidden="true"></span>
      <button type="button" class="btn" data-act="batch"${off}>Batch…</button>
      <button type="button" class="btn" data-act="gallery"${off}>Contact sheet</button>`;
  }

  bar.addEventListener('click', (e) => {
    const btn = e.target.closest('[data-act]');
    if (!btn || btn.disabled) return;
    const ids = targets();
    switch (btn.dataset.act) {
      case 'favourite': act({ op: 'favourite' }, ids); break;
      case 'hide': act({ op: 'hide' }, ids); break;
      case 'trash': act({ op: 'trash' }, ids); break;
      case 'tag': tagDialog(ids); break;
      case 'album': albumPicker(ids); break;
      case 'rate': openMenu(btn, 'Rating', [0, 1, 2, 3, 4, 5].map(k => ({ label: k ? `${'★'.repeat(k)}  ${plural(k, 'star')}` : 'No rating', run: () => act({ op: 'rate', rating: k }, ids) }))); break;
      case 'flag': openMenu(btn, 'Flag', [
        { label: 'Pick', run: () => act({ op: 'flag', flag: 'pick' }, ids) },
        { label: 'Reject', run: () => act({ op: 'flag', flag: 'reject' }, ids) },
        { label: 'Clear flag', run: () => act({ op: 'flag', flag: 'none' }, ids) },
      ]); break;
      case 'unalbum': {
        const albumId = view().albumId;
        write('album_remove', ids, { album: albumId })
          .then(r => done(`Removed ${plural(r.changed, 'photo')} from the album`, [r.undo])).catch(fail);
        break;
      }
      case 'batch': emit('library:batch', { ids }); break;
      case 'gallery': emit('library:gallery', { ids }); break;
      case 'restore': restore(ids); break;
      case 'empty': emptyTrash(); break;
    }
  });

  // The view has no selection event, so the bar refreshes after any click or
  // key, and on library changes; render() does nothing when nothing changed.
  let pending = false;
  const update = () => { if (pending) return; pending = true; setTimeout(() => { pending = false; render(); }, 0); };
  for (const t of ['choices', 'albums', 'records']) lib.on(t, update);
  on('library:selection', update);
  on('library:view', update);
  document.addEventListener('click', update, true);
  document.addEventListener('keyup', update, true);
  render();
}

return { keyAction, initOrganise };

// ── Main modal ───────────────────────────────────────────────────────────────

function showBatchModal() {
  const folder = state.session.folderHandle || null;
  openBatch(
    state.session.files.map(f => ({ name: f.name, size: f.size, file: f.file, handle: f.handle })),
    folder,
    folder ? 'from current folder' : 'currently open',
  );
}

function openBatch(sources, folderHandle, label) {
  // Reset per-invocation state
  _sources = sources;
  _sourceFolderHandle = folderHandle;
  _sourceLabel = label;
  _destFolderHandle = null;
  _destMode = _sourceFolderHandle ? 'subfolder' : 'picked';

  let dlg = document.getElementById('dialog-batch');
  if (!dlg) {
    dlg = document.createElement('dialog');
    dlg.id = 'dialog-batch';
    dlg.className = 'batch-dialog';
    document.body.appendChild(dlg);
  }
  render(dlg);
  dlg.showModal();
}

function render(dlg) {

function bind(dlg) {
  dlg.querySelectorAll('[data-batch]').forEach(el => {
    el.addEventListener('click', () => {
      const a = el.dataset.batch;
      if (a === 'close')       dlg.close();
      else if (a === 'pick-src')  pickSourceFolder(dlg);
      else if (a === 'dry-run')   doDryRun(dlg);
      else if (a === 'run')       doRun(dlg);
    });
  });

  // Op enable/disable
  ['convert','resize','rotate','flip','rename'].forEach(k => {
    dlg.querySelector(`#op-${k}`)?.addEventListener('change', e => { ops[k].enabled = e.target.checked; });
  });

  // Convert options
  dlg.querySelector('#conv-format')?.addEventListener('change', e => { ops.convert.format = e.target.value; });
  dlg.querySelector('#conv-quality')?.addEventListener('change', e => { ops.convert.quality = clamp(+e.target.value, 10, 100); });
  dlg.querySelector('#conv-strip')?.addEventListener('change', e => { ops.convert.stripExif = e.target.checked; });

  // Resize options
  dlg.querySelector('#rs-mode')?.addEventListener('change', e => { ops.resize.mode = e.target.value; });
  dlg.querySelector('#rs-w')?.addEventListener('change', e => { ops.resize.w = +e.target.value; });
  dlg.querySelector('#rs-h')?.addEventListener('change', e => { ops.resize.h = +e.target.value; });
  dlg.querySelector('#rs-lock')?.addEventListener('change', e => { ops.resize.lockAspect = e.target.checked; });

  // Rotate / flip
  dlg.querySelector('#rot-deg')?.addEventListener('change', e => { ops.rotate.deg = +e.target.value; });
  dlg.querySelector('#flip-axis')?.addEventListener('change', e => { ops.flip.axis = e.target.value; });

  // Rename template
  dlg.querySelector('#rn-template')?.addEventListener('input', e => { ops.rename.template = e.target.value; });
  dlg.querySelectorAll('.batch-tokens span').forEach(span => {
    span.addEventListener('click', () => {
      const inp = dlg.querySelector('#rn-template');
      const pos = inp.selectionStart ?? inp.value.length;
      inp.value = inp.value.slice(0, pos) + span.textContent + inp.value.slice(pos);
      inp.focus();
      ops.rename.template = inp.value;
    });
  });

  // Destination radios
  dlg.querySelectorAll('input[name="dest"]').forEach(r => r.addEventListener('change', e => { _destMode = e.target.value; }));
  dlg.querySelector('#dest-pick-btn')?.addEventListener('click', () => pickDestFolder(dlg));
}

// ── Source / destination folder pickers ──────────────────────────────────────

async function pickSourceFolder(dlg) {
  try {
    const dir = await window.showDirectoryPicker({ mode: 'read' });
    _sources = [];
    for await (const [name, handle] of dir.entries()) {
      if (handle.kind !== 'file') continue;
      const file = await handle.getFile();
      if (isSupportedFile(file)) _sources.push({ name, size: file.size, file, handle });
    }
    _sources.sort((a, b) => a.name.localeCompare(b.name, undefined, { numeric: true }));
    _sourceFolderHandle = dir;
    _sourceLabel = 'from current folder';
    _destMode = 'subfolder';
    render(dlg);
  } catch (err) {
    if (err.name !== 'AbortError') emit('error', { message: `Could not open folder: ${err.message}` });
  }
}

async function pickDestFolder(dlg) {
  try {
    _destFolderHandle = await window.showDirectoryPicker({ mode: 'readwrite' });
    _destMode = 'picked';
    render(dlg);
  } catch (err) {
    if (err.name !== 'AbortError') emit('error', { message: `Could not open folder: ${err.message}` });
  }
}

// ── Dry run ──────────────────────────────────────────────────────────────────

async function doDryRun(dlg) {
  if (!validateOpsEnabled(dlg)) return;
  const status = dlg.querySelector('#batch-status');
  status.textContent = 'Analysing…';

  const sample = _sources.slice(0, Math.min(20, _sources.length));
  const rows = [];
  const warnings = [];
  let missingDate = 0;
  let reformatted = 0;

  for (let i = 0; i < sample.length; i++) {
    const src = sample[i];
    const exif = await parseExif(src.file);
    if (ops.rename.enabled && ops.rename.template.includes('{date}') && !exif?.dateTimeOriginal) missingDate++;

    const outFmt = outputFormatFor(src.file, ops.convert);
    if (!ops.convert.enabled && outFmt !== formatOf(src.file)) reformatted++;

    const outName = await computeOutputName(src, i, exif, outFmt);
    rows.push({
      from: src.name,
      to: outName,
      fromSize: src.size,
      // rough estimate; not run through a full decode for speed
      estSize: estimateOutSize(src.size),
    });
  }
  if (missingDate > 0) warnings.push(`${missingDate} of ${sample.length} sampled files have no EXIF DateTimeOriginal — {date} will fall back to file mtime.`);
  if (reformatted > 0) warnings.push(`${reformatted} of ${sample.length} sampled files are in a format Slate can read but not write (HEIC, TIFF, RAW…) — they will be saved as lossless PNG. Enable Convert to choose JPEG or WebP instead.`);

  status.textContent = '';
  showDryRunResults(dlg, rows, warnings);
}

function showDryRunResults(dlg, rows, warnings) {
  const area = document.createElement('div');
  area.className = 'batch-dry-preview';
  area.innerHTML = `
    <h4>Dry run preview <span class="batch-muted">(first ${rows.length} of ${_sources.length})</span></h4>
    ${warnings.map(w => `<div class="batch-warning">⚠ ${esc(w)}</div>`).join('')}
    <table class="batch-table">
      <thead><tr><th>From</th><th>To</th><th>Size</th></tr></thead>
      <tbody>
        ${rows.map(r => `
          <tr>
            <td class="batch-cell-trunc">${esc(r.from)}</td>
            <td class="batch-cell-trunc">${esc(r.to)}</td>
            <td>${fmtBytes(r.fromSize)} → ~${fmtBytes(r.estSize)}</td>
          </tr>`).join('')}
      </tbody>
    </table>
  `;
  // Remove previous preview if any
  dlg.querySelector('.batch-dry-preview')?.remove();
  dlg.querySelector('.batch-body').appendChild(area);
}

// ── Run ──────────────────────────────────────────────────────────────────────

async function doRun(dlg) {
  if (!validateOpsEnabled(dlg)) return;
  if (_destMode === 'overwrite' && !await confirmAction({
    title: 'Overwrite source files?',
    message: 'Every selected original will be replaced. This cannot be undone.',
    confirmLabel: 'Overwrite files',
  })) return;

  _cancelled = false;

  let dest;
  try {
    dest = await resolveDestination();
  } catch (err) { emit('error', { message: `Destination error: ${err.message}` }); return; }

  showProgressView(dlg);
  const progressBar = dlg.querySelector('.batch-progress-bar-fill');
  const progressText = dlg.querySelector('.batch-progress-text');
  const cancelBtn = dlg.querySelector('[data-batch="cancel-run"]');
  cancelBtn?.addEventListener('click', () => { _cancelled = true; });

  // Worker pool: hardwareConcurrency − 1, clamped 2..8
  const poolSize = Math.max(2, Math.min(8, (navigator.hardwareConcurrency || 4) - 1));
  const pool = makeWorkerPool(poolSize);

  const results = { ok: 0, errors: [] };
  let done = 0;
  const snapshot = { ...ops, convert: { ...ops.convert }, resize: { ...ops.resize }, rotate: { ...ops.rotate }, flip: { ...ops.flip } };
  const queue = _sources.map((src, index) => ({ src, index }));

  const updateProgress = (src) => {
    const pct = Math.round((done / _sources.length) * 100);
    progressBar.style.width = pct + '%';
    progressText.textContent = `Processing ${done} / ${_sources.length} — ${src.name}`;
  };

  async function worker(w) {
    while (queue.length && !_cancelled) {
      const job = queue.shift();
      if (!job) break;
      updateProgress(job.src);
      try {
        // Parse EXIF + compute output name on main thread
        const exif = await parseExif(job.src.file);
        const outFmt = outputFormatFor(job.src.file, snapshot.convert);

        // Overwriting keeps the original filename, so the bytes have to match
        // the container that name claims. Refuse rather than write PNG data
        // into a .heic (or .tif, .cr2, .psd…) file.
        if (dest.mode === 'overwrite' && outFmt !== formatOf(job.src.file)) {
          throw new Error(`cannot overwrite a .${formatOf(job.src.file)} file with ${outFmt.toUpperCase()} data — write to a folder instead`);
        }

        const exifRaw = (!snapshot.convert.enabled || !snapshot.convert.stripExif) && outFmt === 'jpeg' ? exif?.raw : null;
        const outName = await computeOutputName(job.src, job.index, exif, outFmt);

        // Formats the worker cannot open are decoded here and transferred in.
        const needsMainThreadDecode = !WORKER_DECODABLE.has(formatOf(job.src.file));
        const bitmap = needsMainThreadDecode ? await decode(job.src.file) : null;

        // Send work to worker
        const blob = await dispatchWorker(w, {
          file:    bitmap ? null : job.src.file,
          bitmap,
          ops:     snapshot,
          outFmt,
          quality: snapshot.convert.enabled ? snapshot.convert.quality : 90,
          exifRaw,
        }, bitmap ? [bitmap] : []);
        await writeToDestination(dest, outName, blob, job.src);
        results.ok++;
      } catch (err) {
        results.errors.push({ name: job.src.name, message: err.message });
      } finally {
        done++;
        updateProgress(job.src);
      }
    }
  }

  await Promise.all(pool.map(w => worker(w)));
  pool.forEach(w => w.terminate());

  progressBar.style.width = '100%';
  showSummary(dlg, results);
}

// ── Worker pool ──────────────────────────────────────────────────────────────

function makeWorkerPool(size) {
  const blob = new Blob([WORKER_SRC], { type: 'application/javascript' });
  const url = URL.createObjectURL(blob);
  const workers = Array.from({ length: size }, () => {
    const w = new Worker(url);
    w._pending = new Map();
    w.addEventListener('message', (e) => {
      const { id, blob, error } = e.data;
      const pending = w._pending.get(id);
      if (!pending) return;
      w._pending.delete(id);
      if (error) pending.reject(new Error(error));
      else pending.resolve(blob);
    });
    return w;
  });
  setTimeout(() => URL.revokeObjectURL(url), 5000);
  return workers;
}

function dispatchWorker(w, payload, transfer = []) {
  return new Promise((resolve, reject) => {
    const id = Math.random().toString(36).slice(2);
    w._pending.set(id, { resolve, reject });
    w.postMessage({ id, ...payload }, transfer);
  });
}

// Worker script — inlined as a string so the single-file build stays single-file.
// Uses createImageBitmap + OffscreenCanvas + convertToBlob, all available in workers.
const WORKER_SRC = `
function rotateCanvas(src, deg) {
  const r = (deg % 360 + 360) % 360;
  const rad = r * Math.PI / 180;
  const sin = Math.abs(Math.sin(rad)), cos = Math.abs(Math.cos(rad));
  const w = Math.round(src.width * cos + src.height * sin);
  const h = Math.round(src.width * sin + src.height * cos);
  const out = new OffscreenCanvas(w, h);
  const ctx = out.getContext('2d');
  ctx.translate(w / 2, h / 2);
  ctx.rotate(rad);
  ctx.drawImage(src, -src.width / 2, -src.height / 2);
  return out;
}

function flipCanvas(src, axis) {
  const out = new OffscreenCanvas(src.width, src.height);
  const ctx = out.getContext('2d');
  if (axis === 'h') { ctx.translate(src.width, 0); ctx.scale(-1, 1); }
  else              { ctx.translate(0, src.height); ctx.scale(1, -1); }
  ctx.drawImage(src, 0, 0);
  return out;
}

function resizeCanvas(src, w, h) {
  const out = new OffscreenCanvas(w, h);
  const ctx = out.getContext('2d');
  ctx.imageSmoothingEnabled = true;
  ctx.imageSmoothingQuality = 'high';
  ctx.drawImage(src, 0, 0, w, h);
  return out;
}

async function encode(canvas, outFmt, quality, exifRaw) {
  if (outFmt === 'png')  return canvas.convertToBlob({ type: 'image/png' });
  if (outFmt === 'webp') return canvas.convertToBlob({ type: 'image/webp', quality: quality / 100 });
  // JPEG — flatten onto white first, then optionally re-inject raw EXIF
  const flat = new OffscreenCanvas(canvas.width, canvas.height);
  const fctx = flat.getContext('2d');
  fctx.fillStyle = '#ffffff';
  fctx.fillRect(0, 0, flat.width, flat.height);
  fctx.drawImage(canvas, 0, 0);
  const blob = await flat.convertToBlob({ type: 'image/jpeg', quality: quality / 100 });
  if (!exifRaw) return blob;
  const jpegBuf = await blob.arrayBuffer();
  const app1 = new Uint8Array(exifRaw);
  const rest = new Uint8Array(jpegBuf, 2);
  const merged = new Uint8Array(2 + app1.byteLength + rest.byteLength);
  merged[0] = 0xFF; merged[1] = 0xD8;
  merged.set(app1, 2);
  merged.set(rest, 2 + app1.byteLength);
  return new Blob([merged], { type: 'image/jpeg' });
}

self.onmessage = async (e) => {
  const { id, file, bitmap: preDecoded, ops, outFmt, quality, exifRaw } = e.data;
  try {
    // Exotic formats (HEIC, TIFF, JXL, PSD, RAW, TGA, DDS, SVG) arrive already
    // decoded from the main thread; everything else we open here.
    const bitmap = preDecoded ?? await createImageBitmap(file);
    let canvas = new OffscreenCanvas(bitmap.width, bitmap.height);
    canvas.getContext('2d').drawImage(bitmap, 0, 0);
    bitmap.close?.();

    if (ops.resize.enabled) {
      let tw, th;
      if (ops.resize.mode === 'pct') {
        tw = Math.max(1, Math.round(canvas.width  * ops.resize.w / 100));
        th = Math.max(1, Math.round(canvas.height * ops.resize.h / 100));
      } else {
        tw = ops.resize.w; th = ops.resize.h;
        if (ops.resize.lockAspect) {
          const ar = canvas.width / canvas.height;
          if (tw / th > ar) tw = Math.round(th * ar);
          else th = Math.round(tw / ar);
        }
      }
      canvas = resizeCanvas(canvas, tw, th);
    }
    if (ops.rotate.enabled) canvas = rotateCanvas(canvas, ops.rotate.deg);
    if (ops.flip.enabled)   canvas = flipCanvas(canvas, ops.flip.axis);

    const blob = await encode(canvas, outFmt, quality, exifRaw);
    self.postMessage({ id, blob });
  } catch (err) {
    self.postMessage({ id, error: err.message });
  }
};
`;

async function writeToDestination(dest, name, blob, src) {
  if (dest.mode === 'overwrite') {
    if (!src.handle) throw new Error('No file handle for overwrite');
    const w = await src.handle.createWritable();
    await w.write(blob); await w.close();
    return;
  }
  // Resolve a unique name within dest.folder
  let unique = name;
  let counter = 1;
  while (true) {
    try {
      await dest.folder.getFileHandle(unique);
      const dot = name.lastIndexOf('.');
      const base = dot >= 0 ? name.slice(0, dot) : name;
      const ext = dot >= 0 ? name.slice(dot) : '';
      unique = `${base}-${counter}${ext}`;
      counter++;
    } catch { break; }
  }
  const h = await dest.folder.getFileHandle(unique, { create: true });
  const w = await h.createWritable();
  await w.write(blob); await w.close();
}

async function resolveDestination() {
  if (_destMode === 'overwrite') return { mode: 'overwrite' };
  if (_destMode === 'subfolder') {
    if (!_sourceFolderHandle) throw new Error('No source folder to create subfolder in');
    const sub = await _sourceFolderHandle.getDirectoryHandle('batch-output', { create: true });
    return { mode: 'folder', folder: sub };
  }
  if (!_destFolderHandle) throw new Error('Pick a destination folder');
  return { mode: 'folder', folder: _destFolderHandle };
}

// ── Rename template ──────────────────────────────────────────────────────────

async function computeOutputName(src, index, exif, outFmt) {
  const ext = outFmt ? (outFmt === 'jpeg' ? 'jpg' : outFmt)
                     : src.name.slice((src.name.lastIndexOf('.') + 1) || src.name.length);
  const baseOriginal = src.name.replace(/\.[^.]+$/, '');

  // If rename disabled: keep original base, but use new ext if converting
  if (!ops.rename.enabled) return `${baseOriginal}.${ext}`;

  const templ = ops.rename.template || '{original}';
  const dateStr = (() => {
    const d = exif?.dateTimeOriginal;
    if (d && typeof d === 'string') {
      const m = d.match(/^(\d{4}).(\d{2}).(\d{2})/);
      if (m) return `${m[1]}-${m[2]}-${m[3]}`;
    }
    // fallback: file.lastModified
    try {
      const ts = src.file?.lastModified ?? Date.now();
      const dt = new Date(ts);
      return `${dt.getFullYear()}-${String(dt.getMonth()+1).padStart(2,'0')}-${String(dt.getDate()).padStart(2,'0')}`;
    } catch { return ''; }
  })();
  const cam = [exif?.make, exif?.model].filter(Boolean).join(' ').trim();

  const safe = (s) => String(s ?? '').replace(/[<>:"/\\|?*\x00-\x1f]/g, '_');

  const name = templ
    .replace(/\{original\}/g, safe(baseOriginal))
    .replace(/\{index\}/g, String(index + 1))
    .replace(/\{counter:(\d+)\}/g, (_, n) => String(index + 1).padStart(+n, '0'))
    .replace(/\{date\}/g, safe(dateStr))
    .replace(/\{camera\}/g, safe(cam))
    .replace(/\{w\}/g, '')  // filled during processOne if needed — skipped for dry-run simplicity
    .replace(/\{h\}/g, '');

  return `${name || baseOriginal}.${ext}`;
}

// ── Progress view & summary ──────────────────────────────────────────────────

function showProgressView(dlg) {
  dlg.innerHTML = `
    <div class="modal-header">
      <h2>Running batch</h2>
    </div>
    <div class="batch-body">
      <div class="batch-progress">
        <div class="batch-progress-bar"><div class="batch-progress-bar-fill"></div></div>
        <div class="batch-progress-text">Starting…</div>

// ── Playback ─────────────────────────────────────────────────────────────────

function start() {

function stop() {

  _active = false;

  clearTimeout(_idleTimer);

  document.removeEventListener('mousemove', onMouseMove);
  document.removeEventListener('fullscreenchange', onFullscreenChange);

  document.getElementById('app')?.classList.remove('slideshow-active');
  if (document.fullscreenElement) document.exitFullscreen?.().catch(() => {});

  if (canvas) { canvas.style.transition = ''; canvas.style.opacity = ''; canvas.style.transform = ''; }

  destroyHUD();
}

function scheduleNext() {
  clearTimeout(_timer);
  if (_paused || !_active) return;
  _timer = setTimeout(advance, settings.interval * 1000);
}

async function advance(direction = 1) {
  if (!_active) return;
  clearTimeout(_timer);

  const files = state.session.files;
  if (!files.length) { stop(); return; }

  // Choose next target
  let nextIndex;
  if (settings.shuffle) {
    _shuffleIndex = (_shuffleIndex + direction + _shuffleOrder.length) % _shuffleOrder.length;
    if (_shuffleIndex === 0 && direction > 0 && !settings.loop) { stop(); return; }
    nextIndex = _shuffleOrder[_shuffleIndex];
  } else {
    const { currentIndex } = state.session;
    nextIndex = currentIndex + direction;
    if (nextIndex >= files.length) {
      if (!settings.loop) { stop(); return; }
      nextIndex = 0;
    } else if (nextIndex < 0) {
      nextIndex = settings.loop ? files.length - 1 : 0;
    }
  }

  await playTransition(async () => { await navigateTo(nextIndex); });
  updateHUDInfo();
  scheduleNext();
}

async function playTransition(navigateFn) {
  const canvas = document.getElementById('main-canvas');
  if (!canvas) { await navigateFn(); return; }

  if (settings.transition === 'none') {
    await navigateFn();
    return;
  }

  if (settings.transition === 'fade') {
    canvas.style.transition = 'opacity 240ms ease';
    canvas.style.opacity = '0';
    await wait(240);
    await navigateFn();
    canvas.style.opacity = '1';
    return;
  }

  if (settings.transition === 'slide') {
    canvas.style.transition = 'transform 280ms ease, opacity 280ms ease';
    canvas.style.transform = 'translateX(-8%)';
    canvas.style.opacity = '0';
    await wait(280);
    canvas.style.transition = 'none';
    canvas.style.transform = 'translateX(8%)';
    await navigateFn();
    await raf();
    canvas.style.transition = 'transform 280ms ease, opacity 280ms ease';
    canvas.style.transform = 'translateX(0)';
    canvas.style.opacity = '1';

    const j = Math.floor(Math.random() * (i + 1));
    [_shuffleOrder[i], _shuffleOrder[j]] = [_shuffleOrder[j], _shuffleOrder[i]];

  // Put the currently displayed image first so the user sees it before we advance
  const cur = state.session.currentIndex;
  const pos = _shuffleOrder.indexOf(cur);

  const ow = Math.max(1, Math.round(w));

const __m_ops_rotate = (() => {
async function apply(canvas, { deg }) {

  const W = canvas.width, H = canvas.height;
  const cos = Math.abs(Math.cos(rad));
  const sin = Math.abs(Math.sin(rad));
  const outW = Math.round(W * cos + H * sin);
  const outH = Math.round(W * sin + H * cos);
  const out = new OffscreenCanvas(outW, outH);
  const ctx = out.getContext('2d');
  ctx.translate(outW / 2, outH / 2);
  ctx.rotate(rad);
  ctx.drawImage(canvas, -W / 2, -H / 2);
  return out;
}

})();

  const pad = Math.ceil(strength * 1.5); // avoid hard edge at boundary

  const out = new OffscreenCanvas(canvas.width, canvas.height);
  const ctx = out.getContext('2d');
  ctx.drawImage(canvas, 0, 0);

  // Render blurred region (with padding for bloom) into a temp canvas

const __m_ops_pixelate = (() => {
// Pixelate a rectangular region by averaging colour in size×size blocks.
// Different visual signature from blur — useful for hiding faces / text where
// "this is intentionally hidden" should read clearly.

async function apply(canvas, { x, y, w, h, size = 12 }) {
  const out = new OffscreenCanvas(canvas.width, canvas.height);
  const ctx = out.getContext('2d');
  ctx.drawImage(canvas, 0, 0);

  const rx = Math.max(0, Math.round(x));
  const ry = Math.max(0, Math.round(y));
  const rw = Math.min(canvas.width  - rx, Math.round(w));
  const rh = Math.min(canvas.height - ry, Math.round(h));
  if (rw <= 0 || rh <= 0) return out;

  const block = Math.max(2, Math.round(size));
  const id = ctx.getImageData(rx, ry, rw, rh);
  const d  = id.data;

  for (let by = 0; by < rh; by += block) {
    for (let bx = 0; bx < rw; bx += block) {
      const bw = Math.min(block, rw - bx);
      const bh = Math.min(block, rh - by);

      // Average channel values across the block
      let r = 0, g = 0, bb = 0, a = 0, n = 0;
      for (let py = 0; py < bh; py++) {
        for (let px = 0; px < bw; px++) {
          const i = ((by + py) * rw + (bx + px)) * 4;
          r += d[i]; g += d[i + 1]; bb += d[i + 2]; a += d[i + 3];
          n++;
        }
      }
      r = r / n | 0; g = g / n | 0; bb = bb / n | 0; a = a / n | 0;

      // Fill the block with the averaged colour
      for (let py = 0; py < bh; py++) {
        for (let px = 0; px < bw; px++) {
          const i = ((by + py) * rw + (bx + px)) * 4;
          d[i] = r; d[i + 1] = g; d[i + 2] = bb; d[i + 3] = a;
        }
      }
    }
  }
  ctx.putImageData(id, rx, ry);
  return out;
}

return { apply };
})();

// WebGPU fast path for brightness / contrast / saturation adjustment.
// Falls back silently — callers should catch and use the CPU path.

let _device = null;

function isWebGPUAvailable() {
  return typeof navigator !== 'undefined' && !!navigator.gpu;
}

async function getDevice() {
  if (_device) return _device;
  if (!navigator.gpu) throw new Error('WebGPU not available');
  const adapter = await navigator.gpu.requestAdapter();
  if (!adapter) throw new Error('No GPU adapter');
  _device = await adapter.requestDevice();
  return _device;
}

const WGSL = `
struct Params {
  brightness: f32,
  contrast: f32,
  saturation: f32,
  _pad: f32,
};

@group(0) @binding(0) var inputTex:  texture_2d<f32>;
@group(0) @binding(1) var outputTex: texture_storage_2d<rgba8unorm, write>;
@group(0) @binding(2) var<uniform> params: Params;

@compute @workgroup_size(8, 8)
fn main(@builtin(global_invocation_id) id: vec3<u32>) {
  let dims = textureDimensions(inputTex);
  if (id.x >= dims.x || id.y >= dims.y) { return; }

  let src = textureLoad(inputTex, vec2<i32>(i32(id.x), i32(id.y)), 0);
  var c = src.rgb;

  // Brightness: add offset in 0..1 space (params.brightness is in -100..100 normalised by caller to ±100/255)
  c = c + vec3<f32>(params.brightness);

  // Contrast: standard formula normalised. cf = (259(C+255)) / (255(259-C)) where C ∈ [-255,255].
  // params.contrast passes cf directly to avoid recomputing per-pixel on the GPU.
  c = (c - vec3<f32>(0.5)) * params.contrast + vec3<f32>(0.5);

  // Saturation: luminosity (Rec.709) + interpolation.
  let lum = dot(c, vec3<f32>(0.2126, 0.7152, 0.0722));
  let satF = 1.0 + params.saturation;
  c = vec3<f32>(lum) + (c - vec3<f32>(lum)) * satF;

  c = clamp(c, vec3<f32>(0.0), vec3<f32>(1.0));
  textureStore(outputTex, vec2<i32>(i32(id.x), i32(id.y)), vec4<f32>(c, src.a));
}
`;

async function applyAdjust(canvas, { brightness = 0, contrast = 0, saturation = 0 }) {
  const device = await getDevice();
  const W = canvas.width, H = canvas.height;

  // Read source pixels as Uint8 for GPU upload
  const srcCtx = canvas.getContext('2d');
  const srcImage = srcCtx.getImageData(0, 0, W, H);

  const inputTex = device.createTexture({
    size: [W, H, 1],
    format: 'rgba8unorm',
    usage: GPUTextureUsage.COPY_DST | GPUTextureUsage.TEXTURE_BINDING,
  });
  device.queue.writeTexture(
    { texture: inputTex },
    srcImage.data,
    { bytesPerRow: W * 4 },
    [W, H, 1]
  );

  const outputTex = device.createTexture({
    size: [W, H, 1],
    format: 'rgba8unorm',
    usage: GPUTextureUsage.STORAGE_BINDING | GPUTextureUsage.COPY_SRC,
  });

  // Precompute contrast factor on CPU, ship as uniform (single value).
  const cf = contrast !== 0
    ? (259 * (contrast + 255)) / (255 * (259 - contrast))
    : 1;

  const paramsBuf = device.createBuffer({
    size: 16,
    usage: GPUBufferUsage.UNIFORM | GPUBufferUsage.COPY_DST,
  });
  device.queue.writeBuffer(paramsBuf, 0, new Float32Array([
    brightness / 255,
    cf,
    saturation / 100,
    0,
  ]));

  const shader = device.createShaderModule({ code: WGSL });
  const pipeline = device.createComputePipeline({
    layout: 'auto',
    compute: { module: shader, entryPoint: 'main' },
  });

  const bindGroup = device.createBindGroup({
    layout: pipeline.getBindGroupLayout(0),
    entries: [
      { binding: 0, resource: inputTex.createView() },
      { binding: 1, resource: outputTex.createView() },
      { binding: 2, resource: { buffer: paramsBuf } },
    ],
  });

  const encoder = device.createCommandEncoder();
  const pass = encoder.beginComputePass();
  pass.setPipeline(pipeline);
  pass.setBindGroup(0, bindGroup);
  pass.dispatchWorkgroups(Math.ceil(W / 8), Math.ceil(H / 8));
  pass.end();

  // Copy output texture to a readback buffer (row-stride aligned to 256)
  const bytesPerRow = Math.ceil((W * 4) / 256) * 256;
  const readBuf = device.createBuffer({
    size: bytesPerRow * H,
    usage: GPUBufferUsage.COPY_DST | GPUBufferUsage.MAP_READ,
  });
  encoder.copyTextureToBuffer(
    { texture: outputTex },
    { buffer: readBuf, bytesPerRow },
    [W, H, 1]
  );
  device.queue.submit([encoder.finish()]);

  await readBuf.mapAsync(GPUMapMode.READ);
  const aligned = new Uint8Array(readBuf.getMappedRange());

  // Re-pack rows into a tight Uint8ClampedArray for putImageData
  const out = new Uint8ClampedArray(W * H * 4);
  for (let y = 0; y < H; y++) {
    out.set(aligned.subarray(y * bytesPerRow, y * bytesPerRow + W * 4), y * W * 4);
  }
  readBuf.unmap();

  const outCanvas = new OffscreenCanvas(W, H);
  const outImage = new ImageData(out, W, H);
  outCanvas.getContext('2d').putImageData(outImage, 0, 0);

  inputTex.destroy();
  outputTex.destroy();
  paramsBuf.destroy();
  readBuf.destroy();

  return outCanvas;
}

return { isWebGPUAvailable, applyAdjust };
})();

const __m_ops_adjust = (() => {
const isWebGPUAvailable = __m_gpu_adjust.isWebGPUAvailable;
const applyAdjustGPU = __m_gpu_adjust.applyAdjust;

// Use GPU path above this many pixels — CPU is usually faster below.
const GPU_MIN_PIXELS = 1_000_000;

// brightness: -100..+100 (pixel offset)
// contrast:   -100..+100 (standard formula)
// saturation: -100..+200 (percent delta)
async function apply(canvas, params) {
  const { width: W, height: H } = canvas;
  const { brightness = 0, contrast = 0, saturation = 0 } = params;

  if (isWebGPUAvailable() && W * H >= GPU_MIN_PIXELS) {
    try {
      return await applyAdjustGPU(canvas, { brightness, contrast, saturation });
    } catch (err) {
      console.warn('WebGPU adjust failed, falling back to CPU:', err.message);
    }
  }

  return applyAdjustCPU(canvas, { brightness, contrast, saturation });
}

async function applyAdjustCPU(canvas, { brightness, contrast, saturation }) {
  const { width: W, height: H } = canvas;
  const src = canvas.getContext('2d').getImageData(0, 0, W, H);
  const d = src.data;

  const cf = contrast !== 0
    ? (259 * (contrast + 255)) / (255 * (259 - contrast))
    : 1;

  for (let i = 0; i < d.length; i += 4) {
    let r = d[i], g = d[i+1], b = d[i+2];

    // Brightness
    r += brightness; g += brightness; b += brightness;

    // Contrast
    if (contrast !== 0) {
      r = cf * (r - 128) + 128;
      g = cf * (g - 128) + 128;
      b = cf * (b - 128) + 128;
    }

    // Saturation via luminosity
    if (saturation !== 0) {
      const lum = 0.2126 * r + 0.7152 * g + 0.0722 * b;
      const f = 1 + saturation / 100;
      r = lum + (r - lum) * f;
      g = lum + (g - lum) * f;
      b = lum + (b - lum) * f;
    }

    d[i]   = Math.max(0, Math.min(255, r));
    d[i+1] = Math.max(0, Math.min(255, g));
    d[i+2] = Math.max(0, Math.min(255, b));
  }

  const out = new OffscreenCanvas(W, H);
  out.getContext('2d').putImageData(src, 0, 0);
  return out;
}

return { apply };
})();

const __m_ops_sharpen = (() => {
// amount: 0..5, typical 1.0
async function apply(canvas, { amount = 1.0 }) {

  const blurCtx = blurCanvas.getContext('2d');
  blurCtx.filter = 'blur(1px)';
  blurCtx.drawImage(canvas, 0, 0);

  const src     = canvas.getContext('2d').getImageData(0, 0, W, H);
  const blurred = blurCtx.getImageData(0, 0, W, H);

  const out = new OffscreenCanvas(W, H);
  const outData = out.getContext('2d').createImageData(W, H);
  const od = outData.data;

  for (let i = 0; i < src.data.length; i += 4) {
    for (let c = 0; c < 3; c++) {
      od[i+c] = Math.max(0, Math.min(255,
        src.data[i+c] + amount * (src.data[i+c] - blurred.data[i+c])
      ));
    }
    od[i+3] = src.data[i+3];
  }

  out.getContext('2d').putImageData(outData, 0, 0);
  return out;

})();

  if (state.activeTool !== 'pencil' || !_pencilPoints || _pencilPoints.length < 2) return;
  const { pencil } = state.toolSettings;
  const toC = (ix, iy) => ({ x: ix * zoom + pan.x, y: iy * zoom + pan.y });

  ctx.save();
  ctx.strokeStyle = pencil.color;
  ctx.lineWidth = pencil.thickness * zoom;
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';
  ctx.globalAlpha = 0.92;

  ctx.beginPath();
  const first = toC(_pencilPoints[0].x, _pencilPoints[0].y);
  ctx.moveTo(first.x, first.y);
  if (_pencilPoints.length === 2) {
    const p = toC(_pencilPoints[1].x, _pencilPoints[1].y);
    ctx.lineTo(p.x, p.y);
  } else {
    for (let i = 1; i < _pencilPoints.length - 1; i++) {
      const p  = toC(_pencilPoints[i].x, _pencilPoints[i].y);
      const pn = toC(_pencilPoints[i + 1].x, _pencilPoints[i + 1].y);
      ctx.quadraticCurveTo(p.x, p.y, (p.x + pn.x) / 2, (p.y + pn.y) / 2);
    }
    const last = toC(_pencilPoints[_pencilPoints.length - 1].x, _pencilPoints[_pencilPoints.length - 1].y);
    ctx.lineTo(last.x, last.y);
  }
  ctx.stroke();
  ctx.restore();
}

// ── Shape live preview ─────────────────────────────────────────────────────────

function drawShapePreview({ ctx, zoom, pan }) {
  if (state.activeTool !== 'shape' || !_shapeStart || !_shapeCurrent) return;
  const { shape } = state.toolSettings;
  const toC = (ix, iy) => ({ x: ix * zoom + pan.x, y: iy * zoom + pan.y });
  const a = toC(_shapeStart.x, _shapeStart.y);
  const b = toC(_shapeCurrent.x, _shapeCurrent.y);

  ctx.save();
  ctx.strokeStyle = shape.color;
  ctx.fillStyle   = shape.color;
  ctx.lineWidth   = shape.thickness * zoom;
  ctx.lineCap     = 'round';
  ctx.lineJoin    = 'round';
  ctx.globalAlpha = 0.85;

  if (shape.mode === 'rect') {
    const x = Math.min(a.x, b.x), y = Math.min(a.y, b.y);
    const w = Math.abs(b.x - a.x), h = Math.abs(b.y - a.y);
    if (shape.fill) ctx.fillRect(x, y, w, h);
    ctx.strokeRect(x, y, w, h);
  } else if (shape.mode === 'circle') {
    const cx = (a.x + b.x) / 2, cy = (a.y + b.y) / 2;
    const rx = Math.abs(b.x - a.x) / 2, ry = Math.abs(b.y - a.y) / 2;
    ctx.beginPath();
    ctx.ellipse(cx, cy, rx, ry, 0, 0, Math.PI * 2);
    if (shape.fill) ctx.fill();
    ctx.stroke();
  } else if (shape.mode === 'line') {
    ctx.beginPath();
    ctx.moveTo(a.x, a.y);
    ctx.lineTo(b.x, b.y);
    ctx.stroke();
  }
  ctx.restore();
}

// ── Contact sheet build ──────────────────────────────────────────────────────

async function buildContactSheet(files, onProgress) {
  const cols = cfg.cols;
  const rows = Math.ceil(files.length / cols);
  const thumbW = cfg.thumbSize;
  const thumbH = Math.round(thumbW * 0.75); // 4:3 cell
  const labelH = cfg.showLabels ? 20 : 0;
  const pad = 8;
  const cellW = thumbW + pad;
  const cellH = thumbH + labelH + pad;
  const outW = cols * cellW + pad;
  const outH = rows * cellH + pad;

  const canvas = new OffscreenCanvas(outW, outH);
  const ctx = canvas.getContext('2d');
  ctx.fillStyle = cfg.bg;
  ctx.fillRect(0, 0, outW, outH);

  ctx.font = '10px -apple-system, sans-serif';
  ctx.textBaseline = 'top';

  for (let i = 0; i < files.length; i++) {
    const file = files[i].file ?? (files[i].handle ? await files[i].handle.getFile() : null);
    if (!file) continue;

    const row = Math.floor(i / cols);
    const col = i % cols;
    const x = pad + col * cellW;
    const y = pad + row * cellH;

    try {
      const bitmap = await createImageBitmap(file);
      // Cover-fit the thumb into thumbW × thumbH
      const sRatio = bitmap.width / bitmap.height;
      const tRatio = thumbW / thumbH;
      let sx = 0, sy = 0, sw = bitmap.width, sh = bitmap.height;
      if (sRatio > tRatio) {
        // wider source: crop horizontally
        sw = bitmap.height * tRatio;
        sx = (bitmap.width - sw) / 2;
      } else {
        sh = bitmap.width / tRatio;
        sy = (bitmap.height - sh) / 2;
      }
      ctx.drawImage(bitmap, sx, sy, sw, sh, x, y, thumbW, thumbH);
      bitmap.close?.();
    } catch {
      ctx.fillStyle = '#444';
      ctx.fillRect(x, y, thumbW, thumbH);
    }

    if (cfg.showLabels) {
      ctx.fillStyle = pickReadable(cfg.bg);
      const label = files[i].name.length > 32 ? files[i].name.slice(0, 30) + '…' : files[i].name;
      ctx.fillText(label, x + 4, y + thumbH + 4);
    }
    onProgress(i + 1, files.length);
  }

  return canvas.convertToBlob({
    type: cfg.sheetFormat === 'jpeg' ? 'image/jpeg' : 'image/png',
    quality: 0.9
  });
}

// ── Helpers ──────────────────────────────────────────────────────────────────

async function thumbToDataUrl(bitmap, maxSize, type, quality) {
  const scale = Math.min(maxSize / bitmap.width, maxSize / bitmap.height, 1);
  const w = Math.round(bitmap.width * scale);
  const h = Math.round(bitmap.height * scale);
  const c = new OffscreenCanvas(w, h);
  const ctx = c.getContext('2d');
  ctx.imageSmoothingQuality = 'high';
  ctx.drawImage(bitmap, 0, 0, w, h);
  const blob = await c.convertToBlob({ type, quality });
  return blobToDataUrl(blob);
}

function blobToDataUrl(blob) {
  return new Promise((res, rej) => {
    const r = new FileReader();
    r.onload = () => res(r.result);
    r.onerror = () => rej(new Error('read failed'));
    r.readAsDataURL(blob);
  });
}

function pickReadable(bg) {

  const { r, g, b } = hexToRgb(bg);

  return lum > 0.55 ? '#111' : '#fafafa';
}

  const lum = (0.299 * r + 0.587 * g + 0.114 * b) / 255;
  return lum > 0.55 ? 'rgba(0,0,0,.12)' : 'rgba(255,255,255,.12)';
}
function hexToRgb(hex) {
  const s = hex.replace('#', '');
  const h = s.length === 3 ? s.split('').map(c => c + c).join('') : s;
  return { r: parseInt(h.slice(0, 2), 16), g: parseInt(h.slice(2, 4), 16), b: parseInt(h.slice(4, 6), 16) };

const __m_ops_jpeg_lossless = (() => {
// Lossless JPEG rotate via EXIF orientation manipulation.
// The pixel bytes are untouched — we only flip the orientation tag.
// Works in any viewer that honours EXIF orientation (most do).

// CW rotation sequence for non-flipped orientations
const CW_NORMAL  = [1, 6, 3, 8];
// Same sequence for flipped orientations
const CW_FLIPPED = [2, 5, 4, 7];

function computeNewOrientation(current, cwTurns) {
  const t = ((cwTurns % 4) + 4) % 4;
  const i = CW_NORMAL.indexOf(current);
  if (i !== -1) return CW_NORMAL[(i + t) % 4];
  const fi = CW_FLIPPED.indexOf(current);
  if (fi !== -1) return CW_FLIPPED[(fi + t) % 4];
  return current;
}

// Returns a new Blob with the rotated orientation tag.
// cwTurns: 1 = 90° CW, 2 = 180°, 3 = 90° CCW
async function rotateJpegLossless(blob, cwTurns) {
  if (blob.type && blob.type !== 'image/jpeg') throw new Error('Not a JPEG');
  const buf = new Uint8Array(await blob.arrayBuffer());
  const view = new DataView(buf.buffer, buf.byteOffset, buf.byteLength);
  if (view.getUint16(0) !== 0xFFD8) throw new Error('Not a JPEG (missing SOI marker)');

  // Walk APP0-APP15 segments looking for EXIF APP1
  let offset = 2;
  while (offset < buf.length - 2) {
    const marker = view.getUint16(offset);
    if (marker === 0xFFDA) break; // SOS — no more metadata
    if (marker < 0xFFE0 || marker > 0xFFEF) {
      // Not an APP marker; move past it if it has a length
      const segLen = view.getUint16(offset + 2);
      offset += 2 + segLen;
      continue;
    }
    const segLen = view.getUint16(offset + 2);
    if (marker === 0xFFE1 &&
        view.getUint32(offset + 4) === 0x45786966 &&
        view.getUint16(offset + 8) === 0x0000) {
      // EXIF APP1 found — locate orientation tag (0x0112) in IFD0
      const tiffStart = offset + 10;
      const byteOrder = view.getUint16(tiffStart);
      if (byteOrder !== 0x4949 && byteOrder !== 0x4D4D) throw new Error('Invalid TIFF byte order');
      const le = byteOrder === 0x4949;
      if (view.getUint16(tiffStart + 2, le) !== 42) throw new Error('Invalid TIFF magic');
      const ifd0Off = tiffStart + view.getUint32(tiffStart + 4, le);
      const count = view.getUint16(ifd0Off, le);
      for (let i = 0; i < count; i++) {
        const entryOff = ifd0Off + 2 + i * 12;
        if (view.getUint16(entryOff, le) === 0x0112) {
          // Orientation entry: value is inline at entryOff + 8 (type SHORT, count 1)
          const current = view.getUint16(entryOff + 8, le);
          const next = computeNewOrientation(current, cwTurns);
          // Return a copy with the new value
          const out = new Uint8Array(buf);
          const outView = new DataView(out.buffer);
          outView.setUint16(entryOff + 8, next, le);
          return new Blob([out], { type: 'image/jpeg' });
        }
      }
      // APP1 exists but no orientation tag — inject one
      return insertOrientationInExif(buf, offset, segLen, tiffStart, computeNewOrientation(1, cwTurns));
    }
    offset += 2 + segLen;
  }

  // No EXIF segment at all — inject a minimal one
  return injectMinimalExif(buf, computeNewOrientation(1, cwTurns));
}

// Build a minimal APP1 EXIF segment containing just orientation = `ori`.
// Little-endian TIFF, IFD0 with 1 entry, orientation (0x0112 / SHORT / count=1 / value).
function buildMinimalExifSegment(ori) {
  const tiffLen = 8 /*header*/ + 2 /*count*/ + 12 /*entry*/ + 4 /*next IFD*/;
  const segLen  = 2 /*length field*/ + 6 /*Exif\0\0*/ + tiffLen;
  const segBuf  = new Uint8Array(2 + segLen);
  const dv      = new DataView(segBuf.buffer);
  let p = 0;
  dv.setUint16(p, 0xFFE1);                              p += 2; // APP1 marker
  dv.setUint16(p, segLen);                              p += 2; // length (excludes marker)
  new Uint8Array(segBuf.buffer, p, 6).set([0x45,0x78,0x69,0x66,0x00,0x00]); p += 6; // "Exif\0\0"
  const tiffStart = p;
  dv.setUint16(p, 0x4949);                              p += 2; // II (little-endian)
  dv.setUint16(p, 42, true);                            p += 2;
  dv.setUint32(p, 8, true);                             p += 4; // IFD0 offset (from tiffStart)
  dv.setUint16(p, 1, true);                             p += 2; // entry count
  dv.setUint16(p, 0x0112, true);                        p += 2; // tag
  dv.setUint16(p, 3, true);                             p += 2; // type SHORT
  dv.setUint32(p, 1, true);                             p += 4; // count
  dv.setUint16(p, ori, true);                           p += 2; // value
  dv.setUint16(p, 0, true);                             p += 2; // padding to 4 bytes
  dv.setUint32(p, 0, true);                             p += 4; // next IFD offset (none)
  return segBuf;
}

function injectMinimalExif(buf, ori) {
  const seg = buildMinimalExifSegment(ori);
  const out = new Uint8Array(2 + seg.length + (buf.length - 2));
  out[0] = 0xFF; out[1] = 0xD8;
  out.set(seg, 2);
  out.set(buf.subarray(2), 2 + seg.length);
  return new Blob([out], { type: 'image/jpeg' });
}

// Replace the existing APP1 segment with a version that has the orientation tag added.
// This is rare: only fires when EXIF exists but lacks orientation. For simplicity we
// swap it for a minimal EXIF rather than splicing into the old IFD.
function insertOrientationInExif(buf, segStart, oldSegLen, _tiffStart, ori) {
  const seg = buildMinimalExifSegment(ori);
  const before = buf.subarray(0, segStart);
  const after  = buf.subarray(segStart + 2 + oldSegLen);
  const out = new Uint8Array(before.length + seg.length + after.length);
  out.set(before, 0);
  out.set(seg, before.length);
  out.set(after, before.length + seg.length);
  return new Blob([out], { type: 'image/jpeg' });
}

return { computeNewOrientation, rotateJpegLossless };
})();

const __m_core_session = (() => {
const DB_NAME  = 'slate.v1';
const DB_VER   = 1;
const STORE    = 'sessions';

let _db = null;

async function getDb() {
  if (_db) return _db;
  return new Promise((resolve, reject) => {
    const req = indexedDB.open(DB_NAME, DB_VER);
    req.onupgradeneeded = () => req.result.createObjectStore(STORE);
    req.onsuccess = () => { _db = req.result; resolve(_db); };
    req.onerror   = () => reject(req.error);
  });
}

async function saveSession(data) {
  try {
    const db = await getDb();
    await new Promise((res, rej) => {
      const tx = db.transaction(STORE, 'readwrite');
      tx.objectStore(STORE).put(data, 'current');
      tx.oncomplete = res; tx.onerror = rej;
    });
  } catch {}
}

async function loadSession() {
  try {
    const db = await getDb();
    return await new Promise((res) => {
      const tx = db.transaction(STORE, 'readonly');
      const req = tx.objectStore(STORE).get('current');
      req.onsuccess = () => res(req.result ?? null);
      req.onerror   = () => res(null);
    });
  } catch { return null; }
}

async function clearSession() {
  try {
    const db = await getDb();
    await new Promise((res) => {
      const tx = db.transaction(STORE, 'readwrite');
      tx.objectStore(STORE).delete('current');
      tx.oncomplete = res; tx.onerror = res;
    });
  } catch {}
}

return { saveSession, loadSession, clearSession };
})();

  const out = new OffscreenCanvas(canvas.width, canvas.height);
  const ctx = out.getContext('2d');
  ctx.fillStyle = '#ffffff';
  ctx.fillRect(0, 0, out.width, out.height);
  ctx.drawImage(canvas, 0, 0);

  merged[0] = 0xFF; merged[1] = 0xD8;       // SOI
  merged.set(app1, 2);
  merged.set(rest, 2 + app1.byteLength);
  return new Blob([merged], { type: 'image/jpeg' });

})();

      emit('toast', { message: `Large image (${mp.toFixed(0)}MP). Consider resizing first.`, level: 'warn', duration: 6000 });
    } else if (mp > 50) {
      emit('toast', { message: `Large image (${mp.toFixed(0)}MP). May be slow on this device.`, level: 'warn', duration: 4000 });
    }
  });

  on('selection:clear', () => clearSelection());
  on('fit:window', () => fitToWindow());

  on('tool:changed', ({ tool }) => {
    showPanel(tool === 'crop');
    const canvas = document.getElementById('main-canvas');
    if (canvas) {
      const cursors = { crop: 'crosshair', redact: 'crosshair', blur: 'crosshair', pixelate: 'crosshair', text: 'text', arrow: 'crosshair', pencil: 'crosshair', shape: 'crosshair', eyedropper: 'copy' };
      canvas.style.cursor = tool ? (cursors[tool] ?? 'default') : '';
    }
  });

  // FSA fallback banner
  if (!hasFSA) {
    showFallbackBanner();
  }

  updateVersion();

  // Photo library (src/library/). A failure here leaves the editor working.
  try { await initLibrary(); }
  catch (err) { console.error('[slate library] failed to start', err); emit('toast', { message: `Photo library could not start: ${err.message}`, level: 'warn' }); }
}

function updateVersion() {
  const footer = document.getElementById('app-version');
  if (footer) footer.textContent = 'Slate v2.0.0';
}

// ── Empty state ───────────────────────────────────────────────────────────────

    <div class="dropzone" id="dropzone">
      <div class="dropzone-icon">
        <svg class="icon" style="width:48px;height:48px;opacity:0.4" aria-hidden="true"><use href="#icon-file"/></svg>
      </div>
      <h2>Drop an image to get started</h2>
      <p>Open any image to crop, redact, annotate, and export — nothing leaves your browser.</p>
      <div class="dropzone-actions">
        <button class="btn btn-primary" id="dz-open-file">
          <svg class="icon icon-sm" aria-hidden="true"><use href="#icon-file"/></svg>
          Open File
        </button>
        <button class="btn" id="dz-open-folder">
          <svg class="icon icon-sm" aria-hidden="true"><use href="#icon-folder"/></svg>
          Open Folder
        </button>
        <button class="btn" id="dz-paste">
          <svg class="icon icon-sm" aria-hidden="true"><use href="#icon-clipboard"/></svg>
          Paste
        </button>
      </div>

      ${!hasFSA ? '<p class="dropzone-hint" style="color:var(--warn)">Compatibility mode: folder write-back unavailable. Download only.</p>' : ''}
    </div>
    <div class="footer-pill">
      <span id="app-version">Slate v2.0.0</span>
      <a href="guide/" target="_blank" rel="noopener">📖 Guide</a>
