        append:     function (path, line) { return rpc('naklios:sysfs:append', fsPayload({ path: path, line: line })); },
        list:       function (prefix)     { return rpc('naklios:sysfs:list', fsPayload({ prefix: prefix || '' })); },
        delete:     function (path)       { return rpc('naklios:sysfs:delete', fsPayload({ path: path })); },
        exists:     function (path)       { return rpc('naklios:sysfs:exists', fsPayload({ path: path })); },
      },
    },
    // Ask the host to open a web address in its Browser window, signed in with the person's Chrome
    // sessions when the companion extension is installed. The host asks the person first. Answers true
    // when it opened (in the window or, without the extension, a new tab). Standalone: opens a new tab.
    experimental_openUrl: function (url) {
      var href = String(url || '');
      if (!/^https?:\/\//i.test(href)) return Promise.reject(new Error('openUrl takes an http(s) address'));
      if (!inNakliOS) {
        try { window.open(href, '_blank', 'noopener'); } catch (_) {}
        return Promise.resolve(true);
      }
      return rpc('naklios:browser:open', { url: href });
    },
    files: {
      experimental_editInAnvil: function (request) {
        return rpc('naklios:file:editInAnvil', { request: request });
      },
      experimental_proposeEdit: function (token, after, run) {
        return rpc('naklios:file:proposeEdit', { token: String(token || ''), after: after, run: run });
      },
      experimental_onEditProposal: function (cb) {
        if (typeof cb !== 'function') return function () {};
        fileEditListeners.add(cb);
        pendingFileEdits.splice(0).forEach(deliverFileEdit);
        return function () { fileEditListeners.delete(cb); };
      },
      // Ask NakliOS to open one app-relative file in another cooperative app.
      // The target gets a window-lifetime token for exactly that file; it does
      // not receive the source app's namespace or a Folder/Crate credential.
      openWith: function (appId, path) {
        return rpc('naklios:file:openWith', fsPayload({
          appId: String(appId || ''),
          path: String(path || ''),
        }));
      },
      // Which apps declared they take this file (`accepts` in their commands.json), as `{ appId, name, action, label }`.
      experimental_targets: function (path) {
        if (!inNakliOS) return Promise.resolve([]);
        return rpc('naklios:file:targets', { path: String(path || '') });
      },
      // Send copies of app-relative files to an app that imports them. The target gets one read-only token per file;
      // `read(token)` answers `{ bytes, name, path, type, sourceAppId, backend }`.
      experimental_sendTo: function (appId, paths) {
        return rpc('naklios:file:sendTo', fsPayload({
          appId: String(appId || ''),
          paths: (Array.isArray(paths) ? paths : [paths]).map(String),
        }));
      },
      onOpen: function (cb) {
        if (typeof cb !== 'function') return function () {};
        fileOpenListeners.add(cb);
        var queued = pendingFileGrants.splice(0);
        queued.forEach(function (grant) {
          try { cb(grant); } catch (_) {}
        });
        return function () { fileOpenListeners.delete(cb); };
      },
      read: function (token) {
        return rpc('naklios:file:read', { token: String(token || '') });
      },
      write: function (token, data) {
        return rpc('naklios:file:write', { token: String(token || ''), data: data });
      },
      release: function (token) {
        send('naklios:file:release', { token: String(token || '') });
      },
    },
    // The shared TeX service. The host reads the project itself, so no file bytes cross the rail. A first compile asks
    // the person once and downloads TeX Live, so it waits up to two hours; later compiles take seconds.
    experimental_tex: {
      engines: function () { return rpc('naklios:tex:engines', {}); },
      compile: function (options) {
        if (!inNakliOS) return Promise.reject(new Error('Not hosted — naklios.experimental_tex unavailable standalone'));
        if (!capabilities.experimental_tex) return Promise.reject(new Error('The NakliOS TeX service is unavailable or not permitted'));
        options = options || {};
        var requestId = 't' + (++rpcCounter) + '_' + Date.now();
        var timer;
        var compile = new Promise(function (resolve, reject) {
          if (typeof options.onChunk === 'function') texCompiles.set(requestId, options.onChunk);
          pendingRpc.set(requestId, { resolve: resolve, reject: reject });
          if (send('naklios:tex:compile', {
            requestId: requestId, folder: options.folder, main: options.main, engine: options.engine,
          }) === false) {
            pendingRpc.delete(requestId);
            reject(new Error('Wait for a verified NakliOS host before sending more data'));
            return;
          }
          timer = setTimeout(function () {
            if (pendingRpc.has(requestId)) {
              pendingRpc.delete(requestId);
              send('naklios:tex:cancel', { requestId: requestId });
              reject(new Error('naklios RPC timeout: naklios:tex:compile'));
            }
          }, 2 * 60 * 60 * 1000);
        }).finally(function () { clearTimeout(timer); texCompiles.delete(requestId); });
        compile.id = requestId;
        return compile;
      },
      cancel: function (id) { send('naklios:tex:cancel', { requestId: String(id) }); },
      cache: function () { return rpc('naklios:tex:cache', {}); },
      // Waits for the person to answer the host's dialog.
      clearCache: function () { return rpc('naklios:tex:clearCache', {}, 10 * 60 * 1000); },
    },
    ai: {
      chat: {
        completions: {
          create: createAiCompletion,
        },
      },
      images: {
        generate: createAiImage,
      },
      // Semantic search over the app's own namespace on the connected
      // backend. The host builds/refreshes a local embedding index on first
      // use (one consent prompt) and returns ranked chunks.
      search: function (options) {
        if (!inNakliOS) {
          return Promise.reject(new Error('Not hosted — naklios.ai unavailable standalone'));
        }
        if (!capabilities.aiSearch) {
          return Promise.reject(new Error('NakliOS semantic search is unavailable or not permitted'));
        }
        options = options || {};
        var requestId = 's' + (++rpcCounter) + '_' + Date.now();
        return new Promise(function (resolve, reject) {
          ragSearches.set(requestId, {
            onIndexing: typeof options.onIndexing === 'function' ? options.onIndexing : null,
          });
          pendingRpc.set(requestId, { resolve: resolve, reject: reject });
          send('naklios:rag:search', {
            requestId: requestId,
            query: String(options.query || ''),
            limit: options.limit,
            prefix: options.prefix,
          });
          // Index building embeds every changed chunk locally; allow 15 min.
          setTimeout(function () {
            if (pendingRpc.has(requestId)) {
              pendingRpc.delete(requestId);
              reject(new Error('naklios RPC timeout: naklios:rag:search'));
            }
          }, 15 * 60 * 1000);
        }).finally(function () {
          ragSearches.delete(requestId);
        });
      },
      searchStatus: function () {
        return rpc('naklios:rag:status', {});
      },
      // On-device helpers (common rail step 5). Nothing leaves this browser; the person allows each app once per visit.
      // Embeddings: up to 64 texts, answered as `{ embeddings, dimensions }`.
      experimental_embeddings: function (input) {
        return rpc('naklios:ai:embed', { input: Array.isArray(input) ? input : [input] }, AI_LOCAL_TIMEOUT_MS);
      },
      // Speech to text: 16 kHz mono samples, at most 30 s, answered as `{ text }`. Needs the assistant's model turned on.
      experimental_transcribe: function (audio) {
        return rpc('naklios:ai:transcribe', { audio: audio }, AI_LOCAL_TIMEOUT_MS);
      },
      // Text to speech: at most 1,000 characters, answered as `{ audio, sampleRate }`. Needs the assistant's model turned on.
      experimental_speak: function (text) {
        return rpc('naklios:ai:speak', { text: String(text || '') }, AI_LOCAL_TIMEOUT_MS);
      },
      cancelAll: function () {
        aiRequests.forEach(function (_, requestId) {
          send('naklios:ai:cancel', { requestId: requestId });
        });
        aiImageRequests.forEach(function (_, requestId) {
          send('naklios:ai:cancel', { requestId: requestId });
        });
      },
    },

    // Web search and page reading for agents. The host searches with the person's provider (or Wikipedia) and reads
    // pages directly, through the person's web relay, or through Jina Reader; each site asks the person once.
    experimental_web: {
      // search(query, { maxResults }) -> { provider, results: [{ title, url, snippet }] }
      search: function (query, options) {
        if (!inNakliOS || !capabilities.experimental_web) return Promise.reject(new Error('NakliOS web search is unavailable to this app'));
        return rpc('naklios:web:search', { query: String(query || ''), maxResults: options && options.maxResults }, 120000);
      },
      // fetch(url) -> { url, status, kind: 'html'|'text', content, truncated, via }
      fetch: function (url) {
        if (!inNakliOS || !capabilities.experimental_web) return Promise.reject(new Error('NakliOS page reading is unavailable to this app'));
        return rpc('naklios:web:fetch', { url: String(url || '') }, 120000);
      },
    },

    // Sovereign egress — a cross-origin HTTP request the browser's Same-Origin
    // Policy blocks (git push, arbitrary-host fetch, no-CORS APIs). The host routes
    // it to the user-configured backend (their own Worker or the local bridge); it
    // is NEVER a naklios-hosted proxy. Grant-gated + History-logged host-side.
    // This is the SDK seam: until a host advertises a backend (capabilities.net),
    // every call fails fast with a typed ENOEGRESS — no 30s RPC timeout.
    net: {
      // Synchronous check an app can gate its UI on.
      available: function () { return capabilities.net === true; },
      // { backend: 'worker'|'bridge', roams } — no secrets; null when unavailable.
      info: function () {
        if (!inNakliOS || !capabilities.net) return Promise.resolve(null);
        return rpc('naklios:net:info', {});
      },
      // fetch({ url, method, headers, body }) -> { status, statusText, headers, body }.
      // Binary bodies as ArrayBuffer/Uint8Array; text as string. Buffered in v1.
      fetch: function (req) {
        req = req || {};
        if (!req.url) return Promise.reject(mkEgressErr('EINVAL', 'net.fetch requires a url'));
        if (!inNakliOS || !capabilities.net) {
          return Promise.reject(mkEgressErr('ENOEGRESS', inNakliOS
            ? 'No egress backend configured — connect one in NakliOS settings'
            : 'Not hosted — naklios.net unavailable standalone'));
        }
        return rpc('naklios:net:fetch', {
          url: String(req.url),
          method: req.method || 'GET',
          headers: req.headers || {},
          body: req.body != null ? req.body : null,
        }, req.timeoutMs);
      },
    },
  };
})();

/* ui/layout.css */
/* ── App root ──────────────────────────────────────────────────────────────── */

* {
  scrollbar-width: thin;
  scrollbar-color: var(--bg-3) transparent;
}
*::-webkit-scrollbar { width: 10px; height: 10px; }
*::-webkit-scrollbar-track,
*::-webkit-scrollbar-corner { background: transparent; }
*::-webkit-scrollbar-thumb {
  background: var(--bg-3);
  border: 2px solid transparent;
  border-radius: 999px;

}
*::-webkit-scrollbar-thumb:hover {
  background: var(--accent);
  border: 2px solid transparent;
  background-clip: padding-box;
}

#app {
  display: flex;
  flex-direction: column;
  height: 100dvh;
  overflow: hidden;
  position: relative;
}

/* ── Compat warning ──────────────────────────────────────────────────────── */

#compat-warning {
  display: flex;
  align-items: center;
  justify-content: center;
  height: 100%;
  padding: var(--space-5);
  text-align: center;
}

.compat-inner { max-width: 480px; }
.compat-inner h1 { font-size: 20px; margin: 0 0 var(--space-3); }
.compat-inner p { color: var(--fg-1); margin: 0 0 var(--space-4); }
.compat-inner ul { text-align: left; color: var(--fg-1); line-height: 2; }

/* ── Shell ─────────────────────────────────────────────────────────────────── */

#shell {
  display: flex;
  flex-direction: row;
  flex: 1;
  overflow: hidden;
  min-height: 0;
}

/* ── Toolbar (left sidebar) ───────────────────────────────────────────────── */

#toolbar {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: var(--space-1);
  width: 92px;
  padding: var(--space-2) 0;
  background: var(--bg-1);
  border-right: 1px solid var(--bg-2);
  flex-shrink: 0;
  overflow-y: auto;
  overflow-x: hidden;
  scrollbar-gutter: stable;
  z-index: 10;
}

#toolbar .toolbar-brand {
  position: sticky;
  top: calc(var(--space-2) * -1);
  margin: calc(var(--space-2) * -1) 0 var(--space-2);
  padding: var(--space-2) 0;
  width: 100%;
  text-align: center;
  font-size: 14px;
  font-weight: 700;
  letter-spacing: 0.08em;
  color: var(--fg-0);
  background: var(--bg-1);
  border-bottom: 1px solid var(--bg-2);
  z-index: 5;
  user-select: none;
}

#toolbar .toolbar-group {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: var(--space-1);
  width: 100%;
  padding: 0 var(--space-1);
}

#toolbar .toolbar-group + .toolbar-group {
  border-top: 1px solid var(--bg-2);
  padding-top: var(--space-2);
  margin-top: var(--space-1);
}

#toolbar .btn-icon {
  width: 36px;
  height: 36px;
  border-radius: var(--radius-sm);
  color: var(--fg-1);
}

.dirty-dot {
  position: absolute;
  top: 3px;
  right: 3px;
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: var(--accent);
  pointer-events: none;
}

#toolbar .btn-icon:hover { color: var(--fg-0); }
#toolbar .btn-icon.active,
#toolbar .btn-icon[aria-pressed="true"] {
  background: var(--bg-2);
  color: var(--accent);
}



/* ── Right sidebar ────────────────────────────────────────────────────────── */

#right-sidebar {
  display: flex;
  flex-direction: column;
  width: 48px;
  padding: var(--space-2) 0;
  background: var(--bg-1);
  border-left: 1px solid var(--bg-2);
  flex-shrink: 0;
  overflow-y: auto;
  overflow-x: hidden;
  z-index: 10;
}

.rs-section-label {
  font-size: 9px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  color: var(--fg-2);
  text-align: center;
  padding: var(--space-1) 0 2px;
  margin-top: var(--space-1);
}

.rs-group {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 2px;
  padding: 0 var(--space-1);
}

.rs-btn-wrap {
  position: relative;
  display: flex;
  align-items: center;
  width: 36px;
}

.rs-btn {
  width: 36px;
  height: 36px;
  color: var(--fg-1);
}
.rs-btn:hover { color: var(--fg-0); }

.rs-star {
  position: absolute;
  top: 0;
  right: -2px;
  font-size: 8px;
  color: var(--warn);
  line-height: 1;
  pointer-events: none;
}

.rs-empty-hint {
  padding: var(--space-3) var(--space-1);
  text-align: center;
  font-size: 10px;
  color: var(--fg-2);
  line-height: 1.4;
}

/* ── Context bar (crop/tool commit) ──────────────────────────────────────── */

#context-bar {
  position: absolute;
  bottom: var(--space-4);
  left: 50%;
  transform: translateX(-50%);
  display: flex;
  align-items: center;
  gap: var(--space-2);
  background: var(--bg-1);
  border: 1px solid var(--bg-3);
  border-radius: var(--radius-md);
  padding: var(--space-2) var(--space-3);
  box-shadow: 0 4px 20px rgba(0,0,0,0.5);
  z-index: 30;
  white-space: nowrap;
}

#context-bar.hidden { display: none; }
#context-bar .ctx-divider { width: 1px; height: 16px; background: var(--bg-3); margin: 0 var(--space-1); }
#context-bar .ctx-hint { font-size: 11px; color: var(--fg-2); }
#context-bar .ctx-slider-wrap { display: flex; align-items: center; gap: var(--space-2); font-size: 12px; color: var(--fg-1); }
#context-bar .ctx-slider-wrap input[type=range] { width: 100px; }
#context-bar .ctx-slider-wrap output { min-width: 30px; text-align: right; color: var(--fg-2); font-size: 11px; }

#context-bar .ctx-label { font-size: 11px; font-weight: 600; color: var(--fg-1); padding: 0 var(--space-1); }
#context-bar .ctx-color { display: inline-flex; align-items: center; gap: 4px; font-size: 11px; color: var(--fg-2); cursor: pointer; }
#context-bar .ctx-color input[type=color] { width: 26px; height: 22px; border: 1px solid var(--bg-3); border-radius: 4px; padding: 0; background: transparent; cursor: pointer; }
#context-bar .ctx-color-label { user-select: none; }
#context-bar .ctx-check { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; color: var(--fg-1); cursor: pointer; }
#context-bar .ctx-modes { display: inline-flex; gap: 2px; }
#context-bar .ctx-mode-btn {
  background: transparent;
  border: 1px solid var(--bg-3);
  color: var(--fg-1);
  font-size: 11px;
  padding: 4px 8px;
  border-radius: 4px;
  cursor: pointer;
}
#context-bar .ctx-mode-btn:hover { background: var(--bg-2); color: var(--fg-0); }
#context-bar .ctx-mode-btn.active { background: var(--accent); color: #fff; border-color: var(--accent); }

/* Footer pill — anchored to the bottom of the empty-state */

.footer-pill {
  position: absolute;
  bottom: 24px;
  left: 50%;
  transform: translateX(-50%);
  display: flex;
  gap: 16px;
  background: var(--bg-1);
  border: 1px solid var(--bg-3);
  padding: 6px 18px;
  border-radius: 20px;
  font-size: 12px;
}
.footer-pill a {
  color: var(--accent);
  text-decoration: none;
  white-space: nowrap;
}
.footer-pill a:hover { opacity: 0.7; }
.footer-pill #app-version { color: var(--fg-2); white-space: nowrap; }

#right-sidebar .rs-foot-link {
  margin-top: auto;
  display: flex;
  align-items: center;
  justify-content: center;
  width: 32px;
  height: 32px;
  border-radius: 6px;

  text-decoration: none;

#right-sidebar .rs-foot-link:hover { background: var(--bg-2); color: var(--fg-0); }

/* ── Main area (right of toolbar) ─────────────────────────────────────────── */

  flex-direction: column;
  flex: 1;
  overflow: hidden;

}

  flex-direction: row;
  flex: 1;
  overflow: hidden;

  position: relative;
}

  width: 24px;

  border-bottom: 1px solid var(--bg-2);
  flex-shrink: 0;
  z-index: 5;

#ruler-h {
  height: 24px;

  flex: 1;

  position: relative;

#ruler-v {
  width: 24px;

  border-right: 1px solid var(--bg-2);
  flex-shrink: 0;
  overflow: hidden;
  position: relative;
}

#rulers-row {
  display: flex;
  flex-direction: row;
  height: 24px;
  flex-shrink: 0;
}

.rulers-hidden #ruler-corner,

#viewport {

  position: relative;
  overflow: hidden;
  background: var(--bg-0);
  cursor: default;
}

#main-canvas {
  position: absolute;
  top: 0; left: 0;
  touch-action: none;
}

#thumbstrip-bar {
  height: 100px;

  border-top: 1px solid var(--bg-2);
  display: flex;
  flex-direction: row;
  align-items: center;
  overflow-x: auto;
  overflow-y: hidden;
  gap: var(--space-1);
  padding: var(--space-1) var(--space-2);
  flex-shrink: 0;
  scrollbar-width: thin;
  scrollbar-color: var(--bg-3) transparent;
}

#thumbstrip-bar.hidden { display: none; }

  height: 80px;

  height: 100%;

  display: block;
}

.thumb-item .thumb-label {
  position: absolute;
  bottom: 0; left: 0; right: 0;
  background: linear-gradient(transparent, rgba(0,0,0,0.7));
  color: #fff;
  font-size: 10px;
  padding: 2px 4px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  opacity: 0;
  transition: opacity var(--dur-micro) var(--ease);
}

.thumb-item:hover .thumb-label { opacity: 1; }

/* ── Status bar ───────────────────────────────────────────────────────────── */

#status-bar {
  height: 24px;
  background: var(--bg-1);
  border-top: 1px solid var(--bg-2);
  display: flex;
  align-items: center;
  padding: 0 var(--space-3);
  gap: var(--space-4);
  flex-shrink: 0;
  font-size: 11px;
  color: var(--fg-2);
  overflow: hidden;
}

#status-bar .status-item { white-space: nowrap; }
#status-bar .status-sep { color: var(--bg-3); }

/* ── Empty state ──────────────────────────────────────────────────────────── */

#empty-state {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  background: var(--bg-0);
  z-index: 20;
}

#empty-state.hidden { display: none; }

.dropzone {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: var(--space-4);
  padding: var(--space-8);
  border: 2px dashed var(--bg-3);
  border-radius: var(--radius-lg);
  text-align: center;
  max-width: 440px;
  width: 100%;
  transition: border-color var(--dur-micro) var(--ease), background var(--dur-micro) var(--ease);
}

.dropzone.drag-over {
  border-color: var(--accent);
  background: var(--selection);
}

.dropzone-icon { color: var(--fg-2); margin-bottom: var(--space-2); }
.dropzone h2 { font-size: 18px; font-weight: 600; margin: 0; }
.dropzone p { color: var(--fg-1); margin: 0; font-size: 13px; }

.dropzone-actions {
  display: flex;
  gap: var(--space-2);
  flex-wrap: wrap;
  justify-content: center;
}

.dropzone-hint { color: var(--fg-2); font-size: 12px; margin-top: var(--space-2); }

/* ── Floating numeric panel ───────────────────────────────────────────────── */

#numeric-panel {
  position: absolute;
  background: var(--bg-1);
  border: 1px solid var(--bg-3);
  border-radius: var(--radius-md);
  padding: var(--space-3);
  min-width: 200px;
  box-shadow: 0 8px 24px rgba(0,0,0,0.4);
  z-index: 50;
  cursor: move;
  user-select: none;
}

#numeric-panel.hidden { display: none; }

.panel-title {
  font-size: 11px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.05em;
  color: var(--fg-2);
  margin-bottom: var(--space-3);
}

.panel-fields {
  display: grid;
  grid-template-columns: auto 1fr;
  gap: var(--space-2) var(--space-3);
  align-items: center;
}

.panel-fields label { font-size: 12px; color: var(--fg-1); }

.panel-fields input[type="number"] {
  font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  width: 80px;
  text-align: right;
}

.panel-readout {
  margin-top: var(--space-3);
  padding-top: var(--space-2);
  border-top: 1px solid var(--bg-2);
  font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  font-size: 11px;
  color: var(--fg-2);
  white-space: nowrap;
}

/* ── Toast notifications ─────────────────────────────────────────────────── */

#toasts {
  position: fixed;
  bottom: var(--space-5);
  right: var(--space-5);
  display: flex;
  flex-direction: column;
  gap: var(--space-2);
  z-index: 200;
  pointer-events: none;
}

.toast {
  display: flex;
  align-items: center;
  gap: var(--space-2);
  padding: var(--space-2) var(--space-3);
  background: var(--bg-2);
  border: 1px solid var(--bg-3);
  border-radius: var(--radius-md);
  box-shadow: 0 4px 16px rgba(0,0,0,0.4);
  font-size: 13px;
  pointer-events: auto;
  animation: toast-in var(--dur-panel) var(--ease);
  max-width: 360px;
}

.toast.error { border-color: var(--danger); }
.toast.warn { border-color: var(--warn); }
.toast.ok { border-color: var(--ok); }

@keyframes toast-in {
  from { opacity: 0; transform: translateY(8px); }
  to   { opacity: 1; transform: translateY(0); }
}

/* ── Loading overlay ─────────────────────────────────────────────────────── */

#loading-bar {
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 2px;
  background: var(--accent);
  z-index: 100;
  transform-origin: left;
  transition: transform 0.2s var(--ease);
}
#loading-bar.hidden { display: none; }

/* ── Inline banners ──────────────────────────────────────────────────────── */

.banner {
  display: flex;
  align-items: center;
  gap: var(--space-2);
  padding: var(--space-2) var(--space-3);
  font-size: 12px;
  flex-shrink: 0;
}

.banner-warn { background: color-mix(in srgb, var(--warn) 15%, transparent); color: var(--warn); }
.banner-info { background: color-mix(in srgb, var(--accent) 10%, transparent); color: var(--fg-1); }
.banner-close { margin-left: auto; cursor: pointer; opacity: 0.6; }
.banner-close:hover { opacity: 1; }

/* ── Workspace nudge ─────────────────────────────────────────────────────── */

.workspace-nudge {
  position: fixed;
  bottom: 40px;
  left: 50%;
  transform: translateX(-50%);
  display: flex;
  align-items: center;
  gap: var(--space-2);
  padding: var(--space-2) var(--space-3);
  background: var(--bg-1);
  border: 1px solid var(--bg-2);
  border-radius: var(--radius);
  box-shadow: 0 4px 20px rgba(0, 0, 0, 0.45);
  font-size: 12px;
  max-width: 520px;
  z-index: 50;
  white-space: nowrap;
  animation: nudge-in 0.2s var(--ease);
}

@keyframes nudge-in {
  from { opacity: 0; transform: translateX(-50%) translateY(8px); }
  to   { opacity: 1; transform: translateX(-50%) translateY(0); }
}

.workspace-nudge-close {
  background: none;
  border: none;
  cursor: pointer;
  padding: 2px;
  opacity: 0.5;
  color: var(--fg-1);
  margin-left: var(--space-1);
  display: flex;
  align-items: center;
}
.workspace-nudge-close:hover { opacity: 1; }

/* ── Help modal ──────────────────────────────────────────────────────────── */

.help-dialog {
  width: min(640px, 94vw);
  max-height: min(720px, 90dvh, 90vh);
  padding: 0;
  border: 1px solid var(--bg-3);
  border-radius: var(--radius-md);
  background: var(--bg-1);
  color: var(--fg-0);
  overflow: hidden;
}
.help-dialog[open] {
  display: flex;
  flex-direction: column;
}
.help-dialog:not([open]) { display: none; }

.help-dialog::backdrop { background: rgba(0,0,0,0.6); }

@media (max-width: 600px) {
  .help-dialog {
    width: 100vw;
    max-width: 100vw;
    max-height: 100dvh;
    height: 100dvh;
    border-radius: 0;
    border: none;
  }
  .help-tabs {
    flex-wrap: nowrap !important;
    overflow-x: auto;
    overflow-y: hidden;
    -webkit-overflow-scrolling: touch;
    padding: var(--space-1) var(--space-2);
  }
  .help-tab-btn { flex-shrink: 0; }
  .help-header  { padding: var(--space-2) var(--space-3); }
  .help-body    { padding: var(--space-2) var(--space-3); }
  .help-footer  { padding: var(--space-2) var(--space-3); }
}

.help-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: var(--space-3) var(--space-4);
  border-bottom: 1px solid var(--bg-2);
  flex-shrink: 0;
}

.help-header h2 { margin: 0; font-size: 15px; font-weight: 600; }
.help-close { flex-shrink: 0; }

.help-tabs {
  display: flex;
  flex-wrap: wrap;
  gap: 2px;
  padding: var(--space-2) var(--space-3);
  border-bottom: 1px solid var(--bg-2);
  flex-shrink: 0;
}

.help-tab-btn {
  background: none;
  border: none;
  padding: 4px 12px;
  font-size: 12px;
  border-radius: var(--radius-sm);
  cursor: pointer;
  color: var(--fg-1);
  white-space: nowrap;
  flex-shrink: 0;
}

.help-tab-btn:hover { background: var(--bg-2); color: var(--fg-0); }
.help-tab-btn.active { background: var(--accent); color: #fff; }

.help-body {
  flex: 1;
  overflow-y: auto;
  overflow-x: hidden;
  padding: var(--space-3) var(--space-4);
}

.help-section { margin-bottom: var(--space-4); }
.help-section h3 { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.06em; color: var(--fg-2); margin: 0 0 var(--space-2); }

.help-row { display: flex; gap: var(--space-3); padding: 4px 0; font-size: 12px; border-bottom: 1px solid var(--bg-2); align-items: baseline; flex-wrap: wrap; }
.help-row:last-child { border-bottom: none; }
.help-label { flex-shrink: 0; width: 140px; color: var(--fg-1); }
.help-desc { color: var(--fg-0); }

.help-p { font-size: 12px; color: var(--fg-1); margin: 4px 0; line-height: 1.6; }

.help-footer {
  flex-shrink: 0;
  padding: var(--space-2) var(--space-4);
  border-top: 1px solid var(--bg-2);
  text-align: right;
}
.help-footer-link {
  color: var(--accent);
  font-size: 12px;
  text-decoration: none;
}
.help-footer-link:hover { text-decoration: underline; }

.shortcut-table { width: 100%; border-collapse: collapse; font-size: 12px; table-layout: fixed; }
.shortcut-table td { padding: 4px 8px 4px 0; vertical-align: baseline; word-wrap: break-word; }
.shortcut-table td:last-child { color: var(--fg-1); }

.help-welcome { text-align: center; padding: var(--space-4) 0 var(--space-3); }
.help-welcome-logo { margin-bottom: var(--space-2); opacity: 0.7; }
.help-welcome-title { font-size: 22px; font-weight: 700; margin: 0 0 var(--space-2); }
.help-welcome-tagline { font-size: 13px; color: var(--fg-1); margin: 0 0 var(--space-4); line-height: 1.6; }

.help-welcome-features { display: flex; flex-direction: column; gap: var(--space-3); margin-bottom: var(--space-4); }
.help-feature-item { display: flex; gap: var(--space-3); align-items: flex-start; font-size: 12px; line-height: 1.5; }
.help-feature-icon { font-size: 18px; flex-shrink: 0; width: 28px; text-align: center; }
.help-feature-item strong { display: block; margin-bottom: 2px; color: var(--fg-0); }
.help-feature-item div { color: var(--fg-1); }

.help-welcome-hint { text-align: center; font-size: 11px; color: var(--fg-2); margin: 0; }

/* ── First-run tour ─────────────────────────────────────────────────────── */

.tour-layer {
  position: fixed;
  inset: 0;
  z-index: 4000;
  pointer-events: auto;
}

.tour-spotlight {
  position: fixed;
  z-index: 4001;
  border: 2px solid var(--accent);
  border-radius: var(--radius-md);
  box-shadow:
    0 0 0 4px color-mix(in srgb, var(--accent) 28%, transparent),
    0 0 0 9999px rgba(0, 0, 0, 0.72);
  pointer-events: none;
  transition:
    top var(--dur-panel) var(--ease),
    left var(--dur-panel) var(--ease),
    width var(--dur-panel) var(--ease),
    height var(--dur-panel) var(--ease);
}

.tour-card {
  position: fixed;
  z-index: 4002;
  width: min(360px, calc(100vw - 24px));
  padding: var(--space-4);
  border: 1px solid var(--bg-3);
  border-radius: var(--radius-lg);
  background: var(--bg-1);
  color: var(--fg-0);
  box-shadow: 0 20px 48px rgba(0, 0, 0, 0.55);
}

.tour-progress {
  margin: 0 0 var(--space-2);
  color: var(--accent);
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0.06em;
  text-transform: uppercase;
}

.tour-card h2 { margin: 0 0 var(--space-2); font-size: 18px; }
.tour-card p { margin: 0; color: var(--fg-1); font-size: 13px; line-height: 1.6; }
.tour-actions {
  display: flex;
  align-items: center;
  gap: var(--space-2);
  margin-top: var(--space-4);
}
.tour-skip { margin-right: auto; color: var(--fg-1); }

@media (max-width: 520px) {
  .tour-card { padding: var(--space-3); }
  .tour-actions { flex-wrap: wrap; }
}

kbd {
  display: inline-block;
  padding: 1px 6px;
  font-size: 11px;
  font-family: var(--font-mono, monospace);
  background: var(--bg-2);
  border: 1px solid var(--bg-3);
  border-radius: 3px;
  white-space: nowrap;
}

/* ── Layers panel ────────────────────────────────────────────────────────── */

#layers-panel {
  position: absolute;
  top: 56px;
  right: 56px;
  width: 220px;
  max-height: calc(100vh - 180px);
  background: var(--bg-1);
  border: 1px solid var(--bg-2);
  border-radius: var(--radius-md);
  box-shadow: 0 4px 16px rgba(0,0,0,0.4);
  z-index: 25;
  display: none;
  flex-direction: column;
  overflow: hidden;
  font-size: 12px;
}
#layers-panel.visible { display: flex; }

.lp-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: var(--space-2) var(--space-3);
  border-bottom: 1px solid var(--bg-2);
  flex-shrink: 0;
}
.lp-title { font-size: 11px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: var(--fg-2); }
.lp-count { font-size: 11px; color: var(--fg-2); }

.lp-body { flex: 1; overflow-y: auto; padding: var(--space-1); }

.lp-row {
  display: flex;
  align-items: center;
  gap: 4px;
  padding: 4px 6px;
  border-radius: 4px;
  color: var(--fg-0);
}
.lp-row:hover { background: var(--bg-2); }

.lp-glyph {
  width: 18px; height: 18px;
  display: flex;
  align-items: center;
  justify-content: center;
  background: var(--bg-2);
  border-radius: 3px;
  font-size: 11px;
  color: var(--fg-1);
  flex-shrink: 0;
}

.lp-label { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 12px; }

.lp-btn {
  width: 22px; height: 22px;
  border: none;
  background: none;
  cursor: pointer;
  color: var(--fg-2);
  border-radius: 3px;
  font-size: 11px;
  padding: 0;
  display: flex;
  align-items: center;
  justify-content: center;
}
.lp-btn:hover { background: var(--bg-3); color: var(--fg-0); }
.lp-del:hover { color: var(--warn); }

.lp-foot {
  padding: 6px 10px;
  border-top: 1px solid var(--bg-2);
  font-size: 10px;
  color: var(--fg-2);
  flex-shrink: 0;
}

/* Hide when fullscreen */
#app.fullscreen #layers-panel,
#app.slideshow-active #layers-panel {
  display: none;
}

/* ── Batch dialog ────────────────────────────────────────────────────────── */

.batch-dialog {
  width: min(720px, 94vw);
  max-height: 90vh;
  padding: 0;
  border: 1px solid var(--bg-3);
  border-radius: var(--radius-md);
  background: var(--bg-1);
  color: var(--fg-0);
  overflow: hidden;
}
.batch-dialog[open] {
  display: flex;
  flex-direction: column;
}
.batch-dialog:not([open]) { display: none; }
.batch-dialog::backdrop { background: rgba(0,0,0,0.6); }

.batch-body { flex: 1; overflow-y: auto; padding: var(--space-3) var(--space-4); }

.batch-section { margin-bottom: var(--space-4); }
.batch-section h3 {
  font-size: 11px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  color: var(--fg-2);
  margin: 0 0 var(--space-2);
}
.batch-section h4 {
  font-size: 12px;
  font-weight: 600;
  margin: var(--space-3) 0 var(--space-2);
}

.batch-source-line {
  font-size: 13px;
  color: var(--fg-1);
  display: flex;
  align-items: center;
  gap: 12px;
  flex-wrap: wrap;
}
.batch-source-line strong { color: var(--fg-0); }

.btn-sm { font-size: 11px; padding: 3px 10px; }

.batch-op {
  border: 1px solid var(--bg-2);
  border-radius: 6px;
  padding: 8px 12px;
  margin-bottom: 6px;
  background: var(--bg-0);
}
.batch-op-toggle {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 13px;
  font-weight: 500;
  cursor: pointer;
}
.batch-op-config {
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
  align-items: center;
  margin-top: 6px;
  padding-left: 22px;
  font-size: 12px;
  color: var(--fg-1);
}
.batch-op-config input[type="number"],
.batch-op-config input[type="text"],
.batch-op-config select {
  background: var(--bg-1);
  border: 1px solid var(--bg-3);
  color: var(--fg-0);
  border-radius: 4px;
  padding: 3px 6px;
  font-size: 12px;
}
.batch-inline { display: flex; align-items: center; gap: 6px; }

.batch-tokens { display: inline-flex; flex-wrap: wrap; gap: 4px; margin-top: 4px; }
.batch-tokens span {
  font-family: var(--font-mono, monospace);
  font-size: 10px;
  background: var(--bg-2);
  padding: 2px 6px;
  border-radius: 3px;
  cursor: pointer;
  color: var(--fg-1);
}
.batch-tokens span:hover { background: var(--bg-3); color: var(--fg-0); }

.batch-dest-opt {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 6px 0;
  font-size: 13px;
}
.batch-dest-opt.disabled { opacity: 0.4; pointer-events: none; }
.batch-dest-opt code { font-family: var(--font-mono, monospace); color: var(--fg-1); font-size: 11px; }
.batch-warn { color: var(--warn); font-size: 11px; margin-left: 4px; }

.batch-footer {
  display: flex;
  align-items: center;
  padding: var(--space-3) var(--space-4);
  border-top: 1px solid var(--bg-2);
  gap: 10px;
}
.batch-status { font-size: 11px; color: var(--fg-2); }
.batch-muted { color: var(--fg-2); font-weight: 400; font-size: 11px; }

.batch-dry-preview { margin-top: var(--space-3); padding-top: var(--space-3); border-top: 1px dashed var(--bg-3); }
.batch-warning {
  background: rgba(245,158,11,0.12);
  color: var(--warn);
  padding: 6px 10px;
  border-radius: 4px;
  font-size: 11px;
  margin-bottom: 6px;
}
.batch-table { width: 100%; border-collapse: collapse; font-size: 11px; table-layout: fixed; }
.batch-table th { text-align: left; color: var(--fg-2); font-weight: 500; padding: 6px 4px; border-bottom: 1px solid var(--bg-2); }
.batch-table td { padding: 4px; border-bottom: 1px solid var(--bg-2); }
.batch-cell-trunc { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-family: var(--font-mono, monospace); font-size: 10px; }

.batch-progress { padding: var(--space-3) 0; }
.batch-progress-bar {
  width: 100%;
  height: 10px;
  background: var(--bg-2);
  border-radius: 5px;
  overflow: hidden;
  margin-bottom: var(--space-3);
}
.batch-progress-bar-fill {
  height: 100%;
  background: var(--accent);
  width: 0%;
  transition: width 200ms ease;
}
.batch-progress-text { font-size: 12px; color: var(--fg-1); font-family: var(--font-mono, monospace); }

.batch-summary { font-size: 14px; margin: 0 0 var(--space-3); }
.batch-errors { margin-top: var(--space-2); }
.batch-errors summary { font-size: 12px; color: var(--warn); cursor: pointer; }
.batch-error-row { font-size: 11px; color: var(--fg-1); padding: 4px 0; font-family: var(--font-mono, monospace); }

/* ── Slideshow ───────────────────────────────────────────────────────────── */

#app.slideshow-active #toolbar,
#app.slideshow-active #right-sidebar,
#app.slideshow-active #thumbstrip-bar,
#app.slideshow-active #status-bar,
#app.slideshow-active #rulers-row,
#app.slideshow-active #ruler-v,
#app.slideshow-active #workspace-nudge,
#app.slideshow-active #session-banner {
  display: none !important;
}
#app.slideshow-active #viewport { background: #000; }

#slideshow-hud {
  position: fixed;
  inset: 0;
  pointer-events: none;
  z-index: 2000;
  opacity: 0;
  transition: opacity 180ms ease;
}
#slideshow-hud.visible { opacity: 1; }

.ss-info {
  position: absolute;
  top: 24px;
  left: 24px;
  background: rgba(0,0,0,0.6);
  color: #fff;
  padding: 8px 14px;
  border-radius: 8px;
  font-size: 13px;
  font-family: var(--font-mono, monospace);
  display: flex;
  gap: 14px;
  align-items: baseline;
  max-width: 60vw;
  backdrop-filter: blur(8px);
  pointer-events: auto;
}
.ss-pos { color: rgba(255,255,255,0.7); }
.ss-name { color: #fff; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

.ss-controls {
  position: absolute;
  bottom: 32px;
  left: 50%;
  transform: translateX(-50%);
  display: flex;
  gap: 8px;
  background: rgba(0,0,0,0.6);
  padding: 8px;
  border-radius: 10px;
  backdrop-filter: blur(8px);
  pointer-events: auto;
}
.ss-btn {
  width: 40px;
  height: 40px;
  border-radius: 6px;
  border: none;
  background: transparent;
  color: #fff;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
}
.ss-btn:hover { background: rgba(255,255,255,0.15); }
.ss-btn .icon { width: 18px; height: 18px; }
.ss-btn[data-ss="prev"] .icon { transform: scaleX(-1); }
#slideshow-hud.paused .ss-play { background: var(--accent); }

/* ── Fullscreen mode ─────────────────────────────────────────────────────── */

#app.fullscreen #toolbar,
#app.fullscreen #right-sidebar,
#app.fullscreen #thumbstrip-bar,
#app.fullscreen #status-bar,
#app.fullscreen #rulers-row,
#app.fullscreen #ruler-corner,
#app.fullscreen #ruler-h,
#app.fullscreen #ruler-v {
  display: none;
}

#app.fullscreen #main-canvas { cursor: none; }
#app.fullscreen #viewport:hover #main-canvas { cursor: default; }

/* ── Mobile (< 768px) ─────────────────────────────────────────────────────── */

@media (max-width: 767px) {
  #shell { flex-direction: column; }

  #right-sidebar { display: none; }

  #toolbar .toolbar-brand { display: none; }

  #toolbar {
    order: 99; /* push to bottom of shell column */
    display: flex;
    flex-direction: row;
    width: 100%;
    height: 48px;
    padding: 0 var(--space-2);
    border-right: none;
    border-top: 1px solid var(--bg-2);
    border-bottom: none;
    overflow-x: auto;
    overflow-y: hidden;
  }

  #toolbar .toolbar-group {
    display: flex;
    flex-direction: row;
    gap: var(--space-1);
    width: auto;
    padding: 0;
  }

  #toolbar .toolbar-group + .toolbar-group {
    border-top: none;
    border-left: 1px solid var(--bg-2);
    padding-top: 0;
    padding-left: var(--space-2);
    margin-top: 0;
    margin-left: var(--space-1);
  }

  #thumbstrip-bar { height: 72px; }
  .thumb-item { width: 56px; height: 56px; }

  /* Numeric panel docks as bottom sheet on mobile */
  #numeric-panel {
    position: fixed;
    bottom: 0; left: 0; right: 0;
    border-radius: var(--radius-lg) var(--radius-lg) 0 0;
    border-bottom: none;
    min-width: unset;
    cursor: default;
  }
}

/* ── Modal field styles ──────────────────────────────────────────────────────── */

.modal-fields { display: flex; flex-direction: column; gap: var(--space-3); }
.modal-field-row { display: flex; align-items: center; gap: var(--space-3); min-height: 28px; }
.modal-field-row label { min-width: 90px; font-size: 12px; color: var(--fg-1); }
.modal-slider-wrap { display: flex; align-items: center; gap: var(--space-2); flex: 1; }
.modal-slider-wrap input[type="range"] { flex: 1; }
.modal-slider-wrap output { font-family: ui-monospace, monospace; font-size: 11px; color: var(--fg-1); min-width: 36px; text-align: right; }
.modal-unit { font-size: 11px; color: var(--fg-2); }
.modal-info { font-size: 11px; color: var(--fg-2); margin: var(--space-1) 0 0; }

.export-fmt-group { display: flex; flex-wrap: wrap; gap: var(--space-2); }
.export-fmt-option { display: flex; align-items: center; gap: var(--space-1); font-size: 12px; cursor: pointer; }

/* ── Info panel ───────────────────────────────────────────────────────────── */

#info-panel {
  position: absolute;
  top: var(--space-3);
  right: var(--space-3);
  background: var(--bg-1);
  border: 1px solid var(--bg-3);
  border-radius: var(--radius-md);
  padding: var(--space-3);
  min-width: 220px;
  max-width: 280px;
  box-shadow: 0 4px 16px rgba(0,0,0,0.3);
  z-index: 40;
  font-size: 12px;
}

#info-panel.hidden { display: none; }

.info-row { display: flex; gap: var(--space-2); justify-content: space-between; padding: 2px 0; }
.info-label { color: var(--fg-2); flex-shrink: 0; }
.info-value { color: var(--fg-1); text-align: right; word-break: break-all; }
.info-gps-warn { color: var(--warn); margin-top: var(--space-2); font-size: 11px; }

/* ── Modal dialogs ────────────────────────────────────────────────────────── */

.modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: var(--space-4); }
.modal-header h2 { margin: 0; font-size: 16px; }
.modal-footer { display: flex; justify-content: flex-end; gap: var(--space-2); margin-top: var(--space-5); }

/* ── Pixel grid overlay (shown at zoom >= 400%) ───────────────────────────── */

#pixel-grid-canvas {
  position: absolute;
  top: 0; left: 0;
  pointer-events: none;
  opacity: 0.5;
}


/* ui/library/library.css */
/* ── Photo library mode (src/ui/library/view.js) ─────────────────────────── */

#library {
  position: absolute;
  inset: 0;
  z-index: 150;
  display: flex;
  flex-direction: column;
  background: var(--bg-0);
  color: var(--fg-0);
  min-width: 0;
}
#library[hidden] { display: none; }

.lib-head {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: var(--space-2);
  padding: var(--space-2) var(--space-3);
  border-bottom: 1px solid var(--bg-2);
  background: var(--bg-1);
  flex-shrink: 0;
}
.lib-title { font-size: 15px; font-weight: 600; margin: 0 var(--space-2) 0 0; }
.lib-search { flex: 1 1 220px; min-width: 160px; max-width: 520px; }
.lib-q { width: 100%; }
.lib-zoom { display: flex; gap: 2px; }
.lib-actions { display: flex; flex-wrap: wrap; align-items: center; gap: var(--space-1); margin-left: auto; min-width: 0; }
.lib-actions:empty { display: none; }

.lib-filters {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: var(--space-2) var(--space-3);
  padding: var(--space-2) var(--space-3);
  border-bottom: 1px solid var(--bg-2);
  background: var(--bg-1);
  font-size: 12px;
  color: var(--fg-1);
}
.lib-filters[hidden] { display: none; }
.lib-filters label { display: inline-flex; align-items: center; gap: var(--space-1); }
.lib-filters select { max-width: 160px; }

.lib-body { display: flex; flex: 1; min-height: 0; min-width: 0; }

/* Sidebar */
.lib-side {
  width: 210px;
  flex-shrink: 0;
  overflow-y: auto;
  padding: var(--space-2);
  border-right: 1px solid var(--bg-2);
  background: var(--bg-1);
  display: flex;
  flex-direction: column;
  gap: var(--space-1);
}
.lib-side-sec { display: flex; flex-direction: column; gap: 1px; }
.lib-side-end { margin-top: auto; padding-top: var(--space-3); }
.lib-side-h {
  font-size: 11px; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase;
  color: var(--fg-2); margin: var(--space-3) var(--space-2) var(--space-1);
}
.lib-side-note { font-size: 11px; color: var(--fg-2); margin: 2px var(--space-2) var(--space-1); line-height: 1.4; }
.lib-nav {
  display: flex; align-items: center; gap: var(--space-2);
  width: 100%; padding: 5px var(--space-2);
  border-radius: var(--radius-sm); text-align: left; color: var(--fg-1);
}
.lib-nav:hover { background: var(--bg-2); color: var(--fg-0); }
.lib-nav[aria-current="page"] { background: var(--bg-2); color: var(--accent); font-weight: 500; }
.lib-nav-label { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.lib-nav-count { font-size: 11px; color: var(--fg-2); }
.lib-side-row { display: flex; align-items: center; }
.lib-side-row .lib-nav { flex: 1; min-width: 0; }
.lib-more { padding: 2px 6px; color: var(--fg-2); }
.lib-root { display: flex; flex-direction: column; margin-bottom: var(--space-2); }
.lib-root-head { display: flex; align-items: center; gap: var(--space-1); }
.lib-root-head .lib-nav { flex: 1; min-width: 0; font-weight: 500; color: var(--fg-0); }
.lib-dl { align-self: flex-start; margin: 2px var(--space-2); }
.lib-add { margin-top: var(--space-1); justify-content: flex-start; }

/* Main */
.lib-main { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.lib-viewhead { display: flex; align-items: baseline; gap: var(--space-3); padding: var(--space-2) var(--space-3) 0; min-width: 0; }
.lib-viewname { font-size: 15px; font-weight: 600; margin: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.lib-count { font-size: 12px; color: var(--fg-2); white-space: nowrap; }
.lib-month { margin-left: auto; font-size: 12px; color: var(--fg-1); white-space: nowrap; }
.lib-gridwrap { position: relative; flex: 1; min-height: 0; display: flex; }

.lib-grid {
  position: relative;
  flex: 1;
  min-width: 0;
  overflow-y: auto;
  overflow-x: hidden;
  padding: 12px;
  outline: none;
  touch-action: pan-y;
  user-select: none;
  -webkit-user-select: none;
}
.lib-grid:focus-visible { box-shadow: inset 0 0 0 2px var(--accent); }
.lib-sizer { position: relative; }
.lib-row { position: absolute; left: 0; right: 0; top: 0; display: flex; gap: 4px; }
.lib-head-row { align-items: flex-end; }
.lib-hcell { display: flex; align-items: center; gap: var(--space-2); padding-bottom: 6px; }
.lib-head-month .lib-hlabel { font-size: 15px; font-weight: 600; }
.lib-hlabel { font-weight: 500; }
.lib-hcount { font-size: 11px; color: var(--fg-2); }
.lib-daysel {
  width: 18px; height: 18px; border-radius: 50%;
  border: 1.5px solid var(--fg-2); display: inline-flex; align-items: center; justify-content: center;
  opacity: 0.5;
}
.lib-head-row:hover .lib-daysel, .lib-daysel:focus-visible, .lib-daysel[aria-pressed="true"] { opacity: 1; }
.lib-daysel[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); }
.lib-daysel[aria-pressed="true"] .lib-tick::after { content: "\2713"; color: var(--accent-contrast); font-size: 11px; }

.lib-tile {
  position: relative;
  flex-shrink: 0;
  overflow: hidden;
  border-radius: 2px;
  background: var(--bg-2);
  cursor: default;
}
.lib-tile img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: block; }
.lib-ph {
  position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
  font-size: 11px; color: var(--fg-2); letter-spacing: 0.05em;
}
.lib-tile.has-img .lib-ph { display: none; }
.lib-tile.is-hidden img { opacity: 0.5; }
.lib-badges {
  position: absolute; left: 4px; right: 4px; bottom: 4px;
  display: flex; flex-wrap: wrap; gap: 3px; justify-content: flex-end; pointer-events: none;
}
.lib-b {
  font-size: 10px; line-height: 1; padding: 3px 5px; border-radius: 3px;
  background: rgba(0, 0, 0, 0.55); color: #fff;
}
.lib-b-fav { color: #fda4af; }
.lib-b-star { color: #fcd34d; }
.lib-b-pick { color: #86efac; }
.lib-b-reject { color: #fca5a5; }
.lib-b-missing { background: var(--warn); color: #000; }
.lib-selmark {
  position: absolute; top: 5px; left: 5px; width: 18px; height: 18px; border-radius: 50%;
  border: 1.5px solid rgba(255, 255, 255, 0.85); background: rgba(0, 0, 0, 0.2);
  opacity: 0; transition: opacity var(--dur-micro) var(--ease);
}
.lib-tile:hover .lib-selmark { opacity: 1; }
.lib-tile.is-sel { box-shadow: inset 0 0 0 3px var(--accent); }
.lib-tile.is-sel img { transform: scale(0.92); }
.lib-tile.is-sel .lib-selmark { opacity: 1; background: var(--accent); border-color: var(--accent); }
.lib-tile.is-sel .lib-selmark::after { content: "\2713"; color: var(--accent-contrast); font-size: 11px; display: flex; align-items: center; justify-content: center; height: 100%; }
.lib-grid:focus-visible .lib-tile.is-focus,
.lib-tile.is-focus { outline: 2px solid var(--accent); outline-offset: -2px; }
.lib-lasso {
  position: absolute; z-index: 5; pointer-events: none;
  border: 1px solid var(--selection-border); background: var(--selection);
}
.lib-lasso[hidden] { display: none; }

/* Scrubber */
.lib-scrub {
  position: relative; width: 44px; flex-shrink: 0; cursor: ns-resize;
  border-left: 1px solid var(--bg-2); touch-action: none; outline: none;
}
.lib-scrub[hidden] { display: none; }
.lib-scrub:focus-visible { box-shadow: inset 0 0 0 2px var(--accent); }
.lib-scrub-year { position: absolute; right: 6px; font-size: 10px; color: var(--fg-2); transform: translateY(-1px); pointer-events: none; }
.lib-scrub-thumb { position: absolute; left: 4px; right: 4px; height: 4px; border-radius: 2px; background: var(--accent); pointer-events: none; }
.lib-scrub-bubble {
  position: absolute; right: 48px; padding: 3px 8px; border-radius: var(--radius-sm);
  background: var(--bg-3); color: var(--fg-0); font-size: 12px; white-space: nowrap; pointer-events: none; z-index: 6;
}
.lib-scrub-bubble[hidden] { display: none; }

/* Empty state */
.lib-empty { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; padding: var(--space-5); pointer-events: none; }
.lib-empty[hidden] { display: none; }
.lib-empty-inner { max-width: 420px; text-align: center; pointer-events: auto; color: var(--fg-1); }
.lib-empty-inner h2 { color: var(--fg-0); font-size: 18px; margin: 0 0 var(--space-2); }
.lib-empty-inner .btn { margin-top: var(--space-2); }
.lib-note { font-size: 12px; color: var(--fg-2); line-height: 1.45; }

/* Status line */
.lib-status {
  display: flex; align-items: center; gap: var(--space-3);
  height: 28px; padding: 0 var(--space-3); flex-shrink: 0;
  border-top: 1px solid var(--bg-2); background: var(--bg-1);
  font-size: 11px; color: var(--fg-2);
}
.lib-job { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.lib-pause[hidden] { display: none; }

/* Viewer */
.lib-viewer { position: absolute; inset: 0; z-index: 10; display: flex; flex-direction: column; background: var(--bg-0); }
.lib-viewer[hidden] { display: none; }
.lv-bar { display: flex; align-items: center; gap: var(--space-2); padding: var(--space-2) var(--space-3); border-bottom: 1px solid var(--bg-2); background: var(--bg-1); min-width: 0; }
.lv-bar .btn-icon span { font-size: 20px; line-height: 16px; width: 16px; text-align: center; }
.lv-name { font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.lv-pos { font-size: 12px; color: var(--fg-2); white-space: nowrap; }
.lv-spacer { flex: 1; }
.lv-body { flex: 1; display: flex; min-height: 0; }
.lv-stage { flex: 1; min-width: 0; display: flex; align-items: center; justify-content: center; padding: var(--space-3); overflow: hidden; }
.lv-stage canvas, .lv-stage video, .lv-stage img { max-width: 100%; max-height: 100%; object-fit: contain; }
.lv-preview { filter: blur(2px); width: 60%; }
.lv-msg { color: var(--fg-1); }
.lv-info { width: 260px; flex-shrink: 0; overflow-y: auto; padding: var(--space-3); border-left: 1px solid var(--bg-2); background: var(--bg-1); font-size: 12px; }
.lv-info[hidden] { display: none; }
.lv-info-title { font-size: 13px; margin: 0 0 var(--space-2); }
.lv-info dl { margin: 0; display: grid; grid-template-columns: auto 1fr; gap: 4px var(--space-2); }
.lv-info dt { color: var(--fg-2); }
.lv-info dd { margin: 0; overflow-wrap: anywhere; }

/* Storage panel */
.lib-storage-list { display: grid; grid-template-columns: auto 1fr; gap: 6px var(--space-4); margin: var(--space-3) 0; }
.lib-storage-list dt { color: var(--fg-2); }
.lib-storage-list dd { margin: 0; }
.lib-storage-files { display: flex; flex-direction: column; align-items: flex-start; gap: var(--space-1); }
.lib-storage-confirm[hidden], .lib-storage [data-s="footer"][hidden] { display: none; }

@media (max-width: 760px) {
  .lib-side { width: 170px; }
  .lv-info { width: 200px; }
}


/* ui/library/organise.css */
/* ── Library organise: action bar, dialogs, menus, undo toast ─────────────── */

.org-bar {
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: var(--space-1);
  min-width: 0;
}
.org-bar .btn { padding: var(--space-1) var(--space-2); font-size: 12px; }
.org-bar .btn[disabled] { opacity: 0.45; cursor: default; background: none; }
.org-bar .btn[aria-pressed="true"] { color: var(--accent); }
.org-bar .btn-danger[disabled] { background: none; color: var(--fg-2); }
.org-count { font-size: 12px; color: var(--fg-1); padding: 0 var(--space-2); white-space: nowrap; }

.org-dialog { width: min(440px, 95vw); }
.org-body { display: flex; flex-direction: column; gap: var(--space-3); }
.org-text { margin: 0; color: var(--fg-1); }
.org-form { display: flex; flex-direction: column; gap: var(--space-2); }
.org-label { display: flex; flex-direction: column; gap: var(--space-1); font-size: 12px; color: var(--fg-1); }
.org-row { display: flex; gap: var(--space-2); align-items: center; }
.org-input { flex: 1; min-width: 0; padding: var(--space-2); }

.org-chips, .org-suggest { display: flex; flex-wrap: wrap; gap: var(--space-1); }
.org-chip {
  display: inline-flex;
  align-items: center;
  gap: var(--space-1);
  padding: 2px var(--space-2);
  border: 1px solid var(--bg-3);
  border-radius: 999px;
  background: var(--bg-2);
  color: var(--fg-0);
  font-size: 12px;
}
.org-chip small { color: var(--fg-2); }
.org-chip-x { color: var(--fg-1); font-size: 14px; line-height: 1; padding: 0 2px; border-radius: var(--radius-sm); }
.org-chip-x:hover { color: var(--danger); }
.org-chip-add { background: none; color: var(--fg-1); }
.org-chip-add:hover { background: var(--bg-2); color: var(--fg-0); }

.org-albums {
  list-style: none;
  margin: 0;
  padding: 0;
  max-height: 240px;
  overflow-y: auto;
  display: flex;
  flex-direction: column;
  gap: 2px;
}
.org-album { width: 100%; justify-content: space-between; }
.org-album small { color: var(--fg-2); }

.org-menu {
  position: fixed;
  z-index: 300;
  min-width: 180px;
  display: flex;
  flex-direction: column;
  padding: var(--space-1);
  background: var(--bg-1);
  border: 1px solid var(--bg-3);
  border-radius: var(--radius-md);
  box-shadow: 0 8px 24px rgba(0, 0, 0, 0.35);
}
.org-menu-item {
  text-align: left;
  padding: var(--space-1) var(--space-3);
  border-radius: var(--radius-sm);
  font-size: 12px;
  color: var(--fg-0);
}
.org-menu-item:hover, .org-menu-item:focus { background: var(--bg-2); outline: none; }
.org-menu-item.org-danger { color: var(--danger); }

.org-toast { pointer-events: auto; }
.org-undo { padding: 2px var(--space-2); font-size: 12px; color: var(--accent); }


/* ui/theme.css */
/* ── Color tokens ─────────────────────────────────────────────────────────── */

:root {
  color-scheme: dark light;

  /* Spacing */
  --space-1: 4px;
  --space-2: 8px;
  --space-3: 12px;
  --space-4: 16px;
  --space-5: 24px;
  --space-6: 32px;
  --space-7: 48px;
  --space-8: 64px;

  /* Radius */
  --radius-sm: 4px;
  --radius-md: 8px;
  --radius-lg: 12px;

  /* Motion */
  --dur-micro:  120ms;
  --dur-panel:  200ms;
  --dur-modal:  300ms;
  --ease:       cubic-bezier(0.25, 0, 0.25, 1);
}

/* ── Dark theme (default) ───────────────────────────────────────────────── */

:root, [data-theme="dark"] {
  --bg-0: #111113;
  --bg-1: #18181b;
  --bg-2: #27272a;
  --bg-3: #3f3f46;

  --fg-0: #fafafa;
  --fg-1: #a1a1aa;
  --fg-2: #71717a;

  --accent:          #3b82f6;
  --accent-hover:    #2563eb;
  --accent-contrast: #ffffff;

  --danger: #ef4444;
  --warn:   #f59e0b;
  --ok:     #22c55e;

  --selection:        rgba(59, 130, 246, 0.35);
  --selection-border: #3b82f6;
  --selection-handle: #ffffff;

  --ruler-bg:    #18181b;
  --ruler-tick:  #52525b;
  --ruler-label: #71717a;

  --thumb-bg:       #18181b;
  --thumb-border:   #3f3f46;
  --thumb-active:   #3b82f6;

  --overlay-backdrop: rgba(0,0,0,0.6);
}

/* ── Light theme ─────────────────────────────────────────────────────────── */

[data-theme="light"] {
  --bg-0: #ffffff;
  --bg-1: #f4f4f5;
  --bg-2: #e4e4e7;
  --bg-3: #d4d4d8;

  --fg-0: #09090b;
  --fg-1: #52525b;
  --fg-2: #a1a1aa;

  --accent:          #2563eb;
  --accent-hover:    #1d4ed8;
  --accent-contrast: #ffffff;

  --danger: #dc2626;
  --warn:   #d97706;
  --ok:     #16a34a;

  --selection:        rgba(37, 99, 235, 0.25);
  --selection-border: #2563eb;
  --selection-handle: #1d4ed8;

  --ruler-bg:    #f4f4f5;
  --ruler-tick:  #a1a1aa;
  --ruler-label: #71717a;

  --thumb-bg:       #f4f4f5;
  --thumb-border:   #d4d4d8;
  --thumb-active:   #2563eb;

  --overlay-backdrop: rgba(0,0,0,0.4);
}

/* ── System preference auto-switch ──────────────────────────────────────── */

@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
    --bg-0: #ffffff;
    --bg-1: #f4f4f5;
    --bg-2: #e4e4e7;
    --bg-3: #d4d4d8;
    --fg-0: #09090b;
    --fg-1: #52525b;
    --fg-2: #a1a1aa;
    --accent: #2563eb;
    --accent-hover: #1d4ed8;
    --accent-contrast: #ffffff;
    --danger: #dc2626;
    --warn: #d97706;
    --ok: #16a34a;
    --selection: rgba(37, 99, 235, 0.25);
    --selection-border: #2563eb;
    --selection-handle: #1d4ed8;
    --ruler-bg: #f4f4f5;
    --ruler-tick: #a1a1aa;
    --ruler-label: #71717a;
    --thumb-bg: #f4f4f5;
    --thumb-border: #d4d4d8;
    --thumb-active: #2563eb;
    --overlay-backdrop: rgba(0,0,0,0.4);
  }
}

/* ── Reduced motion ──────────────────────────────────────────────────────── */

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: 0.01ms !important;
    transition-duration: 0.01ms !important;
  }
}

/* ── Base resets ─────────────────────────────────────────────────────────── */

[hidden] { display: none !important; }

*, *::before, *::after { box-sizing: border-box; }

html, body {
  margin: 0; padding: 0;
  height: 100%;
  overflow: hidden;
  background: var(--bg-0);
  color: var(--fg-0);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  font-size: 13px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}

button {
  font: inherit;
  cursor: pointer;
  border: none;
  background: none;
  padding: 0;
  color: inherit;
}

button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

input, select {
  font: inherit;
  color: inherit;
  background: var(--bg-2);
  border: 1px solid var(--bg-3);
  border-radius: var(--radius-sm);
  padding: var(--space-1) var(--space-2);
}

input:focus, select:focus { outline: 2px solid var(--accent); outline-offset: 1px; }

dialog {
  background: var(--bg-1);
  color: var(--fg-0);
  border: 1px solid var(--bg-3);
  border-radius: var(--radius-lg);
  padding: var(--space-5);
  max-width: min(480px, 95vw);
  box-shadow: 0 24px 48px rgba(0,0,0,0.5);
}

dialog::backdrop { background: var(--overlay-backdrop); }

/* ── Utility classes ──────────────────────────────────────────────────────── */

.visually-hidden {
  position: absolute;
  width: 1px; height: 1px;
  overflow: hidden;
  clip: rect(0,0,0,0);
  white-space: nowrap;
}

.icon {
  display: inline-block;
  width: 16px; height: 16px;
  flex-shrink: 0;
  fill: none;
  stroke: currentColor;
  stroke-width: 1.5;
  stroke-linecap: round;
  stroke-linejoin: round;
  pointer-events: none;
}

.icon-sm { width: 14px; height: 14px; }
.icon-lg { width: 20px; height: 20px; }

.btn {
  display: inline-flex;
  align-items: center;
  gap: var(--space-2);
  padding: var(--space-2) var(--space-3);
  border-radius: var(--radius-sm);
  font-size: 13px;
  font-weight: 500;
  transition: background var(--dur-micro) var(--ease), color var(--dur-micro) var(--ease);
  white-space: nowrap;
}

.btn:hover { background: var(--bg-2); }
.btn:active { background: var(--bg-3); }

.btn-primary {
  background: var(--accent);
  color: var(--accent-contrast);
}
.btn-primary:hover { background: var(--accent-hover); }

.btn-danger {
  background: var(--danger);
  color: #fff;
}

.btn-icon {
  padding: var(--space-2);
  border-radius: var(--radius-sm);
  display: flex;
  align-items: center;
  justify-content: center;
  position: relative;
}

.btn-icon:hover { background: var(--bg-2); }
.btn-icon.active { background: var(--bg-2); color: var(--accent); }
.btn-icon[aria-pressed="true"] { background: var(--bg-2); color: var(--accent); }

.separator {
  width: 1px; height: 20px;
  background: var(--bg-3);
  align-self: center;
  flex-shrink: 0;
}
.separator-h {
  height: 1px; width: 100%;
  background: var(--bg-3);
  margin: var(--space-2) 0;
}

kbd {
  display: inline-block;
  padding: 1px 5px;
  border: 1px solid var(--bg-3);
  border-radius: var(--radius-sm);
  font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  font-size: 11px;
  background: var(--bg-2);
  color: var(--fg-1);
}

</style>

const __m_library_store = (() => {
// The library index store. Two implementations with one async API:
//   idbStore()    IndexedDB database `slate.library`, used in the browser
//   memoryStore() a Map, used by the Node tests and as a last resort
//
// The index is disposable: every row can be rebuilt by rescanning the folders.
// Thumbnails do not live here; they are files in OPFS (thumbs.js).
//
// Object stores (version 1):
//   photos  keyPath 'id', index 'root' on rootId        PhotoRecord rows (schema.js)
//   roots   keyPath 'id'                                 { id, name, handle, mode, added, lastScan }
//   kv      out-of-line keys                             small values: browse-only library files, settings
//
// API (all async):
//   putPhotos(records)          upsert many, one transaction
//   deletePhotos(ids)           delete many, one transaction
//   allPhotos()                 every row (getAll; the library keeps them in memory)
//   putRoot(root) / allRoots() / deleteRoot(id)   deleteRoot also deletes that root's photos
//   getKv(key) / setKv(key, value) / deleteKv(key)
//   clear()                     drop every row in every store (rebuild index)
//   estimate()                  { photos, roots } row counts

const DB_NAME = 'slate.library';
const DB_VERSION = 1;

function memoryStore() {
  const photos = new Map();
  const roots = new Map();
  const kv = new Map();
  const clone = (v) => (typeof structuredClone === 'function' ? structuredClone(v) : JSON.parse(JSON.stringify(v)));
  return {
    kind: 'memory',
    async putPhotos(records) { for (const r of records) photos.set(r.id, clone(r)); },
    async deletePhotos(ids) { for (const id of ids) photos.delete(id); },
    async allPhotos() { return [...photos.values()].map(clone); },
    async putRoot(root) { roots.set(root.id, { ...root }); },
    async allRoots() { return [...roots.values()].map(r => ({ ...r })); },
    async deleteRoot(id) {
      roots.delete(id);
      for (const [pid, r] of photos) if (r.rootId === id) photos.delete(pid);
    },
    async getKv(key) { return kv.has(key) ? clone(kv.get(key)) : undefined; },
    async setKv(key, value) { kv.set(key, clone(value)); },
    async deleteKv(key) { kv.delete(key); },
    async clear() { photos.clear(); roots.clear(); kv.clear(); },
    async estimate() { return { photos: photos.size, roots: roots.size }; },
  };
}

function req(r) {
  return new Promise((resolve, reject) => { r.onsuccess = () => resolve(r.result); r.onerror = () => reject(r.error); });
}
function done(tx) {
  return new Promise((resolve, reject) => { tx.oncomplete = () => resolve(); tx.onerror = () => reject(tx.error); tx.onabort = () => reject(tx.error); });
}

async function idbStore(name = DB_NAME) {
  const db = await new Promise((resolve, reject) => {
    const open = indexedDB.open(name, DB_VERSION);
    open.onupgradeneeded = () => {
      const d = open.result;
      if (!d.objectStoreNames.contains('photos')) d.createObjectStore('photos', { keyPath: 'id' }).createIndex('root', 'rootId');
      if (!d.objectStoreNames.contains('roots')) d.createObjectStore('roots', { keyPath: 'id' });
      if (!d.objectStoreNames.contains('kv')) d.createObjectStore('kv');
    };
    open.onsuccess = () => resolve(open.result);
    open.onerror = () => reject(open.error);
    open.onblocked = () => reject(new Error('the library index is open in another Slate tab with an older version'));
  });

  // Large batches are split so one transaction never holds tens of thousands of puts.
  const CHUNK = 2000;
  return {
    kind: 'idb',
    db,
    async putPhotos(records) {
      for (let i = 0; i < records.length; i += CHUNK) {
        const tx = db.transaction('photos', 'readwrite');
        const st = tx.objectStore('photos');
        for (const r of records.slice(i, i + CHUNK)) st.put(r);
        await done(tx);
      }
    },
    async deletePhotos(ids) {
      for (let i = 0; i < ids.length; i += CHUNK) {
        const tx = db.transaction('photos', 'readwrite');
        const st = tx.objectStore('photos');
        for (const id of ids.slice(i, i + CHUNK)) st.delete(id);
        await done(tx);
      }
    },
    async allPhotos() { return req(db.transaction('photos').objectStore('photos').getAll()); },
    async putRoot(root) { const tx = db.transaction('roots', 'readwrite'); tx.objectStore('roots').put(root); await done(tx); },
    async allRoots() { return req(db.transaction('roots').objectStore('roots').getAll()); },
    async deleteRoot(id) {
      const tx = db.transaction(['roots', 'photos'], 'readwrite');
      tx.objectStore('roots').delete(id);
      const idx = tx.objectStore('photos').index('root');
      const keys = await req(idx.getAllKeys(IDBKeyRange.only(id)));
      for (const k of keys) tx.objectStore('photos').delete(k);
      await done(tx);
    },
    async getKv(key) { return req(db.transaction('kv').objectStore('kv').get(key)); },
    async setKv(key, value) { const tx = db.transaction('kv', 'readwrite'); tx.objectStore('kv').put(value, key); await done(tx); },
    async deleteKv(key) { const tx = db.transaction('kv', 'readwrite'); tx.objectStore('kv').delete(key); await done(tx); },
    async clear() {
      const tx = db.transaction(['photos', 'roots', 'kv'], 'readwrite');
      for (const s of ['photos', 'roots', 'kv']) tx.objectStore(s).clear();
      await done(tx);
    },
    async estimate() {
      const tx = db.transaction(['photos', 'roots']);
      return { photos: await req(tx.objectStore('photos').count()), roots: await req(tx.objectStore('roots').count()) };
    },
  };
}

return { DB_NAME, DB_VERSION, memoryStore, idbStore };
})();

    .replace(/&#(\d+);/g, (_, d) => String.fromCodePoint(+d))

const extOf = __m_library_schema.extOf;
