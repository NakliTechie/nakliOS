<style>/* Montella — light by default; a NakliOS theme overrides these tokens (src/theme-early.js). */
:root {
  --bg: #f6f4ef; --panel: #ffffff; --ink: #1f1d1a; --muted: #6f6a62; --line: #e4e0d7; --ruler-bg: #efece5;
  --accent: #c2410c; --accent-soft: #fde7da; --ok: #2f7d4f; --wave: #3c7d65;
  --clip-video: #dbe7f6; --clip-video-bar: #8fb3df; --clip-audio: #d9efe4; --clip-audio-bar: #79b99a;
  --clip-text: #f3e3fa; --clip-text-bar: #c18bd8; --clip-image: #f6ead6; --clip-image-bar: #d6b077;
  --sel: #c2410c; --radius: 8px;
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font: 13px/1.35 Inter, system-ui, -apple-system, "Segoe UI", sans-serif; }
button, input, select, textarea { font: inherit; color: inherit; }
kbd { font: 11px ui-monospace, SFMono-Regular, Menlo, monospace; border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 4px; padding: 0 4px; background: var(--panel); }

#app { display: grid; height: 100vh; grid-template-columns: 250px minmax(0, 1fr) 260px; grid-template-rows: auto minmax(0, 1fr) minmax(170px, 36vh) auto;
  grid-template-areas: "top top top" "bin stage insp" "tl tl tl" "status status status"; }
.top { grid-area: top; display: flex; align-items: center; gap: 8px; padding: 8px 12px; background: var(--panel); border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.brand { font-weight: 800; letter-spacing: .01em; color: var(--accent); font-size: 15px; margin-right: 4px; }
.proj-name { border: 1px solid transparent; background: transparent; border-radius: 6px; padding: 4px 6px; width: 180px; font-weight: 600; }
.proj-name:hover, .proj-name:focus { border-color: var(--line); background: var(--bg); outline: none; }
.grow { flex: 1; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: var(--bg); }
.seg button { border: 0; background: transparent; padding: 5px 10px; cursor: pointer; }
.seg button + button { border-left: 1px solid var(--line); }
.seg button.on { background: var(--accent); color: #fff; }
.btn { border: 1px solid var(--line); background: var(--panel); border-radius: 8px; padding: 5px 11px; cursor: pointer; }
.btn:hover:not(:disabled) { border-color: var(--accent); }
.btn:disabled { opacity: .45; cursor: default; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
.btn.small { padding: 3px 8px; font-size: 12px; }
.btn.round { border-radius: 50%; width: 38px; height: 38px; padding: 0; font-size: 15px; }
.btn.icon { padding: 0 4px; border: 0; background: transparent; font-size: 12px; }

.bin { grid-area: bin; background: var(--panel); border-right: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; }
.bin-head { display: flex; align-items: center; justify-content: space-between; padding: 10px; border-bottom: 1px solid var(--line); }
.bin-list { overflow: auto; flex: 1; padding: 8px; display: flex; flex-direction: column; gap: 6px; }
.bin-item { display: flex; gap: 8px; align-items: center; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); padding: 4px; cursor: pointer; text-align: left; }
.bin-item:hover { border-color: var(--accent); }
.bin-item.missing { opacity: .6; border-style: dashed; }
.bin-thumb { width: 64px; height: 36px; border-radius: 4px; background: #222; flex: none; }
.bin-meta { display: flex; flex-direction: column; min-width: 0; }
.bin-name { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-weight: 600; font-size: 12px; }
.bin-sub { color: var(--muted); font-size: 11px; }
.bin-drop { margin: 8px; padding: 10px; border: 1.5px dashed var(--line); border-radius: 8px; color: var(--muted); font-size: 11px; text-align: center; }
body.dropping .bin-drop, body.dropping .viewer { border-color: var(--accent); background: var(--accent-soft); }

.stage { grid-area: stage; display: flex; flex-direction: column; min-height: 0; min-width: 0; }
.viewer { flex: 1; min-height: 0; position: relative; overflow: hidden; border: 1.5px dashed transparent; }
/* Centred and scaled to fit both ways: absolute with auto margins and both max sizes keeps the canvas's own aspect. */
#screen { position: absolute; inset: 0; margin: auto; width: auto; height: auto; max-width: calc(100% - 24px); max-height: calc(100% - 24px); background: #000; border-radius: 6px; box-shadow: 0 1px 8px rgba(0,0,0,.12); }
.empty { position: absolute; inset: 0; display: flex; flex-direction: column; gap: 6px; align-items: center; justify-content: center; color: #e9e6df; text-align: center; pointer-events: none; }
.empty[hidden] { display: none; }
.empty b { font-size: 16px; }
.transport { display: flex; align-items: center; gap: 6px; padding: 6px 12px; background: var(--panel); border-top: 1px solid var(--line); flex-wrap: wrap; }
.time { font: 12px ui-monospace, SFMono-Regular, Menlo, monospace; color: var(--muted); margin-left: 6px; }
body[data-mode="quick"] .tools { display: none; }

.inspector { grid-area: insp; background: var(--panel); border-left: 1px solid var(--line); overflow: auto; padding: 10px 12px; }
.inspector h3 { margin: 2px 0 4px; font-size: 13px; }
.inspector label { display: grid; grid-template-columns: 92px 1fr auto; align-items: center; gap: 6px; margin: 6px 0; font-size: 12px; }
.inspector label:has(input[type=checkbox]) { grid-template-columns: auto 1fr; }
.inspector label:has(textarea) { grid-template-columns: 1fr; }
.inspector output { font: 11px ui-monospace, Menlo, monospace; color: var(--muted); min-width: 34px; text-align: right; }
.inspector input[type=range] { width: 100%; accent-color: var(--accent); }
.inspector select, .inspector input[type=number], .inspector textarea { border: 1px solid var(--line); border-radius: 6px; padding: 3px 5px; background: var(--bg); width: 100%; }
.inspector .kf { display: flex; flex-wrap: wrap; gap: 4px; align-items: center; margin-top: 8px; font-size: 11px; color: var(--muted); }
.hint { color: var(--muted); font-size: 11px; margin: 2px 0 6px; }

.timeline { grid-area: tl; background: var(--panel); border-top: 1px solid var(--line); min-height: 0; }
.tl { display: flex; flex-direction: column; height: 100%; }
.tl-bar { display: flex; gap: 6px; align-items: center; padding: 4px 8px; border-bottom: 1px solid var(--line); }
.tl-zoom { font-size: 11px; color: var(--muted); min-width: 60px; text-align: center; }
.tl-scroll { flex: 1; overflow: auto; position: relative; }
.tl-content { position: relative; min-height: 100%; }
.tl-ruler { display: block; position: sticky; top: 0; z-index: 3; cursor: pointer; }
.tl-lanes { position: relative; }
.tl-lane { position: relative; height: 54px; border-bottom: 1px solid var(--line); }
.tl-lane.tl-main { height: 62px; background: color-mix(in srgb, var(--accent) 4%, transparent); }
.tl-lane.tl-audio { height: 44px; }
.tl-lane.tl-text { height: 36px; }
.tl-head { position: sticky; left: 0; z-index: 2; width: 112px; height: 100%; background: var(--panel); border-right: 1px solid var(--line); display: flex; align-items: center; gap: 2px; padding: 0 6px; font-size: 11px; font-weight: 600; }
.tl-name { flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tl-clip { position: absolute; top: 4px; bottom: 4px; border-radius: 6px; overflow: hidden; cursor: grab; border: 1.5px solid transparent; display: flex; align-items: flex-start; touch-action: none; }
.tl-clip-video { background: var(--clip-video); border-color: var(--clip-video-bar); }
.tl-clip-image { background: var(--clip-image); border-color: var(--clip-image-bar); }
.tl-clip-audio { background: var(--clip-audio); border-color: var(--clip-audio-bar); }
.tl-clip-text { background: var(--clip-text); border-color: var(--clip-text-bar); }
.tl-clip.sel { border-color: var(--sel); box-shadow: 0 0 0 1.5px var(--sel); }
.tl-clip.dragging { opacity: .8; z-index: 4; }
.tl-clip.has-tin::before { content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 10px; background: linear-gradient(90deg, rgba(0,0,0,.25), transparent); z-index: 1; }
.tl-thumb { height: 100%; width: auto; max-width: 96px; object-fit: cover; opacity: .9; flex: none; pointer-events: none; }
.tl-clip-label { position: relative; z-index: 1; padding: 3px 6px; font-size: 11px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; pointer-events: none; text-shadow: 0 1px 0 rgba(255,255,255,.6); }
.tl-wave { position: absolute; left: 0; bottom: 0; height: 28px; width: 100%; opacity: .75; pointer-events: none; }
.tl-edge { position: absolute; top: 0; bottom: 0; width: 8px; cursor: ew-resize; z-index: 2; }
.tl-edge-l { left: 0; } .tl-edge-r { right: 0; }
.tl-edge:hover { background: color-mix(in srgb, var(--sel) 35%, transparent); }
.tl-playhead { position: absolute; top: 0; bottom: 0; width: 2px; background: var(--accent); z-index: 5; pointer-events: none; }
.tl-playhead::before { content: ''; position: absolute; top: 0; left: -5px; border: 6px solid transparent; border-top-color: var(--accent); }
.tl-add { display: flex; gap: 6px; padding: 6px 120px; }

.status { grid-area: status; padding: 5px 12px; font-size: 12px; color: var(--muted); background: var(--panel); border-top: 1px solid var(--line); min-height: 26px; }
.status[data-kind="err"] { color: #b42318; }

dialog { border: 1px solid var(--line); border-radius: 12px; padding: 16px 18px; min-width: 360px; max-width: 520px; background: var(--panel); color: var(--ink); box-shadow: 0 10px 40px rgba(0,0,0,.2); }
dialog::backdrop { background: rgba(20, 18, 14, .35); }
dialog h3 { margin: 0 0 8px; }
dialog .row { display: flex; gap: 8px; justify-content: flex-end; margin-top: 12px; }
dialog .presets { display: flex; flex-direction: column; gap: 6px; margin: 8px 0; }
dialog .presets label.off { opacity: .5; }
dialog progress { width: 100%; accent-color: var(--accent); }
dialog .list { display: flex; flex-direction: column; gap: 4px; }

@media (max-width: 900px) {
  #app { grid-template-columns: minmax(0, 1fr); grid-template-rows: auto minmax(220px, 1fr) auto minmax(160px, 34vh) auto auto;
    grid-template-areas: "top" "stage" "bin" "tl" "insp" "status"; }
  .bin { border-right: 0; max-height: 120px; } .bin-list { flex-direction: row; } .bin-drop { display: none; }
  .inspector { border-left: 0; max-height: 40vh; }
}

/* Side tabs: media, transcript, chat */
.side-tabs { display: flex; border-bottom: 1px solid var(--line); }
.side-tabs button { flex: 1; border: 0; background: none; padding: 8px 4px; cursor: pointer; color: var(--muted); font: inherit; border-bottom: 2px solid transparent; }
.side-tabs button.on { color: var(--ink); border-bottom-color: var(--accent); font-weight: 600; }
.side-pane { display: flex; flex-direction: column; min-height: 0; flex: 1; }
.side-pane[hidden] { display: none; }
.side-pane.tx, .side-pane.chat { padding: 10px; gap: 8px; overflow: hidden; }
.tx-head, .tx-bar { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.tx-name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tx-words { flex: 1; overflow: auto; line-height: 1.9; border: 1px solid var(--line); border-radius: 8px; padding: 8px; background: var(--bg); outline: none; }
.tx-words:focus-visible { border-color: var(--accent); }
.tx-w { cursor: pointer; border-radius: 3px; padding: 1px 1px; }
.tx-w:hover { background: var(--accent-soft); }
.tx-w.filler { color: var(--accent); }
.tx-w.now { box-shadow: inset 0 -2px 0 var(--accent); }
.tx-w.sel { background: var(--accent); color: #fff; }
.tx-w.cut { text-decoration: line-through; opacity: .45; }
.tx-note { margin: 0; }
.chat-log { flex: 1; overflow: auto; display: flex; flex-direction: column; gap: 8px; }
.chat-user { align-self: flex-end; background: var(--accent-soft); border-radius: 10px 10px 2px 10px; padding: 6px 9px; max-width: 90%; white-space: pre-wrap; }
.chat-assistant { display: flex; flex-direction: column; gap: 4px; align-items: flex-start; }
.chat-tool { font: 11px ui-monospace, SFMono-Regular, Menlo, monospace; color: var(--ok); }
.chat-tool.err { color: var(--accent); }
.chat-reply { white-space: pre-wrap; }
.chat-form { display: flex; gap: 6px; align-items: flex-end; }
.chat-form textarea { flex: 1; resize: vertical; min-height: 38px; border: 1px solid var(--line); border-radius: 8px; padding: 6px 8px; font: inherit; background: var(--panel); color: var(--ink); }
.mix-row { border-top: 1px solid var(--line); padding-top: 6px; margin-top: 6px; }
.mix-row b { font-size: 12px; }
body[data-mode="quick"] .pro-only { display: none; }
.btn.on { border-color: var(--accent); color: var(--accent); }
.scopes { position: absolute; right: 8px; bottom: 8px; border-radius: 6px; box-shadow: 0 2px 10px rgba(0,0,0,.35); image-rendering: pixelated; width: 336px; height: auto; }
.scopes[hidden] { display: none; }
.wheel { display: grid; grid-template-columns: 92px repeat(3, 1fr); gap: 4px; align-items: center; margin: 6px 0; font-size: 12px; }
.wheel input { width: 100%; min-width: 0; }
.wheel .ch-r { accent-color: #d33; } .wheel .ch-g { accent-color: #2a2; } .wheel .ch-b { accent-color: #36d; }
</style>

<script>
// Global error surface: nothing fails silently. Errors are kept for agents and shown in the status bar.
window.__montellaErrors = [];
const report = (msg) => { window.__montellaErrors.push(String(msg)); const s = document.getElementById('status'); if (s) { s.textContent = 'Error: ' + msg; s.dataset.kind = 'err'; } };
addEventListener('error', (e) => report(`${e.message} (${e.filename?.split('/').pop() ?? ''}:${e.lineno})`));
addEventListener('unhandledrejection', (e) => report(e.reason?.message ?? e.reason));
</script>

    <header class="top">
      <div class="brand" title="Montella">Montella</div>
      <input id="proj-name" class="proj-name" aria-label="Project name" value="Untitled">
      <div class="seg" id="mode" role="group" aria-label="Mode">
        <button type="button" data-mode="quick" title="Quick mode: one main track, captions, presets">Quick</button>
        <button type="button" data-mode="pro" title="Pro mode: every track and the precise edits">Pro</button>
      </div>
      <div class="seg" id="aspect" role="group" aria-label="Aspect">
        ${Object.keys($r).map(I=>`<button type="button" data-aspect="${I}" title="Canvas ${I}">${I}</button>`).join("")}
      </div>
      <span class="grow"></span>
      <button type="button" class="btn" id="undo" title="Undo (⌘Z)">↶</button>
      <button type="button" class="btn" id="redo" title="Redo (⇧⌘Z)">↷</button>
      <button type="button" class="btn" id="open" title="Open a project">Open</button>
      <button type="button" class="btn" id="save" title="Save the project (⌘S)">Save</button>
      <button type="button" class="btn primary" id="export" title="Export a video file">Export</button>
    </header>
    <aside class="bin" aria-label="Media, transcript and chat">
      <div class="side-tabs" role="tablist">
        <button type="button" role="tab" data-tab="media" class="on">Media</button>
        <button type="button" role="tab" data-tab="transcript" title="Edit by the words in a clip">Transcript</button>
        <button type="button" role="tab" data-tab="chat" title="Ask for edits in words">Chat</button>
      </div>
      <div class="side-pane" data-pane="media">
        <div class="bin-head"><b>Media</b><button type="button" class="btn small" id="import" title="Add video, audio or images">+ Add</button></div>
        <div class="bin-list" id="bin"></div>
        <div class="bin-drop">Drop video, audio or images here. Files stay on your disk.</div>
      </div>
      <div class="side-pane tx" data-pane="transcript" id="transcript" hidden></div>
      <div class="side-pane chat" data-pane="chat" id="chat" hidden></div>
    </aside>
    <section class="stage" aria-label="Preview">
      <div class="viewer"><canvas id="screen" aria-label="Preview"></canvas><canvas id="scopes" class="scopes" hidden aria-label="Waveform and vectorscope"></canvas><div class="empty" id="empty">
        <b>Start a video</b><span>Add clips with <kbd>+ Add</kbd> or drop files here, then press <kbd>Space</kbd> to play.</span>
      </div></div>
      <div class="transport">
        <button type="button" class="btn" id="back" title="Previous frame (←)">⏮</button>
        <button type="button" class="btn primary round" id="play" title="Play or pause (Space)">▶</button>
        <button type="button" class="btn" id="fwd" title="Next frame (→)">⏭</button>
        <span class="time" id="time">0:00.00 / 0:00.00</span>
        <span class="grow"></span>
        <div class="seg tools" id="tools" role="group" aria-label="Edit tool">
          <button type="button" data-tool="select" title="Select and trim (V)">Select</button>
          <button type="button" data-tool="ripple" title="Ripple trim: later clips follow (B)">Ripple</button>
          <button type="button" data-tool="roll" title="Roll the cut between two clips (N)">Roll</button>
          <button type="button" data-tool="slip" title="Slip the source inside the clip (Y)">Slip</button>
          <button type="button" data-tool="slide" title="Slide the clip between its neighbours (U)">Slide</button>
        </div>

        <button type="button" class="btn" id="split" title="Split at the playhead (S)">Split</button>
        <button type="button" class="btn" id="addtext" title="Add text at the playhead (T)">Text</button>
        <button type="button" class="btn" id="marker" title="Add a marker (M)">Marker</button>
        <button type="button" class="btn" id="del" title="Delete the selected clip (Delete)">Delete</button>
      </div>
    </section>
    <aside class="inspector" id="inspector" aria-label="Clip settings"></aside>
    <section class="timeline" id="timeline" aria-label="Timeline"></section>
    <footer class="status" id="status" role="status"></footer>
    <input type="file" id="file-in" multiple accept="video/*,audio/*,image/*,.mp4,.mov,.webm,.mkv,.m4v,.mp3,.wav,.m4a,.ogg,.opus,.flac" hidden>
