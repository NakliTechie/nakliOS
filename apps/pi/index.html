<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pi</title>
<script src="../../sdk/naklios.js"></script>
<style>
  :root { --bg:#fbfaf7; --panel:#ffffff; --ink:#1d1b18; --muted:#6b665e; --line:#e4e0d8; --brand:#3b5bdb; --ok:#2b8a3e; --bad:#c92a2a; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:14px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; display:flex; flex-direction:column; height:100vh; }
  header { padding:10px 16px; border-bottom:1px solid var(--line); display:flex; gap:10px; align-items:baseline; }
  header b { font-size:15px; } header span { color:var(--muted); font-size:12px; }
  #log { flex:1; overflow:auto; padding:16px; display:flex; flex-direction:column; gap:10px; }
  .msg { max-width:760px; padding:10px 12px; border:1px solid var(--line); border-radius:8px; background:var(--panel); white-space:pre-wrap; word-break:break-word; }
  .you { align-self:flex-end; background:#eef2ff; border-color:#d0d9ff; }
  .sys { color:var(--muted); font-size:12px; border-style:dashed; }
  .err { color:var(--bad); border-color:#f3c4c4; }
  form { display:flex; gap:8px; padding:12px 16px; border-top:1px solid var(--line); background:var(--panel); }
  textarea { flex:1; resize:none; height:56px; padding:8px; border:1px solid var(--line); border-radius:6px; font:inherit; }
  button { padding:0 16px; border:0; border-radius:6px; background:var(--brand); color:#fff; font:inherit; cursor:pointer; }
  button:disabled { opacity:.5; cursor:default; }
  .tool { max-width:760px; border:1px solid var(--line); border-radius:8px; background:#f6f5f1; font-size:12px; }
  .tool summary { padding:6px 10px; cursor:pointer; color:var(--ink); }
  .tool summary code { font:12px ui-monospace, SFMono-Regular, Menlo, monospace; }
  .tool .state { color:var(--muted); margin-left:6px; }
  .tool pre { margin:0; padding:6px 10px; border-top:1px solid var(--line); white-space:pre-wrap; word-break:break-word; font:11px/1.45 ui-monospace, SFMono-Regular, Menlo, monospace; max-height:220px; overflow:auto; }
  .working { color:var(--muted); font-size:12px; }
</style>
</head>
<body>
<header><b>Pi</b><span>pi-durable 1.4.0 in a Worker · model calls go through NakliOS AI</span></header>
<div id="log"></div>
<form id="f"><textarea id="q" placeholder="Ask Pi to do something in /workspace"></textarea><button id="send">Send</button></form>
<script type="module">
import { CrateBackend } from '../../sys/rig/fileops/crate-backend.mjs';
import { createOpfsBackend, opfsAvailable } from '../../sys/rig/fileops/opfs.mjs';
import { MemoryBackend } from '../../sys/rig/fileops/memory-backend.mjs';
import { describeBackend, serveBackend } from '../../sys/rig/fileops/remote-backend.mjs';
const log = document.getElementById('log');
const q = document.getElementById('q');
const send = document.getElementById('send');
const add = (cls, text) => { const d = document.createElement('div'); d.className = 'msg ' + cls; d.textContent = text; log.appendChild(d); log.scrollTop = log.scrollHeight; return d; };

const worker = new Worker('./pi-worker.js', { type: 'module' });
worker.addEventListener('error', (e) => add('err', 'Worker error: ' + (e.message || 'failed to load')));

let nextId = 1;
const waiting = new Map();
const request = (msg) => new Promise((resolve) => { const id = nextId++; waiting.set(id, resolve); worker.postMessage({ ...msg, id }); });
const status = add('sys', 'Starting Pi…');
const trace = []; // every broker round trip, for live checks

// Tool cards: one per tool call the model makes, filled with its result when the next request
// carries it back (the tool runs in the Worker; its result reaches the page in that request).
const toolCards = new Map(); // tool_call_id → { card, state, out }
const brief = (s, n = 90) => { s = String(s ?? '').replace(/\s+/g, ' ').trim(); return s.length > n ? s.slice(0, n - 1) + '…' : s; };
function addToolCard(call) {
  const name = call.function?.name || call.name || 'tool';
  let args = call.function?.arguments ?? call.arguments ?? '';
  if (typeof args !== 'string') args = JSON.stringify(args);
  let shown = args; try { const a = JSON.parse(args); shown = a.command || a.path || a.pattern || a.query || args; } catch (_) {}
  const card = document.createElement('details'); card.className = 'tool';
  const sum = document.createElement('summary');
  sum.append(Object.assign(document.createElement('code'), { textContent: name + ' ' + brief(shown) }));
  const state = Object.assign(document.createElement('span'), { className: 'state', textContent: 'running…' });
  sum.append(state); card.append(sum);
  card.append(Object.assign(document.createElement('pre'), { textContent: args }));
  const out = Object.assign(document.createElement('pre'), { textContent: '' }); out.hidden = true; card.append(out);
  log.appendChild(card); log.scrollTop = log.scrollHeight;
  toolCards.set(call.id || ('card-' + toolCards.size + '-' + Date.now()), { card, state, out });
}
// When a run settles, a card whose result never came back (no call id, a step limit, an error) says so.
function closeToolCards() {
  for (const c of toolCards.values()) { if (c.state.textContent === 'running…') c.state.textContent = 'no result'; }
  toolCards.clear();
}
function fillToolResults(messages) {
  for (const m of messages || []) {
    if (m.role !== 'tool' || !toolCards.has(m.tool_call_id)) continue;
    const c = toolCards.get(m.tool_call_id); toolCards.delete(m.tool_call_id);
    const text = typeof m.content === 'string' ? m.content : JSON.stringify(m.content);
    c.state.textContent = /^(error|Error)\b/.test(text) ? 'failed' : 'done';
    c.out.textContent = text.length > 4000 ? text.slice(0, 4000) + '\n…' : text; c.out.hidden = false;
  }
}
let lastLive = null; // the bubble the final reply streamed into

// Where Pi's files and conversations live, Anvil's order: the host's connected Folder or Crate through
// naklios.fs (files appear under apps/pi/ in the Files app), else browser storage (OPFS), else memory.
// The Worker reaches it only through {type:'fs'} messages served here.
const nak = window.naklios || null;
async function waitForFsCaps(timeoutMs = 1200) {
  if (!nak || !nak.capabilities) return;
  const t0 = Date.now();
  while (Date.now() - t0 < timeoutMs) { if (nak.capabilities.fs) return; await new Promise((r) => setTimeout(r, 80)); }
}
async function chooseStorage() {
  await waitForFsCaps();
  if (nak?.capabilities?.fs && nak.fs) {
    // The first write asks NakliOS for storage. The host holds the call until you answer its
    // "Allow Pi?" prompt (the SDK's clock stops), so Pi waits for the answer instead of falling
    // back to browser storage while the prompt is open (live 2026-10-29); the status line says so.
    const waitNote = setTimeout(() => { status.textContent = 'Waiting for you to allow Pi\'s storage in NakliOS…'; }, 1500);
    try {
      const backend = new CrateBackend(nak.fs);
      // Round-trip probe: commit to the host fs only if a write reads back.
      await backend.write('.pi-probe', new TextEncoder().encode('ok'));
      const back = new TextDecoder().decode(await backend.readBinary('.pi-probe'));
      await backend.delete('.pi-probe').catch(() => {});
      if (back === 'ok') {
        const raw = nak.capabilities.fsBackend || 'host';
        return { backend, label: (raw === 'fsa' ? 'your Folder' : raw === 'crate' ? 'Crate' : 'NakliOS storage') + ' (apps/pi)' };
      }
    } catch (_) { /* fall through to browser storage */ }
    finally { clearTimeout(waitNote); }
  }
  if (opfsAvailable()) {
    try { return { backend: await createOpfsBackend({ path: 'pi' }), label: 'browser storage' }; } catch (_) {}
  }
  return { backend: new MemoryBackend(), label: 'memory only — files are lost on reload' };
}
const storage = await chooseStorage();
const serveStorage = serveBackend(storage.backend);
worker.postMessage({ type: 'init', backend: describeBackend(storage.backend) });

worker.onmessage = async (event) => {
  const msg = event.data || {};
  if (msg.type === 'ready') {
    // Redraw the saved conversation after a reload, above the ready line.
    for (const row of msg.transcript || []) log.insertBefore(Object.assign(document.createElement('div'), { className: 'msg ' + (row.role === 'assistant' ? '' : row.role), textContent: row.text }), status);
    status.textContent = `Pi is ready. Files and conversations are saved in ${storage.label}.`;
    log.scrollTop = log.scrollHeight;
    return;
  }
  if (msg.type === 'fs') { worker.postMessage({ type: 'fs-reply', id: msg.id, result: await serveStorage(msg.method, msg.args) }); return; }
  if (msg.type === 'skills') {
    // The NakliOS skills library; an empty library when the host has none to offer.
    try {
      const lib = nak && nak.experimental_skills;
      const result = !lib ? (msg.op === 'list' ? [] : null)
        : msg.op === 'list' ? await lib.list() : await lib.read(msg.name);
      if (msg.op === 'read' && result) add('sys', 'Skill loaded: ' + result.name);
      worker.postMessage({ type: 'skills-reply', id: msg.id, result });
    } catch (e) {
      worker.postMessage({ type: 'skills-reply', id: msg.id, result: msg.op === 'list' ? [] : null });
    }
    return;
  }
  if (msg.type === 'fatal') { status.className = 'msg err'; status.textContent = 'Pi failed to start: ' + msg.error; return; }
  if (msg.type === 'broker') {
    const t0 = performance.now();
    const entry = { tools: (msg.request.tools || []).length };
    trace.push(entry);
    try {
      const ai = window.naklios && window.naklios.ai;
      if (!ai) throw new Error('Pi needs the NakliOS host: open it inside NakliOS and choose a model in Settings → AI.');
      fillToolResults(msg.request.messages);
      // Stream the reply into the window as it arrives; a "thinking" line counts the wait until the
      // first text. The Worker still gets one whole completion, assembled the way the SDK does it.
      const working = add('sys working', 'Pi is thinking…');
      const tick = setInterval(() => { working.textContent = `Pi is thinking… ${Math.round((performance.now() - t0) / 1000)} s`; }, 1000);
      let content = '', toolCalls = null, finishReason = 'stop', usage = null, model = null, live = null;
      try {
        const stream = await ai.chat.completions.create({ ...msg.request, agent: true, stream: true });
        for await (const chunk of stream) {
          const choice = chunk.choices && chunk.choices[0];
          if (choice?.delta?.content) {
            content += choice.delta.content;
            if (!live) { working.remove(); live = add('', ''); }
            live.textContent = content; log.scrollTop = log.scrollHeight;
          }
          if (choice?.delta?.tool_calls) toolCalls = choice.delta.tool_calls;
          if (choice?.finish_reason) finishReason = choice.finish_reason;
          if (chunk.usage) usage = chunk.usage;
          if (chunk.model) model = chunk.model;
        }
      } finally { clearInterval(tick); working.remove(); }
      const message = { role: 'assistant', content };
      if (toolCalls) message.tool_calls = toolCalls;
      const completion = { id: 'naklios-local', object: 'chat.completion', model: model || 'localmind', choices: [{ index: 0, message, finish_reason: finishReason }], usage };
      entry.ms = Math.round(performance.now() - t0);
      entry.toolCalls = (toolCalls || []).map((c) => c.function?.name);
      for (const c of toolCalls || []) addToolCard(c);
      lastLive = toolCalls && toolCalls.length ? null : live;
      worker.postMessage({ type: 'broker-reply', id: msg.id, completion });
    } catch (e) {
      entry.err = String(e?.message || e);
      worker.postMessage({ type: 'broker-reply', id: msg.id, error: entry.err });
    }
    return;
  }
  const resolve = waiting.get(msg.id);
  if (resolve) { waiting.delete(msg.id); resolve(msg); }
};

async function ask(text) {
  add('you', text);
  lastLive = null;
  const r = await request({ type: 'ask', text });
  if (r.error) { closeToolCards(); add('err', r.error); return r; }
  const s = r.settled || {};
  closeToolCards();
  // The final reply already streamed into its bubble: that bubble takes the Worker's answer text
  // (which may differ from the raw stream), so the reply is never shown twice.
  if (s.status === 'done') { if (lastLive) { lastLive.textContent = r.answer || lastLive.textContent || '(no text)'; lastLive = null; } else add('', r.answer || '(no text)'); }
  else add('err', 'Pi did not answer: ' + JSON.stringify(s).slice(0, 400));
  return r;
}
// Test seam for live checks; read-only besides ask.
window.__pi = { ask, read: (path) => request({ type: 'read', path }), trace, storage: storage.label };

document.getElementById('f').addEventListener('submit', async (e) => {
  e.preventDefault();
  const text = q.value.trim();
  if (!text) return;
  q.value = ''; send.disabled = true;
  try { await ask(text); } finally { send.disabled = false; q.focus(); }
});
q.addEventListener('keydown', (e) => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); document.getElementById('f').requestSubmit(); } });
</script>
</body>
</html>
