<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pi</title>
<script src="../../sdk/naklios.js"></script>
<style>
  :root { --bg:#fbfaf7; --panel:#ffffff; --ink:#1d1b18; --muted:#6b665e; --line:#e4e0d8; --brand:#3b5bdb; --ok:#2b8a3e; --bad:#c92a2a; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:14px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; display:flex; flex-direction:column; height:100vh; }
  header { padding:10px 16px; border-bottom:1px solid var(--line); display:flex; gap:10px; align-items:baseline; }
  header b { font-size:15px; } header span { color:var(--muted); font-size:12px; }
  #log { flex:1; overflow:auto; padding:16px; display:flex; flex-direction:column; gap:10px; }
  .msg { max-width:760px; padding:10px 12px; border:1px solid var(--line); border-radius:8px; background:var(--panel); white-space:pre-wrap; word-break:break-word; }
  .you { align-self:flex-end; background:#eef2ff; border-color:#d0d9ff; }
  .sys { color:var(--muted); font-size:12px; border-style:dashed; }
  .err { color:var(--bad); border-color:#f3c4c4; }
  form { display:flex; gap:8px; padding:12px 16px; border-top:1px solid var(--line); background:var(--panel); }
  textarea { flex:1; resize:none; height:56px; padding:8px; border:1px solid var(--line); border-radius:6px; font:inherit; }
  button { padding:0 16px; border:0; border-radius:6px; background:var(--brand); color:#fff; font:inherit; cursor:pointer; }
  button:disabled { opacity:.5; cursor:default; }
  .tool { max-width:760px; border:1px solid var(--line); border-radius:8px; background:#f6f5f1; font-size:12px; }
  .tool summary { padding:6px 10px; cursor:pointer; color:var(--ink); }
  .tool summary code { font:12px ui-monospace, SFMono-Regular, Menlo, monospace; }
  .tool .state { color:var(--muted); margin-left:6px; }
  .tool pre { margin:0; padding:6px 10px; border-top:1px solid var(--line); white-space:pre-wrap; word-break:break-word; font:11px/1.45 ui-monospace, SFMono-Regular, Menlo, monospace; max-height:220px; overflow:auto; }
  .working { color:var(--muted); font-size:12px; }
  header { align-items:center; }
  header .grow { flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .ghost { background:transparent; color:var(--ink); border:1px solid var(--line); padding:4px 10px; font-size:13px; height:30px; }
  .ghost:hover { background:#f1efe9; }
  #list { flex:1; overflow:auto; padding:16px; display:flex; flex-direction:column; gap:8px; }
  #list[hidden], #log[hidden], #f[hidden], header button[hidden] { display:none; }
  .conv { max-width:760px; width:100%; text-align:left; background:var(--panel); color:var(--ink); border:1px solid var(--line); border-radius:8px; padding:10px 12px; display:flex; gap:10px; align-items:baseline; }
  .conv:hover { border-color:var(--brand); }
  .conv .n { color:var(--muted); font-size:12px; min-width:1.5em; }
  .conv .t { flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .conv .when { color:var(--muted); font-size:12px; white-space:nowrap; }
  .conv.on { border-color:#d0d9ff; background:#eef2ff; }
  .hint { color:var(--muted); font-size:12px; max-width:760px; }
  body { position:relative; }
  #cmds { position:absolute; left:16px; bottom:76px; background:var(--panel); border:1px solid var(--line); border-radius:8px; box-shadow:0 4px 16px rgba(0,0,0,.08); min-width:300px; max-width:calc(100% - 32px); padding:4px; }
  #cmds[hidden] { display:none; }
  #cmds div { padding:5px 8px; border-radius:5px; cursor:pointer; font-size:13px; }
  #cmds div.sel, #cmds div:hover { background:#eef2ff; }
  #cmds code { font:12px ui-monospace, SFMono-Regular, Menlo, monospace; margin-right:8px; }
  #cmds span { color:var(--muted); }
</style>
</head>
<body>
<header>
  <button id="back" class="ghost" type="button" title="All conversations (/resume)" hidden>← Conversations</button>
  <b>Pi</b><span class="grow" id="title">pi-durable 1.5.2 in a Worker · model calls go through NakliOS AI</span>
  <button id="newbtn" class="ghost" type="button" title="Start a new conversation (/new)">+ New</button>
</header>
<div id="list" hidden></div>
<div id="log"></div>
<div id="cmds" hidden></div>
<form id="f"><textarea id="q" placeholder="Ask Pi to do something in /workspace · type / for commands"></textarea><button id="send">Send</button></form>
<script type="module">
import { CrateBackend } from '../../sys/rig/fileops/crate-backend.mjs';
import { createOpfsBackend, opfsAvailable } from '../../sys/rig/fileops/opfs.mjs';
import { MemoryBackend } from '../../sys/rig/fileops/memory-backend.mjs';
import { describeBackend, serveBackend } from '../../sys/rig/fileops/remote-backend.mjs';
const log = document.getElementById('log');
const q = document.getElementById('q');
const send = document.getElementById('send');
const add = (cls, text) => { const d = document.createElement('div'); d.className = 'msg ' + cls; d.textContent = text; log.appendChild(d); log.scrollTop = log.scrollHeight; return d; };

const worker = new Worker('./pi-worker.js', { type: 'module' });
worker.addEventListener('error', (e) => add('err', 'Worker error: ' + (e.message || 'failed to load')));

let nextId = 1;
const waiting = new Map();
const request = (msg) => new Promise((resolve) => { const id = nextId++; waiting.set(id, resolve); worker.postMessage({ ...msg, id }); });
const status = add('sys', 'Starting Pi…');
const trace = []; // every broker round trip, for live checks

// Tool cards: one per tool call the model makes, filled with its result when the next request
// carries it back (the tool runs in the Worker; its result reaches the page in that request).
const toolCards = new Map(); // tool_call_id → { card, state, out }
const brief = (s, n = 90) => { s = String(s ?? '').replace(/\s+/g, ' ').trim(); return s.length > n ? s.slice(0, n - 1) + '…' : s; };
function addToolCard(call) {
  const name = call.function?.name || call.name || 'tool';
  let args = call.function?.arguments ?? call.arguments ?? '';
  if (typeof args !== 'string') args = JSON.stringify(args);
  let shown = args; try { const a = JSON.parse(args); shown = a.command || a.path || a.pattern || a.query || args; } catch (_) {}
  const card = document.createElement('details'); card.className = 'tool';
  const sum = document.createElement('summary');
  sum.append(Object.assign(document.createElement('code'), { textContent: name + ' ' + brief(shown) }));
  const state = Object.assign(document.createElement('span'), { className: 'state', textContent: 'running…' });
  sum.append(state); card.append(sum);
  card.append(Object.assign(document.createElement('pre'), { textContent: args }));
  const out = Object.assign(document.createElement('pre'), { textContent: '' }); out.hidden = true; card.append(out);
  log.appendChild(card); log.scrollTop = log.scrollHeight;
  toolCards.set(call.id || ('card-' + toolCards.size + '-' + Date.now()), { card, state, out });
}
// When a run settles, a card whose result never came back (no call id, a step limit, an error) says so.
function closeToolCards() {
  for (const c of toolCards.values()) { if (c.state.textContent === 'running…') c.state.textContent = 'no result'; }
  toolCards.clear();
}
function fillToolResults(messages) {
  for (const m of messages || []) {
    if (m.role !== 'tool' || !toolCards.has(m.tool_call_id)) continue;
    const c = toolCards.get(m.tool_call_id); toolCards.delete(m.tool_call_id);
    const text = typeof m.content === 'string' ? m.content : JSON.stringify(m.content);
    c.state.textContent = /^(error|Error)\b/.test(text) ? 'failed' : 'done';
    c.out.textContent = text.length > 4000 ? text.slice(0, 4000) + '\n…' : text; c.out.hidden = false;
  }
}
let lastLive = null; // the bubble the final reply streamed into

// Where Pi's files and conversations live, Anvil's order: the host's connected Folder or Crate through
// naklios.fs (files appear under apps/pi/ in the Files app), else browser storage (OPFS), else memory.
// The Worker reaches it only through {type:'fs'} messages served here.
const nak = window.naklios || null;
async function waitForFsCaps(timeoutMs = 1200) {
  if (!nak || !nak.capabilities) return;
  const t0 = Date.now();
  while (Date.now() - t0 < timeoutMs) { if (nak.capabilities.fs) return; await new Promise((r) => setTimeout(r, 80)); }
}
async function chooseStorage() {
  await waitForFsCaps();
  if (nak?.capabilities?.fs && nak.fs) {
    // The first write asks NakliOS for storage. The host holds the call until you answer its
    // "Allow Pi?" prompt (the SDK's clock stops), so Pi waits for the answer instead of falling
    // back to browser storage while the prompt is open (live 2026-10-29); the status line says so.
    const waitNote = setTimeout(() => { status.textContent = 'Waiting for you to allow Pi\'s storage in NakliOS…'; }, 1500);
    try {
      const backend = new CrateBackend(nak.fs);
      // Round-trip probe: commit to the host fs only if a write reads back.
      await backend.write('.pi-probe', new TextEncoder().encode('ok'));
      const back = new TextDecoder().decode(await backend.readBinary('.pi-probe'));
      await backend.delete('.pi-probe').catch(() => {});
      if (back === 'ok') {
        const raw = nak.capabilities.fsBackend || 'host';
        return { backend, label: (raw === 'fsa' ? 'your Folder' : raw === 'crate' ? 'Crate' : 'NakliOS storage') + ' (apps/pi)' };
      }
    } catch (_) { /* fall through to browser storage */ }
    finally { clearTimeout(waitNote); }
  }
  if (opfsAvailable()) {
    try { return { backend: await createOpfsBackend({ path: 'pi' }), label: 'browser storage' }; } catch (_) {}
  }
  return { backend: new MemoryBackend(), label: 'memory only — files are lost on reload' };
}
const storage = await chooseStorage();
const serveStorage = serveBackend(storage.backend);
worker.postMessage({ type: 'init', backend: describeBackend(storage.backend) });

worker.onmessage = async (event) => {
  const msg = event.data || {};
  if (msg.type === 'ready') {
    status.textContent = `Pi is ready. Files and conversations are saved in ${storage.label}. Type / for commands.`;
    setConversations(msg.conversations, msg.active);
    drawTranscript(msg.transcript);
    // With more than one conversation Pi opens on the list, so you choose where to continue.
    if ((msg.conversations || []).length > 1) showList(); else showChat();
    void loadSkillCmds();
    return;
  }
  if (msg.type === 'fs') { worker.postMessage({ type: 'fs-reply', id: msg.id, result: await serveStorage(msg.method, msg.args) }); return; }
  if (msg.type === 'skills') {
    // The NakliOS skills library; an empty library when the host has none to offer.
    try {
      const lib = nak && nak.experimental_skills;
      const result = !lib ? (msg.op === 'list' ? [] : null)
        : msg.op === 'list' ? await lib.list() : await lib.read(msg.name);
      if (msg.op === 'read' && result) add('sys', 'Skill loaded: ' + result.name);
      worker.postMessage({ type: 'skills-reply', id: msg.id, result });
    } catch (e) {
      worker.postMessage({ type: 'skills-reply', id: msg.id, result: msg.op === 'list' ? [] : null });
    }
    return;
  }
  if (msg.type === 'fatal') { status.className = 'msg err'; status.textContent = 'Pi failed to start: ' + msg.error; return; }
  if (msg.type === 'broker') {
    const t0 = performance.now();
    const entry = { tools: (msg.request.tools || []).length };
    trace.push(entry);
    try {
      const ai = window.naklios && window.naklios.ai;
      if (!ai) throw new Error('Pi needs the NakliOS host: open it inside NakliOS and choose a model in Settings → AI.');
      fillToolResults(msg.request.messages);
      // Stream the reply into the window as it arrives; a "thinking" line counts the wait until the
      // first text. The Worker still gets one whole completion, assembled the way the SDK does it.
      const working = add('sys working', 'Pi is thinking…');
      const tick = setInterval(() => { working.textContent = `Pi is thinking… ${Math.round((performance.now() - t0) / 1000)} s`; }, 1000);
      let content = '', toolCalls = null, finishReason = 'stop', usage = null, model = null, live = null;
      try {
        const stream = await ai.chat.completions.create({ ...msg.request, agent: true, stream: true });
        for await (const chunk of stream) {
          const choice = chunk.choices && chunk.choices[0];
          if (choice?.delta?.content) {
            content += choice.delta.content;
            if (!live) { working.remove(); live = add('', ''); }
            live.textContent = content; log.scrollTop = log.scrollHeight;
          }
          if (choice?.delta?.tool_calls) toolCalls = choice.delta.tool_calls;
          if (choice?.finish_reason) finishReason = choice.finish_reason;
          if (chunk.usage) usage = chunk.usage;
          if (chunk.model) { model = chunk.model; lastModel = chunk.model; }
        }
      } finally { clearInterval(tick); working.remove(); }
      const message = { role: 'assistant', content };
      if (toolCalls) message.tool_calls = toolCalls;
      const completion = { id: 'naklios-local', object: 'chat.completion', model: model || 'localmind', choices: [{ index: 0, message, finish_reason: finishReason }], usage };
      entry.ms = Math.round(performance.now() - t0);
      entry.toolCalls = (toolCalls || []).map((c) => c.function?.name);
      for (const c of toolCalls || []) addToolCard(c);
      lastLive = toolCalls && toolCalls.length ? null : live;
      worker.postMessage({ type: 'broker-reply', id: msg.id, completion });
    } catch (e) {
      entry.err = String(e?.message || e);
      worker.postMessage({ type: 'broker-reply', id: msg.id, error: entry.err });
    }
    return;
  }
  const resolve = waiting.get(msg.id);
  if (resolve) { waiting.delete(msg.id); resolve(msg); }
};

async function ask(text) {
  add('you', text);
  lastLive = null;
  const r = await request({ type: 'ask', text });
  if (r.error) { closeToolCards(); add('err', r.error); return r; }
  const s = r.settled || {};
  closeToolCards();
  // The final reply already streamed into its bubble: that bubble takes the Worker's answer text
  // (which may differ from the raw stream), so the reply is never shown twice.
  if (s.status === 'done') { if (lastLive) { lastLive.textContent = r.answer || lastLive.textContent || '(no text)'; lastLive = null; } else add('', r.answer || '(no text)'); }
  else add('err', 'Pi did not answer: ' + JSON.stringify(s).slice(0, 400));
  return r;
}
// ---- Conversations: the list screen, the header, and switching ----
const listEl = document.getElementById('list');
const backBtn = document.getElementById('back');
const titleEl = document.getElementById('title');
const form = document.getElementById('f');
const cmdsEl = document.getElementById('cmds');
let conversations = [], activeConv = null, busy = false, lastModel = null;

function setConversations(list, active) {
  conversations = list || conversations;
  activeConv = active || activeConv;
  if (listEl.hidden) titleEl.textContent = activeConv ? (activeConv.title || 'New conversation') : 'Pi';
  else drawList();
}
// Redraw the chat window from a transcript: the saved rows, then the status line.
function drawTranscript(rows) {
  log.textContent = '';
  for (const row of rows || []) log.appendChild(Object.assign(document.createElement('div'), { className: 'msg ' + (row.role === 'assistant' ? '' : row.role), textContent: row.text }));
  status.className = 'msg sys';
  log.appendChild(status);
  log.scrollTop = log.scrollHeight;
}
function ago(t) {
  const s = Math.max(0, Math.round((Date.now() - t) / 1000));
  if (s < 60) return 'just now';
  if (s < 3600) return Math.round(s / 60) + ' min ago';
  if (s < 86400) return Math.round(s / 3600) + ' h ago';
  return new Date(t).toLocaleDateString();
}
function drawList() {
  listEl.textContent = '';
  const n = conversations.length;
  listEl.appendChild(Object.assign(document.createElement('div'), { className: 'hint', textContent: `${n} conversation${n === 1 ? '' : 's'}, newest first. Choose one to continue it, or press + New.` }));
  conversations.forEach((c, i) => {
    const b = document.createElement('button');
    b.type = 'button'; b.className = 'conv' + (c.active ? ' on' : '');
    b.append(Object.assign(document.createElement('span'), { className: 'n', textContent: String(i + 1) }),
      Object.assign(document.createElement('span'), { className: 't', textContent: c.title + (c.forkOf ? '  (fork)' : '') }),
      Object.assign(document.createElement('span'), { className: 'when', textContent: ago(c.updatedAt) }));
    b.addEventListener('click', () => command('switch', { id: c.id }));
    listEl.appendChild(b);
  });
}
function showList() {
  listEl.hidden = false; log.hidden = true; form.hidden = true; cmdsEl.hidden = true;
  backBtn.hidden = true; titleEl.textContent = 'Conversations';
  drawList();
}
function showChat() {
  listEl.hidden = true; log.hidden = false; form.hidden = false;
  backBtn.hidden = false; titleEl.textContent = activeConv ? (activeConv.title || 'New conversation') : 'Pi';
  log.scrollTop = log.scrollHeight; q.focus();
}
// Run one conversation command in the Worker and redraw from its reply.
async function command(op, arg) {
  if (busy) { showChat(); add('sys', 'Pi is still working. Wait for the answer, then try again.'); return null; }
  busy = true; send.disabled = true;
  const note = op === 'compact' ? add('sys working', 'Compacting older messages…') : null;
  try {
    const r = await request({ type: 'cmd', op, arg });
    note?.remove();
    if (r.error) { showChat(); add('err', r.error); return r; }
    setConversations(r.conversations, r.active);
    if (r.transcript) drawTranscript(r.transcript);
    showChat();
    return r;
  } finally { busy = false; send.disabled = false; }
}
backBtn.addEventListener('click', () => showList());
document.getElementById('newbtn').addEventListener('click', () => command('new', ''));

// ---- Slash commands ----
const COMMANDS = [
  { name: '/help', args: '', about: 'List these commands' },
  { name: '/new', args: '[name]', about: 'Start a new conversation' },
  { name: '/resume', args: '[number or name]', about: 'Open the conversation list, or continue one' },
  { name: '/fork', args: '[name]', about: 'Copy this conversation and continue in the copy' },
  { name: '/name', args: '<name>', about: 'Rename this conversation' },
  { name: '/compact', args: '[instructions]', about: 'Summarise older messages to free context' },
  { name: '/model', args: '', about: 'Show which model answered last' },
];
async function runSlash(text) {
  const [head, ...rest] = text.split(/\s+/);
  const arg = rest.join(' ').trim();
  const name = head.toLowerCase();
  if (name === '/help' || name === '/?') {
    const skillLine = typeof skillCmds !== 'undefined' && skillCmds.length ? `\n\nSkills from your NakliOS library (/<name> [task]): ${skillCmds.map((c) => c.skill).join(', ')}.` : '';
    add('sys', 'Commands:\n' + COMMANDS.map((c) => `${c.name}${c.args ? ' ' + c.args : ''} — ${c.about}`).join('\n') + skillLine + '\n\n← Conversations at the top left opens the list.');
    return;
  }
  if (name === '/new') { const r = await command('new', arg); if (r && !r.error) add('sys', 'New conversation started.'); return; }
  if (name === '/resume' || name === '/sessions') { if (!arg) { showList(); return; } await command('switch', arg); return; }
  if (name === '/fork') { const r = await command('fork', arg); if (r && !r.error) add('sys', `Forked. You are now in "${r.active.title}"; the original is unchanged.`); return; }
  if (name === '/name' || name === '/rename') { const r = await command('rename', arg); if (r && !r.error) add('sys', `Renamed to "${r.active.title}".`); return; }
  if (name === '/compact') {
    const r = await command('compact', arg);
    if (r && !r.error) {
      const c = r.result || {};
      add(c.status === 'completed' ? 'sys' : 'err', c.status === 'completed'
        ? (c.compacted ? 'Compacted: older messages are now one summary.' : 'Nothing to compact yet: the conversation is short.')
        : `Compaction ${c.status || 'ended'}${c.error ? ': ' + c.error : ''}.`);
    }
    return;
  }
  if (name === '/model') {
    add('sys', (lastModel ? `The last answer came from ${lastModel}.` : 'No answer yet in this window, so the model is not known.') + ' Pi uses the model chosen in NakliOS Settings → AI; change it there.');
    return;
  }
  if (typeof slashSkill === 'function' && await slashSkill(name.slice(1), arg)) return;
  add('err', `Unknown command ${head}. Type /help for the list.`);
}
// Library skills as slash commands: /<skill> [what to do] asks Pi to load that skill and follow it.
let skillCmds = [];
async function loadSkillCmds() {
  try {
    const lib = nak && nak.experimental_skills ? await nak.experimental_skills.list() : [];
    skillCmds = (lib || []).filter((x) => x && x.name).map((x) => ({ name: '/' + x.name, args: '[task]', about: String(x.description || 'Skill').slice(0, 90), skill: x.name }));
  } catch (_) { skillCmds = []; }
}
async function slashSkill(name, arg) {
  const hit = skillCmds.find((c) => c.skill === name);
  if (!hit) return false;
  if (busy) { add('sys', 'Pi is still working. Wait for the answer, then try again.'); return true; }
  busy = true; send.disabled = true;
  try { await ask(`Load the "${hit.skill}" skill with the skill tool and follow it.${arg ? ' Task: ' + arg : ''}`); }
  finally { busy = false; send.disabled = false; }
  return true;
}

// The suggestion menu: shown while the box holds only a command word.
let cmdSel = 0, cmdMatches = [];
function updateMenu() {
  const v = q.value;
  if (!/^\/\S*$/.test(v)) { cmdsEl.hidden = true; cmdMatches = []; return; }
  cmdMatches = [...COMMANDS, ...skillCmds].filter((c) => c.name.startsWith(v.toLowerCase())).slice(0, 12);
  if (!cmdMatches.length) { cmdsEl.hidden = true; return; }
  cmdSel = Math.min(cmdSel, cmdMatches.length - 1);
  cmdsEl.textContent = '';
  cmdMatches.forEach((c, i) => {
    const d = document.createElement('div');
    if (i === cmdSel) d.className = 'sel';
    d.append(Object.assign(document.createElement('code'), { textContent: c.name + (c.args ? ' ' + c.args : '') }), Object.assign(document.createElement('span'), { textContent: c.about }));
    d.addEventListener('mousedown', (e) => { e.preventDefault(); pickCommand(c); });
    cmdsEl.appendChild(d);
  });
  cmdsEl.hidden = false;
}
function pickCommand(c) {
  q.value = c.name + (c.args ? ' ' : '');
  cmdsEl.hidden = true; cmdMatches = []; q.focus();
  if (!c.args) form.requestSubmit();
}
q.addEventListener('input', () => { cmdSel = 0; updateMenu(); });
q.addEventListener('blur', () => setTimeout(() => { cmdsEl.hidden = true; }, 100));

// Test seam for live checks; read-only besides ask and the conversation commands.
window.__pi = { ask, read: (path) => request({ type: 'read', path }), trace, storage: storage.label, slash: runSlash, command, state: () => ({ conversations, active: activeConv, list: !listEl.hidden }) };

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  const text = q.value.trim();
  if (!text) return;
  if (text.startsWith('/')) { q.value = ''; cmdsEl.hidden = true; await runSlash(text); return; }
  if (busy) return;
  q.value = ''; send.disabled = true; busy = true;
  try { await ask(text); } finally { busy = false; send.disabled = false; q.focus(); }
  // The first message names the conversation; refresh the header and list from the Worker.
  const r = await request({ type: 'cmd', op: 'list' });
  if (!r.error) setConversations(r.conversations, r.active);
});
q.addEventListener('keydown', (e) => {
  if (cmdMatches.length && !cmdsEl.hidden) {
    if (e.key === 'ArrowDown') { e.preventDefault(); cmdSel = (cmdSel + 1) % cmdMatches.length; updateMenu(); return; }
    if (e.key === 'ArrowUp') { e.preventDefault(); cmdSel = (cmdSel - 1 + cmdMatches.length) % cmdMatches.length; updateMenu(); return; }
    if (e.key === 'Tab' || (e.key === 'Enter' && !e.shiftKey && q.value.toLowerCase() !== cmdMatches[cmdSel].name)) { e.preventDefault(); pickCommand(cmdMatches[cmdSel]); return; }
    if (e.key === 'Escape') { cmdsEl.hidden = true; return; }
  }
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); form.requestSubmit(); }
});
</script>
</body>
</html>
