<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mail — NakliOS</title>
<meta name="description" content="Read and search your Gmail in NakliOS. Mail goes from this browser straight to Google.">
<style>
:root{
  --body:#faf2e2;--panel:#fdf8ec;--ink:#2c1810;--brand:#c8512a;--act:#2a4a8a;--ok:#5a7a30;--row:#f0e2c8;
  --muted:color-mix(in srgb,var(--ink) 58%,var(--body));--faint:color-mix(in srgb,var(--ink) 35%,var(--body));
  --line:color-mix(in srgb,var(--ink) 14%,transparent);--strong:color-mix(in srgb,var(--ink) 27%,transparent);
}
*{box-sizing:border-box}[hidden]{display:none!important}html,body{height:100%;margin:0;overflow:hidden}
body{background:var(--body);color:var(--ink);font:13px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
button,input{font:inherit;color:inherit}button{cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--act);outline-offset:2px}
.app{height:100%;display:flex;flex-direction:column;min-height:0}
.topbar{display:flex;align-items:center;gap:9px;min-height:54px;padding:8px 12px;background:var(--panel);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:8px;font-size:15px;font-weight:760}
.mark{display:grid;place-items:center;width:29px;height:29px;border-radius:9px;background:var(--brand);color:#fff}
.search{flex:1;display:flex;max-width:520px}.search input{flex:1;border:1px solid var(--line);border-radius:8px;background:var(--body);padding:6px 10px}
.btn{border:1px solid var(--line);border-radius:8px;background:var(--row);padding:6px 10px}.btn:hover{background:color-mix(in srgb,var(--row) 70%,var(--ink) 6%)}
.btn[aria-pressed="true"]{border-color:#1a73e8;color:#1a73e8}
.main{flex:1;display:grid;grid-template-columns:minmax(260px,380px) 1fr;min-height:0}
.list{overflow:auto;border-right:1px solid var(--line);background:var(--panel)}
.row{display:block;width:100%;text-align:left;border:0;border-bottom:1px solid var(--line);background:transparent;padding:9px 12px}
.row:hover{background:var(--row)}.row.active{background:color-mix(in srgb,var(--act) 12%,var(--panel))}
.row .top{display:flex;gap:8px;align-items:baseline}.row .who{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .when{color:var(--muted);font-size:11px;white-space:nowrap}.row .subj{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .snip{color:var(--muted);font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row.unread .who,.row.unread .subj{font-weight:700}
.reader{overflow:auto;padding:18px 22px;min-width:0}
.reader h1{font:700 19px/1.25 Georgia,serif;margin:0 0 8px}.meta{color:var(--muted);font-size:12px;margin-bottom:12px}
.promises{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 12px}.promise{border:1px solid var(--line);border-left:4px solid var(--ok);border-radius:8px;padding:5px 9px;background:var(--panel);font-size:12px}
.body{white-space:pre-wrap;overflow-wrap:anywhere;max-width:760px}
.html-frame{width:100%;min-height:60vh;border:1px solid var(--line);border-radius:8px;background:#fff}
.empty{color:var(--muted);padding:40px 22px;text-align:center}
.tag{display:inline-block;margin-left:6px;border-radius:6px;padding:0 6px;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.03em;background:var(--row);color:var(--muted)}
.tag.reply{background:color-mix(in srgb,var(--brand) 18%,var(--panel));color:var(--brand)}.tag.read{color:var(--act)}
.reader-tools{display:flex;gap:8px;margin-bottom:10px}
.compose{max-width:760px;margin-top:18px;padding:12px;border:1px solid var(--strong);border-radius:10px;background:var(--panel)}
.compose form{display:flex;flex-direction:column;gap:8px}.compose .ask{display:flex;gap:8px}.compose .ask input{flex:1}
.compose input,.compose textarea{border:1px solid var(--line);border-radius:8px;background:var(--body);padding:6px 10px}
.compose textarea{min-height:180px;resize:vertical;font:13px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
.compose .actions{display:flex;gap:8px;flex-wrap:wrap}.btn.danger{border-color:#b3261e;color:#fff;background:#b3261e}
.status{min-height:28px;display:flex;align-items:center;gap:8px;padding:4px 12px;border-top:1px solid var(--line);background:var(--panel);color:var(--muted);font-size:11px}
@media(max-width:760px){.main{grid-template-columns:1fr}.reader{display:none}.main.reading .list{display:none}.main.reading .reader{display:block}.brand span:last-child{display:none}}
</style>
</head>
<body>
<script src="../../sdk/naklios.js"></script>
<script src="gmail.js"></script>
<div class="app">
  <header class="topbar">
    <div class="brand"><span class="mark">✉</span><span>Mail</span></div>
    <form class="search" id="search-form" role="search"><input id="search" type="search" placeholder="Search Gmail (from:ravi is:unread)" aria-label="Search Gmail"></form>
    <button class="btn" id="triage" title="Sort the listed messages into reply, read, later and skip with your AI model" hidden>Triage</button>
    <button class="btn" id="refresh" title="Check for new mail" hidden>Refresh</button>
    <button class="btn" id="google" hidden>Connect Google</button>
  </header>
  <div class="main" id="main">
    <nav class="list" id="list" aria-label="Messages"></nav>
    <article class="reader" id="reader">
      <div class="reader-tools" id="reader-tools" hidden>
        <button class="btn" id="prev" title="Previous message">‹ Prev</button><button class="btn" id="next" title="Next message">Next ›</button>
        <button class="btn" id="reply">Reply</button><button class="btn" id="forward">Forward</button>
        <button class="btn" id="archive" title="Take it out of the inbox; it stays in All Mail">Archive</button><button class="btn" id="trash" title="Move to Gmail's Trash (kept 30 days)">Delete</button>
      </div>
      <div id="reader-body"><div class="empty">Pick a message to read it.</div></div>
      <section class="compose" id="compose" aria-label="Reply" hidden>
        <div class="meta" id="compose-head"></div>
        <form id="compose-form">
          <input id="compose-to" type="email" multiple placeholder="To" aria-label="To">
          <div class="ask"><input id="compose-ask" placeholder="What should the reply say? (for Draft with AI)" aria-label="What the reply should say"><button type="button" class="btn" id="compose-ai">Draft with AI</button></div>
          <textarea id="compose-body" aria-label="Reply text" placeholder="Write your reply"></textarea>
          <div class="actions"><button type="button" class="btn" id="compose-save">Save draft</button><button type="button" class="btn" id="compose-send">Send</button><button type="button" class="btn" id="compose-cancel">Cancel</button></div>
        </form>
      </section>
    </article>
  </div>
  <footer class="status"><button class="btn" id="undo" hidden>Undo</button><span id="status">Mail goes from this browser straight to Google. Recent headers are kept in this browser for a quick start.</span></footer>
</div>
<script type="module">
const G=window.MailGmail;
const $=id=>document.getElementById(id);
const GOOGLE_KEY='naklios.mail.google', DB='naklios-mail', CACHE_MS=5*60*1000;
const zone=Intl.DateTimeFormat().resolvedOptions().timeZone;
let googleOn=localStorage.getItem(GOOGLE_KEY)==='1', query='in:inbox', messages=[], current=null, me='', rulesPromise=null, triaged=new Map(), reply=null;
const googleAvailable=()=>!!naklios.experimental_auth&&naklios.experimental_auth.providers().includes('google');
async function googleToken({fresh,prompt=true}={}){if(fresh&&prompt)await naklios.experimental_auth.revoke('google');return(await naklios.experimental_auth.token({provider:'google',scopes:G.SCOPES,...(prompt?{}:{prompt:false})})).accessToken}
const gmail=G.createClient({getToken:googleToken});
// Commands other apps and agents run never open Google's window: they use a token Mail already holds, or say so.
const gmailQuiet=G.createClient({getToken:o=>googleToken({...o,prompt:false}).catch(e=>{throw e.code==='ENOSIGNIN'?Object.assign(new Error('Gmail needs a fresh sign-in: open Mail and press Refresh, then try again.'),{code:'ENOSIGNIN'}):e})});
const rules=()=>rulesPromise||(rulesPromise=import('../../sys/emergic-rules/rules.mjs').then(m=>m.loadEmergicRules()).catch(e=>{rulesPromise=null;throw e}));

// ── a small cache of recent headers and snippets (no bodies), so the list shows at once on open ──
function idb(){return new Promise((res,rej)=>{const r=indexedDB.open(DB,1);r.onupgradeneeded=()=>r.result.createObjectStore('kv');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
async function cacheGet(key){try{const db=await idb();return await new Promise(res=>{const q=db.transaction('kv').objectStore('kv').get(key);q.onsuccess=()=>res(q.result||null);q.onerror=()=>res(null)})}catch{return null}}
async function cachePut(key,value){try{const db=await idb();db.transaction('kv','readwrite').objectStore('kv').put(value,key)}catch{}}
async function cacheClear(){try{const db=await idb();db.transaction('kv','readwrite').objectStore('kv').clear()}catch{}}

const fmt=ms=>{const d=new Date(ms),now=new Date();return d.toDateString()===now.toDateString()?d.toLocaleTimeString([], {hour:'numeric',minute:'2-digit'}):d.toLocaleDateString([], {day:'numeric',month:'short'})};
const shortName=from=>{const p=G.person(from);return p.name||p.address||'(unknown)'};
function setStatus(text){$('status').textContent=text}

function renderGoogle(){const b=$('google');b.hidden=!googleAvailable();b.textContent=googleOn?'Google ✓':'Connect Google';b.setAttribute('aria-pressed',String(googleOn));b.title=googleOn?'Reading your Gmail here. Click to disconnect.':'Read your Gmail here';$('refresh').hidden=!googleOn;$('triage').hidden=!googleOn||!aiOn();$('compose-ai').hidden=!aiOn()}
function renderList(){
  const list=$('list');list.textContent='';
  if(!googleOn){const e=document.createElement('div');e.className='empty';e.textContent=googleAvailable()?'Connect Google to read your Gmail here.':'Open Mail inside NakliOS (naklios.dev) to connect Gmail.';list.append(e);return}
  if(!messages.length){const e=document.createElement('div');e.className='empty';e.textContent='No messages.';list.append(e);return}
  for(const m of messages){
    const b=document.createElement('button');b.className='row'+(m.unread?' unread':'')+(current&&current.id===m.id?' active':'');b.dataset.id=m.id;
    const top=document.createElement('div');top.className='top';const who=document.createElement('span');who.className='who';who.textContent=shortName(m.from);
    const when=document.createElement('span');when.className='when';when.textContent=fmt(m.date);top.append(who,when);
    const s=document.createElement('div');s.className='subj';s.textContent=m.subject;const t=triaged.get(m.id);if(t){const g=document.createElement('span');g.className='tag '+t.action;g.textContent=t.action;g.title=t.why;who.append(g)}const n=document.createElement('div');n.className='snip';n.textContent=m.snippet;
    b.append(top,s,n);b.addEventListener('click',()=>void openMessage(m.id,{byPerson:true}));list.append(b);
  }
}

// HTML mail shows only in a sandboxed frame with no scripts and no outside requests (no tracking pixels).
function htmlFrame(html){
  const f=document.createElement('iframe');f.className='html-frame';f.setAttribute('sandbox','');f.setAttribute('referrerpolicy','no-referrer');
  f.srcdoc=`<!doctype html><meta charset="utf-8"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src data:; style-src 'unsafe-inline'">${html}`;
  return f;
}
function renderReader(msg,found){
  const r=$('reader-body');r.textContent='';$('reader-tools').hidden=!msg||msg.text==null;
  if(msg){const i=messages.findIndex(m=>m.id===msg.id);$('prev').disabled=i<=0;$('next').disabled=i<0||i>=messages.length-1}
  if(!reply||!msg||reply.source.id!==msg.id)closeCompose();
  if(!msg){const e=document.createElement('div');e.className='empty';e.textContent='Pick a message to read it.';r.append(e);return}
  const h=document.createElement('h1');h.textContent=msg.subject;
  const meta=document.createElement('div');meta.className='meta';meta.textContent=`${msg.from} · to ${msg.to.join(', ')||'—'} · ${new Date(msg.date).toLocaleString()}`+(msg.attachments.length?` · ${msg.attachments.length} attachment(s)`:'');
  r.append(h,meta);
  if(found&&found.length){const p=document.createElement('div');p.className='promises';p.setAttribute('aria-label','Promises in this message');
    for(const x of found){const c=document.createElement('span');c.className='promise';c.textContent=`${x.direction==='i_owe'?'You owe':'Owed to you'} by ${x.due}${x.inferred?' (about)':''}: ${x.what}`;p.append(c)}r.append(p)}
  if(msg.html){const t=document.createElement('button');t.className='btn';t.id='show-html';t.textContent='Show formatted';const body=document.createElement('div');body.className='body';body.textContent=msg.text;
    t.addEventListener('click',()=>{const on=t.textContent==='Show formatted';t.textContent=on?'Show plain text':'Show formatted';body.replaceWith(on?htmlFrame(msg.html):Object.assign(document.createElement('div'),{className:'body',textContent:msg.text}));});
    r.append(t,document.createElement('br'),document.createElement('br'),body)}
  else{const body=document.createElement('div');body.className='body';body.textContent=msg.text;r.append(body)}
}

async function promisesOf(msg){
  if(!me||!msg.text)return[];
  try{const r=await rules();return r.promisesIn({from:msg.from,to:msg.to,reply_to:msg.replyTo||'',body:msg.text,sent_on:G.localDay(msg.date,zone)},me)}
  catch(e){console.warn('[mail] promise rules unavailable',e);return[]}
}

async function openMessage(id,{byPerson=false}={}){
  const row=messages.find(m=>m.id===id);current=row||{id};renderList();$('main').classList.add('reading');setStatus('Opening…');
  try{const msg=await gmail.read(id);current=msg;renderReader(msg,await promisesOf(msg));setStatus('Mail goes from this browser straight to Google.');
    if(byPerson&&msg.unread){await gmail.markRead(id);if(row)row.unread=false;renderList();void publishUnread()}}
  catch(e){handleError(e)}
}

function handleError(error){if(error.code==='ENOSIGNIN'){setStatus('Gmail needs a fresh sign-in: press Refresh.');return}if(['ENOGRANT','ECANCELLED','EDENIED','ENOAUTH'].includes(error.code))setGoogle(false);setStatus(`Gmail: ${error.message}`)}

// A person's click may open Google's window; the automatic checks (on open, every 5 minutes) never do.
async function refresh({byPerson=false}={}){
  if(!googleOn||!googleAvailable())return;
  const g=byPerson?gmail:gmailQuiet;
  setStatus('Checking Gmail…');
  try{
    if(!me)me=(await g.profile()).emailAddress||'';
    const out=await g.search(query,30);messages=out.messages;renderList();
    if(query==='in:inbox')void cachePut('inbox',{me,savedAt:Date.now(),messages});
    setStatus(`${messages.length} message(s) · checked ${new Date().toLocaleTimeString([], {hour:'numeric',minute:'2-digit'})}`);void publishUnread();
  }catch(e){handleError(e)}
}

async function setGoogle(on){googleOn=on;localStorage.setItem(GOOGLE_KEY,on?'1':'0');if(!on){messages=[];current=null;me='';await cacheClear();renderReader(null);if(naklios.experimental_widgets)naklios.experimental_widgets.update('unread',{items:[],empty:'Gmail not connected'},{persist:true})}renderGoogle();renderList();if(on)await refresh({byPerson:true})}

// The desktop card: how many unread messages in the inbox, and the newest few.
async function publishUnread(){
  if(!naklios.experimental_widgets||!googleOn)return;
  try{const count=await gmail.unreadCount();const top=messages.filter(m=>m.unread).slice(0,5).map(m=>`${shortName(m.from)}: ${m.subject}`);
    naklios.experimental_widgets.update('unread',{heading:`${count} unread`,items:top,empty:'Inbox read'},{persist:true})}catch{}
}

$('google').addEventListener('click',()=>void setGoogle(!googleOn));
$('refresh').addEventListener('click',()=>void refresh({byPerson:true}));
$('search-form').addEventListener('submit',e=>{e.preventDefault();query=$('search').value.trim()||'in:inbox';current=null;renderReader(null);void refresh({byPerson:true})});

// ── AI through the person's chosen model (Settings → AI). Mail works without it; triage and AI drafts need it. ──
const aiOn=()=>!!naklios.capabilities?.ai;
async function askModel(messages,max_tokens){
  if(!aiOn())throw new Error('No AI model is available in NakliOS (Settings → AI).');
  const out=await naklios.ai.chat.completions.create({messages,max_tokens});
  return String(out?.choices?.[0]?.message?.content||'').replace(/<think>[\s\S]*?<\/think>/g,'').trim();
}
async function triageRows(rows){
  if(!rows.length)return[];
  const found=G.parseTriage(await askModel(G.triagePrompt(rows),40+rows.length*30),rows.map(m=>m.id));
  for(const t of found)triaged.set(t.id,t);return found;
}
async function draftText(msg,instruction){if(!me)me=(await gmail.profile()).emailAddress||'';return askModel(G.draftPrompt(msg,instruction,me),700)}

// ── Reply or forward: write or draft with AI, save to Gmail Drafts; the person's click on Send sends it ──
function closeCompose(){reply=null;$('compose').hidden=true}
function openCompose(msg,mode='reply'){
  const fwd=mode==='forward',fields=fwd?G.forwardOf(msg):G.replyTo(msg);reply={source:msg,mode,fields,draftId:null,saved:null};
  $('compose-head').textContent=`${fwd?'Forward':'Reply'} · ${fields.subject}${fwd&&msg.attachments.length?' · attachments are not forwarded':''}`;
  $('compose-to').value=fwd?'':fields.to;$('compose-body').value=fwd?fields.quoted:'';$('compose-ask').value='';$('compose').hidden=false;
  const focus=fwd?$('compose-to'):$('compose-body');focus.focus();if(fwd)$('compose-body').setSelectionRange(0,0);
}
const composeFields=()=>({...reply.fields,to:$('compose-to').value.trim(),body:$('compose-body').value});
async function saveReply(){
  const f=composeFields();if(!f.to)throw new Error('Add who it goes to.');if(!f.body.trim())throw new Error('Write the message first.');
  const key=f.to+'\n'+f.body;if(reply.draftId&&reply.saved===key)return reply.draftId;
  const saved=await gmail.createDraft(f,reply.mode==='reply'?f.threadId:'');
  if(reply.draftId&&reply.draftId!==saved.draftId)void gmail.deleteDraft(reply.draftId).catch(()=>{});
  reply.draftId=saved.draftId;reply.saved=key;return saved.draftId;
}
$('reply').addEventListener('click',()=>{if(current&&current.text!=null)openCompose(current,'reply')});
$('forward').addEventListener('click',()=>{if(current&&current.text!=null)openCompose(current,'forward')});
function step(d){const i=messages.findIndex(m=>m.id===current?.id);const m=messages[i+d];if(m)void openMessage(m.id,{byPerson:true})}
$('prev').addEventListener('click',()=>step(-1));$('next').addEventListener('click',()=>step(1));
// Archive and Delete take the message out of the list and go back to it; Undo stays for 10 seconds.
let undoTimer=null;
function offerUndo(label,fn){const u=$('undo');u.hidden=false;u.onclick=async()=>{u.hidden=true;clearTimeout(undoTimer);try{await fn();setStatus(`${label} undone.`);void refresh()}catch(e){handleError(e)}};clearTimeout(undoTimer);undoTimer=setTimeout(()=>{u.hidden=true},10000)}
async function remove(kind){
  if(!current?.id)return;const id=current.id;
  try{
    if(kind==='archive'){await gmail.archive(id);offerUndo('Archive',()=>gmail.unarchive(id));setStatus('Archived. It stays in All Mail.')}
    else{await gmail.trash(id);void publishUnread();offerUndo('Delete',()=>gmail.untrash(id));setStatus('Moved to Trash. Gmail keeps it 30 days.')}
    messages=messages.filter(m=>m.id!==id);current=null;renderReader(null);renderList();$('main').classList.remove('reading');
  }catch(e){handleError(e)}
}
$('archive').addEventListener('click',()=>void remove('archive'));$('trash').addEventListener('click',()=>void remove('trash'));
$('compose-cancel').addEventListener('click',()=>closeCompose());
$('compose-form').addEventListener('submit',e=>e.preventDefault());
$('compose-ai').addEventListener('click',async()=>{if(!reply)return;const b=$('compose-ai');b.disabled=true;setStatus('Drafting with your AI model…');
  try{$('compose-body').value=await draftText(reply.source,$('compose-ask').value.trim());setStatus('Draft ready. Read it and change anything before you send.')}
  catch(e){setStatus(`Draft: ${e.message}`)}finally{b.disabled=false}});
$('compose-save').addEventListener('click',async()=>{if(!reply)return;try{await saveReply();setStatus('Saved in Gmail Drafts.')}catch(e){handleError(e)}});
$('compose-send').addEventListener('click',async()=>{
  if(!reply)return;const b=$('compose-send');
  const f=composeFields();if(!f.to||!f.body.trim()){setStatus(f.to?'Write the message first.':'Add who it goes to.');return}
  b.disabled=true;setStatus(`Sending to ${f.to}…`);
  try{const to=composeFields().to,id=await saveReply();await gmail.sendDraft(id);setStatus(`Sent to ${to}.`);closeCompose();void refresh()}
  catch(e){handleError(e)}finally{b.disabled=false}
});
$('triage').addEventListener('click',async()=>{const b=$('triage');b.disabled=true;setStatus('Sorting the list with your AI model…');
  try{const found=await triageRows(messages.slice(0,25));renderList();setStatus(`Sorted ${found.length} of ${Math.min(25,messages.length)}: ${['reply','read','later','skip'].map(a=>`${found.filter(t=>t.action===a).length} ${a}`).join(', ')}.`)}
  catch(e){setStatus(`Triage: ${e.message}`)}finally{b.disabled=false}});

// ── Commands on the common rail: callers read mail through the desktop catalog, which checks their grant.
// They never mark mail read. ──
function needGmail(){if(!googleOn||!googleAvailable())throw new Error('Gmail is not connected; press Connect Google in Mail first.')}
const clip=(s,n)=>s.length>n?s.slice(0,n)+'…':s;
const row=m=>({id:m.id,threadId:m.threadId,from:m.from,subject:m.subject,date:new Date(m.date).toISOString(),snippet:m.snippet,unread:m.unread});
const COMMAND_HANDLERS={
  async 'mail.search'(args){needGmail();const out=await gmailQuiet.search(String(args?.query||'in:inbox'),Math.min(25,Number(args?.max)||10));return{query:String(args?.query||'in:inbox'),estimate:out.estimate,messages:out.messages.map(row)}},
  async 'mail.read'(args){needGmail();if(!args?.id)throw new Error('Give the message id from mail.search or mail.unread.');const msg=await gmailQuiet.read(String(args.id));if(!me)me=(await gmailQuiet.profile()).emailAddress||'';
    return{...row(msg),me,to:msg.to,cc:msg.cc,text:clip(msg.text,20000),attachments:msg.attachments.map(a=>a.name),promises:(await promisesOf(msg)).map(({direction,who,what,due,inferred})=>({direction,who,what,due,inferred}))}},
  async 'mail.triage'(args){needGmail();const out=await gmailQuiet.search(String(args?.query||'in:inbox'),Math.min(25,Number(args?.max)||15));
    const found=await triageRows(out.messages);const byId=new Map(out.messages.map(m=>[m.id,m]));renderList();
    return{query:String(args?.query||'in:inbox'),messages:found.map(t=>({...row(byId.get(t.id)),action:t.action,why:t.why}))}},
  // Saves a reply in Gmail Drafts and never sends. With no body, the person's AI model drafts it.
  async 'mail.draft'(args){needGmail();if(!args?.id)throw new Error('Give the id of the message to reply to.');const msg=await gmailQuiet.read(String(args.id));
    const body=String(args.body||'').trim()||await draftText(msg,String(args.instruction||''));const fields=G.replyTo(msg);
    const saved=await gmailQuiet.createDraft({...fields,body},fields.threadId);return{draftId:saved.draftId,threadId:saved.threadId,to:saved.to,subject:saved.subject,body}},
  // Destructive: the desktop shows the person the recipient and subject and asks every time. The draft must still
  // match what the caller showed, so a changed draft is refused rather than sent.
  async 'mail.send'(args){needGmail();if(!args?.draftId)throw new Error('Give the draftId from mail.draft.');const d=await gmailQuiet.getDraft(String(args.draftId));
    const same=(a,b)=>String(a||'').trim().toLowerCase()===String(b||'').trim().toLowerCase();
    if(!same(G.person(d.to).address,G.person(args.to).address)||!same(d.subject,args.subject))throw new Error(`The draft now goes to ${d.to} with subject "${d.subject}", not what this call names; nothing was sent.`);
    const sent=await gmailQuiet.sendDraft(d.draftId);void refresh();return{sent:true,id:sent.id,threadId:sent.threadId,to:d.to,subject:d.subject}},
  // Forwarding saves a draft too; sending it is mail.send.
  async 'mail.forward'(args){needGmail();if(!args?.id||!args?.to)throw new Error('Give the message id and who to forward it to.');const msg=await gmailQuiet.read(String(args.id));
    const f=G.forwardOf(msg);const body=(args.note?String(args.note):'')+f.quoted;const saved=await gmailQuiet.createDraft({to:String(args.to),subject:f.subject,body},'');
    return{draftId:saved.draftId,to:saved.to,subject:saved.subject,attachmentsNotForwarded:msg.attachments.map(a=>a.name)}},
  async 'mail.archive'(args){needGmail();if(!args?.id)throw new Error('Give the message id.');const id=String(args.id);
    await(args.undo?gmailQuiet.unarchive(id):gmailQuiet.archive(id));return{id,archived:!args.undo}},
  async 'mail.trash'(args){needGmail();if(!args?.id)throw new Error('Give the message id.');const id=String(args.id);
    await(args.undo?gmailQuiet.untrash(id):gmailQuiet.trash(id));void publishUnread();return{id,trashed:!args.undo}},
  async 'mail.unread'(args){needGmail();const out=await gmailQuiet.search('is:unread in:inbox',Math.min(25,Number(args?.max)||10));return{count:await gmailQuiet.unreadCount(),messages:out.messages.map(row)}},
};
if(naklios.experimental_commands){
  fetch('./commands.json').then(r=>r.json()).then(manifest=>naklios.experimental_commands.register(manifest.commands.map(c=>({...c,handler:COMMAND_HANDLERS[c.name]})))).catch(e=>console.warn('[mail] commands could not register',e));
}

// Start: show cached headers at once, then check Gmail; check again every 5 minutes while Mail is open.
(async()=>{
  renderGoogle();
  const cached=googleOn?await cacheGet('inbox'):null;
  if(cached&&Array.isArray(cached.messages)){messages=cached.messages;me=cached.me||'';setStatus(`Showing saved headers from ${new Date(cached.savedAt).toLocaleTimeString([], {hour:'numeric',minute:'2-digit'})}…`)}
  renderList();
})();
let started=false;
naklios.onCapabilitiesChange(()=>{renderGoogle();renderList();if(!started&&googleOn&&googleAvailable()){started=true;void refresh()}});
naklios.requestCapabilities();naklios.ready();
setInterval(()=>{if(document.visibilityState==='visible')void refresh()},CACHE_MS);
</script>
