<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Meetings — NakliOS</title>
<meta name="description" content="Record a meeting from your microphone, transcribe it in this browser with Whisper, and write notes with your NakliOS model.">
<style>
:root{
  --body:#faf2e2;--panel:#fdf8ec;--ink:#2c1810;--brand:#8a4a2a;--act:#2a4a8a;--rec:#b3261e;--row:#f0e2c8;
  --muted:color-mix(in srgb,var(--ink) 58%,var(--body));--line:color-mix(in srgb,var(--ink) 14%,transparent);
}
*{box-sizing:border-box}[hidden]{display:none!important}html,body{height:100%;margin:0}
body{background:var(--body);color:var(--ink);font:13px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;overflow:hidden}
button,input,select{font:inherit;color:inherit}button{cursor:pointer}button:disabled{cursor:default;opacity:.55}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--act);outline-offset:2px}
.app{height:100%;display:flex;flex-direction:column;min-height:0}
.topbar{display:flex;align-items:center;gap:9px;flex-wrap:wrap;min-height:54px;padding:8px 12px;background:var(--panel);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:8px;font-size:15px;font-weight:760}
.mark{display:grid;place-items:center;width:29px;height:29px;border-radius:9px;background:var(--brand);color:#fff}
input,select{border:1px solid var(--line);border-radius:8px;background:var(--body);padding:6px 10px}
.btn{border:1px solid var(--line);border-radius:8px;background:var(--row);padding:6px 10px}.btn:hover:not(:disabled){background:color-mix(in srgb,var(--row) 70%,var(--ink) 6%)}
.btn.small{padding:2px 8px;font-size:12px}
.btn.rec{background:var(--rec);border-color:var(--rec);color:#fff;font-weight:650}
.clock{font-variant-numeric:tabular-nums;font-weight:700;min-width:56px}.clock.live{color:var(--rec)}
.body{flex:1;display:flex;min-height:0}
aside{width:250px;flex:none;border-right:1px solid var(--line);overflow:auto;padding:8px}
.mt{display:block;width:100%;text-align:left;border:1px solid transparent;border-radius:9px;background:none;padding:7px 9px;margin-bottom:3px}
.mt:hover{background:var(--row)}.mt.on{background:var(--panel);border-color:var(--line)}
.mt .t{font-weight:650;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.mt .m{color:var(--muted);font-size:11px}
main{flex:1;overflow:auto;padding:12px 18px 24px;min-width:0}
.head{display:flex;gap:8px;align-items:center;flex-wrap:wrap;max-width:860px}
.head input{flex:1;min-width:200px;font-size:15px;font-weight:650}
.meta{color:var(--muted);font-size:11px;margin:6px 0 0}
h2{font:700 12px/1 -apple-system,sans-serif;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);margin:18px 0 6px}
.notes{max-width:860px;border:1px solid var(--line);border-radius:10px;background:var(--panel);padding:10px 12px}
.notes p{margin:0 0 8px;white-space:pre-wrap}.notes ul{margin:4px 0 8px;padding-left:18px}
.act{display:flex;gap:8px;align-items:flex-start;margin:3px 0}.act span{flex:1}
.line{display:flex;gap:10px;max-width:860px;padding:3px 0}.line .at{color:var(--muted);font-variant-numeric:tabular-nums;min-width:44px;font-size:12px;padding-top:1px}
.line .tx{flex:1;overflow-wrap:anywhere}
.pending{color:var(--muted);font-style:italic}
.empty{color:var(--muted);padding:40px 12px;text-align:center;max-width:560px;margin:auto}
.status{min-height:28px;display:flex;align-items:center;padding:4px 12px;border-top:1px solid var(--line);background:var(--panel);color:var(--muted);font-size:11px}
@media (max-width:640px){aside{display:none}}
</style>
</head>
<body>
<script src="../../sdk/naklios.js"></script>
<div class="app">
  <header class="topbar">
    <div class="brand"><span class="mark">◉</span><span>Meetings</span></div>
    <select id="lang" aria-label="Spoken language" title="The language people speak in the meeting">
      <option value="en">English</option><option value="hi">Hindi</option><option value="">Detect the language</option>
    </select>
    <button class="btn rec" id="record" title="Start recording from the microphone">● Record</button>
    <button class="btn" id="stop" hidden title="Stop recording; the last words finish transcribing">■ Stop</button>
    <span class="clock" id="clock"></span>
  </header>
  <div class="body">
    <aside id="list" aria-label="Meetings"></aside>
    <main id="main"></main>
  </div>
  <footer class="status"><span id="status">Audio stays in this browser: Whisper runs here, and only the transcript is kept.</span></footer>
</div>
<script type="module">
import * as M from './core.mjs';
const $=id=>document.getElementById(id);
const DB='naklios-meetings', MODEL_LABEL='Whisper base';
let meetings=[], selected=null, rec=null, worker=null, workerReady=null, jobs=new Map(), jobSeq=0, backend='';
function setStatus(t){$('status').textContent=t}
const byId=id=>meetings.find(m=>m.id===id);
const fsOn=()=>!!naklios.capabilities?.fs, aiOn=()=>!!naklios.capabilities?.ai;

// ── storage: every meeting in IndexedDB; a Markdown copy in the person's storage when it is connected ──
function idb(){return new Promise((res,rej)=>{const r=indexedDB.open(DB,1);r.onupgradeneeded=()=>r.result.createObjectStore('kv');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
async function get(key){try{const db=await idb();return await new Promise(res=>{const q=db.transaction('kv').objectStore('kv').get(key);q.onsuccess=()=>res(q.result??null);q.onerror=()=>res(null)})}catch{return null}}
async function put(key,value){const db=await idb();await new Promise((res,rej)=>{const t=db.transaction('kv','readwrite');t.objectStore('kv').put(value,key);t.oncomplete=res;t.onerror=()=>rej(t.error)})}
const save=()=>put('meetings',meetings);
async function writeFile(m){
  if(!fsOn())return null;
  const path=M.filePath(m);
  try{await naklios.fs.write(path,M.toMarkdown(m));if(m.file&&m.file!==path)await naklios.fs.delete(m.file).catch(()=>{});m.file=path;await save();return path}
  catch(e){setStatus(`Saved in this browser; the file could not be written: ${e.message}`);return null}
}

// ── the speech model runs in its own worker ──
function asr(){
  if(workerReady)return workerReady;
  worker=new Worker(new URL('./asr-worker.js',import.meta.url),{type:'module'});
  worker.addEventListener('error',e=>{console.error('[meetings] worker',e.message);setStatus(`The speech model stopped: ${e.message||'worker error'}`)});
  workerReady=new Promise((res,rej)=>{
    worker.addEventListener('message',({data:m})=>{
      if(m.type==='progress'&&m.data.status==='progress'&&m.data.total>5e6)setStatus(`Downloading ${MODEL_LABEL} once (${m.data.file?.split('/').pop()}): ${Math.round(m.data.progress||0)}%`);
      else if(m.type==='ready'){backend=m.backend;res(m);setStatus(`${MODEL_LABEL} is ready on ${m.backend==='webgpu'?'the GPU':'the processor'}${m.note?` (${m.note})`:''}.`)}
      else if(m.type==='error'&&m.id==null){workerReady=null;rej(new Error(m.message))}
      else if((m.type==='text'||m.type==='error')&&jobs.has(m.id)){const j=jobs.get(m.id);jobs.delete(m.id);m.type==='text'?j.res(m.text):j.rej(new Error(m.message))}
    });
  });
  setStatus(`Loading ${MODEL_LABEL}…`);
  worker.postMessage({type:'load'});
  return workerReady;
}
async function transcribe(audio,language){await asr();const id=++jobSeq;return new Promise((res,rej)=>{jobs.set(id,{res,rej});worker.postMessage({type:'run',id,audio,language},[audio.buffer])})}

// ── recording: the microphone at 16 kHz, cut into 15–25 s segments at a pause, each transcribed in turn ──
async function startRecording(){
  if(rec)return;
  const stream=await navigator.mediaDevices.getUserMedia({audio:{channelCount:1,echoCancellation:true,noiseSuppression:true}});
  const ctx=new AudioContext({sampleRate:M.RATE});
  await ctx.audioWorklet.addModule(new URL('./capture-worklet.js',import.meta.url));
  const node=new AudioWorkletNode(ctx,'meetings-capture');
  ctx.createMediaStreamSource(stream).connect(node);
  const now=Date.now(),language=$('lang').value;
  const m={id:`m${now}`,title:M.defaultTitle(now),startedAt:now,seconds:0,language,model:MODEL_LABEL,lines:[],recording:true};
  meetings.unshift(m);selected=m.id;
  rec={m,stream,ctx,node,pending:new Float32Array(0),at:0,queue:[],running:null,startedAt:performance.now(),timer:null};
  node.port.onmessage=e=>take(e.data);
  rec.timer=setInterval(tick,500);
  $('record').hidden=true;$('stop').hidden=false;
  await save();render();void asr().catch(e=>setStatus(`The speech model did not load: ${e.message}`));
}
function take(block){
  const r=rec;if(!r)return;
  const next=new Float32Array(r.pending.length+block.length);next.set(r.pending);next.set(block,r.pending.length);r.pending=next;
  for(let cut=M.cutPoint(r.pending);cut;cut=M.cutPoint(r.pending)){enqueue(r,r.pending.slice(0,cut));r.pending=r.pending.slice(cut)}
}
function enqueue(r,samples){const start=r.at/M.RATE;r.at+=samples.length;r.queue.push({start,samples});drain(r)}
function drain(r){
  if(r.running)return r.running;
  return r.running=(async()=>{
    while(r.queue.length){
      const seg=r.queue.shift();
      if(M.isSilent(seg.samples))continue;
      try{const text=M.cleanText(await transcribe(seg.samples,r.m.language||undefined));if(text){r.m.lines.push({at:Math.round(seg.start),text});await save();render()}}
      catch(e){setStatus(`A ${Math.round(seg.samples.length/M.RATE)} s stretch at ${M.clock(seg.start)} was not transcribed: ${e.message}`)}
    }
    r.running=null;
  })();
}
function tick(){if(!rec)return;rec.m.seconds=Math.round((performance.now()-rec.startedAt)/1000);$('clock').textContent=M.clock(rec.m.seconds);$('clock').className='clock live'}
async function stopRecording(){
  const r=rec;if(!r)return;
  r.node.port.postMessage('flush');await new Promise(res=>setTimeout(res,120));
  rec=null;clearInterval(r.timer);r.stream.getTracks().forEach(t=>t.stop());await r.ctx.close().catch(()=>{});
  r.m.seconds=Math.round((performance.now()-r.startedAt)/1000);
  if(r.pending.length>M.RATE/2)enqueue(r,r.pending);
  $('record').hidden=false;$('stop').hidden=true;$('clock').className='clock';
  setStatus('Finishing the transcript…');render();
  await drain(r);
  delete r.m.recording;await save();
  const file=await writeFile(r.m);render();
  setStatus(`Recorded ${M.clock(r.m.seconds)}: ${r.m.lines.length} line(s) transcribed${file?`, saved to ${file}`:', kept in this browser'}.`);
}

// ── notes: the person's NakliOS model writes the summary, decisions and actions ──
async function summarise(m){
  if(!aiOn())throw new Error('No AI model is available in NakliOS (Settings → AI).');
  if(!m.lines.length)throw new Error('This meeting has no transcript to summarise.');
  const chunks=M.parts(m),got=[];
  for(let i=0;i<chunks.length;i++){
    setStatus(`Writing notes${chunks.length>1?` (part ${i+1} of ${chunks.length})`:''}…`);
    const out=await naklios.ai.chat.completions.create({messages:M.summaryPrompt(m,chunks[i],i+1,chunks.length),max_tokens:900});
    got.push(M.parseSummary(out?.choices?.[0]?.message?.content));
  }
  m.summary=M.joinSummaries(got);await save();await writeFile(m);render();
  setStatus(`Notes written: ${m.summary.decisions.length} decision(s), ${m.summary.actions.length} action(s).`);
  return m.summary;
}
async function toFollowups(a){
  if(!naklios.experimental_commands?.call)throw new Error('Open Meetings inside NakliOS to use Follow-ups.');
  const out=await naklios.experimental_commands.call('followups.followups.add',{what:`${a.what}${a.when?` by ${a.when}`:''}`,who:a.who||''});
  if(out&&out.ok===false)throw new Error(out.message||'Follow-ups refused it');
  const f=out?.result??out;setStatus(`Added to Follow-ups${f?.due?`, due ${f.due}`:' with no date'}.`);
}

// ── drawing ──
const el=(tag,cls,text)=>{const e=document.createElement(tag);if(cls)e.className=cls;if(text!=null)e.textContent=text;return e};
function renderList(){
  const list=$('list');list.textContent='';
  for(const m of meetings){const b=el('button','mt'+(m.id===selected?' on':''));b.type='button';
    b.append(el('div','t',m.title),el('div','m',`${new Date(m.startedAt).toLocaleDateString('en-GB',{day:'numeric',month:'short'})} · ${M.clock(m.seconds||0)}${m.recording?' · recording':''}${m.summary?' · notes':''}`));
    b.addEventListener('click',()=>{selected=m.id;render()});list.append(b)}
}
let deleteArmed=null;
function render(){
  renderList();
  const main=$('main');main.textContent='';const m=byId(selected);
  if(!m){main.append(el('div','empty',meetings.length?'Pick a meeting on the left.':'No meetings yet. Press Record: the microphone is transcribed in this browser by Whisper as you speak, and only the text is kept. Notes come from your NakliOS model when you ask for them.'));return}
  const head=el('div','head');
  const title=el('input');title.id='title';title.value=m.title;title.setAttribute('aria-label','Meeting title');
  title.addEventListener('change',async()=>{m.title=title.value.trim()||M.defaultTitle(m.startedAt);await save();if(m.file)await writeFile(m);renderList()});
  const btn=(id,label,fn,title)=>{const b=el('button','btn',label);b.id=id;if(title)b.title=title;b.addEventListener('click',async()=>{b.disabled=true;try{await fn()}catch(e){setStatus(e.message)}finally{b.disabled=false}});return b};
  head.append(title,
    btn('summarise',m.summary?'Rewrite notes':'Write notes',()=>summarise(m),'Your NakliOS model writes a summary, decisions and actions from the transcript'),
    btn('copy','Copy',async()=>{await navigator.clipboard.writeText(M.toMarkdown(m));setStatus('Copied the meeting as Markdown.')},'Copy the notes and transcript as Markdown'),
    btn('download','Download',async()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([M.toMarkdown(m)],{type:'text/markdown'}));a.download=M.filePath(m).slice(9);a.click();setTimeout(()=>URL.revokeObjectURL(a.href),5000)},'Save the meeting as a Markdown file'),
    btn('delete',deleteArmed===m.id?'Confirm delete':'Delete',async()=>{
      if(m.recording)throw new Error('Stop the recording first.');
      if(deleteArmed!==m.id){deleteArmed=m.id;render();setTimeout(()=>{if(deleteArmed===m.id){deleteArmed=null;render()}},4000);return}
      deleteArmed=null;if(m.file&&fsOn())await naklios.fs.delete(m.file).catch(()=>{});
      meetings=meetings.filter(x=>x!==m);selected=meetings[0]?.id||null;await save();render();setStatus(`Deleted "${m.title}".`)},'Delete this meeting and its file'));
  main.append(head,el('p','meta',`${new Date(m.startedAt).toLocaleString('en-GB',{dateStyle:'medium',timeStyle:'short'})} · ${M.clock(m.seconds||0)} · ${m.model}${backend&&m.recording?` on ${backend==='webgpu'?'the GPU':'the processor'}`:''}${m.file?` · ${m.file}`:fsOn()?'':' · kept in this browser'}`));
  if(m.summary){
    main.append(el('h2',null,'Notes'));const n=el('div','notes');n.append(el('p',null,m.summary.summary));
    if(m.summary.decisions.length){n.append(el('h2',null,'Decisions'));const ul=el('ul');for(const d of m.summary.decisions)ul.append(el('li',null,d));n.append(ul)}
    if(m.summary.actions.length){n.append(el('h2',null,'Actions'));for(const a of m.summary.actions){const r=el('div','act');r.append(el('span',null,M.actionLine(a)));
      const b=el('button','btn small','To Follow-ups');b.title='Add it to Follow-ups; its day is read from the words';b.addEventListener('click',()=>void toFollowups(a).catch(e=>setStatus(`Follow-ups: ${e.message}`)));r.append(b);n.append(r)}}
    main.append(n);
  }
  main.append(el('h2',null,`Transcript (${m.lines.length})`));
  for(const l of m.lines){const r=el('div','line');r.append(el('span','at',M.clock(l.at)),el('span','tx',l.text));main.append(r)}
  if(m.recording)main.append(el('div','line pending',rec?.m===m?'Listening… each stretch of 15 to 25 seconds appears when it is transcribed.':'The recording stopped when the window closed.'));
  else if(!m.lines.length)main.append(el('div','line pending','No speech was recognised.'));
}

$('record').addEventListener('click',()=>void startRecording().catch(e=>{rec=null;$('record').hidden=false;$('stop').hidden=true;setStatus(/denied|NotAllowed/i.test(e.message+e.name)?'Microphone access was not allowed.':`Recording did not start: ${e.message}`)}));
$('stop').addEventListener('click',()=>void stopRecording().catch(e=>setStatus(`Stop: ${e.message}`)));
window.addEventListener('pagehide',()=>{if(rec){rec.m.seconds=Math.round((performance.now()-rec.startedAt)/1000);void save()}});

// ── commands: the same paths the buttons use (two doors, one core) ──
const need=id=>{const m=byId(String(id||''));if(!m)throw new Error('No meeting has that id; meetings.list gives the ids.');return m};
const COMMAND_HANDLERS={
  async 'meetings.list'(args){const n=Math.min(Math.max(Number(args?.limit)||20,1),100);return{count:meetings.length,meetings:meetings.slice(0,n).map(M.view)}},
  async 'meetings.read'(args){const m=need(args?.id);const transcript=M.transcriptText(m);
    return{...M.view(m),summary:m.summary||null,transcript:transcript.slice(0,60000),truncated:transcript.length>60000}},
  async 'meetings.summarise'(args){const m=need(args?.id);if(m.recording)throw new Error('That meeting is still recording.');return{...M.view(m),...await summarise(m)}},
};
if(naklios.experimental_commands){
  fetch('./commands.json').then(r=>r.json()).then(manifest=>naklios.experimental_commands.register(manifest.commands.map(c=>({...c,handler:COMMAND_HANDLERS[c.name]})))).catch(e=>console.warn('[meetings] commands could not register',e));
}

(async()=>{
  meetings=(await get('meetings'))||[];
  // A window closed mid-recording keeps what was transcribed; it is no longer recording.
  let fixed=false;for(const m of meetings)if(m.recording){delete m.recording;fixed=true}
  if(fixed)await save();
  selected=meetings[0]?.id||null;render();
})();
naklios.onCapabilitiesChange(()=>render());
naklios.requestCapabilities();naklios.ready();
</script>
</body>
</html>
