    --bg-0:#0E1012; --bg-1:#15181B; --bg-2:#1C2024; --bg-3:#242A2F;
    --fg-0:#E6E9EB; --fg-1:#A8B0B6; --fg-2:#838C92; --rule:#262C31;
    --accent:#D98A28; --accent-dim:#8A5A1C; --err:#C2564B; --ok:#5C9E6B;
    --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
    --ui:"IBM Plex Sans",system-ui,sans-serif;
  }
  *{box-sizing:border-box}
  *{scrollbar-width:thin;scrollbar-color:var(--accent-dim) transparent}
  *::-webkit-scrollbar{width:10px;height:10px}
  *::-webkit-scrollbar-thumb{background:var(--accent-dim);border:2px solid transparent;border-radius:999px;background-clip:padding-box}
  *::-webkit-scrollbar-thumb:hover{background:var(--accent)}
  html,body{height:100%;margin:0}
  body{background:var(--bg-0);color:var(--fg-0);font-family:var(--ui);font-size:13px;display:flex;flex-direction:column;overflow:hidden}
  button{font-family:var(--ui);font-size:12px;color:var(--fg-1);background:var(--bg-2);border:1px solid var(--rule);border-radius:5px;padding:4px 9px;cursor:pointer}
  button:hover{border-color:var(--accent);color:var(--accent)}
  button.icon{padding:4px 7px;line-height:1}
  button.icon.dim{opacity:.4} button.icon.dim:hover{opacity:1}
  button.icon.scope{font-family:var(--mono);font-size:9px;text-transform:uppercase;letter-spacing:.04em;padding:2px 6px}
  button.icon.scope.on{color:var(--accent);border-color:var(--accent)}

  /* header */
  header{display:flex;align-items:center;gap:10px;padding:7px 12px;border-bottom:1px solid var(--rule);background:var(--bg-1);flex:0 0 auto}
  header .brand{font-weight:600} header .brand b{color:var(--accent)}
  header .sub{color:var(--fg-2);font-size:11px}
  header .ws{color:var(--fg-2);font-family:var(--mono);font-size:11px;margin-left:6px;padding:2px 7px;border:1px solid var(--rule);border-radius:999px}
  header .spacer{flex:1}

  /* three-pane grid */
  main{flex:1;display:grid;grid-template-columns:var(--left,248px) 1fr 0;min-height:0;transition:grid-template-columns .16s ease}
  main.preview-open{grid-template-columns:var(--left,248px) 1fr var(--pw,440px)}

  /* left pane — projects & tasks */
  #left{background:var(--bg-1);border-right:1px solid var(--rule);display:flex;flex-direction:column;min-width:0;overflow:hidden}
  #left .lhead{display:flex;align-items:center;gap:6px;padding:9px 12px 6px;color:var(--fg-2);font-size:11px;letter-spacing:.08em;text-transform:uppercase}
  #left .lhead .spacer{flex:1}
  #projects{flex:1;overflow:auto;padding:2px 0 8px;min-height:60px}
  #left .ws-tag{font-family:var(--mono);font-size:9px;color:var(--accent);border:1px solid var(--accent-dim);border-radius:999px;padding:1px 6px;text-transform:none;letter-spacing:0}
  #files{flex:1.2;overflow:auto;padding:2px 0 8px;min-height:60px;border-top:1px solid var(--rule);font-family:var(--mono);font-size:12px}
  #files .frow{display:flex;align-items:center;gap:5px;padding:3px 10px;cursor:pointer;color:var(--fg-1);white-space:nowrap;user-select:none}
  #files .frow:hover{background:var(--bg-2)}
  #files .frow.dir{color:var(--fg-0)}
  #files .ftw{color:var(--fg-2);width:1em;flex:0 0 auto;text-align:center}
  #files .fname{overflow:hidden;text-overflow:ellipsis}
  #files .fempty{color:var(--fg-2);padding:8px 12px;font-size:11px}
  .proj{margin:0}
  .proj > .prow{display:flex;align-items:center;gap:6px;padding:5px 12px;cursor:pointer;color:var(--fg-0);font-weight:600;font-size:12px;user-select:none}
  .proj > .prow:hover{background:var(--bg-2)}
  .proj .tw{color:var(--fg-2);width:1em;display:inline-block;text-align:center;flex:0 0 auto}
  .proj .pname{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}
  .proj .pcount{color:var(--fg-2);font-weight:400;font-family:var(--mono);font-size:10px}
  .task{display:flex;align-items:center;gap:8px;padding:5px 12px 5px 30px;cursor:pointer;color:var(--fg-1);font-size:12px;user-select:none;border-left:2px solid transparent}
  .task:hover{background:var(--bg-2)}
  .task.active{background:var(--bg-3);color:var(--fg-0);border-left-color:var(--accent)}
  .task .ttitle{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}
  .dot{width:7px;height:7px;border-radius:999px;flex:0 0 auto;background:var(--fg-2)}
  .dot.running{background:var(--accent);box-shadow:0 0 0 0 var(--accent);animation:pulse 1.2s infinite}
  .dot.done{background:var(--ok)} .dot.error{background:var(--err)} .dot.idle{background:var(--fg-2)}
  /* Finished, but nothing machine-checked it — a hollow ring, never the solid
     green a gated pass earns. Shape carries the difference, not colour alone. */
  .dot.unclaimed{background:transparent;box-shadow:inset 0 0 0 1.5px var(--ok)}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(217,138,40,.5)}70%{box-shadow:0 0 0 5px rgba(217,138,40,0)}100%{box-shadow:0 0 0 0 rgba(217,138,40,0)}}
  #left .lfoot{border-top:1px solid var(--rule);padding:8px;display:flex;gap:6px}
  #left .lfoot button{flex:1}

  /* center — chat */
  #center{display:flex;flex-direction:column;min-width:0;min-height:0;background:var(--bg-0)}
  #taskbar{display:flex;align-items:center;gap:10px;padding:8px 14px;border-bottom:1px solid var(--rule);background:var(--bg-1);flex:0 0 auto}
  #taskbar .ttl{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  #taskbar .meta{color:var(--fg-2);font-family:var(--mono);font-size:11px}
  #taskbar .spacer{flex:1}
  .stopbtn{font-size:11px;color:var(--err);background:transparent;border:1px solid var(--err);border-radius:5px;padding:3px 10px;cursor:pointer;flex:0 0 auto}
  .stopbtn:hover{background:var(--err);color:#fff}
  .gatebtn{font-family:var(--mono);font-size:10.5px;color:var(--fg-2);background:transparent;border:1px solid var(--rule);border-radius:5px;padding:3px 9px;cursor:pointer;flex:0 0 auto;max-width:280px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .gatebtn:hover{border-color:var(--accent);color:var(--accent)}
  .gatebtn.on{color:var(--ok);border-color:var(--ok)}
  .gatebtn.beta{opacity:.72;border-style:dashed;font-size:10px}
  .gatebtn.beta:hover{opacity:1}
  .es-lead{color:var(--fg-2);max-width:520px;margin:6px auto 0;line-height:1.5}
  .es-banner{margin:14px auto 0;max-width:520px;padding:9px 12px;border:1px solid var(--accent);border-radius:6px;color:var(--fg);background:rgba(217,138,40,.08);font-size:12px;text-align:left}
  .es-egs{margin:18px auto 0;max-width:580px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:center}
  .es-egs>span{color:var(--fg-2);font-size:12px}
  .es-chip{font:inherit;font-size:12px;color:var(--fg-2);background:transparent;border:1px solid var(--rule);border-radius:14px;padding:5px 12px;cursor:pointer}
  .es-chip:hover{border-color:var(--accent);color:var(--accent)}
  .advwrap{position:relative;flex:0 0 auto;display:inline-flex}
  .advmenu{position:absolute;right:0;top:calc(100% + 5px);background:#161b23;border:1px solid var(--rule);border-radius:7px;padding:5px;z-index:60;box-shadow:0 6px 20px rgba(0,0,0,.4)}
  .advitem{display:block;width:max-content;max-width:320px;text-align:left;background:transparent;border:0;color:var(--fg-2);font:inherit;font-size:11.5px;padding:7px 11px;border-radius:5px;cursor:pointer;white-space:nowrap}
  .advitem:hover{background:var(--rule);color:var(--fg)}
  #log{flex:1;overflow:auto;padding:16px 0}
  .wrap{max-width:760px;margin:0 auto;padding:0 20px}
  .msg{margin:0 0 14px}
  .msg .who{font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--fg-2);margin-bottom:3px}
  .msg.user .who{color:var(--accent)}
  .msg .body{white-space:pre-wrap;word-wrap:break-word;line-height:1.5}
  .msg.user .body{background:var(--bg-2);border:1px solid var(--rule);border-radius:8px;padding:8px 11px}
  .msg.system .body{color:var(--fg-2);font-size:12px;border-left:2px solid var(--accent-dim);padding-left:10px}
  .tool{font-family:var(--mono);font-size:11.5px;border:1px solid var(--rule);border-radius:7px;margin:0 0 10px;overflow:hidden;background:var(--bg-1)}
  .tool summary{padding:6px 10px;cursor:pointer;color:var(--fg-1);display:flex;align-items:center;gap:8px;list-style:none}
  .tool summary::-webkit-details-marker{display:none}
  .tool summary .tn{color:var(--accent)} .tool summary .td{color:var(--fg-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}
  .tool summary .tg{color:var(--fg-2);font-size:10px}
  .tool .tout{border-top:1px solid var(--rule);padding:8px 10px;white-space:pre-wrap;color:var(--fg-1);max-height:280px;overflow:auto;background:var(--bg-0)}
  .tool.err summary .tn{color:var(--err)}
  #log .empty{max-width:560px;margin:8vh auto 0;text-align:center;color:var(--fg-2);padding:0 20px}
  #log .empty h2{color:var(--fg-1);font-weight:600;font-size:15px;margin:0 0 8px}
  /* markdown, copy buttons, change chips */
  .msg .mhead{display:flex;align-items:center;gap:8px;margin-bottom:3px}
  .msg .mhead .who{margin-bottom:0;flex:1}
  .msg.assistant .body{line-height:1.5}
  .md-p{white-space:pre-wrap;word-wrap:break-word;line-height:1.5;margin:0 0 8px}
  .md-p:last-child{margin-bottom:0}
  .body code.inline{font-family:var(--mono);font-size:.92em;background:var(--bg-2);border:1px solid var(--rule);border-radius:4px;padding:0 4px}
  .body strong{color:var(--fg-0);font-weight:600}
  .code{border:1px solid var(--rule);border-radius:7px;overflow:hidden;margin:8px 0;background:var(--bg-1)}
  .code-head{display:flex;align-items:center;gap:8px;padding:4px 8px;border-bottom:1px solid var(--rule);font-family:var(--mono);font-size:10px;color:var(--fg-2)}
  .code-head .lang{flex:1;text-transform:uppercase;letter-spacing:.05em}
  .code pre{margin:0;padding:9px 11px;overflow:auto;max-height:420px}
  .code code{font-family:var(--mono);font-size:11.5px;line-height:1.55;color:var(--fg-0);white-space:pre}
  .copybtn{font-family:var(--ui);font-size:10px;color:var(--fg-2);background:var(--bg-2);border:1px solid var(--rule);border-radius:4px;padding:2px 7px;cursor:pointer;flex:0 0 auto}
  .copybtn:hover{border-color:var(--accent);color:var(--accent)}
  .copybtn.ok{color:var(--ok);border-color:var(--ok)}
  .change{display:flex;align-items:center;gap:8px;margin:0 0 10px;padding:6px 10px;border:1px solid var(--rule);border-radius:7px;background:var(--bg-1);font-family:var(--mono);font-size:11.5px;color:var(--fg-1);cursor:pointer}
  .change:hover{border-color:var(--accent);color:var(--fg-0)}
  .change .ci{color:var(--accent);flex:0 0 auto} .change .cf{overflow:hidden;text-overflow:ellipsis;white-space:nowrap} .change .cv{color:var(--fg-2);margin-left:auto;padding-left:8px;flex:0 0 auto}
  .msg.queued{opacity:.5} .msg.queued .who{color:var(--accent)}
  /* composer */
  #composer{flex:0 0 auto;border-top:1px solid var(--rule);background:var(--bg-1);padding:10px 20px 12px}
  #composer .cwrap{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:6px}
  #composer .crow{display:flex;gap:8px;align-items:flex-end}
  #prompt{flex:1;resize:none;min-height:38px;max-height:180px;background:var(--bg-0);color:var(--fg-0);border:1px solid var(--rule);border-radius:8px;padding:9px 11px;font-family:var(--ui);font-size:13px;line-height:1.45;outline:0}
  #prompt:focus{border-color:var(--accent-dim)}
  #send{background:var(--accent);color:#161009;border:0;font-weight:600;padding:9px 16px;border-radius:8px}
  #send:hover{filter:brightness(1.08)} #send:disabled{opacity:.5;cursor:default}
  #composer .hint{color:var(--fg-2);font-size:10.5px;display:flex;gap:12px}
  #composer .mode{color:var(--fg-2);background:transparent;border:0;font-family:var(--mono);font-size:10.5px;cursor:pointer;padding:0}
  #composer .mode.on{color:var(--accent)}

  /* right — preview */
  #preview{background:var(--bg-1);border-left:1px solid var(--rule);display:flex;flex-direction:column;min-width:0;overflow:hidden}
  #preview .phead{display:flex;align-items:center;gap:8px;padding:8px 12px;border-bottom:1px solid var(--rule);flex:0 0 auto}
  #preview .phead .pt{font-weight:600;font-size:12px} #preview .phead .pf{color:var(--fg-2);font-family:var(--mono);font-size:11px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}
  .revertbtn{font-size:10px;color:var(--err);background:transparent;border:1px solid var(--err);border-radius:5px;padding:2px 8px;cursor:pointer;flex:0 0 auto}
  .pv-note{font-size:11px;color:var(--muted);border-left:2px solid var(--muted);padding:4px 8px;margin:0 0 8px}
  .pv-actions{display:flex;gap:6px;flex-wrap:wrap;padding:10px 0 0;border-top:1px solid var(--line);margin-top:10px}
  .meta.bypass{color:var(--err);font-weight:600}
  .revertbtn:hover{background:var(--err);color:#fff}
  #preview .pbody{flex:1;min-height:0;overflow:auto}
  #preview iframe{width:100%;height:100%;border:0;background:#fff}
  #preview pre{margin:0;padding:12px;font-family:var(--mono);font-size:12px;line-height:1.5;white-space:pre-wrap;color:var(--fg-0)}
  #preview pre .add{color:var(--ok)} #preview pre .del{color:var(--err)} #preview pre .hd{color:var(--fg-2)}
  #preview .pempty{color:var(--fg-2);text-align:center;padding:40px 20px}


  /* ── Mobile / foldable (phone <768 · tablet 768–1023 · desktop ≥1024) ── */
  /* Motion tokens (Forge §Motion) */
  :root{--dur:120ms;--ease:cubic-bezier(.2,0,0,1)}
  header{padding-top:calc(7px + env(safe-area-inset-top))}  /* notch-safe at every width (0 on desktop) */

  /* Coarse pointers: honest touch targets. */
  @media (pointer:coarse) and (max-width:1023px){
    button{min-height:34px}
    #send,#mode-btn,.swtab,#more-btn,#drawer-btn,#mobilebar .mb-title,#mobilebar .mb-verify,#mobilebar .mb-stop,.sheet-row{min-height:44px}
  }

  /* Persistent mobile chrome — off by default, switched on per mode below. */
  #mobilebar,#switcher,#more-btn,#drawer-btn{display:none}
  #mobilebar{align-items:center;gap:8px;min-height:44px;padding:0 12px;background:var(--bg-1);border-top:1px solid var(--rule);flex:0 0 auto}
  #mobilebar .mb-title{flex:0 1 auto;max-width:58vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;background:transparent;border:0;color:var(--fg-0);font-weight:600;font-size:12px;text-align:left;padding:0;cursor:pointer}
  #mobilebar .mb-title::after{content:" ▾";color:var(--fg-2)}
  #mobilebar .spacer{flex:1}
  #mobilebar .mb-verify{background:transparent;border:1px solid var(--rule);border-radius:5px;color:var(--fg-2);font-family:var(--mono);font-size:10.5px;padding:3px 9px;max-width:42vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;cursor:pointer}
  #mobilebar .mb-verify.on{color:var(--ok);border-color:var(--ok)}
  #mobilebar .mb-stop{color:var(--err);background:transparent;border:1px solid var(--err);border-radius:5px;font-size:11px;padding:3px 9px;cursor:pointer}
  #switcher{flex:0 0 auto;border-top:1px solid var(--rule);background:var(--bg-1);padding-bottom:env(safe-area-inset-bottom)}
  .swtab{flex:1;min-height:44px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;background:transparent;border:0;color:var(--fg-2);font:inherit;cursor:pointer;transition:color var(--dur) var(--ease)}
  .swtab[aria-pressed="true"]{color:var(--accent)}
  .swtab .g{font-size:16px;line-height:1;position:relative}
  .swtab .l{font-family:var(--mono);font-size:10px;letter-spacing:.02em}
  .swtab.has-new .g::after{content:"";position:absolute;top:-3px;right:-7px;width:6px;height:6px;border-radius:999px;background:var(--accent)}

  /* Bottom sheet (More) + drawer scrim */
  #sheet,#drawer-scrim{position:fixed;inset:0;z-index:80;background:rgba(0,0,0,.5);display:none}
  #sheet.open,#drawer-scrim.open{display:block}
  #sheet .sheet-panel{position:absolute;left:0;right:0;bottom:0;background:var(--bg-1);border-top:1px solid var(--rule);border-radius:14px 14px 0 0;padding:6px 8px calc(10px + env(safe-area-inset-bottom));max-height:82vh;overflow:auto;animation:sheetup var(--dur) var(--ease)}
  @keyframes sheetup{from{transform:translateY(100%)}to{transform:translateY(0)}}
  #sheet .sheet-grip{width:36px;height:4px;border-radius:999px;background:var(--rule);margin:6px auto 8px}
  .sheet-row{display:flex;align-items:center;gap:11px;width:100%;text-align:left;background:transparent;border:0;color:var(--fg-0);font:inherit;font-size:13.5px;padding:12px;border-radius:8px;cursor:pointer}
  .sheet-row:active{background:var(--bg-2)}
  .sheet-row .sr-ic{width:1.4em;text-align:center;flex:0 0 auto}
  .sheet-row .sr-sub{color:var(--fg-2);font-size:11px;margin-left:auto;font-family:var(--mono);text-transform:uppercase;letter-spacing:.04em}
  .sheet-sep{height:1px;background:var(--rule);margin:6px 12px}

  /* Tablet 768–1023 (unfolded inner display): centre + preview rail, #left = drawer */
  @media (min-width:768px) and (max-width:1023px){
    #drawer-btn{display:inline-flex}
    main[data-mode="tablet"]{grid-template-columns:1fr 0;position:relative}
    main[data-mode="tablet"].preview-open{grid-template-columns:1fr var(--pw,360px)}
    main[data-mode="tablet"] #left{position:absolute;top:0;bottom:0;left:0;width:288px;z-index:90;transform:translateX(-100%);transition:transform var(--dur) var(--ease);box-shadow:8px 0 28px rgba(0,0,0,.5)}
    main[data-mode="tablet"].drawer-open #left{transform:translateX(0)}
  }

  /* Phone <768 (cover screen / split view): one surface at a time + switcher */
  @media (max-width:767px){
    #switcher,#mobilebar{display:flex}
    #more-btn{display:inline-flex}
    header .sub,#open-folder,#toggle-preview,#ws,#taskbar{display:none}
    /* Pre-boot fallback (before JS sets data-mode): Chat only, no squished 3-col. */
    main:not([data-mode]){display:block;grid-template-columns:1fr}
    main:not([data-mode]) #left,main:not([data-mode]) #preview{display:none}
    main:not([data-mode]) #center{display:flex;height:100%}
    main[data-mode="phone"],main[data-mode="phone"].preview-open{display:block;grid-template-columns:1fr}
    main[data-mode="phone"] #left,
    main[data-mode="phone"] #center,
    main[data-mode="phone"] #preview{display:none;height:100%;min-height:0;overflow:auto}
    main[data-mode="phone"][data-surface="chat"] #center{display:flex}
    main[data-mode="phone"][data-surface="preview"] #preview{display:flex}
    main[data-mode="phone"][data-surface="files"] #left{display:flex}
    main[data-mode="phone"][data-surface="tasks"] #left{display:flex}
    main[data-mode="phone"][data-surface="files"] #left .sec-tasks,

<!-- The NakliOS host bridge: establishes window.naklios (+ .ai) over postMessage
     when running as a system-app window inside NakliOS. Same as Forge. Standalone
     (window.parent === window) every method no-ops / rejects, so Anvil degrades
     honestly. Loaded as a classic script before the module so window.naklios
     exists when the app boots. -->
<script src="../../sdk/naklios.js"></script>

<!-- Boot error net. The whole app is ONE module script with a long static import
     list; the markup above is already painted, so a failed import or a throw during
     boot leaves a UI that looks alive and answers nothing — a silent failure with no
     console anyone reads. Classic script, before the module, so it is installed even
     if the module never parses. Capture phase, because a script that fails to LOAD
     fires a non-bubbling error event on the element, not on window. -->
<script>
  window.__anvilBoot = { ok: false, shown: false };
  (function () {
    function show(what, detail) {
      if (window.__anvilBoot.ok || window.__anvilBoot.shown) return;
      window.__anvilBoot.shown = true;
      var d = document.createElement('div');
      d.setAttribute('role', 'alert');
      d.style.cssText = 'position:fixed;inset:0;z-index:99999;overflow:auto;padding:28px;'
        + 'background:#1b1210;color:#f4d9d2;font:13px/1.55 ui-monospace,SFMono-Regular,Menlo,monospace';
      d.textContent = 'Anvil did not start.\n\n' + what + '\n\n' + (detail || '')
        + '\n\nThe interface behind this notice is painted but not wired — nothing in it works.'
        + '\nReload after fixing, or open the console for the full trace.';
      d.style.whiteSpace = 'pre-wrap';
      document.documentElement.appendChild(d);
    }
    window.addEventListener('error', function (e) {
      if (e && e.target && e.target !== window && e.target.tagName) {
        var src = e.target.src || e.target.href || '';
        // A module script whose IMPORT 404s fires a bare error on the script element
        // with no src and no message — the browser deliberately hands JS nothing. The
        // network log is the only place the failing URL exists, so say that.
        show(src ? 'A required file failed to load.' : 'A module import failed to load.',
             src || 'The failing URL is in the Network tab, as a 404 for a .mjs file.');
        return;
      }
      show('A script error stopped the boot.', e && (e.message + (e.filename ? '\n' + e.filename + ':' + e.lineno : '')));
    }, true);
    window.addEventListener('unhandledrejection', function (e) {
      var r = e && e.reason;
      show('An unhandled rejection stopped the boot.', r && (r.stack || r.message || String(r)));
    });
    // A boot that neither finishes nor throws is still a failure, and the one the
    // listeners above cannot see. Ten seconds is well past a cold module fetch.
    setTimeout(function () { show('Boot did not finish within 10 seconds.', 'No error was reported.'); }, 10000);
  })();
</script>

  const DIR_DB='anvil-fs', DIR_STORE='h', DIR_KEY='workspace-dir';
  // v2 adds the RUN INDEX — rows derived from run records, so a Runs pane can query
  // by project/task/time without opening every file. It is never the truth: the
  // record files are (OPFS + the home). Codex keeps the same split (JSONL rollouts
  // + a SQLite index with a parity doctor); ours is IndexedDB because the browser
  // already provides it, and rebuildRunIndex() is the doctor.
  const RUNS_STORE='runs';
  function idbOpen(){return new Promise((res,rej)=>{const r=indexedDB.open(DIR_DB,2);r.onupgradeneeded=()=>{const db=r.result; if(!db.objectStoreNames.contains(DIR_STORE)) db.createObjectStore(DIR_STORE); if(!db.objectStoreNames.contains(RUNS_STORE)){ const st=db.createObjectStore(RUNS_STORE,{keyPath:'id'}); st.createIndex('project','project'); st.createIndex('task','task'); st.createIndex('endedAt','endedAt'); }};r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);});}
  async function runsPut(row){try{const db=await idbOpen();await new Promise((res)=>{const t=db.transaction(RUNS_STORE,'readwrite').objectStore(RUNS_STORE).put(row);t.onsuccess=res;t.onerror=res;});}catch(_){} }
  async function runsForTask(taskId){try{const db=await idbOpen();return await new Promise((res)=>{const q=db.transaction(RUNS_STORE).objectStore(RUNS_STORE).index('task').getAll(taskId);q.onsuccess=()=>res(q.result||[]);q.onerror=()=>res([]);});}catch(_){return [];}}
  async function runsCount(){try{const db=await idbOpen();return await new Promise((res)=>{const q=db.transaction(RUNS_STORE).objectStore(RUNS_STORE).count();q.onsuccess=()=>res(q.result||0);q.onerror=()=>res(0);});}catch(_){return 0;}}
  // One index row from one record. `tiers` is where the file was found/written.
  function runIndexRow({ project, task, name, path, tiers, rec, gated }){
    const ev=rec.events(); const st=foldStatus(ev, rec.resolve, { gated });
    return { id: project+'/'+task+'/'+name, project, task, name, path, tiers,
      head: rec.head ? rec.head() : null, events: ev.length,
      stop: st.stop, status: st.status, verified: st.verified, steps: st.steps,
      startedAt: ev.length ? ev[0].ts : null, endedAt: ev.length ? ev[ev.length-1].ts : null };
  }
  // The doctor: rebuild the index from the record FILES (OPFS, and the home when
  // connected). Runs at boot when the index is empty but files exist — Codex's
  // "startup backfill" — and is the answer whenever the two disagree. Every file
  // is chain-verified on the way in; a broken chain is indexed as such, not hidden.
  async function rebuildRunIndex(){
    const found=new Map(); // id -> { row, tiers }
    async function scan(rootDir, tier){
      let projects; try{ projects=rootDir.entries(); }catch(_){ return; }
      for await (const [project, ph] of projects){ if(ph.kind!=='directory') continue;
        for await (const [task, th] of ph.entries()){ if(th.kind!=='directory') continue;
          for await (const [name, fh] of th.entries()){ if(fh.kind!=='file'||!name.endsWith('.json')) continue;
            try{ const dump=JSON.parse(await (await fh.getFile()).text()); const rec=loadRecord(dump); const v=await rec.verify();
              const id=project+'/'+task+'/'+name; const prev=found.get(id);
              if(prev){ prev.tiers.push(tier); continue; }
              const row=runIndexRow({ project, task, name, path:(tier==='home'?'home:':'anvil/runs/')+project+'/'+task+'/'+name, tiers:[tier], rec:{ events:rec.events, resolve:rec.resolve, head:()=>null }, gated:true });
              row.chainOk=v.ok; row.brokenAt=v.brokenAt; found.set(id,{ row, tiers:row.tiers, rec });
            }catch(_){ /* unreadable file: not indexed, not fatal */ }
          } } }
    }
    try{ if(opfsAvailable()){ let d=await navigator.storage.getDirectory(); d=await d.getDirectoryHandle('anvil'); d=await d.getDirectoryHandle('runs'); await scan(d, opfsPersisted===true?'browser storage (persisted)':'browser storage (evictable)'); } }catch(_){}
    try{ if(homeHandle){ const d=await homeHandle.getDirectoryHandle('runs'); await scan(d,'home'); } }catch(_){}
    // rung 2 via fileops (the host store has no directory handles).
    try{ if(hostFsReady()){
      const which=String((nak.capabilities&&nak.capabilities.fsBackend)||'host'); const tier = which==='crate' ? 'Crate' : 'host '+which;
      const hx=createFileops({ backend:new CrateBackend(nak.fs), root:'' });
      const ls=await hx.list('runs',{recursive:true});
      for(const e of ((ls&&ls.entries)||[])){ if(e.type==='dir'||!String(e.name||e.path||'').endsWith('.json')) continue;
        const parts=String(e.path).split('/'); if(parts.length<4) continue; const [ , project, task, name ]=parts;
        try{ const r=await hx.read(e.path,{encoding:'utf-8'}); if(!(r&&r.ok)) continue; const dump=JSON.parse(r.data); const rec=loadRecord(dump); const v=await rec.verify();
          const id=project+'/'+task+'/'+name; const prev=found.get(id); if(prev){ prev.tiers.push(tier); continue; }
          const row=runIndexRow({ project, task, name, path:e.path, tiers:[tier], rec:{ events:rec.events, resolve:rec.resolve, head:()=>null }, gated:true });
          row.chainOk=v.ok; row.brokenAt=v.brokenAt; found.set(id,{ row, tiers:row.tiers, rec });
        }catch(_){}
      }
    } }catch(_){}
    let indexed=0, broken=0;
    for(const { row } of found.values()){ await runsPut(row); indexed++; if(row.chainOk===false) broken++; }
    // D1: how runs end, over every record the doctor just read — khiladi's Q3, as a fold.
    const stops=foldStopReasons([...found.values()].map(f=>f.rec), { gated:true });
    return { indexed, broken, stops, stopsLine: stopReasonsLine(stops) };
  }
  async function idbGet(k){try{const db=await idbOpen();return await new Promise((res)=>{const t=db.transaction(DIR_STORE).objectStore(DIR_STORE).get(k);t.onsuccess=()=>res(t.result);t.onerror=()=>res(null);});}catch(_){return null;}}
  async function idbSet(k,v){try{const db=await idbOpen();await new Promise((res)=>{const t=db.transaction(DIR_STORE,'readwrite').objectStore(DIR_STORE).put(v,k);t.oncomplete=res;t.onerror=res;});}catch(_){} }

  // ── Anvil home — rung 1 of the record's storage ladder ────────────────────
  // OPFS (rung 0) is site storage: on 2026-09-04 navigator.storage.persisted()
  // was FALSE on naklios.dev even though the host asks for it at boot, so every
  // record there is eviction-eligible. The home is ONE folder on the user's own
  // disk, picked once and remembered (like ~/.codex), OUTSIDE every workspace so
  // no agent mount can reach it — a ledger the agent can rewrite audits nothing.
  // Records mirror here write-through; the OPFS copy is a cache, never the truth.
  // Chromium-only (FSA write); elsewhere the ladder degrades to OPFS + Crate.
  const HOME_KEY='anvil-home';
  let homeHandle=null;      // granted FileSystemDirectoryHandle, or null
  let homeSaved=false;      // a handle is remembered but needs a click to re-grant
  let opfsPersisted=null;   // navigator.storage.persisted() at boot; null = unknown
  async function connectHome(h){
    let perm=await h.queryPermission({mode:'readwrite'});
    if(perm!=='granted') perm=await h.requestPermission({mode:'readwrite'});
    if(perm!=='granted') return false;
    homeHandle=h; homeSaved=true; await idbSet(HOME_KEY,h); updateHomeChip(); return true;
  }
  function updateHomeChip(){
    const b=$('home-chip'); if(!b) return;
    b.classList.toggle('dim', !homeHandle);
    b.title = homeHandle
      ? 'Anvil home — run records mirror to "'+homeHandle.name+'" on your disk (durable). Click to change.'
      : homeSaved
        ? 'Anvil home — a folder is remembered but needs permission again this session. Click to reconnect.'
        : 'Anvil home — pick a folder on your disk where run records are kept durably. Until then they live only in browser storage, which the browser may evict.';
  }

  $('open-folder').onclick = async ()=>{
    if(!window.showDirectoryPicker){ pushSystem('This browser has no File System Access — folders unavailable.'); return; }
    try{
      const h = await window.showDirectoryPicker({ mode:'readwrite' });
      let perm = await h.queryPermission({mode:'readwrite'});
      if(perm!=='granted') perm = await h.requestPermission({mode:'readwrite'});
      if(perm!=='granted'){ pushSystem('Folder permission not granted.'); return; }
      folderMode = true;
      mountWorkspace(new FsaBackend(h), 'folder · '+h.name);
      await idbSet(DIR_KEY, h);
      pushSystem('Workspace → folder "'+h.name+'". The agent now reads/writes your files (this overrides the per-project workspace).');
      renderTaskbar();
    }catch(e){ if(!(e&&e.name==='AbortError')) pushSystem('Open folder: '+(e&&e.message||e)); }
  };
  $('home-chip').onclick = async ()=>{
    if(!window.showDirectoryPicker){ pushSystem('This browser has no File System Access — an Anvil home folder is unavailable here; records stay in browser storage.'); return; }
    try{
      const saved = homeSaved && !homeHandle ? await idbGet(HOME_KEY) : null;
      const h = (saved && typeof saved.queryPermission==='function') ? saved : await window.showDirectoryPicker({ mode:'readwrite', id:'anvil-home' });
      if(await connectHome(h)) pushSystem('Anvil home → "'+h.name+'". Run records now mirror to your disk.');
      else pushSystem('Anvil home: permission not granted.');
    }catch(e){ if(!(e&&e.name==='AbortError')) pushSystem('Anvil home: '+(e&&e.message||e)); }
  };

  // ── State: projects → tasks. Persisted to localStorage (minus the live stack) ──
  const LS='anvil-state-v1';
  let state = load() || seedState();
  // AC-4: bring every task's follow-up queue forward, and recover anything a dead run had
  // CLAIMED. A legacy queue is an array of bare strings and must survive — a migration that
  // drops the owner's pending work to tidy a shape is worse than the shape. An entry still
  // marked `dispatching` was claimed by a run that no longer exists (the tab closed between
  // the claim and the run starting): it is demoted back to `pending` rather than lost, and
  // `queueRecovered` carries the count so startup can SAY so. A silent recovery is a defect
  // too — that is the whole lesson of the stale-`running` bug.
  let queueRecovered = 0, queueDropped = 0, runsInterrupted = 0;
  try{
    for(const p of (state.projects||[])){
      for(const t of (p.tasks||[])){
        // A task left `running` belongs to a run that no longer exists: `running` is set when a run
        // starts and is only ever replaced when it ends, so on a fresh load nothing owns it. The
        // in-memory `running` flag is false here, so it does not BLOCK anything — but the UI reads
        // the persisted status, which is how you get a pulsing "running" dot next to a Send button
        // with no Stop, and no way to tell what happened.
        //
        // Demote it, and treat it as what it is: a run that ended badly. That routes it through
        // admitRun, so the next Send holds once and says the workspace may be half-changed —
        // which is the visible refusal this needed, arriving through machinery that already exists
        // rather than a special case.
        if(t.status === 'running'){
          t.status = 'idle'; t.lastStop = 'interrupted'; t.ackAfterBadRun = false;
          (t.log = t.log || []).push({ k:'system', text:'⚠︎ This task was still running when Anvil last closed. The run did not finish, and anything it was part-way through is unfinished in your workspace.' });
          runsInterrupted++;
        }
        if(!t.queued) continue;
        const m = migrateQueue(t.queued); queueDropped += m.dropped;
        const r = reconcileQueue(m.queue); queueRecovered += r.recovered.length;
        t.queued = r.queue;
      }
    }
  }catch(_){}
  // Clean start (UX decision 2026-08-29): one empty task, no cryptic demo work — the
  // empty-state (renderLog) carries the orientation + example prompts.
  function seedState(){
    const pid=id(), t1=id();
    return {
      activeProject:pid, activeTask:t1, previewOpen:false,
      projects:[{ id:pid, name:'My project', open:true, tasks:[
        { id:t1, title:'Untitled task', status:'idle', mode:'code', convo:[], log:[], preview:null },
      ]}],
    };
  }
  function id(){ return 'x'+Math.random().toString(36).slice(2,9); }
  function load(){ try{ return JSON.parse(localStorage.getItem(LS)); }catch(_){ return null; } }
  // Session state persists to localStorage (fast, per-device) AND — when a host
  // backend is connected — to apps/anvil/state.json via naklios.fs, so projects,
  // tasks, and transcripts ROAM with the files (a new machine on the same Crate
  // restores them). The host write is debounced; localStorage is the fast cache.
  const hostFsReady = () => !!(nak && nak.capabilities && nak.capabilities.fs && nak.fs);
  let remoteSaveTimer=null;
  // Two Anvil tabs on one project both write this WHOLE blob, so an idle tab's
  // debounced save used to silently overwrite the other tab's tasks 800ms after
  // any trivial UI change — last-writer-wins over the entire projects/tasks/
  // transcript tree. Two guards now: Web Locks serialise the read-modify-write so
  // it cannot interleave, and a monotonic `rev` makes a STALE tab refuse to write
  // rather than clobber newer state.
  //
  // Honest scope: this is serialisation + conflict DETECTION, not a merge — the
  // stale tab declines and says so instead of losing the other tab's work. Web
  // Locks are same-origin, so it covers tabs on this device, NOT two devices on
  // one roaming Crate. localStorage (below) is still shared and last-writer-wins.
  function scheduleRemoteSave(){
    if(!hostFsReady()) return;
    clearTimeout(remoteSaveTimer);
    remoteSaveTimer=setTimeout(()=>{ void writeRemoteState(); }, 800);
  }
  async function writeRemoteState(){
    const write=async()=>{
      try{
        const disk=await loadRemoteState();
        const diskRev=Number(disk&&disk.rev)||0, mine=Number(state.rev)||0;
        if(disk && diskRev>mine){
          const t=activeTask();
          if(t){ (t.log=t.log||[]).push({k:'system',text:'⚠ Another Anvil tab saved newer state (rev '+diskRev+' > '+mine+'). This tab did NOT overwrite it — reload to pick up its work.'}); renderLog(); }
          return;
        }
        state.rev=mine+1;
        await nak.fs.write('state.json', JSON.stringify(state));
      }catch(_){}
    };
    try{
      if(navigator.locks && navigator.locks.request) await navigator.locks.request('anvil-state', write);
      else await write();
    }catch(_){ /* lock unavailable (or aborted) — the next save retries */ }
  }
  function save(){ try{ const c=JSON.parse(JSON.stringify(state)); localStorage.setItem(LS, JSON.stringify(c)); }catch(_){} scheduleRemoteSave(); }
  async function loadRemoteState(){
    if(!hostFsReady()) return null;
    try{ const data = await nak.fs.read('state.json'); const s = JSON.parse(typeof data==='string'?data:new TextDecoder().decode(data)); return (s && Array.isArray(s.projects)) ? s : null; }
    catch(_){ return null; }
  }

  const proj = (pid)=> state.projects.find(p=>p.id===pid);
  const activeProject = ()=> proj(state.activeProject) || state.projects[0];
  function activeTask(){ for(const p of state.projects){ const t=(p.tasks||[]).find(t=>t.id===state.activeTask); if(t) return t; } return null; }

  // Make a clickable div behave like a button for keyboard + screen-reader users.
  function clickable(el, handler, label){ el.setAttribute('role','button'); el.tabIndex=0; if(label) el.setAttribute('aria-label',label); el.onclick=handler; el.onkeydown=(e)=>{ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); handler(e); } }; return el; }

  // ── Left pane render ──
  function renderProjects(){
    const box=$('projects'); box.innerHTML='';
    for(const p of state.projects){
      const pd=document.createElement('div'); pd.className='proj';
      const prow=document.createElement('div'); prow.className='prow';
      prow.innerHTML=`<span class="tw">${p.open?'▾':'▸'}</span><span class="pname">${esc(p.name)}</span><span class="pcount">${(p.tasks||[]).length}</span>`;
      clickable(prow, ()=>{ p.open=!p.open; save(); renderProjects(); }, (p.open?'Collapse':'Expand')+' project '+p.name);
      pd.appendChild(prow);
      if(p.open) for(const t of (p.tasks||[])){
        const td=document.createElement('div'); td.className='task'+(t.id===state.activeTask?' active':'');
        td.innerHTML=`<span class="dot ${t.status||'idle'}"></span><span class="ttitle">${esc(t.title)}</span>`;
        clickable(td, ()=>selectTask(t.id), 'Open task '+t.title);
        pd.appendChild(td);
      }
      box.appendChild(pd);
    }
  }
  async function selectTask(tid){
    state.activeTask=tid;
    for(const p of state.projects) if((p.tasks||[]).some(t=>t.id===tid)) state.activeProject=p.id;
    save();
    if(!folderMode && state.activeProject!==mountedProject) await mountProject(state.activeProject);
    renderAll();
  }

  $('new-project').onclick=async ()=>{ const n=await askText({ title:'New project', label:'Project name', value:'project' }); if(!n) return; const p={id:id(),name:n,open:true,tasks:[]}; state.projects.push(p); state.activeProject=p.id; save(); if(!folderMode) await mountProject(p.id); renderAll(); };
  $('new-task').onclick=()=>{ const p=activeProject(); if(!p) return; const t={id:id(),title:'Untitled task',status:'idle',mode:'code',convo:[],log:[],preview:null}; p.tasks.push(t); p.open=true; selectTask(t.id); $('prompt').focus(); };

  // ── File explorer: the active workspace's tree (whatever backend), so files
  // are visible in-app. Clicking a file opens it in the preview; the backend tag
  // (folder / crate / opfs) shows WHERE they actually live. ──
  const expandedDirs = new Set();
  // Explorer scope: 'project' (this workspace only, via the mounted backend) or
  // 'all' (the whole store, via naklios.sys.fs — same-origin system apps only).
  // Anvil is a system app, so it can browse across every app's namespace when
  // the host advertises sysFs. Project scope stays the default: a coding
  // workspace is normally what you want, and only it carries diff/revert.
  let filesScope = 'project';
  const sysFsAvailable = () => !!(nak && nak.capabilities && nak.capabilities.sysFs && nak.sys && nak.sys.fs);
  // Adapt naklios.sys.fs (full-path strings, trailing-slash dirs) to the same
  // Rig-fileops shape the explorer walk already speaks, so the walk is scope-
  // agnostic.
  function sysFileops(){
    const sfs = nak.sys.fs;
    return {
      async list(prefix){
        try{
          const raw = await sfs.list(prefix||'');
          const entries = (raw||[]).map(p=>{
            const isDir = p.endsWith('/');
            const path = isDir ? p.slice(0,-1) : p;
            const name = path.split('/').filter(Boolean).pop() || path;
            return { path, name, type: isDir?'dir':'file' };
          });
          return { ok:true, entries };
        }catch(_){ return { ok:false, entries:[] }; }
      },
      async read(path, opts){
        try{
          if(opts && opts.encoding==='utf-8') return { ok:true, data: await sfs.read(path) };
          return { ok:true, data: await sfs.readBinary(path) };
        }catch(e){ return { ok:false, error:String(e&&e.message||e) }; }
      },
    };
  }
  function explorerFs(){ return filesScope==='all' ? sysFileops() : fs; }
  // Whole-store files open read-only (they're outside this workspace, so the
  // diff/revert pre-image machinery doesn't apply). Routed through globalPreview
  // so a preview works even with no active task.
  async function openSysFile(fullPath){
    let content='(could not read '+fullPath+')';
    try{ const r=await sysFileops().read(fullPath,{encoding:'utf-8'}); if(r&&r.ok) content=r.data; }catch(_){}
    globalPreview = { type:/\.html?$/.test(fullPath)?'html':'text', file:fullPath, content:String(content).slice(0,50000) };
    { const _t=activeTask(); if(_t) _t.preview=null; }   // a stale task preview would hide this global view
    state.previewOpen=true; save(); renderPreview();
  }
  function updateScopeBtn(){
    const b=$('files-scope'); if(!b) return;
    const on = sysFsAvailable();
    b.hidden = !on;
    if(!on && filesScope==='all') filesScope='project';
    b.textContent = filesScope==='all' ? 'all' : 'proj';
    b.classList.toggle('on', filesScope==='all');
    b.title = filesScope==='all'
      ? 'Showing the whole store (all apps) — click for this project only'
      : 'Showing this project — click for the whole store (all apps)';
  }
  // Project memory chip: visible when the project workspace has AGENTS.md or
  // memory.md; clicking opens whichever exists (memory first) in the preview.
  // Write one durable memory fact (belief-revision: default hypothesis). Returns the
  // slug, or null. Shared by the `remember` tool and the Prime flow.
  // `rel` = { slot, derived_from, supersedes } (A1). A single-valued slot supersedes its
  // current holder deterministically at write time — no model call, no clock.
  async function recordFact(note, type, status='hypothesis', rel={}){
    const clean=String(note==null?'':note).trim(); if(!clean) return null;
    const r={ ...(rel||{}) };
    if(r.slot){ const holder=slotHolder(await listFacts(), r.slot); if(holder) r.supersedes=[holder].concat(r.supersedes?String(r.supersedes).split(/[,\s]+/):[]); }
    const f=noteToFact(clean, type, status, r);
    let slug=f.slug, path=MEMORY_DIR+'/'+slug+'.md', n=1;
    try{ while((await fs.stat(path)).ok){ n++; slug=f.slug+'-'+n; path=MEMORY_DIR+'/'+slug+'.md'; } }catch(_){}
    await fs.write(path, f.file.replace('name: '+f.slug+'\n', 'name: '+slug+'\n'));
    renderFiles();
    return slug;
  }
  // #2 Prime ("Learn this project") — the Agno seeding move: one read-only pass writes
  // a starter manual so LATER tasks (esp. on a weaker BYO endpoint) start informed.
  // Facts land as hypotheses; the agent promotes/retracts them as it works.
  let priming=false;
  async function primeProject(){
    if(!(nak && nak.capabilities && nak.capabilities.ai)){ pushSystem('“Learn project” needs the NakliOS AI — open Anvil inside NakliOS with an endpoint set (Settings → AI).'); return; }
    if(priming||running){ return; }
    priming=true; const t=activeTask();
    const logn=(txt)=>{ if(t){ (t.log=t.log||[]).push({k:'system',text:txt}); save(); renderLog(); } };
    logn('🎓 Learning this project — surveying files and recording durable facts…');
    const codeExec = makeToolExecutor({ shell, face, mode:'ask', infer: inferViaHost }); // read-only survey
    let recorded=0;
    const execTool=async(nm,ar,call)=>{
      if(nm==='remember'){
        const note=String((ar&&ar.note)||'').trim();
        const all=await listFacts();
        const dup=findDuplicate(all, note); if(dup) return duplicateReply(dup); // search before save (A2)
        if(ar&&ar.type==='rule'){ const cap=checkRulesCap(all, note, { name: noteToFact(note, 'rule', 'hypothesis').slug, status: 'hypothesis' }); if(!cap.ok) return rulesCapReply(cap); } // rules stay capped here too (A3); the prospective rule's OWN heading is counted
        const slug=await recordFact(note, ar&&ar.type, 'hypothesis', { weight: ar&&ar.weight }); if(slug) recorded++; return slug?('Recorded '+slug):'empty note'; }
      return await codeExec(nm,ar,call);
    };
    const sys='You are PRIMING this project\'s memory so future tasks start informed. FIRST run `ls`/`find` to see the ACTUAL files and directory layout — record only what you OBSERVE, and do NOT trust the README\'s claims about the workspace over what the files show (a README can be stale). Then explore: skim key source files, note the build/test/run setup and conventions. Record 5–10 short, high-signal DURABLE facts with the `remember` tool: where major things live, naming/style conventions, how to build/test/run, and any gotchas — each grounded in something you actually inspected. One or two specific sentences each. Do NOT edit any files. Stop once you have recorded the key facts.';
    try{
      await runAgentLoop({
        messages:[{role:'system',content:sys},{role:'user',content:'Survey this project and record its key facts with `remember`, then stop.'}],
        tools:codingToolset('ask',{}).concat(rememberTool()), infer:inferViaHost, executeTool:execTool,
        maxSteps:18, budget:{tokens:90000, wallClockMs:180000},
        // Without an onEvent the entire priming run was invisible — the user saw
        // one "surveying…" line, then a fact count, and nothing in between. Show
        // what it looks at, so a run that stalls or reads the wrong thing is legible.
        onEvent:(e)=>{
          if(e.type==='tool-call'){ const a=e.args||{}; const what=a.path||a.command||a.pattern||a.name||''; logn('· '+e.name+(what?' '+String(what).slice(0,80):'')); }
          else if(e.type==='tool-error'){ logn('· '+e.name+' failed: '+String(e.error||'').slice(0,160)); }
        },
      });
    }catch(e){ logn('Priming error: '+(e&&e.message||e)); }
    priming=false;
    logn('🎓 Learned '+recorded+' fact(s) — see project memory (🧠). They start as hypotheses; the agent promotes or retracts them as it works.');
    updateMemChip(); renderFiles();
  }

  // Grade one candidate solver: run its Python against the example pairs and return
  // {score: matched/total, detail:{ok,total,failed[]}} — the fitness function the
  // evolutionary `synthesize` loop selects on. Examples are base64'd so any content
  // (grids, strings) survives the embed.
  async function scoreSolver(src, examples){
    try{
      const exB64 = btoa(unescape(encodeURIComponent(JSON.stringify(examples))));
      const prog = String(src||'') + '\n\n' +
        'def __run():\n' +
        '    import json, base64\n' +
        '    _ex = json.loads(base64.b64decode("'+exB64+'").decode())\n' +
        '    _fail=[]; _ok=0\n' +
        '    for _i,_e in enumerate(_ex):\n' +
        '        try:\n' +
        '            if solve(_e["input"])==_e["output"]: _ok+=1\n' +
        '            else: _fail.append(_i)\n' +
        '        except Exception: _fail.append(_i)\n' +
        '    print("SCORE", _ok, len(_ex), json.dumps(_fail))\n' +
        '__run()\n';
      // Run in kiln's INTERRUPTIBLE exec: a runaway candidate is interrupted at the
      // timeout via the SAB interrupt buffer (sys/kiln/kernel-core), so a bad solver
      // scores 0 instead of hanging the loop — no shell, no stuck worker.
      if(!kilnRef){ return { score:-1, detail:{ error:'python runtime unavailable' } }; }
      try{ await kilnRef.ensureReady(); }catch(_){}
      const r = await kilnRef.exec('synth-score', prog, { timeoutMs: 6000 });
      if(r && (r.status==='timeout' || r.status==='interrupted')) return { score:0, detail:{ timeout:true } };
      const out = String((r&&r.stdout)||'') + String((r&&r.stderr)||'');
      const m = out.match(/SCORE (\d+) (\d+) (\[.*\])/);
      if(!m) return { score:0, detail:{ raw: out.slice(0,300) } };
      const ok=+m[1], total=+m[2]; let failed=[]; try{ failed=JSON.parse(m[3]); }catch(_){}
      return { score: total? ok/total : 0, detail:{ ok, total, failed } };
    }catch(e){ return { score:-1, detail:{ error:String(e&&e.message||e) } }; }
  }
  function synthesizeTool(){
    return { type:'function', function:{ name:'synthesize',
      description:'Evolve a Python solve(x) for an EXAMPLE-BASED task (a puzzle defined by input→output pairs). Runs several generations of candidate programs, scoring each by how many example pairs it reproduces and repairing the best — then writes solver.py and reports the best fitness. Prefer this over writing one solver by hand when the task is defined by examples.',
      parameters:{ type:'object', properties:{
        goal:{ type:'string', description:'One line describing the task.' },
        examples:{ type:'array', description:'The input→output pairs: [{input, output}, …].', items:{ type:'object' } },
        popSize:{ type:'integer', description:'Candidates per generation (default 3, max 4).' },
        maxGen:{ type:'integer', description:'Max generations (default 3, max 4).' },
      }, required:['goal','examples'] } } };
  }
  // The evolutionary synthesis run, shared by the `synthesize` tool + the test hook.
  async function runSynthesize({ goal, examples, popSize=3, maxGen=3, onGen=null }){
    const pop=Math.min(4, Math.max(1, popSize|0||3)); const gens=Math.min(4, Math.max(1, maxGen|0||3));
    const exJson=JSON.stringify(examples).slice(0,12000);
    const generate=async(ctx)=>{
      const repair = ctx.best
        ? ('\n\nThe current best (fitness '+ctx.bestScore.toFixed(2)+') FAILS example indices '+JSON.stringify((ctx.bestDetail&&ctx.bestDetail.failed)||[])+'. Repair it, or try a DIFFERENT rule:\n```python\n'+String(ctx.best).slice(0,4000)+'\n```')
        : (ctx.index ? '\n\n(Try a different rule than the other candidates.)' : '');
      // Softened prompt: brief reasoning is allowed (a hard "code only" made weak
      // models over-reason into the token cap and return empty). We extract the LAST
      // ```python block, so any lead-in prose is harmless.
      const sys='You are a program-synthesis variation operator. Deduce the transformation rule from ALL examples, then write ONE Python function `solve(x)` mapping each example input to its output. Keep reasoning to a sentence or two, then give the function. It must return quickly — NO unbounded loops. End with a ```python fenced code block containing the function.';
      const user='Task: '+String(goal||'')+'\nExamples (JSON [{input,output}]): '+exJson+repair;
      // Bound the inference too — a hung model call must not stall the whole generation.
      // maxTokens raised so a reasoning-heavy weak model still reaches the code block.
      let res; try{ res=await Promise.race([
        inferViaHost({ messages:[{role:'system',content:sys},{role:'user',content:user}], tools:[], maxTokens:8192 }),
        new Promise((_,rej)=>setTimeout(()=>rej(new Error('gen timeout')), 90000)),
      ]); }catch(_){ return null; }
      const txt=String((res&&res.content)||''); const all=[...txt.matchAll(/```(?:python|py)?\s*\n([\s\S]*?)```/g)]; return all.length?all[all.length-1][1]:txt;
    };
    const res=await evolve({ generate, score:(src)=>scoreSolver(src, examples), popSize:pop, maxGen:gens, target:1, onGen });
    if(res.best){ try{ await fs.write('solver.py', String(res.best)+'\n\n# synthesize: best '+res.bestScore.toFixed(3)+' over '+res.generations+' gen(s)'); renderFiles(); }catch(_){} }
    return res;
  }

  // M4 — orient the newcomer on the three storage worlds. Opened from the header chip.

  async function renderFiles(){
    const box=$('files'); if(!box) return;
    updateScopeBtn();
    void updateMemChip();
    void updateSkillsChip();
    void updateHooksChip();
    const efs = explorerFs();
    // Scope indicator only — storage lives in the one header chip now, not here.
    const tag=$('ws-tag');
    if(tag) tag.textContent = filesScope==='all' ? 'whole store' : '';
    const rows=[];
    async function walk(prefix, depth){
      let res; try{ res = await efs.list(prefix, { recursive:false }); }catch(_){ return; }
      if(!res || !res.ok) return;
      const ents = res.entries.slice().sort((a,b)=> (b.type==='dir')-(a.type==='dir') || a.name.localeCompare(b.name));
      for(const e of ents){
        rows.push({ path:e.path, name:e.name, type:e.type, depth });
        if(e.type==='dir' && expandedDirs.has(e.path)) await walk(e.path, depth+1);
      }
    }
    try{ await walk('', 0); }catch(_){}
    box.innerHTML='';
    if(!rows.length){ box.innerHTML='<div class="fempty">'+(filesScope==='all'?'store is empty':'empty workspace')+'</div>'; return; }
    for(const r of rows){
      const d=document.createElement('div'); d.className='frow'+(r.type==='dir'?' dir':'');
      d.style.paddingLeft=(10+r.depth*12)+'px';

      d.innerHTML=`<span class="ftw">${tw}</span><span class="fname">${esc(r.name)}</span>`;
      if(r.type==='dir') clickable(d, ()=>{ expandedDirs.has(r.path)?expandedDirs.delete(r.path):expandedDirs.add(r.path); renderFiles(); }, (expandedDirs.has(r.path)?'Collapse':'Expand')+' folder '+r.name);
      else clickable(d, ()=>{ (filesScope==='all' ? openSysFile(r.path) : openChange(r.path)); raise('preview'); }, 'Open file '+r.name);

    $('tb-meta').textContent = loud.join('  ·  ');
    $('tb-meta').className = loud.length ? 'meta bypass' : 'meta';
    const g=$('gate-btn'); if(g){ const vc=((t&&t.verifyCmd)||'').trim(); g.textContent=vc?('✓ '+vc):'✓ Must-pass'; g.classList.toggle('on', !!vc);
      // Always visible. The old progressive reveal keyed on `state.proven`, which

  function renderLog(){
    const box=$('log'); const t=activeTask();
    if(!t){ logCache={taskId:null,keys:null}; box.innerHTML='<div class="empty"><h2>No task selected</h2>Pick a task on the left, or make a new one.</div>'; return; }
    if(!t.log||!t.log.length){
      const aiReady = !!(nak && nak.capabilities && nak.capabilities.ai);
      const wl = esc((workspaceLabel||'').split(' · ')[0] || workspaceLabel);
      const examples = ['Create a README for this project','Add a .gitignore for a Node project','Write a hello() in hello.js that returns "hello"'];
      const banner = aiReady ? '' : '<div class="es-banner">Anvil runs its agent through NakliOS. Open it at <b>naklios.dev</b> and set an AI endpoint under <b>Settings → AI</b> to run tasks.</div>';
      box.innerHTML = '<div class="empty">'
        + '<h2>Anvil — on-device coding agent</h2>'
        + '<p class="es-lead">Describe what to build; the agent edits files in your workspace (<b>'+wl+'</b>) with read / write / edit / shell tools.</p>'
        + banner
        + '<div class="es-egs"><span>Try:</span>'+examples.map((x,i)=>'<button class="es-chip" data-i="'+i+'">'+esc(x)+'</button>').join('')+'</div>'
        + '</div>';
      box.querySelectorAll('.es-chip').forEach(b=>{ b.onclick=()=>{ const ta=$('prompt'); if(ta){ ta.value=examples[+b.dataset.i]; ta.focus(); autoGrow(); } }; });
      logCache={taskId:null,keys:null};   // the wrapper is gone; never append onto an empty state
      return;
    }
    // AC-5: the transcript is APPEND-DOMINANT, so plan the update instead of rebuilding 2,417
    // nodes for every event (measured: 48ms per render at 600 rows, and the reader yanked to the
    // bottom each time). `logCache` holds the keys of what is currently on screen; a plan of
    // `append` builds only the tail into the SAME wrapper, `noop` touches nothing.
    const keys = rowKeys(t.log);
    const cached = (logCache.taskId===t.id) ? logCache.keys : null;
    const plan = planLogUpdate(cached, keys);
    const existingWrap = box.querySelector('.wrap');
    const pinned = isPinned({ scrollTop:box.scrollTop, scrollHeight:box.scrollHeight, clientHeight:box.clientHeight });
    const prevTop = box.scrollTop;
    // A queue chip is not a log row, so it is rebuilt on every pass; the log rows above it are not.
    if(plan.mode!=='rebuild' && existingWrap){ for(const q of [...existingWrap.querySelectorAll('.msg.queued')]) q.remove(); }
    const w = (plan.mode==='rebuild' || !existingWrap) ? document.createElement('div') : existingWrap;
    if(plan.mode==='rebuild' || !existingWrap) w.className='wrap';
    const rows = (plan.mode==='rebuild' || !existingWrap) ? t.log : t.log.slice(plan.from);
    for(const e of rows){
      if(e.k==='user'||e.k==='system'){
        const d=document.createElement('div'); d.className='msg '+e.k;
        d.innerHTML=`<div class="who">${e.k==='user'?'you':'system'}</div><div class="body"></div>`;
        d.querySelector('.body').textContent=e.text; w.appendChild(d);
      } else if(e.k==='assistant'){
        // Agent reply: render Markdown (code blocks get a Copy button), plus a
        // "Copy md" button on the whole reply.
        const d=document.createElement('div'); d.className='msg assistant';
        const head=document.createElement('div'); head.className='mhead';
        head.innerHTML='<div class="who">agent</div>';
        const cp=document.createElement('button'); cp.className='copybtn'; cp.textContent='Copy md';
        cp.title='Copy this reply as Markdown'; cp.onclick=()=>copyText(e.text, cp);
        head.appendChild(cp);
        const body=document.createElement('div'); body.className='body';
        renderMarkdown(body, e.text);
        d.appendChild(head); d.appendChild(body); w.appendChild(d);
      } else if(e.k==='tool'){
        const dt=document.createElement('details'); dt.className='tool'+(e.error?' err':''); if(e.open) dt.open=true;
        const sum=document.createElement('summary');
        sum.innerHTML=`<span class="tn">${esc(e.name)}</span><span class="td">${esc(e.detail||'')}</span><span class="tg">${e.error?'error':(e.result!=null?'result':'…')}</span>`;
        dt.appendChild(sum);
        const out = e.error!=null?e.error:e.result;
        if(out!=null){
          const o=document.createElement('div'); o.className='tout'; o.textContent=out; dt.appendChild(o);
          const cp=document.createElement('button'); cp.className='copybtn'; cp.textContent='Copy';
          cp.title='Copy output as Markdown';
          cp.onclick=(ev)=>{ ev.preventDefault(); ev.stopPropagation(); copyText('```\n'+out+'\n```', cp); };
          sum.appendChild(cp);
        }
        w.appendChild(dt);
      } else if(e.k==='change'){
        // "We made changes — view" (Claude Code / Codex style). The write/edit is
        // already applied (YOLO); clicking reads the current file and shows it in
        // the preview, instead of auto-popping the pane.
        const c=document.createElement('div'); c.className='change'; c.title='View this file in the preview';
        c.innerHTML=`<span class="ci">✎</span><span class="cf">${esc(e.verb||'wrote')} ${esc(e.file)}</span><span class="cv">view →</span>`;
        c.onclick=()=>{ openChange(e); raise('preview'); };
        w.appendChild(c);
      }
    }
    // Queued follow-ups (Codex-style): prompts waiting for the current run to end.
    for(const q of (t.queued||[])){
      const d=document.createElement('div'); d.className='msg user queued';
      const head=document.createElement('div'); head.className='mhead';
      // The state is shown, not just the text: a `dispatching` chip is a claim that outlived its
      // run, and a user who cannot see that cannot know why nothing is happening.
      head.innerHTML='<div class="who">'+(q.state==='dispatching'?'starting…':'queued')+'</div>';
      const mk=(label,title,fn)=>{ const b=document.createElement('button'); b.className='copybtn'; b.textContent=label; b.title=title; b.onclick=fn; return b; };
      // Every action is keyed on q.id. The old code captured a render-time INDEX, so a queue that
      // drained between render and click removed a different item than the one clicked.
      head.appendChild(mk('↑','Move earlier',()=>{ t.queued=qMove(t.queued,q.id,-1).queue; save(); renderLog(); }));
      head.appendChild(mk('↓','Move later',()=>{ t.queued=qMove(t.queued,q.id,+1).queue; save(); renderLog(); }));
      head.appendChild(mk('✎','Edit',()=>{ const v=prompt('Edit queued prompt',q.text); if(v!==null){ t.queued=qEdit(t.queued,q.id,v).queue; save(); renderLog(); } }));
      head.appendChild(mk('✕','Remove from queue',()=>{ t.queued=qRemove(t.queued,q.id).queue; save(); renderLog(); }));
      const body=document.createElement('div'); body.className='body'; body.textContent=q.text;
      d.appendChild(head); d.appendChild(body); w.appendChild(d);
    }
    if(plan.mode==='rebuild' || !existingWrap){ box.innerHTML=''; box.appendChild(w); }
    logCache = { taskId:t.id, keys };
    // The reader's position is theirs unless they were following along at the bottom. The rare
    // resize path (applyLayout) has always done this; the hot path never did.
    box.scrollTop = pinned ? box.scrollHeight : prevTop;
  }
  // Keys of the log rows currently on screen, and whose task they belong to. A task switch
  // invalidates it by id, so a switch can never append one task's rows under another's.
  let logCache = { taskId:null, keys:null };
  // Preview not tied to a task (whole-store read-only views land here).
  let globalPreview = null;
  // renderPreview prefers the ACTIVE TASK's preview over the global one, so a global screen opened
  // while a task still held a stale preview simply did not appear — the ⋯ item looked dead. That
  // affected every whole-store view (memory, skills, hooks, storage, files) and would have hit
  // Policy too. Each global opener now clears the task preview on the line before it renders;
  // openChange already does the mirror-image when it goes the other way.
  function renderPreview(){
    const t=activeTask(); const pv=(t&&t.preview)||globalPreview; const rev=$('pv-revert'); const ptype=$('pv-type');
    $('main').classList.toggle('preview-open', !!state.previewOpen && !!pv);
    if(!pv){ if(ptype) ptype.textContent='Preview'; $('pv-file').textContent=''; $('pv-body').innerHTML='<div class="pempty">Nothing to preview yet.<br>Agent output that can be shown appears here.</div>'; if(rev) rev.hidden=true; return; }
    // Name the pane by what it is showing, so the overloaded preview says its mode.
    if(ptype) ptype.textContent = pv.label || (
      pv.type==='diff' ? 'Diff' :
      /^⚑\s*Proof build/.test(pv.file||'') ? 'Proof build' :
      pv.file==='Project memory' ? 'Memory' :
      pv.file==='Project skills' ? 'Skills' :
      pv.file==='Project hooks'  ? 'Hooks' :
      pv.type==='html' ? 'Preview' : 'File'
    );
    $('pv-file').textContent=pv.file||'';
    if(rev){ rev.hidden = pv.pre==null; rev.onclick = pv.pre==null ? null : (()=>revertChange(pv)); }
    const body=$('pv-body');
    if(pv.type==='html'){ body.innerHTML=''; const f=document.createElement('iframe'); f.setAttribute('sandbox','allow-scripts'); f.srcdoc=pv.content; body.appendChild(f); }
    else if(pv.type==='diff'){ body.innerHTML='<pre></pre>'; body.querySelector('pre').innerHTML=diffHtml(pv.content); }
    else {
      body.innerHTML='<pre></pre>'; body.querySelector('pre').textContent=pv.content;
      // AC-6: a chip whose pre-image was dropped used to look exactly like one with nothing to
      // show. Say which it is, and why — an unexplained blank is the defect.
      if(pv.note){ const n=document.createElement('div'); n.className='pv-note'; n.textContent=pv.note; body.insertBefore(n, body.firstChild); }
      // Buttons belong to the preview OBJECT, not to whoever opened it. Appended after the fact

  async function runRole({ role, action, round, instructions, emitSpec, view, goal }){
    if(!(nak && nak.ai)) return null;

    const emitTool={type:'function',function:{name:'emit',description:'Emit your role result as one JSON object with the required fields. This is how you FINISH — you are not done until you call it.',parameters:{type:'object',properties:{result:{type:'object'}},required:['result']}}};

    // full coding toolset over the live workspace (its files change on disk like any
    // task). CHECKER / LEAD reason over their role-scoped view (read + emit).
    let tools, execTool, sys, maxSteps, budget, kick;

      const codeExec = makeToolExecutor({ shell, face, mode:'code', infer: inferViaHost });
      execTool=async(nm,ar,call)=>{ if(nm==='emit'){ emitted=ar&&ar.result; return 'Recorded — you are done.'; } return await codeExec(nm,ar,call); };
      tools=codingToolset('code',{}).concat(emitTool);

      kick='Implement the current directive (or, for c0, a first candidate for the goal), then call `emit` with your candidate.';
      maxSteps=20; budget={tokens:120000, wallClockMs:240000};
    } else {
      const readTool={type:'function',function:{name:'read',description:'Read a workspace file (returns its text).',parameters:{type:'object',properties:{path:{type:'string'}},required:['path']}}};

      tools=[readTool,emitTool];

      kick='Perform action "'+action+'" as the '+role+', then call `emit`.';
      maxSteps=10; budget={tokens:60000, wallClockMs:120000};

  // In-app text-input modal — replaces native prompt() (no-native-dialog rule). Resolves to the

  function askChoice({ title='', label='', choices=[], timeoutMs=0 }={}){

      const panel=document.createElement('div'); panel.className='ask-panel';
      panel.setAttribute('role','dialog'); panel.setAttribute('aria-modal','true');
      if(title){ panel.setAttribute('aria-label', title); const h=document.createElement('div'); h.className='ask-title'; h.textContent=title; panel.appendChild(h); }
      if(label){ const l=document.createElement('div'); l.className='ask-label'; l.textContent=label; panel.appendChild(l); }
      const row=document.createElement('div'); row.className='ask-row';
      let timer=null;
      const close=(v)=>{ if(done) return; done=true; if(timer) clearTimeout(timer); document.removeEventListener('keydown', onKey, true); scrim.remove(); try{ if(prev&&prev.focus) prev.focus(); }catch(_){} resolve(v); };
      let done=false;

        if(c.title) b.title=c.title;

  function diffHtml(s){ return String(s).split('\n').map(l=>{ const c=l[0]; const cls=c==='+'?'add':c==='-'?'del':(c==='@'?'hd':''); return cls?`<span class="${cls}">${esc(l)}</span>`:esc(l); }).join('\n'); }
