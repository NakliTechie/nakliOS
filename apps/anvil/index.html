    for(let i=m-1;i>=0;i--) for(let j=n-1;j>=0;j--) dp[i][j]=A[i]===B[j]?dp[i+1][j+1]+1:Math.max(dp[i+1][j],dp[i][j+1]);
    const out=[]; let i=0,j=0;
    while(i<m&&j<n){ if(A[i]===B[j]){ out.push(' '+A[i]); i++;j++; } else if(dp[i+1][j]>=dp[i][j+1]){ out.push('-'+A[i]); i++; } else { out.push('+'+B[j]); j++; } }
    while(i<m) out.push('-'+A[i++]); while(j<n) out.push('+'+B[j++]);
    return out.join('\n');
  }
  // Pre-images snapshotted just before a write/edit runs (see runTask), so a
  // change chip can show a real before→after diff and offer Revert.
  const preImages = {};

  function pushSystem(text){ const t=activeTask(); if(!t) return; (t.log=t.log||[]).push({k:'system',text}); save(); renderLog(); }

  // ── Change capture (view-on-click): the agent applies writes/edits directly
  // (YOLO); we don't auto-pop the preview. Instead we drop a compact "✎ wrote X ·
  // view" chip in the chat — click it to open the file/diff in the preview. ──
  async function noteChange(t, name, args){
    try{
      const path = args && (args.path||args.file);
      if(!path || !(name==='write'||name==='edit')) return;
      const raw = (path in preImages) ? preImages[path] : null;
      // AC-6: read back what the agent just wrote. Its digest is what lets Revert later ask "does
      // this file still look the way the agent left it?" — without it a Revert cannot tell a
      // clean undo from destroying whatever touched the file since.
      let post=null; try{ const r=await fs.read(path,{encoding:'utf-8'}); if(r&&r.ok) post=r.data; }catch(_){}
      const row = buildChangeRow({ file:path, verb: name==='edit'?'edited':'wrote', pre:raw, post });
      t.log.push(row);
      // Bounded retention: without this every change row keeps a full copy of the file's previous
      // contents forever, in localStorage AND in the roamed state.json.
      const pr = prunePreimages(t.log); if(pr.dropped){ t.log = pr.log; }
      pendingDiff={ file:path, pre:row.pre }; badge('preview','◫');
      // This is async now (it reads the file back), so the caller's renderLog() has already run
      // by the time the row exists. Render again here or the chip appears one event late.
      save(); renderLog();
    }catch(_){}
  }
  // Clicking a change chip opens it in the preview: a real before→after DIFF when
  // we have the pre-image (with a Revert), else the current file.
  async function openChange(row){
    const at=activeTask(); if(!at) return;
    const file=row.file, pre=row.pre;
    globalPreview=null;
    let content='(could not read '+file+')';
    try{ const r=await fs.read(file,{encoding:'utf-8'}); if(r&&r.ok) content=r.data; }catch(_){}
    if(pre!=null && !/\.html?$/.test(file)){
      // postHash and preUnavailable ride along so Revert can refuse with a reason instead of
      // silently overwriting whatever has touched the file since (AC-6).
      at.preview={ type:'diff', file, content: lineDiff(pre, content), pre, postHash:row.postHash, preUnavailable:row.preUnavailable };
    } else {
      at.preview={ type:/\.html?$/.test(file)?'html':'text', file, content:String(content).slice(0,50000), postHash:row.postHash, preUnavailable:row.preUnavailable };
      // A chip whose diff was dropped must SAY so — it used to render identically to one that
      // simply had no changes worth showing.
      if(row.preUnavailable) at.preview.note='No before/after diff: '+row.preUnavailable+'.';
    }
    state.previewOpen=true; save(); renderPreview();
  }
  // Revert: only when the file still looks the way the agent left it. It used to write the
  // pre-image back unconditionally, which silently destroyed anything that had touched the file
  // since — your own edit, a later turn, a subagent merge, a second tab (AC-6).
  async function revertChange(pv){
    if(!pv) return;
    let current=null; try{ const r=await fs.read(pv.file,{encoding:'utf-8'}); if(r&&r.ok) current=r.data; }catch(_){}
    const plan = planRevert({ k:'change', file:pv.file, pre:pv.pre, postHash:pv.postHash, preUnavailable:pv.preUnavailable }, current);
    if(!plan.ok){ pushSystem('↶ Not reverted — '+plan.message); return; }
    try{ await fs.write(pv.file, plan.content); }catch(e){ pushSystem('↶ Not reverted — '+String(e&&e.message||e)); return; }
    pushSystem('Reverted '+pv.file+'.');
    const at=activeTask(); if(at) at.preview={ type:'text', file:pv.file, content:plan.content };
    save(); renderAll();
  }

  // ── Lightweight Markdown → DOM (fenced code blocks get a Copy button; inline
  // `code` and **bold**). Kept minimal on purpose — no external library. ──
  function renderMarkdown(container, text){
    container.innerHTML='';
    const parts = String(text==null?'':text).split('```');
    for(let i=0;i<parts.length;i++){
      if(i%2===1){
        let block=parts[i], lang='';
        const nl=block.indexOf('\n');
        if(nl>=0){ const first=block.slice(0,nl).trim(); if(/^[\w+.-]*$/.test(first)){ lang=first; block=block.slice(nl+1); } }
        container.appendChild(codeCard(lang, block.replace(/\n$/,'')));
      } else {
        const seg=parts[i]; if(!seg || !seg.replace(/\s/g,'')) continue;
        const p=document.createElement('div'); p.className='md-p';
        p.innerHTML = esc(seg.replace(/^\n+|\n+$/g,''))
          .replace(/`([^`]+)`/g, '<code class="inline">$1</code>')
          .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
        container.appendChild(p);
      }
    }
    if(!container.childNodes.length){ const p=document.createElement('div'); p.className='md-p'; p.textContent=String(text||''); container.appendChild(p); }
  }
  function codeCard(lang, code){
    const wrap=document.createElement('div'); wrap.className='code';
    const head=document.createElement('div'); head.className='code-head';
    const l=document.createElement('span'); l.className='lang'; l.textContent=lang||'code';
    const btn=document.createElement('button'); btn.className='copybtn'; btn.textContent='Copy';
    btn.title='Copy code'; btn.onclick=()=>copyText(code, btn);
    head.appendChild(l); head.appendChild(btn);
    const pre=document.createElement('pre'); const c=document.createElement('code'); c.textContent=code; pre.appendChild(c);
    wrap.appendChild(head); wrap.appendChild(pre);
    return wrap;
  }
  function copyText(str, btn){
    const done=()=>{ if(!btn) return; const o=btn.textContent; btn.textContent='Copied'; btn.classList.add('ok'); setTimeout(()=>{ btn.textContent=o; btn.classList.remove('ok'); },1200); };
    try{ if(navigator.clipboard && navigator.clipboard.writeText){ navigator.clipboard.writeText(str).then(done, ()=>fallbackCopy(str,done)); return; } }catch(_){}
    fallbackCopy(str, done);
  }
  function fallbackCopy(str, done){
    try{ const ta=document.createElement('textarea'); ta.value=str; ta.style.position='fixed'; ta.style.opacity='0'; document.body.appendChild(ta); ta.select(); document.execCommand('copy'); document.body.removeChild(ta); done&&done(); }catch(_){}
  }

  // ── The model side — identical transport to Forge (host agent tier) ──
  // An app must never await the host forever. If the host wedges — a permission
  // prompt that never resolves was the real case (2026-09-03) — an unbounded
  // await hangs the whole agent with no error, and the loop's wall-clock budget
  // cannot help because it is only checked between turns. Bound every call and
  // honour the run's abort signal.
  const INFER_TIMEOUT_MS = 240000;
  function withDeadline(promise, signal){
    return new Promise((resolve, reject)=>{
      let done=false;
      const settle=(fn)=>(v)=>{ if(done) return; done=true; clearTimeout(timer); if(onAbort&&signal) signal.removeEventListener('abort', onAbort); fn(v); };
      const ok=settle(resolve), bad=settle(reject);
      const timer=setTimeout(()=>bad(new Error('the model did not respond within '+Math.round(INFER_TIMEOUT_MS/1000)+'s — the host or endpoint may be stuck')), INFER_TIMEOUT_MS);
      const onAbort=signal?()=>bad(new Error('aborted')):null;
      if(signal){ if(signal.aborted) return bad(new Error('aborted')); signal.addEventListener('abort', onAbort); }
      promise.then(ok, bad);
    });
  }

  // What the NEXT run gets to see. t.convo used to accumulate only user prompts
  // and the final assistant text — never a tool call, a tool result, or the gate
  // output — so a follow-up send restarted blind. After a few sends the model was
  // handed a transcript of consecutive user turns (observed 2026-09-03:
  // [user, user, user, assistant, user, user]) and answered in prose instead of
  // using tools. The gate feedback an agent needs to fix its own work survived
  // only INSIDE one run.
  //
  // Three constraints:
  //  - never split a turn: an assistant turn carrying tool_calls must keep its
  //    matching role:'tool' replies or an OpenAI-compatible endpoint rejects the
  //    transcript. compactConversation is turn-boundary safe and shakes bulky
  //    tool bodies into artifact refs rather than dropping them.
  //  - drop the incoming system prefix: sysMsg() is rebuilt every run, so
  //    carrying it forward would duplicate it. A summary system message that
  //    compaction ADDS is kept — it is new information.
  //  - stay inside localStorage: save() writes one key inside a swallowing
  //    try/catch, so an oversized convo would silently break ALL persistence,
  //    tasks included. Hard-cap by serialized size, trimming whole turns.
  const CONVO_MAX_CHARS = 120000;
  const startsATurn = (m) => m && m.role !== 'tool';
  // `rec` is optional but load-bearing when present: carryForward is LOSSY three times over
  // (a compaction that may call a model, dropping a dangling tool-call turn, and a size trim),
  // and its result used to be stored outside the record — so the chain and the transcript the
  // model actually saw could disagree, while run-record's header claimed the transcript was a
  // projection. Recording the net replacement makes `foldSurface` reproduce it (F4), which is
  // what F1's invariant then checks.
  async function carryForward(messages, rec){
    const msgs = Array.isArray(messages) ? messages.slice() : [];
    let i = 0; while (i < msgs.length && msgs[i] && msgs[i].role === 'system') i++;
    let out = msgs.slice(i);
    try {
      // `retrievable` decides what an elided tool body TELLS the model. Compaction cannot keep
      // the bytes — its whole job is to shed them, and the carried transcript lives in
      // localStorage, the one store this function is capped to protect. The run record already
      // holds every tool result and the `history` tool searches it, so that is the only true
      // retrieval path — and it is only true when a record is actually being written. `rec` is
      // that condition. Without it the ref says the content is gone rather than sending the
      // agent after something nothing kept (forward-pass R1a).
      const r = await compactConversation(out, { threshold: 24000, keepRecentTokens: 10000, retrievable: !!(rec && rec.compacted) });
      if (Array.isArray(r.messages)) out = r.messages;
      // r.artifacts is deliberately not kept: persisting the elided bodies here would push them
      // straight back into the localStorage budget the trim below exists to defend.
    } catch(_) { /* compaction is best-effort; an uncompacted transcript still works */ }
    // A trailing assistant turn whose tool replies never arrived (an aborted run)
    // is malformed as the START of the next request — drop it.
    while (out.length && out[out.length-1] && out[out.length-1].role === 'assistant'
           && Array.isArray(out[out.length-1].tool_calls) && out[out.length-1].tool_calls.length) out.pop();
    // Trim from the front, whole turns only, until it fits.
    while (out.length && JSON.stringify(out).length > CONVO_MAX_CHARS) {
      out.shift();
      while (out.length && !startsATurn(out[0])) out.shift(); // never begin on an orphan tool reply
    }
    // If anything above changed the surface, put the result ON THE CHAIN so it is derivable.
    // The summary half calls a model and the trim half depends on a byte budget, so neither is
    // reproducible from parameters — the replacement itself is the only honest record.
    try{
      const src = msgs.slice(i);
      if(rec && rec.compacted && JSON.stringify(src) !== JSON.stringify(out)){
        await rec.compacted({ method:'carry-forward', from:0, to:src.length, replacement:out });
      }
    }catch(_){ /* recording is best-effort; it must never break the carry */ }
    return out;
  }

  async function inferViaHost({ messages, tools, maxTokens, signal }){
    const ai = nak && nak.ai;
    if(!ai) throw new Error('Agent needs the NakliOS host — open Anvil inside NakliOS (naklios.dev), and set a model in Settings → AI.');
    let lastErr;
    for(let a=0;a<3;a++){
      if(signal && signal.aborted) throw new Error('aborted');
      try{
        // max_tokens is opt-in: a weak model that puts everything in reasoning tokens
        // can hit the default output cap and return empty (finishReason "length").
        const req = { agent:true, messages, tools, tool_choice:'auto', stream:false };
        if(maxTokens){ req.max_tokens = maxTokens; }
        const r = await withDeadline(ai.chat.completions.create(req), signal);
        const ch=r&&r.choices&&r.choices[0]; const m=(ch&&ch.message)||{};
        // F6: carry the provider's own token count through to the loop. Without it the budget
        // that ENDS runs is chars/4 over the messages, which cannot see the tool schemas — live
        // on 2026-09-07 that read 1,319 tokens for a request the provider counted at 3,903,
        // against a 4,096 window.
        // Who answered THIS turn — the host's ladder may have substituted an id after a 5xx.
        // The recorder stamps it on llm.responded; run.started only knows what was configured.
        return { content: typeof m.content==='string'?m.content:'', toolCalls: Array.isArray(m.tool_calls)?m.tool_calls:[], finishReason:(ch&&ch.finish_reason)||'stop', usage: (r&&r.usage)||null, model: (r&&typeof r.model==='string'&&r.model)||null };
      // An abort is the user's decision, never a transient fault — surface it
      // immediately instead of burning two retries and a backoff on it.
      }catch(e){ lastErr=e; const s=String(e&&e.message||e); if(/^aborted$/.test(s)) throw e; if((/\b(405|408|409|425|429|5\d\d)\b/.test(s)||/timeout|network|temporarily|fetch/i.test(s))&&a<2){ await new Promise(r=>setTimeout(r,400*(a+1))); continue; } throw e; }
    }
    throw lastErr;
  }

  // AC-3: the six procedural transitions are no longer prose in this literal — they render from
  // sys/ai/procedural.mjs so each edge can be ablated without editing code. `proceduralPrior` is
  // set per run from the project's optional .anvil/procedural.json; the default render is
  // byte-identical to the string this replaced (scripts/test-anvil-procedural.mjs).
  let proceduralPrior = renderProcedural();
  const SYSTEM_HEAD = 'You are a coding agent working over the user\'s files. Tools: read (line-numbered), write (whole file), edit (surgical old_string→new_string), apply_patch (add/update/delete files), todowrite (checklist), task (delegate one bounded sub-task to a subagent), dispatch (fan out INDEPENDENT sub-tasks to subagents that run in parallel, each in an isolated copy of the workspace — their changes merge back when they touch different files), review (an independent read-only reviewer subagent for a second opinion), shell (a CURATED bash-like shell, not coreutils: ls cat grep rg sed awk find head tail wc sort uniq cut tr test git python, with pipes, && || ; > >> < and globs. Each builtin implements a documented subset and REFUSES an unsupported flag rather than ignoring it — run `help` to see what each one supports. No loops, subshells, command substitution or heredocs; use python for scripting). ';
  // Live 2026-09-11: a model spent 24 steps under an invented /workspace prefix — the leading slash
  // resolves against the root, so its writes landed in a folder literally named workspace/, and
  // python's own cwd (/work, the Kiln mount) read as a third universe. One sentence, in the stable
  // prefix, at the very end so both seams the procedural test pins stay byte-identical.
  const SYSTEM_TAIL = ' Work in small, verifiable steps; end with a one-line summary. Paths are relative to the workspace root, which the shell shows as / and python as /work — there is no /workspace, /home or /tmp; do not invent a prefix and do not cd first.';
  // Assembled at read time so a per-run graph change takes effect without a reload.
  function systemPrompt(){ return SYSTEM_HEAD + proceduralPrior + SYSTEM_TAIL; }
  // The lesson-layer contract rides in the system prompt of every code-mode run (where
  // `remember` exists) — the first remember of a project happens with an EMPTY memory index,
  // so the index header alone could never carry it. Same constant as the tool description.
  const LESSON_NOTE = ' Memory: ' + LESSON_CONTRACT;
  // A short, stable digest of the volatile context block (F3). Only used to answer "has this
  // changed since the last run of this task?", so it is stored on the task instead of the text
  // itself — a 20 KB index has no business living in the saved task state. FNV-1a.
  function ctxDigest(s){
    let h=0x811c9dc5; const str=String(s==null?'':s);
    for(let i=0;i<str.length;i++){ h^=str.charCodeAt(i); h=Math.imul(h,0x01000193)>>>0; }
    return str.length+':'+(h>>>0).toString(36);
  }
  const MODE_NOTE = { code:'', plan:' PLAN mode: read and think only — no writes/edits/shell; produce a concise plan.', ask:' ASK mode: read-only; answer the question, do not modify anything.' };

  let running=false;
  let autoReviewTimer=null; // the idle-deferred post-run review (C5)
  let abortController=null;   // aborts the in-flight run (the Stop button)
  // Enter sends; while a run is in flight, Enter/Send QUEUES the prompt (Codex-
  // style) and it runs automatically when the current run finishes.
  function submit(){
    const t=activeTask(); if(!t) return;
    const text=$('prompt').value.trim(); if(!text) return;
    $('prompt').value=''; autoGrow();
    if(running){ t.queued=qEnqueue(t.queued, text).queue; save(); renderLog(); return; }
    // AC-8a: admission, not a fuse. The queue has held on a bad ending since AC-4; a fresh Send
    // did not, so pressing it after three failed runs started a fourth into a workspace nobody had
    // looked at. Same question, two answers, depending only on where the prompt came from.
    const adm = admitRun({ held: !!state.runsHeld, heldReason: state.runsHeldReason || '',
                           lastStop: t.lastStop || null, lastWasError: t.status === 'error',
                           acknowledged: !!t.ackAfterBadRun });
    if(!adm.admit){
      // A held session must be cleared deliberately. Everything else is a speed bump: the prompt
      // is kept, and sending it again goes through.
      if(adm.kind !== 'held'){ t.ackAfterBadRun = true; $('prompt').value = text; autoGrow(); }
      pushSystem('⏸ ' + adm.reason);
      return;
    }
    t.ackAfterBadRun = false;
    runTask(t, text);
  }
  // Run records live in Anvil's OWN OPFS namespace (anvil/runs/<project>/<task>/),
  // never inside the mounted workspace: an agent will edit whatever it can reach
  // (khiladi's driver "fixed" its own event log), and a ledger the agent can rewrite
  // audits nothing. Same posture as the FIF. Returns the saved path, or null.
  // C2 — the post-run review fork (explicit or automatic). Reviews the finished run's record and
  // STAGES any proposed skill (planSkillWrite → status staged) or fact (recordFact → hypothesis).
  // Nothing lands active. Poison-checked (C3) via a per-project proposal ledger so a rejected
  // proposal is not re-proposed. `rec` is the just-finished recorder.
  // A rejected proposal must not be re-proposed. This was declared null and never assigned, so
  // every review ran against nothing and the poison check was a no-op (forward-pass NAF-09).
  // One ledger per project, rebuilt when the project changes — rejections stick for the session.
  let learnLedger = null, learnLedgerProject = null;
  function projectLedger(){
    const proj = String(state.activeProject||'local');
    if(learnLedgerProject !== proj){ learnLedgerProject = proj; learnLedger = createProposalLedger({ app:'anvil', principal:'anvil:'+proj }); }
    return learnLedger;
  }
  async function learnThisRun(t, rec){
    if(!(nak && nak.capabilities && nak.capabilities.ai)) return null;
    // The review is async and `fs` follows whatever project is MOUNTED, so switching project
    // mid-review wrote this run's skills into the other project (forward-pass NAF-06). Pin it:
    // the review belongs to the project it started in, and abandons its writes if that changed.
    const reviewProject = String(state.activeProject||'local');
    const sameProject = ()=> String(state.activeProject||'local') === reviewProject;
    const propose = async (pr)=>{
      if(!sameProject()) return { ok:false, error:'project changed during the review — nothing written' };
      try{
        if(pr.kind==='skill'){
          // Tell the planner what is actually on disk. Passing existing:null bypassed its
          // refusal, so a review proposal silently overwrote an owner's own skill (NAF-05).
          const dir = SKILLS_DIR+'/'+pr.name;
          let existing = null;
          try{ const cur = await fs.read(dir+'/'+SKILL_FILE,{encoding:'utf-8'}); if(cur&&cur.ok) existing = parseSkill(cur.data); }catch(_){}
          const plan = planSkillWrite({ op:'create', name:pr.name, description:pr.description||'', content:pr.content||pr.description||pr.name }, { existing, session:createSkillSession(), now:new Date().toISOString() });
          if(!plan.ok) return { ok:false, error:plan.error||'refused' };
          // A write that failed is not a staged skill (NAF-11).
          const w = await fs.write(dir+'/'+SKILL_FILE, plan.skillText);
          if(!(w&&w.ok)) return { ok:false, error:(w&&w.error)||'write failed' };
          return { ok:true, staged:'skill:'+pr.name+' ('+plan.status+')' };
        }
        if(pr.kind==='fact'){ const slug=await recordFact(pr.note||pr.description||pr.name, 'project', 'hypothesis'); return { ok: !!slug, staged:'fact:'+slug }; }
      }catch(_){}
      return { ok:false };
    };
    const rep = await runLearnReview({ record:{ events:rec.events, resolve:rec.resolve }, infer:inferViaHost, ledger:projectLedger(), propose, now:Date.now() });
    if(!sameProject()) return rep; // do not narrate into a task that is no longer on screen
    if(rep.staged.length) (t.log=t.log||[]).push({ k:'system', text:'Learned from this run — staged for your approval: '+rep.staged.map(x=>x.staged).join(', ')+'. Nothing was saved active.' });
    else (t.log=t.log||[]).push({ k:'system', text:'Reviewed this run — nothing new worth staging.'+(rep.dropped.length?(' ('+rep.dropped.length+' already-rejected proposal(s) skipped.)'):'') });
    renderFiles(); renderLog();
    return rep;
  }

  async function saveRunRecord(t, rec, { gated=false }={}){
    const rel='runs/'+String(state.activeProject||'local')+'/'+String(t.id);
    const name=new Date().toISOString().replace(/[:.]/g,'-')+'.json';
    const text=JSON.stringify(rec.export());
    const tiers=[], errors=[]; let path=null;
    // rung 0 — OPFS. Always attempted; labelled by whether the browser promised to keep it.
    if(opfsAvailable()){
      try{ const b=await createOpfsBackend({ path:'anvil/'+rel }); const r=await createFileops({ backend:b }).write(name, text);
        if(r&&r.ok===false) throw new Error(r.error||'write failed');
        path='anvil/'+rel+'/'+name; tiers.push(opfsPersisted===true?'browser storage (persisted)':'browser storage (evictable)'); }
      catch(e){ errors.push('browser storage: '+(e&&e.message||e)); }
    }
    // rung 1 — the Anvil home on disk. Raw handles, not the agent-facing fs.
    if(homeHandle){
      try{ let d=homeHandle; for(const seg of rel.split('/')) d=await d.getDirectoryHandle(seg,{create:true});
        const fh=await d.getFileHandle(name,{create:true}); const w=await fh.createWritable(); await w.write(text); await w.close();
        tiers.push('home "'+homeHandle.name+'"'); }
      catch(e){ errors.push('home: '+(e&&e.message||e)); }
    }
    // rung 2 — the host store (Crate, or a host-side Folder), when NakliOS has one.
    // Same flat object store the workspace lives in, but under runs/ while the
    // agent is rooted at ws/<project> — pathguard refuses '..', so the agent cannot
    // reach it. This is what roams with the user's Crate; cross-device sync of it
    // is P1.5. Goes through the same CrateBackend the workspace uses.
    if(hostFsReady()){
      const which=String((nak.capabilities&&nak.capabilities.fsBackend)||'host');
      const tier = which==='crate' ? 'Crate' : 'host '+which;
      try{ const hx=createFileops({ backend:new CrateBackend(nak.fs), root:'' });
        try{ await hx.mkdir(rel); }catch(_){ /* object stores need no dirs */ }
        const r=await hx.write(rel+'/'+name, text); if(r&&r.ok===false) throw new Error(r.error||'write failed');
        tiers.push(tier); }
      catch(e){ errors.push(tier+': '+(e&&e.message||e)); }
    }
    // The index row — derived from the record, after the files are down.
    let count=null;
    try{ await runsPut(runIndexRow({ project:String(state.activeProject||'local'), task:String(t.id), name, path, tiers, rec, gated })); count=(await runsForTask(String(t.id))).length; }
    catch(e){ errors.push('index: '+(e&&e.message||e)); }
    return { path, name, tiers, errors, count };
  }

  // B2: gather run records for the history tool. OPFS is the readable tier in-tab
  // (rebuildRunIndex scans the same place). scope run = this task's newest record,
  // task = all of this task's records, project = every project's. The in-flight run
  // is not here until saveRunRecord writes it — you cannot grep a run that has not
  // finished, and the tool says so.

  // whatever the user had selected, so a task running in the background read another task's
  // records the moment someone clicked away (forward-pass NAF-07).

    const entries=[];
    try{
      let root=await navigator.storage.getDirectory();
      const runs=await (await root.getDirectoryHandle('anvil')).getDirectoryHandle('runs');
      for await (const [p,ph] of runs.entries()){ if(ph.kind!=='directory') continue;

  // shell call that IS the gate now says what it means. Pure, so the handlers test can drive it.

      ? '\n[gate] that command is this task\'s verify gate and it exited 0 — call task_done to finish; the gate runs once more on your behalf.'

  async function runTask(t, text){

      }

      if(nm==='skill_manage'){

      // an observation disproved (so it stops re-asserting a wrong note).
      if(nm==='revise'){
        const name=String((ar&&ar.name)||'').trim();
        const status=String((ar&&ar.status)||'').trim();

        if(status!=='verified' && status!=='retracted') return 'status must be "verified" or "retracted".';

          // back to hypothesis — the dependants keep their derived_from link as the audit trail.
          let demoted=[];

            for(const dn of dependantsOf(all, name)){

      // Each candidate = one model call (the variation operator) writing a solve(x);
      // fitness = pairs reproduced; keep+repair the best across generations.
      if(nm==='synthesize'){
        const goal=String((ar&&ar.goal)||''); const examples=Array.isArray(ar&&ar.examples)?ar.examples:[];

        const res=await runSynthesize({ goal, examples, popSize:(ar&&ar.popSize)||3, maxGen:(ar&&ar.maxGen)||3,
          onGen:({gen,bestScore})=>{ if(t){ t.log.push({k:'system',text:'synthesize gen '+gen+': best fitness '+Number(bestScore).toFixed(3)}); renderLog(); } } });

      // person-only activation are advisory (forward-pass NAF-01). skill_manage is the one door.
      if(['write','edit','apply_patch','edit_lines','remove','move'].includes(nm) && ar){

    if(!verifyCmd && __anvilTestOptIn){

      const rec = createRunRecorder({ app:'anvil', principal:'anvil:'+String(state.activeProject||'local') });

  // Tablet drawer (#left slides in over centre)
  function closeDrawer(){ const m=$('main'); if(m) m.classList.remove('drawer-open'); const sc=$('drawer-scrim'); if(sc) sc.classList.remove('open'); const db=$('drawer-btn'); if(db) db.setAttribute('aria-expanded','false'); }
  { const db=$('drawer-btn'); if(db) db.onclick=()=>{ const m=$('main'); const open=!m.classList.contains('drawer-open'); m.classList.toggle('drawer-open',open); const sc=$('drawer-scrim'); if(sc) sc.classList.toggle('open',open); db.setAttribute('aria-expanded',String(open)); if(open){ const l=$('left'); const f=l&&l.querySelector('.prow,.frow,button'); if(f) f.focus(); } }; }
  { const sc=$('drawer-scrim'); if(sc) sc.onclick=closeDrawer; }
  { const l=$('left'); if(l) l.addEventListener('click',(e)=>{ if(layoutMode==='tablet' && e.target.closest && e.target.closest('.frow,.task')) closeDrawer(); }); }
  // More sheet (the phone home for orphaned controls)
  function openSheet(){ renderSwitcher(); const s=$('sheet'); if(!s) return; s.classList.add('open');
    const mb=$('more-btn'); if(mb) mb.setAttribute('aria-expanded','true');
    const first=s.querySelector('.sheet-row'); if(first) first.focus(); }
  function closeSheet(){ const s=$('sheet'); if(!s||!s.classList.contains('open')) return; s.classList.remove('open');
    const mb=$('more-btn'); if(mb){ mb.setAttribute('aria-expanded','false'); mb.focus(); } }
  { const mb=$('more-btn'); if(mb) mb.onclick=openSheet; }
  { const s=$('sheet'); if(s) s.onclick=(e)=>{ if(e.target===s) closeSheet(); }; }
  document.addEventListener('keydown',(e)=>{ if(e.key!=='Escape') return; const sh=$('sheet'); if(sh&&sh.classList.contains('open')){ closeSheet(); return; } const mn=$('main'); if(mn&&mn.classList.contains('drawer-open')) closeDrawer(); });
  document.querySelectorAll('#sheet .sheet-row').forEach(row=> row.onclick=()=>{
    const a=row.dataset.act; closeSheet();
    const call=(id)=>{ const el=$(id); if(el&&el.onclick) el.onclick(); };
    if(a==='open-folder') call('open-folder');
    else if(a==='storage'){ openStorageInfo(); raise('preview'); }
    else if(a==='campaign') call('campaign-btn');
    else if(a==='memory'){ openProjectMemory(); raise('preview'); }
    else if(a==='skills'){ openSkills(); raise('preview'); }
    else if(a==='hooks'){ openHooks(); raise('preview'); }
    else if(a==='policy'){ openPolicy(); raise('preview'); }
    else if(a==='learn'){ if(typeof primeProject==='function') primeProject(); }
    else if(a==='home') call('home-chip');
  });
  applyLayout();   // set data-mode before the boot awaits so first paint is correct


  // ── boot ──
  // Keep the mode button's label AND its accessible name in sync with the current
  // mode (L2 — a screen reader should hear "Mode: plan", not a static "Cycle mode").
  function setModeBtn(m){ const b=$('mode-btn'); if(!b) return; b.textContent='Mode: '+m+' ▾'; b.setAttribute('aria-label','Mode: '+m+' — click to switch (code edits files · plan is read-only · ask only answers)'); b.classList.toggle('on', m!=='code'); }
  function syncMode(){ const t=activeTask(); setModeBtn((t&&t.mode)||'code'); }
  // Signal ready first so the host reports connected storage, then mount:
  // a remembered disk folder if still granted, else the host Folder/Crate, else OPFS.
  if(nak && nak.ready) nak.ready();
  await waitForFsCaps();
  // Roam: prefer the host-stored session (Crate/Folder) — brings projects, tasks,
  // and transcripts back on a new machine on the same backend.
  try{ const remote = await loadRemoteState(); if(remote){ state = remote; } }catch(_){}
  try{
    const saved = await idbGet(DIR_KEY);
    if(saved && typeof saved.queryPermission==='function'){
      const perm = await saved.queryPermission({mode:'readwrite'});
      if(perm==='granted'){ folderMode=true; mountWorkspace(new FsaBackend(saved), 'folder · '+saved.name); await seedIfEmpty(); }
    }
  }catch(_){}
  // The remembered home: query only (a re-grant needs a click); the chip says which.
  try{ const h=await idbGet(HOME_KEY); if(h&&typeof h.queryPermission==='function'){ homeSaved=true; if((await h.queryPermission({mode:'readwrite'}))==='granted') homeHandle=h; } }catch(_){}
  try{ if(navigator.storage&&navigator.storage.persisted) opfsPersisted=await navigator.storage.persisted(); }catch(_){}
  updateHomeChip();
  // Startup backfill: an empty index over existing record files rebuilds silently.
  try{ if((await runsCount())===0){ const r=await rebuildRunIndex(); if(r&&r.indexed) console.info('[anvil] run index rebuilt: '+r.indexed+' record(s)'+(r.broken?(', '+r.broken+' broken chain(s)'):'')+' — '+r.stopsLine); } }catch(_){}
  if(!folderMode) await mountProject(state.activeProject);
  renderAll(); syncMode();
  // AC-4: a queue entry recovered from a dead run is surfaced, never silently restored.
  if(runsInterrupted) pushSystem('↩︎ '+runsInterrupted+' task'+(runsInterrupted===1?' was':'s were')+' still running when Anvil last closed. '+(runsInterrupted===1?'It has':'They have')+' been reset — check the workspace before running again.');
  if(queueRecovered) pushSystem('↩︎ Recovered '+queueRecovered+' queued follow-up'+(queueRecovered===1?'':'s')+' that a previous session had started but never ran. '+(queueRecovered===1?'It is':'They are')+' back in the queue below.');
  if(queueDropped) pushSystem('⚠︎ Dropped '+queueDropped+' unreadable queue entr'+(queueDropped===1?'y':'ies')+' while loading.');
  // Stale previewOpen can restore to an empty Preview pane; on a phone that would
  // strand the user on a blank surface, so fall back to Chat when nothing rendered.
  if(layoutMode==='phone' && phoneSurface==='preview' && document.querySelector('#pv-body .pempty')) setSurface('chat');
  window.__anvilBoot.ok = true;   // the net above stands down

  // Seamlessly follow the host storage backend: when the user switches
  // browser/folder/crate elsewhere, remount this project's workspace on the new
  // backend and refresh the explorer — no reload, no prompt.
  if(nak && nak.onCapabilitiesChange){
    let lastBackend = (nak.capabilities||{}).fsBackend || null;
    nak.onCapabilitiesChange(async (caps)=>{
      updateScopeBtn();
      const nb = (caps||{}).fsBackend || null;
      if(nb===lastBackend || folderMode) return;
      lastBackend = nb;
      mountedProject = null;
      await mountProject(state.activeProject);
      renderAll();
    });
  }
</script>
